<svg xmlns="http://www.w3.org/2000/svg" width="720" height="650" viewBox="0 0 720 650">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ctx-fill: #dbeafe;
      --ctx-edge: #2563eb;
      --ctx-label: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ctx-fill: #1e3a5f;
        --ctx-edge: #60a5fa;
        --ctx-label: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel-bg { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .lane-label { fill: var(--title); }
    .lifeline { stroke: var(--edge); }
    .req-line { stroke: var(--ctx-edge); }
    .req-label { fill: var(--ctx-label); }
    .accent-line { stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
    .example-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--ctx-edge)" fill-rule="evenodd" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-edge)" fill-rule="evenodd" />
    </marker>
  </defs>

  <rect class="panel-bg" width="720" height="650" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Two request shapes, one CORS check
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    A safelisted request skips straight to the wire. Anything else asks first.
  </text>

  <g font-family="system-ui, sans-serif">
    <text class="lane-label" x="36" y="96" fill="#20242c" font-size="14" font-weight="700">Simple request: safelisted method and headers</text>
    <text class="muted" x="140" y="118" fill="#526173" font-size="12" font-weight="700" text-anchor="middle">Browser</text>
    <text class="muted" x="580" y="118" fill="#526173" font-size="12" font-weight="700" text-anchor="middle">Server</text>
    <line x1="140" y1="124" x2="140" y2="254" class="lifeline" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="580" y1="124" x2="580" y2="254" class="lifeline" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" />

    <text class="req-label" x="360" y="146" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle">GET /data, Origin: https://app.example.com</text>
    <line x1="140" y1="156" x2="580" y2="156" class="req-line" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />

    <text class="req-label" x="360" y="196" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle">200 OK, Access-Control-Allow-Origin if the server sent one</text>
    <line x1="580" y1="206" x2="140" y2="206" class="req-line" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />

    <text class="req-label" x="140" y="232" fill="#172554" font-size="11.5" text-anchor="middle">✓ header matches → JS can read it</text>
    <text class="accent-text" x="580" y="232" fill="#9a3412" font-size="11.5" text-anchor="middle">✗ missing/mismatched → CORS error</text>
    <text class="muted" x="360" y="252" fill="#526173" font-size="11">Either way, the request already ran server-side. CORS only gates whether JS may read the result.</text>
  </g>

  <g font-family="system-ui, sans-serif">
    <text class="lane-label" x="36" y="290" fill="#20242c" font-size="14" font-weight="700">Preflighted request: non-simple method or headers (e.g. PATCH + JSON)</text>
    <text class="muted" x="140" y="312" fill="#526173" font-size="12" font-weight="700" text-anchor="middle">Browser</text>
    <text class="muted" x="580" y="312" fill="#526173" font-size="12" font-weight="700" text-anchor="middle">Server</text>
    <line x1="140" y1="318" x2="140" y2="520" class="lifeline" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" />
    <line x1="580" y1="318" x2="580" y2="520" class="lifeline" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" />

    <text class="req-label" x="360" y="340" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">OPTIONS /data, Access-Control-Request-Method: PATCH, -Request-Headers: content-type</text>
    <line x1="140" y1="350" x2="580" y2="350" class="req-line" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />

    <text class="req-label" x="360" y="390" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">204 No Content, Allow-Origin / Allow-Methods / Allow-Headers all match</text>
    <line x1="580" y1="400" x2="140" y2="400" class="req-line" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
    <text class="muted" x="360" y="416" fill="#526173" font-size="10.5" text-anchor="middle">preflight credentials mode is always same-origin — no cookies here, even with credentials: "include"</text>

    <text class="accent-text" x="360" y="442" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" text-anchor="middle" font-weight="700">PATCH /data, the real request goes out</text>
    <line x1="140" y1="452" x2="580" y2="452" class="accent-line" stroke="#c2410c" stroke-width="2.2" marker-end="url(#arrow-accent)" />

    <text class="req-label" x="360" y="492" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">200 / 4xx / 5xx, needs its own Access-Control-Allow-Origin to be readable</text>
    <line x1="580" y1="502" x2="140" y2="502" class="req-line" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)" />
  </g>

  <g font-family="system-ui, sans-serif">
    <rect class="example-box" x="36" y="548" width="648" height="76" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="56" y="572" fill="#9a3412" font-size="13" font-weight="700">The preflight only asks permission</text>
    <text class="muted" x="56" y="592" fill="#526173" font-size="12">A successful preflight lets the browser send the real request. It doesn't make the response readable.</text>
    <text class="muted" x="56" y="610" fill="#526173" font-size="12">A `500` without CORS headers on that response still blocks JS from reading it, even though OPTIONS succeeded.</text>
  </g>
</svg>
