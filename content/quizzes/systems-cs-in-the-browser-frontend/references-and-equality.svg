<svg xmlns="http://www.w3.org/2000/svg" width="720" height="588" viewBox="0 0 720 588">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .edge-line { stroke: var(--edge); }
    .good-line { stroke: var(--good-edge); }
    .dead-line { stroke: var(--dead-text); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" />
    </marker>
    <marker id="arrow-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--good-edge)" />
    </marker>
  </defs>
  <rect class="panel" width="720" height="588" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Identity, sharing and hashing: three ways to ask "same?"</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Comparing a reference is one pointer test, fine until you hand it a fresh object every render.</text>
  <rect class="card" x="36" y="88" width="208" height="272" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="52" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Two literals, two addresses</text>
  <rect class="accent-box" x="52" y="134" width="74" height="34" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="89" y="156" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">{}</text>
  <path class="edge-line" d="M126,151 H160" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect class="card" x="164" y="134" width="62" height="34" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="195" y="156" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">0x1a</text>
  <rect class="accent-box" x="52" y="186" width="74" height="34" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="89" y="208" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">{}</text>
  <path class="edge-line" d="M126,203 H160" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect class="card" x="164" y="186" width="62" height="34" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="195" y="208" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">0x2b</text>
  <text class="accent-text" x="52" y="254" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">{} === {}</text>
  <text class="accent-text" x="132" y="254" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11">is false</text>
  <text class="good-text" x="52" y="274" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">2 === 2</text>
  <text class="good-text" x="132" y="274" fill="#14532d" font-family="system-ui, sans-serif" font-size="11">is true</text>
  <text class="muted" x="52" y="298" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Primitives compare by value;</text>
  <text class="muted" x="52" y="314" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">objects compare by address.</text>
  <rect class="card" x="256" y="88" width="208" height="272" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="272" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Structural sharing</text>
  <text class="muted" x="316" y="138" fill="#526173" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">old</text>
  <rect class="info-box" x="290" y="146" width="52" height="26" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="316" y="164" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">root</text>
  <text class="muted" x="404" y="138" fill="#526173" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">new</text>
  <rect class="good-box" x="378" y="146" width="52" height="26" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="404" y="164" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">root</text>
  <path class="dead-line" d="M316,172 L298,204" fill="none" stroke="#8a97a8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M316,172 L334,204" fill="none" stroke="#8a97a8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <rect class="info-box" x="276" y="204" width="44" height="26" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="298" y="222" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">a</text>
  <rect class="card" x="314" y="204" width="44" height="26" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="336" y="222" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">b</text>
  <path class="dead-line" d="M404,172 L386,204" fill="none" stroke="#8a97a8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M404,172 L422,204" fill="none" stroke="#8a97a8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  <rect class="good-box" x="364" y="204" width="44" height="26" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="386" y="222" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">a</text>
  <rect class="card" x="402" y="204" width="44" height="26" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="424" y="222" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">b</text>
  <path class="good-line" d="M356,244 H404" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)" marker-start="url(#arrow-good)" />
  <text class="good-text" x="361" y="262" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">same b, same reference</text>
  <text class="muted" x="272" y="288" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Update a and you get a new root and</text>
  <text class="muted" x="272" y="304" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">a new a. Everything untouched keeps</text>
  <text class="muted" x="272" y="320" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">its identity, so === skips whole subtrees.</text>
  <rect class="card" x="476" y="88" width="208" height="272" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="492" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Content hashing</text>
  <text class="muted" x="492" y="154" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">bytes A</text>
  <path class="edge-line" d="M556,150 H586" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect class="info-box" x="590" y="136" width="78" height="26" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="629" y="154" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">8f3b2c</text>
  <text class="muted" x="492" y="194" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">bytes A</text>
  <path class="edge-line" d="M556,190 H586" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect class="info-box" x="590" y="176" width="78" height="26" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="629" y="194" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">8f3b2c</text>
  <text class="muted" x="492" y="234" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">bytes B</text>
  <path class="edge-line" d="M556,230 H586" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect class="accent-box" x="590" y="216" width="78" height="26" rx="7" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="629" y="234" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">d41d0e</text>
  <text class="muted" x="492" y="276" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Same bytes, same fingerprint, as in</text>
  <text class="muted" x="492" y="292" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">app.8f3b2c.js, integrity="sha384-…"</text>
  <text class="muted" x="492" y="308" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">and a per-Question Content hash alike.</text>
  <text class="accent-text" x="492" y="328" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">Endless inputs, fixed-width digests:</text>
  <text class="accent-text" x="492" y="344" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">collisions must exist. Use SHA-256+.</text>
  <rect class="accent-box" x="36" y="384" width="316" height="176" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="54" y="410" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">A new reference on every render</text>
  <text class="accent-text" x="54" y="434" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">· style={{ margin: 0 }} and other inline objects</text>
  <text class="accent-text" x="54" y="452" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">· items={[]} and other inline arrays</text>
  <text class="accent-text" x="54" y="470" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">· onClick={() =&gt; …} and other inline functions</text>
  <text class="accent-text" x="54" y="488" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">· the result of .map, .filter or .sort</text>
  <text class="accent-text" x="54" y="506" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">· new Date(), new Set(), new Map()</text>
  <text class="accent-text" x="54" y="534" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">Each one busts React.memo's shallow compare and</text>
  <text class="accent-text" x="54" y="550" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">retriggers any useEffect that lists it as a dependency.</text>
  <rect class="info-box" x="368" y="384" width="316" height="176" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="386" y="410" fill="#172554" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Object.is is === with two repairs</text>
  <text class="info-text" x="386" y="436" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">NaN</text>
  <text class="info-text" x="440" y="436" fill="#172554" font-family="system-ui, sans-serif" font-size="11">=== says false</text>
  <text class="good-text" x="548" y="436" fill="#14532d" font-family="system-ui, sans-serif" font-size="11">Object.is says true</text>
  <text class="info-text" x="386" y="458" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">0, -0</text>
  <text class="info-text" x="440" y="458" fill="#172554" font-family="system-ui, sans-serif" font-size="11">=== says true</text>
  <text class="good-text" x="548" y="458" fill="#14532d" font-family="system-ui, sans-serif" font-size="11">Object.is says false</text>
  <text class="info-text" x="386" y="484" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">Everywhere else the two agree, and neither looks</text>
  <text class="info-text" x="386" y="500" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">inside an object. React compares with Object.is.</text>
  <text class="info-text" x="386" y="526" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">A shallow compare walks one level of keys; a deep</text>
  <text class="info-text" x="386" y="542" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">compare walks the whole graph and costs O(size).</text>
</svg>
