<svg xmlns="http://www.w3.org/2000/svg" width="720" height="562" viewBox="0 0 720 562">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .edge-line { stroke: var(--edge); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" />
    </marker>
  </defs>
  <rect class="panel" width="720" height="562" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Prepend one row, and the key decides what the user sees</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Two inputs are on screen and "hi" has been typed into the first. Lines show which DOM node survives where.</text>
  <rect class="card" x="36" y="88" width="316" height="260" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="accent-text" x="52" y="114" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">key={index}: matched by position</text>
  <text class="muted" x="52" y="140" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">before</text>
  <text class="muted" x="216" y="140" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">after</text>
  <rect class="info-box" x="52" y="156" width="100" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="66" y="178" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">A</text>
  <text class="info-text" x="142" y="178" fill="#172554" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">"hi"</text>
  <rect class="info-box" x="52" y="202" width="100" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="66" y="224" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">B</text>
  <rect class="accent-box" x="216" y="150" width="100" height="34" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="230" y="172" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">X</text>
  <text class="accent-text" x="306" y="172" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">"hi"</text>
  <rect class="info-box" x="216" y="196" width="100" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="230" y="218" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">A</text>
  <rect class="good-box" x="216" y="242" width="100" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="230" y="264" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">B</text>
  <path class="edge-line" d="M152,173 L216,167" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path class="edge-line" d="M152,219 L216,213" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <text class="muted" x="52" y="296" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Slot 0 already held an input, so React keeps that</text>
  <text class="muted" x="52" y="311" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">node and only swaps its props. The typed text</text>
  <text class="muted" x="52" y="326" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">stays behind in it, now labelled X. The extra</text>
  <text class="muted" x="52" y="341" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">node is mounted at the end.</text>
  <rect class="card" x="368" y="88" width="316" height="260" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="good-text" x="384" y="114" fill="#14532d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">key={item.id}: matched by identity</text>
  <text class="muted" x="384" y="140" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">before</text>
  <text class="muted" x="548" y="140" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">after</text>
  <rect class="info-box" x="384" y="156" width="100" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="398" y="178" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">A</text>
  <text class="info-text" x="474" y="178" fill="#172554" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">"hi"</text>
  <rect class="info-box" x="384" y="202" width="100" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="398" y="224" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">B</text>
  <rect class="good-box" x="548" y="150" width="100" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="562" y="172" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">X</text>
  <rect class="info-box" x="548" y="196" width="100" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="562" y="218" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">A</text>
  <text class="info-text" x="638" y="218" fill="#172554" font-family="system-ui, sans-serif" font-size="11" text-anchor="end">"hi"</text>
  <rect class="info-box" x="548" y="242" width="100" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="562" y="264" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">B</text>
  <path class="edge-line" d="M484,173 L548,213" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path class="edge-line" d="M484,219 L548,259" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <text class="muted" x="384" y="296" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">X is a key React has not seen, so one new node</text>
  <text class="muted" x="384" y="311" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">mounts at the top. A and B keep their own DOM</text>
  <text class="muted" x="384" y="326" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">nodes, their focus and their typed text, and are</text>
  <text class="muted" x="384" y="341" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">simply reordered.</text>
  <rect class="card" x="36" y="364" width="316" height="96" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="390" fill="#20242c" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Change the type and nothing is reused</text>
  <text class="accent-text" x="54" y="414" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">&lt;div&gt;  →  &lt;span&gt;</text>
  <text class="muted" x="180" y="414" fill="#526173" font-family="system-ui, sans-serif" font-size="11">at the same position</text>
  <text class="muted" x="54" y="436" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">React tears the whole old subtree down, DOM nodes,</text>
  <text class="muted" x="54" y="452" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">component instances and state, then mounts a new one.</text>
  <rect class="card" x="368" y="364" width="316" height="96" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="386" y="390" fill="#20242c" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">The two heuristics that buy O(n)</text>
  <text class="muted" x="386" y="414" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Elements of different types produce different trees.</text>
  <text class="muted" x="386" y="430" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Keys tell React which children are stable across</text>
  <text class="muted" x="386" y="446" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">renders. Both are assumptions, not proofs.</text>
  <rect class="info-box" x="36" y="476" width="648" height="62" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="54" y="500" fill="#172554" font-family="system-ui, sans-serif" font-size="11.5">The general tree-diff problem is about O(n³). React skips it: it compares two trees level by level, in one pass,</text>
  <text class="info-text" x="54" y="520" fill="#172554" font-family="system-ui, sans-serif" font-size="11.5">never matching a node to a different depth: O(n) work, at the cost of the smallest possible edit.</text>
</svg>
