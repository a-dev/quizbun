<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d5dce6;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c49;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .grid-line { stroke: var(--grid); }
  </style>
  <rect class="panel" width="720" height="620" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">The last response to arrive is not the last request you sent</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Two keystrokes, two requests. The slower one belongs to the older query, and it lands last.</text>
  <rect class="card" x="36" y="88" width="648" height="176" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Typing "rea", then "react"</text>
  <path class="grid-line" d="M168,130 V236" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="168" y="252" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">0</text>
  <path class="grid-line" d="M230,130 V236" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="230" y="252" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">1</text>
  <path class="grid-line" d="M292,130 V236" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="292" y="252" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">2</text>
  <path class="grid-line" d="M354,130 V236" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="354" y="252" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">3</text>
  <path class="grid-line" d="M416,130 V236" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="416" y="252" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">4</text>
  <path class="grid-line" d="M478,130 V236" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="478" y="252" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">5</text>
  <path class="grid-line" d="M540,130 V236" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="540" y="252" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">6</text>
  <path class="grid-line" d="M602,130 V236" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="602" y="252" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">7</text>
  <text class="dead-text" x="156" y="252" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="end">t =</text>
  <text class="muted" x="54" y="152" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">fetch("rea")</text>
  <rect class="accent-box" x="168" y="136" width="310" height="26" rx="7" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="323" y="154" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">in flight, arrives last</text>
  <text class="muted" x="54" y="190" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">fetch("react")</text>
  <rect class="good-box" x="230" y="174" width="124" height="26" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="292" y="192" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">arrives first</text>
  <text class="muted" x="54" y="228" fill="#526173" font-family="system-ui, sans-serif" font-size="11" font-weight="700">what the box shows</text>
  <rect class="good-box" x="354" y="212" width="124" height="24" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="416" y="229" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">results for react</text>
  <rect class="accent-box" x="478" y="212" width="124" height="24" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="540" y="229" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">results for rea</text>
  <rect class="info-box" x="36" y="280" width="208" height="216" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="52" y="306" fill="#172554" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Drop it on arrival</text>
  <text class="info-text" x="52" y="330" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">let ignore = false;</text>
  <text class="info-text" x="52" y="347" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">…then(r =&gt; !ignore &amp;&amp; set(r));</text>
  <text class="info-text" x="52" y="364" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">return () =&gt; { ignore = true; }</text>
  <text class="info-text" x="52" y="395" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">React runs the old effect's cleanup</text>
  <text class="info-text" x="52" y="411" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">before the new effect, so the late</text>
  <text class="info-text" x="52" y="427" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">response finds ignore = true and</text>
  <text class="info-text" x="52" y="443" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">is discarded. Nothing is cancelled,</text>
  <text class="info-text" x="52" y="459" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">the result is simply not used.</text>
  <rect class="info-box" x="256" y="280" width="208" height="216" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="272" y="306" fill="#172554" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Check the key</text>
  <text class="info-text" x="272" y="330" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">if (r.query === latestQuery)</text>
  <text class="info-text" x="272" y="347" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">  setResults(r.results);</text>
  <text class="info-text" x="272" y="378" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">Keep the query beside its response</text>
  <text class="info-text" x="272" y="394" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">and compare before committing.</text>
  <text class="info-text" x="272" y="410" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">Same effect, no cleanup needed,</text>
  <text class="info-text" x="272" y="426" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">and it works outside React too.</text>
  <text class="info-text" x="272" y="442" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">Requests still finish; they just lose.</text>
  <rect class="accent-box" x="476" y="280" width="208" height="216" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="492" y="306" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">AbortController</text>
  <text class="accent-text" x="492" y="330" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">controller.abort();</text>
  <text class="accent-text" x="492" y="347" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">// fetch rejects: AbortError</text>
  <text class="accent-text" x="492" y="378" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">Rejects the fetch promise and tells</text>
  <text class="accent-text" x="492" y="394" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">the browser to drop the connection.</text>
  <text class="accent-text" x="492" y="410" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">It does not un-send the request, and</text>
  <text class="accent-text" x="492" y="426" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">the server may already have done the</text>
  <text class="accent-text" x="492" y="442" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">work, so writes still need care.</text>
  <rect class="card" x="36" y="512" width="648" height="80" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="536" fill="#20242c" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Cancelling your interest is not cancelling the write</text>
  <text class="muted" x="54" y="558" fill="#526173" font-family="system-ui, sans-serif" font-size="11">A double-clicked Pay button plus a network retry can deliver the same POST twice. An idempotency key lets the server recognise</text>
  <text class="muted" x="54" y="574" fill="#526173" font-family="system-ui, sans-serif" font-size="11">the repeat and return the first result instead of charging again. The fix lives on the server, not in the abort call.</text>
</svg>
