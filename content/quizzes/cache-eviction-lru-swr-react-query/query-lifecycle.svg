<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ok-fill: #dcfce7;
      --ok-edge: #16a34a;
      --ok-text: #14532d;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ok-fill: #14321f;
        --ok-edge: #4ade80;
        --ok-text: #bbf7d0;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .ok-box { fill: var(--ok-fill); stroke: var(--ok-edge); }
    .ok-text { fill: var(--ok-text); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <rect class="panel" width="720" height="470" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    One query entry, two independent clocks
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    TanStack Query v5 defaults: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">staleTime: 0</tspan>, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gcTime: 5 * 60 * 1000</tspan>.
  </text>

  <g font-family="system-ui, sans-serif">
    <text class="title" x="36" y="102" fill="#20242c" font-size="13.5" font-weight="700"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">staleTime</tspan> — how long the data counts as fresh</text>

    <rect class="ok-box" x="36" y="112" width="170" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ok-text" x="121" y="136" fill="#14532d" font-size="14" font-weight="700" text-anchor="middle">FRESH</text>
    <text class="ok-text" x="121" y="154" fill="#14532d" font-size="11.5" text-anchor="middle">zero-width by default</text>

    <rect class="accent-box" x="214" y="112" width="470" height="54" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="449" y="136" fill="#9a3412" font-size="14" font-weight="700" text-anchor="middle">STALE</text>
    <text class="accent-text" x="449" y="154" fill="#9a3412" font-size="11.5" text-anchor="middle">the cached value still renders instantly — a background refetch is now allowed</text>

    <text class="title" x="36" y="204" fill="#20242c" font-size="13.5" font-weight="700"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">gcTime</tspan> — how long an inactive entry is kept in the cache</text>

    <rect class="card" x="36" y="214" width="330" height="54" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="201" y="238" fill="#20242c" font-size="14" font-weight="700" text-anchor="middle">ACTIVE — at least one mounted observer</text>
    <text class="muted" x="201" y="256" fill="#526173" font-size="11.5" text-anchor="middle">never garbage-collected, however stale it is</text>

    <rect class="card" x="374" y="214" width="310" height="54" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" />
    <text class="title" x="529" y="238" fill="#20242c" font-size="14" font-weight="700" text-anchor="middle">INACTIVE — last observer unmounted</text>
    <text class="muted" x="529" y="256" fill="#526173" font-size="11.5" text-anchor="middle">5 minutes later the entry is removed</text>

    <rect class="card" x="36" y="288" width="648" height="100" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="314" fill="#20242c" font-size="14" font-weight="700">What makes a stale query refetch, on defaults</text>

    <rect class="info-box" x="52" y="326" width="180" height="32" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="142" y="347" fill="#172554" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">refetchOnMount</text>
    <rect class="info-box" x="244" y="326" width="218" height="32" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="353" y="347" fill="#172554" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">refetchOnWindowFocus</text>
    <rect class="info-box" x="474" y="326" width="194" height="32" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="571" y="347" fill="#172554" font-size="12.5" font-weight="700" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">refetchOnReconnect</text>

    <text class="muted" x="52" y="378" fill="#526173" font-size="12">Another component merely reading the already-cached value is not one of them.</text>

    <rect class="accent-box" x="36" y="400" width="648" height="46" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="52" y="428" fill="#9a3412" font-size="13" font-weight="700">Stale is not deleted. That is why you see the old user instantly, and then a refresh.</text>
  </g>
</svg>
