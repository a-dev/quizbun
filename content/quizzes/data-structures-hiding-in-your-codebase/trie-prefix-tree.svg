<svg xmlns="http://www.w3.org/2000/svg" width="720" height="572" viewBox="0 0 720 572">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-text: #8a97a8;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-text: #6b7787;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .accent-line { stroke: var(--accent-edge); }
    .info-line { stroke: var(--info-edge); }
    .dead-line { stroke: var(--dead-text); }
  </style>
  <defs>
    <marker id="arrow-info" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--info-edge)" />
    </marker>
  </defs>
  <rect class="panel" width="720" height="572" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">A trie stores prefixes once and walks them a character at a time</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Four commands — cut, copy, code, commit — with every shared prefix sharing the nodes near the root.</text>
  <rect class="card" x="36" y="88" width="372" height="326" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="116" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Typing</text>
  <text class="accent-text" x="102" y="116" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">co</text>
  <text class="title" x="124" y="116" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" font-weight="700">walks two edges</text>
  <path class="accent-line" d="M90,214 L104,214" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M132,214 L146,148" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M174,148 L188,148" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="accent-line" d="M132,214 L146,290" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M174,290 L188,224" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M216,224 L230,224" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M174,290 L188,286" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M216,286 L230,286" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M174,290 L188,350" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M216,350 L230,350" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M258,350 L272,350" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M300,350 L314,350" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect class="accent-box" x="62" y="200" width="28" height="28" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="76" y="219" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">•</text>
  <rect class="accent-box" x="104" y="200" width="28" height="28" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="118" y="219" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">c</text>
  <rect class="card" x="146" y="134" width="28" height="28" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="muted" x="160" y="153" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">u</text>
  <rect class="good-box" x="188" y="134" width="28" height="28" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
  <text class="good-text" x="202" y="153" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">t</text>
  <rect class="accent-box" x="146" y="276" width="28" height="28" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="160" y="295" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">o</text>
  <rect class="card" x="188" y="210" width="28" height="28" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="muted" x="202" y="229" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">p</text>
  <rect class="good-box" x="230" y="210" width="28" height="28" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
  <text class="good-text" x="244" y="229" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">y</text>
  <rect class="card" x="188" y="272" width="28" height="28" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="muted" x="202" y="291" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">d</text>
  <rect class="good-box" x="230" y="272" width="28" height="28" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
  <text class="good-text" x="244" y="291" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">e</text>
  <rect class="card" x="188" y="336" width="28" height="28" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="muted" x="202" y="355" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">m</text>
  <rect class="card" x="230" y="336" width="28" height="28" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="muted" x="244" y="355" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">m</text>
  <rect class="card" x="272" y="336" width="28" height="28" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="muted" x="286" y="355" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">i</text>
  <rect class="good-box" x="314" y="336" width="28" height="28" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
  <text class="good-text" x="328" y="355" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">t</text>
  <text class="good-text" x="224" y="153" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">cut</text>
  <text class="good-text" x="266" y="229" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">copy</text>
  <text class="good-text" x="266" y="291" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">code</text>
  <text class="good-text" x="350" y="355" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">commit</text>
  <text class="muted" x="54" y="386" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Everything below the orange path is a completion. Green rings</text>
  <text class="muted" x="54" y="402" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">are word ends — “co” is a prefix of three, but no command itself.</text>
  <rect class="card" x="424" y="88" width="260" height="326" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="442" y="116" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Compress the chains</text>
  <text class="muted" x="442" y="156" fill="#526173" font-family="system-ui, sans-serif" font-size="11" font-weight="700">trie</text>
  <rect class="card" x="473" y="148" width="26" height="26" rx="13" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="486" y="166" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">o</text>
  <rect class="card" x="507" y="148" width="26" height="26" rx="13" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="520" y="166" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">m</text>
  <rect class="card" x="541" y="148" width="26" height="26" rx="13" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="554" y="166" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">m</text>
  <rect class="card" x="575" y="148" width="26" height="26" rx="13" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="588" y="166" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">i</text>
  <rect class="card" x="609" y="148" width="26" height="26" rx="13" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="622" y="166" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">t</text>
  <text class="muted" x="442" y="212" fill="#526173" font-family="system-ui, sans-serif" font-size="11" font-weight="700">radix</text>
  <rect class="card" x="473" y="198" width="26" height="26" rx="13" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="486" y="216" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">o</text>
  <path class="info-line" d="M501,211 H592" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-info)" />
  <text class="info-text" x="546" y="202" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">mmit</text>
  <rect class="good-box" x="596" y="198" width="26" height="26" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
  <text class="muted" x="442" y="252" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">An unbranching run of characters collapses into</text>
  <text class="muted" x="442" y="268" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">one edge. This is how HTTP routers match paths.</text>
  <rect class="accent-box" x="442" y="290" width="224" height="106" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="458" y="314" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12" font-weight="700">What it cannot do</text>
  <text class="accent-text" x="458" y="336" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11">Prefix queries only. Fuzzy, typo-</text>
  <text class="accent-text" x="458" y="352" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11">tolerant or substring matching is not</text>
  <text class="accent-text" x="458" y="368" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11">free — it needs a different structure</text>
  <text class="accent-text" x="458" y="384" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11">and different work per keystroke.</text>
  <rect class="card" x="36" y="430" width="648" height="118" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="456" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Why a palette with 50,000 commands still feels instant</text>
  <text class="muted" x="54" y="480" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">A lookup costs O(L) in the length of what has been typed, and nothing in the number of stored words. The alternative,</text>
  <text class="muted" x="54" y="498" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">list.filter(c =&gt; c.startsWith(q)), touches all 50,000 strings on every single keystroke.</text>
  <text class="muted" x="54" y="524" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">The price is space: a node per character per distinct prefix, plus child pointers, against one flat array of strings.</text>
  <text class="muted" x="54" y="540" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">Where they hide: typeaheads, command palettes, emoji pickers, and — as radix trees — URL path routing.</text>
</svg>
