<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-text: #8a97a8;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-text: #6b7787;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .accent-line { stroke: var(--accent-edge); }
    .info-line { stroke: var(--info-edge); }
    .dead-line { stroke: var(--dead-text); }
  </style>
  <defs>
    <marker id="arrow-info" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--info-edge)" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-edge)" />
    </marker>
  </defs>
  <rect class="panel" width="720" height="580" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">The DOM is a tree, and half your DOM API is a traversal</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">One document, two readings: the shape the source implies, and the path an event takes through it.</text>
  <rect class="card" x="36" y="88" width="316" height="332" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Document order is a pre-order DFS</text>
  <path class="dead-line" d="M194,154 L110,174" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M194,154 L262,174" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="accent-line" d="M262,198 L262,218" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="accent-line" d="M262,242 L206,262" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="accent-line" d="M206,286 L206,306" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M262,242 L318,262" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect class="card" x="162" y="130" width="64" height="24" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="194" y="147" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">body</text>
  <text class="info-text" x="156" y="147" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="end">1</text>
  <rect class="card" x="78" y="174" width="64" height="24" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="110" y="191" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">header</text>
  <text class="info-text" x="72" y="191" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="end">2</text>
  <text class="dead-text" x="110" y="210" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">leaf</text>
  <rect class="card" x="230" y="174" width="64" height="24" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="262" y="191" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">section</text>
  <text class="info-text" x="224" y="191" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="end">3</text>
  <rect class="card" x="230" y="218" width="64" height="24" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="262" y="235" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">ul</text>
  <text class="info-text" x="224" y="235" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="end">4</text>
  <rect class="card" x="174" y="262" width="64" height="24" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="206" y="279" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">li</text>
  <text class="info-text" x="168" y="279" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="end">5</text>
  <rect class="good-box" x="174" y="306" width="64" height="24" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="206" y="323" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">a</text>
  <text class="info-text" x="168" y="323" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="end">6</text>
  <text class="dead-text" x="206" y="342" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">leaf</text>
  <rect class="card" x="286" y="262" width="64" height="24" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="318" y="279" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">li</text>
  <text class="info-text" x="280" y="279" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="end">7</text>
  <text class="dead-text" x="318" y="298" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">leaf</text>
  <text class="accent-text" x="54" y="364" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">closest('section') starts at 6 and walks up</text>
  <text class="accent-text" x="54" y="380" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">5 → 4 → 3, stopping at the first match.</text>
  <text class="muted" x="54" y="402" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Those numbers are the order querySelectorAll</text>
  <text class="muted" x="54" y="416" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">returns; a queue walk gives level order instead.</text>
  <rect class="card" x="368" y="88" width="316" height="332" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="386" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">One event, three phases</text>
  <rect class="card" x="496" y="130" width="96" height="26" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="544" y="148" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">body</text>
  <rect class="card" x="496" y="170" width="96" height="26" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="544" y="188" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">section</text>
  <rect class="card" x="496" y="210" width="96" height="26" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="544" y="228" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">ul</text>
  <rect class="card" x="496" y="250" width="96" height="26" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="544" y="268" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">li</text>
  <rect class="good-box" x="496" y="290" width="96" height="26" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="544" y="308" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">a</text>
  <path class="info-line" d="M452,130 V316" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-info)" />
  <path class="accent-line" d="M634,316 V130" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-accent)" />
  <text class="info-text" x="444" y="216" fill="#172554" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="end">capture</text>
  <text class="accent-text" x="642" y="216" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" font-weight="700">bubble</text>
  <text class="good-text" x="544" y="338" fill="#14532d" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">target</text>
  <text class="muted" x="386" y="364" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Listeners run in the bubble phase unless</text>
  <text class="muted" x="386" y="380" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">{ capture: true } is set. stopPropagation()</text>
  <text class="muted" x="386" y="396" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">cuts the round trip short.</text>
  <rect class="card" x="36" y="436" width="648" height="120" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="462" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700">The vocabulary, mapped onto the document</text>
  <text class="muted" x="54" y="486" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">The root sits at depth 0. A leaf has no element children. Delegation puts one listener on an ancestor and reads</text>
  <text class="muted" x="54" y="504" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">event.target — where it started — while event.currentTarget is the element the listener is actually on.</text>
  <rect class="accent-box" x="54" y="516" width="612" height="30" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="70" y="536" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11">Not everything bubbles: focus, blur and mouseenter do not. Their bubbling cousins are focusin, focusout, mouseover.</text>
</svg>
