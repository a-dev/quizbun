<svg xmlns="http://www.w3.org/2000/svg" width="720" height="576" viewBox="0 0 720 576">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .dead-line { stroke: var(--dead-text); }
  </style>
  <rect class="panel" width="720" height="576" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">A min-heap is a complete tree, so it lives in a plain array</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Seven pending tasks keyed by urgency. Parent ≤ children is the only rule; siblings are unordered.</text>
  <rect class="card" x="36" y="88" width="316" height="300" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">The tree</text>
  <path class="dead-line" d="M194,166 L124,196" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M194,166 L264,196" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M124,232 L89,262" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M124,232 L159,262" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M264,232 L229,262" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M264,232 L299,262" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect class="good-box" x="176" y="130" width="36" height="36" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
  <text class="good-text" x="194" y="154" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">2</text>
  <text class="dead-text" x="218" y="152" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">i = 0</text>
  <rect class="card" x="106" y="196" width="36" height="36" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="124" y="220" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">5</text>
  <text class="dead-text" x="100" y="218" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="end">i = 1</text>
  <rect class="card" x="246" y="196" width="36" height="36" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="264" y="220" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">3</text>
  <text class="dead-text" x="240" y="218" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="end">i = 2</text>
  <rect class="card" x="71" y="262" width="36" height="36" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="89" y="286" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">9</text>
  <text class="dead-text" x="89" y="312" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">i = 3</text>
  <rect class="card" x="141" y="262" width="36" height="36" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="159" y="286" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">7</text>
  <text class="dead-text" x="159" y="312" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">i = 4</text>
  <rect class="card" x="211" y="262" width="36" height="36" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="229" y="286" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">8</text>
  <text class="dead-text" x="229" y="312" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">i = 5</text>
  <rect class="card" x="281" y="262" width="36" height="36" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="299" y="286" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">4</text>
  <text class="dead-text" x="299" y="312" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">i = 6</text>
  <text class="muted" x="54" y="340" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">The root is the minimum, so peek is O(1). Its two children,</text>
  <text class="muted" x="54" y="356" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">5 and 3, are larger but unordered relative to each other.</text>
  <text class="muted" x="54" y="372" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Finding any other value still means scanning everything.</text>
  <rect class="card" x="368" y="88" width="316" height="300" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="386" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">The same heap as one array</text>
  <rect class="good-box" x="386" y="132" width="38" height="38" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
  <text class="good-text" x="405" y="157" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">2</text>
  <text class="dead-text" x="405" y="186" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">0</text>
  <rect class="card" x="428" y="132" width="38" height="38" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="447" y="157" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">5</text>
  <text class="dead-text" x="447" y="186" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">1</text>
  <rect class="card" x="470" y="132" width="38" height="38" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="489" y="157" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">3</text>
  <text class="dead-text" x="489" y="186" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">2</text>
  <rect class="card" x="512" y="132" width="38" height="38" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="531" y="157" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">9</text>
  <text class="dead-text" x="531" y="186" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">3</text>
  <rect class="card" x="554" y="132" width="38" height="38" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="573" y="157" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">7</text>
  <text class="dead-text" x="573" y="186" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">4</text>
  <rect class="card" x="596" y="132" width="38" height="38" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="615" y="157" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">8</text>
  <text class="dead-text" x="615" y="186" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">5</text>
  <rect class="card" x="638" y="132" width="38" height="38" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="657" y="157" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">4</text>
  <text class="dead-text" x="657" y="186" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">6</text>
  <rect class="info-box" x="386" y="202" width="280" height="84" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="402" y="224" fill="#172554" font-family="system-ui, sans-serif" font-size="11.5">children of i</text>
  <text class="info-text" x="490" y="224" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">2i + 1  and  2i + 2</text>
  <text class="info-text" x="402" y="246" fill="#172554" font-family="system-ui, sans-serif" font-size="11.5">parent of i</text>
  <text class="info-text" x="490" y="246" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">(i − 1) &gt;&gt; 1</text>
  <text class="info-text" x="402" y="268" fill="#172554" font-family="system-ui, sans-serif" font-size="11.5">the minimum</text>
  <text class="info-text" x="490" y="268" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">index 0, always</text>
  <text class="muted" x="386" y="310" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">No node objects, no pointers, just arithmetic over one</text>
  <text class="muted" x="386" y="326" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">contiguous, cache-friendly array. Read it left to right and it</text>
  <text class="muted" x="386" y="342" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">is 2, 5, 3, 9, 7, 8, 4: partially ordered, never sorted.</text>
  <text class="muted" x="386" y="366" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">A sorted array would cost O(n) per insert to stay that way.</text>
  <rect class="card" x="36" y="404" width="316" height="148" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="430" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Insert 1: append, then sift up</text>
  <text class="accent-text" x="54" y="452" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">push to index 7</text>
  <text class="muted" x="178" y="452" fill="#526173" font-family="system-ui, sans-serif" font-size="11">under the 9</text>
  <text class="accent-text" x="54" y="474" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">1 &lt; 9 → swap</text>
  <text class="muted" x="178" y="474" fill="#526173" font-family="system-ui, sans-serif" font-size="11">now index 3</text>
  <text class="accent-text" x="54" y="496" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">1 &lt; 5 → swap</text>
  <text class="muted" x="178" y="496" fill="#526173" font-family="system-ui, sans-serif" font-size="11">now index 1</text>
  <text class="accent-text" x="54" y="518" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">1 &lt; 2 → swap</text>
  <text class="muted" x="178" y="518" fill="#526173" font-family="system-ui, sans-serif" font-size="11">now index 0, the new min</text>
  <text class="muted" x="54" y="542" fill="#526173" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Three swaps, exactly the height of the tree.</text>
  <rect class="card" x="368" y="404" width="316" height="148" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="386" y="430" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Height is ⌊log₂ n⌋, which is why it stays cheap</text>
  <text class="muted" x="386" y="456" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">n = 1,000</text>
  <text class="info-text" x="520" y="456" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">height 9</text>
  <text class="muted" x="386" y="480" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">n = 1,000,000</text>
  <text class="info-text" x="520" y="480" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">height 19</text>
  <text class="muted" x="386" y="502" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Doubling the task count adds at most one level.</text>
  <text class="muted" x="386" y="524" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">React's scheduler keeps pending work in a min-heap keyed</text>
  <text class="muted" x="386" y="540" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">by expiration time: peek O(1), push and pop O(log n).</text>
</svg>
