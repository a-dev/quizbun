<svg xmlns="http://www.w3.org/2000/svg" width="720" height="562" viewBox="0 0 720 562">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .edge-line { stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" fill-rule="evenodd" />
    </marker>
  </defs>

  <rect class="panel" width="720" height="562" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    One LRU cache, capacity 3
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    A hash map for O(1) lookup, a doubly linked list for O(1) recency.
  </text>

  <g fill="none" class="edge-line" stroke="#64748b" stroke-width="1.8" stroke-dasharray="4 4">
    <path d="M300,136 L300,164" marker-end="url(#arrow)" />
    <path d="M456,136 L456,164" marker-end="url(#arrow)" />
    <path d="M612,136 L612,164" marker-end="url(#arrow)" />
  </g>
  <g fill="none" class="edge-line" stroke="#64748b" stroke-width="2">
    <path d="M364,200 L392,200" marker-start="url(#arrow)" marker-end="url(#arrow)" />
    <path d="M520,200 L548,200" marker-start="url(#arrow)" marker-end="url(#arrow)" />
  </g>

  <g font-family="system-ui, sans-serif">
    <text class="title" x="36" y="120" fill="#20242c" font-size="13.5" font-weight="700">hash map</text>
    <text class="muted" x="36" y="137" fill="#526173" font-size="11.5">key → node reference</text>
    <text class="title" x="36" y="192" fill="#20242c" font-size="13.5" font-weight="700">doubly linked list</text>
    <text class="muted" x="36" y="209" fill="#526173" font-size="11.5">ordered by recency</text>

    <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <rect class="card" x="240" y="100" width="120" height="34" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <text class="title" x="300" y="122" fill="#20242c" font-size="13">"A"</text>
      <rect class="card" x="396" y="100" width="120" height="34" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <text class="title" x="456" y="122" fill="#20242c" font-size="13">"B"</text>
      <rect class="card" x="552" y="100" width="120" height="34" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <text class="title" x="612" y="122" fill="#20242c" font-size="13">"C"</text>

      <rect class="card" x="240" y="168" width="120" height="64" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="300" y="196" fill="#20242c" font-size="16" font-weight="700">A</text>
      <text class="muted" x="300" y="216" fill="#526173" font-size="12">value 1</text>
      <rect class="card" x="396" y="168" width="120" height="64" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="456" y="196" fill="#20242c" font-size="16" font-weight="700">B</text>
      <text class="muted" x="456" y="216" fill="#526173" font-size="12">value 2</text>
      <rect class="card" x="552" y="168" width="120" height="64" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="612" y="196" fill="#20242c" font-size="16" font-weight="700">C</text>
      <text class="muted" x="612" y="216" fill="#526173" font-size="12">value 3</text>
    </g>

    <g text-anchor="middle" font-size="11.5">
      <text class="accent-text" x="300" y="252" fill="#9a3412" font-weight="700">LRU end, evicted next</text>
      <text class="muted" x="612" y="252" fill="#526173" font-weight="700">MRU end, most recent</text>
    </g>

    <rect class="info-box" x="36" y="268" width="648" height="46" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="52" y="296" fill="#172554" font-size="13">O(1) splicing needs <tspan font-weight="700">both</tspan> links: from a node alone you can't reach its predecessor, so a singly linked list won't work.</text>
  </g>

  <g font-family="system-ui, sans-serif">
    <text class="title" x="36" y="348" fill="#20242c" font-size="15" font-weight="700">The sequence, step by step</text>
    <text class="muted" x="684" y="348" fill="#526173" font-size="11.5" text-anchor="end">list drawn LRU → MRU</text>

    <rect class="card" x="36" y="360" width="648" height="56" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="384" fill="#20242c" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">put('A',1); put('B',2); put('C',3)</text>
    <text class="muted" x="52" y="402" fill="#526173" font-size="11.5">three inserts, nothing evicted</text>

    <rect class="card" x="36" y="424" width="648" height="56" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="448" fill="#20242c" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">get('A')</text>
    <text class="muted" x="52" y="466" fill="#526173" font-size="11.5">a hit moves A to the MRU end</text>

    <rect class="card" x="36" y="488" width="648" height="56" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="512" fill="#20242c" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">put('D',4)</text>
    <text class="muted" x="52" y="530" fill="#526173" font-size="11.5">over capacity, LRU end goes</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-size="14" font-weight="700">
    <rect class="card" x="340" y="374" width="60" height="28" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="370" y="393" fill="#20242c">A</text>
    <rect class="card" x="408" y="374" width="60" height="28" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="438" y="393" fill="#20242c">B</text>
    <rect class="card" x="476" y="374" width="60" height="28" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="506" y="393" fill="#20242c">C</text>

    <rect class="card" x="340" y="438" width="60" height="28" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="370" y="457" fill="#20242c">B</text>
    <rect class="card" x="408" y="438" width="60" height="28" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="438" y="457" fill="#20242c">C</text>
    <rect class="info-box" x="476" y="438" width="60" height="28" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="506" y="457" fill="#172554">A</text>

    <rect class="card" x="340" y="502" width="60" height="28" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="370" y="521" fill="#20242c">C</text>
    <rect class="card" x="408" y="502" width="60" height="28" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="438" y="521" fill="#20242c">A</text>
    <rect class="info-box" x="476" y="502" width="60" height="28" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="506" y="521" fill="#172554">D</text>
    <rect class="accent-box" x="552" y="502" width="128" height="28" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="616" y="521" fill="#9a3412" font-size="12.5" font-family="system-ui, sans-serif">B evicted</text>
  </g>
</svg>
