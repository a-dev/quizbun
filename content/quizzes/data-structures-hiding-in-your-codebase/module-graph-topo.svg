<svg xmlns="http://www.w3.org/2000/svg" width="720" height="562" viewBox="0 0 720 562">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-fill: #e8ecf3;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-fill: #20262e;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .dead { fill: var(--dead-fill); stroke: var(--dead-text); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .edge-line { stroke: var(--edge); }
    .accent-line { stroke: var(--accent-edge); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-edge)" />
    </marker>
  </defs>
  <rect class="panel" width="720" height="562" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Your imports are a directed graph, and the emit order is a topological sort</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Every module must be defined before anything that imports it — which is exactly what the edges say.</text>
  <rect class="card" x="36" y="88" width="316" height="316" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">One legal order out of the graph</text>
  <rect class="card" x="112" y="136" width="116" height="30" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="170" y="156" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">app.js</text>
  <rect class="good-box" x="238" y="140" width="22" height="22" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="249" y="156" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">4</text>
  <rect class="card" x="112" y="190" width="116" height="30" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="170" y="210" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">api.js</text>
  <rect class="good-box" x="238" y="194" width="22" height="22" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="249" y="210" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">3</text>
  <rect class="card" x="112" y="244" width="116" height="30" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="170" y="264" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">utils.js</text>
  <rect class="good-box" x="238" y="248" width="22" height="22" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="249" y="264" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">2</text>
  <rect class="card" x="112" y="298" width="116" height="30" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="170" y="318" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">constants.js</text>
  <rect class="good-box" x="238" y="302" width="22" height="22" rx="11" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="249" y="318" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">1</text>
  <path class="edge-line" d="M170,166 V190" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path class="edge-line" d="M170,220 V244" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path class="edge-line" d="M170,274 V298" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <path class="edge-line" d="M112,151 H88 V259 H112" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <text class="muted" x="88" y="212" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">direct</text>
  <rect class="dead" x="268" y="136" width="74" height="30" rx="8" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1.5" stroke-dasharray="4 3" />
  <text class="dead-text" x="305" y="156" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">orphan.js</text>
  <text class="dead-text" x="305" y="180" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">unreachable</text>
  <text class="dead-text" x="305" y="192" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">from the entry</text>
  <text class="muted" x="54" y="348" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">app.js imports utils.js directly as well as through api.js.</text>
  <text class="muted" x="54" y="364" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Green badges are the emit order: dependencies first. Reverse</text>
  <text class="muted" x="54" y="380" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">the arrows for the “must run before” graph of a task runner.</text>
  <rect class="card" x="368" y="88" width="316" height="316" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="386" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">A cycle has no valid order at all</text>
  <rect class="accent-box" x="410" y="150" width="96" height="32" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="458" y="171" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">a.js</text>
  <rect class="accent-box" x="552" y="150" width="96" height="32" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="600" y="171" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">b.js</text>
  <path class="accent-line" d="M506,160 Q529,140 552,160" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-accent)" />
  <path class="accent-line" d="M552,174 Q529,194 506,174" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-accent)" />
  <text class="muted" x="386" y="216" fill="#526173" font-family="system-ui, sans-serif" font-size="11">a.js needs b.js defined first; b.js needs a.js. Neither can</text>
  <text class="muted" x="386" y="232" fill="#526173" font-family="system-ui, sans-serif" font-size="11">go first, so no ordering satisfies both edges — the graph</text>
  <text class="muted" x="386" y="248" fill="#526173" font-family="system-ui, sans-serif" font-size="11">is no longer acyclic, and no topological order exists.</text>
  <rect class="info-box" x="386" y="268" width="280" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="402" y="290" fill="#172554" font-family="system-ui, sans-serif" font-size="11">Both algorithms notice: Kahn’s stalls with</text>
  <text class="info-text" x="402" y="306" fill="#172554" font-family="system-ui, sans-serif" font-size="11">nodes left over, DFS meets a back edge.</text>
  <text class="muted" x="386" y="352" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Tree-shaking asks the other graph question — reachability.</text>
  <text class="muted" x="386" y="368" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Exports the entry can reach survive; orphan.js, which</text>
  <text class="muted" x="386" y="384" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">nothing imports, is dropped from the bundle.</text>
  <rect class="card" x="36" y="420" width="648" height="118" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="446" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Topological sort — two words, two standard implementations</text>
  <text class="muted" x="54" y="470" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">Kahn’s algorithm peels off nodes with no unmet dependency, one at a time. DFS reverse post-order emits a node once</text>
  <text class="muted" x="54" y="488" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">everything it depends on is placed, then reverses. Both detect cycles; neither needs the modules sorted by name.</text>
  <text class="muted" x="54" y="514" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">A DAG usually admits many valid orders — and every non-empty finite DAG has at least one node with no incoming edges,</text>
  <text class="muted" x="54" y="530" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">which is where you start. The same shape drives build tasks, spreadsheet recalculation and course prerequisites.</text>
</svg>
