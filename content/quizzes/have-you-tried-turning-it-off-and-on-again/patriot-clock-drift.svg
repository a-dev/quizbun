<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --card: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --grid: #d5dbe3;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --card: #242b36;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --grid: #333c49;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
      }
    }

    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .edge-fill { fill: var(--edge); }
    .grid { stroke: var(--grid); }
    .a { fill: var(--a); }
    .a-line { stroke: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
  </style>

  <rect class="panel" width="720" height="460" rx="20" fill="#f5f7fb" />
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="b" d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c" />
    </marker>
  </defs>
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">The Patriot's clock error grew with every hour it ran</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14" text-anchor="start">Timing error and range-gate shift by hours of continuous running (GAO figures)</text>
  <line class="grid" x1="90" y1="360.0" x2="660" y2="360.0" stroke="#d5dbe3" stroke-width="1" />
  <text class="muted" x="80" y="365.0" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">0.0 s</text>
  <line class="grid" x1="90" y1="297.5" x2="660" y2="297.5" stroke="#d5dbe3" stroke-width="1" />
  <text class="muted" x="80" y="302.5" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">0.1 s</text>
  <line class="grid" x1="90" y1="235.0" x2="660" y2="235.0" stroke="#d5dbe3" stroke-width="1" />
  <text class="muted" x="80" y="240.0" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">0.2 s</text>
  <line class="grid" x1="90" y1="172.5" x2="660" y2="172.5" stroke="#d5dbe3" stroke-width="1" />
  <text class="muted" x="80" y="177.5" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">0.3 s</text>
  <line class="grid" x1="90" y1="110.0" x2="660" y2="110.0" stroke="#d5dbe3" stroke-width="1" />
  <text class="muted" x="80" y="115.0" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">0.4 s</text>
  <text class="muted" x="90.0" y="382" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">0</text>
  <text class="muted" x="204.0" y="382" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">20</text>
  <text class="muted" x="318.0" y="382" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">40</text>
  <text class="muted" x="432.0" y="382" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">60</text>
  <text class="muted" x="546.0" y="382" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">80</text>
  <text class="muted" x="660.0" y="382" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">100</text>
  <text class="muted" x="375.0" y="404" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Hours since the system was last started</text>
  <line class="edge" x1="90" y1="360" x2="660" y2="360" stroke="#64748b" stroke-width="2" />
  <line class="edge" x1="90" y1="100" x2="90" y2="360" stroke="#64748b" stroke-width="2" />
  <path class="a-line" d="M 90.0 360.0 L 95.7 357.9 L 135.6 342.8 L 204.0 317.1 L 363.6 257.0 L 500.4 205.5 L 660.0 145.4" fill="none" stroke="#2563eb" stroke-width="3" />
  <circle class="a" cx="95.7" cy="357.9" r="4.5" fill="#2563eb" />
  <circle class="a" cx="135.6" cy="342.8" r="4.5" fill="#2563eb" />
  <circle class="a" cx="204.0" cy="317.1" r="4.5" fill="#2563eb" />
  <circle class="a" cx="363.6" cy="257.0" r="4.5" fill="#2563eb" />
  <circle class="a" cx="500.4" cy="205.5" r="4.5" fill="#2563eb" />
  <circle class="a" cx="660.0" cy="145.4" r="4.5" fill="#2563eb" />
  <text class="muted" x="212.0" y="335.1" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">137 m</text>
  <text class="muted" x="371.6" y="275.0" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">330 m</text>
  <text class="muted" x="508.4" y="223.5" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="start">494 m</text>
  <line class="b-line" x1="204.0" y1="150" x2="204.0" y2="360" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 5" />
  <text class="b" x="212.0" y="146" fill="#c2410c" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">About 20 h: the Scud falls</text>
  <text class="b" x="212.0" y="164" fill="#c2410c" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">outside the range gate</text>
  <rect class="b-soft" x="440" y="268" width="206" height="58" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="title" x="454" y="291" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Dhahran, over 100 h</text>
  <text class="title" x="454" y="313" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">0.34 s off, gate moved 687 m</text>
  <path class="b-line" d="M 630 268 L 657.0 155.4" fill="none" stroke="#c2410c" stroke-width="2" marker-end="url(#arr)" />
  <text class="muted" x="36" y="440" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">Labels on the line show how far the range gate moved. A reboot set the clock, and the error, back to zero.</text>
</svg>
