<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --card: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --grid: #d5dbe3;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --card: #242b36;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --grid: #333c49;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
      }
    }

    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .edge-fill { fill: var(--edge); }
    .grid { stroke: var(--grid); }
    .a { fill: var(--a); }
    .a-line { stroke: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
  </style>

  <rect class="panel" width="720" height="460" rx="20" fill="#f5f7fb" />
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="b" d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c" />
    </marker>
  </defs>
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">A signed 32-bit counter wraps from the top to the bottom</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14" text-anchor="start">In two's complement the values form a ring. One step past the largest is the most negative.</text>
  <circle class="edge" cx="210" cy="236" r="118" fill="none" stroke="#64748b" stroke-width="2" />
  <circle class="card" cx="210.0" cy="118.0" r="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="210.0" y="102.0" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="middle">0</text>
  <circle class="card" cx="165.8" cy="126.6" r="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="153.8" y="116.6" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="end">−1</text>
  <circle class="card" cx="254.2" cy="126.6" r="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="266.2" y="116.6" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="start">1</text>
  <circle class="card" cx="328.0" cy="236.0" r="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="muted" x="312.0" y="241.0" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">+1 billion</text>
  <circle class="card" cx="92.0" cy="236.0" r="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="muted" x="108.0" y="241.0" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">−1 billion</text>
  <circle class="a-soft" cx="238.5" cy="350.5" r="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="a" x="252.5" y="354.5" fill="#2563eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="start">2,147,483,647</text>
  <circle class="b-soft" cx="181.5" cy="350.5" r="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="b" x="167.5" y="354.5" fill="#c2410c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" text-anchor="end">−2,147,483,648</text>
  <path class="b-line" d="M 236.5 360.5 Q 210.0 398.0 185.5 362.5" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arr)" />
  <text class="b" x="210" y="404" fill="#c2410c" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">+1</text>
  <text class="muted" x="210" y="232" fill="#526173" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">2³² values</text>
  <text class="muted" x="210" y="252" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">on one ring</text>
  <rect class="card" x="400" y="112" width="284" height="246" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1" />
  <text class="title" x="418" y="140" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="start">Same 32 bits, read as signed</text>
  <text class="title" x="418" y="176" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="start">0000…0001</text>
  <text class="muted" x="666" y="176" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="end">1</text>
  <text class="title" x="418" y="210" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="start">0111…1111</text>
  <text class="a" x="666" y="210" fill="#2563eb" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="end">2,147,483,647</text>
  <text class="title" x="418" y="244" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="start">1000…0000</text>
  <text class="b" x="666" y="244" fill="#c2410c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="end">−2,147,483,648</text>
  <text class="title" x="418" y="278" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="start">1111…1111</text>
  <text class="muted" x="666" y="278" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" text-anchor="end">−1</text>
  <text class="muted" x="418" y="320" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">The first bit is the sign. Adding 1</text>
  <text class="muted" x="418" y="340" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">to 0111…1 carries into it and flips the sign.</text>
  <text class="muted" x="36" y="440" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">Only a few points are labelled. The ring holds every value in between.</text>
</svg>
