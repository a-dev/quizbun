  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">A counter that runs out of digits starts again at zero</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14" text-anchor="start">Add 1 to the largest value and every digit carries. The last carry has nowhere to go.</text>
