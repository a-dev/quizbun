  <text class="title" x="54" y="343" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" text-anchor="start">32 bits hold 2³² = 4,294,967,296 values, 0 to 4,294,967,295.</text>
  <text class="muted" x="54" y="364" fill="#526173" font-family="system-ui, sans-serif" font-size="14" text-anchor="start">4,294,967,296 ms ÷ 86,400,000 ms per day ≈ 49.7 days of uptime, then back to zero.</text>
