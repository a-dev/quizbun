<svg xmlns="http://www.w3.org/2000/svg" width="720" height="444" viewBox="0 0 720 444">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --edge: #64748b; --box: #ffffff;
      --guide: #94a3b8; --accent: #c2410c; --accent-fill: #ffedd5; --accent-text: #9a3412;
      --i1: #dbeafe; --s1: #2563eb; --i2: #dcfce7; --s2: #16a34a; --i3: #fef3c7; --s3: #d97706;
      --i4: #f3e8ff; --s4: #9333ea; --i5: #ffe4e6; --s5: #e11d48; --ink: #1e293b; --wide: #475569;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --edge: #8b9bb4; --box: #20262f;
        --guide: #64748b; --accent: #fb923c; --accent-fill: #3a2416; --accent-text: #fdba74;
        --i1: #1e3a5f; --s1: #60a5fa; --i2: #14532d; --s2: #4ade80; --i3: #4a3510; --s3: #fbbf24;
        --i4: #3b1f5c; --s4: #c084fc; --i5: #4c1d2a; --s5: #fb7185; --ink: #f1f5f9; --wide: #94a3b8;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .container { fill: var(--box); stroke: var(--edge); }
    .guide { stroke: var(--guide); }
    .cell { stroke: var(--guide); }
    .dim { stroke: var(--muted); }
    .accent { stroke: var(--accent); }
    .accent-text { fill: var(--accent-text); }
    .hole { fill: var(--accent-fill); stroke: var(--accent); }
    .ink { fill: var(--ink); }
    .wide { fill: var(--wide); }
    .it1 { fill: var(--i1); stroke: var(--s1); } .it2 { fill: var(--i2); stroke: var(--s2); }
    .it3 { fill: var(--i3); stroke: var(--s3); } .it4 { fill: var(--i4); stroke: var(--s4); }
    .it5 { fill: var(--i5); stroke: var(--s5); }
  </style>

  <rect class="panel" width="720" height="444" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Remove the min-content floor</text>

  <g>
    <text class="title" x="48" y="72" fill="#20242c" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14" font-weight="600">grid-template-columns: 1fr 1fr</text>
    <text class="muted" x="648" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">= minmax(auto, 1fr)</text>
    <rect class="container" x="48" y="84" width="600" height="90" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" />
    <rect class="it1" x="48" y="84" width="400" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="ink" x="248" y="162" fill="#1e293b" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">1</text>
    <rect class="it2" x="448" y="84" width="200" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ink" x="548" y="135" fill="#1e293b" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">2</text>
    <g><rect class="wide" x="54" y="92" width="388" height="32" rx="4" fill="#475569" opacity="0.85" />
    <text class="panel" x="64" y="113" fill="#f5f7fb" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600">400px child</text></g>
    <path class="dim" d="M48 190V202M48 196H448M448 190V202" fill="none" stroke="#526173" stroke-width="1.5" />
    <text class="muted" x="248" y="218" fill="#526173" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">400</text>
    <path class="dim" d="M448 190V202M448 196H648M648 190V202" fill="none" stroke="#526173" stroke-width="1.5" />
    <text class="muted" x="548" y="218" fill="#526173" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">200</text>
    <text class="title" x="48" y="262" fill="#20242c" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14" font-weight="600">grid-template-columns: repeat(2, minmax(0, 1fr))</text>
    <rect class="container" x="48" y="274" width="600" height="90" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" />
    <rect class="it1" x="48" y="274" width="300" height="90" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="ink" x="198" y="352" fill="#1e293b" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">1</text>
    <rect class="it2" x="348" y="274" width="300" height="90" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ink" x="498" y="325" fill="#1e293b" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">2</text>
    <g><rect class="wide" x="54" y="282" width="388" height="32" rx="4" fill="#475569" opacity="0.85" />
    <text class="panel" x="64" y="303" fill="#f5f7fb" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600">400px child</text></g>
    <path class="dim" d="M48 380V392M48 386H348M348 380V392" fill="none" stroke="#526173" stroke-width="1.5" />
    <text class="muted" x="198" y="408" fill="#526173" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">300</text>
    <path class="dim" d="M348 380V392M348 386H648M648 380V392" fill="none" stroke="#526173" stroke-width="1.5" />
    <text class="muted" x="498" y="408" fill="#526173" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">300</text>
  </g>
</svg>
