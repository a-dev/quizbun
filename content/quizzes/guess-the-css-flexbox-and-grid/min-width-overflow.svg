<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --edge: #64748b; --box: #ffffff;
      --guide: #94a3b8; --accent: #c2410c; --accent-fill: #ffedd5; --accent-text: #9a3412;
      --i1: #dbeafe; --s1: #2563eb; --i2: #dcfce7; --s2: #16a34a; --i3: #fef3c7; --s3: #d97706;
      --i4: #f3e8ff; --s4: #9333ea; --i5: #ffe4e6; --s5: #e11d48; --ink: #1e293b; --wide: #475569;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --edge: #8b9bb4; --box: #20262f;
        --guide: #64748b; --accent: #fb923c; --accent-fill: #3a2416; --accent-text: #fdba74;
        --i1: #1e3a5f; --s1: #60a5fa; --i2: #14532d; --s2: #4ade80; --i3: #4a3510; --s3: #fbbf24;
        --i4: #3b1f5c; --s4: #c084fc; --i5: #4c1d2a; --s5: #fb7185; --ink: #f1f5f9; --wide: #94a3b8;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .container { fill: var(--box); stroke: var(--edge); }
    .guide { stroke: var(--guide); }
    .cell { stroke: var(--guide); }
    .dim { stroke: var(--muted); }
    .accent { stroke: var(--accent); }
    .accent-text { fill: var(--accent-text); }
    .hole { fill: var(--accent-fill); stroke: var(--accent); }
    .ink { fill: var(--ink); }
    .wide { fill: var(--wide); }
    .it1 { fill: var(--i1); stroke: var(--s1); } .it2 { fill: var(--i2); stroke: var(--s2); }
    .it3 { fill: var(--i3); stroke: var(--s3); } .it4 { fill: var(--i4); stroke: var(--s4); }
    .it5 { fill: var(--i5); stroke: var(--s5); }
  </style>

  <rect class="panel" width="720" height="322" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Rendered result</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">The main column holds a 600px-wide child (a code block).</text>

  <g>
    <text class="title" x="48" y="92" fill="#20242c" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14" font-weight="600">.layout (600 wide)</text>
    <rect class="container" x="48" y="104" width="468" height="93.6" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" />
    <rect class="it1" x="48" y="104" width="156" height="78" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="ink" x="126" y="149" fill="#1e293b" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">sidebar</text>
    <rect class="it2" x="204" y="104" width="468" height="78" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ink" x="438" y="170" fill="#1e293b" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">main</text>
    <g><rect class="wide" x="210" y="112" width="456" height="23.2" rx="4" fill="#475569" opacity="0.85" />
    <text class="panel" x="220" y="128.6" fill="#f5f7fb" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="13" font-weight="600">600px child</text></g>
    <path class="dim" d="M48 213.6V225.6M48 219.6H204M204 213.6V225.6" fill="none" stroke="#526173" stroke-width="1.5" />
    <text class="muted" x="126" y="241.6" fill="#526173" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">200</text>
    <path class="dim" d="M204 213.6V225.6M204 219.6H672M672 213.6V225.6" fill="none" stroke="#526173" stroke-width="1.5" />
    <text class="muted" x="438" y="241.6" fill="#526173" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">600</text>
    <path class="accent" d="M516 255.60000000000002V267.6M516 261.6H672M672 255.60000000000002V267.6" fill="none" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="672" y="283.6" fill="#9a3412" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="end">200px outside the container</text>
  </g>
</svg>
