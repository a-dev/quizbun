<svg xmlns="http://www.w3.org/2000/svg" width="720" height="244" viewBox="0 0 720 244">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --edge: #64748b; --box: #ffffff;
      --guide: #94a3b8; --accent: #c2410c; --accent-fill: #ffedd5; --accent-text: #9a3412;
      --i1: #dbeafe; --s1: #2563eb; --i2: #dcfce7; --s2: #16a34a; --i3: #fef3c7; --s3: #d97706;
      --i4: #f3e8ff; --s4: #9333ea; --i5: #ffe4e6; --s5: #e11d48; --ink: #1e293b; --wide: #475569;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --edge: #8b9bb4; --box: #20262f;
        --guide: #64748b; --accent: #fb923c; --accent-fill: #3a2416; --accent-text: #fdba74;
        --i1: #1e3a5f; --s1: #60a5fa; --i2: #14532d; --s2: #4ade80; --i3: #4a3510; --s3: #fbbf24;
        --i4: #3b1f5c; --s4: #c084fc; --i5: #4c1d2a; --s5: #fb7185; --ink: #f1f5f9; --wide: #94a3b8;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .container { fill: var(--box); stroke: var(--edge); }
    .guide { stroke: var(--guide); }
    .cell { stroke: var(--guide); }
    .dim { stroke: var(--muted); }
    .accent { stroke: var(--accent); }
    .accent-text { fill: var(--accent-text); }
    .hole { fill: var(--accent-fill); stroke: var(--accent); }
    .ink { fill: var(--ink); }
    .wide { fill: var(--wide); }
    .it1 { fill: var(--i1); stroke: var(--s1); } .it2 { fill: var(--i2); stroke: var(--s2); }
    .it3 { fill: var(--i3); stroke: var(--s3); } .it4 { fill: var(--i4); stroke: var(--s4); }
    .it5 { fill: var(--i5); stroke: var(--s5); }
  </style>

  <rect class="panel" width="720" height="244" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Rendered result</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">A 600px toolbar. Items are 80px wide with 10px gaps.</text>

  <g>
    <text class="title" x="48" y="92" fill="#20242c" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14" font-weight="600">.toolbar</text>
    <rect class="container" x="48" y="104" width="600" height="60" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" />
    <rect class="it1" x="48" y="114" width="80" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="ink" x="88" y="140" fill="#1e293b" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">1</text>
    <rect class="it2" x="138" y="114" width="80" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ink" x="178" y="140" fill="#1e293b" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">2</text>
    <rect class="it3" x="228" y="114" width="80" height="40" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
    <text class="ink" x="268" y="140" fill="#1e293b" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">3</text>
    <rect class="it4" x="568" y="114" width="80" height="40" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" />
    <text class="ink" x="608" y="140" fill="#1e293b" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">4</text>
    <path class="accent" d="M128 180V192M128 186H138M138 180V192" fill="none" stroke="#c2410c" stroke-width="1.5" />
    <text class="accent-text" x="133" y="208" fill="#9a3412" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">10</text>
    <path class="accent" d="M218 180V192M218 186H228M228 180V192" fill="none" stroke="#c2410c" stroke-width="1.5" />
    <text class="accent-text" x="223" y="208" fill="#9a3412" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">10</text>
    <path class="accent" d="M308 180V192M308 186H568M568 180V192" fill="none" stroke="#c2410c" stroke-width="1.5" />
    <text class="accent-text" x="438" y="208" fill="#9a3412" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">260</text>
  </g>
</svg>
