<svg xmlns="http://www.w3.org/2000/svg" width="720" height="464" viewBox="0 0 720 464">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --edge: #64748b; --box: #ffffff;
      --guide: #94a3b8; --accent: #c2410c; --accent-fill: #ffedd5; --accent-text: #9a3412;
      --i1: #dbeafe; --s1: #2563eb; --i2: #dcfce7; --s2: #16a34a; --i3: #fef3c7; --s3: #d97706;
      --i4: #f3e8ff; --s4: #9333ea; --i5: #ffe4e6; --s5: #e11d48; --ink: #1e293b; --wide: #475569;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --edge: #8b9bb4; --box: #20262f;
        --guide: #64748b; --accent: #fb923c; --accent-fill: #3a2416; --accent-text: #fdba74;
        --i1: #1e3a5f; --s1: #60a5fa; --i2: #14532d; --s2: #4ade80; --i3: #4a3510; --s3: #fbbf24;
        --i4: #3b1f5c; --s4: #c084fc; --i5: #4c1d2a; --s5: #fb7185; --ink: #f1f5f9; --wide: #94a3b8;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .container { fill: var(--box); stroke: var(--edge); }
    .guide { stroke: var(--guide); }
    .cell { stroke: var(--guide); }
    .dim { stroke: var(--muted); }
    .accent { stroke: var(--accent); }
    .accent-text { fill: var(--accent-text); }
    .hole { fill: var(--accent-fill); stroke: var(--accent); }
    .ink { fill: var(--ink); }
    .wide { fill: var(--wide); }
    .it1 { fill: var(--i1); stroke: var(--s1); } .it2 { fill: var(--i2); stroke: var(--s2); }
    .it3 { fill: var(--i3); stroke: var(--s3); } .it4 { fill: var(--i4); stroke: var(--s4); }
    .it5 { fill: var(--i5); stroke: var(--s5); }
  </style>

  <rect class="panel" width="720" height="464" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">flex-grow shares free space, not total width</text>

  <g>
    <text class="title" x="48" y="72" fill="#20242c" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14" font-weight="600">A: flex: 1 1 auto · B: flex: 2 1 auto</text>
    <text class="muted" x="548" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">basis 100 + share of 300</text>
    <rect class="container" x="48" y="84" width="500" height="100" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" />
    <rect class="it1" x="48" y="84" width="200" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="ink" x="148" y="120" fill="#1e293b" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">A</text>
    <rect class="it2" x="248" y="84" width="300" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ink" x="398" y="120" fill="#1e293b" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">B</text>
    <path class="dim" d="M48 200V212M48 206H248M248 200V212" fill="none" stroke="#526173" stroke-width="1.5" />
    <text class="muted" x="148" y="228" fill="#526173" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">200</text>
    <path class="dim" d="M248 200V212M248 206H548M548 200V212" fill="none" stroke="#526173" stroke-width="1.5" />
    <text class="muted" x="398" y="228" fill="#526173" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">300</text>
    <text class="title" x="48" y="272" fill="#20242c" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14" font-weight="600">A: flex: 1 · B: flex: 2</text>
    <text class="muted" x="548" y="272" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">basis 0, so the ratio splits all 500px</text>
    <rect class="container" x="48" y="284" width="500" height="100" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5" />
    <rect class="it1" x="48" y="284" width="166.67" height="60" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="ink" x="131.34" y="320" fill="#1e293b" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">A</text>
    <rect class="it2" x="214.67" y="284" width="333.33" height="60" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ink" x="381.34" y="320" fill="#1e293b" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">B</text>
    <path class="dim" d="M48 400V412M48 406H214.67M214.67 400V412" fill="none" stroke="#526173" stroke-width="1.5" />
    <text class="muted" x="131.33" y="428" fill="#526173" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">166.67</text>
    <path class="dim" d="M214.67 400V412M214.67 406H548M548 400V412" fill="none" stroke="#526173" stroke-width="1.5" />
    <text class="muted" x="381.34" y="428" fill="#526173" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">333.33</text>
  </g>
</svg>
