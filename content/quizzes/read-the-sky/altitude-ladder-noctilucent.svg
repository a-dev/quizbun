<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" role="img" aria-labelledby="t d">
  <title id="t">Noctilucent clouds sit far above the layer where weather happens</title>
  <desc id="d">A height scale from the ground to ninety kilometres. Every cloud that rains, shades, or gusts lives in the lowest twelve kilometres. Airliners cruise just below that ceiling. Noctilucent clouds form near eighty kilometres, in air a hundred thousand times thinner, with no path back down to the surface.</desc>
<style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; --cloud:#d7dfec; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; --cloud:#39414f; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); }
    .grid { fill:none; stroke:var(--grid); } .blue { fill:none; stroke:var(--blue); }
    .teal { fill:none; stroke:var(--teal); } .orange { fill:none; stroke:var(--orange); }
    .cloud { fill:var(--cloud); stroke:var(--grid); }
  </style>
  <rect width="700" height="420" rx="20" fill="var(--bg)"/>
  <text x="28" y="34" font-size="19" font-weight="700">Two different skies</text>

  <path class="grid" d="M140 70v294M140 364h520" stroke-width="2.5"/>
  <text class="muted" x="54" y="82" font-size="13">90 km</text>
  <text class="muted" x="54" y="120" font-size="13">80 km</text>
  <text class="muted" x="54" y="330" font-size="13">12 km</text>
  <text class="muted" x="76" y="368" font-size="13">0</text>
  <path class="grid" d="M132 78h8M132 116h8M132 326h8" stroke-width="2"/>

  <path class="grid" d="M170 116q30-14 60-4M220 104q34-16 68-4M270 122q32-16 64-4M330 110q30-14 60-4" stroke-width="2.5" stroke-linecap="round"/>
  <text x="420" y="112" font-size="15" font-weight="700">noctilucent clouds</text>
  <text class="muted" x="420" y="132" font-size="13">ice on meteor dust, lit by a sun</text>
  <text class="muted" x="420" y="152" font-size="13">that has already set for you</text>

  <rect class="panel" x="152" y="326" width="500" height="36" rx="8"/>
  <path class="cloud" stroke-width="1.5" d="M176 356v-14q0-10 12-10t12 10v14zM212 356v-18q0-10 12-10t12 10v18zM248 356v-12q0-10 12-10t12 10v12z"/>
  <text x="420" y="344" font-size="15" font-weight="700">everything that is weather</text>
  <text class="muted" x="420" y="360" font-size="13">rain, storms, wind, shade</text>

  <path class="orange" d="M160 200v104" stroke-width="3" stroke-dasharray="8 6"/>
  <text class="muted" x="176" y="216" font-size="13">≈ 68 km of almost nothing in between</text>
  <text class="muted" x="176" y="236" font-size="13">air up there is a hundred thousand</text>
  <text class="muted" x="176" y="256" font-size="13">times thinner than at your feet</text>
</svg>
