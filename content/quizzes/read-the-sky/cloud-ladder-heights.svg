<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420" role="img" aria-labelledby="t d">
  <title id="t">The four stages of a warm front, by height</title>
  <desc id="d">A height scale from the ground to twelve kilometres. Cirrus and cirrostratus sit above six kilometres and are made of ice. Altostratus fills the middle levels between two and six kilometres. Nimbostratus sits below two kilometres and is the layer that rains.</desc>
<style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; --cloud:#d7dfec; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; --cloud:#39414f; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); }
    .grid { fill:none; stroke:var(--grid); } .blue { fill:none; stroke:var(--blue); }
    .teal { fill:none; stroke:var(--teal); } .orange { fill:none; stroke:var(--orange); }
    .cloud { fill:var(--cloud); stroke:var(--grid); }
  </style>
  <rect width="700" height="420" rx="20" fill="var(--bg)"/>
  <text x="28" y="34" font-size="19" font-weight="700">Same front, four floors down</text>

  <path class="grid" d="M104 62v302M104 364h560" stroke-width="2.5"/>
  <text class="muted" x="38" y="74" font-size="13">12 km</text>
  <text class="muted" x="44" y="173" font-size="13">8 km</text>
  <text class="muted" x="44" y="222" font-size="13">6 km</text>
  <text class="muted" x="44" y="320" font-size="13">2 km</text>
  <text class="muted" x="58" y="369" font-size="13">0</text>
  <path class="grid" d="M96 70h8M96 168h8M96 217h8M96 315h8" stroke-width="2"/>

  <path class="grid" d="M124 106q26-14 52-4M156 92q28-15 56-4M192 110q26-14 52-4" stroke-width="2.5" stroke-linecap="round"/>
  <text x="272" y="98" font-size="15" font-weight="700">cirrus</text>
  <text class="muted" x="272" y="118" font-size="13">ice, gives no rain, first to arrive</text>

  <rect class="cloud" x="122" y="186" width="128" height="16" rx="5" stroke-width="1.5"/>
  <text x="272" y="180" font-size="15" font-weight="700">cirrostratus</text>
  <text class="muted" x="272" y="200" font-size="13">thin ice veil, gives the 22° halo</text>

  <rect class="cloud" x="122" y="242" width="128" height="48" rx="6" stroke-width="1.5"/>
  <text x="272" y="252" font-size="15" font-weight="700">altostratus</text>
  <text class="muted" x="272" y="272" font-size="13">sun turns watery, rain in a few hours</text>

  <path class="cloud" stroke-width="1.5" d="M122 303h128v37a14 14 0 0 1-28 0 14 14 0 0 1-28 0 14 14 0 0 1-28 0 14 14 0 0 1-28 0 14 14 0 0 1-16 0z"/>
  <path class="blue" d="M140 356v8M166 352v12M192 356v8M218 352v12M244 356v8" stroke-width="2" stroke-linecap="round"/>
  <text x="272" y="326" font-size="15" font-weight="700">nimbostratus</text>
  <text class="muted" x="272" y="346" font-size="13">the layer that actually rains on you</text>

  <path class="orange" d="M664 104v220" stroke-width="3" stroke-dasharray="8 6"/>
  <path fill="var(--orange)" d="m656 318 8 20 8-20z"/>
  <text class="muted" x="664" y="94" font-size="13" text-anchor="middle">hours</text>
  <text class="muted" x="664" y="358" font-size="13" text-anchor="middle">pass</text>
</svg>
