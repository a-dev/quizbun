<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370" role="img" aria-labelledby="t d">
  <title id="t">Mammatus hang downward because the cloud air is sinking</title>
  <desc id="d">Ordinary cumulus bubbles push upward and their tops bulge up. Mammatus are the opposite: pockets of cloudy, ice-laden air sink out of the underside of an anvil into drier air beneath. Evaporation chills those pockets, which keeps them sinking, and their rounded bottoms are what you see from the ground.</desc>
<style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; --cloud:#d7dfec; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; --cloud:#39414f; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); }
    .grid { fill:none; stroke:var(--grid); } .blue { fill:none; stroke:var(--blue); }
    .teal { fill:none; stroke:var(--teal); } .orange { fill:none; stroke:var(--orange); }
    .cloud { fill:var(--cloud); stroke:var(--grid); }
  </style>
  <rect width="720" height="370" rx="20" fill="var(--bg)"/>
  <text x="28" y="34" font-size="19" font-weight="700">Bubbles pointing the wrong way</text>

  <g transform="translate(24 56)">
    <rect class="panel" width="318" height="282" rx="16"/>
    <text x="159" y="30" text-anchor="middle" font-size="15" font-weight="700">cumulus: air rising</text>
    <path class="cloud" stroke-width="2" d="M84 186H262v-24c-8-26-38-32-56-16-12-26-50-28-64-4-26 2-40 26-30 44z"/>
    <path class="blue" d="M100 244v-34M159 250v-40M218 244v-34" stroke-width="3"/>
    <path fill="var(--blue)" d="m92 216 8-16 8 16zM151 210l8-16 8 16zM210 216l8-16 8 16z"/>
    <text class="muted" x="159" y="274" text-anchor="middle" font-size="13">warm air pushes up, tops bulge up</text>
  </g>

  <g transform="translate(378 56)">
    <rect class="panel" width="318" height="282" rx="16"/>
    <text x="159" y="30" text-anchor="middle" font-size="15" font-weight="700">mammatus: air sinking</text>
    <path class="cloud" stroke-width="2" d="M48 56h222v56a22 22 0 0 1-44 0 22 22 0 0 1-44 0 22 22 0 0 1-44 0 22 22 0 0 1-44 0 22 22 0 0 1-46 0z"/>
    <path class="blue" d="M96 160v30M159 166v30M222 160v30" stroke-width="3"/>
    <path fill="var(--blue)" d="m88 184 8 16 8-16zM151 190l8 16 8-16zM214 184l8 16 8-16z"/>
    <text x="159" y="228" text-anchor="middle" font-size="13" font-weight="700">underside of the anvil</text>
    <text class="muted" x="159" y="252" text-anchor="middle" font-size="13">cloudy air drops into dry air,</text>
    <text class="muted" x="159" y="272" text-anchor="middle" font-size="13">evaporates, chills, keeps dropping</text>
  </g>
</svg>
