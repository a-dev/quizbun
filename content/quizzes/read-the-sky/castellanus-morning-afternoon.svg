<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
  <title id="t">Morning turrets are an instability reading taken at altitude</title>
  <desc id="d">Turrets sprouting from a mid-level cloud layer in the morning show that the air up there is already unstable, hours before the ground is warm enough to lift anything into it. When afternoon heating finally pushes bubbles that high, they meet the unstable layer and keep climbing, which is why storms so often follow.</desc>
<style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; --cloud:#d7dfec; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; --cloud:#39414f; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); }
    .grid { fill:none; stroke:var(--grid); } .blue { fill:none; stroke:var(--blue); }
    .teal { fill:none; stroke:var(--teal); } .orange { fill:none; stroke:var(--orange); }
    .cloud { fill:var(--cloud); stroke:var(--grid); }
  </style>
  <rect width="720" height="380" rx="20" fill="var(--bg)"/>
  <text x="28" y="34" font-size="19" font-weight="700">The morning sky is a free sounding</text>

  <g transform="translate(24 56)">
    <rect class="panel" width="318" height="292" rx="16"/>
    <text x="159" y="30" text-anchor="middle" font-size="15" font-weight="700">09:00</text>
    <path class="cloud" stroke-width="1.5" d="M44 132h230v20H44z"/>
    <path class="cloud" stroke-width="1.5" d="M62 132v-22a16 16 0 0 1 32 0v22zM122 132v-30a16 16 0 0 1 32 0v30zM186 132v-24a16 16 0 0 1 32 0v24zM240 132v-28a14 14 0 0 1 28 0v28z"/>
    <text class="muted" x="159" y="184" text-anchor="middle" font-size="13">little turrets sprouting upward</text>
    <text class="muted" x="159" y="206" text-anchor="middle" font-size="13">from a flat mid-level layer</text>
    <text x="159" y="238" text-anchor="middle" font-size="13" font-weight="700">the air at 4 km is already unstable</text>
    <path class="grid" d="M44 262h230" stroke-width="2"/>
    <text class="muted" x="159" y="282" text-anchor="middle" font-size="13">ground still cool</text>
  </g>

  <g transform="translate(378 56)">
    <rect class="panel" width="318" height="292" rx="16"/>
    <text x="159" y="30" text-anchor="middle" font-size="15" font-weight="700">15:00</text>
    <path class="cloud" stroke-width="2" d="M112 208V100c-16-10-10-32 8-34 4-20 30-28 44-14 16-14 42-6 46 14 18 2 24 24 8 34v108z"/>
    <path class="orange" d="m164 130-18 32h16l-12 28" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <text class="muted" x="159" y="236" text-anchor="middle" font-size="13">surface bubbles finally reach</text>
    <text class="muted" x="159" y="256" text-anchor="middle" font-size="13">that layer and keep climbing</text>
    <path class="grid" d="M44 208h230" stroke-width="2"/>
    <text class="muted" x="159" y="282" text-anchor="middle" font-size="13">ground hot</text>
  </g>
</svg>
