<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
  <title id="t">The anvil is the shape of a ceiling the storm cannot climb through</title>
  <desc id="d">A storm's updraft rises until it reaches the tropopause, where the air above stops cooling with height and becomes a stable lid. The updraft loses its buoyancy there, has nowhere left to go, and spreads sideways, drawn downwind by the strong winds at that level into the long flat anvil.</desc>
<style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; --cloud:#d7dfec; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; --cloud:#39414f; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); }
    .grid { fill:none; stroke:var(--grid); } .blue { fill:none; stroke:var(--blue); }
    .teal { fill:none; stroke:var(--teal); } .orange { fill:none; stroke:var(--orange); }
    .cloud { fill:var(--cloud); stroke:var(--grid); }
  </style>
  <rect width="760" height="400" rx="20" fill="var(--bg)"/>
  <text x="28" y="34" font-size="19" font-weight="700">The storm hits a ceiling and spreads out under it</text>

  <text x="56" y="76" font-size="14" font-weight="700" fill="var(--orange)">tropopause: above this the air stops getting colder, so nothing rises further</text>
  <path class="orange" d="M56 92h650" stroke-width="3" stroke-dasharray="9 6"/>

  <path class="cloud" stroke-width="2" d="M240 330V178c0-12 10-20 22-20h68c12 0 22 8 22 20v152z"/>
  <path class="cloud" stroke-width="2" d="M216 178c-8-52 36-76 88-76l300 2c26 0 28 20 4 26L328 184c-60 14-104 20-112-6z"/>

  <path class="blue" d="M296 314V150" stroke-width="4"/>
  <path fill="var(--blue)" d="m286 156 10-22 10 22z"/>
  <text class="muted" x="226" y="256" font-size="13" text-anchor="end">updraft</text>

  <path class="blue" d="M390 128h176" stroke-width="3"/>
  <path fill="var(--blue)" d="m558 120 22 8-22 8z"/>
  <text class="muted" x="478" y="206" font-size="13" text-anchor="middle">strong wind at this height drags the top downwind</text>

  <path class="grid" d="M40 330h680" stroke-width="2.5"/>
  <text x="592" y="264" font-size="14" font-weight="700" text-anchor="middle">the anvil points the way</text>
  <text x="592" y="286" font-size="14" font-weight="700" text-anchor="middle">the storm is heading</text>
</svg>
