<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="t d">
  <title id="t">Reading the front's progress from how much of the sun is left</title>
  <desc id="d">Three stages of the same approaching front. Under cirrostratus the sun is a sharp disc and objects still cast shadows. Under altostratus the sun is a pale watery blur and shadows disappear. Under nimbostratus the sun is gone and steady rain has arrived.</desc>
<style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; --cloud:#d7dfec; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; --cloud:#39414f; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); }
    .grid { fill:none; stroke:var(--grid); } .blue { fill:none; stroke:var(--blue); }
    .teal { fill:none; stroke:var(--teal); } .orange { fill:none; stroke:var(--orange); }
    .cloud { fill:var(--cloud); stroke:var(--grid); }
  </style>
  <rect width="760" height="330" rx="20" fill="var(--bg)"/>
  <text x="28" y="34" font-size="19" font-weight="700">The sun fades on a schedule</text>

  <g transform="translate(24 54)">
    <rect class="panel" width="228" height="250" rx="16"/>
    <text x="114" y="30" text-anchor="middle" font-size="15" font-weight="700">cirrostratus</text>
    <circle fill="var(--orange)" cx="114" cy="96" r="20"/>
    <circle class="grid" cx="114" cy="96" r="42" stroke-width="2" stroke-dasharray="5 5"/>
    <path class="grid" d="M40 178h148" stroke-width="2.5"/>
    <path class="grid" d="M96 178v-30" stroke-width="4" stroke-linecap="round"/>
    <path class="orange" d="M96 178 134 178" stroke-width="5" stroke-linecap="round"/>
    <text class="muted" x="114" y="208" text-anchor="middle" font-size="13">sharp disc, crisp shadow</text>
    <text class="muted" x="114" y="230" text-anchor="middle" font-size="13">rain still most of a day out</text>
  </g>

  <g transform="translate(266 54)">
    <rect class="panel" width="228" height="250" rx="16"/>
    <text x="114" y="30" text-anchor="middle" font-size="15" font-weight="700">altostratus</text>
    <circle fill="var(--orange)" cx="114" cy="96" r="20" opacity="0.45"/>
    <circle fill="var(--orange)" cx="114" cy="96" r="30" opacity="0.18"/>
    <path class="grid" d="M40 178h148" stroke-width="2.5"/>
    <path class="grid" d="M96 178v-30" stroke-width="4" stroke-linecap="round"/>
    <text class="muted" x="114" y="208" text-anchor="middle" font-size="13">watery blur, no shadow</text>
    <text class="muted" x="114" y="230" text-anchor="middle" font-size="13">rain in a few hours</text>
  </g>

  <g transform="translate(508 54)">
    <rect class="panel" width="228" height="250" rx="16"/>
    <text x="114" y="30" text-anchor="middle" font-size="15" font-weight="700">nimbostratus</text>
    <path class="cloud" stroke-width="1.5" d="M40 70h148v44q-19 13-37 0-18 13-37 0-18 13-37 0-19 13-37 0z"/>
    <path class="blue" d="M56 130v34M80 126v38M104 130v34M128 126v38M152 130v34M176 126v38" stroke-width="2" stroke-linecap="round"/>
    <path class="grid" d="M40 178h148" stroke-width="2.5"/>
    <text class="muted" x="114" y="208" text-anchor="middle" font-size="13">no sun at all</text>
    <text class="muted" x="114" y="230" text-anchor="middle" font-size="13">the rain is here</text>
  </g>
</svg>
