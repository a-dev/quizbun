<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350" role="img" aria-labelledby="t d">
  <title id="t">Estimating cloud base from temperature and dew point</title>
  <desc id="d">Rising unsaturated air cools about ten degrees Celsius per kilometre while its dew point falls only about two, so the gap between them closes at about eight degrees per kilometre. The two lines meet at cloud base, which works out at roughly a hundred and twenty-five metres of climb for each degree of surface spread.</desc>
<style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; --cloud:#d7dfec; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; --cloud:#39414f; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); }
    .grid { fill:none; stroke:var(--grid); } .blue { fill:none; stroke:var(--blue); }
    .teal { fill:none; stroke:var(--teal); } .orange { fill:none; stroke:var(--orange); }
    .cloud { fill:var(--cloud); stroke:var(--grid); }
  </style>
  <rect width="720" height="350" rx="20" fill="var(--bg)"/>
  <text x="28" y="34" font-size="19" font-weight="700">Cloud base, worked out on the ground</text>

  <path class="grid" d="M150 76v224M150 300h330" stroke-width="2.5"/>
  <text class="muted" x="86" y="90" font-size="13">height</text>

  <path class="orange" d="M420 300 270 100" stroke-width="3"/>
  <path class="blue" d="M300 300 270 100" stroke-width="3"/>
  <circle fill="var(--teal)" cx="270" cy="100" r="7"/>
  <path class="grid" d="M150 100h112" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="286" y="94" font-size="14" font-weight="700" fill="var(--teal)">they meet: cloud base</text>
  <text class="muted" x="158" y="120" font-size="13">≈ 1.5 km</text>

  <path class="teal" d="M300 288h120" stroke-width="2.5"/>
  <path class="teal" d="M300 282v12M420 282v12" stroke-width="2.5"/>
  <text class="muted" x="360" y="278" text-anchor="middle" font-size="13">spread 12 °C</text>
  <text class="muted" x="296" y="320" text-anchor="end" font-size="13">dew point 15 °C</text>
  <text class="muted" x="424" y="320" font-size="13">air 27 °C</text>

  <g transform="translate(496 80)">
    <rect class="panel" width="196" height="180" rx="16"/>
    <text x="20" y="36" font-size="13">air cools ≈ 10 °C / km</text>
    <text x="20" y="62" font-size="13">dew point falls ≈ 2 °C / km</text>
    <path class="grid" d="M20 80h156" stroke-width="2"/>
    <text x="20" y="108" font-size="13" font-weight="700">gap closes ≈ 8 °C / km</text>
    <text x="20" y="142" font-size="13" font-weight="700" fill="var(--orange)">≈ 125 m of climb</text>
    <text x="20" y="164" font-size="13" font-weight="700" fill="var(--orange)">per 1 °C of spread</text>
  </g>
</svg>
