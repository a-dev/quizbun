<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="t d">
  <title id="t">The warm-front cloud sequence arrives in order, hours apart</title>
  <desc id="d">A cross-section through an approaching warm front. Warm air slides up a shallow wedge of cold air, so the cloud deck thickens and lowers from thin cirrus at the leading edge to nimbostratus and steady rain at the front itself. An observer under the cirrus is still most of a day away from the rain.</desc>
<style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; --cloud:#d7dfec; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; --cloud:#39414f; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); }
    .grid { fill:none; stroke:var(--grid); } .blue { fill:none; stroke:var(--blue); }
    .teal { fill:none; stroke:var(--teal); } .orange { fill:none; stroke:var(--orange); }
    .cloud { fill:var(--cloud); stroke:var(--grid); }
  </style>
  <rect width="760" height="400" rx="20" fill="var(--bg)"/>
  <text x="28" y="34" font-size="19" font-weight="700">The sky lowers and thickens as the rain gets closer</text>

  <path class="orange" d="M300 62h116" stroke-width="3" stroke-linecap="round"/>
  <path fill="var(--orange)" d="m412 54 18 8-18 8z"/>
  <text class="muted" x="300" y="50" font-size="13">the whole system slides this way, roughly 40 km/h</text>

  <path class="grid" d="M74 336 L720 122" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text class="muted" x="286" y="316" font-size="13">cold air, wedge-shaped</text>
  <text class="muted" x="300" y="106" font-size="13">warm air sliding up over it</text>

  <g class="cloud" stroke-width="1.5">
    <path d="M60 166h164v102a16 16 0 0 1-32 0 16 16 0 0 1-32 0 16 16 0 0 1-32 0 16 16 0 0 1-32 0 16 16 0 0 1-36 0z"/>
    <path d="M244 150h162v54H244z"/>
    <path d="M424 124h140v22H424z"/>
  </g>
  <path class="blue" d="M86 288v48M114 282v54M142 288v48M170 282v54M198 288v48" stroke-width="2" stroke-linecap="round"/>

  <path class="grid" d="M582 116q24-13 48-4M600 102q28-15 56-4M626 124q26-14 52-4M652 108q24-13 48-4" stroke-width="2.5" stroke-linecap="round"/>

  <path class="grid" d="M30 336h700" stroke-width="2.5"/>
  <circle fill="var(--orange)" cx="690" cy="322" r="7"/>
  <path class="orange" d="M690 329v14" stroke-width="3" stroke-linecap="round"/>

  <text class="muted" x="640" y="152" font-size="13" text-anchor="middle">cirrus</text>
  <text class="muted" x="494" y="168" font-size="13" text-anchor="middle">cirrostratus</text>
  <text class="muted" x="325" y="226" font-size="13" text-anchor="middle">altostratus</text>
  <text class="muted" x="142" y="152" font-size="13" text-anchor="middle">nimbostratus</text>

  <text x="690" y="368" font-size="13" text-anchor="middle" font-weight="700">you, now</text>
  <text x="494" y="368" font-size="13" text-anchor="middle" font-weight="700">+6 h</text>
  <text x="325" y="368" font-size="13" text-anchor="middle" font-weight="700">+12 h</text>
  <text x="142" y="368" font-size="13" text-anchor="middle" font-weight="700">+20 h: rain</text>
</svg>
