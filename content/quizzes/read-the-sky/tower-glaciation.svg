<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390" role="img" aria-labelledby="t d">
  <title id="t">A hard top means water drops, a soft top means ice</title>
  <desc id="d">Two towers side by side. The first has a crisp cauliflower outline because it is still made of liquid droplets, and it produces no lightning. The second has frozen at the top, which blurs the outline into fibrous strands and lets colliding ice particles separate charge, so it can produce lightning.</desc>
<style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; --cloud:#d7dfec; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; --cloud:#39414f; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); }
    .grid { fill:none; stroke:var(--grid); } .blue { fill:none; stroke:var(--blue); }
    .teal { fill:none; stroke:var(--teal); } .orange { fill:none; stroke:var(--orange); }
    .cloud { fill:var(--cloud); stroke:var(--grid); }
  </style>
  <rect width="720" height="390" rx="20" fill="var(--bg)"/>
  <text x="28" y="34" font-size="19" font-weight="700">The edge of the top tells you what it is made of</text>

  <g transform="translate(24 56)">
    <rect class="panel" width="330" height="300" rx="16"/>
    <text x="165" y="30" text-anchor="middle" font-size="15" font-weight="700">cumulus congestus</text>
    <path class="cloud" stroke-width="2" d="M110 246v-72c-22-8-24-36-4-46 2-26 30-38 50-24 14-22 48-20 58 4 24-2 40 22 30 42 14 14 6 40-14 44v52z"/>
    <path class="grid" d="M74 246h182" stroke-width="2"/>
    <text class="muted" x="165" y="272" text-anchor="middle" font-size="13">sharp cauliflower edge, still liquid</text>
    <text x="165" y="294" text-anchor="middle" font-size="13" font-weight="700">no lightning yet</text>
  </g>

  <g transform="translate(366 56)">
    <rect class="panel" width="330" height="300" rx="16"/>
    <text x="165" y="30" text-anchor="middle" font-size="15" font-weight="700">cumulonimbus</text>
    <path fill="var(--cloud)" d="M118 246v-130h94v130z"/>
    <path class="grid" d="M118 246V116M212 246V116" stroke-width="2"/>
    <path class="grid" d="M80 130q34-18 68-4M116 114q36-18 72-4M92 102q30-16 60-4M150 128q34-18 68-4M178 110q30-16 60-4" stroke-width="2.5" stroke-linecap="round"/>
    <path class="orange" d="m172 152-22 38h20l-16 32" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <path class="grid" d="M74 246h182" stroke-width="2"/>
    <text class="muted" x="165" y="272" text-anchor="middle" font-size="13">top frozen, edge gone fibrous</text>
    <text x="165" y="294" text-anchor="middle" font-size="13" font-weight="700">colliding ice separates charge</text>
  </g>
</svg>
