<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="t d">
  <title id="t">Why the ring around the sun sits 22 degrees out</title>
  <desc id="d">A ray of sunlight enters one side face of a hexagonal ice crystal and leaves through a face 60 degrees around, bending twice. However the crystal is turned, it cannot bend the ray by less than about 22 degrees, so light piles up at that angle and draws a ring 22 degrees from the sun.</desc>
<style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; --cloud:#d7dfec; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; --cloud:#39414f; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); }
    .grid { fill:none; stroke:var(--grid); } .blue { fill:none; stroke:var(--blue); }
    .teal { fill:none; stroke:var(--teal); } .orange { fill:none; stroke:var(--orange); }
    .cloud { fill:var(--cloud); stroke:var(--grid); }
  </style>
  <rect width="760" height="380" rx="20" fill="var(--bg)"/>
  <text x="28" y="34" font-size="19" font-weight="700">A hexagonal prism cannot bend light by less than 22°</text>

  <g transform="translate(24 56)">
    <rect class="panel" width="396" height="300" rx="16"/>
    <text class="muted" x="198" y="28" text-anchor="middle" font-size="13">one ice crystal, seen end-on</text>
    <path class="teal" d="M250 140 211 207 133 207 94 140 133 73 211 73z" stroke-width="3"/>
    <path class="orange" d="M26 96 116 140" stroke-width="3"/>
    <path fill="var(--orange)" d="m78 114 22 10-20 9z"/>
    <path class="orange" d="M116 140 230 186" stroke-width="3"/>
    <path class="orange" d="M230 186 336 262" stroke-width="3"/>
    <path fill="var(--orange)" d="m316 240 26 26-34-8z"/>
    <path class="grid" d="M230 186 356 234" stroke-width="2" stroke-dasharray="6 5"/>
    <path class="orange" d="M310 210a92 92 0 0 1 12 24" stroke-width="2"/>
    <text x="338" y="254" font-size="16" font-weight="700" fill="var(--orange)">22°</text>
    <text class="muted" x="26" y="86" font-size="13">sunlight in</text>
    <text class="muted" x="278" y="200" font-size="13">straight on</text>
  </g>

  <g transform="translate(436 56)">
    <rect class="panel" width="300" height="300" rx="16"/>
    <text class="muted" x="150" y="28" text-anchor="middle" font-size="13">what you see from the ground</text>
    <circle fill="var(--orange)" cx="150" cy="170" r="15"/>
    <circle class="grid" cx="150" cy="170" r="96" stroke-width="2.5" stroke-dasharray="7 6"/>
    <path class="blue" d="M150 170 246 170" stroke-width="2.5"/>
    <text x="176" y="162" font-size="14" font-weight="700">22°</text>
    <text class="muted" x="150" y="288" text-anchor="middle" font-size="13">every crystal at that angle glows</text>
  </g>
</svg>
