<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
  <title id="t">Rain that stops in mid-air is cooling the air it falls through</title>
  <desc id="d">Drops falling out of a cloud into a dry layer evaporate before they reach the ground. Evaporation takes heat from the air around them, which makes that air denser than its surroundings, so it accelerates downward and spreads out as a gust when it lands, even though no rain arrives.</desc>
<style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; --cloud:#d7dfec; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; --cloud:#39414f; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); }
    .grid { fill:none; stroke:var(--grid); } .blue { fill:none; stroke:var(--blue); }
    .teal { fill:none; stroke:var(--teal); } .orange { fill:none; stroke:var(--orange); }
    .cloud { fill:var(--cloud); stroke:var(--grid); }
  </style>
  <rect width="720" height="380" rx="20" fill="var(--bg)"/>
  <text x="28" y="34" font-size="19" font-weight="700">No rain reaches you, but something else does</text>

  <path class="cloud" stroke-width="2" d="M120 66h420v50H120z"/>
  <text class="muted" x="330" y="98" text-anchor="middle" font-size="14" font-weight="700">cloud base</text>

  <path class="blue" d="M180 124q6 42 0 68M240 124q-6 46 0 76M300 124q6 44 0 72M360 124q-6 48 0 80M420 124q6 42 0 70M480 124q-6 46 0 74" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path class="blue" d="M180 198v14M240 206v12M300 202v14M360 210v12M420 200v14M480 204v12" stroke-width="3" opacity="0.3" stroke-linecap="round"/>

  <path class="orange" d="M108 234h504" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="108" y="258" font-size="14" font-weight="700" fill="var(--orange)">the drops run out here — dry air below</text>

  <path class="teal" d="M330 272v50" stroke-width="4"/>
  <path fill="var(--teal)" d="m320 318 10 20 10-20z"/>
  <text class="muted" x="352" y="298" font-size="13">chilled air, now denser, falls faster</text>

  <path class="grid" d="M40 338h640" stroke-width="2.5"/>
  <path class="teal" d="M318 330H212M342 330h106" stroke-width="3"/>
  <path fill="var(--teal)" d="m216 322-22 8 22 8zM444 322l22 8-22 8z"/>
  <text class="muted" x="360" y="364" text-anchor="middle" font-size="13">it lands and spreads out as a sudden dry gust</text>
</svg>
