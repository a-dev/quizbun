<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
  <title id="t">A contrail is a humidity gauge for the air at cruise height</title>
  <desc id="d">Two panels. In dry air the ice crystals of a contrail evaporate within seconds, leaving only a short stub behind the aircraft. In air already holding more water vapour than ice can tolerate, the crystals grow instead, so the trail widens with age into a broad band that is still there an hour later.</desc>
<style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; --cloud:#d7dfec; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; --cloud:#39414f; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); }
    .grid { fill:none; stroke:var(--grid); } .blue { fill:none; stroke:var(--blue); }
    .teal { fill:none; stroke:var(--teal); } .orange { fill:none; stroke:var(--orange); }
    .cloud { fill:var(--cloud); stroke:var(--grid); }
  </style>
  <rect width="720" height="340" rx="20" fill="var(--bg)"/>
  <text x="28" y="34" font-size="19" font-weight="700">Same aircraft, two kinds of air</text>

  <g transform="translate(24 54)">
    <rect class="panel" width="330" height="262" rx="16"/>
    <text x="165" y="30" text-anchor="middle" font-size="15" font-weight="700">dry air aloft</text>
    <path class="grid" d="M222 120h36" stroke-width="7" stroke-linecap="round"/>
    <path class="grid" d="M196 120h18" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
    <path fill="var(--blue)" d="m266 110 34 10-34 10 9-10z"/>
    <text class="muted" x="86" y="124" font-size="13">nothing left back here</text>
    <text class="muted" x="165" y="180" text-anchor="middle" font-size="13">crystals evaporate in seconds</text>
    <text class="muted" x="165" y="202" text-anchor="middle" font-size="13">a short stub, then clear sky</text>
    <text x="165" y="232" text-anchor="middle" font-size="14" font-weight="700">nothing is on its way</text>
  </g>

  <g transform="translate(366 54)">
    <rect class="panel" width="330" height="262" rx="16"/>
    <text x="165" y="30" text-anchor="middle" font-size="15" font-weight="700">air already full of vapour</text>
    <path class="cloud" stroke-width="1" d="M258 114 44 88v64l214-12z"/>
    <path class="grid" d="M222 120h36" stroke-width="7" stroke-linecap="round"/>
    <path fill="var(--blue)" d="m266 110 34 10-34 10 9-10z"/>
    <text class="muted" x="52" y="176" font-size="13">oldest part, widest</text>
    <text class="muted" x="165" y="204" text-anchor="middle" font-size="13">crystals grow, so the line widens with age</text>
    <text x="165" y="232" text-anchor="middle" font-size="14" font-weight="700">moisture is moving in</text>
  </g>
</svg>
