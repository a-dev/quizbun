<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img" aria-labelledby="t d">
  <title id="t">A shelf cloud is the front edge of the storm's cold air</title>
  <desc id="d">Rain-cooled air falls out of a storm, spreads along the ground as a dense pool, and runs out ahead of the rain. Warm humid air is forced up over the nose of that pool and condenses, which is the wedge-shaped shelf cloud. The wind arrives with the nose; the rain follows some minutes behind.</desc>
<style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; --cloud:#d7dfec; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; --cloud:#39414f; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); }
    .grid { fill:none; stroke:var(--grid); } .blue { fill:none; stroke:var(--blue); }
    .teal { fill:none; stroke:var(--teal); } .orange { fill:none; stroke:var(--orange); }
    .cloud { fill:var(--cloud); stroke:var(--grid); }
  </style>
  <rect width="760" height="380" rx="20" fill="var(--bg)"/>
  <text x="28" y="34" font-size="19" font-weight="700">Wind first, rain second</text>

  <path class="cloud" stroke-width="2" d="M76 72h330v88H76z"/>
  <text class="muted" x="240" y="122" text-anchor="middle" font-size="14" font-weight="700">storm core, heavy rain</text>
  <path class="blue" d="M110 168v92M144 162v98M178 168v92M212 162v98M246 168v92M280 162v98M314 168v92M348 162v98" stroke-width="2.5" stroke-linecap="round"/>

  <path fill="var(--cloud)" stroke="var(--teal)" stroke-width="2.5" d="M76 320v-38h304c48-2 68-26 92-32 24 8 32 42 48 70z"/>
  <text class="muted" x="196" y="306" font-size="13">cold air pooled on the ground, running out ahead</text>

  <path class="cloud" stroke-width="2" d="M404 174c48 16 116 50 176 84 22 12 34 20 36 24-28 2-72-14-118-38-48-24-82-44-94-54z"/>
  <text x="734" y="148" font-size="14" font-weight="700" text-anchor="end">shelf cloud</text>
  <text class="muted" x="734" y="168" font-size="13" text-anchor="end">warm air lifted over the nose</text>

  <path class="blue" d="M720 302c-48-6-76-22-90-38" stroke-width="3" fill="none"/>
  <path fill="var(--blue)" d="m618 254 18 22-27-3z"/>
  <text class="muted" x="734" y="308" font-size="13" text-anchor="end">warm humid air drawn in</text>

  <path class="teal" d="M240 188v66" stroke-width="4" stroke-dasharray="8 6"/>
  <path fill="var(--teal)" d="m230 248 10 20 10-20z"/>
  <text class="muted" x="256" y="222" font-size="13">downdraft</text>

  <path class="grid" d="M40 320h680" stroke-width="2.5"/>
  <path class="orange" d="M492 346h128" stroke-width="3"/>
  <path fill="var(--orange)" d="m614 338 22 8-22 8z"/>
  <text x="484" y="352" font-size="13" font-weight="700" text-anchor="end">the gust hits here, minutes before the rain</text>
</svg>
