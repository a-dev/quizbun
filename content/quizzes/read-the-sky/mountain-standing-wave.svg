<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360" role="img" aria-labelledby="t d">
  <title id="t">A lenticular cloud stands still while the air races through it</title>
  <desc id="d">Stable air forced over a ridge does not settle back down but oscillates in a standing wave downwind. Air cools and condenses climbing into each crest and warms and evaporates descending out of it, so cloud is made continuously at the upwind edge and destroyed at the downwind edge. The cloud holds its place while the air keeps moving.</desc>
<style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; --cloud:#d7dfec; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; --cloud:#39414f; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); }
    .grid { fill:none; stroke:var(--grid); } .blue { fill:none; stroke:var(--blue); }
    .teal { fill:none; stroke:var(--teal); } .orange { fill:none; stroke:var(--orange); }
    .cloud { fill:var(--cloud); stroke:var(--grid); }
  </style>
  <rect width="760" height="360" rx="20" fill="var(--bg)"/>
  <text x="28" y="34" font-size="19" font-weight="700">The cloud is a place, not a thing</text>

  <path class="orange" d="M46 72h96" stroke-width="3"/>
  <path fill="var(--orange)" d="m136 64 22 8-22 8z"/>
  <text class="muted" x="46" y="60" font-size="13">wind, often 80 km/h or more</text>

  <text class="muted" x="700" y="96" font-size="13" text-anchor="end">air condenses climbing into each crest</text>
  <text class="muted" x="700" y="118" font-size="13" text-anchor="end">and evaporates again on the way down</text>

  <path class="blue" d="M40 210q80 0 120-84 40 84 100 84 60 0 84-56 24 56 84 56 60 0 84-44 24 44 84 44h124" stroke-width="3" fill="none"/>
  <path class="grid" d="M40 250q80 0 120-60 40 60 100 60 60 0 84-40 24 40 84 40 60 0 84-32 24 32 84 32h124" stroke-width="2" fill="none" stroke-dasharray="6 5"/>

  <path class="cloud" stroke-width="2" d="M118 126q42-26 84 0-42 18-84 0z"/>
  <path class="cloud" stroke-width="2" d="M310 154q34-22 68 0-34 16-68 0z"/>
  <path class="cloud" stroke-width="2" d="M484 166q28-18 56 0-28 14-56 0z"/>

  <path fill="var(--blue)" d="m206 138 24 8-24 8 6-8z"/>
  <path fill="var(--blue)" d="m394 166 24 8-24 8 6-8z"/>

  <path fill="var(--grid)" d="M96 300 160 190l64 110z"/>
  <path class="grid" d="M40 300h680" stroke-width="2.5"/>
  <text class="muted" x="400" y="330" text-anchor="middle" font-size="13">the air pours through at speed, but the crests stay anchored to the ridge, so the clouds sit still for hours</text>
</svg>
