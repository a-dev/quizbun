<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
  <title id="t">Why every fair-weather cumulus has its bottom at the same height</title>
  <desc id="d">Warm bubbles rise from different patches of ground. Each one cools at the same steady rate as it climbs, so each reaches its dew point at the same altitude. Condensation starts there and nowhere lower, which cuts every cloud off with a flat bottom at one shared level.</desc>
<style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; --cloud:#d7dfec; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; --cloud:#39414f; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); }
    .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); }
    .grid { fill:none; stroke:var(--grid); } .blue { fill:none; stroke:var(--blue); }
    .teal { fill:none; stroke:var(--teal); } .orange { fill:none; stroke:var(--orange); }
    .cloud { fill:var(--cloud); stroke:var(--grid); }
  </style>
  <rect width="720" height="380" rx="20" fill="var(--bg)"/>
  <text x="28" y="34" font-size="19" font-weight="700">The flat bottoms are a temperature line, not a surface</text>
  <text x="28" y="66" font-size="14" font-weight="700" fill="var(--orange)">every rising bubble reaches its dew point at this one height</text>

  <g class="cloud" stroke-width="1.5">
    <path d="M84 176h136v-16c-8-24-34-32-52-20-12-22-44-24-56-4-20 2-32 20-24 34z"/>
    <path d="M288 176h116v-14c-8-22-30-28-46-18-10-20-38-20-48-2-18 2-28 18-20 30z"/>
    <path d="M470 176h158v-18c-10-28-40-36-60-24-14-26-52-28-66-6-22 2-38 24-30 42z"/>
  </g>
  <path class="orange" d="M56 176h612" stroke-width="2.5" stroke-dasharray="8 6"/>

  <path class="blue" d="M152 320v-126M346 320v-126M549 320v-126" stroke-width="2.5" stroke-dasharray="7 6"/>
  <path fill="var(--blue)" d="m144 200 8-18 8 18zM338 200l8-18 8 18zM541 200l8-18 8 18z"/>

  <path class="grid" d="M40 320h640" stroke-width="2.5"/>
  <text class="muted" x="152" y="344" text-anchor="middle" font-size="13">bare field</text>
  <text class="muted" x="346" y="344" text-anchor="middle" font-size="13">car park</text>
  <text class="muted" x="549" y="344" text-anchor="middle" font-size="13">sunny hillside</text>
  <text class="muted" x="360" y="372" text-anchor="middle" font-size="13">different starting points, same cooling rate on the way up, so they all condense together</text>
</svg>
