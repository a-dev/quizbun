<svg xmlns="http://www.w3.org/2000/svg" width="720" height="534" viewBox="0 0 720 534">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .edge-line { stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" fill-rule="evenodd" />
    </marker>
  </defs>

  <rect class="panel" width="720" height="534" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Three servers, one message, no shared memory
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    A WebSocket is one long-lived connection, and each process holds only its own sockets.
  </text>

  <g fill="none" class="edge-line" stroke="#64748b" stroke-width="2">
    <path d="M136,124 L136,146" marker-end="url(#arrow)" />
    <path d="M584,146 L584,124" marker-end="url(#arrow)" />
    <path d="M136,216 L136,254" marker-end="url(#arrow)" />
    <path d="M360,256 L360,218" marker-end="url(#arrow)" />
    <path d="M584,256 L584,218" marker-end="url(#arrow)" />
  </g>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect class="card" x="36" y="88" width="200" height="34" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="136" y="110" fill="#20242c" font-size="12.5" font-weight="700">the client who sends</text>
    <rect class="card" x="484" y="88" width="200" height="34" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="584" y="110" fill="#20242c" font-size="12.5" font-weight="700">the client who must receive</text>

    <rect class="card" x="36" y="150" width="200" height="66" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="136" y="176" fill="#20242c" font-size="15" font-weight="700">server A</text>
    <text class="muted" x="136" y="196" fill="#526173" font-size="11.5">the sender's socket is here</text>

    <rect class="card" x="260" y="150" width="200" height="66" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="360" y="176" fill="#20242c" font-size="15" font-weight="700">server B</text>
    <text class="muted" x="360" y="196" fill="#526173" font-size="11.5">holds neither of these two</text>

    <rect class="card" x="484" y="150" width="200" height="66" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="584" y="176" fill="#20242c" font-size="15" font-weight="700">server C</text>
    <text class="muted" x="584" y="196" fill="#526173" font-size="11.5">the recipient's socket is here</text>

    <rect class="info-box" x="36" y="256" width="648" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="360" y="280" fill="#172554" font-size="15" font-weight="700">shared pub/sub — a Redis channel, NATS, or equivalent</text>
    <text class="info-text" x="360" y="298" fill="#172554" font-size="11.5">every server subscribes; each one then pushes to the sockets it holds</text>
  </g>

  <g font-family="system-ui, sans-serif" text-anchor="start">
    <text class="muted" x="146" y="240" fill="#526173" font-size="11.5">publish</text>
    <text class="muted" x="370" y="240" fill="#526173" font-size="11.5">deliver</text>
    <text class="muted" x="594" y="240" fill="#526173" font-size="11.5">deliver</text>

    <text class="muted" x="36" y="334" fill="#526173" font-size="12.5">Without the bus, server A can only reach server A's clients — and it never learns the others exist.</text>

    <rect class="card" x="36" y="350" width="316" height="92" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="374" fill="#20242c" font-size="13.5" font-weight="700">Ways to pin a client to one backend</text>
    <text class="muted" x="52" y="396" fill="#526173" font-size="11.5">hashing the source IP</text>
    <text class="muted" x="52" y="414" fill="#526173" font-size="11.5">an affinity cookie set by the balancer</text>
    <text class="muted" x="52" y="432" fill="#526173" font-size="11.5">balancing the connection, not each request</text>

    <rect class="card" x="368" y="350" width="316" height="92" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="384" y="374" fill="#20242c" font-size="13.5" font-weight="700">State no single process can own</text>
    <text class="muted" x="384" y="396" fill="#526173" font-size="11.5">presence — who is online right now</text>
    <text class="muted" x="384" y="414" fill="#526173" font-size="11.5">room and channel membership</text>
    <text class="muted" x="384" y="432" fill="#526173" font-size="11.5">anything a second server also has to see</text>

    <rect class="accent-box" x="36" y="458" width="648" height="56" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="52" y="482" fill="#9a3412" font-size="13" font-weight="700">Lose one server holding 50 000 sockets and all 50 000 reconnect at once, onto the survivors.</text>
    <text class="accent-text" x="52" y="502" fill="#9a3412" font-size="13" font-weight="700">Reconnect with backoff and jitter, or the fleet finishes what the crash started.</text>
  </g>
</svg>
