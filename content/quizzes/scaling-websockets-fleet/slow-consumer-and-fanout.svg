<svg xmlns="http://www.w3.org/2000/svg" width="720" height="486" viewBox="0 0 720 486">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ok-fill: #dcfce7;
      --ok-edge: #16a34a;
      --ok-text: #14532d;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ok-fill: #14321f;
        --ok-edge: #4ade80;
        --ok-text: #bbf7d0;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .edge-line { stroke: var(--edge); }
    .ok-box { fill: var(--ok-fill); stroke: var(--ok-edge); }
    .ok-text { fill: var(--ok-text); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-fill { fill: var(--accent-fill); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" fill-rule="evenodd" />
    </marker>
  </defs>

  <rect class="panel" width="720" height="486" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    One slow client, and the arithmetic of fan-out
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Bytes you have queued but not yet sent are sitting in <tspan font-style="italic">your</tspan> process, not on the client.
  </text>

  <g fill="none" class="edge-line" stroke="#64748b" stroke-width="2">
    <path d="M196,130 L232,130" marker-end="url(#arrow)" />
    <path d="M436,130 L472,130" marker-end="url(#arrow)" />
  </g>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect class="card" x="36" y="98" width="160" height="64" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="116" y="124" fill="#20242c" font-size="14.5" font-weight="700">your server</text>
    <text class="muted" x="116" y="144" fill="#526173" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ws.send(frame)</text>

    <rect class="card" x="240" y="98" width="188" height="64" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <rect class="accent-fill" x="244" y="102" width="150" height="56" rx="7" fill="#ffedd5" />
    <text class="accent-text" x="319" y="135" fill="#9a3412" font-size="13" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">bufferedAmount</text>

    <rect class="card" x="480" y="98" width="204" height="64" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="582" y="124" fill="#20242c" font-size="14.5" font-weight="700">a client on a slow link</text>
    <text class="muted" x="582" y="144" fill="#526173" font-size="11.5">drains slower than you produce</text>

    <text class="muted" x="334" y="88" fill="#526173" font-size="11.5">queued in the server's memory</text>
  </g>

  <g font-family="system-ui, sans-serif" text-anchor="start">
    <rect class="accent-box" x="36" y="180" width="648" height="46" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="52" y="208" fill="#9a3412" font-size="13" font-weight="700">Ignore that number and a single slow client grows it without bound, until the process dies.</text>

    <text class="title" x="36" y="256" fill="#20242c" font-size="15" font-weight="700">For a live feed, an old frame is worth nothing</text>

    <rect class="ok-box" x="36" y="268" width="316" height="82" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ok-text" x="52" y="292" fill="#14532d" font-size="13.5" font-weight="700">Coalesce</text>
    <text class="ok-text" x="52" y="313" fill="#14532d" font-size="11.5">keep only the newest cursor position</text>
    <text class="ok-text" x="52" y="331" fill="#14532d" font-size="11.5">and replace the one still waiting</text>

    <rect class="ok-box" x="368" y="268" width="316" height="82" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ok-text" x="384" y="292" fill="#14532d" font-size="13.5" font-weight="700">Drop, or disconnect</text>
    <text class="ok-text" x="384" y="313" fill="#14532d" font-size="11.5">shed frames past a threshold, and close</text>
    <text class="ok-text" x="384" y="331" fill="#14532d" font-size="11.5">the socket if it never catches up</text>

    <rect class="info-box" x="36" y="368" width="316" height="82" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="52" y="392" fill="#172554" font-size="13.5" font-weight="700">Fan-out is multiplication</text>
    <text class="info-text" x="52" y="416" fill="#172554" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">5 × 100 000 = 500 000</text>
    <text class="info-text" x="52" y="435" fill="#172554" font-size="11.5">individual sends per second</text>

    <rect class="info-box" x="368" y="368" width="316" height="82" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="384" y="392" fill="#172554" font-size="13.5" font-weight="700">One connection, one descriptor</text>
    <text class="info-text" x="384" y="414" fill="#172554" font-size="11.5">every accepted socket costs a file</text>
    <text class="info-text" x="384" y="432" fill="#172554" font-size="11.5">descriptor, and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ulimit -n</tspan> caps the box</text>
  </g>
</svg>
