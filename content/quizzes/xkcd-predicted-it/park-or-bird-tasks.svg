<svg xmlns="http://www.w3.org/2000/svg" width="720" height="430" viewBox="0 0 720 430">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --card: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --card: #252b35;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .a { fill: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .card { fill: var(--card); stroke: var(--rail); }
  </style>

  <rect class="panel" width="720" height="430" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Two questions about one photo, 2014</text>

  <rect class="card" x="36" y="72" width="312" height="226" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
  <text class="title" x="56" y="102" fill="#20242c" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Taken in a national park?</text>
  <text class="muted" x="56" y="132" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Input: GPS coordinates in the</text>
  <text class="muted" x="56" y="152" fill="#526173" font-family="system-ui, sans-serif" font-size="14">photo's metadata</text>
  <text class="muted" x="56" y="182" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Method: is the point inside a</text>
  <text class="muted" x="56" y="202" fill="#526173" font-family="system-ui, sans-serif" font-size="14">park boundary polygon?</text>
  <text class="muted" x="56" y="232" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Needs: a map and a lookup</text>
  <text class="a" x="56" y="274" fill="#2563eb" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Comic: “a few hours”</text>

  <rect class="card" x="372" y="72" width="312" height="226" rx="14" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
  <text class="title" x="392" y="102" fill="#20242c" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Is it a bird?</text>
  <text class="muted" x="392" y="132" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Input: millions of pixel values</text>
  <text class="muted" x="392" y="182" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Method: learn what beaks, wings</text>
  <text class="muted" x="392" y="202" fill="#526173" font-family="system-ui, sans-serif" font-size="14">and feathers look like from</text>
  <text class="muted" x="392" y="222" fill="#526173" font-family="system-ui, sans-serif" font-size="14">millions of labelled examples</text>
  <text class="b" x="392" y="264" fill="#c2410c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Comic: “a research team</text>
  <text class="b" x="392" y="284" fill="#c2410c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">and five years”</text>

  <path class="rail" d="M60 358H660" stroke="#94a3b8" stroke-width="2" />
  <circle class="a" cx="60" cy="358" r="7" fill="#2563eb" />
  <circle class="b" cx="420" cy="358" r="7" fill="#c2410c" />
  <text class="title" x="60" y="340" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Sep 24: xkcd #1425</text>
  <text class="title" x="420" y="340" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Oct 20: Flickr's Park or Bird</text>
  <text class="muted" x="240" y="382" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">26 days</text>
  <text class="muted" x="36" y="412" fill="#526173" font-family="system-ui, sans-serif" font-size="13">Park or Bird reused a deep network Flickr had already trained.</text>
</svg>
