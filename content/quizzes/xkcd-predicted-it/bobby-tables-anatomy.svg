<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --card: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --card: #252b35;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .a { fill: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .card { fill: var(--card); stroke: var(--rail); }
  </style>

  <rect class="panel" width="720" height="440" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">How one name becomes two SQL statements</text>

  <text class="muted" x="36" y="84" fill="#526173" font-family="system-ui, sans-serif" font-size="14">1. The program glues the name into a query template:</text>
  <rect class="card" x="36" y="96" width="648" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
  <text class="title" x="52" y="122" fill="#20242c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15">INSERT INTO Students (name) VALUES ('<tspan class="a" fill="#2563eb" font-weight="700">…name…</tspan>');</text>

  <text class="muted" x="36" y="172" fill="#526173" font-family="system-ui, sans-serif" font-size="14">2. With the name Robert'); DROP TABLE Students;-- the database receives:</text>
  <rect class="card" x="36" y="184" width="648" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
  <text class="title" x="52" y="210" fill="#20242c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13.5">INSERT INTO Students (name) VALUES ('Robert<tspan class="b" fill="#c2410c" font-weight="700">');</tspan> <tspan class="b" fill="#c2410c" font-weight="700">DROP TABLE Students;</tspan><tspan class="b" fill="#c2410c" font-weight="700">--</tspan><tspan class="muted" fill="#526173">');</tspan></text>

  <rect class="b-soft" x="36" y="252" width="200" height="120" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="title" x="52" y="280" fill="#20242c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" font-weight="700">');</text>
  <text class="title" x="52" y="304" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">Quote closes the string.</text>
  <text class="title" x="52" y="324" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">Bracket and semicolon</text>
  <text class="title" x="52" y="344" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">finish the INSERT.</text>

  <rect class="b-soft" x="260" y="252" width="200" height="120" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="title" x="276" y="280" fill="#20242c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" font-weight="700">DROP TABLE …;</text>
  <text class="title" x="276" y="304" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">A brand-new statement</text>
  <text class="title" x="276" y="324" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">that deletes the whole</text>
  <text class="title" x="276" y="344" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">table.</text>

  <rect class="b-soft" x="484" y="252" width="200" height="120" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="title" x="500" y="280" fill="#20242c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" font-weight="700">--</text>
  <text class="title" x="500" y="304" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">Comments out the</text>
  <text class="title" x="500" y="324" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">template's leftover ');</text>
  <text class="title" x="500" y="344" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">so nothing errors.</text>

  <text class="muted" x="36" y="404" fill="#526173" font-family="system-ui, sans-serif" font-size="14">The fix: send the query and the name separately, so the name is never parsed as SQL.</text>
</svg>
