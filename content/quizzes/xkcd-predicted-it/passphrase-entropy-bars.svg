<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --card: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --card: #252b35;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .a { fill: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .card { fill: var(--card); stroke: var(--rail); }
  </style>

  <rect class="panel" width="720" height="400" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Password strength in bits, as xkcd #936 counts it</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Each bit doubles the guesses. The attacker knows the method and makes 1,000 guesses a second.</text>

  <text class="title" x="36" y="122" fill="#20242c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="600">Tr0ub4dor&amp;3</text>
  <text class="muted" x="36" y="142" fill="#526173" font-family="system-ui, sans-serif" font-size="13">a common word, tweaked</text>
  <rect class="b" x="260" y="108" width="280" height="30" rx="4" fill="#c2410c" />
  <text class="title" x="552" y="129" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">~28 bits · ~3 days</text>

  <text class="title" x="36" y="202" fill="#20242c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="600">correct horse battery staple</text>
  <text class="muted" x="36" y="222" fill="#526173" font-family="system-ui, sans-serif" font-size="13">four random words from 2,048</text>
  <rect class="a-soft" x="260" y="236" width="110" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <rect class="a-soft" x="370" y="236" width="110" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <rect class="a-soft" x="480" y="236" width="110" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <rect class="a-soft" x="590" y="236" width="110" height="30" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="title" x="315" y="256" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">11 bits</text>
  <text class="title" x="425" y="256" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">11 bits</text>
  <text class="title" x="535" y="256" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">11 bits</text>
  <text class="title" x="645" y="256" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">11 bits</text>
  <text class="title" x="700" y="226" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">44 bits · ~550 years</text>

  <path class="rail" d="M260 290H700" stroke="#94a3b8" stroke-width="2" />
  <text class="muted" x="260" y="310" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0</text>
  <text class="muted" x="370" y="310" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">11</text>
  <text class="muted" x="480" y="310" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">22</text>
  <text class="muted" x="590" y="310" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">33</text>
  <text class="muted" x="700" y="310" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">44</text>

  <text class="muted" x="36" y="350" fill="#526173" font-family="system-ui, sans-serif" font-size="14">16 more bits means 2¹⁶, or 65,536, times as many guesses.</text>
  <text class="muted" x="36" y="374" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Bar lengths are to scale.</text>
</svg>
