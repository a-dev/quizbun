<svg xmlns="http://www.w3.org/2000/svg" width="720" height="450" viewBox="0 0 720 450">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --card: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --card: #242b36;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .a { fill: var(--a); }
    .a-line { stroke: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .card { fill: var(--card); stroke: var(--rail); }
  </style>

  <rect class="panel" width="720" height="450" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Fewer aliens, shorter frames, faster march</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Each frame draws the aliens that are left, then moves the formation one small step.</text>
  <text class="title" x="36" y="120" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Aliens left</text>
  <text class="title" x="150" y="120" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Time to draw one frame</text>
  <text class="title" x="440" y="120" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Steps per second</text>
  <text class="title" x="36" y="165" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">55</text>
  <rect class="a-soft" x="150" y="146" width="240" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <rect class="b-soft" x="440" y="146" width="24" height="28" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="title" x="36" y="225" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">30</text>
  <rect class="a-soft" x="150" y="206" width="140" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <rect class="b-soft" x="440" y="206" width="41" height="28" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="title" x="36" y="285" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">10</text>
  <rect class="a-soft" x="150" y="266" width="60" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <rect class="b-soft" x="440" y="266" width="96" height="28" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="title" x="36" y="345" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">1</text>
  <rect class="a-soft" x="150" y="326" width="24" height="28" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <rect class="b-soft" x="440" y="326" width="240" height="28" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <line class="rail" x1="36" y1="380" x2="684" y2="380" stroke="#94a3b8" stroke-width="1" />
  <text class="muted" x="36" y="408" fill="#526173" font-family="system-ui, sans-serif" font-size="14">The step size never changes. Only the number of steps per second does.</text>
  <text class="muted" x="36" y="430" fill="#526173" font-family="system-ui, sans-serif" font-size="13">Illustrative bar lengths, not measured timings.</text>
</svg>
