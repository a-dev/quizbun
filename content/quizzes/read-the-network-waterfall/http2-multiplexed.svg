<svg xmlns="http://www.w3.org/2000/svg" width="760" height="460" viewBox="0 0 760 460">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d5dce6;
      --seg-queued: #cbd5e1;
      --seg-queued-edge: #64748b;
      --seg-stalled: #94a3b8;
      --seg-stalled-edge: #475569;
      --seg-dns: #d8b4fe;
      --seg-dns-edge: #9333ea;
      --seg-connect: #93c5fd;
      --seg-connect-edge: #2563eb;
      --seg-tls: #7dd3fc;
      --seg-tls-edge: #0284c7;
      --seg-sent: #334155;
      --seg-sent-edge: #0f172a;
      --seg-ttfb: #fed7aa;
      --seg-ttfb-edge: #c2410c;
      --seg-download: #86efac;
      --seg-download-edge: #16a34a;
      --marker: #9333ea;
      --text-on-dark: #f8fafc;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c49;
        --seg-queued: #334155;
        --seg-queued-edge: #94a3b8;
        --seg-stalled: #475569;
        --seg-stalled-edge: #cbd5e1;
        --seg-dns: #581c87;
        --seg-dns-edge: #c084fc;
        --seg-connect: #1e3a5f;
        --seg-connect-edge: #60a5fa;
        --seg-tls: #164e63;
        --seg-tls-edge: #38bdf8;
        --seg-sent: #0f172a;
        --seg-sent-edge: #94a3b8;
        --seg-ttfb: #3a2416;
        --seg-ttfb-edge: #fb923c;
        --seg-download: #14321f;
        --seg-download-edge: #4ade80;
        --marker: #c084fc;
        --text-on-dark: #0f172a;
      }
    }

    .panel-bg { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge-line { stroke: var(--edge); }
    .grid-line { stroke: var(--grid); }
    .card { fill: var(--card); stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .seg-queued { fill: var(--seg-queued); stroke: var(--seg-queued-edge); }
    .seg-stalled { fill: var(--seg-stalled); stroke: var(--seg-stalled-edge); }
    .seg-dns { fill: var(--seg-dns); stroke: var(--seg-dns-edge); }
    .seg-connect { fill: var(--seg-connect); stroke: var(--seg-connect-edge); }
    .seg-tls { fill: var(--seg-tls); stroke: var(--seg-tls-edge); }
    .seg-sent { fill: var(--seg-sent); stroke: var(--seg-sent-edge); }
    .seg-ttfb { fill: var(--seg-ttfb); stroke: var(--seg-ttfb-edge); }
    .seg-download { fill: var(--seg-download); stroke: var(--seg-download-edge); }
    .marker-line { stroke: var(--marker); }
    .marker-text { fill: var(--marker); }
  </style>
  <rect class="panel-bg" width="760" height="460" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="40" font-size="20" font-weight="700">HTTP/2: one connection, all streams multiplexed</text>
  <text class="muted" x="36" y="62" font-size="13.5">Only script1.js pays for Connect + TLS. The other seven ride the connection it opened</text>
  <text class="muted mono" x="30" y="115.0" font-size="12" text-anchor="start">script1.js</text>
    <rect class="seg-connect" x="150.0" y="100" width="45.0" height="22" stroke-width="1.5" />
    <rect class="seg-tls" x="195.0" y="100" width="37.5" height="22" stroke-width="1.5" />
    <rect class="seg-ttfb" x="232.5" y="100" width="75.0" height="22" stroke-width="1.5" />
    <rect class="seg-download" x="307.5" y="100" width="90.0" height="22" stroke-width="1.5" />
  <text class="muted mono" x="30" y="145.0" font-size="12" text-anchor="start">script2.js</text>
    <rect class="seg-stalled" x="150.0" y="130" width="82.5" height="22" stroke-width="1.5" />
    <rect class="seg-ttfb" x="232.5" y="130" width="75.0" height="22" stroke-width="1.5" />
    <rect class="seg-download" x="307.5" y="130" width="90.0" height="22" stroke-width="1.5" />
  <text class="muted mono" x="30" y="175.0" font-size="12" text-anchor="start">script3.js</text>
    <rect class="seg-stalled" x="150.0" y="160" width="82.5" height="22" stroke-width="1.5" />
    <rect class="seg-ttfb" x="232.5" y="160" width="75.0" height="22" stroke-width="1.5" />
    <rect class="seg-download" x="307.5" y="160" width="90.0" height="22" stroke-width="1.5" />
  <text class="muted mono" x="30" y="205.0" font-size="12" text-anchor="start">script4.js</text>
    <rect class="seg-stalled" x="150.0" y="190" width="82.5" height="22" stroke-width="1.5" />
    <rect class="seg-ttfb" x="232.5" y="190" width="75.0" height="22" stroke-width="1.5" />
    <rect class="seg-download" x="307.5" y="190" width="90.0" height="22" stroke-width="1.5" />
  <text class="muted mono" x="30" y="235.0" font-size="12" text-anchor="start">script5.js</text>
    <rect class="seg-stalled" x="150.0" y="220" width="82.5" height="22" stroke-width="1.5" />
    <rect class="seg-ttfb" x="232.5" y="220" width="75.0" height="22" stroke-width="1.5" />
    <rect class="seg-download" x="307.5" y="220" width="90.0" height="22" stroke-width="1.5" />
  <text class="muted mono" x="30" y="265.0" font-size="12" text-anchor="start">script6.js</text>
    <rect class="seg-stalled" x="150.0" y="250" width="82.5" height="22" stroke-width="1.5" />
    <rect class="seg-ttfb" x="232.5" y="250" width="75.0" height="22" stroke-width="1.5" />
    <rect class="seg-download" x="307.5" y="250" width="90.0" height="22" stroke-width="1.5" />
  <text class="muted mono" x="30" y="295.0" font-size="12" text-anchor="start">script7.js</text>
    <rect class="seg-stalled" x="150.0" y="280" width="82.5" height="22" stroke-width="1.5" />
    <rect class="seg-ttfb" x="232.5" y="280" width="75.0" height="22" stroke-width="1.5" />
    <rect class="seg-download" x="307.5" y="280" width="90.0" height="22" stroke-width="1.5" />
  <text class="muted mono" x="30" y="325.0" font-size="12" text-anchor="start">script8.js</text>
    <rect class="seg-stalled" x="150.0" y="310" width="82.5" height="22" stroke-width="1.5" />
    <rect class="seg-ttfb" x="232.5" y="310" width="75.0" height="22" stroke-width="1.5" />
    <rect class="seg-download" x="307.5" y="310" width="90.0" height="22" stroke-width="1.5" />
  <line class="grid-line" x1="150" y1="354" x2="397.5" y2="354" stroke-width="1.5" />
  <line class="grid-line" x1="150" y1="350" x2="150" y2="358" stroke-width="1.5" />
  <text class="muted mono" x="150" y="372" font-size="10.5" text-anchor="middle">0 ms</text>
  <line class="grid-line" x1="397.5" y1="350" x2="397.5" y2="358" stroke-width="1.5" />
  <text class="muted mono" x="397.5" y="372" font-size="10.5" text-anchor="middle">165 ms</text>
  <rect class="seg-stalled" x="30" y="389" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="50" y="400" font-size="11.5">Stalled (waiting)</text>
  <rect class="seg-connect" x="260" y="389" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="280" y="400" font-size="11.5">Initial connection</text>
  <rect class="seg-tls" x="490" y="389" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="510" y="400" font-size="11.5">TLS</text>
  <rect class="seg-ttfb" x="30" y="411" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="50" y="422" font-size="11.5">Waiting (TTFB)</text>
  <rect class="seg-download" x="260" y="411" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="280" y="422" font-size="11.5">Content download</text>
</svg>
