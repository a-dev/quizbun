<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d5dce6;
      --seg-queued: #cbd5e1;
      --seg-queued-edge: #64748b;
      --seg-stalled: #94a3b8;
      --seg-stalled-edge: #475569;
      --seg-dns: #d8b4fe;
      --seg-dns-edge: #9333ea;
      --seg-connect: #93c5fd;
      --seg-connect-edge: #2563eb;
      --seg-tls: #7dd3fc;
      --seg-tls-edge: #0284c7;
      --seg-sent: #334155;
      --seg-sent-edge: #0f172a;
      --seg-ttfb: #fed7aa;
      --seg-ttfb-edge: #c2410c;
      --seg-download: #86efac;
      --seg-download-edge: #16a34a;
      --marker: #9333ea;
      --text-on-dark: #f8fafc;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c49;
        --seg-queued: #334155;
        --seg-queued-edge: #94a3b8;
        --seg-stalled: #475569;
        --seg-stalled-edge: #cbd5e1;
        --seg-dns: #581c87;
        --seg-dns-edge: #c084fc;
        --seg-connect: #1e3a5f;
        --seg-connect-edge: #60a5fa;
        --seg-tls: #164e63;
        --seg-tls-edge: #38bdf8;
        --seg-sent: #0f172a;
        --seg-sent-edge: #94a3b8;
        --seg-ttfb: #3a2416;
        --seg-ttfb-edge: #fb923c;
        --seg-download: #14321f;
        --seg-download-edge: #4ade80;
        --marker: #c084fc;
        --text-on-dark: #0f172a;
      }
    }

    .panel-bg { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge-line { stroke: var(--edge); }
    .grid-line { stroke: var(--grid); }
    .card { fill: var(--card); stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .seg-queued { fill: var(--seg-queued); stroke: var(--seg-queued-edge); }
    .seg-stalled { fill: var(--seg-stalled); stroke: var(--seg-stalled-edge); }
    .seg-dns { fill: var(--seg-dns); stroke: var(--seg-dns-edge); }
    .seg-connect { fill: var(--seg-connect); stroke: var(--seg-connect-edge); }
    .seg-tls { fill: var(--seg-tls); stroke: var(--seg-tls-edge); }
    .seg-sent { fill: var(--seg-sent); stroke: var(--seg-sent-edge); }
    .seg-ttfb { fill: var(--seg-ttfb); stroke: var(--seg-ttfb-edge); }
    .seg-download { fill: var(--seg-download); stroke: var(--seg-download-edge); }
    .marker-line { stroke: var(--marker); }
    .marker-text { fill: var(--marker); }
  </style>
  <rect class="panel-bg" width="760" height="400" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="40" font-size="20" font-weight="700">Anatomy of one request bar</text>
  <text class="muted" x="36" y="62" font-size="13.5">Every colored segment is time on the same axis. Read the bar left to right</text>
    <rect class="seg-queued" x="60" y="190" width="40" height="70" stroke-width="1.5" />
    <rect class="seg-stalled" x="100" y="190" width="60" height="70" stroke-width="1.5" />
    <rect class="seg-dns" x="160" y="190" width="50" height="70" stroke-width="1.5" />
    <rect class="seg-connect" x="210" y="190" width="70" height="70" stroke-width="1.5" />
    <rect class="seg-tls" x="280" y="190" width="60" height="70" stroke-width="1.5" />
    <rect class="seg-sent" x="340" y="190" width="15" height="70" stroke-width="1.5" />
    <rect class="seg-ttfb" x="355" y="190" width="130" height="70" stroke-width="1.5" />
    <rect class="seg-download" x="485" y="190" width="175" height="70" stroke-width="1.5" />
  <line class="edge-line" x1="80.0" y1="100" x2="80.0" y2="190" stroke-width="1.2" stroke-dasharray="3 3" />
  <text class="title" x="80.0" y="94" font-size="12" font-weight="700" text-anchor="middle">Queued</text>
  <line class="edge-line" x1="130.0" y1="136" x2="130.0" y2="190" stroke-width="1.2" stroke-dasharray="3 3" />
  <text class="title" x="130.0" y="130" font-size="12" font-weight="700" text-anchor="middle">Stalled</text>
  <line class="edge-line" x1="185.0" y1="100" x2="185.0" y2="190" stroke-width="1.2" stroke-dasharray="3 3" />
  <text class="title" x="185.0" y="94" font-size="12" font-weight="700" text-anchor="middle">DNS</text>
  <line class="edge-line" x1="245.0" y1="136" x2="245.0" y2="190" stroke-width="1.2" stroke-dasharray="3 3" />
  <text class="title" x="245.0" y="130" font-size="12" font-weight="700" text-anchor="middle">Initial connection</text>
  <line class="edge-line" x1="310.0" y1="100" x2="310.0" y2="190" stroke-width="1.2" stroke-dasharray="3 3" />
  <text class="title" x="310.0" y="94" font-size="12" font-weight="700" text-anchor="middle">TLS</text>
  <line class="edge-line" x1="347.5" y1="136" x2="347.5" y2="190" stroke-width="1.2" stroke-dasharray="3 3" />
  <text class="title" x="347.5" y="130" font-size="12" font-weight="700" text-anchor="middle">Request sent</text>
  <line class="edge-line" x1="420.0" y1="100" x2="420.0" y2="190" stroke-width="1.2" stroke-dasharray="3 3" />
  <text class="title" x="420.0" y="94" font-size="12" font-weight="700" text-anchor="middle">Waiting (TTFB)</text>
  <line class="edge-line" x1="572.5" y1="136" x2="572.5" y2="190" stroke-width="1.2" stroke-dasharray="3 3" />
  <text class="title" x="572.5" y="130" font-size="12" font-weight="700" text-anchor="middle">Content download</text>
  <line class="grid-line" x1="60" y1="286" x2="660" y2="286" stroke-width="1.5" />
  <line class="grid-line" x1="60" y1="282" x2="60" y2="290" stroke-width="1.5" />
  <text class="muted mono" x="60" y="304" font-size="10.5" text-anchor="middle">0 ms</text>
  <line class="grid-line" x1="660" y1="282" x2="660" y2="290" stroke-width="1.5" />
  <text class="muted mono" x="660" y="304" font-size="10.5" text-anchor="middle">elapsed</text>
  <rect class="seg-queued" x="60" y="319" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="80" y="330" font-size="11.5">Queued: waiting for a free connection</text>
  <rect class="seg-stalled" x="400" y="319" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="420" y="330" font-size="11.5">Stalled: client-side hold, no bytes moving yet</text>
  <rect class="seg-dns" x="60" y="341" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="80" y="352" font-size="11.5">DNS: hostname resolved to an IP</text>
  <rect class="seg-connect" x="400" y="341" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="420" y="352" font-size="11.5">Initial connection: TCP handshake</text>
  <rect class="seg-tls" x="60" y="363" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="80" y="374" font-size="11.5">TLS: certificate and key exchange</text>
  <rect class="seg-sent" x="400" y="363" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="420" y="374" font-size="11.5">Request sent: browser writes the request</text>
  <rect class="seg-ttfb" x="60" y="385" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="80" y="396" font-size="11.5">Waiting (TTFB): server think time + 1 round trip</text>
  <rect class="seg-download" x="400" y="385" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="420" y="396" font-size="11.5">Content download: response bytes arrive</text>
</svg>
