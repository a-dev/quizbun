<svg xmlns="http://www.w3.org/2000/svg" width="760" height="530" viewBox="0 0 760 530">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d5dce6;
      --seg-queued: #cbd5e1;
      --seg-queued-edge: #64748b;
      --seg-stalled: #94a3b8;
      --seg-stalled-edge: #475569;
      --seg-dns: #d8b4fe;
      --seg-dns-edge: #9333ea;
      --seg-connect: #93c5fd;
      --seg-connect-edge: #2563eb;
      --seg-tls: #7dd3fc;
      --seg-tls-edge: #0284c7;
      --seg-sent: #334155;
      --seg-sent-edge: #0f172a;
      --seg-ttfb: #fed7aa;
      --seg-ttfb-edge: #c2410c;
      --seg-download: #86efac;
      --seg-download-edge: #16a34a;
      --marker: #9333ea;
      --text-on-dark: #f8fafc;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c49;
        --seg-queued: #334155;
        --seg-queued-edge: #94a3b8;
        --seg-stalled: #475569;
        --seg-stalled-edge: #cbd5e1;
        --seg-dns: #581c87;
        --seg-dns-edge: #c084fc;
        --seg-connect: #1e3a5f;
        --seg-connect-edge: #60a5fa;
        --seg-tls: #164e63;
        --seg-tls-edge: #38bdf8;
        --seg-sent: #0f172a;
        --seg-sent-edge: #94a3b8;
        --seg-ttfb: #3a2416;
        --seg-ttfb-edge: #fb923c;
        --seg-download: #14321f;
        --seg-download-edge: #4ade80;
        --marker: #c084fc;
        --text-on-dark: #0f172a;
      }
    }

    .panel-bg { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge-line { stroke: var(--edge); }
    .grid-line { stroke: var(--grid); }
    .card { fill: var(--card); stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .seg-queued { fill: var(--seg-queued); stroke: var(--seg-queued-edge); }
    .seg-stalled { fill: var(--seg-stalled); stroke: var(--seg-stalled-edge); }
    .seg-dns { fill: var(--seg-dns); stroke: var(--seg-dns-edge); }
    .seg-connect { fill: var(--seg-connect); stroke: var(--seg-connect-edge); }
    .seg-tls { fill: var(--seg-tls); stroke: var(--seg-tls-edge); }
    .seg-sent { fill: var(--seg-sent); stroke: var(--seg-sent-edge); }
    .seg-ttfb { fill: var(--seg-ttfb); stroke: var(--seg-ttfb-edge); }
    .seg-download { fill: var(--seg-download); stroke: var(--seg-download-edge); }
    .marker-line { stroke: var(--marker); }
    .marker-text { fill: var(--marker); }
  </style>
  <rect class="panel-bg" width="760" height="530" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="40" font-size="20" font-weight="700">What each hint removes from the bar</text>
  <text class="muted" x="36" y="62" font-size="13.5">Same request, drawn with and without the hint applied</text>
  <text class="title" x="30" y="94" font-size="13" font-weight="700">preconnect</text>
  <text class="muted mono" x="30" y="126.0" font-size="12" text-anchor="start">without hint</text>
    <rect class="seg-dns" x="230.0" y="110" width="37.5" height="24" stroke-width="1.5" />
    <rect class="seg-connect" x="267.5" y="110" width="45.0" height="24" stroke-width="1.5" />
    <rect class="seg-tls" x="312.5" y="110" width="37.5" height="24" stroke-width="1.5" />
    <rect class="seg-ttfb" x="350.0" y="110" width="67.5" height="24" stroke-width="1.5" />
    <rect class="seg-download" x="417.5" y="110" width="45.0" height="24" stroke-width="1.5" />
  <text class="muted mono" x="30" y="184.0" font-size="12" text-anchor="start">with preconnect</text>
    <rect class="seg-ttfb" x="230.0" y="168" width="67.5" height="24" stroke-width="1.5" />
    <rect class="seg-download" x="297.5" y="168" width="45.0" height="24" stroke-width="1.5" />
  <text class="muted" x="230" y="208" font-size="11.5">DNS + TCP + TLS already done, so the bar starts at Waiting</text>
  <text class="title" x="30" y="250" font-size="13" font-weight="700">preload</text>
  <text class="muted mono" x="30" y="282.0" font-size="12" text-anchor="start">without hint (late)</text>
    <rect class="seg-ttfb" x="425.0" y="266" width="60.0" height="24" stroke-width="1.5" />
    <rect class="seg-download" x="485.0" y="266" width="82.5" height="24" stroke-width="1.5" />
  <text class="muted mono" x="30" y="340.0" font-size="12" text-anchor="start">with preload</text>
    <rect class="seg-ttfb" x="230.0" y="324" width="60.0" height="24" stroke-width="1.5" />
    <rect class="seg-download" x="290.0" y="324" width="82.5" height="24" stroke-width="1.5" />
  <text class="muted" x="230" y="364" font-size="11.5">Same bar, same length. Preload only starts it earlier</text>
  <line class="grid-line" x1="230" y1="432" x2="462.5" y2="432" stroke-width="1.5" />
  <line class="grid-line" x1="230" y1="428" x2="230" y2="436" stroke-width="1.5" />
  <text class="muted mono" x="230" y="450" font-size="10.5" text-anchor="middle">0 ms</text>
  <line class="grid-line" x1="462.5" y1="428" x2="462.5" y2="436" stroke-width="1.5" />
  <text class="muted mono" x="462.5" y="450" font-size="10.5" text-anchor="middle">155 ms</text>
  <rect class="seg-dns" x="30" y="467" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="50" y="478" font-size="11.5">DNS</text>
  <rect class="seg-connect" x="260" y="467" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="280" y="478" font-size="11.5">Initial connection</text>
  <rect class="seg-tls" x="490" y="467" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="510" y="478" font-size="11.5">TLS</text>
  <rect class="seg-ttfb" x="30" y="489" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="50" y="500" font-size="11.5">Waiting (TTFB)</text>
  <rect class="seg-download" x="260" y="489" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="280" y="500" font-size="11.5">Content download</text>
</svg>
