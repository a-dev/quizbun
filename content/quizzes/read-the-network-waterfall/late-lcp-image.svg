<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d5dce6;
      --seg-queued: #cbd5e1;
      --seg-queued-edge: #64748b;
      --seg-stalled: #94a3b8;
      --seg-stalled-edge: #475569;
      --seg-dns: #d8b4fe;
      --seg-dns-edge: #9333ea;
      --seg-connect: #93c5fd;
      --seg-connect-edge: #2563eb;
      --seg-tls: #7dd3fc;
      --seg-tls-edge: #0284c7;
      --seg-sent: #334155;
      --seg-sent-edge: #0f172a;
      --seg-ttfb: #fed7aa;
      --seg-ttfb-edge: #c2410c;
      --seg-download: #86efac;
      --seg-download-edge: #16a34a;
      --marker: #9333ea;
      --text-on-dark: #f8fafc;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c49;
        --seg-queued: #334155;
        --seg-queued-edge: #94a3b8;
        --seg-stalled: #475569;
        --seg-stalled-edge: #cbd5e1;
        --seg-dns: #581c87;
        --seg-dns-edge: #c084fc;
        --seg-connect: #1e3a5f;
        --seg-connect-edge: #60a5fa;
        --seg-tls: #164e63;
        --seg-tls-edge: #38bdf8;
        --seg-sent: #0f172a;
        --seg-sent-edge: #94a3b8;
        --seg-ttfb: #3a2416;
        --seg-ttfb-edge: #fb923c;
        --seg-download: #14321f;
        --seg-download-edge: #4ade80;
        --marker: #c084fc;
        --text-on-dark: #0f172a;
      }
    }

    .panel-bg { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge-line { stroke: var(--edge); }
    .grid-line { stroke: var(--grid); }
    .card { fill: var(--card); stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .seg-queued { fill: var(--seg-queued); stroke: var(--seg-queued-edge); }
    .seg-stalled { fill: var(--seg-stalled); stroke: var(--seg-stalled-edge); }
    .seg-dns { fill: var(--seg-dns); stroke: var(--seg-dns-edge); }
    .seg-connect { fill: var(--seg-connect); stroke: var(--seg-connect-edge); }
    .seg-tls { fill: var(--seg-tls); stroke: var(--seg-tls-edge); }
    .seg-sent { fill: var(--seg-sent); stroke: var(--seg-sent-edge); }
    .seg-ttfb { fill: var(--seg-ttfb); stroke: var(--seg-ttfb-edge); }
    .seg-download { fill: var(--seg-download); stroke: var(--seg-download-edge); }
    .marker-line { stroke: var(--marker); }
    .marker-text { fill: var(--marker); }
  </style>
  <rect class="panel-bg" width="760" height="380" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="40" font-size="20" font-weight="700">hero.jpg starts long after the HTML finishes</text>
  <text class="muted" x="36" y="62" font-size="13.5">bundle.js runs first and injects the &lt;img&gt;, so the preload scanner never saw it coming</text>
  <text class="muted mono" x="32" y="117.0" font-size="12" text-anchor="start">index.html</text>
    <rect class="seg-ttfb" x="170.0" y="100" width="66.0" height="26" stroke-width="1.5" />
    <rect class="seg-download" x="236.0" y="100" width="22.0" height="26" stroke-width="1.5" />
  <text class="muted mono" x="32" y="153.0" font-size="12" text-anchor="start">app.css</text>
    <rect class="seg-connect" x="192.0" y="136" width="22.0" height="26" stroke-width="1.5" />
    <rect class="seg-tls" x="214.0" y="136" width="16.5" height="26" stroke-width="1.5" />
    <rect class="seg-ttfb" x="230.5" y="136" width="44.0" height="26" stroke-width="1.5" />
    <rect class="seg-download" x="274.5" y="136" width="27.5" height="26" stroke-width="1.5" />
  <text class="muted mono" x="32" y="189.0" font-size="12" text-anchor="start">bundle.js</text>
    <rect class="seg-connect" x="192.0" y="172" width="22.0" height="26" stroke-width="1.5" />
    <rect class="seg-tls" x="214.0" y="172" width="16.5" height="26" stroke-width="1.5" />
    <rect class="seg-ttfb" x="230.5" y="172" width="49.5" height="26" stroke-width="1.5" />
    <rect class="seg-download" x="280.0" y="172" width="99.0" height="26" stroke-width="1.5" />
  <text class="muted mono" x="32" y="225.0" font-size="12" text-anchor="start">hero.jpg</text>
    <rect class="seg-connect" x="379.0" y="208" width="22.0" height="26" stroke-width="1.5" />
    <rect class="seg-tls" x="401.0" y="208" width="16.5" height="26" stroke-width="1.5" />
    <rect class="seg-ttfb" x="417.5" y="208" width="44.0" height="26" stroke-width="1.5" />
    <rect class="seg-download" x="461.5" y="208" width="77.0" height="26" stroke-width="1.5" />
  <line class="grid-line" x1="170" y1="264" x2="538.5" y2="264" stroke-width="1.5" />
  <line class="grid-line" x1="170" y1="260" x2="170" y2="268" stroke-width="1.5" />
  <text class="muted mono" x="170" y="282" font-size="10.5" text-anchor="middle">0 ms</text>
  <line class="grid-line" x1="379.0" y1="260" x2="379.0" y2="268" stroke-width="1.5" />
  <text class="muted mono" x="379.0" y="282" font-size="10.5" text-anchor="middle">190</text>
  <line class="grid-line" x1="538.5" y1="260" x2="538.5" y2="268" stroke-width="1.5" />
  <text class="muted mono" x="538.5" y="282" font-size="10.5" text-anchor="middle">335</text>
  <line class="marker-line" x1="538.5" y1="90" x2="538.5" y2="264" stroke-width="2" stroke-dasharray="4 3" />
  <text class="marker-text" x="538.5" y="84" font-size="11.5" font-weight="700" text-anchor="middle">LCP</text>
  <rect class="seg-connect" x="32" y="299" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="52" y="310" font-size="11.5">Initial connection</text>
  <rect class="seg-tls" x="372" y="299" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="392" y="310" font-size="11.5">TLS</text>
  <rect class="seg-ttfb" x="32" y="321" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="52" y="332" font-size="11.5">Waiting (TTFB)</text>
  <rect class="seg-download" x="372" y="321" width="14" height="14" rx="2" stroke-width="1.5" />
  <text class="muted" x="392" y="332" font-size="11.5">Content download</text>
</svg>
