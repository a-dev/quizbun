<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d5dce6;
      --seg-queued: #cbd5e1;
      --seg-queued-edge: #64748b;
      --seg-stalled: #94a3b8;
      --seg-stalled-edge: #475569;
      --seg-dns: #d8b4fe;
      --seg-dns-edge: #9333ea;
      --seg-connect: #93c5fd;
      --seg-connect-edge: #2563eb;
      --seg-tls: #7dd3fc;
      --seg-tls-edge: #0284c7;
      --seg-sent: #334155;
      --seg-sent-edge: #0f172a;
      --seg-ttfb: #fed7aa;
      --seg-ttfb-edge: #c2410c;
      --seg-download: #86efac;
      --seg-download-edge: #16a34a;
      --marker: #9333ea;
      --text-on-dark: #f8fafc;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c49;
        --seg-queued: #334155;
        --seg-queued-edge: #94a3b8;
        --seg-stalled: #475569;
        --seg-stalled-edge: #cbd5e1;
        --seg-dns: #581c87;
        --seg-dns-edge: #c084fc;
        --seg-connect: #1e3a5f;
        --seg-connect-edge: #60a5fa;
        --seg-tls: #164e63;
        --seg-tls-edge: #38bdf8;
        --seg-sent: #0f172a;
        --seg-sent-edge: #94a3b8;
        --seg-ttfb: #3a2416;
        --seg-ttfb-edge: #fb923c;
        --seg-download: #14321f;
        --seg-download-edge: #4ade80;
        --marker: #c084fc;
        --text-on-dark: #0f172a;
      }
    }

    .panel-bg { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge-line { stroke: var(--edge); }
    .grid-line { stroke: var(--grid); }
    .card { fill: var(--card); stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .seg-queued { fill: var(--seg-queued); stroke: var(--seg-queued-edge); }
    .seg-stalled { fill: var(--seg-stalled); stroke: var(--seg-stalled-edge); }
    .seg-dns { fill: var(--seg-dns); stroke: var(--seg-dns-edge); }
    .seg-connect { fill: var(--seg-connect); stroke: var(--seg-connect-edge); }
    .seg-tls { fill: var(--seg-tls); stroke: var(--seg-tls-edge); }
    .seg-sent { fill: var(--seg-sent); stroke: var(--seg-sent-edge); }
    .seg-ttfb { fill: var(--seg-ttfb); stroke: var(--seg-ttfb-edge); }
    .seg-download { fill: var(--seg-download); stroke: var(--seg-download-edge); }
    .marker-line { stroke: var(--marker); }
    .marker-text { fill: var(--marker); }
  </style>
  <rect class="panel-bg" width="760" height="420" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="40" font-size="20" font-weight="700">font-display decides what shows while the font is still loading</text>
  <text class="muted" x="36" y="62" font-size="13.5">Same font file, same load time. Only the fallback policy changes</text>
  <text class="muted mono" x="60" y="100" font-size="12">font file request</text>
  <text class="muted mono" x="60" y="124.0" font-size="12" text-anchor="start"></text>
    <rect class="seg-connect" x="60.0" y="110" width="44.0" height="20" stroke-width="1.5" />
    <rect class="seg-tls" x="104.0" y="110" width="33.0" height="20" stroke-width="1.5" />
    <rect class="seg-ttfb" x="137.0" y="110" width="55.0" height="20" stroke-width="1.5" />
    <rect class="seg-download" x="192.0" y="110" width="88.0" height="20" stroke-width="1.5" />
  <text class="title" x="60" y="180" font-size="13" font-weight="700">block (FOIT)</text>
    <rect x="60" y="190" width="220.0" height="40" fill="var(--seg-queued)" stroke="var(--seg-queued-edge)" stroke-width="1.5" />
  <text class="muted" x="170.0" y="215.0" font-size="11.5" text-anchor="middle">invisible text (no fallback painted)</text>
    <rect x="280.0" y="190" width="120" height="40" class="seg-download" stroke-width="1.5" />
  <text class="muted" x="340.0" y="215.0" font-size="11.5" text-anchor="middle">web font paints</text>
  <text class="title" x="60" y="280" font-size="13" font-weight="700">swap (FOUT)</text>
    <rect x="60" y="290" width="220.0" height="40" class="seg-ttfb" stroke-width="1.5" />
  <text class="muted" x="170.0" y="315.0" font-size="11.5" text-anchor="middle">fallback font visible</text>
    <rect x="280.0" y="290" width="120" height="40" class="seg-download" stroke-width="1.5" />
  <text class="muted" x="340.0" y="315.0" font-size="11.5" text-anchor="middle">swaps to web font</text>
  <line class="marker-line" x1="280.0" y1="100" x2="280.0" y2="340" stroke-width="2" stroke-dasharray="4 3" />
  <text class="marker-text" x="280.0" y="94" font-size="11.5" font-weight="700" text-anchor="middle">font ready</text>
  <line class="grid-line" x1="60" y1="370" x2="400.0" y2="370" stroke-width="1.5" />
  <line class="grid-line" x1="60" y1="366" x2="60" y2="374" stroke-width="1.5" />
  <text class="muted mono" x="60" y="388" font-size="10.5" text-anchor="middle">0 ms</text>
  <line class="grid-line" x1="280.0" y1="366" x2="280.0" y2="374" stroke-width="1.5" />
  <text class="muted mono" x="280.0" y="388" font-size="10.5" text-anchor="middle">font loaded</text>
</svg>
