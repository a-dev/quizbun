<svg xmlns="http://www.w3.org/2000/svg" width="720" height="590" viewBox="0 0 720 590">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
  </style>

  <rect class="panel" width="720" height="590" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Reading one EXPLAIN ANALYZE plan
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Estimates on the left of each node, measurements on the right. They rarely agree.
  </text>

  <rect class="card" x="36" y="88" width="648" height="232" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="78" y="118" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve">Nested Loop  (cost=0.29..1284.60 rows=12 width=48)</text>
  <text class="title" x="78" y="136" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve">             (actual time=0.041..96.412 rows=1240 loops=1)</text>
  <circle class="info-box" cx="58" cy="149" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="58" y="153" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4</text>
  <text class="title" x="78" y="154" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve">  Buffers: shared hit=142 read=88231</text>
  <circle class="info-box" cx="58" cy="167" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="58" y="171" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">5</text>
  <text class="title" x="78" y="172" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve">  ->  Seq Scan on orders o  (cost=0.00..980.00 rows=6 width=24)</text>
  <text class="title" x="78" y="190" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve">        (actual time=0.018..42.300 rows=620 loops=1)</text>
  <text class="title" x="78" y="208" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve">        Filter: (status = 'open'::text)</text>
  <circle class="info-box" cx="58" cy="221" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="58" y="225" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
  <text class="title" x="78" y="226" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve">        Rows Removed by Filter: 419380</text>
  <text class="title" x="78" y="244" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve">  ->  Index Scan using items_order_idx on items i</text>
  <circle class="info-box" cx="58" cy="257" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="58" y="261" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
  <text class="title" x="78" y="262" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve">        (cost=0.29..8.31 rows=2 width=24)</text>
  <circle class="info-box" cx="58" cy="275" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="58" y="279" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <text class="title" x="78" y="280" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve">        (actual time=0.006..0.071 rows=14 loops=620)</text>
  <text class="title" x="78" y="298" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" xml:space="preserve">        Index Cond: (i.order_id = o.id)</text>
  <circle class="info-box" cx="49" cy="352" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="49" y="356" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">1</text>
  <text class="title" x="70" y="350" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">cost=0.29..8.31</text>
  <text class="muted" x="70" y="368" fill="#526173" font-family="system-ui, sans-serif" font-size="12">startup cost, then total cost: planner units, never milliseconds</text>
  <circle class="info-box" cx="49" cy="400" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="49" y="404" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <text class="title" x="70" y="398" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">rows=14 loops=620</text>
  <text class="muted" x="70" y="416" fill="#526173" font-family="system-ui, sans-serif" font-size="12">actual rows is a per-loop average: this node returned 14 × 620 = 8 680 rows in all</text>
  <circle class="info-box" cx="49" cy="448" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="49" y="452" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">3</text>
  <text class="title" x="70" y="446" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Rows Removed by Filter: 419380</text>
  <text class="muted" x="70" y="464" fill="#526173" font-family="system-ui, sans-serif" font-size="12">the scan read those rows and threw them away, that predicate belongs in the index</text>
  <circle class="info-box" cx="49" cy="496" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="49" y="500" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4</text>
  <text class="title" x="70" y="494" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">Buffers: shared hit=142 read=88231</text>
  <text class="muted" x="70" y="512" fill="#526173" font-family="system-ui, sans-serif" font-size="12">142 pages came from shared buffers and 88 231 did not; almost nothing was cached</text>
  <circle class="info-box" cx="49" cy="544" r="11" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="49" y="548" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">5</text>
  <text class="title" x="70" y="542" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">rows=6 estimated, rows=620 actual</text>
  <text class="muted" x="70" y="560" fill="#526173" font-family="system-ui, sans-serif" font-size="12">start at the deepest node whose estimate is furthest off, every node above it inherited the error</text>
</svg>
