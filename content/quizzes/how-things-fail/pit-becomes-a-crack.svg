<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d7dee9;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --bad: #dc2626;
      --good: #0f766e;
      --fill1: #dbe6fb;
      --fill2: #fbe4d4;
      --metal: #cbd5e1;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c48;
        --accent1: #7aa2f7;
        --accent2: #f0a35e;
        --bad: #f2777a;
        --good: #4ec9a0;
        --fill1: #26344a;
        --fill2: #3a2e26;
        --metal: #47536a;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .metal { fill: var(--metal); stroke: var(--edge); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .grid { stroke: var(--grid); }
    .a1 { stroke: var(--accent1); }
    .a1-f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2-f { fill: var(--accent2); }
    .bad { stroke: var(--bad); }
    .bad-f { fill: var(--bad); }
    .good { stroke: var(--good); }
    .good-f { fill: var(--good); }
    .fill1 { fill: var(--fill1); }
    .fill2 { fill: var(--fill2); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="300" rx="20" fill="#f5f7fb" />
  <text class="title" x="28" y="36" fill="#20242c" font-size="18" font-weight="700">A pit can start a fatigue crack</text>

  <g transform="translate(24,58)">
    <rect class="card" width="212" height="212" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <path class="metal" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5" d="M20 84 H192 V180 H20 Z" />
    <g class="a1" stroke="#2563eb" stroke-width="2" fill="none">
      <path d="M28 102 H184" /><path d="M28 122 H184" /><path d="M28 142 H184" />
    </g>
    <path class="a1" stroke="#2563eb" stroke-width="2.5" fill="none" stroke-linecap="round" d="M62 64 h88 M62 64 l10 -7 M62 64 l10 7 M150 64 l-10 -7 M150 64 l-10 7" />
    <text class="muted" x="106" y="48" fill="#526173" font-size="12" text-anchor="middle">cyclic load</text>
    <text class="title" x="106" y="202" fill="#20242c" font-size="13" font-weight="700" text-anchor="middle">1. Sound surface</text>
  </g>

  <g transform="translate(254,58)">
    <rect class="card" width="212" height="212" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <path class="metal" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5" d="M20 84 H92 Q108 120 124 84 H192 V180 H20 Z" />
    <g class="a1" stroke="#2563eb" stroke-width="2" fill="none">
      <path d="M28 116 H78 C94 116 96 126 108 126 C120 126 122 116 138 116 H184" />
      <path d="M28 136 H82 C98 136 100 142 108 142 C116 142 118 136 134 136 H184" />
      <path d="M28 158 H184" />
    </g>
    <path class="a2" stroke="#c2410c" stroke-width="2.5" fill="none" d="M108 60 v16" />
    <text class="a2-f" x="108" y="52" fill="#c2410c" font-size="12" font-weight="700" text-anchor="middle">pit</text>
    <text class="title" x="106" y="202" fill="#20242c" font-size="13" font-weight="700" text-anchor="middle">2. Corrosion digs a notch</text>
  </g>

  <g transform="translate(484,58)">
    <rect class="card" width="212" height="212" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <path class="metal" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5" d="M20 84 H92 Q108 120 124 84 H192 V180 H20 Z" />
    <path class="bad" stroke="#dc2626" stroke-width="3" fill="none" stroke-linejoin="round" d="M108 104 l-7 14 l8 12 l-6 14 l7 12" />
    <g class="a1" stroke="#2563eb" stroke-width="2" fill="none">
      <path d="M28 116 H74 C92 116 90 122 100 122" /><path d="M118 116 H184" />
      <path d="M28 158 H184" />
    </g>
    <path class="a2" stroke="#c2410c" stroke-width="2.5" fill="none" d="M120 136 h18" />
    <text class="a2-f" x="144" y="140" fill="#c2410c" font-size="12" font-weight="700">crack</text>
    <text class="title" x="106" y="202" fill="#20242c" font-size="13" font-weight="700" text-anchor="middle">3. The crack grows from it</text>
  </g>
</svg>
