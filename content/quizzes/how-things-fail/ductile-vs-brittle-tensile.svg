<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d7dee9;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --bad: #dc2626;
      --good: #0f766e;
      --fill1: #dbe6fb;
      --fill2: #fbe4d4;
      --metal: #cbd5e1;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c48;
        --accent1: #7aa2f7;
        --accent2: #f0a35e;
        --bad: #f2777a;
        --good: #4ec9a0;
        --fill1: #26344a;
        --fill2: #3a2e26;
        --metal: #47536a;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .metal { fill: var(--metal); stroke: var(--edge); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .grid { stroke: var(--grid); }
    .a1 { stroke: var(--accent1); }
    .a1-f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2-f { fill: var(--accent2); }
    .bad { stroke: var(--bad); }
    .bad-f { fill: var(--bad); }
    .good { stroke: var(--good); }
    .good-f { fill: var(--good); }
    .fill1 { fill: var(--fill1); }
    .fill2 { fill: var(--fill2); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="360" rx="20" fill="#f5f7fb" />

  <g transform="translate(24,20)">
    <rect class="card" width="322" height="320" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="20" y="34" fill="#20242c" font-size="16" font-weight="700">Ductile</text>
    <text class="muted" x="20" y="54" fill="#526173" font-size="12.5">deforms before breaking</text>

    <path class="metal" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"
          d="M116 66 V92 C116 120 132 126 132 152 L148 142 L164 152 C164 126 180 120 180 92 V66 Z" />
    <path class="metal" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"
          d="M116 258 V232 C116 204 132 198 132 176 L148 166 L164 176 C164 198 180 204 180 232 V258 Z" />
    <path class="a2" stroke="#c2410c" stroke-width="2" fill="none" d="M170 140 h22 M170 190 h22" />
    <text class="a2-f" x="198" y="145" fill="#c2410c" font-size="12.5" font-weight="600">thinned</text>
    <text class="a2-f" x="198" y="195" fill="#c2410c" font-size="12.5" font-weight="600">thinned</text>

    <text class="muted" x="20" y="288" fill="#526173" font-size="12.5">Visible necking. The joined halves</text>
    <text class="muted" x="20" y="306" fill="#526173" font-size="12.5">are shorter than the original bar.</text>
  </g>

  <g transform="translate(374,20)">
    <rect class="card" width="322" height="320" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="20" y="34" fill="#20242c" font-size="16" font-weight="700">Brittle</text>
    <text class="muted" x="20" y="54" fill="#526173" font-size="12.5">little warning or deformation</text>

    <rect class="metal" x="116" y="66" width="64" height="86" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5" />
    <rect class="metal" x="116" y="176" width="64" height="82" rx="2" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5" />
    <path class="bad" stroke="#dc2626" stroke-width="3" fill="none" d="M110 152 h76 M110 176 h76" />
    <path class="a2" stroke="#c2410c" stroke-width="2" fill="none" d="M186 110 h16 M186 216 h16" />
    <text class="a2-f" x="208" y="115" fill="#c2410c" font-size="12.5" font-weight="600">full width</text>
    <text class="a2-f" x="208" y="221" fill="#c2410c" font-size="12.5" font-weight="600">full width</text>

    <text class="muted" x="20" y="288" fill="#526173" font-size="12.5">Flat break across the load.</text>
    <text class="muted" x="20" y="306" fill="#526173" font-size="12.5">The halves still fit together.</text>
  </g>
</svg>
