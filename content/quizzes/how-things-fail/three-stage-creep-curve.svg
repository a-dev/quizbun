<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d7dee9;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --bad: #dc2626;
      --good: #0f766e;
      --fill1: #dbe6fb;
      --fill2: #fbe4d4;
      --metal: #cbd5e1;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c48;
        --accent1: #7aa2f7;
        --accent2: #f0a35e;
        --bad: #f2777a;
        --good: #4ec9a0;
        --fill1: #26344a;
        --fill2: #3a2e26;
        --metal: #47536a;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .metal { fill: var(--metal); stroke: var(--edge); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .grid { stroke: var(--grid); }
    .a1 { stroke: var(--accent1); }
    .a1-f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2-f { fill: var(--accent2); }
    .bad { stroke: var(--bad); }
    .bad-f { fill: var(--bad); }
    .good { stroke: var(--good); }
    .good-f { fill: var(--good); }
    .fill1 { fill: var(--fill1); }
    .fill2 { fill: var(--fill2); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="380" rx="20" fill="#f5f7fb" />
  <text class="title" x="28" y="36" fill="#20242c" font-size="18" font-weight="700">Three stages of creep</text>

  <rect class="fill1" x="90" y="72" width="130" height="228" fill="#dbe6fb" opacity="0.55" />
  <rect class="fill1" x="220" y="72" width="250" height="228" fill="#dbe6fb" opacity="0.25" />
  <rect class="fill2" x="470" y="72" width="150" height="228" fill="#fbe4d4" opacity="0.6" />

  <line class="edge" x1="90" y1="72" x2="90" y2="300" stroke="#64748b" stroke-width="1.8" />
  <line class="edge" x1="90" y1="300" x2="670" y2="300" stroke="#64748b" stroke-width="1.8" />
  <g class="grid" stroke="#d7dee9" stroke-width="1" stroke-dasharray="4 4">
    <line x1="220" y1="72" x2="220" y2="300" /><line x1="470" y1="72" x2="470" y2="300" />
  </g>

  <path class="a1" fill="none" stroke="#2563eb" stroke-width="3.5"
        d="M90 294 C112 252 154 228 220 218 L470 184 C522 176 574 142 614 88" />
  <g class="bad" stroke="#dc2626" stroke-width="4" stroke-linecap="round">
    <path d="M606 78 l20 20 M626 78 l-20 20" />
  </g>
  <text class="bad-f" x="640" y="94" fill="#dc2626" font-size="13" font-weight="700">rupture</text>

  <circle cx="90" cy="292" r="5" class="a1-f" fill="#2563eb" />
  <text class="muted" x="98" y="322" fill="#526173" font-size="12">load applied</text>

  <g text-anchor="middle">
    <text class="title" x="155" y="348" fill="#20242c" font-size="13.5" font-weight="700">primary</text>
    <text class="muted" x="155" y="366" fill="#526173" font-size="12">rate slows down</text>
    <text class="title" x="345" y="348" fill="#20242c" font-size="13.5" font-weight="700">secondary</text>
    <text class="muted" x="345" y="366" fill="#526173" font-size="12">steady rate, most of the life</text>
    <text class="title" x="560" y="348" fill="#20242c" font-size="13.5" font-weight="700">tertiary</text>
    <text class="muted" x="560" y="366" fill="#526173" font-size="12">damage accelerates</text>
  </g>

  <text class="muted" x="80" y="70" fill="#526173" font-size="12.5" text-anchor="end">strain</text>
  <text class="muted" x="380" y="60" fill="#526173" font-size="12.5" text-anchor="middle">time under constant load below yield strength</text>
</svg>
