<svg xmlns="http://www.w3.org/2000/svg" width="720" height="396" viewBox="0 0 720 396">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d7dee9;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --bad: #dc2626;
      --good: #0f766e;
      --fill1: #dbe6fb;
      --fill2: #fbe4d4;
      --metal: #cbd5e1;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c48;
        --accent1: #7aa2f7;
        --accent2: #f0a35e;
        --bad: #f2777a;
        --good: #4ec9a0;
        --fill1: #26344a;
        --fill2: #3a2e26;
        --metal: #47536a;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .metal { fill: var(--metal); stroke: var(--edge); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .grid { stroke: var(--grid); }
    .a1 { stroke: var(--accent1); }
    .a1-f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2-f { fill: var(--accent2); }
    .bad { stroke: var(--bad); }
    .bad-f { fill: var(--bad); }
    .good { stroke: var(--good); }
    .good-f { fill: var(--good); }
    .fill1 { fill: var(--fill1); }
    .fill2 { fill: var(--fill2); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="396" rx="20" fill="#f5f7fb" />
  <text class="title" x="28" y="36" fill="#20242c" font-size="18" font-weight="700">Some metals have no fatigue limit</text>

  <g class="grid" stroke="#d7dee9" stroke-width="1">
    <line x1="90" y1="80" x2="90" y2="300" /><line x1="187" y1="80" x2="187" y2="300" />
    <line x1="283" y1="80" x2="283" y2="300" /><line x1="380" y1="80" x2="380" y2="300" />
    <line x1="477" y1="80" x2="477" y2="300" /><line x1="573" y1="80" x2="573" y2="300" />
    <line x1="670" y1="80" x2="670" y2="300" />
  </g>
  <line class="edge" x1="90" y1="80" x2="90" y2="300" stroke="#64748b" stroke-width="1.8" />
  <line class="edge" x1="90" y1="300" x2="670" y2="300" stroke="#64748b" stroke-width="1.8" />
  <g class="muted mono" fill="#526173" font-size="11.5" text-anchor="middle">
    <text x="90" y="320">10³</text><text x="187" y="320">10⁴</text><text x="283" y="320">10⁵</text>
    <text x="380" y="320">10⁶</text><text x="477" y="320">10⁷</text><text x="573" y="320">10⁸</text>
    <text x="670" y="320">10⁹</text>
  </g>
  <text class="muted" x="380" y="342" fill="#526173" font-size="13" text-anchor="middle">Cycles to failure</text>
  <text class="muted" x="80" y="76" fill="#526173" font-size="12.5" text-anchor="end">stress</text>
  <text class="muted" x="80" y="92" fill="#526173" font-size="12.5" text-anchor="end">amplitude</text>

  <line class="a1" x1="90" y1="228" x2="670" y2="228" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 5" />
  <path class="a1" fill="none" stroke="#2563eb" stroke-width="3.5" d="M90 96 C190 128 300 186 380 212 C420 224 448 228 477 228 L670 228" />
  <path class="a2" fill="none" stroke="#c2410c" stroke-width="3.5" stroke-dasharray="10 6" d="M90 122 C190 154 320 204 430 240 C520 268 604 284 670 292" />

  <text class="a1-f" x="500" y="218" fill="#2563eb" font-size="13.5" font-weight="700">carbon steel, fatigue limit</text>
  <text class="a2-f" x="666" y="278" fill="#c2410c" font-size="13.5" font-weight="700" text-anchor="end">aluminium alloy</text>

  <text class="muted" x="28" y="358" fill="#526173" font-size="13">Below its fatigue limit, steel can cycle indefinitely.</text>
  <text class="muted" x="28" y="375" fill="#526173" font-size="13">Aluminium has a finite life at every amplitude.</text>
</svg>
