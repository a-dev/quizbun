<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d7dee9;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --bad: #dc2626;
      --good: #0f766e;
      --fill1: #dbe6fb;
      --fill2: #fbe4d4;
      --metal: #cbd5e1;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c48;
        --accent1: #7aa2f7;
        --accent2: #f0a35e;
        --bad: #f2777a;
        --good: #4ec9a0;
        --fill1: #26344a;
        --fill2: #3a2e26;
        --metal: #47536a;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .metal { fill: var(--metal); stroke: var(--edge); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .grid { stroke: var(--grid); }
    .a1 { stroke: var(--accent1); }
    .a1-f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2-f { fill: var(--accent2); }
    .bad { stroke: var(--bad); }
    .bad-f { fill: var(--bad); }
    .good { stroke: var(--good); }
    .good-f { fill: var(--good); }
    .fill1 { fill: var(--fill1); }
    .fill2 { fill: var(--fill2); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="400" rx="20" fill="#f5f7fb" />
  <text class="title" x="28" y="38" fill="#20242c" font-size="18" font-weight="700">Ductile cup-and-cone fracture</text>

  <path class="a1" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" d="M150 74 v-20 M141 63 l9 -11 l9 11" />
  <path class="a1" stroke="#2563eb" stroke-width="3" fill="none" stroke-linecap="round" d="M150 326 v20 M141 337 l9 11 l9 -11" />

  <path class="metal" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"
        d="M116 84 V118 C116 152 132 160 132 192 L150 180 L168 192 C168 160 184 152 184 118 V84 Z" />
  <path class="metal" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"
        d="M116 320 V286 C116 252 132 244 132 218 L150 206 L168 218 C168 244 184 252 184 286 V320 Z" />

  <path class="a2" stroke="#c2410c" stroke-width="2.5" fill="none" d="M172 162 h28" />
  <text class="a2-f" x="206" y="163" fill="#c2410c" font-size="13.5" font-weight="700">necking</text>
  <text class="muted" x="206" y="182" fill="#526173" font-size="12.5">the section thins first</text>
  <text class="muted" x="206" y="199" fill="#526173" font-size="12.5">a visible warning</text>

  <path class="a2" stroke="#c2410c" stroke-width="2.5" fill="none" d="M170 212 h30" />
  <text class="a2-f" x="206" y="246" fill="#c2410c" font-size="13.5" font-weight="700">cup and cone</text>
  <text class="muted" x="206" y="265" fill="#526173" font-size="12.5">the two faces interlock</text>

  <text class="a2-f" x="524" y="72" fill="#c2410c" font-size="13.5" font-weight="700" text-anchor="middle">45° shear lip</text>
  <text class="muted" x="524" y="90" fill="#526173" font-size="12.5" text-anchor="middle">rim tears along maximum shear</text>
  <path class="a2" stroke="#c2410c" stroke-width="2.5" fill="none" d="M524 98 v14" />

  <circle cx="524" cy="212" r="100" class="fill2" fill="#fbe4d4" stroke="none" />
  <circle cx="524" cy="212" r="74" class="fill1" fill="#dbe6fb" stroke="none" />
  <circle cx="524" cy="212" r="100" class="edge" stroke="#64748b" stroke-width="3" fill="none" />
  <circle cx="524" cy="212" r="74" class="edge" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="6 4" />
  <g class="a1-f" fill="#2563eb" opacity="0.8">
    <circle cx="498" cy="188" r="5" /><circle cx="526" cy="178" r="4" /><circle cx="552" cy="194" r="5.5" />
    <circle cx="492" cy="222" r="4.5" /><circle cx="522" cy="212" r="6" /><circle cx="556" cy="228" r="4" />
    <circle cx="504" cy="250" r="5" /><circle cx="540" cy="248" r="4.5" /><circle cx="524" cy="236" r="3.5" />
    <circle cx="510" cy="204" r="3.5" /><circle cx="542" cy="210" r="3.5" />
  </g>

  <path class="a1" stroke="#2563eb" stroke-width="2.5" fill="none" d="M524 314 v14" />
  <text class="a1-f" x="524" y="346" fill="#2563eb" font-size="13.5" font-weight="700" text-anchor="middle">fibrous centre</text>
  <text class="muted" x="524" y="364" fill="#526173" font-size="12.5" text-anchor="middle">microvoids grow and join</text>

  <text class="muted" x="28" y="388" fill="#526173" font-size="13">Necking and shear lips show plastic deformation before the break.</text>
</svg>
