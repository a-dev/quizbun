<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d7dee9;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --bad: #dc2626;
      --good: #0f766e;
      --fill1: #dbe6fb;
      --fill2: #fbe4d4;
      --metal: #cbd5e1;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c48;
        --accent1: #7aa2f7;
        --accent2: #f0a35e;
        --bad: #f2777a;
        --good: #4ec9a0;
        --fill1: #26344a;
        --fill2: #3a2e26;
        --metal: #47536a;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .metal { fill: var(--metal); stroke: var(--edge); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .grid { stroke: var(--grid); }
    .a1 { stroke: var(--accent1); }
    .a1-f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2-f { fill: var(--accent2); }
    .bad { stroke: var(--bad); }
    .bad-f { fill: var(--bad); }
    .good { stroke: var(--good); }
    .good-f { fill: var(--good); }
    .fill1 { fill: var(--fill1); }
    .fill2 { fill: var(--fill2); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="400" rx="20" fill="#f5f7fb" />
  <text class="title" x="28" y="36" fill="#20242c" font-size="18" font-weight="700">SCC needs all three</text>

  <g opacity="0.62">
    <circle cx="258" cy="170" r="102" class="a1-f" fill="#2563eb" />
    <circle cx="402" cy="170" r="102" class="a2-f" fill="#c2410c" />
    <circle cx="330" cy="278" r="102" class="good-f" fill="#0f766e" />
  </g>
  <g fill="none" stroke-width="2.5">
    <circle cx="258" cy="170" r="102" class="a1" stroke="#2563eb" />
    <circle cx="402" cy="170" r="102" class="a2" stroke="#c2410c" />
    <circle cx="330" cy="278" r="102" class="good" stroke="#0f766e" />
  </g>

  <g fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">
    <text x="224" y="118">sustained</text>
    <text x="224" y="136">tensile stress</text>
    <text x="438" y="118">susceptible</text>
    <text x="438" y="136">alloy</text>
    <text x="330" y="336">specific chemical</text>
    <text x="330" y="354">environment</text>
    <text x="330" y="212" font-size="15">SCC</text>
  </g>

  <g transform="translate(534,146)">
    <text class="title" x="0" y="0" fill="#20242c" font-size="14" font-weight="700">Remove any one</text>
    <text class="muted" x="0" y="22" fill="#526173" font-size="12.5">to stop cracking:</text>
    <text class="muted" x="0" y="48" fill="#526173" font-size="12.5">relieve the stress,</text>
    <text class="muted" x="0" y="66" fill="#526173" font-size="12.5">change the alloy, or</text>
    <text class="muted" x="0" y="84" fill="#526173" font-size="12.5">remove the chemical.</text>
  </g>
</svg>
