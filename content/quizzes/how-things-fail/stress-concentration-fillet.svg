<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d7dee9;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --bad: #dc2626;
      --good: #0f766e;
      --fill1: #dbe6fb;
      --fill2: #fbe4d4;
      --metal: #cbd5e1;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c48;
        --accent1: #7aa2f7;
        --accent2: #f0a35e;
        --bad: #f2777a;
        --good: #4ec9a0;
        --fill1: #26344a;
        --fill2: #3a2e26;
        --metal: #47536a;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .metal { fill: var(--metal); stroke: var(--edge); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .grid { stroke: var(--grid); }
    .a1 { stroke: var(--accent1); }
    .a1-f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2-f { fill: var(--accent2); }
    .bad { stroke: var(--bad); }
    .bad-f { fill: var(--bad); }
    .good { stroke: var(--good); }
    .good-f { fill: var(--good); }
    .fill1 { fill: var(--fill1); }
    .fill2 { fill: var(--fill2); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="340" rx="20" fill="#f5f7fb" />
  <text class="title" x="28" y="36" fill="#20242c" font-size="18" font-weight="700">Sharp corners concentrate stress</text>

  <g transform="translate(24,54)">
    <rect class="card" width="322" height="264" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="20" y="32" fill="#20242c" font-size="15" font-weight="700">Sharp shoulder</text>
    <path class="metal" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"
          d="M24 74 H150 V106 H298 V150 H150 V182 H24 Z" />
    <g class="a1" stroke="#2563eb" stroke-width="2" fill="none">
      <path d="M24 86 H142 L156 112 H298" />
      <path d="M24 102 H146 L156 120 H298" />
      <path d="M24 128 H298" />
      <path d="M24 154 H146 L156 136 H298" />
      <path d="M24 170 H142 L156 144 H298" />
    </g>
    <g class="bad" stroke="#dc2626" stroke-width="2.5" fill="none">
      <path d="M150 106 m-11 -11 l22 22 M150 106 m11 -11 l-22 22 M150 106 m0 -15 v30 M150 106 m-15 0 h30" />
      <path d="M150 150 m-11 -11 l22 22 M150 150 m11 -11 l-22 22 M150 150 m0 -15 v30 M150 150 m-15 0 h30" />
    </g>
    <text class="muted" x="20" y="216" fill="#526173" font-size="12.5">Force lines crowd the corner.</text>
    <text class="bad-f" x="20" y="234" fill="#dc2626" font-size="12.5" font-weight="600">Local stress rises above average.</text>
    <text class="muted" x="20" y="252" fill="#526173" font-size="12">A fatigue crack can start here.</text>
  </g>

  <g transform="translate(374,54)">
    <rect class="card" width="322" height="264" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="20" y="32" fill="#20242c" font-size="15" font-weight="700">Generous fillet</text>
    <path class="metal" fill="#cbd5e1" stroke="#64748b" stroke-width="2.5" stroke-linejoin="round"
          d="M24 74 H120 C160 74 158 106 198 106 H298 V150 H198 C158 150 160 182 120 182 H24 Z" />
    <g class="a1" stroke="#2563eb" stroke-width="2" fill="none">
      <path d="M24 86 H112 C158 86 156 112 202 112 H298" />
      <path d="M24 102 H116 C158 102 158 120 204 120 H298" />
      <path d="M24 128 H298" />
      <path d="M24 154 H116 C158 154 158 136 204 136 H298" />
      <path d="M24 170 H112 C158 170 156 144 202 144 H298" />
    </g>
    <text class="muted" x="20" y="216" fill="#526173" font-size="12.5">Force lines bend gradually.</text>
    <text class="good-f" x="20" y="234" fill="#0f766e" font-size="12.5" font-weight="600">Peak stress stays near average.</text>
    <text class="muted" x="20" y="252" fill="#526173" font-size="12">Same material, same load, longer life.</text>
  </g>
</svg>
