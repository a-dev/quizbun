<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d7dee9;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --bad: #dc2626;
      --good: #0f766e;
      --fill1: #dbe6fb;
      --fill2: #fbe4d4;
      --metal: #cbd5e1;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c48;
        --accent1: #7aa2f7;
        --accent2: #f0a35e;
        --bad: #f2777a;
        --good: #4ec9a0;
        --fill1: #26344a;
        --fill2: #3a2e26;
        --metal: #47536a;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .metal { fill: var(--metal); stroke: var(--edge); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .grid { stroke: var(--grid); }
    .a1 { stroke: var(--accent1); }
    .a1-f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2-f { fill: var(--accent2); }
    .bad { stroke: var(--bad); }
    .bad-f { fill: var(--bad); }
    .good { stroke: var(--good); }
    .good-f { fill: var(--good); }
    .fill1 { fill: var(--fill1); }
    .fill2 { fill: var(--fill2); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="400" rx="20" fill="#f5f7fb" />
  <text class="title" x="28" y="38" fill="#20242c" font-size="18" font-weight="700">Fatigue fracture anatomy</text>

  <defs>
    <clipPath id="face">
      <circle cx="200" cy="210" r="135" />
    </clipPath>
  </defs>

  <g clip-path="url(#face)">
    <rect class="metal" x="60" y="70" width="280" height="280" fill="#cbd5e1" stroke="none" />
    <path class="fill2" fill-rule="evenodd" fill="#fbe4d4" d="M60 70 H340 V350 H60 Z M200 345 m-200 0 a200 200 0 1 0 400 0 a200 200 0 1 0 -400 0" />
    <circle cx="200" cy="345" r="40" class="edge" stroke="#64748b" stroke-width="1.6" fill="none" />
    <circle cx="200" cy="345" r="75" class="edge" stroke="#64748b" stroke-width="1.6" fill="none" />
    <circle cx="200" cy="345" r="110" class="edge" stroke="#64748b" stroke-width="1.6" fill="none" />
    <circle cx="200" cy="345" r="145" class="edge" stroke="#64748b" stroke-width="1.6" fill="none" />
    <circle cx="200" cy="345" r="175" class="edge" stroke="#64748b" stroke-width="1.6" fill="none" />
    <circle cx="200" cy="345" r="200" class="a2" stroke="#c2410c" stroke-width="3" fill="none" stroke-dasharray="7 5" />
    <path class="a2" stroke="#c2410c" stroke-width="1.4" fill="none" d="M70 95 l40 22 M110 88 l38 20 M150 82 l36 18 M190 79 l38 19 M232 82 l36 18 M272 90 l36 18 M92 112 l34 18 M170 100 l34 17 M250 102 l34 17" />
  </g>
  <circle cx="200" cy="210" r="135" class="edge" stroke="#64748b" stroke-width="3" fill="none" />
  <path class="a1" stroke="#2563eb" stroke-width="3.5" fill="none" d="M186 344 l14 -14 l14 14" />

  <g class="a1-f" fill="#2563eb">
    <circle cx="200" cy="300" r="14" />
    <circle cx="128" cy="252" r="14" />
    <circle cx="200" cy="106" r="14" />
  </g>
  <g fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">
    <text x="200" y="305">1</text>
    <text x="128" y="257">2</text>
    <text x="200" y="111">3</text>
  </g>

  <g transform="translate(388,74)">
    <circle cx="12" cy="12" r="13" class="a1-f" fill="#2563eb" />
    <text x="12" y="17" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text class="title" x="38" y="10" fill="#20242c" font-size="15" font-weight="700">Initiation site</text>
    <text class="muted" x="38" y="30" fill="#526173" font-size="13">Often a notch, tool mark, keyway,</text>
    <text class="muted" x="38" y="47" fill="#526173" font-size="13">weld toe, or corrosion pit.</text>
  </g>
  <g transform="translate(388,174)">
    <circle cx="12" cy="12" r="13" class="a1-f" fill="#2563eb" />
    <text x="12" y="17" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text class="title" x="38" y="10" fill="#20242c" font-size="15" font-weight="700">Fatigue zone (beach marks)</text>
    <text class="muted" x="38" y="30" fill="#526173" font-size="13">Smooth and burnished. Each arc marks</text>
    <text class="muted" x="38" y="47" fill="#526173" font-size="13">a pause in crack growth.</text>
  </g>
  <g transform="translate(388,274)">
    <circle cx="12" cy="12" r="13" class="a1-f" fill="#2563eb" />
    <text x="12" y="17" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text class="title" x="38" y="10" fill="#20242c" font-size="15" font-weight="700">Final fast fracture</text>
    <text class="muted" x="38" y="30" fill="#526173" font-size="13">Rough and crystalline. The remaining</text>
    <text class="muted" x="38" y="47" fill="#526173" font-size="13">ligament breaks in one cycle.</text>
  </g>

  <text class="muted" x="28" y="384" fill="#526173" font-size="13">Trace beach marks backward to find the crack origin.</text>
</svg>
