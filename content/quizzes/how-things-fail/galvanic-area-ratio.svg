<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d7dee9;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --bad: #dc2626;
      --good: #0f766e;
      --fill1: #dbe6fb;
      --fill2: #fbe4d4;
      --metal: #cbd5e1;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c48;
        --accent1: #7aa2f7;
        --accent2: #f0a35e;
        --bad: #f2777a;
        --good: #4ec9a0;
        --fill1: #26344a;
        --fill2: #3a2e26;
        --metal: #47536a;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .metal { fill: var(--metal); stroke: var(--edge); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .grid { stroke: var(--grid); }
    .a1 { stroke: var(--accent1); }
    .a1-f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2-f { fill: var(--accent2); }
    .bad { stroke: var(--bad); }
    .bad-f { fill: var(--bad); }
    .good { stroke: var(--good); }
    .good-f { fill: var(--good); }
    .fill1 { fill: var(--fill1); }
    .fill2 { fill: var(--fill2); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="340" rx="20" fill="#f5f7fb" />
  <text class="title" x="28" y="36" fill="#20242c" font-size="18" font-weight="700">Area ratio controls galvanic corrosion</text>

  <g transform="translate(24,58)">
    <rect class="card" width="322" height="256" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="20" y="32" fill="#20242c" font-size="15" font-weight="700">Steel plate, copper fasteners</text>
    <rect class="fill2" x="30" y="52" width="252" height="96" rx="4" fill="#fbe4d4" stroke="#c2410c" stroke-width="2.5" />
    <g class="a1-f" fill="#2563eb">
      <circle cx="86" cy="100" r="17" /><circle cx="161" cy="100" r="17" /><circle cx="228" cy="100" r="17" />
    </g>
    <text class="a2-f" x="30" y="176" fill="#c2410c" font-size="12.5" font-weight="600">Anode: large plate</text>
    <text class="a1-f" x="30" y="196" fill="#2563eb" font-size="12.5" font-weight="600">Cathode: small fasteners</text>
    <text class="good-f" x="30" y="228" fill="#0f766e" font-size="13.5" font-weight="700">Damage spread thin</text>
    <text class="muted" x="30" y="248" fill="#526173" font-size="12">A little metal lost over a large area.</text>
  </g>

  <g transform="translate(374,58)">
    <rect class="card" width="322" height="256" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="20" y="32" fill="#20242c" font-size="15" font-weight="700">Copper plate, steel fasteners</text>
    <rect class="fill1" x="30" y="52" width="252" height="96" rx="4" fill="#dbe6fb" stroke="#2563eb" stroke-width="2.5" />
    <g class="a2-f" fill="#c2410c">
      <circle cx="86" cy="100" r="17" /><circle cx="161" cy="100" r="17" /><circle cx="228" cy="100" r="17" />
    </g>
    <g class="bad" stroke="#dc2626" stroke-width="2.5" fill="none">
      <path d="M86 100 m-24 -24 l48 48 M86 100 m24 -24 l-48 48" />
      <path d="M161 100 m-24 -24 l48 48 M161 100 m24 -24 l-48 48" />
      <path d="M228 100 m-24 -24 l48 48 M228 100 m24 -24 l-48 48" />
    </g>
    <text class="a2-f" x="30" y="176" fill="#c2410c" font-size="12.5" font-weight="600">Anode: small fasteners</text>
    <text class="a1-f" x="30" y="196" fill="#2563eb" font-size="12.5" font-weight="600">Cathode: large plate</text>
    <text class="bad-f" x="30" y="228" fill="#dc2626" font-size="13.5" font-weight="700">Damage concentrated</text>
    <text class="muted" x="30" y="248" fill="#526173" font-size="12">The same current eats three small parts.</text>
  </g>
</svg>
