<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ok: #16a34a;
      --slow: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ok: #4ade80;
        --slow: #fb923c;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .ok-edge { stroke: var(--ok); }
    .slow-edge { stroke: var(--slow); }
  </style>

  <rect class="panel" width="720" height="400" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="19" font-weight="700">
    One slow call sets the page's total latency
  </text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect class="card" x="30" y="170" width="110" height="60" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="85" y="196" fill="#20242c" font-size="15" font-weight="700">page</text>
    <text class="muted" x="85" y="214" fill="#526173" font-size="11">100 calls</text>

    <!-- fan-out lines to a representative sample of calls -->
    <line x1="140" y1="200" x2="330" y2="60"  stroke="#16a34a" stroke-width="2" />
    <line x1="140" y1="200" x2="330" y2="110" stroke="#16a34a" stroke-width="2" />
    <line x1="140" y1="200" x2="330" y2="160" stroke="#16a34a" stroke-width="2" />
    <line class="slow-edge" x1="140" y1="200" x2="330" y2="210" stroke="#c2410c" stroke-width="3" />
    <line x1="140" y1="200" x2="330" y2="260" stroke="#16a34a" stroke-width="2" />
    <line x1="140" y1="200" x2="330" y2="310" stroke="#16a34a" stroke-width="2" />
    <line x1="140" y1="200" x2="330" y2="360" stroke="#16a34a" stroke-width="2" />

    <g font-size="12">
      <rect class="card" x="330" y="42" width="130" height="36" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
      <text class="muted" x="395" y="65" fill="#526173">call, fast</text>

      <rect class="card" x="330" y="92" width="130" height="36" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
      <text class="muted" x="395" y="115" fill="#526173">call, fast</text>

      <rect class="card" x="330" y="142" width="130" height="36" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
      <text class="muted" x="395" y="165" fill="#526173">call, fast</text>

      <rect x="330" y="192" width="130" height="36" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2.5" />
      <text x="395" y="215" fill="#c2410c" font-weight="700">call, slow</text>

      <rect class="card" x="330" y="242" width="130" height="36" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
      <text class="muted" x="395" y="265" fill="#526173">call, fast</text>

      <rect class="card" x="330" y="292" width="130" height="36" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
      <text class="muted" x="395" y="315" fill="#526173">call, fast</text>

      <rect class="card" x="330" y="342" width="130" height="36" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5" />
      <text class="muted" x="395" y="365" fill="#526173">&#8230; 93 more, all fast</text>
    </g>

    <line x1="460" y1="210" x2="600" y2="210" stroke="#c2410c" stroke-width="3" stroke-dasharray="6 5" />
    <rect x="600" y="188" width="90" height="44" rx="10" fill="#ffffff" stroke="#c2410c" stroke-width="2.5" />
    <text x="645" y="206" fill="#c2410c" font-size="12" font-weight="700">page total</text>
    <text x="645" y="222" fill="#c2410c" font-size="12" font-weight="700">= slow call</text>
  </g>

  <text class="muted" x="36" y="392" font-family="system-ui, sans-serif" fill="#526173" font-size="12">
    99 fast calls don't help. The page waits for all of them, so it finishes only as fast as the slowest one.
  </text>
</svg>
