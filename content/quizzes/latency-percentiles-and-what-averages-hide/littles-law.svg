<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --arrival: #16a34a;
      --depart: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --arrival: #4ade80;
        --depart: #60a5fa;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .arrival-edge { stroke: var(--arrival); }
    .depart-edge { stroke: var(--depart); }
  </style>

  <rect class="panel" width="720" height="320" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="19" font-weight="700">
    Little&#8217;s Law: L = &#955;W
  </text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <!-- arrivals -->
    <circle cx="70" cy="170" r="10" fill="#16a34a" />
    <circle cx="105" cy="170" r="10" fill="#16a34a" />
    <circle cx="140" cy="170" r="10" fill="#16a34a" />
    <line class="arrival-edge" x1="30" y1="170" x2="170" y2="170" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowg)" />
    <defs>
      <marker id="arrowg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#16a34a" />
      </marker>
      <marker id="arrowb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
        <path d="M0,0 L6,3 L0,6 Z" fill="#2563eb" />
      </marker>
    </defs>
    <text x="100" y="140" fill="#16a34a" font-size="15" font-weight="700">arrivals, &#955;</text>

    <!-- system box -->
    <rect class="card" x="230" y="90" width="260" height="160" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="360" y="115" fill="#20242c" font-size="15" font-weight="700">system</text>

    <circle cx="290" cy="160" r="9" fill="#526173" />
    <circle cx="330" cy="190" r="9" fill="#526173" />
    <circle cx="380" cy="150" r="9" fill="#526173" />
    <circle cx="420" cy="200" r="9" fill="#526173" />
    <circle cx="440" cy="150" r="9" fill="#526173" />
    <text class="muted" x="360" y="235" fill="#526173" font-size="14" font-weight="700">L in flight</text>

    <!-- departures -->
    <line class="depart-edge" x1="500" y1="170" x2="640" y2="170" stroke="#2563eb" stroke-width="2" marker-end="url(#arrowb)" />
    <circle cx="580" cy="170" r="10" fill="#2563eb" />
    <circle cx="615" cy="170" r="10" fill="#2563eb" />
    <text x="580" y="140" fill="#2563eb" font-size="15" font-weight="700">departures</text>

    <!-- W bracket across the system -->
    <line x1="230" y1="270" x2="490" y2="270" stroke="#64748b" stroke-width="1.5" />
    <line x1="230" y1="264" x2="230" y2="276" stroke="#64748b" stroke-width="1.5" />
    <line x1="490" y1="264" x2="490" y2="276" stroke="#64748b" stroke-width="1.5" />
    <text class="muted" x="360" y="296" fill="#526173" font-size="14" font-weight="700">average time in system, W</text>
  </g>
</svg>
