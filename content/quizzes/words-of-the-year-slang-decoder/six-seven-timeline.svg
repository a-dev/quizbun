<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent: #b45309;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent: #f59e0b;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .card { fill: var(--card); stroke: var(--edge); }
    .dot { fill: var(--card); stroke: var(--edge); }
    .accent { fill: var(--accent); }
    .accent-stroke { stroke: var(--accent); }
  </style>

  <rect class="panel" width="720" height="520" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    How 6-7 went from a rap song to Word of the Year
  </text>

  <path class="edge" d="M150 96V476" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

  <g font-family="system-ui, sans-serif">
    <circle class="dot" cx="150" cy="104" r="9" fill="#ffffff" stroke="#64748b" stroke-width="3" />
    <text class="muted" x="126" y="109" fill="#526173" font-size="14" text-anchor="end">Dec 2024</text>
    <rect class="card" x="176" y="80" width="508" height="48" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="194" y="110" fill="#20242c" font-size="16">Skrilla releases the drill track "Doot Doot (6 7)"</text>

    <circle class="dot" cx="150" cy="178" r="9" fill="#ffffff" stroke="#64748b" stroke-width="3" />
    <text class="muted" x="126" y="183" fill="#526173" font-size="14" text-anchor="end">Next</text>
    <rect class="card" x="176" y="154" width="508" height="48" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="194" y="184" fill="#20242c" font-size="16">Fan edits pair it with LaMelo Ball, listed at 6 ft 7 in</text>

    <circle class="dot" cx="150" cy="252" r="9" fill="#ffffff" stroke="#64748b" stroke-width="3" />
    <text class="muted" x="126" y="257" fill="#526173" font-size="14" text-anchor="end">Mar 2025</text>
    <rect class="card" x="176" y="228" width="508" height="48" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="194" y="258" fill="#20242c" font-size="16">A clip of a boy yelling it at a basketball game goes viral</text>

    <circle class="dot" cx="150" cy="326" r="9" fill="#ffffff" stroke="#64748b" stroke-width="3" />
    <text class="muted" x="126" y="331" fill="#526173" font-size="14" text-anchor="end">Summer 2025</text>
    <rect class="card" x="176" y="302" width="508" height="48" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="194" y="332" fill="#20242c" font-size="16">Searches for "67" grow more than sixfold after June</text>

    <circle class="dot" cx="150" cy="400" r="9" fill="#ffffff" stroke="#64748b" stroke-width="3" />
    <text class="muted" x="126" y="405" fill="#526173" font-size="14" text-anchor="end">15 Oct 2025</text>
    <rect class="card" x="176" y="376" width="508" height="48" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="194" y="406" fill="#20242c" font-size="16">South Park's season 28 premiere parodies it</text>

    <circle class="accent" cx="150" cy="474" r="11" fill="#b45309" />
    <text class="accent" x="126" y="479" fill="#b45309" font-size="14" font-weight="700" text-anchor="end">29 Oct 2025</text>
    <rect class="card accent-stroke" x="176" y="450" width="508" height="48" rx="12" fill="#ffffff" stroke="#b45309" stroke-width="3" />
    <text class="title" x="194" y="480" fill="#20242c" font-size="16" font-weight="700">Dictionary.com names "67" its 2025 Word of the Year</text>
  </g>
</svg>
