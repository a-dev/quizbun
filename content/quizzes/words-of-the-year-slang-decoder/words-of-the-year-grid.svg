<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent: #b45309;
      --accent-bg: #fef3c7;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent: #f59e0b;
        --accent-bg: #3a2c12;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .hot { fill: var(--accent-bg); stroke: var(--accent); }
    .accent { fill: var(--accent); }
  </style>

  <rect class="panel" width="720" height="400" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Words of the Year, 2023–2025
  </text>

  <g font-family="system-ui, sans-serif" font-size="16">
    <text class="muted" x="274" y="92" fill="#526173" font-size="14" font-weight="700" text-anchor="middle">2023</text>
    <text class="muted" x="434" y="92" fill="#526173" font-size="14" font-weight="700" text-anchor="middle">2024</text>
    <text class="accent" x="594" y="92" fill="#b45309" font-size="14" font-weight="700" text-anchor="middle">2025</text>

    <text class="title" x="36" y="133" fill="#20242c" font-weight="700">Oxford</text>
    <rect class="card" x="200" y="108" width="148" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="274" y="133" fill="#20242c" text-anchor="middle">rizz</text>
    <rect class="card" x="360" y="108" width="148" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="434" y="133" fill="#20242c" text-anchor="middle">brain rot</text>
    <rect class="hot" x="520" y="108" width="148" height="40" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
    <text class="title" x="594" y="133" fill="#20242c" font-weight="700" text-anchor="middle">rage bait</text>

    <text class="title" x="36" y="185" fill="#20242c" font-weight="700">Merriam-Webster</text>
    <rect class="card" x="200" y="160" width="148" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="274" y="185" fill="#20242c" text-anchor="middle">authentic</text>
    <rect class="card" x="360" y="160" width="148" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="434" y="185" fill="#20242c" text-anchor="middle">polarization</text>
    <rect class="hot" x="520" y="160" width="148" height="40" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
    <text class="title" x="594" y="185" fill="#20242c" font-weight="700" text-anchor="middle">slop</text>

    <text class="title" x="36" y="237" fill="#20242c" font-weight="700">Collins</text>
    <rect class="card" x="200" y="212" width="148" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="274" y="237" fill="#20242c" text-anchor="middle">AI</text>
    <rect class="card" x="360" y="212" width="148" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="434" y="237" fill="#20242c" text-anchor="middle">brat</text>
    <rect class="hot" x="520" y="212" width="148" height="40" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
    <text class="title" x="594" y="237" fill="#20242c" font-weight="700" text-anchor="middle">vibe coding</text>

    <text class="title" x="36" y="289" fill="#20242c" font-weight="700">Cambridge</text>
    <rect class="card" x="200" y="264" width="148" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="274" y="289" fill="#20242c" text-anchor="middle">hallucinate</text>
    <rect class="card" x="360" y="264" width="148" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="434" y="289" fill="#20242c" text-anchor="middle">manifest</text>
    <rect class="hot" x="520" y="264" width="148" height="40" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
    <text class="title" x="594" y="289" fill="#20242c" font-weight="700" text-anchor="middle">parasocial</text>

    <text class="title" x="36" y="341" fill="#20242c" font-weight="700">Dictionary.com</text>
    <rect class="card" x="200" y="316" width="148" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="274" y="341" fill="#20242c" text-anchor="middle">hallucinate</text>
    <rect class="card" x="360" y="316" width="148" height="40" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="434" y="341" fill="#20242c" text-anchor="middle">demure</text>
    <rect class="hot" x="520" y="316" width="148" height="40" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
    <text class="title" x="594" y="341" fill="#20242c" font-weight="700" text-anchor="middle">67</text>
  </g>
</svg>
