<svg xmlns="http://www.w3.org/2000/svg" width="720" height="572" viewBox="0 0 720 572">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ok-fill: #dcfce7;
      --ok-edge: #16a34a;
      --ok-text: #14532d;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ok-fill: #14321f;
        --ok-edge: #4ade80;
        --ok-text: #bbf7d0;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .ok-box { fill: var(--ok-fill); stroke: var(--ok-edge); }
    .ok-text { fill: var(--ok-text); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
    .accent-line { stroke: var(--accent-edge); }
  </style>

  <rect class="panel" width="720" height="572" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Characters are not bytes
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Four characters, five bytes, and a boundary in the wrong place ruins one of them.
  </text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text class="muted" x="36" y="98" fill="#526173" font-size="12" text-anchor="start">characters</text>

    <rect class="card" x="36" y="106" width="120" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="96" y="133" fill="#20242c" font-size="17" font-weight="700">c</text>
    <rect class="card" x="166" y="106" width="120" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="226" y="133" fill="#20242c" font-size="17" font-weight="700">a</text>
    <rect class="card" x="296" y="106" width="120" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="356" y="133" fill="#20242c" font-size="17" font-weight="700">f</text>
    <rect class="info-box" x="426" y="106" width="250" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="551" y="133" fill="#172554" font-size="17" font-weight="700">é, two bytes</text>

    <text class="muted" x="36" y="172" fill="#526173" font-size="12" text-anchor="start">UTF-8 bytes</text>

    <rect class="card" x="36" y="180" width="120" height="44" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="96" y="209" fill="#20242c" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">63</text>
    <rect class="card" x="166" y="180" width="120" height="44" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="226" y="209" fill="#20242c" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">61</text>
    <rect class="card" x="296" y="180" width="120" height="44" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="356" y="209" fill="#20242c" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">66</text>
    <rect class="info-box" x="426" y="180" width="120" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="486" y="209" fill="#172554" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">C3</text>
    <rect class="info-box" x="556" y="180" width="120" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="616" y="209" fill="#172554" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">A9</text>
  </g>

  <g font-family="system-ui, sans-serif">
    <text class="title" x="36" y="256" fill="#20242c" font-size="14" font-weight="700"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Buffer.byteLength('café', 'utf8') === 5</tspan>, characters and bytes are different units.</text>

    <text class="title" x="36" y="292" fill="#20242c" font-size="15" font-weight="700">Now let a chunk boundary land between those two bytes</text>
  </g>

  <g fill="none" class="accent-line" stroke="#c2410c" stroke-width="2.2" stroke-dasharray="5 4">
    <path d="M424,300 L424,428" />
  </g>

  <g font-family="system-ui, sans-serif">
    <rect class="card" x="36" y="306" width="380" height="118" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="330" fill="#20242c" font-size="13.5" font-weight="700">chunk 1</text>
    <text class="title" x="52" y="398" fill="#20242c" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">chunk.toString() → 'caf�'</text>
    <text class="muted" x="52" y="414" fill="#526173" font-size="11">the lone C3 is not a complete sequence</text>

    <rect class="card" x="432" y="306" width="252" height="118" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="448" y="330" fill="#20242c" font-size="13.5" font-weight="700">chunk 2</text>
    <text class="title" x="448" y="398" fill="#20242c" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">chunk.toString() → '�'</text>
    <text class="muted" x="448" y="414" fill="#526173" font-size="11">a continuation byte with nothing to continue</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-size="14" font-weight="700">
    <rect class="card" x="52" y="340" width="80" height="36" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="92" y="364" fill="#20242c">63</text>
    <rect class="card" x="140" y="340" width="80" height="36" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="180" y="364" fill="#20242c">61</text>
    <rect class="card" x="228" y="340" width="80" height="36" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="268" y="364" fill="#20242c">66</text>
    <rect class="info-box" x="316" y="340" width="80" height="36" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="356" y="364" fill="#172554">C3</text>

    <rect class="info-box" x="448" y="340" width="80" height="36" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="488" y="364" fill="#172554">A9</text>
  </g>

  <g font-family="system-ui, sans-serif">
    <rect class="ok-box" x="36" y="440" width="648" height="46" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ok-text" x="52" y="468" fill="#14532d" font-size="13" font-weight="700">Fix: concatenate the <tspan font-style="italic">bytes</tspan> first with <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">Buffer.concat</tspan>, or decode through <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">StringDecoder</tspan>.</text>

    <rect class="accent-box" x="36" y="500" width="648" height="56" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="52" y="524" fill="#9a3412" font-size="13" font-weight="700"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">data += chunk</tspan> does this to every chunk of a binary file: each Buffer is decoded as UTF-8,</text>
    <text class="accent-text" x="52" y="544" fill="#9a3412" font-size="13" font-weight="700">every invalid byte collapses to <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">'�'</tspan>, and the original bytes are gone for good.</text>
  </g>
</svg>
