<svg xmlns="http://www.w3.org/2000/svg" width="720" height="562" viewBox="0 0 720 562">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <rect class="panel" width="720" height="562" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    One ArrayBuffer, several views
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    The bytes are fixed. What you get back depends entirely on the view you read them through.
  </text>

  <g font-family="system-ui, sans-serif">
    <text class="title" x="36" y="96" fill="#20242c" font-size="13.5" font-weight="700"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">new ArrayBuffer(8)</tspan>: raw memory, with no element accessors of its own</text>
    <text class="title" x="36" y="172" fill="#20242c" font-size="13.5" font-weight="700"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">new Uint8Array(ab)</tspan>: one element per byte</text>
    <text class="title" x="36" y="244" fill="#20242c" font-size="13.5" font-weight="700"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">new Uint32Array(ab)</tspan>: four bytes per element, so two elements fit</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <rect class="card" x="36" y="106" width="76" height="44" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="74" y="128" fill="#20242c" font-size="15" font-weight="700">00</text>
    <text class="muted" x="74" y="144" fill="#526173" font-size="10">byte 0</text>
    <rect class="card" x="116" y="106" width="76" height="44" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="154" y="128" fill="#20242c" font-size="15" font-weight="700">00</text>
    <text class="muted" x="154" y="144" fill="#526173" font-size="10">byte 1</text>
    <rect class="card" x="196" y="106" width="76" height="44" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="234" y="128" fill="#20242c" font-size="15" font-weight="700">00</text>
    <text class="muted" x="234" y="144" fill="#526173" font-size="10">byte 2</text>
    <rect class="card" x="276" y="106" width="76" height="44" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="314" y="128" fill="#20242c" font-size="15" font-weight="700">01</text>
    <text class="muted" x="314" y="144" fill="#526173" font-size="10">byte 3</text>
    <rect class="card" x="356" y="106" width="76" height="44" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="394" y="128" fill="#20242c" font-size="15" font-weight="700">01</text>
    <text class="muted" x="394" y="144" fill="#526173" font-size="10">byte 4</text>
    <rect class="card" x="436" y="106" width="76" height="44" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="474" y="128" fill="#20242c" font-size="15" font-weight="700">00</text>
    <text class="muted" x="474" y="144" fill="#526173" font-size="10">byte 5</text>
    <rect class="card" x="516" y="106" width="76" height="44" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="554" y="128" fill="#20242c" font-size="15" font-weight="700">00</text>
    <text class="muted" x="554" y="144" fill="#526173" font-size="10">byte 6</text>
    <rect class="card" x="596" y="106" width="76" height="44" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="634" y="128" fill="#20242c" font-size="15" font-weight="700">00</text>
    <text class="muted" x="634" y="144" fill="#526173" font-size="10">byte 7</text>
    <rect class="card" x="36" y="182" width="76" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="74" y="208" fill="#20242c" font-size="15" font-weight="700">0</text>
    <rect class="card" x="116" y="182" width="76" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="154" y="208" fill="#20242c" font-size="15" font-weight="700">0</text>
    <rect class="card" x="196" y="182" width="76" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="234" y="208" fill="#20242c" font-size="15" font-weight="700">0</text>
    <rect class="card" x="276" y="182" width="76" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="314" y="208" fill="#20242c" font-size="15" font-weight="700">1</text>
    <rect class="card" x="356" y="182" width="76" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="394" y="208" fill="#20242c" font-size="15" font-weight="700">1</text>
    <rect class="card" x="436" y="182" width="76" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="474" y="208" fill="#20242c" font-size="15" font-weight="700">0</text>
    <rect class="card" x="516" y="182" width="76" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="554" y="208" fill="#20242c" font-size="15" font-weight="700">0</text>
    <rect class="card" x="596" y="182" width="76" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="634" y="208" fill="#20242c" font-size="15" font-weight="700">0</text>
    <rect class="info-box" x="36" y="254" width="316" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="194" y="273" fill="#172554" font-size="14" font-weight="700">element 0</text>
    <text class="info-text" x="194" y="290" fill="#172554" font-size="10.5" font-family="system-ui, sans-serif">four bytes, assembled into one number</text>
    <rect class="info-box" x="356" y="254" width="316" height="44" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="514" y="273" fill="#172554" font-size="14" font-weight="700">element 1</text>
    <text class="info-text" x="514" y="290" fill="#172554" font-size="10.5" font-family="system-ui, sans-serif">four bytes, assembled into one number</text>
  </g>
  <g font-family="system-ui, sans-serif">
    <text class="title" x="36" y="332" fill="#20242c" font-size="15" font-weight="700">The same four bytes, two ways round</text>

    <rect class="card" x="36" y="344" width="316" height="120" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="370" fill="#20242c" font-size="13.5" font-weight="700">bytes 0–3: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">00 00 00 01</tspan></text>
    <text class="title" x="52" y="398" fill="#20242c" font-size="12.5" font-weight="700"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">readUInt32BE</tspan> → 1</text>
    <text class="muted" x="52" y="414" fill="#526173" font-size="11">most significant byte first</text>
    <text class="title" x="52" y="440" fill="#20242c" font-size="12.5" font-weight="700"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">readUInt32LE</tspan> → 16 777 216</text>
    <text class="muted" x="52" y="456" fill="#526173" font-size="11">least significant byte first</text>

    <rect class="card" x="368" y="344" width="316" height="120" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="384" y="370" fill="#20242c" font-size="13.5" font-weight="700">bytes 4–7: <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">01 00 00 00</tspan></text>
    <text class="title" x="384" y="398" fill="#20242c" font-size="12.5" font-weight="700"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">readUInt32BE</tspan> → 16 777 216</text>
    <text class="muted" x="384" y="414" fill="#526173" font-size="11">most significant byte first</text>
    <text class="title" x="384" y="440" fill="#20242c" font-size="12.5" font-weight="700"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">readUInt32LE</tspan> → 1</text>
    <text class="muted" x="384" y="456" fill="#526173" font-size="11">least significant byte first</text>

    <rect class="accent-box" x="36" y="480" width="648" height="62" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="52" y="506" fill="#9a3412" font-size="13" font-weight="700">Endianness is only the order in which a view assembles bytes. The bytes themselves never move.</text>
    <text class="accent-text" x="52" y="526" fill="#9a3412" font-size="13" font-weight="700">Four bytes per element is also why <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">new Uint32Array(4).byteLength === 16</tspan>.</text>
  </g>
</svg>
