<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">A great circle and a rhumb line on Mercator</title>
  <desc id="desc">A Mercator grid shows a curved, shorter great-circle route and a straight, longer rhumb line between the same endpoints.</desc>
  <style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#c7d0dd; --blue:#2563eb; --orange:#c2410c; --teal:#0f766e; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#465161; --blue:#7aa2f7; --orange:#f0a35e; --teal:#4ec9a0; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); } .muted { fill:var(--muted); }
  </style>
  <rect width="760" height="420" rx="20" fill="var(--bg)"/>
  <text x="28" y="38" font-size="19" font-weight="700">On Mercator, the shortest route usually looks curved</text>
  <rect x="28" y="66" width="704" height="270" rx="14" fill="var(--panel)" stroke="var(--grid)"/>
  <path d="M118 66v270M208 66v270M298 66v270M388 66v270M478 66v270M568 66v270M658 66v270" stroke="var(--grid)"/>
  <path d="M28 102h704M28 154h704M28 216h704M28 278h704M28 318h704" stroke="var(--grid)"/>
  <path d="M120 270 640 250" fill="none" stroke="var(--orange)" stroke-width="4" stroke-linecap="round"/>
  <path d="M120 270C255 91 503 82 640 250" fill="none" stroke="var(--blue)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="120" cy="270" r="7" fill="var(--ink)"/><circle cx="640" cy="250" r="7" fill="var(--ink)"/>
  <text x="380" y="111" text-anchor="middle" font-size="14" font-weight="700" fill="var(--blue)">great circle · shorter · changing bearing</text>
  <text x="382" y="296" text-anchor="middle" font-size="14" font-weight="700" fill="var(--orange)">rhumb line · straight · constant bearing</text>
  <g transform="translate(185 246)"><path d="M0 24V-16M0 24l30-1" stroke="var(--teal)" stroke-width="2"/><path d="M0 24 28 23" stroke="var(--orange)" stroke-width="3"/><path d="M12 23a12 12 0 0 0-12-12" fill="none" stroke="var(--teal)"/></g>
  <g transform="translate(535 252)"><path d="M0 24V-16M0 24l30-1" stroke="var(--teal)" stroke-width="2"/><path d="M0 24 28 23" stroke="var(--orange)" stroke-width="3"/><path d="M12 23a12 12 0 0 0-12-12" fill="none" stroke="var(--teal)"/></g>
  <text class="muted" x="380" y="374" text-anchor="middle" font-size="13">The straight route crosses every meridian at the same angle.</text>
</svg>
