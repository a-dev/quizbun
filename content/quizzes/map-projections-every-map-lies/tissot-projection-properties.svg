<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
  <title id="title">Tissot indicatrices for three projection properties</title>
  <desc id="desc">Conformal maps produce circles of changing size. Equal-area maps produce ellipses of equal area. Compromise maps allow both size and shape to change.</desc>
  <style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#d0d8e4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#465161; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); } .muted { fill:var(--muted); } .row { fill:var(--panel); stroke:var(--grid); }
  </style>
  <rect width="760" height="430" rx="20" fill="var(--bg)"/>
  <text x="28" y="38" font-size="19" font-weight="700">Read the property from the ellipses</text>
  <g transform="translate(24 62)">
    <rect class="row" width="712" height="102" rx="14"/>
    <text x="22" y="31" font-size="15" font-weight="700">Conformal</text><text class="muted" x="22" y="54" font-size="13">same shape</text><text class="muted" x="22" y="74" font-size="13">size may change</text>
    <circle cx="250" cy="51" r="20" fill="none" stroke="var(--blue)" stroke-width="3"/>
    <circle cx="410" cy="51" r="31" fill="none" stroke="var(--blue)" stroke-width="3"/>
    <circle cx="590" cy="51" r="42" fill="none" stroke="var(--blue)" stroke-width="3"/>
  </g>
  <g transform="translate(24 174)">
    <rect class="row" width="712" height="102" rx="14"/>
    <text x="22" y="31" font-size="15" font-weight="700">Equal-area</text><text class="muted" x="22" y="54" font-size="13">same area</text><text class="muted" x="22" y="74" font-size="13">shape may change</text>
    <ellipse cx="250" cy="51" rx="24" ry="36" fill="none" stroke="var(--teal)" stroke-width="3"/>
    <ellipse cx="410" cy="51" rx="36" ry="24" fill="none" stroke="var(--teal)" stroke-width="3" transform="rotate(-18 410 51)"/>
    <ellipse cx="590" cy="51" rx="54" ry="16" fill="none" stroke="var(--teal)" stroke-width="3" transform="rotate(18 590 51)"/>
  </g>
  <g transform="translate(24 286)">
    <rect class="row" width="712" height="102" rx="14"/>
    <text x="22" y="31" font-size="15" font-weight="700">Compromise</text><text class="muted" x="22" y="54" font-size="13">size and shape</text><text class="muted" x="22" y="74" font-size="13">may both change</text>
    <ellipse cx="250" cy="51" rx="20" ry="27" fill="none" stroke="var(--orange)" stroke-width="3"/>
    <ellipse cx="410" cy="51" rx="42" ry="24" fill="none" stroke="var(--orange)" stroke-width="3" transform="rotate(-14 410 51)"/>
    <ellipse cx="590" cy="51" rx="58" ry="18" fill="none" stroke="var(--orange)" stroke-width="3" transform="rotate(24 590 51)"/>
  </g>
</svg>
