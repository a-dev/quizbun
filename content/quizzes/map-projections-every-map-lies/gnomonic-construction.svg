<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Gnomonic projection from the center of a sphere</title>
  <desc id="desc">Rays from a sphere's center pass through points on the near hemisphere and meet a tangent map plane. A plane through the center cuts both the globe and map plane, turning its great circle into a straight line.</desc>
  <style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --orange:#c2410c; --teal:#0f766e; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --orange:#f0a35e; --teal:#4ec9a0; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); } .muted { fill:var(--muted); }
  </style>
  <rect width="760" height="420" rx="20" fill="var(--bg)"/>
  <text x="28" y="38" font-size="19" font-weight="700">Project from the globe's center onto a tangent plane</text>
  <circle cx="286" cy="224" r="126" fill="var(--panel)" stroke="var(--grid)" stroke-width="2"/>
  <ellipse cx="286" cy="224" rx="126" ry="43" fill="none" stroke="var(--blue)" stroke-width="4" transform="rotate(-18 286 224)"/>
  <circle cx="286" cy="224" r="6" fill="var(--ink)"/>
  <line x1="510" y1="69" x2="510" y2="369" stroke="var(--teal)" stroke-width="5"/>
  <polygon points="286,224 510,91 510,331" fill="color-mix(in srgb, var(--orange) 12%, transparent)" stroke="var(--orange)" stroke-width="2"/>
  <path d="M286 224 510 132M286 224 510 224M286 224 510 316" stroke="var(--orange)" stroke-width="2"/>
  <circle cx="409" cy="174" r="6" fill="var(--orange)"/><circle cx="412" cy="276" r="6" fill="var(--orange)"/>
  <circle cx="510" cy="132" r="6" fill="var(--teal)"/><circle cx="510" cy="316" r="6" fill="var(--teal)"/>
  <text x="527" y="87" font-size="14" font-weight="700" fill="var(--teal)">tangent map plane</text>
  <text class="muted" x="527" y="110" font-size="13">great-circle plane meets it</text>
  <text class="muted" x="527" y="129" font-size="13">along one straight line</text>
  <text x="272" y="244" text-anchor="end" font-size="13">center</text>
  <text x="286" y="378" text-anchor="middle" font-size="13" fill="var(--blue)">great circle</text>
</svg>
