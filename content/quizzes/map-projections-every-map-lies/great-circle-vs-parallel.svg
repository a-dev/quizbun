<svg xmlns="http://www.w3.org/2000/svg" width="760" height="410" viewBox="0 0 760 410" role="img" aria-labelledby="title desc">
  <title id="title">Great-circle route between two points at 50 degrees north</title>
  <desc id="desc">Two points on the same northern parallel are joined by the parallel and by a great-circle arc that curves toward the pole.</desc>
  <style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --orange:#c2410c; --teal:#0f766e; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --orange:#f0a35e; --teal:#4ec9a0; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); } .muted { fill:var(--muted); }
  </style>
  <rect width="760" height="410" rx="20" fill="var(--bg)"/>
  <text x="28" y="38" font-size="19" font-weight="700">Same latitude does not mean shortest route</text>
  <path d="M111 326a269 269 0 0 1 538 0" fill="var(--panel)" stroke="var(--grid)" stroke-width="2"/>
  <path d="M150 253c123 60 337 60 460 0" fill="none" stroke="var(--grid)"/>
  <path d="M194 185c103 49 269 49 372 0" fill="none" stroke="var(--grid)"/>
  <path d="M254 125c70 32 182 32 252 0" fill="none" stroke="var(--grid)"/>
  <path d="M380 57v269M240 98c83 66 83 162 0 228M520 98c-83 66-83 162 0 228" fill="none" stroke="var(--grid)"/>
  <path d="M201 222c105 50 253 50 358 0" fill="none" stroke="var(--orange)" stroke-width="3" stroke-dasharray="8 7"/>
  <path d="M201 222c90-112 268-112 358 0" fill="none" stroke="var(--blue)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="201" cy="222" r="7" fill="var(--ink)"/><circle cx="559" cy="222" r="7" fill="var(--ink)"/>
  <circle cx="380" cy="57" r="5" fill="var(--teal)"/>
  <text x="395" y="63" font-size="13" fill="var(--teal)">North pole</text>
  <text x="380" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="var(--blue)">great circle</text>
  <text x="380" y="288" text-anchor="middle" font-size="14" font-weight="700" fill="var(--orange)">50° N parallel</text>
  <text class="muted" x="380" y="375" text-anchor="middle" font-size="13">The great circle reaches a higher latitude, then returns to 50° N.</text>
</svg>
