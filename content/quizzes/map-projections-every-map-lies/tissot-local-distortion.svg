<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">How Tissot's indicatrix records local distortion</title>
  <desc id="desc">A tiny circle on a globe becomes an ellipse on a flat map. The ellipse's area, axis ratio, and orientation record different local distortions.</desc>
  <style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); } .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); } .grid { fill:none; stroke:var(--grid); }
  </style>
  <rect width="760" height="400" rx="20" fill="var(--bg)"/>
  <text x="28" y="38" font-size="19" font-weight="700">A tiny circle becomes a local distortion report</text>
  <g transform="translate(30 69)">
    <rect class="panel" width="220" height="270" rx="16"/>
    <text x="110" y="31" text-anchor="middle" font-size="15" font-weight="700">On the globe</text>
    <circle cx="110" cy="137" r="75" fill="none" stroke="var(--blue)" stroke-width="3"/>
    <ellipse class="grid" cx="110" cy="137" rx="75" ry="28"/>
    <path class="grid" d="M110 62c-35 21-35 129 0 150M110 62c35 21 35 129 0 150"/>
    <circle cx="140" cy="111" r="18" fill="color-mix(in srgb, var(--orange) 20%, transparent)" stroke="var(--orange)" stroke-width="3"/>
    <text class="muted" x="110" y="242" text-anchor="middle" font-size="13">infinitesimal circle</text>
  </g>
  <path d="M280 203h70" stroke="var(--teal)" stroke-width="3" stroke-linecap="round"/>
  <path fill="var(--teal)" d="m344 195 14 8-14 8z"/>
  <text class="muted" x="319" y="184" text-anchor="middle" font-size="13">projection</text>
  <g transform="translate(382 69)">
    <rect class="panel" width="348" height="270" rx="16"/>
    <text x="174" y="31" text-anchor="middle" font-size="15" font-weight="700">On the flat map</text>
    <g transform="translate(112 133) rotate(-24)">
      <ellipse cx="0" cy="0" rx="66" ry="31" fill="color-mix(in srgb, var(--orange) 20%, transparent)" stroke="var(--orange)" stroke-width="3"/>
      <line x1="-66" y1="0" x2="66" y2="0" stroke="var(--orange)" stroke-width="2"/>
      <line x1="0" y1="-31" x2="0" y2="31" stroke="var(--orange)" stroke-width="2"/>
    </g>
    <path d="M164 105h10" stroke="var(--grid)"/>
    <text x="184" y="108" font-size="12">orientation = strongest stretch</text>
    <path d="M157 135h17" stroke="var(--grid)"/>
    <text x="184" y="139" font-size="12">axis ratio = angular distortion</text>
    <path d="M150 166h24" stroke="var(--grid)"/>
    <text x="184" y="170" font-size="12">ellipse area = area scale</text>
    <text class="muted" x="174" y="242" text-anchor="middle" font-size="13">enlarged here so it is visible</text>
  </g>
</svg>
