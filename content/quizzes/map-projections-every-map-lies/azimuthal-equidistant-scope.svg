<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">What an azimuthal equidistant projection preserves</title>
  <desc id="desc">Rays from the center of a circular map preserve distance and bearing. A connection between two points away from the center is not generally true to scale.</desc>
  <style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --orange:#c2410c; --teal:#0f766e; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --orange:#f0a35e; --teal:#4ec9a0; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); } .muted { fill:var(--muted); }
  </style>
  <rect width="760" height="420" rx="20" fill="var(--bg)"/>
  <text x="28" y="38" font-size="19" font-weight="700">Distance and bearing are true only from the center</text>
  <circle cx="255" cy="225" r="152" fill="var(--panel)" stroke="var(--grid)" stroke-width="2"/>
  <circle cx="255" cy="225" r="51" fill="none" stroke="var(--grid)"/><circle cx="255" cy="225" r="101" fill="none" stroke="var(--grid)"/>
  <path d="M255 73v304M103 225h304M148 118l214 214M148 332l214-214" stroke="var(--grid)"/>
  <path d="M255 225 355 112M255 225 382 281M255 225 160 326" stroke="var(--blue)" stroke-width="4" stroke-linecap="round"/>
  <circle cx="255" cy="225" r="8" fill="var(--teal)"/><circle cx="355" cy="112" r="7" fill="var(--ink)"/><circle cx="382" cy="281" r="7" fill="var(--ink)"/><circle cx="160" cy="326" r="7" fill="var(--ink)"/>
  <path d="M355 112Q463 174 382 281" fill="none" stroke="var(--orange)" stroke-width="4" stroke-dasharray="8 7"/>
  <text x="272" y="219" font-size="13" font-weight="700" fill="var(--teal)">center</text>
  <g transform="translate(458 126)"><line x1="0" y1="0" x2="42" y2="0" stroke="var(--blue)" stroke-width="4"/><text x="56" y="5" font-size="14">true distance</text><text class="muted" x="56" y="25" font-size="13">and true bearing</text></g>
  <g transform="translate(458 226)"><line x1="0" y1="0" x2="42" y2="0" stroke="var(--orange)" stroke-width="4" stroke-dasharray="8 7"/><text x="56" y="5" font-size="14">not generally true</text><text class="muted" x="56" y="25" font-size="13">between two other points</text></g>
  <text class="muted" x="458" y="331" font-size="13">Concentric rings mark equal</text><text class="muted" x="458" y="350" font-size="13">distance steps from the center.</text>
</svg>
