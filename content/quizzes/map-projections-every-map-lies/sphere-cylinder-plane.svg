<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" role="img" aria-labelledby="title desc">
  <title id="title">Why a sphere cannot be flattened without distortion</title>
  <desc id="desc">A sphere has positive Gaussian curvature. A cylinder and a plane both have zero Gaussian curvature, so the cylinder can unroll onto the plane without stretching.</desc>
  <style>
    svg { --bg:#f5f7fb; --panel:#fff; --ink:#20242c; --muted:#526173; --grid:#b8c4d4; --blue:#2563eb; --teal:#0f766e; --orange:#c2410c; }
    @media (prefers-color-scheme:dark) { svg { --bg:#171b22; --panel:#222833; --ink:#edf1f7; --muted:#aab6c8; --grid:#526173; --blue:#7aa2f7; --teal:#4ec9a0; --orange:#f0a35e; } }
    text { font-family:system-ui,sans-serif; fill:var(--ink); } .muted { fill:var(--muted); } .panel { fill:var(--panel); stroke:var(--grid); } .grid { fill:none; stroke:var(--grid); } .blue { fill:none; stroke:var(--blue); } .teal { fill:none; stroke:var(--teal); } .orange { fill:none; stroke:var(--orange); }
  </style>
  <rect width="760" height="400" rx="20" fill="var(--bg)"/>
  <text x="28" y="38" font-size="19" font-weight="700">Curvature survives bending without stretching</text>
  <g transform="translate(24 64)">
    <rect class="panel" width="218" height="300" rx="16"/>
    <text x="109" y="32" text-anchor="middle" font-size="16" font-weight="700">Sphere</text>
    <circle class="blue" cx="109" cy="133" r="66" stroke-width="3"/>
    <ellipse class="grid" cx="109" cy="133" rx="66" ry="23"/>
    <path class="grid" d="M109 67c-30 18-30 114 0 132M109 67c30 18 30 114 0 132"/>
    <path class="orange" d="M64 225c20-17 70-17 90 0" stroke-width="3" stroke-linecap="round"/>
    <text x="109" y="254" text-anchor="middle" font-size="14" font-weight="700">K = 1/R²</text>
    <text class="muted" x="109" y="278" text-anchor="middle" font-size="13">positive curvature</text>
  </g>
  <g transform="translate(271 64)">
    <rect class="panel" width="218" height="300" rx="16"/>
    <text x="109" y="32" text-anchor="middle" font-size="16" font-weight="700">Cylinder</text>
    <path class="teal" d="M55 101v92c0 20 108 20 108 0v-92" stroke-width="3"/>
    <ellipse class="teal" cx="109" cy="101" rx="54" ry="18" stroke-width="3"/>
    <ellipse class="grid" cx="109" cy="193" rx="54" ry="18"/>
    <path class="grid" d="M76 88v119M109 83v128M142 88v119"/>
    <text x="109" y="254" text-anchor="middle" font-size="14" font-weight="700">K = 0</text>
    <text class="muted" x="109" y="278" text-anchor="middle" font-size="13">curved, but developable</text>
  </g>
  <path class="teal" d="M493 214h22" stroke-width="3" stroke-linecap="round"/>
  <path fill="var(--teal)" d="m512 207 12 7-12 7z"/>
  <g transform="translate(518 64)">
    <rect class="panel" width="218" height="300" rx="16"/>
    <text x="109" y="32" text-anchor="middle" font-size="16" font-weight="700">Plane</text>
    <path d="m46 86 126 22-24 104-126-22z" fill="none" stroke="var(--teal)" stroke-width="3"/>
    <path class="grid" d="m38 124 126 22M30 162l126 22M78 92 54 196M118 99 94 203M158 106l-24 104"/>
    <text x="109" y="254" text-anchor="middle" font-size="14" font-weight="700">K = 0</text>
    <text class="muted" x="109" y="278" text-anchor="middle" font-size="13">unrolled with no stretch</text>
  </g>
</svg>
