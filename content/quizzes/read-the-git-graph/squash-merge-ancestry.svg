<svg xmlns="http://www.w3.org/2000/svg" width="740" height="360" viewBox="0 0 740 360">
  <style>
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --edge: #64748b;
      --card: #ffffff; --branch: #2563eb; --branch-text: #1e3a8a;
      --head: #16a34a; --head-text: #14532d; --sha: #526173;
      --new: #c2410c; --new-text: #9a3412;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --edge: #8b9bb4;
        --card: #252b35; --branch: #60a5fa; --branch-text: #dbeafe;
        --head: #4ade80; --head-text: #dcfce7; --sha: #9aa8bd;
        --new: #fb923c; --new-text: #fed7aa;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); font-family: system-ui, sans-serif; font-weight: 700; }
    .commit { fill: var(--card); stroke: var(--edge); stroke-width: 2; }
    .commit-new { fill: var(--card); stroke: var(--new); stroke-width: 3; }
    .edge { stroke: var(--edge); stroke-width: 3; fill: none; }
    .edge-none { stroke: var(--muted); stroke-width: 2; fill: none; stroke-dasharray: 5 5; opacity: 0.8; }
    .sha { fill: var(--sha); font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 14px; }
    .muted { fill: var(--muted); font-family: system-ui, sans-serif; }
    .tag-branch-bg { fill: var(--panel); stroke: var(--branch); stroke-width: 2; }
    .tag-branch-text { fill: var(--branch-text); font-family: system-ui, sans-serif; font-weight: 700; font-size: 14px; }
    .tag-head-bg { fill: var(--panel); stroke: var(--head); stroke-width: 2; }
    .tag-head-text { fill: var(--head-text); font-family: system-ui, sans-serif; font-weight: 700; font-size: 14px; }
  </style>

  <rect class="panel" width="740" height="360" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="42" fill="#20242c" font-size="19">After `git merge --squash feature` + commit on main</text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <path class="edge" d="M480 120H160" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-sq)" />
    <path class="edge" d="M320 270L160 135" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-sq)" />
    <path class="edge" d="M500 270H360" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-sq)" />
    <path class="edge-none" d="M580 145L560 250" fill="none" stroke="#526173" stroke-width="2" stroke-dasharray="5 5" />
    <text class="muted" x="640" y="195" fill="#526173" font-size="13">no edge,</text>
    <text class="muted" x="640" y="213" fill="#526173" font-size="13">not an ancestor</text>

    <circle class="commit" cx="140" cy="120" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="140" y="166" fill="#526173" font-size="14">5e8a19c</text>

    <circle class="commit-new" cx="540" cy="120" r="28" fill="#ffffff" stroke="#c2410c" stroke-width="3" />
    <text class="sha" x="540" y="168" fill="#526173" font-size="14">2d6f0b1</text>

    <circle class="commit" cx="320" cy="270" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="320" y="316" fill="#526173" font-size="14">c40b7e2</text>
    <circle class="commit" cx="540" cy="270" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="540" y="316" fill="#526173" font-size="14">91fd3a6</text>

    <rect class="tag-head-bg" x="470" y="30" width="52" height="26" rx="6" fill="#f5f7fb" stroke="#16a34a" stroke-width="2" />
    <text class="tag-head-text" x="496" y="48" fill="#14532d" font-size="13">HEAD</text>
    <rect class="tag-branch-bg" x="500" y="62" width="60" height="26" rx="6" fill="#f5f7fb" stroke="#2563eb" stroke-width="2" />
    <text class="tag-branch-text" x="530" y="80" fill="#1e3a8a" font-size="13">main</text>

    <rect class="tag-branch-bg" x="500" y="330" width="80" height="26" rx="6" fill="#f5f7fb" stroke="#2563eb" stroke-width="2" />
    <text class="tag-branch-text" x="540" y="348" fill="#1e3a8a" font-size="13">feature</text>
  </g>

  <defs>
    <marker id="arrow-sq" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b" />
    </marker>
  </defs>
</svg>
