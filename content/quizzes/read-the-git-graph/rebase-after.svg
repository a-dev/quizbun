<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="380" viewBox="0 0 1000 380">
  <style>
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --edge: #64748b;
      --card: #ffffff; --branch: #2563eb; --branch-text: #1e3a8a;
      --head: #16a34a; --head-text: #14532d; --sha: #526173;
      --new: #c2410c; --new-text: #9a3412;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --edge: #8b9bb4;
        --card: #252b35; --branch: #60a5fa; --branch-text: #dbeafe;
        --head: #4ade80; --head-text: #dcfce7; --sha: #9aa8bd;
        --new: #fb923c; --new-text: #fed7aa;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); font-family: system-ui, sans-serif; font-weight: 700; }
    .commit { fill: var(--card); stroke: var(--edge); stroke-width: 2; }
    .commit-new { fill: var(--card); stroke: var(--new); stroke-width: 3; }
    .commit-faded { fill: var(--card); stroke: var(--muted); stroke-width: 2; stroke-dasharray: 4 3; opacity: 0.5; }
    .edge { stroke: var(--edge); stroke-width: 3; fill: none; }
    .edge-new { stroke: var(--new); stroke-width: 3; fill: none; }
    .edge-faded { stroke: var(--muted); stroke-width: 2; fill: none; opacity: 0.5; stroke-dasharray: 4 3; }
    .sha { fill: var(--sha); font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13px; }
    .sha-faded { fill: var(--muted); font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13px; opacity: 0.6; }
    .muted { fill: var(--muted); font-family: system-ui, sans-serif; }
    .tag-branch-bg { fill: var(--panel); stroke: var(--branch); stroke-width: 2; }
    .tag-branch-text { fill: var(--branch-text); font-family: system-ui, sans-serif; font-weight: 700; font-size: 14px; }
    .tag-head-bg { fill: var(--panel); stroke: var(--head); stroke-width: 2; }
    .tag-head-text { fill: var(--head-text); font-family: system-ui, sans-serif; font-weight: 700; font-size: 14px; }
  </style>

  <rect class="panel" width="1000" height="380" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="42" fill="#20242c" font-size="19">After `git rebase main`: feature replayed as three new commits</text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <path class="edge" d="M300 110H160" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-rb-after)" />
    <path class="edge-new" d="M500 110H340" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow-rb-after-new)" />
    <path class="edge-new" d="M700 110H540" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow-rb-after-new)" />
    <path class="edge-new" d="M900 110H740" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow-rb-after-new)" />

    <path class="edge-faded" d="M300 300L165 130" fill="none" stroke="#526173" stroke-width="2" stroke-dasharray="4 3" opacity="0.5" />
    <path class="edge-faded" d="M500 300H340" fill="none" stroke="#526173" stroke-width="2" stroke-dasharray="4 3" opacity="0.5" />
    <path class="edge-faded" d="M700 300H540" fill="none" stroke="#526173" stroke-width="2" stroke-dasharray="4 3" opacity="0.5" />

    <circle class="commit" cx="140" cy="110" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="140" y="156" fill="#526173" font-size="13">1f5c8a0</text>
    <circle class="commit" cx="340" cy="110" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="340" y="156" fill="#526173" font-size="13">6e9d2b7</text>

    <circle class="commit-new" cx="540" cy="110" r="27" fill="#ffffff" stroke="#c2410c" stroke-width="3" />
    <text class="sha" x="540" y="156" fill="#526173" font-size="13">9b21e6a</text>
    <circle class="commit-new" cx="740" cy="110" r="27" fill="#ffffff" stroke="#c2410c" stroke-width="3" />
    <text class="sha" x="740" y="156" fill="#526173" font-size="13">c74d802</text>
    <circle class="commit-new" cx="940" cy="110" r="27" fill="#ffffff" stroke="#c2410c" stroke-width="3" />
    <text class="sha" x="940" y="156" fill="#526173" font-size="13">5f8a3e1</text>

    <circle class="commit-faded" cx="340" cy="300" r="26" fill="#ffffff" stroke="#526173" stroke-width="2" opacity="0.5" />
    <text class="sha-faded" x="340" y="346" fill="#526173" font-size="13" opacity="0.6">8c3f105</text>
    <circle class="commit-faded" cx="540" cy="300" r="26" fill="#ffffff" stroke="#526173" stroke-width="2" opacity="0.5" />
    <text class="sha-faded" x="540" y="346" fill="#526173" font-size="13" opacity="0.6">e51a9c4</text>
    <circle class="commit-faded" cx="740" cy="300" r="26" fill="#ffffff" stroke="#526173" stroke-width="2" opacity="0.5" />
    <text class="sha-faded" x="740" y="346" fill="#526173" font-size="13" opacity="0.6">2d0f7b3</text>
    <text class="muted" x="740" y="370" fill="#526173" font-size="13">original commits — unreferenced, not deleted</text>

    <rect class="tag-branch-bg" x="360" y="66" width="60" height="26" rx="6" fill="#f5f7fb" stroke="#2563eb" stroke-width="2" />
    <text class="tag-branch-text" x="390" y="84" fill="#1e3a8a" font-size="13">main</text>

    <rect class="tag-head-bg" x="870" y="60" width="52" height="26" rx="6" fill="#f5f7fb" stroke="#16a34a" stroke-width="2" />
    <text class="tag-head-text" x="896" y="78" fill="#14532d" font-size="13">HEAD</text>
    <rect class="tag-branch-bg" x="900" y="92" width="80" height="26" rx="6" fill="#f5f7fb" stroke="#2563eb" stroke-width="2" />
    <text class="tag-branch-text" x="940" y="110" fill="#1e3a8a" font-size="13">feature</text>
  </g>

  <defs>
    <marker id="arrow-rb-after" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b" />
    </marker>
    <marker id="arrow-rb-after-new" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c2410c" />
    </marker>
  </defs>
</svg>
