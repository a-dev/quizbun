<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360">
  <style>
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --edge: #64748b;
      --card: #ffffff; --branch: #2563eb; --branch-text: #1e3a8a;
      --head: #16a34a; --head-text: #14532d; --sha: #526173;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --edge: #8b9bb4;
        --card: #252b35; --branch: #60a5fa; --branch-text: #dbeafe;
        --head: #4ade80; --head-text: #dcfce7; --sha: #9aa8bd;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); font-family: system-ui, sans-serif; font-weight: 700; }
    .commit { fill: var(--card); stroke: var(--edge); stroke-width: 2; }
    .edge { stroke: var(--edge); stroke-width: 3; fill: none; }
    .sha { fill: var(--sha); font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13px; }
    .tag-branch-bg { fill: var(--panel); stroke: var(--branch); stroke-width: 2; }
    .tag-branch-text { fill: var(--branch-text); font-family: system-ui, sans-serif; font-weight: 700; font-size: 14px; }
    .tag-head-bg { fill: var(--panel); stroke: var(--head); stroke-width: 2; }
    .tag-head-text { fill: var(--head-text); font-family: system-ui, sans-serif; font-weight: 700; font-size: 14px; }
  </style>

  <rect class="panel" width="800" height="360" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="42" fill="#20242c" font-size="19">`git rebase --onto main featureX topic`</text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <path class="edge" d="M300 110H160" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-onto)" />
    <path class="edge" d="M500 110H340" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-onto)" />
    <path class="edge" d="M300 280L515 130" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-onto)" />
    <path class="edge" d="M500 280H340" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-onto)" />

    <circle class="commit" cx="140" cy="110" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="140" y="156" fill="#526173" font-size="13">7b1e942</text>
    <rect class="tag-branch-bg" x="106" y="46" width="60" height="26" rx="6" fill="#f5f7fb" stroke="#2563eb" stroke-width="2" />
    <text class="tag-branch-text" x="136" y="64" fill="#1e3a8a" font-size="13">main</text>

    <circle class="commit" cx="340" cy="110" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="340" y="156" fill="#526173" font-size="13">a08d3c6</text>
    <circle class="commit" cx="540" cy="110" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="540" y="156" fill="#526173" font-size="13">e4f7b19</text>
    <rect class="tag-branch-bg" x="500" y="46" width="86" height="26" rx="6" fill="#f5f7fb" stroke="#2563eb" stroke-width="2" />
    <text class="tag-branch-text" x="543" y="64" fill="#1e3a8a" font-size="13">featureX</text>

    <circle class="commit" cx="340" cy="280" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="340" y="326" fill="#526173" font-size="13">c92a0f5</text>
    <circle class="commit" cx="540" cy="280" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="540" y="326" fill="#526173" font-size="13">5d6e831</text>

    <rect class="tag-head-bg" x="570" y="216" width="52" height="26" rx="6" fill="#f5f7fb" stroke="#16a34a" stroke-width="2" />
    <text class="tag-head-text" x="596" y="234" fill="#14532d" font-size="13">HEAD</text>
    <rect class="tag-branch-bg" x="600" y="248" width="66" height="26" rx="6" fill="#f5f7fb" stroke="#2563eb" stroke-width="2" />
    <text class="tag-branch-text" x="633" y="266" fill="#1e3a8a" font-size="13">topic</text>
  </g>

  <defs>
    <marker id="arrow-onto" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b" />
    </marker>
  </defs>
</svg>
