<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
  <style>
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --edge: #64748b;
      --card: #ffffff; --branch: #2563eb; --branch-text: #1e3a8a;
      --head: #16a34a; --head-text: #14532d; --sha: #526173;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --edge: #8b9bb4;
        --card: #252b35; --branch: #60a5fa; --branch-text: #dbeafe;
        --head: #4ade80; --head-text: #dcfce7; --sha: #9aa8bd;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); font-family: system-ui, sans-serif; font-weight: 700; }
    .commit { fill: var(--card); stroke: var(--edge); stroke-width: 2; }
    .edge { stroke: var(--edge); stroke-width: 3; fill: none; }
    .sha { fill: var(--sha); font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13px; }
    .tag-branch-bg { fill: var(--panel); stroke: var(--branch); stroke-width: 2; }
    .tag-branch-text { fill: var(--branch-text); font-family: system-ui, sans-serif; font-weight: 700; font-size: 14px; }
    .tag-head-bg { fill: var(--panel); stroke: var(--head); stroke-width: 2; }
    .tag-head-text { fill: var(--head-text); font-family: system-ui, sans-serif; font-weight: 700; font-size: 14px; }
  </style>

  <rect class="panel" width="920" height="360" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="42" fill="#20242c" font-size="19">Before: checked out on feature, about to run `git rebase main`</text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <path class="edge" d="M300 110H160" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-rb-before)" />
    <path class="edge" d="M300 280L160 130" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-rb-before)" />
    <path class="edge" d="M500 280H340" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-rb-before)" />
    <path class="edge" d="M700 280H540" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-rb-before)" />

    <circle class="commit" cx="140" cy="110" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="140" y="156" fill="#526173" font-size="13">1f5c8a0</text>

    <circle class="commit" cx="340" cy="110" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="340" y="156" fill="#526173" font-size="13">6e9d2b7</text>

    <circle class="commit" cx="340" cy="280" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="340" y="326" fill="#526173" font-size="13">8c3f105</text>
    <circle class="commit" cx="540" cy="280" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="540" y="326" fill="#526173" font-size="13">e51a9c4</text>
    <circle class="commit" cx="740" cy="280" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="740" y="326" fill="#526173" font-size="13">2d0f7b3</text>

    <rect class="tag-branch-bg" x="360" y="66" width="60" height="26" rx="6" fill="#f5f7fb" stroke="#2563eb" stroke-width="2" />
    <text class="tag-branch-text" x="390" y="84" fill="#1e3a8a" font-size="13">main</text>

    <rect class="tag-head-bg" x="670" y="196" width="52" height="26" rx="6" fill="#f5f7fb" stroke="#16a34a" stroke-width="2" />
    <text class="tag-head-text" x="696" y="214" fill="#14532d" font-size="13">HEAD</text>
    <rect class="tag-branch-bg" x="700" y="228" width="80" height="26" rx="6" fill="#f5f7fb" stroke="#2563eb" stroke-width="2" />
    <text class="tag-branch-text" x="740" y="246" fill="#1e3a8a" font-size="13">feature</text>
  </g>

  <defs>
    <marker id="arrow-rb-before" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b" />
    </marker>
  </defs>
</svg>
