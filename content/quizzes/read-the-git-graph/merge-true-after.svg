<svg xmlns="http://www.w3.org/2000/svg" width="880" height="360" viewBox="0 0 880 360">
  <style>
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --edge: #64748b;
      --card: #ffffff; --branch: #2563eb; --branch-text: #1e3a8a;
      --head: #16a34a; --head-text: #14532d; --sha: #526173;
      --new: #c2410c; --new-text: #9a3412;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --edge: #8b9bb4;
        --card: #252b35; --branch: #60a5fa; --branch-text: #dbeafe;
        --head: #4ade80; --head-text: #dcfce7; --sha: #9aa8bd;
        --new: #fb923c; --new-text: #fed7aa;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); font-family: system-ui, sans-serif; font-weight: 700; }
    .commit { fill: var(--card); stroke: var(--edge); stroke-width: 2; }
    .commit-new { fill: var(--card); stroke: var(--new); stroke-width: 3; }
    .edge { stroke: var(--edge); stroke-width: 3; fill: none; }
    .edge-new { stroke: var(--new); stroke-width: 3; fill: none; }
    .sha { fill: var(--sha); font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 14px; }
    .tag-branch-bg { fill: var(--panel); stroke: var(--branch); stroke-width: 2; }
    .tag-branch-text { fill: var(--branch-text); font-family: system-ui, sans-serif; font-weight: 700; font-size: 14px; }
    .tag-head-bg { fill: var(--panel); stroke: var(--head); stroke-width: 2; }
    .tag-head-text { fill: var(--head-text); font-family: system-ui, sans-serif; font-weight: 700; font-size: 14px; }
    .new-text { fill: var(--new-text); font-family: system-ui, sans-serif; font-weight: 700; font-size: 13px; }
  </style>

  <rect class="panel" width="880" height="360" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="42" fill="#20242c" font-size="19">After `git merge feature`: a new commit with two parents</text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <path class="edge" d="M300 120L160 195" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-tm-after)" />
    <path class="edge" d="M500 120H340" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-tm-after)" />
    <path class="edge" d="M300 270L160 205" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-tm-after)" />
    <path class="edge" d="M500 270H340" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-tm-after)" />
    <path class="edge-new" d="M700 190L560 132" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow-tm-after-new)" />
    <path class="edge-new" d="M700 210L560 258" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow-tm-after-new)" />

    <circle class="commit" cx="140" cy="200" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="140" y="246" fill="#526173" font-size="14">b7e21a0</text>

    <circle class="commit" cx="340" cy="120" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="340" y="166" fill="#526173" font-size="14">d4f8c32</text>
    <circle class="commit" cx="540" cy="120" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="540" y="166" fill="#526173" font-size="14">a1c9e75</text>

    <circle class="commit" cx="340" cy="270" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="340" y="316" fill="#526173" font-size="14">f209b6d</text>
    <circle class="commit" cx="540" cy="270" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="540" y="316" fill="#526173" font-size="14">7cd44e1</text>

    <circle class="commit-new" cx="740" cy="200" r="28" fill="#ffffff" stroke="#c2410c" stroke-width="3" />
    <text class="sha" x="740" y="248" fill="#526173" font-size="14">3b6a0f9</text>

    <text class="new-text" x="600" y="140" fill="#9a3412" font-size="13">1st parent</text>
    <text class="new-text" x="600" y="248" fill="#9a3412" font-size="13">2nd parent</text>

    <rect class="tag-head-bg" x="670" y="130" width="52" height="26" rx="6" fill="#f5f7fb" stroke="#16a34a" stroke-width="2" />
    <text class="tag-head-text" x="696" y="148" fill="#14532d" font-size="13">HEAD</text>
    <rect class="tag-branch-bg" x="700" y="162" width="60" height="26" rx="6" fill="#f5f7fb" stroke="#2563eb" stroke-width="2" />
    <text class="tag-branch-text" x="730" y="180" fill="#1e3a8a" font-size="13">main</text>

    <rect class="tag-branch-bg" x="500" y="330" width="80" height="26" rx="6" fill="#f5f7fb" stroke="#2563eb" stroke-width="2" />
    <text class="tag-branch-text" x="540" y="348" fill="#1e3a8a" font-size="13">feature</text>
  </g>

  <defs>
    <marker id="arrow-tm-after" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b" />
    </marker>
    <marker id="arrow-tm-after-new" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c2410c" />
    </marker>
  </defs>
</svg>
