<svg xmlns="http://www.w3.org/2000/svg" width="740" height="340" viewBox="0 0 740 340">
  <style>
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --edge: #64748b;
      --card: #ffffff; --branch: #2563eb; --branch-text: #1e3a8a;
      --head: #16a34a; --head-text: #14532d; --sha: #526173;
      --new: #c2410c; --new-text: #9a3412;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --edge: #8b9bb4;
        --card: #252b35; --branch: #60a5fa; --branch-text: #dbeafe;
        --head: #4ade80; --head-text: #dcfce7; --sha: #9aa8bd;
        --new: #fb923c; --new-text: #fed7aa;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); font-family: system-ui, sans-serif; font-weight: 700; }
    .commit { fill: var(--card); stroke: var(--edge); stroke-width: 2; }
    .commit-new { fill: var(--card); stroke: var(--new); stroke-width: 3; }
    .edge { stroke: var(--edge); stroke-width: 3; fill: none; }
    .edge-new { stroke: var(--new); stroke-width: 3; fill: none; }
    .edge-link { stroke: var(--new); stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    .sha { fill: var(--sha); font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13px; }
    .new-text { fill: var(--new-text); font-family: system-ui, sans-serif; font-weight: 700; font-size: 13px; }
    .tag-branch-bg { fill: var(--panel); stroke: var(--branch); stroke-width: 2; }
    .tag-branch-text { fill: var(--branch-text); font-family: system-ui, sans-serif; font-weight: 700; font-size: 14px; }
    .tag-head-bg { fill: var(--panel); stroke: var(--head); stroke-width: 2; }
    .tag-head-text { fill: var(--head-text); font-family: system-ui, sans-serif; font-weight: 700; font-size: 14px; }
  </style>

  <rect class="panel" width="740" height="340" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="42" fill="#20242c" font-size="19">After `git cherry-pick b7e0c93` from feature onto main</text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <path class="edge-new" d="M380 110H160" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow-cp-new)" />
    <path class="edge" d="M580 260H400" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-cp)" />
    <path class="edge-link" d="M380 135L400 235" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4" />

    <circle class="commit" cx="140" cy="110" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="140" y="156" fill="#526173" font-size="13">0a4f8d2</text>

    <circle class="commit-new" cx="380" cy="110" r="27" fill="#ffffff" stroke="#c2410c" stroke-width="3" />
    <text class="sha" x="380" y="156" fill="#526173" font-size="13">f3d891a</text>

    <rect class="tag-head-bg" x="330" y="46" width="52" height="26" rx="6" fill="#f5f7fb" stroke="#16a34a" stroke-width="2" />
    <text class="tag-head-text" x="356" y="64" fill="#14532d" font-size="13">HEAD</text>
    <rect class="tag-branch-bg" x="360" y="16" width="60" height="26" rx="6" fill="#f5f7fb" stroke="#2563eb" stroke-width="2" />
    <text class="tag-branch-text" x="390" y="34" fill="#1e3a8a" font-size="13">main</text>

    <circle class="commit" cx="380" cy="260" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="380" y="306" fill="#526173" font-size="13">b7e0c93</text>
    <circle class="commit" cx="580" cy="260" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="580" y="306" fill="#526173" font-size="13">9c1a7f4</text>
    <rect class="tag-branch-bg" x="600" y="246" width="80" height="26" rx="6" fill="#f5f7fb" stroke="#2563eb" stroke-width="2" />
    <text class="tag-branch-text" x="640" y="264" fill="#1e3a8a" font-size="13">feature</text>

    <text class="new-text" x="460" y="190" fill="#9a3412" font-size="13">same change,</text>
    <text class="new-text" x="460" y="206" fill="#9a3412" font-size="13">different SHA</text>
  </g>

  <defs>
    <marker id="arrow-cp" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b" />
    </marker>
    <marker id="arrow-cp-new" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c2410c" />
    </marker>
  </defs>
</svg>
