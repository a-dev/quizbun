<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300">
  <style>
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --edge: #64748b;
      --card: #ffffff; --branch: #2563eb; --branch-text: #1e3a8a;
      --sha: #526173; --new: #c2410c; --new-text: #9a3412; --grid: #d5dce6;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --edge: #8b9bb4;
        --card: #252b35; --branch: #60a5fa; --branch-text: #dbeafe;
        --sha: #9aa8bd; --new: #fb923c; --new-text: #fed7aa; --grid: #333c49;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); font-family: system-ui, sans-serif; font-weight: 700; }
    .subtitle { fill: var(--muted); font-family: system-ui, sans-serif; font-weight: 700; }
    .commit { fill: var(--card); stroke: var(--edge); stroke-width: 2; }
    .commit-new { fill: var(--card); stroke: var(--new); stroke-width: 3; }
    .edge { stroke: var(--edge); stroke-width: 3; fill: none; }
    .edge-new { stroke: var(--new); stroke-width: 3; fill: none; }
    .divider { stroke: var(--grid); stroke-width: 2; }
    .sha { fill: var(--sha); font-family: ui-monospace, "SF Mono", Consolas, monospace; font-size: 13px; }
    .tag-branch-bg { fill: var(--panel); stroke: var(--branch); stroke-width: 2; }
    .tag-branch-text { fill: var(--branch-text); font-family: system-ui, sans-serif; font-weight: 700; font-size: 13px; }
  </style>

  <rect class="panel" width="1040" height="300" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="42" fill="#20242c" font-size="19">Same history, diverged after a rewrite + force-push</text>
  <line class="divider" x1="520" y1="70" x2="520" y2="280" stroke="#d5dce6" stroke-width="2" />

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text class="subtitle" x="230" y="90" fill="#526173" font-size="15">your local main</text>
    <text class="subtitle" x="780" y="90" fill="#526173" font-size="15">origin/main (after force-push)</text>

    <path class="edge" d="M340 180H180" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-fp)" />
    <circle class="commit" cx="140" cy="180" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="140" y="226" fill="#526173" font-size="13">c1d4a80</text>
    <circle class="commit" cx="380" cy="180" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="380" y="226" fill="#526173" font-size="13">9e2f6c3</text>
    <rect class="tag-branch-bg" x="340" y="130" width="90" height="26" rx="6" fill="#f5f7fb" stroke="#2563eb" stroke-width="2" />
    <text class="tag-branch-text" x="385" y="148" fill="#1e3a8a" font-size="13">main (yours)</text>

    <path class="edge" d="M760 180H600" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow-fp)" />
    <path class="edge-new" d="M960 180H800" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow-fp-new)" />
    <circle class="commit" cx="560" cy="180" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="sha" x="560" y="226" fill="#526173" font-size="13">c1d4a80</text>
    <circle class="commit-new" cx="800" cy="180" r="27" fill="#ffffff" stroke="#c2410c" stroke-width="3" />
    <text class="sha" x="800" y="226" fill="#526173" font-size="13">4b8a7d5</text>
    <circle class="commit-new" cx="1000" cy="180" r="27" fill="#ffffff" stroke="#c2410c" stroke-width="3" />
    <text class="sha" x="1000" y="226" fill="#526173" font-size="13">7f1c093</text>
    <rect class="tag-branch-bg" x="920" y="130" width="110" height="26" rx="6" fill="#f5f7fb" stroke="#2563eb" stroke-width="2" />
    <text class="tag-branch-text" x="975" y="148" fill="#1e3a8a" font-size="13">origin/main</text>
  </g>

  <defs>
    <marker id="arrow-fp" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#64748b" />
    </marker>
    <marker id="arrow-fp-new" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#c2410c" />
    </marker>
  </defs>
</svg>
