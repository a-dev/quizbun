<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ctx-fill: #dbeafe;
      --ctx-edge: #2563eb;
      --ctx-label: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ctx-fill: #1e3a5f;
        --ctx-edge: #60a5fa;
        --ctx-label: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel-bg { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge-line { stroke: var(--edge); }
    .panel-card { fill: var(--card); stroke: var(--edge); }
    .immediate-dot { fill: var(--ctx-edge); }
    .immediate-label { fill: var(--ctx-label); }
    .timeout-dot { fill: var(--accent-edge); }
    .timeout-label { fill: var(--accent-text); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" fill-rule="evenodd" />
    </marker>
  </defs>

  <rect class="panel-bg" width="720" height="560" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    `setTimeout(fn, 0)` vs `setImmediate(fn)`
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Same two calls, two contexts — one is a coin flip, the other is not.
  </text>

  <g font-family="system-ui, sans-serif">
    <rect class="panel-card" x="36" y="90" width="648" height="240" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" />
    <text class="title" x="56" y="114" fill="#20242c" font-size="14" font-weight="700">Top level of a module</text>
    <text class="muted" x="56" y="132" fill="#526173" font-size="11.5">the race is genuinely open</text>

    <line class="edge-line" x1="90" y1="160" x2="650" y2="160" stroke="#64748b" stroke-width="2" />
    <g class="edge-line" stroke="#64748b" stroke-width="2">
      <line x1="110" y1="156" x2="110" y2="164" />
      <line x1="280" y1="156" x2="280" y2="164" />
      <line x1="450" y1="156" x2="450" y2="164" />
      <line x1="620" y1="156" x2="620" y2="164" />
    </g>
    <g class="muted" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
      <text x="110" y="180">timers</text>
      <text x="280" y="180">poll</text>
      <text x="450" y="180">check</text>
      <text x="620" y="180">timers′</text>
    </g>

    <text class="muted" x="56" y="208" fill="#526173" font-size="12" font-weight="600">Case 1 — loop reaches timers ≥ 1 ms after start:</text>
    <path d="M110,230 L450,230" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
    <circle class="timeout-dot" cx="110" cy="230" r="9" fill="#c2410c" />
    <circle class="immediate-dot" cx="450" cy="230" r="9" fill="#2563eb" />
    <text class="timeout-label" x="110" y="248" fill="#9a3412" font-size="10.5" text-anchor="middle">timeout</text>
    <text class="immediate-label" x="450" y="248" fill="#172554" font-size="10.5" text-anchor="middle">immediate</text>
    <text class="title" x="660" y="208" fill="#20242c" font-size="13" font-weight="700" text-anchor="end">timeout, then immediate</text>

    <text class="muted" x="56" y="270" fill="#526173" font-size="12" font-weight="600">Case 2 — loop reaches timers &lt; 1 ms after start:</text>
    <path d="M450,292 L620,292" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrow)" />
    <circle class="immediate-dot" cx="450" cy="292" r="9" fill="#2563eb" />
    <circle class="timeout-dot" cx="620" cy="292" r="9" fill="#c2410c" />
    <text class="immediate-label" x="450" y="310" fill="#172554" font-size="10.5" text-anchor="middle">immediate</text>
    <text class="timeout-label" x="620" y="310" fill="#9a3412" font-size="10.5" text-anchor="middle">timeout</text>
    <text class="title" x="660" y="270" fill="#20242c" font-size="13" font-weight="700" text-anchor="end">immediate, then timeout</text>
  </g>

  <g font-family="system-ui, sans-serif">
    <rect class="panel-card" x="36" y="350" width="648" height="190" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="56" y="374" fill="#20242c" font-size="14" font-weight="700">Inside an I/O callback, e.g. `fs.readFile`</text>
    <text class="muted" x="56" y="392" fill="#526173" font-size="11.5">the order is guaranteed</text>

    <line class="edge-line" x1="90" y1="420" x2="650" y2="420" stroke="#64748b" stroke-width="2" />
    <g class="edge-line" stroke="#64748b" stroke-width="2">
      <line x1="150" y1="416" x2="150" y2="424" />
      <line x1="390" y1="416" x2="390" y2="424" />
      <line x1="630" y1="416" x2="630" y2="424" />
    </g>
    <g class="muted" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
      <text x="150" y="440">poll</text>
      <text x="390" y="440">check</text>
      <text x="630" y="440">timers′</text>
    </g>

    <path d="M150,462 L630,462" fill="none" stroke="#64748b" stroke-width="2.2" marker-end="url(#arrow)" />
    <circle cx="150" cy="462" r="6" fill="#64748b" />
    <circle class="immediate-dot" cx="390" cy="462" r="9" fill="#2563eb" />
    <circle class="timeout-dot" cx="630" cy="462" r="9" fill="#c2410c" />
    <text class="muted" x="150" y="480" fill="#526173" font-size="10.5" text-anchor="middle">both scheduled</text>
    <text class="immediate-label" x="390" y="480" fill="#172554" font-size="10.5" text-anchor="middle">immediate</text>
    <text class="timeout-label" x="630" y="480" fill="#9a3412" font-size="10.5" text-anchor="middle">timeout, next turn</text>

    <text class="accent-text" x="56" y="515" fill="#9a3412" font-size="13" font-weight="700">Verdict: immediate always wins — poll → check is the very next phase.</text>
  </g>
</svg>
