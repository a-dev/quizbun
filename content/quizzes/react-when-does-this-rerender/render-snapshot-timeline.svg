<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --r1-fill: #dbeafe;
      --r1-edge: #2563eb;
      --r1-text: #172554;
      --r2-fill: #dcfce7;
      --r2-edge: #16a34a;
      --r2-text: #15803d;
      --warn-fill: #ffedd5;
      --warn-edge: #c2410c;
      --warn-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --r1-fill: #1e3a5f;
        --r1-edge: #60a5fa;
        --r1-text: #dbeafe;
        --r2-fill: #14321f;
        --r2-edge: #4ade80;
        --r2-text: #86efac;
        --warn-fill: #3a2416;
        --warn-edge: #fb923c;
        --warn-text: #fdba74;
      }
    }

    .panel-bg { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge-line { stroke: var(--edge); }
    .card { fill: var(--card); stroke: var(--edge); }
    .r1-box { fill: var(--r1-fill); stroke: var(--r1-edge); }
    .r1-text { fill: var(--r1-text); }
    .r2-box { fill: var(--r2-fill); stroke: var(--r2-edge); }
    .r2-text { fill: var(--r2-text); }
    .warn-box { fill: var(--warn-fill); stroke: var(--warn-edge); }
    .warn-text { fill: var(--warn-text); }
  </style>

  <defs>
    <marker id="arrows" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" fill-rule="evenodd" />
    </marker>
  </defs>

  <rect class="panel-bg" width="720" height="520" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Every render owns its own snapshot
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    A closure created during Render #1 keeps reading Render #1's values, forever.
  </text>

  <!-- Render 1 card -->
  <g font-family="system-ui, sans-serif">
    <rect class="r1-box" x="36" y="88" width="300" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="r1-text" x="52" y="112" fill="#172554" font-size="13" font-weight="700">Render #1 — number = 0</text>
    <text class="r1-text" x="52" y="132" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">onClick captures this closure</text>
    <text class="r1-text" x="52" y="148" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">setNumber(number + 5)</text>
  </g>

  <path d="M336,123 L380,123" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrows)" />
  <text class="muted" x="358" y="112" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">schedules</text>

  <!-- Render 2 card -->
  <g font-family="system-ui, sans-serif">
    <rect class="r2-box" x="384" y="88" width="300" height="70" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="r2-text" x="400" y="112" fill="#15803d" font-size="13" font-weight="700">Render #2 — number = 5</text>
    <text class="r2-text" x="400" y="132" fill="#15803d" font-size="11">this is what commits to the DOM</text>
    <text class="r2-text" x="400" y="148" fill="#15803d" font-size="11">its own, separate closure</text>
  </g>

  <!-- setTimeout still tied to render 1 -->
  <path d="M186,158 L186,182" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrows)" />

  <g font-family="system-ui, sans-serif">
    <rect class="card" x="36" y="186" width="300" height="56" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="208" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">setTimeout(() =&gt;</text>
    <text class="title" x="52" y="224" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">  console.log(number), 1000)</text>
  </g>

  <text class="muted" x="186" y="266" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5" text-anchor="middle">still reads Render #1's `number` — 1000 ms later</text>

  <path d="M186,278 L186,300" fill="none" stroke="var(--warn-edge)" stroke-width="2" marker-end="url(#arrows)" />

  <rect class="warn-box" x="86" y="304" width="200" height="46" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="warn-text" x="186" y="332" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">console.log → 0</text>

  <line x1="36" y1="378" x2="684" y2="378" stroke="#64748b" stroke-width="1" stroke-dasharray="2 4" />

  <text class="title" x="36" y="410" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">
    A single click's queued updates, in order
  </text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
    <rect class="card" x="36" y="426" width="120" height="50" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="96" y="448" fill="#20242c" font-size="12" font-weight="700">number = 0</text>
    <text class="muted" x="96" y="464" fill="#526173" font-size="9.5">starting snapshot</text>

    <path d="M156,451 L188,451" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrows)" />

    <rect class="r1-box" x="192" y="426" width="150" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="r1-text" x="267" y="446" fill="#172554" font-size="10.5" font-weight="700">setNumber(0 + 5)</text>
    <text class="r1-text" x="267" y="462" fill="#172554" font-size="10.5">replace → 5</text>

    <path d="M342,451 L374,451" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrows)" />

    <rect class="r1-box" x="378" y="426" width="150" height="50" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="r1-text" x="453" y="446" fill="#172554" font-size="10.5" font-weight="700">setNumber(n =&gt; n+1)</text>
    <text class="r1-text" x="453" y="462" fill="#172554" font-size="10.5">updater on 5 → 6</text>

    <path d="M528,451 L560,451" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrows)" />

    <rect class="r2-box" x="564" y="426" width="120" height="50" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="r2-text" x="624" y="446" fill="#15803d" font-size="10.5" font-weight="700">setNumber(42)</text>
    <text class="r2-text" x="624" y="462" fill="#15803d" font-size="10.5">replace → final 42</text>
  </g>

  <text class="muted" x="36" y="504" fill="#526173" font-family="system-ui, sans-serif" font-size="12">
    A direct value always replaces the queue so far; an updater function receives it and builds on top.
  </text>
</svg>
