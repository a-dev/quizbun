<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --render-fill: #dbeafe;
      --render-edge: #2563eb;
      --render-text: #172554;
      --warn-fill: #ffedd5;
      --warn-edge: #c2410c;
      --warn-text: #9a3412;
      --skip-fill: #f5f7fb;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --render-fill: #1e3a5f;
        --render-edge: #60a5fa;
        --render-text: #dbeafe;
        --warn-fill: #3a2416;
        --warn-edge: #fb923c;
        --warn-text: #fdba74;
        --skip-fill: #1a1f27;
      }
    }

    .panel-bg { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge-line { stroke: var(--edge); }
    .render-box { fill: var(--render-fill); stroke: var(--render-edge); }
    .render-text { fill: var(--render-text); }
    .warn-box { fill: var(--warn-fill); stroke: var(--warn-edge); }
    .warn-text { fill: var(--warn-text); }
    .skip-box { fill: var(--skip-fill); stroke: var(--edge); }
  </style>

  <defs>
    <marker id="arrowr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" fill-rule="evenodd" />
    </marker>
  </defs>

  <rect class="panel-bg" width="720" height="380" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Does the child render when the parent does?
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    `Parent` re-renders in all three columns. What `Child` does next depends on `memo` and prop identity.
  </text>

  <!-- Column 1: no memo -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text class="title" x="141" y="94" fill="#20242c" font-size="13" font-weight="700">No `memo`</text>

    <rect class="render-box" x="61" y="106" width="160" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="render-text" x="141" y="134" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">Parent</text>

    <path d="M141,152 L141,176" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowr)" />

    <rect class="render-box" x="61" y="180" width="160" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="render-text" x="141" y="208" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">Child</text>

    <text class="render-text" x="141" y="248" fill="#172554" font-size="11.5" font-weight="700">renders</text>
    <text class="muted" x="141" y="266" fill="#526173" font-size="11">no bailout exists</text>
    <text class="muted" x="141" y="282" fill="#526173" font-size="11">to skip it</text>
  </g>

  <!-- Column 2: memo, stable prop -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text class="title" x="360" y="94" fill="#20242c" font-size="13" font-weight="700">`memo`, stable prop</text>

    <rect class="render-box" x="280" y="106" width="160" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="render-text" x="360" y="134" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">Parent</text>

    <path d="M360,152 L360,176" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowr)" />

    <rect class="skip-box" x="280" y="180" width="160" height="46" rx="10" fill="#f5f7fb" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" />
    <text class="muted" x="360" y="208" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">Child</text>

    <text class="muted" x="360" y="248" fill="#526173" font-size="11.5" font-weight="700">skipped</text>
    <text class="muted" x="360" y="266" fill="#526173" font-size="11">label="Save" is the</text>
    <text class="muted" x="360" y="282" fill="#526173" font-size="11">same string every time</text>
  </g>

  <!-- Column 3: memo, inline object prop -->
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text class="title" x="579" y="94" fill="#20242c" font-size="13" font-weight="700">`memo`, inline object</text>

    <rect class="render-box" x="499" y="106" width="160" height="46" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="render-text" x="579" y="134" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">Parent</text>

    <path d="M579,152 L579,176" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowr)" />

    <rect class="warn-box" x="499" y="180" width="160" height="46" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="warn-text" x="579" y="208" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">Child</text>

    <text class="warn-text" x="579" y="248" fill="#9a3412" font-size="11.5" font-weight="700">renders anyway</text>
    <text class="muted" x="579" y="266" fill="#526173" font-size="11">{ theme } is a new object</text>
    <text class="muted" x="579" y="282" fill="#526173" font-size="11">reference every render</text>
  </g>

  <line x1="36" y1="308" x2="684" y2="308" stroke="#64748b" stroke-width="1" stroke-dasharray="2 4" />

  <text class="muted" x="36" y="336" fill="#526173" font-family="system-ui, sans-serif" font-size="12.5">
    `memo` compares each prop with `Object.is`. It never looks inside an object — only whether the reference changed.
  </text>
  <text class="muted" x="36" y="356" fill="#526173" font-family="system-ui, sans-serif" font-size="12.5">
    Without `memo` at all, a parent render always renders its children — matching props buy nothing on their own.
  </text>
</svg>
