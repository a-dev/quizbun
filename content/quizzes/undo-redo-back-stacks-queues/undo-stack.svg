<svg xmlns="http://www.w3.org/2000/svg" width="720" height="390" viewBox="0 0 720 390">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #64748b;
      --tier-1: #dbeafe;
      --tier-2: #bfdbfe;
      --tier-3: #93c5fd;
      --tier-edge: #2563eb;
      --tier-edge-strong: #1d4ed8;
      --tier-label: #172554;
      --accent: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #8b9bb4;
        --tier-1: #1e3a5f;
        --tier-2: #254b7a;
        --tier-3: #2d5d96;
        --tier-edge: #60a5fa;
        --tier-edge-strong: #93c5fd;
        --tier-label: #dbeafe;
        --accent: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .tier-1 { fill: var(--tier-1); stroke: var(--tier-edge); }
    .tier-2 { fill: var(--tier-2); stroke: var(--tier-edge); }
    .tier-3 { fill: var(--tier-3); stroke: var(--tier-edge-strong); }
    .tier-label { fill: var(--tier-label); }
    .accent { stroke: var(--accent); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <rect class="panel" width="720" height="390" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Undo pops the top of the history stack
  </text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <path class="rail" d="M148 92V348H400V92" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" />

    <rect class="tier-1" x="164" y="260" width="220" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="tier-label" x="274" y="303" fill="#172554" font-size="22" font-weight="700">edit1</text>

    <rect class="tier-2" x="164" y="180" width="220" height="70" rx="10" fill="#bfdbfe" stroke="#2563eb" stroke-width="2" />
    <text class="tier-label" x="274" y="223" fill="#172554" font-size="22" font-weight="700">edit2</text>

    <rect class="tier-3" x="164" y="100" width="220" height="70" rx="10" fill="#93c5fd" stroke="#1d4ed8" stroke-width="3" />
    <text class="tier-label" x="274" y="143" fill="#172554" font-size="22" font-weight="700">edit3</text>

    <text class="muted" x="274" y="372" fill="#526173" font-size="15">bottom</text>
    <text class="muted" x="274" y="86" fill="#526173" font-size="15">top</text>

    <path class="accent" d="M400 135H566" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" />
    <path class="accent" d="m548 119 20 16-20 16" fill="none" stroke="#c2410c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <text class="accent-text" x="500" y="112" fill="#9a3412" font-size="18" font-weight="700">pop()</text>
    <text class="accent-text" x="574" y="142" fill="#9a3412" font-size="18" font-weight="700" text-anchor="start">edit3</text>
  </g>
</svg>
