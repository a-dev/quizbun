<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .card { fill: var(--card); stroke: var(--edge); }
  </style>

  <rect class="panel" width="720" height="240" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Edits applied over time
  </text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect class="card" x="36" y="82" width="168" height="96" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="120" y="124" fill="#20242c" font-size="22" font-weight="700">edit1</text>
    <text class="muted" x="120" y="151" fill="#526173" font-size="14">applied first</text>

    <path class="edge" d="M220 130H266" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path class="edge" d="m256 120 12 10-12 10" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <rect class="card" x="276" y="82" width="168" height="96" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="360" y="124" fill="#20242c" font-size="22" font-weight="700">edit2</text>
    <text class="muted" x="360" y="151" fill="#526173" font-size="14">applied next</text>

    <path class="edge" d="M460 130H506" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path class="edge" d="m496 120 12 10-12 10" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <rect class="card" x="516" y="82" width="168" height="96" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="600" y="124" fill="#20242c" font-size="22" font-weight="700">edit3</text>
    <text class="muted" x="600" y="151" fill="#526173" font-size="14">applied last</text>
  </g>
</svg>
