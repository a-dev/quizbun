<svg xmlns="http://www.w3.org/2000/svg" width="720" height="318" viewBox="0 0 720 318">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --c: #64748b;
      --key: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --c: #8b9bb4;
        --key: #242b36;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .a { fill: var(--a); }
    .a-line { stroke: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .c { fill: var(--c); }
    .key { fill: var(--key); stroke: var(--rail); }
  </style>

  <rect class="panel" width="720" height="318" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Cat-face test: how much better than guessing?</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Test mix: about 35% cat faces, 65% other images. Accuracy in percent.</text>
  <text class="muted" x="36" y="124" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Always answer "not a cat"</text>
  <rect class="c" x="250" y="106" width="272.2" height="26" rx="4" fill="#64748b" />
  <text class="title" x="530.1600000000001" y="125" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">64.8%</text>
  <text class="muted" x="36" y="170" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Best simple linear filter</text>
  <rect class="c" x="250" y="152" width="282.2" height="26" rx="4" fill="#64748b" />
  <text class="title" x="540.24" y="171" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">67.2%</text>
  <text class="muted" x="36" y="216" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Best cat neuron</text>
  <rect class="b" x="250" y="198" width="314.2" height="26" rx="4" fill="#c2410c" />
  <text class="title" x="572.1600000000001" y="217" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">74.8%</text>
  <path class="rail" d="M522.2 96V242" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 5" />
  <path class="rail" d="M250 242H670" stroke="#94a3b8" stroke-width="2" />
  <text class="muted" x="250.0" y="262" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0</text>
  <text class="muted" x="460.0" y="262" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">50</text>
  <text class="muted" x="670.0" y="262" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">100</text>
  <text class="muted" x="36" y="294" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Dashed line: the 64.8% you get without learning anything.</text>
</svg>
