<svg xmlns="http://www.w3.org/2000/svg" width="720" height="366" viewBox="0 0 720 366">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --c: #64748b;
      --key: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --c: #8b9bb4;
        --key: #242b36;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .a { fill: var(--a); }
    .a-line { stroke: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .c { fill: var(--c); }
    .key { fill: var(--key); stroke: var(--rail); }
  </style>

  <rect class="panel" width="720" height="366" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="19" font-weight="700">The Deborah number: liquid or solid depends on how long you watch</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14">De = relaxation time ÷ observation time (log scale)</text>
  <rect class="a-soft" x="60" y="130" width="257.1" height="60" fill="#dbeafe" stroke="none" />
  <rect class="b-soft" x="317.1" y="130" width="342.9" height="60" fill="#ffedd5" stroke="none" />
  <text class="a" x="188.57142857142858" y="164" fill="#2563eb" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">De &lt; 1: it flows (liquid)</text>
  <text class="b" x="488.57142857142856" y="164" fill="#c2410c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">De &gt; 1: it keeps its shape (solid)</text>
  <path class="rail" d="M60 190H660" stroke="#94a3b8" stroke-width="2" />
  <path class="rail" d="M60.0 190v8" stroke="#94a3b8" stroke-width="2" />
  <text class="muted" x="60.0" y="216" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0.001</text>
  <path class="rail" d="M145.7 190v8" stroke="#94a3b8" stroke-width="2" />
  <text class="muted" x="145.71428571428572" y="216" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0.01</text>
  <path class="rail" d="M231.4 190v8" stroke="#94a3b8" stroke-width="2" />
  <text class="muted" x="231.42857142857142" y="216" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0.1</text>
  <path class="rail" d="M317.1 190v8" stroke="#94a3b8" stroke-width="2" />
  <text class="muted" x="317.14285714285717" y="216" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">1</text>
  <path class="rail" d="M402.9 190v8" stroke="#94a3b8" stroke-width="2" />
  <text class="muted" x="402.85714285714283" y="216" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">10</text>
  <path class="rail" d="M488.6 190v8" stroke="#94a3b8" stroke-width="2" />
  <text class="muted" x="488.57142857142856" y="216" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">100</text>
  <path class="rail" d="M574.3 190v8" stroke="#94a3b8" stroke-width="2" />
  <text class="muted" x="574.2857142857143" y="216" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">1,000</text>
  <path class="rail" d="M660.0 190v8" stroke="#94a3b8" stroke-width="2" />
  <text class="muted" x="660.0" y="216" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">10,000</text>
  <path class="title" d="M317.1 120V198" stroke="#20242c" stroke-width="2" />
  <circle class="a" cx="164.7" cy="190" r="7" fill="#2563eb" />
  <path class="a-line" d="M164.7 226v18" stroke="#2563eb" stroke-width="2" />
  <text class="title" x="154.7298928242591" y="264" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">Cat napping in a sink for an hour</text>
  <text class="a" x="154.7298928242591" y="284" fill="#2563eb" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="start">De ≈ 0.017</text>
  <circle class="b" cx="641.0" cy="190" r="7" fill="#c2410c" />
  <path class="b-line" d="M641.0 226v18" stroke="#c2410c" stroke-width="2" />
  <text class="title" x="650.9843928900266" y="264" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="end">Cat in a 1/100 s photo</text>
  <text class="b" x="650.9843928900266" y="284" fill="#c2410c" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="end">De = 6,000</text>
  <text class="muted" x="36" y="322" fill="#526173" font-family="system-ui, sans-serif" font-size="13">Assumes a cat takes about 1 minute to settle into its container. Glaciers flow</text>
  <text class="muted" x="36" y="340" fill="#526173" font-family="system-ui, sans-serif" font-size="13">over years; a water balloon popped in a high-speed video briefly holds its shape.</text>
</svg>
