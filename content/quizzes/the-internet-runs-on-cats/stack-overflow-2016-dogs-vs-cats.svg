<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --c: #64748b;
      --key: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --c: #8b9bb4;
        --key: #242b36;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .a { fill: var(--a); }
    .a-line { stroke: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .c { fill: var(--c); }
    .key { fill: var(--key); stroke: var(--rail); }
  </style>

  <rect class="panel" width="720" height="410" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Stack Overflow 2016 survey: “Dogs or cats?”</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Share of developers who answered the question</text>
  <text class="title" x="36" y="110" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">All respondents (45,239)</text>
  <text class="muted" x="56" y="143" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Dogs</text>
  <rect class="a" x="190" y="128" width="342.3" height="20" rx="4" fill="#2563eb" />
  <text class="title" x="540.3" y="143" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">48.9%</text>
  <text class="muted" x="56" y="173" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Cats</text>
  <rect class="b" x="190" y="158" width="243.6" height="20" rx="4" fill="#c2410c" />
  <text class="title" x="441.59999999999997" y="173" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">34.8%</text>
  <text class="muted" x="56" y="203" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Other</text>
  <rect class="c" x="190" y="188" width="114.8" height="20" rx="4" fill="#64748b" />
  <text class="title" x="312.79999999999995" y="203" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">16.4%</text>
  <text class="title" x="36" y="238" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Germany (3,154)</text>
  <text class="muted" x="56" y="271" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Dogs</text>
  <rect class="a" x="190" y="256" width="268.8" height="20" rx="4" fill="#2563eb" />
  <text class="title" x="466.8" y="271" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">38.4%</text>
  <text class="muted" x="56" y="301" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Cats</text>
  <rect class="b" x="190" y="286" width="311.5" height="20" rx="4" fill="#c2410c" />
  <text class="title" x="509.5" y="301" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">44.5%</text>
  <text class="muted" x="56" y="331" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Other</text>
  <rect class="c" x="190" y="316" width="119.0" height="20" rx="4" fill="#64748b" />
  <text class="title" x="317.0" y="331" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">17.0%</text>
  <text class="muted" x="36" y="368" fill="#526173" font-family="system-ui, sans-serif" font-size="13">Developers only: no non-developer group answered, so this cannot show</text>
  <text class="muted" x="36" y="386" fill="#526173" font-family="system-ui, sans-serif" font-size="13">whether developers like cats more or less than anyone else.</text>
</svg>
