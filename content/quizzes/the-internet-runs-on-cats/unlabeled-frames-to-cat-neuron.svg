<svg xmlns="http://www.w3.org/2000/svg" width="720" height="306" viewBox="0 0 720 306">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --c: #64748b;
      --key: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --c: #8b9bb4;
        --key: #242b36;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .a { fill: var(--a); }
    .a-line { stroke: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .c { fill: var(--c); }
    .key { fill: var(--key); stroke: var(--rail); }
  </style>

  <rect class="panel" width="720" height="306" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Google, 2012: a cat detector nobody asked for</text>
  <rect class="a-soft" x="36" y="80" width="188" height="140" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="title" x="130" y="112" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">10 million frames</text>
  <text class="title" x="130" y="140" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">one per YouTube video</text>
  <text class="title" x="130" y="168" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">200 × 200 pixels</text>
  <text class="title" x="130" y="196" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">no labels at all</text>
  <rect class="a-soft" x="266" y="80" width="188" height="140" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="title" x="360" y="112" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">9-layer sparse</text>
  <text class="title" x="360" y="140" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">autoencoder</text>
  <text class="title" x="360" y="168" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">~1 billion connections</text>
  <text class="title" x="360" y="196" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">16,000 cores, 3 days</text>
  <rect class="b-soft" x="496" y="80" width="188" height="140" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="title" x="590" y="112" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">one top-layer neuron</text>
  <text class="title" x="590" y="140" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">fires strongly for</text>
  <text class="title" x="590" y="168" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">cat faces</text>
  <text class="title" x="590" y="196" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">(others: faces, bodies)</text>
  <path class="a-line" d="M230 150H260m-8-7 8 7-8 7" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path class="a-line" d="M460 150H490m-8-7 8 7-8 7" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="36" y="258" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Training goal: rebuild each image from a small, sparse code.</text>
  <text class="muted" x="36" y="280" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Cat faces are so common on YouTube that the network learned them as a feature.</text>
</svg>
