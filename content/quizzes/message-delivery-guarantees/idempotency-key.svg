<svg xmlns="http://www.w3.org/2000/svg" width="720" height="562" viewBox="0 0 720 562">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ok-fill: #dcfce7;
      --ok-edge: #16a34a;
      --ok-text: #14532d;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ok-fill: #14321f;
        --ok-edge: #4ade80;
        --ok-text: #bbf7d0;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .ok-box { fill: var(--ok-fill); stroke: var(--ok-edge); }
    .ok-text { fill: var(--ok-text); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <rect class="panel" width="720" height="562" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    The retry that would have charged twice
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">POST /charges</tspan> is not idempotent on its own. One header makes it behave as if it were.
  </text>

  <g font-family="system-ui, sans-serif" text-anchor="start">
    <rect class="card" x="36" y="88" width="648" height="54" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <circle class="card" cx="66" cy="115" r="15" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="66" y="120" fill="#20242c" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text class="title" x="96" y="112" fill="#20242c" font-size="13.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">POST /charges · Idempotency-Key: abc-123</text>
    <text class="muted" x="96" y="130" fill="#526173" font-size="11.5">the key is generated by the client, one per logical operation</text>

    <rect class="card" x="36" y="152" width="648" height="54" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <circle class="card" cx="66" cy="179" r="15" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="66" y="184" fill="#20242c" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text class="title" x="96" y="176" fill="#20242c" font-size="13.5" font-weight="700">The charge succeeds, and the server stores key → response</text>
    <text class="muted" x="96" y="194" fill="#526173" font-size="11.5">money has moved; the record of what happened is saved alongside the key</text>

    <rect class="accent-box" x="36" y="216" width="648" height="54" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <circle class="accent-box" cx="66" cy="243" r="15" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="66" y="248" fill="#9a3412" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text class="accent-text" x="96" y="240" fill="#9a3412" font-size="13.5" font-weight="700">The connection drops before the response arrives</text>
    <text class="accent-text" x="96" y="258" fill="#9a3412" font-size="11.5">the client has no idea whether it charged the customer or not</text>

    <rect class="card" x="36" y="280" width="648" height="54" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <circle class="card" cx="66" cy="307" r="15" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="66" y="312" fill="#20242c" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text class="title" x="96" y="304" fill="#20242c" font-size="13.5" font-weight="700">It retries the identical request, with the same key</text>
    <text class="muted" x="96" y="322" fill="#526173" font-size="11.5">same key, same body — anything else is a different operation</text>

    <rect class="ok-box" x="36" y="344" width="648" height="54" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <circle class="ok-box" cx="66" cy="371" r="15" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ok-text" x="66" y="376" fill="#14532d" font-size="14" font-weight="700" text-anchor="middle">5</text>
    <text class="ok-text" x="96" y="368" fill="#14532d" font-size="13.5" font-weight="700">The server finds the key and replays the stored response</text>
    <text class="ok-text" x="96" y="386" fill="#14532d" font-size="11.5">no second charge, and the client finally learns the outcome of the first</text>

    <rect class="card" x="36" y="416" width="648" height="76" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="440" fill="#20242c" font-size="13.5" font-weight="700">What the record has to carry</text>
    <text class="muted" x="52" y="460" fill="#526173" font-size="11.5">the stored response, so a replay is identical · the request fingerprint, so the same key with a different</text>
    <text class="muted" x="52" y="477" fill="#526173" font-size="11.5">body is rejected · an expiry, because nobody keeps keys forever — past a 24 h window the key is new again</text>
  </g>

  <g font-family="system-ui, sans-serif">
    <text class="title" x="36" y="516" fill="#20242c" font-size="13" font-weight="700">Idempotent by definition, per RFC 9110 — six of them, and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">POST</tspan> is not among them:</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-size="12.5" font-weight="700">
    <rect class="info-box" x="36" y="524" width="96" height="26" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="84" y="542" fill="#172554">GET</text>
    <rect class="info-box" x="146" y="524" width="96" height="26" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="194" y="542" fill="#172554">HEAD</text>
    <rect class="info-box" x="256" y="524" width="96" height="26" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="304" y="542" fill="#172554">PUT</text>
    <rect class="info-box" x="366" y="524" width="96" height="26" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="414" y="542" fill="#172554">DELETE</text>
    <rect class="info-box" x="476" y="524" width="96" height="26" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="524" y="542" fill="#172554">OPTIONS</text>
    <rect class="info-box" x="586" y="524" width="96" height="26" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="634" y="542" fill="#172554">TRACE</text>
  </g>
</svg>
