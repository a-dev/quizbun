<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d5dce6;
      --c1: #16a34a;
      --c2: #0284c7;
      --c3: #2563eb;
      --c4: #9333ea;
      --c5: #c2410c;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c49;
        --c1: #4ade80;
        --c2: #38bdf8;
        --c3: #60a5fa;
        --c4: #c084fc;
        --c5: #fb923c;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .axis { stroke: var(--edge); }
    .grid { stroke: var(--grid); }
    .s1 { stroke: var(--c1); }
    .s2 { stroke: var(--c2); }
    .s3 { stroke: var(--c3); }
    .s4 { stroke: var(--c4); }
    .s5 { stroke: var(--c5); }
    .t1 { fill: var(--c1); }
    .t2 { fill: var(--c2); }
    .t3 { fill: var(--c3); }
    .t4 { fill: var(--c4); }
    .t5 { fill: var(--c5); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
  </style>

  <rect class="panel" width="720" height="580" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Five growth curves, and what they cost one render
  </text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    The shape is the point: only the class decides what happens when the data grows.
  </text>

  <g class="grid" stroke="#d5dce6" stroke-width="1" stroke-dasharray="3 5">
    <path d="M64,157 H540" />
    <path d="M64,210 H540" />
    <path d="M64,263 H540" />
  </g>

  <g class="axis" stroke="#64748b" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M64,104 V316 H540" />
  </g>

  <g fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path class="s1" stroke="#16a34a" d="M64.0,305.4 540.0,305.4" />
    <path class="s2" stroke="#0284c7" d="M64.0,305.4 75.9,290.0 87.8,282.2 99.7,276.9 111.6,273.0 123.5,269.8 135.4,267.1 147.3,264.8 159.2,262.8 171.1,261.0 183.0,259.4 194.9,258.0 206.8,256.6 218.7,255.4 230.6,254.2 242.5,253.1 254.4,252.1 266.3,251.2 278.2,250.3 290.1,249.4 302.0,248.6 313.9,247.8 325.8,247.1 337.7,246.4 349.6,245.7 361.5,245.1 373.4,244.5 385.3,243.8 397.2,243.3 409.1,242.7 421.0,242.2 432.9,241.6 444.8,241.1 456.7,240.6 468.6,240.2 480.5,239.7 492.4,239.3 504.3,238.8 516.2,238.4 528.1,238.0 540.0,237.6" />
    <path class="s3" stroke="#2563eb" d="M64.0,316.0 540.0,121.0" />
    <path class="s4" stroke="#9333ea" d="M64.0,316.0 75.9,314.4 87.8,311.2 99.7,307.2 111.6,302.6 123.5,297.6 135.4,292.3 147.3,286.7 159.2,280.9 171.1,274.8 183.0,268.6 194.9,262.2 206.8,255.6 218.7,248.9 230.6,242.1 242.5,235.2 254.4,228.1 266.3,220.9 278.2,213.7 290.1,206.3 302.0,198.9 313.9,191.4 325.8,183.7 337.7,176.1 349.6,168.3 361.5,160.5 373.4,152.6 385.3,144.6 397.2,136.6 409.1,128.5 421.0,120.4 432.9,112.2 444.7,104.0" />
    <path class="s5" stroke="#c2410c" d="M64.0,316.0 75.9,315.2 87.8,312.8 99.7,308.8 111.6,303.3 123.5,296.1 135.4,287.4 147.3,277.0 159.2,265.1 171.1,251.6 183.0,236.5 194.9,219.8 206.8,201.5 218.7,181.6 230.6,160.2 242.5,137.1 254.4,112.5 258.3,104.0" />
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700">
    <text class="t5" x="266" y="100" fill="#c2410c">O(n²)</text>
    <text class="t4" x="452" y="100" fill="#9333ea">O(n log n)</text>
    <text class="t3" x="548" y="120" fill="#2563eb">O(n)</text>
    <text class="t2" x="548" y="241" fill="#0284c7">O(log n)</text>
    <text class="t1" x="548" y="309" fill="#16a34a">O(1)</text>
  </g>

  <g font-family="system-ui, sans-serif" font-size="12" class="muted" fill="#526173">
    <text x="64" y="336">input size n →</text>
    <text x="56" y="100" text-anchor="end">work</text>
  </g>

  <text class="muted" x="36" y="356" fill="#526173" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Rough operation counts</text>
  <rect class="card" x="36" y="368" width="648" height="122" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />

  <g font-family="system-ui, sans-serif" font-size="12.5">
    <path class="axis" d="M52,412 H668" stroke="#64748b" stroke-width="1.5" />
    <g class="muted" fill="#526173" font-weight="700" text-anchor="end">
      <text x="106" y="402" text-anchor="start">n</text>
      <text class="t1" x="230" y="402" fill="#16a34a">O(1)</text>
      <text class="t2" x="330" y="402" fill="#0284c7">O(log n)</text>
      <text class="t3" x="430" y="402" fill="#2563eb">O(n)</text>
      <text class="t4" x="550" y="402" fill="#9333ea">O(n log n)</text>
      <text class="t5" x="668" y="402" fill="#c2410c">O(n²)</text>
    </g>
    <g class="title" fill="#20242c" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="106" y="434" text-anchor="start">10</text>
      <text x="230" y="434">1</text>
      <text x="330" y="434">3</text>
      <text x="430" y="434">10</text>
      <text x="550" y="434">33</text>
      <text x="668" y="434">100</text>

      <text x="106" y="458" text-anchor="start">1,000</text>
      <text x="230" y="458">1</text>
      <text x="330" y="458">10</text>
      <text x="430" y="458">1,000</text>
      <text x="550" y="458">9,966</text>
      <text x="668" y="458">1,000,000</text>

      <text x="106" y="482" text-anchor="start">10,000</text>
      <text x="230" y="482">1</text>
      <text x="330" y="482">13</text>
      <text x="430" y="482">10,000</text>
      <text x="550" y="482">132,877</text>
      <text x="668" y="482">100,000,000</text>
    </g>
  </g>

  <rect class="info-box" x="36" y="498" width="648" height="52" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <g font-family="system-ui, sans-serif" font-size="13" class="info-text" fill="#172554">
    <text x="52" y="521">Grow n by 1,000× and n² grows 1,000,000×. A frame lasts 16 ms, so the last cell in that row is</text>
    <text x="52" y="540">hundreds of milliseconds of blocked main thread, the same list that felt instant at ten rows.</text>
  </g>
</svg>
