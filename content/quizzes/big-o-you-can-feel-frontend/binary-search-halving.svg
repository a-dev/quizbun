      <rect class="accent-box" x="362" y="112" width="30" height="28" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5" />
      <rect class="info-box" x="396" y="112" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <rect class="info-box" x="430" y="112" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <rect class="info-box" x="464" y="112" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <rect class="info-box" x="498" y="112" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <rect class="info-box" x="532" y="112" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <rect class="info-box" x="566" y="112" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <rect class="info-box" x="600" y="112" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <rect class="info-box" x="634" y="112" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <text class="info-text" x="139" y="131" fill="#172554" font-weight="700">lo</text>
      <text class="accent-text" x="377" y="131" fill="#9a3412" font-weight="700">mid</text>
      <text class="info-text" x="649" y="131" fill="#172554" font-weight="700">hi</text>
    </g>

    <g>
      <rect class="dead" x="124" y="158" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="158" y="158" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="192" y="158" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="226" y="158" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="260" y="158" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="294" y="158" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="328" y="158" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="362" y="158" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="info-box" x="396" y="158" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <rect class="info-box" x="430" y="158" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <rect class="info-box" x="464" y="158" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <rect class="accent-box" x="498" y="158" width="30" height="28" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5" />
      <rect class="info-box" x="532" y="158" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <rect class="info-box" x="566" y="158" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <rect class="info-box" x="600" y="158" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <rect class="info-box" x="634" y="158" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <text class="info-text" x="411" y="177" fill="#172554" font-weight="700">lo</text>
      <text class="accent-text" x="513" y="177" fill="#9a3412" font-weight="700">mid</text>
      <text class="info-text" x="649" y="177" fill="#172554" font-weight="700">hi</text>
    </g>

    <g>
      <rect class="dead" x="124" y="204" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="158" y="204" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="192" y="204" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="226" y="204" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="260" y="204" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="294" y="204" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="328" y="204" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="362" y="204" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="info-box" x="396" y="204" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <rect class="accent-box" x="430" y="204" width="30" height="28" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5" />
      <rect class="info-box" x="464" y="204" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <rect class="dead" x="498" y="204" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="532" y="204" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="566" y="204" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="600" y="204" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <rect class="dead" x="634" y="204" width="30" height="28" rx="6" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1" stroke-dasharray="3 3" />
      <text class="info-text" x="411" y="223" fill="#172554" font-weight="700">lo</text>
      <text class="accent-text" x="445" y="223" fill="#9a3412" font-weight="700">mid</text>
      <text class="info-text" x="479" y="223" fill="#172554" font-weight="700">hi</text>
    </g>
  </g>

  <text class="muted" x="124" y="252" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">
    Step 2 excludes <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">mid</tspan> itself: it was already compared, so <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">lo = mid + 1</tspan>, not <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lo = mid</tspan>.
  </text>

  <rect class="card" x="36" y="268" width="316" height="146" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <g font-family="system-ui, sans-serif">
    <text class="title" x="54" y="294" fill="#20242c" font-size="14" font-weight="700">Why that <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">+ 1</tspan> is not cosmetic</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">
      <text class="muted" x="54" y="318" fill="#526173">lo = 0, hi = 1  →  mid = floor(0.5) = 0</text>
      <text class="accent-text" x="54" y="346" fill="#9a3412" font-weight="700">lo = mid</text>
      <text class="accent-text" x="130" y="346" fill="#9a3412">range 0..1 again, forever</text>
      <text class="good-text" x="54" y="370" fill="#14532d" font-weight="700">lo = mid + 1</text>
      <text class="good-text" x="146" y="370" fill="#14532d">range 1..1, it shrinks</text>
    </g>
    <text class="muted" x="54" y="396" fill="#526173" font-size="11.5">Floor biases <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">mid</tspan> toward <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">lo</tspan>, which is where the stall lives.</text>
  </g>

  <rect class="card" x="368" y="268" width="316" height="146" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <g font-family="system-ui, sans-serif">
    <text class="title" x="386" y="294" fill="#20242c" font-size="14" font-weight="700">Lower bound answers "where does x begin?"</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect class="card" x="386" y="308" width="44" height="30" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <rect class="good-box" x="438" y="308" width="44" height="30" rx="7" fill="#ffffff" stroke="#16a34a" stroke-width="2.5" />
      <rect class="card" x="490" y="308" width="44" height="30" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <rect class="card" x="542" y="308" width="44" height="30" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <rect class="accent-box" x="594" y="308" width="44" height="30" rx="7" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5" />
      <text class="title" x="408" y="328" fill="#20242c">3</text>
      <text class="good-text" x="460" y="328" fill="#14532d" font-weight="700">5</text>
      <text class="title" x="512" y="328" fill="#20242c">5</text>
      <text class="title" x="564" y="328" fill="#20242c">5</text>
      <text class="accent-text" x="616" y="328" fill="#9a3412" font-weight="700">9</text>
    </g>
    <g font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">
      <text class="good-text" x="460" y="354" fill="#14532d" font-weight="700">lower bound</text>
      <text class="accent-text" x="616" y="354" fill="#9a3412" font-weight="700">upper bound</text>
    </g>
    <text class="muted" x="386" y="378" fill="#526173" font-size="11.5">Searching for 5: first slot not less than it, and one past</text>
    <text class="muted" x="386" y="395" fill="#526173" font-size="11.5">the last copy. Absent values land on the insertion point.</text>
  </g>

  <rect class="card" x="36" y="430" width="648" height="82" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <g font-family="system-ui, sans-serif">
    <text class="title" x="54" y="456" fill="#20242c" font-size="14" font-weight="700">Worst case is <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ceil(log2 n)</tspan>, so doubling the data costs exactly one more comparison</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" text-anchor="middle">
      <text class="muted" x="110" y="486" fill="#526173">1,000,000</text>
      <text class="info-text" x="192" y="486" fill="#172554" font-weight="700">20</text>
      <text class="muted" x="300" y="486" fill="#526173">2,000,000</text>
      <text class="info-text" x="382" y="486" fill="#172554" font-weight="700">21</text>
      <text class="muted" x="490" y="486" fill="#526173">4,000,000</text>
      <text class="info-text" x="572" y="486" fill="#172554" font-weight="700">22</text>
    </g>
    <text class="muted" x="54" y="503" fill="#526173" font-size="11.5">A linear scan pays a million more comparisons for that same doubling.</text>
  </g>
</svg>
