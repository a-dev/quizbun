<svg xmlns="http://www.w3.org/2000/svg" width="720" height="536" viewBox="0 0 720 536">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-fill: #e8ecf3;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-fill: #20262e;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .dead { fill: var(--dead-fill); stroke: var(--dead-text); }
    .dead-text { fill: var(--dead-text); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
    .good-box { fill: var(--card); stroke: var(--good-edge); }
    .good-text { fill: var(--good-text); }
  </style>

  <rect class="panel" width="720" height="536" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Binary search: every comparison throws away half of what is left
  </text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Sixteen sorted slots, inclusive bounds. Blue is still in play; grey is already excluded.
  </text>

  <g font-family="system-ui, sans-serif" font-size="11" font-weight="700">
    <text class="muted" x="36" y="126" fill="#526173">step 1</text>
    <text class="dead-text" x="36" y="141" fill="#8a97a8" font-weight="400">16 left</text>
    <text class="muted" x="36" y="172" fill="#526173">step 2</text>
    <text class="dead-text" x="36" y="187" fill="#8a97a8" font-weight="400">8 left</text>
    <text class="muted" x="36" y="218" fill="#526173">step 3</text>
    <text class="dead-text" x="36" y="233" fill="#8a97a8" font-weight="400">3 left</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="middle">
    <g>
      <rect class="info-box" x="124" y="112" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
      <rect class="info-box" x="158" y="112" width="30" height="28" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
