<svg xmlns="http://www.w3.org/2000/svg" width="720" height="504" viewBox="0 0 720 504">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .edge-line { stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-line { stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .good-text { fill: var(--good-text); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-edge)" />
    </marker>
  </defs>

  <rect class="panel" width="720" height="504" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    One membership test, two data structures
  </text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Asking "is this id in there?" costs a walk or a probe, and the choice decides the whole render.
  </text>

  <rect class="card" x="36" y="88" width="316" height="200" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <rect class="card" x="368" y="88" width="316" height="200" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />

  <g font-family="system-ui, sans-serif">
    <text class="title" x="54" y="115" fill="#20242c" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">arr.includes(x)</text>
    <text class="accent-text" x="336" y="115" fill="#9a3412" font-size="12.5" font-weight="700" text-anchor="end">linear scan</text>
    <text class="title" x="386" y="115" fill="#20242c" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">set.has(x)</text>
    <text class="good-text" x="668" y="115" fill="#14532d" font-size="12.5" font-weight="700" text-anchor="end">hash probe</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
      <rect class="card" x="56" y="140" width="24" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <rect class="card" x="84" y="140" width="24" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <rect class="card" x="112" y="140" width="24" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <rect class="card" x="140" y="140" width="24" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <rect class="card" x="168" y="140" width="24" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <rect class="card" x="196" y="140" width="24" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <rect class="card" x="224" y="140" width="24" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <rect class="card" x="252" y="140" width="24" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <rect class="card" x="280" y="140" width="24" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <rect class="card" x="308" y="140" width="24" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <text class="muted" x="68" y="161" fill="#526173">0</text>
      <text class="muted" x="96" y="161" fill="#526173">1</text>
      <text class="muted" x="124" y="161" fill="#526173">2</text>
      <text class="muted" x="152" y="161" fill="#526173">3</text>
      <text class="muted" x="180" y="161" fill="#526173">…</text>
      <text class="muted" x="208" y="161" fill="#526173">…</text>
      <text class="muted" x="236" y="161" fill="#526173">…</text>
      <text class="muted" x="264" y="161" fill="#526173">…</text>
      <text class="muted" x="292" y="161" fill="#526173">…</text>
      <text class="accent-text" x="320" y="161" fill="#9a3412" font-weight="700">n−1</text>
    </g>
    <path class="accent-line" d="M62,188 H326" fill="none" stroke="#c2410c" stroke-width="2.5" marker-end="url(#arrow-accent)" />
    <text class="accent-text" x="194" y="210" fill="#9a3412" font-size="12" font-weight="700" text-anchor="middle">compare, compare, compare…</text>

    <text class="muted" x="54" y="238" fill="#526173" font-size="12">Average n/2 hits, worst n. A <tspan font-weight="700">miss always</tspan> costs the</text>
    <text class="muted" x="54" y="255" fill="#526173" font-size="12">full n, because nothing stops the walk early.</text>
    <text class="muted" x="54" y="274" fill="#526173" font-size="12">Same story for <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.indexOf</tspan> and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">.find</tspan>.</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="middle">
      <rect class="card" x="386" y="140" width="76" height="30" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <text class="title" x="424" y="160" fill="#20242c">x</text>
      <rect class="info-box" x="486" y="140" width="86" height="30" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
      <text class="info-text" x="529" y="160" fill="#172554">hash(x)</text>
      <text class="muted" x="628" y="160" fill="#526173" font-size="11.5" font-family="system-ui, sans-serif">→ bucket 3</text>
    </g>
    <path class="edge-line" d="M466,155 H482" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
    <path class="edge-line" d="M529,174 V192" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
      <rect class="card" x="386" y="196" width="42" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <rect class="card" x="434" y="196" width="42" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <rect class="card" x="482" y="196" width="42" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <rect class="good-box" x="530" y="196" width="42" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
      <rect class="card" x="578" y="196" width="42" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <rect class="card" x="626" y="196" width="42" height="32" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <text class="muted" x="407" y="217" fill="#526173">0</text>
      <text class="muted" x="455" y="217" fill="#526173">1</text>
      <text class="muted" x="503" y="217" fill="#526173">2</text>
      <text class="good-text" x="551" y="217" fill="#14532d" font-weight="700">3</text>
      <text class="muted" x="599" y="217" fill="#526173">4</text>
      <text class="muted" x="647" y="217" fill="#526173">5</text>
    </g>

    <text class="muted" x="386" y="255" fill="#526173" font-size="12">One hash, one bucket, the cost does not move when</text>
    <text class="muted" x="386" y="272" fill="#526173" font-size="12">n grows. Sameness is SameValueZero, so <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">NaN</tspan> dedupes.</text>
  </g>

  <rect class="card" x="36" y="304" width="648" height="168" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <g font-family="system-ui, sans-serif">
    <text class="title" x="54" y="330" fill="#20242c" font-size="15" font-weight="700">The quadratic that hides inside one readable line</text>
    <text class="title" x="54" y="356" fill="#20242c" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rows.filter(r =&gt; selectedIds.includes(r.id))</text>
    <text class="muted" x="668" y="356" fill="#526173" font-size="11.5" text-anchor="end">1,000 rows · 1,000 selected ids · no matches</text>

    <rect class="accent-box" x="54" y="372" width="612" height="40" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="70" y="397" fill="#9a3412" font-size="13">1,000 rows × a 1,000-element scan each</text>
    <text class="accent-text" x="650" y="397" fill="#9a3412" font-size="15" font-weight="700" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">1,000,000</text>

    <rect class="good-box" x="54" y="418" width="612" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="good-text" x="70" y="443" fill="#14532d" font-size="13">Build the Set once (1,000), then 1,000 constant-time probes</text>
    <text class="good-text" x="650" y="443" fill="#14532d" font-size="15" font-weight="700" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">≈ 2,000</text>
  </g>
</svg>
