<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ctx-fill: #dbeafe;
      --ctx-edge: #2563eb;
      --ctx-label: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ctx-fill: #1e3a5f;
        --ctx-edge: #60a5fa;
        --ctx-label: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel-bg { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge-line { stroke: var(--edge); }
    .lane-label { fill: var(--title); }
    .conn-band { fill: var(--ctx-fill); stroke: var(--ctx-edge); }
    .parked { fill: var(--ctx-fill); stroke: var(--ctx-edge); }
    .accent-text { fill: var(--accent-text); }
    .accent-dot { fill: var(--accent-edge); }
    .accent-line { stroke: var(--accent-edge); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" fill-rule="evenodd" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-edge)" fill-rule="evenodd" />
    </marker>
  </defs>

  <rect class="panel-bg" width="720" height="760" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Four ways to learn the same event happened
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Time runs left to right. The dashed line marks the instant the server-side event occurs.
  </text>

  <line x1="390" y1="128" x2="390" y2="678" class="accent-line" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 5" />
  <text class="accent-text" x="396" y="124" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12" font-weight="700">event occurs here</text>

  <!-- Lane 1: Short polling -->
  <g font-family="system-ui, sans-serif">
    <text class="lane-label" x="36" y="112" fill="#20242c" font-size="15" font-weight="700">Short polling</text>
    <text class="muted" x="684" y="112" fill="#526173" font-size="12" text-anchor="end">worst case ≈ the whole interval</text>
    <text class="muted" x="40" y="138" fill="#526173" font-size="12">Client</text>
    <text class="muted" x="684" y="208" fill="#526173" font-size="12" text-anchor="end">Server</text>

    <g class="edge-line" stroke="#64748b" stroke-width="2">
      <line x1="150" y1="134" x2="150" y2="204" marker-end="url(#arrow)" />
      <line x1="160" y1="204" x2="160" y2="134" marker-end="url(#arrow)" />
      <line x1="230" y1="134" x2="230" y2="204" marker-end="url(#arrow)" />
      <line x1="240" y1="204" x2="240" y2="134" marker-end="url(#arrow)" />
      <line x1="310" y1="134" x2="310" y2="204" marker-end="url(#arrow)" />
      <line x1="320" y1="204" x2="320" y2="134" marker-end="url(#arrow)" />
      <line x1="550" y1="134" x2="550" y2="204" marker-end="url(#arrow)" />
      <line x1="560" y1="204" x2="560" y2="134" marker-end="url(#arrow)" />
      <line x1="630" y1="134" x2="630" y2="204" marker-end="url(#arrow)" />
      <line x1="640" y1="204" x2="640" y2="134" marker-end="url(#arrow)" />
    </g>
    <g class="accent-line" stroke="#c2410c" stroke-width="2">
      <line x1="470" y1="134" x2="470" y2="204" marker-end="url(#arrow-accent)" />
      <line x1="480" y1="204" x2="480" y2="134" marker-end="url(#arrow-accent)" />
    </g>
    <text class="muted" x="160" y="222" fill="#526173" font-size="10.5" text-anchor="middle">empty</text>
    <text class="muted" x="320" y="222" fill="#526173" font-size="10.5" text-anchor="middle">empty</text>
    <text class="accent-text" x="480" y="222" fill="#9a3412" font-size="11" font-weight="700" text-anchor="middle">data!</text>

    <g class="edge-line" stroke="#526173" stroke-width="1.5">
      <line x1="390" y1="232" x2="470" y2="232" marker-end="url(#arrow)" marker-start="url(#arrow)" />
    </g>
    <text class="muted" x="430" y="228" fill="#526173" font-size="10.5" text-anchor="middle">waits out the interval</text>
  </g>

  <!-- Lane 2: Long polling -->
  <g font-family="system-ui, sans-serif">
    <text class="lane-label" x="36" y="262" fill="#20242c" font-size="15" font-weight="700">Long polling</text>
    <text class="muted" x="684" y="262" fill="#526173" font-size="12" text-anchor="end">~one round-trip after the event</text>
    <text class="muted" x="40" y="288" fill="#526173" font-size="12">Client</text>
    <text class="muted" x="684" y="358" fill="#526173" font-size="12" text-anchor="end">Server</text>

    <rect class="parked" x="150" y="315" width="240" height="12" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" />
    <text class="muted" x="270" y="336" fill="#526173" font-size="10.5" text-anchor="middle">request parked</text>

    <rect class="parked" x="400" y="315" width="230" height="12" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" />
    <text class="muted" x="515" y="336" fill="#526173" font-size="10.5" text-anchor="middle">next request parked at once</text>

    <g class="accent-line" stroke="#c2410c" stroke-width="2">
      <line x1="392" y1="358" x2="392" y2="288" marker-end="url(#arrow-accent)" />
    </g>
    <text class="accent-text" x="398" y="300" fill="#9a3412" font-size="11" font-weight="700">data!</text>
  </g>

  <!-- Lane 3: Server-Sent Events -->
  <g font-family="system-ui, sans-serif">
    <text class="lane-label" x="36" y="412" fill="#20242c" font-size="15" font-weight="700">Server-Sent Events</text>
    <text class="muted" x="684" y="412" fill="#526173" font-size="12" text-anchor="end">pushed the instant it exists</text>
    <text class="muted" x="40" y="438" fill="#526173" font-size="12">Client</text>
    <text class="muted" x="684" y="508" fill="#526173" font-size="12" text-anchor="end">Server</text>

    <rect class="conn-band" x="150" y="465" width="480" height="12" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" />
    <text class="muted" x="390" y="486" fill="#526173" font-size="10.5" text-anchor="middle">one open connection, no new requests</text>

    <circle class="conn-band" cx="230" cy="471" r="4" fill="#2563eb" />
    <line x1="230" y1="467" x2="230" y2="438" class="edge-line" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />

    <circle class="accent-dot" cx="390" cy="471" r="5.5" fill="#c2410c" />
    <line x1="390" y1="465" x2="390" y2="438" class="accent-line" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow-accent)" />
    <text class="accent-text" x="396" y="430" fill="#9a3412" font-size="11" font-weight="700">pushed now</text>

    <circle class="conn-band" cx="520" cy="471" r="4" fill="#2563eb" />
    <line x1="520" y1="467" x2="520" y2="438" class="edge-line" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <!-- Lane 4: WebSocket -->
  <g font-family="system-ui, sans-serif">
    <text class="lane-label" x="36" y="562" fill="#20242c" font-size="15" font-weight="700">WebSocket</text>
    <text class="muted" x="684" y="562" fill="#526173" font-size="12" text-anchor="end">either side, any time</text>
    <text class="muted" x="40" y="588" fill="#526173" font-size="12">Client</text>
    <text class="muted" x="684" y="658" fill="#526173" font-size="12" text-anchor="end">Server</text>

    <rect class="conn-band" x="150" y="615" width="480" height="12" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3" />
    <text class="muted" x="390" y="636" fill="#526173" font-size="10.5" text-anchor="middle">one open, full-duplex connection</text>

    <line x1="260" y1="588" x2="260" y2="615" class="edge-line" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
    <line x1="390" y1="615" x2="390" y2="588" class="accent-line" stroke="#c2410c" stroke-width="2" marker-end="url(#arrow-accent)" />
    <text class="accent-text" x="396" y="580" fill="#9a3412" font-size="11" font-weight="700">pushed now</text>
    <line x1="520" y1="588" x2="520" y2="615" class="edge-line" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <g font-family="system-ui, sans-serif">
    <text class="muted" x="36" y="712" fill="#526173" font-size="12">↓ client → server</text>
    <text class="muted" x="220" y="712" fill="#526173" font-size="12">↑ server → client</text>
    <text class="muted" x="420" y="712" fill="#526173" font-size="12">▭ dashed band = one connection held open, no per-message request</text>
  </g>
</svg>
