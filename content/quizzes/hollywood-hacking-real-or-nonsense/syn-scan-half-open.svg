<svg xmlns="http://www.w3.org/2000/svg" width="720" height="456" viewBox="0 0 720 456">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --card: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --accent: #b45309;
      --danger: #b91c1c;
      --ok: #15803d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --card: #232a35;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --accent: #f59e0b;
        --danger: #f87171;
        --ok: #4ade80;
      }
    }

    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .edge-fill { fill: var(--edge); }
    .accent { fill: var(--accent); }
    .accent-stroke { stroke: var(--accent); }
    .danger { fill: var(--danger); }
    .danger-stroke { stroke: var(--danger); }
    .ok { fill: var(--ok); }
    .ok-stroke { stroke: var(--ok); }
  </style>

  <rect class="panel" width="720" height="456" rx="20" fill="#f5f7fb" />
  <rect class="card" x="12.0" y="56" width="216.0" height="312" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text class="title" x="120.0" y="86" fill="#20242c" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Open port</text>
  <text class="muted" x="48.0" y="114" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Nmap</text>
  <text class="muted" x="192.0" y="114" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Target</text>
  <line class="edge" x1="48.0" y1="122" x2="48.0" y2="300" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line class="edge" x1="192.0" y1="122" x2="192.0" y2="300" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line class="edge-stroke" x1="48.0" y1="160" x2="182.0" y2="160" stroke="#64748b" stroke-width="2.5"/>
  <path class="edge" d="M192.0 160 L180.0 154 L180.0 166 Z" fill="#64748b"/>
  <text class="title" x="120.0" y="151" fill="#20242c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">SYN</text>
  <line class="ok-stroke" x1="192.0" y1="210" x2="58.0" y2="210" stroke="#15803d" stroke-width="2.5"/>
  <path class="ok" d="M48.0 210 L60.0 204 L60.0 216 Z" fill="#15803d"/>
  <text class="title" x="120.0" y="201" fill="#20242c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">SYN/ACK</text>
  <line class="accent-stroke" x1="48.0" y1="260" x2="182.0" y2="260" stroke="#b45309" stroke-width="2.5"/>
  <path class="accent" d="M192.0 260 L180.0 254 L180.0 266 Z" fill="#b45309"/>
  <text class="title" x="120.0" y="251" fill="#20242c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">RST</text>
  <text class="ok" x="120.0" y="340" fill="#15803d" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">SYN/ACK: open</text>
  <rect class="card" x="252.0" y="56" width="216.0" height="312" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text class="title" x="360.0" y="86" fill="#20242c" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Closed port</text>
  <text class="muted" x="288.0" y="114" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Nmap</text>
  <text class="muted" x="432.0" y="114" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Target</text>
  <line class="edge" x1="288.0" y1="122" x2="288.0" y2="300" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line class="edge" x1="432.0" y1="122" x2="432.0" y2="300" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line class="edge-stroke" x1="288.0" y1="160" x2="422.0" y2="160" stroke="#64748b" stroke-width="2.5"/>
  <path class="edge" d="M432.0 160 L420.0 154 L420.0 166 Z" fill="#64748b"/>
  <text class="title" x="360.0" y="151" fill="#20242c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">SYN</text>
  <line class="edge-stroke" x1="432.0" y1="210" x2="298.0" y2="210" stroke="#64748b" stroke-width="2.5"/>
  <path class="edge" d="M288.0 210 L300.0 204 L300.0 216 Z" fill="#64748b"/>
  <text class="title" x="360.0" y="201" fill="#20242c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">RST</text>
  <text class="muted" x="360.0" y="340" fill="#526173" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">RST: closed</text>
  <rect class="card" x="492.0" y="56" width="216.0" height="312" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text class="title" x="600.0" y="86" fill="#20242c" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Filtered port</text>
  <text class="muted" x="528.0" y="114" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Nmap</text>
  <text class="muted" x="672.0" y="114" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Target</text>
  <line class="edge" x1="528.0" y1="122" x2="528.0" y2="300" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line class="edge" x1="672.0" y1="122" x2="672.0" y2="300" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 4"/>
  <line class="edge-stroke" x1="528.0" y1="160" x2="662.0" y2="160" stroke="#64748b" stroke-width="2.5"/>
  <path class="edge" d="M672.0 160 L660.0 154 L660.0 166 Z" fill="#64748b"/>
  <text class="title" x="600.0" y="151" fill="#20242c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">SYN</text>
  <line class="edge-stroke" x1="528.0" y1="230" x2="662.0" y2="230" stroke="#64748b" stroke-width="2.5" stroke-dasharray="6 5"/>
  <path class="edge" d="M672.0 230 L660.0 224 L660.0 236 Z" fill="#64748b"/>
  <text class="title" x="600.0" y="221" fill="#20242c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">SYN (retry)</text>
  <text class="danger" x="600.0" y="276" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">no reply</text>
  <text class="danger" x="600.0" y="340" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Silence: filtered</text>
  <text class="title" x="360" y="34" fill="#20242c" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">nmap -sS: how a SYN scan tests each port</text>
  <text class="accent" x="360" y="404" fill="#b45309" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">A normal client answers SYN/ACK with ACK and connects.</text>
  <text class="muted" x="360" y="430" fill="#526173" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">The scanner sends RST instead, so the connection never opens. That's a half-open scan.</text>
</svg>
