<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --card: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --accent: #b45309;
      --danger: #b91c1c;
      --ok: #15803d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --card: #232a35;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --accent: #f59e0b;
        --danger: #f87171;
        --ok: #4ade80;
      }
    }

    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .edge-fill { fill: var(--edge); }
    .accent { fill: var(--accent); }
    .accent-stroke { stroke: var(--accent); }
    .danger { fill: var(--danger); }
    .danger-stroke { stroke: var(--danger); }
    .ok { fill: var(--ok); }
    .ok-stroke { stroke: var(--ok); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="edge-fill" d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="panel" width="720" height="400" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    How a surname can turn into a boolean
  </text>

  <g font-family="system-ui, sans-serif">
    <!-- Step 1: form -->
    <rect class="card" x="36" y="80" width="190" height="110" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="56" y="108" fill="#526173" font-size="14">Last name</text>
    <rect class="edge" x="56" y="120" width="150" height="40" rx="6" fill="none" stroke="#64748b" stroke-width="2" />
    <text class="title" x="70" y="147" fill="#20242c" font-size="17">True</text>
    <text class="muted" x="131" y="180" fill="#526173" font-size="13" text-anchor="middle">what she typed</text>

    <path class="edge" d="M230 135H272" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step 2: parsed without quotes -->
    <rect class="card" x="276" y="80" width="190" height="110" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="3" />
    <text class="title" x="371" y="108" fill="#20242c" font-size="15" font-weight="700" text-anchor="middle">Parsed as a literal</text>
    <text class="accent" x="371" y="146" fill="#b45309" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" text-anchor="middle">lastName: true</text>
    <text class="muted" x="371" y="176" fill="#526173" font-size="13" text-anchor="middle">no quotes, so no string</text>

    <path class="edge" d="M470 135H512" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <!-- Step 3: schema check -->
    <rect class="card" x="516" y="80" width="168" height="110" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="3" />
    <text class="title" x="600" y="108" fill="#20242c" font-size="15" font-weight="700" text-anchor="middle">Schema check</text>
    <text class="muted" x="600" y="136" fill="#526173" font-size="13" text-anchor="middle">lastName must be</text>
    <text class="muted" x="600" y="154" fill="#526173" font-size="13" text-anchor="middle">a string</text>
    <text class="danger" x="600" y="178" fill="#b91c1c" font-size="14" font-weight="700" text-anchor="middle">Type error</text>

    <!-- Comparison: what the value should be -->
    <path class="edge" d="M36 226H684" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="6 6" />

    <text class="title" x="36" y="264" fill="#20242c" font-size="15" font-weight="700">Same four letters, two different values</text>

    <rect class="card" x="36" y="282" width="310" height="76" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="2" />
    <text class="ok" x="191" y="316" fill="#15803d" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" text-anchor="middle">"True"</text>
    <text class="muted" x="191" y="342" fill="#526173" font-size="13" text-anchor="middle">string: a surname, kept as text</text>

    <rect class="card" x="374" y="282" width="310" height="76" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="2" />
    <text class="danger" x="529" y="316" fill="#b91c1c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" text-anchor="middle">true</text>
    <text class="muted" x="529" y="342" fill="#526173" font-size="13" text-anchor="middle">boolean: yes/no, no longer a name</text>

    <text class="muted" x="36" y="386" fill="#526173" font-size="13">Illustrative. Apple has not published the cause; this is the mechanism the error message points to.</text>
  </g>
</svg>
