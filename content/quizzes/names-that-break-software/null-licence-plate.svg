<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --card: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --accent: #b45309;
      --danger: #b91c1c;
      --ok: #15803d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --card: #232a35;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --accent: #f59e0b;
        --danger: #f87171;
        --ok: #4ade80;
      }
    }

    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .edge-fill { fill: var(--edge); }
    .accent { fill: var(--accent); }
    .accent-stroke { stroke: var(--accent); }
    .danger { fill: var(--danger); }
    .danger-stroke { stroke: var(--danger); }
    .ok { fill: var(--ok); }
    .ok-stroke { stroke: var(--ok); }
  </style>

  <rect class="panel" width="560" height="300" rx="20" fill="#f5f7fb" />

  <!-- A generic plate: no state name, no state design -->
  <rect class="card" x="60" y="50" width="440" height="200" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="4" />
  <rect class="edge" x="76" y="66" width="408" height="168" rx="10" fill="none" stroke="#64748b" stroke-width="2" />
  <circle class="edge-fill" cx="110" cy="84" r="6" fill="#64748b" />
  <circle class="edge-fill" cx="450" cy="84" r="6" fill="#64748b" />
  <text class="title" x="280" y="192" fill="#20242c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="96" font-weight="700" text-anchor="middle" letter-spacing="10">NULL</text>
  <text class="muted" x="280" y="226" fill="#526173" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle">VANITY PLATE</text>
</svg>
