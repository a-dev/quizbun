<svg xmlns="http://www.w3.org/2000/svg" width="720" height="460" viewBox="0 0 720 460">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --card: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --accent: #b45309;
      --danger: #b91c1c;
      --ok: #15803d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --card: #232a35;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --accent: #f59e0b;
        --danger: #f87171;
        --ok: #4ade80;
      }
    }

    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .edge-fill { fill: var(--edge); }
    .accent { fill: var(--accent); }
    .accent-stroke { stroke: var(--accent); }
    .danger { fill: var(--danger); }
    .danger-stroke { stroke: var(--danger); }
    .ok { fill: var(--ok); }
    .ok-stroke { stroke: var(--ok); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="edge-fill" d="M0 0L10 5L0 10z" fill="#64748b" />
    </marker>
  </defs>

  <rect class="panel" width="720" height="460" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Where a ticket with no plate ends up
  </text>

  <g font-family="system-ui, sans-serif">
    <!-- Row 1: the bug -->
    <text class="danger" x="36" y="86" fill="#b91c1c" font-size="15" font-weight="700">Bug: blank plate saved as the text "NULL"</text>

    <rect class="card" x="36" y="100" width="180" height="96" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="126" y="128" fill="#20242c" font-size="15" font-weight="700" text-anchor="middle">Parking ticket</text>
    <text class="muted" x="126" y="152" fill="#526173" font-size="14" text-anchor="middle">Car: Honda</text>
    <text class="muted" x="126" y="174" fill="#526173" font-size="14" text-anchor="middle">Plate: (left blank)</text>

    <path class="edge" d="M220 148H262" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <rect class="card" x="266" y="100" width="190" height="96" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="361" y="128" fill="#20242c" font-size="15" font-weight="700" text-anchor="middle">Citation record</text>
    <text class="danger" x="361" y="162" fill="#b91c1c" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">plate = 'NULL'</text>
    <text class="muted" x="361" y="184" fill="#526173" font-size="13" text-anchor="middle">a four-letter string</text>

    <path class="edge" d="M460 148H502" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <rect class="card" x="506" y="100" width="178" height="96" rx="10" fill="#ffffff" stroke="#b91c1c" stroke-width="3" />
    <text class="title" x="595" y="128" fill="#20242c" font-size="15" font-weight="700" text-anchor="middle">Owner lookup</text>
    <text class="danger" x="595" y="156" fill="#b91c1c" font-size="14" text-anchor="middle">'NULL' = 'NULL'</text>
    <text class="danger" x="595" y="180" fill="#b91c1c" font-size="14" font-weight="700" text-anchor="middle">Match: fine mailed out</text>

    <text class="muted" x="595" y="220" fill="#526173" font-size="13" text-anchor="middle">to the owner of the NULL plate</text>

    <!-- Divider -->
    <path class="edge" d="M36 248H684" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="6 6" />

    <!-- Row 2: the fix -->
    <text class="ok" x="36" y="286" fill="#15803d" font-size="15" font-weight="700">Fix: blank plate saved as a real NULL</text>

    <rect class="card" x="36" y="300" width="180" height="96" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="126" y="328" fill="#20242c" font-size="15" font-weight="700" text-anchor="middle">Parking ticket</text>
    <text class="muted" x="126" y="352" fill="#526173" font-size="14" text-anchor="middle">Car: Honda</text>
    <text class="muted" x="126" y="374" fill="#526173" font-size="14" text-anchor="middle">Plate: (left blank)</text>

    <path class="edge" d="M220 348H262" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <rect class="card" x="266" y="300" width="190" height="96" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="361" y="328" fill="#20242c" font-size="15" font-weight="700" text-anchor="middle">Citation record</text>
    <text class="ok" x="361" y="362" fill="#15803d" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" text-anchor="middle">plate = NULL</text>
    <text class="muted" x="361" y="384" fill="#526173" font-size="13" text-anchor="middle">no value at all</text>

    <path class="edge" d="M460 348H502" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <rect class="card" x="506" y="300" width="178" height="96" rx="10" fill="#ffffff" stroke="#15803d" stroke-width="3" />
    <text class="title" x="595" y="328" fill="#20242c" font-size="15" font-weight="700" text-anchor="middle">Owner lookup</text>
    <text class="ok" x="595" y="356" fill="#15803d" font-size="14" text-anchor="middle">NULL = 'NULL' → unknown</text>
    <text class="ok" x="595" y="380" fill="#15803d" font-size="14" font-weight="700" text-anchor="middle">No match: sent for review</text>

    <text class="muted" x="36" y="436" fill="#526173" font-size="13">Simplified. The processing center's real database schema isn't public.</text>
  </g>
</svg>
