<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ttfb-fill: #e2e8f0;
      --ttfb-edge: #475569;
      --ttfb-text: #1e293b;
      --delay-fill: #ffedd5;
      --delay-edge: #c2410c;
      --delay-text: #9a3412;
      --duration-fill: #dbeafe;
      --duration-edge: #2563eb;
      --duration-text: #172554;
      --render-fill: #dcfce7;
      --render-edge: #16a34a;
      --render-text: #15803d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ttfb-fill: #2b3441;
        --ttfb-edge: #94a3b8;
        --ttfb-text: #e2e8f0;
        --delay-fill: #3a2416;
        --delay-edge: #fb923c;
        --delay-text: #fdba74;
        --duration-fill: #1e3a5f;
        --duration-edge: #60a5fa;
        --duration-text: #dbeafe;
        --render-fill: #14321f;
        --render-edge: #4ade80;
        --render-text: #86efac;
      }
    }

    .panel-bg { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge-line { stroke: var(--edge); }
    .card { fill: var(--card); stroke: var(--edge); }
    .ttfb-box { fill: var(--ttfb-fill); stroke: var(--ttfb-edge); }
    .ttfb-text { fill: var(--ttfb-text); }
    .delay-box { fill: var(--delay-fill); stroke: var(--delay-edge); }
    .delay-text { fill: var(--delay-text); }
    .duration-box { fill: var(--duration-fill); stroke: var(--duration-edge); }
    .duration-text { fill: var(--duration-text); }
    .render-box { fill: var(--render-fill); stroke: var(--render-edge); }
    .render-text { fill: var(--render-text); }
  </style>

  <rect class="panel-bg" width="720" height="480" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    LCP is the sum of four subparts
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    TTFB 600 + resource load delay 350 + resource load duration 700 + element render delay 250 = 1900 ms
  </text>

  <g font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">
    <line class="edge-line" x1="138" y1="100" x2="138" y2="160" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
    <text class="ttfb-text" x="138" y="94" fill="#1e293b" text-anchor="middle">TTFB</text>

    <line class="edge-line" x1="479" y1="100" x2="479" y2="160" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
    <text class="duration-text" x="479" y="94" fill="#172554" text-anchor="middle">resource load duration</text>

    <line class="edge-line" x1="300" y1="126" x2="300" y2="160" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
    <text class="delay-text" x="300" y="120" fill="#9a3412" text-anchor="middle">resource load delay</text>

    <line class="edge-line" x1="641" y1="126" x2="641" y2="160" stroke="#64748b" stroke-width="1.5" stroke-dasharray="3 3" />
    <text class="render-text" x="649" y="120" fill="#15803d" text-anchor="end">element render delay</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">
    <rect class="ttfb-box" x="36" y="160" width="205" height="60" fill="#e2e8f0" stroke="#475569" stroke-width="2" />
    <text class="ttfb-text" x="138" y="196" fill="#1e293b">600 ms</text>

    <rect class="delay-box" x="241" y="160" width="119" height="60" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="delay-text" x="300" y="196" fill="#9a3412">350 ms</text>

    <rect class="duration-box" x="360" y="160" width="239" height="60" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="duration-text" x="479" y="196" fill="#172554">700 ms</text>

    <rect class="render-box" x="599" y="160" width="85" height="60" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="render-text" x="641" y="196" fill="#15803d" font-size="12.5">250 ms</text>
  </g>

  <text class="title" x="684" y="245" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="end">
    = 1900 ms LCP
  </text>

  <rect class="card" x="36" y="260" width="648" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="52" y="284" fill="#526173" font-family="system-ui, sans-serif" font-size="12.5">
    A text LCP painted with a system font has no separate resource — delay and duration are both 0 ms.
  </text>

  <line x1="36" y1="320" x2="684" y2="320" stroke="#64748b" stroke-width="1" stroke-dasharray="2 4" />

  <text class="title" x="36" y="352" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">
    LCP tracks the largest candidate seen so far — until paint settles
  </text>

  <g font-family="system-ui, sans-serif">
    <line class="edge-line" x1="60" y1="410" x2="660" y2="410" stroke="#64748b" stroke-width="2" />
    <g class="edge-line" stroke="#64748b" stroke-width="2">
      <line x1="60" y1="406" x2="60" y2="414" />
      <line x1="330" y1="406" x2="330" y2="414" />
      <line x1="600" y1="406" x2="600" y2="414" />
    </g>
    <g class="muted" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
      <text x="60" y="430">0s</text>
      <text x="330" y="430">0.9s</text>
      <text x="600" y="430">1.8s</text>
    </g>

    <circle cx="330" cy="380" r="7" fill="#94a3b8" />
    <text class="muted" x="330" y="368" fill="#526173" font-size="11.5" text-anchor="middle">heading paints — superseded</text>

    <circle class="render-box" cx="600" cy="380" r="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
    <text class="render-text" x="600" y="368" fill="#15803d" font-size="12" font-weight="700" text-anchor="middle">hero renders — final LCP</text>
  </g>
</svg>
