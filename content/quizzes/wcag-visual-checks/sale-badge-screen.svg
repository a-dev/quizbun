<svg xmlns="http://www.w3.org/2000/svg" width="720" height="346" viewBox="0 0 720 346">
  <!-- House convention exception: everything inside a browser viewport is the
       specimen. Its colors are literal and never re-theme, because contrast is
       the subject. Only the panel, tree, and notes follow prefers-color-scheme. -->
  <style>
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --edge: #64748b;
      --tree: #ffffff; --role: #1d4ed8; --name: #20242c; --prop: #526173;
      --hl-fill: #ffedd5; --hl: #c2410c; --good: #15803d; --bad: #b91c1c; --accent: #9a3412;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --edge: #8b9bb4;
        --tree: #11151b; --role: #93c5fd; --name: #e6eaf2; --prop: #9aa8bd;
        --hl-fill: #3a2416; --hl: #fb923c; --good: #4ade80; --bad: #f87171; --accent: #fdba74;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .tree { fill: var(--tree); stroke: var(--edge); }
    .role { fill: var(--role); }
    .name { fill: var(--name); }
    .prop { fill: var(--prop); }
    .hl { fill: var(--hl-fill); stroke: var(--hl); }
    .hl-line { stroke: var(--hl); }
    .good { fill: var(--good); }
    .bad { fill: var(--bad); }
    .bad-stroke { stroke: var(--bad); }
    .good-stroke { stroke: var(--good); }
    .accent { fill: var(--accent); }
  </style>

  <rect class="panel" width="720" height="346" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Rendered screen</text>
  <text class="muted" x="32" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">A flex-column product tile. The badge has order: -1.</text>
  <rect x="32" y="88" width="656" height="226" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <path d="M 32 114 V 98 a 10 10 0 0 1 10 -10 H 678 a 10 10 0 0 1 10 10 V 114 Z" fill="#e2e8f0" />
  <circle cx="48" cy="101" r="4" fill="#94a3b8" />
  <circle cx="62" cy="101" r="4" fill="#94a3b8" />
  <circle cx="76" cy="101" r="4" fill="#94a3b8" />
  <text x="94" y="106" fill="#475569" font-family="system-ui, sans-serif" font-size="12">shop.example</text>
  <rect x="260" y="128" width="200" height="170" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="276" y="144" width="100" height="26" rx="13" fill="#b91c1c" />
  <text x="326" y="162" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">SALE −30%</text>
  <text x="276" y="198" fill="#111827" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Trail Runner 2</text>
  <text x="276" y="224" fill="#374151" font-family="system-ui, sans-serif" font-size="16">$89</text>
  <rect x="276" y="242" width="168" height="38" rx="6" fill="#1d4ed8" />
  <text x="360" y="266.5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Add to cart</text>
</svg>
