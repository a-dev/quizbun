  <rect x="250" y="358" width="20" height="20" rx="2" fill="#1f2937" />
  <circle class="bad-stroke" cx="260" cy="368" r="24" fill="none" stroke="#b91c1c" stroke-width="2" />
  <text class="bad" x="664" y="373" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">circles overlap ✗</text>
</svg>
