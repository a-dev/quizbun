<svg xmlns="http://www.w3.org/2000/svg" width="720" height="322" viewBox="0 0 720 322">
  <!-- House convention exception: everything inside a browser viewport is the
       specimen. Its colors are literal and never re-theme, because contrast is
       the subject. Only the panel, tree, and notes follow prefers-color-scheme. -->
  <style>
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --edge: #64748b;
      --tree: #ffffff; --role: #1d4ed8; --name: #20242c; --prop: #526173;
      --hl-fill: #ffedd5; --hl: #c2410c; --good: #15803d; --bad: #b91c1c; --accent: #9a3412;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --edge: #8b9bb4;
        --tree: #11151b; --role: #93c5fd; --name: #e6eaf2; --prop: #9aa8bd;
        --hl-fill: #3a2416; --hl: #fb923c; --good: #4ade80; --bad: #f87171; --accent: #fdba74;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .tree { fill: var(--tree); stroke: var(--edge); }
    .role { fill: var(--role); }
    .name { fill: var(--name); }
    .prop { fill: var(--prop); }
    .hl { fill: var(--hl-fill); stroke: var(--hl); }
    .hl-line { stroke: var(--hl); }
    .good { fill: var(--good); }
    .bad { fill: var(--bad); }
    .bad-stroke { stroke: var(--bad); }
    .good-stroke { stroke: var(--good); }
    .accent { fill: var(--accent); }
  </style>

  <rect class="panel" width="720" height="322" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Accessibility tree</text>
  <text class="muted" x="32" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">The same screen as assistive technology sees it (simplified).</text>
  <rect class="tree" x="32" y="84" width="656" height="160" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text x="48" y="115" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14"><tspan class="role" fill="#1d4ed8">dialog</tspan><tspan class="name" fill="#20242c"> "Discard changes?"</tspan></text>
  <text x="68" y="143" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14"><tspan class="role" fill="#1d4ed8">heading</tspan><tspan class="name" fill="#20242c"> "Discard changes?"</tspan><tspan class="prop" fill="#526173"> level=2</tspan></text>
  <text x="68" y="171" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14"><tspan class="role" fill="#1d4ed8">StaticText</tspan><tspan class="name" fill="#20242c"> "Your edits will be lost."</tspan></text>
  <rect class="hl" x="38" y="182" width="644" height="24" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text x="68" y="199" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14"><tspan class="role" fill="#1d4ed8">button</tspan><tspan class="name" fill="#20242c"> "Discard"</tspan></text>
  <text class="bad" x="674" y="199" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="end">Tab stop 1 · drawn on the right</text>
  <text x="68" y="227" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14"><tspan class="role" fill="#1d4ed8">button</tspan><tspan class="name" fill="#20242c"> "Cancel"</tspan></text>
  <text class="muted" x="674" y="227" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">Tab stop 2 · drawn on the left</text>
  <text class="accent" x="32" y="274" fill="#9a3412" font-family="system-ui, sans-serif" font-size="14">Tree order is DOM order. row-reverse only changes where the boxes are drawn.</text>
  <text class="accent" x="32" y="296" fill="#9a3412" font-family="system-ui, sans-serif" font-size="14">Tab and screen readers still go Discard, then Cancel.</text>
</svg>
