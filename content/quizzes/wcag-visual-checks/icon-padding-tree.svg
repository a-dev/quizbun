<svg xmlns="http://www.w3.org/2000/svg" width="720" height="308" viewBox="0 0 720 308">
  <!-- House convention exception: everything inside a browser viewport is the
       specimen. Its colors are literal and never re-theme, because contrast is
       the subject. Only the panel, tree, and notes follow prefers-color-scheme. -->
  <style>
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --edge: #64748b;
      --tree: #ffffff; --role: #1d4ed8; --name: #20242c; --prop: #526173;
      --hl-fill: #ffedd5; --hl: #c2410c; --good: #15803d; --bad: #b91c1c; --accent: #9a3412;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --edge: #8b9bb4;
        --tree: #11151b; --role: #93c5fd; --name: #e6eaf2; --prop: #9aa8bd;
        --hl-fill: #3a2416; --hl: #fb923c; --good: #4ade80; --bad: #f87171; --accent: #fdba74;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .tree { fill: var(--tree); stroke: var(--edge); }
    .role { fill: var(--role); }
    .name { fill: var(--name); }
    .prop { fill: var(--prop); }
    .hl { fill: var(--hl-fill); stroke: var(--hl); }
    .hl-line { stroke: var(--hl); }
    .good { fill: var(--good); }
    .bad { fill: var(--bad); }
    .bad-stroke { stroke: var(--bad); }
    .good-stroke { stroke: var(--good); }
    .accent { fill: var(--accent); }
  </style>

  <rect class="panel" width="720" height="308" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Accessibility tree</text>
  <text class="muted" x="32" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Tree on the left. The button's box, at 2× scale, on the right.</text>
  <rect class="tree" x="32" y="84" width="380" height="104" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text x="48" y="115" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14"><tspan class="role" fill="#1d4ed8">banner</tspan></text>
  <text x="68" y="143" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14"><tspan class="role" fill="#1d4ed8">StaticText</tspan><tspan class="name" fill="#20242c"> "Acme"</tspan></text>
  <rect class="hl" x="38" y="154" width="368" height="24" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text x="68" y="171" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14"><tspan class="role" fill="#1d4ed8">button</tspan><tspan class="name" fill="#20242c"> "Notifications"</tspan></text>
  <rect x="510" y="94" width="88" height="88" rx="4" fill="#eff6ff" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 4" />
  <path d="M 540 146 Q 540 122 554 122 Q 568 122 568 146 L 572 150 L 536 150 Z" fill="#1f2937" />
  <circle cx="554" cy="155" r="4" fill="#1f2937" />
  <rect class="hl-line" x="534" y="118" width="40" height="40" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="3 3" />
  <text class="title" x="554" y="206" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">44 px = 12 + 20 + 12</text>
  <text class="accent" x="32" y="218" fill="#9a3412" font-family="system-ui, sans-serif" font-size="14">The &lt;svg&gt; has aria-hidden=&quot;true&quot;, so only the button is in the tree.</text>
  <text class="accent" x="32" y="240" fill="#9a3412" font-family="system-ui, sans-serif" font-size="14">The pointer target is the button's whole box, padding included:</text>
  <text class="accent" x="32" y="262" fill="#9a3412" font-family="system-ui, sans-serif" font-size="14">44 × 44 CSS px, even though the visible icon is 20 × 20.</text>
</svg>
