  <text x="260" y="166.5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <rect x="62" y="206" width="80" height="48" rx="4" fill="#fbcfe8" />
