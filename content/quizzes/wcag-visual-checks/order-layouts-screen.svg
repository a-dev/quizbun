  <circle cx="48" cy="121" r="4" fill="#94a3b8" />
  <circle cx="62" cy="121" r="4" fill="#94a3b8" />
  <circle cx="76" cy="121" r="4" fill="#94a3b8" />
  <text x="94" y="126" fill="#475569" font-family="system-ui, sans-serif" font-size="12">unrelated photos, dense packing</text>
