<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270">
  <!-- House convention exception: everything inside a browser viewport is the
       specimen. Its colors are literal and never re-theme, because contrast is
       the subject. Only the panel, tree, and notes follow prefers-color-scheme. -->
  <style>
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --edge: #64748b;
      --tree: #ffffff; --role: #1d4ed8; --name: #20242c; --prop: #526173;
      --hl-fill: #ffedd5; --hl: #c2410c; --good: #15803d; --bad: #b91c1c; --accent: #9a3412;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --edge: #8b9bb4;
        --tree: #11151b; --role: #93c5fd; --name: #e6eaf2; --prop: #9aa8bd;
        --hl-fill: #3a2416; --hl: #fb923c; --good: #4ade80; --bad: #f87171; --accent: #fdba74;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .tree { fill: var(--tree); stroke: var(--edge); }
    .role { fill: var(--role); }
    .name { fill: var(--name); }
    .prop { fill: var(--prop); }
    .hl { fill: var(--hl-fill); stroke: var(--hl); }
    .hl-line { stroke: var(--hl); }
    .good { fill: var(--good); }
    .bad { fill: var(--bad); }
    .bad-stroke { stroke: var(--bad); }
    .good-stroke { stroke: var(--good); }
    .accent { fill: var(--accent); }
  </style>

  <rect class="panel" width="720" height="270" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Rendered screen</text>
  <text class="muted" x="32" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">CSS on :focus-visible: outline: none; box-shadow: 0 0 0 3px #2563eb;</text>
  <text class="title" x="32" y="96" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Default colors</text>
  <rect x="32" y="108" width="316" height="130" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
  <path d="M 32 134 V 118 a 10 10 0 0 1 10 -10 H 338 a 10 10 0 0 1 10 10 V 134 Z" fill="#e2e8f0" />
  <circle cx="48" cy="121" r="4" fill="#94a3b8" />
  <circle cx="62" cy="121" r="4" fill="#94a3b8" />
  <circle cx="76" cy="121" r="4" fill="#94a3b8" />
  <text x="94" y="126" fill="#475569" font-family="system-ui, sans-serif" font-size="12">app.example</text>
  <rect x="135" y="165" width="110" height="50" rx="10" fill="#2563eb" />
  <rect x="140" y="170" width="100" height="40" rx="6" fill="#1d4ed8" />
  <text x="190" y="195.5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Save</text>
  <text class="title" x="372" y="96" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Windows contrast theme</text>
  <rect x="372" y="108" width="316" height="130" rx="10" fill="#000000" stroke="#94a3b8" stroke-width="1.5" />
  <path d="M 372 134 V 118 a 10 10 0 0 1 10 -10 H 678 a 10 10 0 0 1 10 10 V 134 Z" fill="#1f2937" />
  <circle cx="388" cy="121" r="4" fill="#94a3b8" />
  <circle cx="402" cy="121" r="4" fill="#94a3b8" />
  <circle cx="416" cy="121" r="4" fill="#94a3b8" />
  <text x="434" y="126" fill="#475569" font-family="system-ui, sans-serif" font-size="12">app.example</text>
  <rect x="480" y="170" width="100" height="40" rx="6" fill="#000000" stroke="#ffffff" stroke-width="1.5" />
  <text x="530" y="195.5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Save</text>
</svg>
