<svg xmlns="http://www.w3.org/2000/svg" width="720" height="256" viewBox="0 0 720 256">
  <!-- House convention exception: everything inside a browser viewport is the
       specimen. Its colors are literal and never re-theme, because contrast is
       the subject. Only the panel, tree, and notes follow prefers-color-scheme. -->
  <style>
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --edge: #64748b;
      --tree: #ffffff; --role: #1d4ed8; --name: #20242c; --prop: #526173;
      --hl-fill: #ffedd5; --hl: #c2410c; --good: #15803d; --bad: #b91c1c; --accent: #9a3412;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --edge: #8b9bb4;
        --tree: #11151b; --role: #93c5fd; --name: #e6eaf2; --prop: #9aa8bd;
        --hl-fill: #3a2416; --hl: #fb923c; --good: #4ade80; --bad: #f87171; --accent: #fdba74;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .tree { fill: var(--tree); stroke: var(--edge); }
    .role { fill: var(--role); }
    .name { fill: var(--name); }
    .prop { fill: var(--prop); }
    .hl { fill: var(--hl-fill); stroke: var(--hl); }
    .hl-line { stroke: var(--hl); }
    .good { fill: var(--good); }
    .bad { fill: var(--bad); }
    .bad-stroke { stroke: var(--bad); }
    .good-stroke { stroke: var(--good); }
    .accent { fill: var(--accent); }
  </style>

  <rect class="panel" width="720" height="256" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Accessibility tree</text>
  <text class="muted" x="32" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">The same screen as assistive technology sees it (simplified).</text>
  <text class="title" x="32" y="96" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Default colors</text>
  <rect class="tree" x="32" y="108" width="316" height="48" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <rect class="hl" x="38" y="122" width="304" height="24" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text x="48" y="139" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14"><tspan class="role" fill="#1d4ed8">button</tspan><tspan class="name" fill="#20242c"> "Save"</tspan><tspan class="prop" fill="#526173"> focused</tspan></text>
  <text class="title" x="372" y="96" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Windows contrast theme</text>
  <rect class="tree" x="372" y="108" width="316" height="48" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <rect class="hl" x="378" y="122" width="304" height="24" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text x="388" y="139" font-family="ui-monospace, 'SF Mono', Consolas, monospace" font-size="14"><tspan class="role" fill="#1d4ed8">button</tspan><tspan class="name" fill="#20242c"> "Save"</tspan><tspan class="prop" fill="#526173"> focused</tspan></text>
  <text class="accent" x="32" y="188" fill="#9a3412" font-family="system-ui, sans-serif" font-size="14">Both trees are the same. In forced colors mode, box-shadow becomes none, and</text>
  <text class="accent" x="32" y="210" fill="#9a3412" font-family="system-ui, sans-serif" font-size="14">outline-color gets a system color, so even a transparent outline shows up.</text>
</svg>
