<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --slab: #d5dce6;
      --slab-line: #94a3b8;
      --sealant: #c2410c;
      --hot-text: #9a3412;
      --cold-text: #1d4ed8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --slab: #3a4557;
        --slab-line: #64748b;
        --sealant: #fb923c;
        --hot-text: #fdba74;
        --cold-text: #60a5fa;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); font-family: system-ui, sans-serif; font-weight: 700; }
    .muted { fill: var(--muted); font-family: system-ui, sans-serif; }
    .slab { fill: var(--slab); stroke: var(--slab-line); stroke-width: 1.5; }
    .sealant { fill: var(--sealant); }
    .hot-text { fill: var(--hot-text); font-family: system-ui, sans-serif; font-weight: 700; }
    .cold-text { fill: var(--cold-text); font-family: system-ui, sans-serif; font-weight: 700; }
  </style>

  <rect class="panel" width="720" height="400" rx="20" />
  <text class="title" x="36" y="40" font-size="19">The same joint, narrow in summer and wide in winter</text>

  <g font-family="system-ui, sans-serif">
    <!-- SUMMER: panels expanded, narrow gap -->
    <text class="hot-text" x="190" y="80" font-size="15" text-anchor="middle">Summer — material expanded</text>
    <rect class="slab" x="70" y="100" width="150" height="120" />
    <rect class="sealant" x="220" y="100" width="14" height="120" />
    <rect class="slab" x="234" y="100" width="150" height="120" />
    <text class="muted" x="227" y="240" font-size="12" text-anchor="middle">narrow gap</text>
    <text class="muted" x="227" y="255" font-size="12" text-anchor="middle">soft sealant compresses</text>

    <!-- WINTER: panels contracted, wide gap -->
    <text class="cold-text" x="530" y="80" font-size="15" text-anchor="middle">Winter — material contracted</text>
    <rect class="slab" x="420" y="100" width="140" height="120" />
    <rect class="sealant" x="560" y="100" width="30" height="120" />
    <rect class="slab" x="590" y="100" width="140" height="120" />
    <text class="muted" x="575" y="240" font-size="12" text-anchor="middle">wide gap</text>
    <text class="muted" x="575" y="255" font-size="12" text-anchor="middle">soft sealant stretches</text>

    <text class="muted" x="360" y="310" font-size="13" text-anchor="middle">The gap width changes every season; only a flexible filler can follow it</text>
    <text class="muted" x="360" y="330" font-size="12" text-anchor="middle">without cracking or squeezing itself out — the same reason mortar cannot fill this joint</text>
  </g>
</svg>
