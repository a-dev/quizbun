<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ctx-fill: #dbeafe;
      --ctx-edge: #2563eb;
      --ctx-label: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --ok-edge: #16a34a;
      --ok-text: #15803d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ctx-fill: #1e3a5f;
        --ctx-edge: #60a5fa;
        --ctx-label: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --ok-edge: #4ade80;
        --ok-text: #86efac;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .frame { fill: none; stroke: var(--edge); }
    .card { fill: var(--card); stroke: var(--edge); }
    .ctx { fill: var(--ctx-fill); stroke: var(--ctx-edge); }
    .ctx-label { fill: var(--ctx-label); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
    .ok-edge { stroke: var(--ok-edge); }
    .ok-text { fill: var(--ok-text); }
  </style>

  <rect class="panel" width="720" height="420" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="44" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    A blend mode mixes with its backdrop
  </text>
  <text class="muted" x="36" y="68" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Blue layers are in the caption's backdrop. Paint order runs bottom to top.
  </text>

  <g font-family="system-ui, sans-serif">
    <rect class="frame" x="36" y="88" width="312" height="308" rx="16" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" />

    <text class="title" x="64" y="116" fill="#20242c" font-size="16" font-weight="700">Default</text>
    <text class="muted" x="64" y="140" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">figure { }</text>
    <text class="muted" x="64" y="166" fill="#526173" font-size="12">no boundary — the backdrop runs to the page</text>

    <rect class="accent-box" x="64" y="180" width="256" height="42" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="80" y="200" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">figcaption</text>
    <text class="accent-text" x="80" y="216" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">mix-blend-mode: multiply</text>

    <rect class="ctx" x="64" y="232" width="256" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="ctx-label" x="80" y="259" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">img</text>
    <text class="ctx-label" x="304" y="259" fill="#172554" font-size="11" font-weight="700" text-anchor="end">in backdrop</text>

    <rect class="ctx" x="64" y="284" width="256" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="ctx-label" x="80" y="311" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">page</text>
    <text class="ctx-label" x="304" y="311" fill="#172554" font-size="11" font-weight="700" text-anchor="end">in backdrop</text>

    <text class="accent-text" x="64" y="356" fill="#9a3412" font-size="12" font-weight="700">The backdrop reaches past the photo to</text>
    <text class="accent-text" x="64" y="378" fill="#9a3412" font-size="12" font-weight="700">the page, so the overhang blends there.</text>

    <rect class="frame" x="372" y="88" width="312" height="308" rx="16" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" />

    <text class="title" x="400" y="116" fill="#20242c" font-size="16" font-weight="700">Isolated</text>
    <text class="muted" x="400" y="140" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">figure { isolation: isolate }</text>
    <text class="ok-text" x="400" y="166" fill="#15803d" font-size="12" font-weight="700">isolated group — the backdrop stops here</text>

    <rect class="ok-edge" x="390" y="172" width="276" height="110" rx="12" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="6 5" />

    <rect class="accent-box" x="400" y="180" width="256" height="42" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="416" y="200" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">figcaption</text>
    <text class="accent-text" x="416" y="216" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">mix-blend-mode: multiply</text>

    <rect class="ctx" x="400" y="232" width="256" height="42" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="ctx-label" x="416" y="259" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">img</text>
    <text class="ctx-label" x="640" y="259" fill="#172554" font-size="11" font-weight="700" text-anchor="end">in backdrop</text>

    <rect class="card" x="400" y="284" width="256" height="42" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="416" y="311" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">page</text>
    <text class="muted" x="640" y="311" fill="#526173" font-size="11" font-weight="700" text-anchor="end">outside the group</text>

    <text class="ok-text" x="400" y="356" fill="#15803d" font-size="12" font-weight="700">The backdrop resets at the figure, so the</text>
    <text class="ok-text" x="400" y="378" fill="#15803d" font-size="12" font-weight="700">caption blends only with the photo.</text>
  </g>
</svg>
