<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --parent-fill: #1e3a8a;
      --parent-edge: #1e40af;
      --on-parent: #ffffff;
      --child-fill: #facc15;
      --child-edge: #ca8a04;
      --on-child: #422006;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --parent-fill: #2f4bab;
        --parent-edge: #6d8ae0;
        --on-parent: #ffffff;
        --child-fill: #eab308;
        --child-edge: #fde047;
        --on-child: #422006;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .card { fill: var(--card); stroke: var(--edge); }
    .parent-box { fill: var(--parent-fill); stroke: var(--parent-edge); }
    .on-parent { fill: var(--on-parent); }
    .child-box { fill: var(--child-fill); stroke: var(--child-edge); }
    .on-child { fill: var(--on-child); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <rect class="panel" width="720" height="420" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="44" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Where z-index: -1 lands depends on who owns the context
  </text>
  <text class="muted" x="36" y="68" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Each stack is painted bottom to top, so the upper bar wins.
  </text>

  <g font-family="system-ui, sans-serif" text-anchor="start">
    <rect class="edge" x="36" y="86" width="316" height="252" rx="14" fill="none" stroke="#64748b" stroke-width="2" />
    <text class="title" x="60" y="116" fill="#20242c" font-size="15" font-weight="700">.parent forms no context</text>
    <text class="muted" x="60" y="138" fill="#526173" font-size="13">resolved in the root context</text>

    <rect class="parent-box" x="60" y="156" width="268" height="44" rx="8" fill="#1e3a8a" stroke="#1e40af" stroke-width="2" />
    <text class="on-parent" x="76" y="183" fill="#ffffff" font-size="14" font-weight="700">.parent background</text>
    <text class="on-parent" x="312" y="183" fill="#ffffff" font-size="12" text-anchor="end">step 3</text>

    <rect class="child-box" x="60" y="206" width="268" height="44" rx="8" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <text class="on-child" x="76" y="233" fill="#422006" font-size="14" font-weight="700">child z-index: -1</text>
    <text class="on-child" x="312" y="233" fill="#422006" font-size="12" text-anchor="end">step 2</text>

    <text class="muted" x="60" y="298" fill="#526173" font-size="13" font-weight="600">You see:</text>
    <rect class="parent-box" x="150" y="268" width="80" height="54" rx="8" fill="#1e3a8a" stroke="#1e40af" stroke-width="2" />
    <text class="muted" x="244" y="298" fill="#526173" font-size="12">child hidden</text>

    <rect class="edge" x="368" y="86" width="316" height="252" rx="14" fill="none" stroke="#64748b" stroke-width="2" />
    <text class="title" x="392" y="116" fill="#20242c" font-size="15" font-weight="700">.parent { isolation: isolate }</text>
    <text class="muted" x="392" y="138" fill="#526173" font-size="13">resolved inside .parent</text>

    <rect class="child-box" x="392" y="156" width="268" height="44" rx="8" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <text class="on-child" x="408" y="183" fill="#422006" font-size="14" font-weight="700">child z-index: -1</text>
    <text class="on-child" x="644" y="183" fill="#422006" font-size="12" text-anchor="end">step 2</text>

    <rect class="parent-box" x="392" y="206" width="268" height="44" rx="8" fill="#1e3a8a" stroke="#1e40af" stroke-width="2" />
    <text class="on-parent" x="408" y="233" fill="#ffffff" font-size="14" font-weight="700">.parent background</text>
    <text class="on-parent" x="644" y="233" fill="#ffffff" font-size="12" text-anchor="end">step 1</text>

    <text class="muted" x="392" y="298" fill="#526173" font-size="13" font-weight="600">You see:</text>
    <rect class="parent-box" x="482" y="268" width="80" height="54" rx="8" fill="#1e3a8a" stroke="#1e40af" stroke-width="2" />
    <rect class="child-box" x="498" y="280" width="48" height="30" rx="5" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
    <text class="muted" x="576" y="298" fill="#526173" font-size="12">child visible</text>

    <text class="accent-text" x="36" y="370" fill="#9a3412" font-size="14" font-weight="700">A negative-z child only hides behind a parent that forms no stacking context.</text>
    <text class="muted" x="36" y="396" fill="#526173" font-size="14">Fix: .parent { isolation: isolate } — or position: relative; z-index: 0.</text>
  </g>
</svg>
