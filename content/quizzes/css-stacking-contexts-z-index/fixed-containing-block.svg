<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --chrome: #e2e8f0;
      --modal-fill: #fdba74;
      --modal-edge: #c2410c;
      --on-modal: #431407;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --chrome: #333b48;
        --modal-fill: #b45309;
        --modal-edge: #fb923c;
        --on-modal: #ffedd5;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .card { fill: var(--card); stroke: var(--edge); }
    .chrome { fill: var(--chrome); }
    .dot { fill: var(--edge); }
    .modal { fill: var(--modal-fill); stroke: var(--modal-edge); }
    .on-modal { fill: var(--on-modal); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <rect class="panel" width="720" height="420" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="44" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    A transformed ancestor becomes the containing block
  </text>
  <text class="muted" x="36" y="68" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    position: fixed with inset: 0 fills whichever box anchors it.
  </text>

  <g font-family="system-ui, sans-serif" text-anchor="start">
    <rect class="edge" x="36" y="86" width="316" height="258" rx="14" fill="none" stroke="#64748b" stroke-width="2" />
    <text class="title" x="60" y="116" fill="#20242c" font-size="15" font-weight="700">No transform on .card</text>
    <text class="muted" x="60" y="136" fill="#526173" font-size="13">the modal is anchored to the viewport</text>

    <rect class="card" x="60" y="152" width="268" height="160" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <rect class="chrome" x="60" y="152" width="268" height="26" rx="10" fill="#e2e8f0" />
    <rect class="chrome" x="60" y="168" width="268" height="10" fill="#e2e8f0" />
    <path class="edge" d="M60 178H328" fill="none" stroke="#64748b" stroke-width="1.5" />
    <circle class="dot" cx="76" cy="165" r="4" fill="#64748b" />
    <circle class="dot" cx="90" cy="165" r="4" fill="#64748b" />
    <circle class="dot" cx="104" cy="165" r="4" fill="#64748b" />

    <rect class="card" x="98" y="200" width="150" height="94" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" />
    <rect class="modal" x="66" y="184" width="256" height="122" rx="8" fill="#fdba74" stroke="#c2410c" stroke-width="2" fill-opacity="0.9" />
    <text class="on-modal" x="194" y="240" fill="#431407" font-size="15" font-weight="700" text-anchor="middle">.modal</text>
    <text class="on-modal" x="194" y="262" fill="#431407" font-size="13" text-anchor="middle">covers the whole viewport</text>

    <text class="muted" x="60" y="332" fill="#526173" font-size="13" font-weight="600">inset: 0 measured from the viewport</text>

    <rect class="edge" x="368" y="86" width="316" height="258" rx="14" fill="none" stroke="#64748b" stroke-width="2" />
    <text class="title" x="392" y="116" fill="#20242c" font-size="15" font-weight="700">.card { transform: translateY(0) }</text>
    <text class="muted" x="392" y="136" fill="#526173" font-size="13">the modal is re-anchored to .card</text>

    <rect class="card" x="392" y="152" width="268" height="160" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <rect class="chrome" x="392" y="152" width="268" height="26" rx="10" fill="#e2e8f0" />
    <rect class="chrome" x="392" y="168" width="268" height="10" fill="#e2e8f0" />
    <path class="edge" d="M392 178H660" fill="none" stroke="#64748b" stroke-width="1.5" />
    <circle class="dot" cx="408" cy="165" r="4" fill="#64748b" />
    <circle class="dot" cx="422" cy="165" r="4" fill="#64748b" />
    <circle class="dot" cx="436" cy="165" r="4" fill="#64748b" />

    <text class="muted" x="424" y="200" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">.card</text>
    <rect class="card" x="424" y="206" width="162" height="94" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" />
    <rect class="modal" x="430" y="212" width="150" height="82" rx="8" fill="#fdba74" stroke="#c2410c" stroke-width="2" fill-opacity="0.9" />
    <text class="on-modal" x="505" y="248" fill="#431407" font-size="15" font-weight="700" text-anchor="middle">.modal</text>
    <text class="on-modal" x="505" y="270" fill="#431407" font-size="13" text-anchor="middle">covers the card only</text>

    <text class="muted" x="392" y="332" fill="#526173" font-size="13" font-weight="600">inset: 0 measured from the card</text>

    <text class="accent-text" x="36" y="376" fill="#9a3412" font-size="14" font-weight="700">Also re-anchors: perspective, filter, backdrop-filter, will-change: transform, contain.</text>
    <text class="muted" x="36" y="400" fill="#526173" font-size="14">Fix: portal the modal out of the transformed subtree, or animate with opacity instead.</text>
  </g>
</svg>
