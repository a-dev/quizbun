<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --c: #64748b;
      --key: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --c: #8b9bb4;
        --key: #242b36;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .rail-fill { fill: var(--rail); }
    .a { fill: var(--a); }
    .a-line { stroke: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .c { fill: var(--c); }
    .key { fill: var(--key); stroke: var(--rail); }
  </style>

  <rect class="panel" width="720" height="440" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Which editor does git commit open?</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Git uses the first one that is set, in this order</text>
  <rect class="key" x="36" y="96" width="648" height="44" rx="10" fill="#ffffff" stroke="#94a3b8" />
  <text class="muted" x="58" y="124" fill="#526173" font-family="system-ui, sans-serif" font-size="14" font-weight="700">1</text>
  <text class="title" x="90" y="124" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">GIT_EDITOR</text>
  <text class="muted" x="300" y="124" fill="#526173" font-family="system-ui, sans-serif" font-size="14">environment variable</text>
  <text class="muted" x="664" y="124" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">not set? ↓</text>
  <rect class="key" x="36" y="150" width="648" height="44" rx="10" fill="#ffffff" stroke="#94a3b8" />
  <text class="muted" x="58" y="178" fill="#526173" font-family="system-ui, sans-serif" font-size="14" font-weight="700">2</text>
  <text class="title" x="90" y="178" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">core.editor</text>
  <text class="muted" x="300" y="178" fill="#526173" font-family="system-ui, sans-serif" font-size="14">git config setting</text>
  <text class="muted" x="664" y="178" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">not set? ↓</text>
  <rect class="key" x="36" y="204" width="648" height="44" rx="10" fill="#ffffff" stroke="#94a3b8" />
  <text class="muted" x="58" y="232" fill="#526173" font-family="system-ui, sans-serif" font-size="14" font-weight="700">3</text>
  <text class="title" x="90" y="232" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">VISUAL</text>
  <text class="muted" x="300" y="232" fill="#526173" font-family="system-ui, sans-serif" font-size="14">environment variable</text>
  <text class="muted" x="664" y="232" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">not set? ↓</text>
  <rect class="key" x="36" y="258" width="648" height="44" rx="10" fill="#ffffff" stroke="#94a3b8" />
  <text class="muted" x="58" y="286" fill="#526173" font-family="system-ui, sans-serif" font-size="14" font-weight="700">4</text>
  <text class="title" x="90" y="286" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">EDITOR</text>
  <text class="muted" x="300" y="286" fill="#526173" font-family="system-ui, sans-serif" font-size="14">environment variable</text>
  <text class="muted" x="664" y="286" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">not set? ↓</text>
  <rect class="b-soft" x="36" y="312" width="648" height="48" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="b" x="58" y="342" fill="#c2410c" font-family="system-ui, sans-serif" font-size="14" font-weight="700">5</text>
  <text class="b" x="90" y="342" fill="#c2410c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700">vi</text>
  <text class="title" x="300" y="342" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">the default chosen when Git was compiled, usually vi</text>
  <text class="muted" x="36" y="392" fill="#526173" font-family="system-ui, sans-serif" font-size="13">On many systems vi is Vim. Nothing set in steps 1–4 means you land in it,</text>
  <text class="muted" x="36" y="410" fill="#526173" font-family="system-ui, sans-serif" font-size="13">often from git commit without -m, git merge, or git rebase -i.</text>
</svg>
