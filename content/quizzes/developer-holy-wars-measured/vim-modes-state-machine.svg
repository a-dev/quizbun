<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --c: #64748b;
      --key: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --c: #8b9bb4;
        --key: #242b36;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .rail-fill { fill: var(--rail); }
    .a { fill: var(--a); }
    .a-line { stroke: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .c { fill: var(--c); }
    .key { fill: var(--key); stroke: var(--rail); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="rail-fill" d="M0 0 L10 5 L0 10 z" fill="#94a3b8" />
    </marker>
  </defs>

  <rect class="panel" width="720" height="470" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Vim's modes: the keys that get you out</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Lost? Press Esc to get back to Normal mode. Pressing it twice does no harm.</text>
  <rect class="a-soft" x="40" y="170" width="190" height="76" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="title" x="135.0" y="202" fill="#20242c" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Insert</text>
  <text class="muted" x="135.0" y="224" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">keys type text</text>
  <rect class="a-soft" x="290" y="170" width="170" height="76" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="title" x="375.0" y="202" fill="#20242c" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Normal</text>
  <text class="muted" x="375.0" y="224" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">keys are commands</text>
  <rect class="a-soft" x="520" y="170" width="170" height="76" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="title" x="605.0" y="202" fill="#20242c" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Command-line</text>
  <text class="muted" x="605.0" y="224" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">type a : command</text>
  <rect class="b-soft" x="290" y="350" width="170" height="76" rx="14" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="title" x="375.0" y="382" fill="#20242c" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Vim closes</text>
  <text class="muted" x="375.0" y="404" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">back to the shell</text>
  <path class="rail" d="M290 190 L232 190" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text class="title" x="261" y="160" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="middle">i  a  o</text>
  <path class="rail" d="M232 228 L288 228" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text class="title" x="261" y="268" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="middle">Esc</text>
  <path class="rail" d="M460 190 L518 190" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text class="title" x="489" y="160" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" text-anchor="middle">:</text>
  <path class="rail" d="M520 228 L462 228" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text class="title" x="489" y="268" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="middle">Esc</text>
  <text class="muted" x="489" y="286" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">(cancels)</text>
  <path class="rail" d="M375 246 L375 348" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text class="title" x="365" y="300" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="end">ZZ  save</text>
  <text class="title" x="365" y="320" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="end">ZQ  discard</text>
  <path class="rail" d="M605 246 L605 388 L462 388" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text class="title" x="595" y="322" text-anchor="end" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">:wq ↵  save</text>
  <text class="title" x="595" y="342" text-anchor="end" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700">:q! ↵  discard</text>
  <text class="muted" x="36" y="112" fill="#526173" font-family="system-ui, sans-serif" font-size="13">Vim starts in Normal mode, where letters run commands. Typing "quit"</text>
  <text class="muted" x="36" y="130" fill="#526173" font-family="system-ui, sans-serif" font-size="13">there runs editing commands instead of quitting.</text>
  <text class="muted" x="36" y="452" fill="#526173" font-family="system-ui, sans-serif" font-size="12">Plain :q ↵ won't quit with unsaved changes. Vim shows "No write since last change (add ! to override)".</text>
</svg>
