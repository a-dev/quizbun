<svg xmlns="http://www.w3.org/2000/svg" width="720" height="350" viewBox="0 0 720 350">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --c: #64748b;
      --key: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --c: #8b9bb4;
        --key: #242b36;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .rail-fill { fill: var(--rail); }
    .a { fill: var(--a); }
    .a-line { stroke: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .c { fill: var(--c); }
    .key { fill: var(--key); stroke: var(--rail); }
  </style>

  <rect class="panel" width="720" height="350" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Stack Overflow 2017 survey: tabs or spaces?</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Professional developers who answered the indentation question (28,657)</text>
  <text class="muted" x="56" y="125" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Spaces</text>
  <rect class="a" x="150" y="110" width="376.2" height="22" rx="4" fill="#2563eb" />
  <text class="title" x="534.2" y="126" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">41.8%</text>
  <text class="muted" x="56" y="163" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Tabs</text>
  <rect class="b" x="150" y="148" width="366.3" height="22" rx="4" fill="#c2410c" />
  <text class="title" x="524.3" y="164" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">40.7%</text>
  <text class="muted" x="56" y="201" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Both</text>
  <rect class="c" x="150" y="186" width="157.5" height="22" rx="4" fill="#64748b" />
  <text class="title" x="315.5" y="202" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="600">17.5%</text>
  <text class="title" x="36" y="250" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700">The same split as one bar</text>
  <rect class="a" x="36" y="260" width="270.9" height="26" fill="#2563eb" />
  <rect class="b" x="306.9" y="260" width="263.7" height="26" fill="#c2410c" />
  <rect class="c" x="570.6" y="260" width="113.4" height="26" fill="#64748b" />
  <text class="muted" x="36" y="310" fill="#526173" font-family="system-ui, sans-serif" font-size="13">Tabs and spaces are nearly tied; about one developer in six uses both.</text>
</svg>
