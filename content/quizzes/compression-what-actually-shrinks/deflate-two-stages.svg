<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --stage1: #dbeafe;
      --stage1-edge: #2563eb;
      --stage2: #f0eafc;
      --stage2-edge: #9333ea;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --stage1: #1e3a5f;
        --stage1-edge: #60a5fa;
        --stage2: #2a2140;
        --stage2-edge: #c084fc;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .card { fill: var(--card); stroke: var(--edge); }
    .stage1 { fill: var(--stage1); stroke: var(--stage1-edge); }
    .stage2 { fill: var(--stage2); stroke: var(--stage2-edge); }
  </style>

  <rect class="panel" width="720" height="300" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="38" fill="#20242c" font-family="system-ui, sans-serif" font-size="19" font-weight="700">
    DEFLATE = LZ77 then Huffman coding
  </text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect class="card" x="30" y="100" width="150" height="90" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="105" y="135" fill="#20242c" font-size="15" font-weight="700">Raw data</text>
    <text class="muted" x="105" y="158" fill="#526173" font-size="12">repeated substrings +</text>
    <text class="muted" x="105" y="174" fill="#526173" font-size="12">skewed byte frequencies</text>

    <path class="edge" d="M180 145H228" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path class="edge" d="m218 133 14 12-14 12" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <rect class="stage1" x="236" y="90" width="180" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="title" x="326" y="118" fill="#20242c" font-size="15" font-weight="700">Stage 1: LZ77</text>
    <text class="muted" x="326" y="142" fill="#526173" font-size="12">catches repeated</text>
    <text class="muted" x="326" y="158" fill="#526173" font-size="12">substrings via</text>
    <text class="muted" x="326" y="174" fill="#526173" font-size="12">back-references</text>

    <path class="edge" d="M416 145H464" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path class="edge" d="m454 133 14 12-14 12" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <rect class="stage2" x="472" y="90" width="180" height="110" rx="12" fill="#f0eafc" stroke="#9333ea" stroke-width="2" />
    <text class="title" x="562" y="118" fill="#20242c" font-size="15" font-weight="700">Stage 2: Huffman</text>
    <text class="muted" x="562" y="142" fill="#526173" font-size="12">catches skewed</text>
    <text class="muted" x="562" y="158" fill="#526173" font-size="12">frequencies among</text>
    <text class="muted" x="562" y="174" fill="#526173" font-size="12">literals + references</text>

    <text class="muted" x="360" y="250" fill="#526173" font-size="13">Output: literals + (distance, length) tokens from stage 1, entropy-coded by stage 2</text>
  </g>
</svg>
