<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --bar: #93c5fd;
      --bar-edge: #2563eb;
      --bar-label: #172554;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --bar: #2d5d96;
        --bar-edge: #60a5fa;
        --bar-label: #dbeafe;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .axis { stroke: var(--edge); }
    .bar { fill: var(--bar); stroke: var(--bar-edge); }
    .bar-label { fill: var(--bar-label); }
  </style>

  <rect class="panel" width="720" height="360" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="44" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Symbol frequencies out of 100
  </text>

  <g font-family="system-ui, sans-serif">
    <line class="axis" x1="140" y1="70" x2="140" y2="330" stroke="#64748b" stroke-width="2" />

    <text class="muted" x="110" y="88" fill="#526173" font-size="16" text-anchor="end">a</text>
    <rect class="bar" x="146" y="70" width="405" height="30" rx="6" fill="#93c5fd" stroke="#2563eb" stroke-width="2" />
    <text class="bar-label" x="561" y="92" fill="#172554" font-size="16" font-weight="700">45</text>

    <line class="axis" x1="140" y1="70" x2="140" y2="70" stroke="#64748b" stroke-width="2" />

    <text class="muted" x="110" y="132" fill="#526173" font-size="16" text-anchor="end">d</text>
    <rect class="bar" x="146" y="114" width="144" height="30" rx="6" fill="#93c5fd" stroke="#2563eb" stroke-width="2" />
    <text class="bar-label" x="300" y="136" fill="#172554" font-size="16" font-weight="700">16</text>

    <text class="muted" x="110" y="176" fill="#526173" font-size="16" text-anchor="end">b</text>
    <rect class="bar" x="146" y="158" width="117" height="30" rx="6" fill="#93c5fd" stroke="#2563eb" stroke-width="2" />
    <text class="bar-label" x="273" y="180" fill="#172554" font-size="16" font-weight="700">13</text>

    <text class="muted" x="110" y="220" fill="#526173" font-size="16" text-anchor="end">c</text>
    <rect class="bar" x="146" y="202" width="108" height="30" rx="6" fill="#93c5fd" stroke="#2563eb" stroke-width="2" />
    <text class="bar-label" x="264" y="224" fill="#172554" font-size="16" font-weight="700">12</text>

    <text class="muted" x="110" y="264" fill="#526173" font-size="16" text-anchor="end">e</text>
    <rect class="bar" x="146" y="246" width="81" height="30" rx="6" fill="#93c5fd" stroke="#2563eb" stroke-width="2" />
    <text class="bar-label" x="237" y="268" fill="#172554" font-size="16" font-weight="700">9</text>

    <text class="muted" x="110" y="308" fill="#526173" font-size="16" text-anchor="end">f</text>
    <rect class="bar" x="146" y="290" width="45" height="30" rx="6" fill="#93c5fd" stroke="#2563eb" stroke-width="2" />
    <text class="bar-label" x="201" y="312" fill="#172554" font-size="16" font-weight="700">5</text>

    <text class="muted" x="140" y="348" fill="#526173" font-size="14" text-anchor="middle">Frequencies sum to 100 occurrences</text>
  </g>
</svg>
