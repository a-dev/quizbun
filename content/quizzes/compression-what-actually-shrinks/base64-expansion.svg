<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --byte: #dbeafe;
      --byte-edge: #2563eb;
      --char: #f0eafc;
      --char-edge: #9333ea;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --byte: #1e3a5f;
        --byte-edge: #60a5fa;
        --char: #2a2140;
        --char-edge: #c084fc;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .byte { fill: var(--byte); stroke: var(--byte-edge); }
    .char { fill: var(--char); stroke: var(--char-edge); }
  </style>

  <rect class="panel" width="720" height="320" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="38" fill="#20242c" font-family="system-ui, sans-serif" font-size="19" font-weight="700">
    3 input bytes (24 bits) become 4 output characters
  </text>

  <g font-family="ui-monospace, monospace" text-anchor="middle">
    <!-- 3 byte boxes, 8 bits each -->
    <rect class="byte" x="60" y="70" width="180" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="title" x="150" y="103" fill="#20242c" font-size="15" font-weight="700">byte 1 (8 bits)</text>

    <rect class="byte" x="270" y="70" width="180" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="title" x="360" y="103" fill="#20242c" font-size="15" font-weight="700">byte 2 (8 bits)</text>

    <rect class="byte" x="480" y="70" width="180" height="56" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="title" x="570" y="103" fill="#20242c" font-size="15" font-weight="700">byte 3 (8 bits)</text>

    <text class="muted" x="360" y="145" fill="#526173" font-size="13">= 24 bits total, regrouped into four 6-bit chunks</text>

    <path class="edge" d="M360 155V180" fill="none" stroke="#64748b" stroke-width="2" />

    <!-- 4 char boxes, 6 bits each -->
    <rect class="char" x="60" y="188" width="150" height="56" rx="8" fill="#f0eafc" stroke="#9333ea" stroke-width="2" />
    <text class="title" x="135" y="221" fill="#20242c" font-size="15" font-weight="700">6 bits</text>

    <rect class="char" x="220" y="188" width="150" height="56" rx="8" fill="#f0eafc" stroke="#9333ea" stroke-width="2" />
    <text class="title" x="295" y="221" fill="#20242c" font-size="15" font-weight="700">6 bits</text>

    <rect class="char" x="380" y="188" width="150" height="56" rx="8" fill="#f0eafc" stroke="#9333ea" stroke-width="2" />
    <text class="title" x="455" y="221" fill="#20242c" font-size="15" font-weight="700">6 bits</text>

    <rect class="char" x="540" y="188" width="150" height="56" rx="8" fill="#f0eafc" stroke="#9333ea" stroke-width="2" />
    <text class="title" x="615" y="221" fill="#20242c" font-size="15" font-weight="700">6 bits</text>

    <text class="muted" x="135" y="266" fill="#526173" font-size="13">char 1</text>
    <text class="muted" x="295" y="266" fill="#526173" font-size="13">char 2</text>
    <text class="muted" x="455" y="266" fill="#526173" font-size="13">char 3</text>
    <text class="muted" x="615" y="266" fill="#526173" font-size="13">char 4</text>

    <text class="muted" x="360" y="296" fill="#526173" font-size="13">Each 6-bit chunk selects one of 64 base64 characters — 4 bytes of text per 3 bytes of input, a +33% expansion</text>
  </g>
</svg>
