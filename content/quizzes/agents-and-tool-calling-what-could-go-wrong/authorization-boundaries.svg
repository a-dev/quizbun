<svg xmlns="http://www.w3.org/2000/svg" width="720" height="764" viewBox="0 0 720 764">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
      --alt-fill: #f3e8ff;
      --alt-edge: #9333ea;
      --alt-text: #581c87;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
        --alt-fill: #2e1d40;
        --alt-edge: #c084fc;
        --alt-text: #e9d5ff;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .alt-text { fill: var(--alt-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .alt-box { fill: var(--alt-fill); stroke: var(--alt-edge); }
    .card-box { fill: var(--card); stroke: var(--edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
  </style>
  <rect class="panel" width="720" height="764" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Authority belongs to the system, not to the model</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Every rule below is one rule: bind what a call may do to a verified identity, downstream.</text>
  <rect class="card-box" x="36" y="88" width="648" height="180" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Where the tenancy boundary actually lives</text>
  <rect class="accent-box" x="54" y="128" width="300" height="124" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="68" y="148" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11.2" font-weight="700">Enforced by the model</text>
  <text class="accent-text" x="68" y="166" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">SYSTEM = "The current user is u_412.</text>
  <text class="accent-text" x="68" y="180" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9">          Only return their records."</text>
  <text class="accent-text" x="68" y="194" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9"># credential: shared service account</text>
  <text class="accent-text" x="68" y="212.0" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">A sentence is dislodged by routine things: an ambiguous</text>
  <text class="accent-text" x="68" y="223.5" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">request, injected text inside a support ticket, a</text>
  <text class="accent-text" x="68" y="235.0" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">transposed id, a compaction step that drops the constraint.</text>
  <rect class="good-box" x="370" y="128" width="296" height="124" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="384" y="148" fill="#14532d" font-family="system-ui, sans-serif" font-size="11.2" font-weight="700">Enforced by the system holding the data</text>
  <text class="good-text" x="384" y="168" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.2">· a per-user credential the database itself checks</text>
  <text class="good-text" x="384" y="184" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.2">· row-level security, or a tenant-bound connection</text>
  <text class="good-text" x="384" y="204.0" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.2">The wrong query then fails at the data layer, whatever the</text>
  <text class="good-text" x="384" y="215.5" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.2">model intended. Tests over prompts sample a behaviour;</text>
  <text class="good-text" x="384" y="227.0" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.2">they do not establish an invariant.</text>
  <rect class="card-box" x="36" y="280" width="648" height="210" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="306" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Three specification rules, one idea underneath</text>
  <rect class="info-box" x="54" y="320" width="196" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="66" y="340" fill="#172554" font-family="system-ui, sans-serif" font-size="11" font-weight="700">No token passthrough</text>
  <text class="info-text" x="66" y="358" fill="#172554" font-family="system-ui, sans-serif" font-size="9">A server MUST NOT accept a token that</text>
  <text class="info-text" x="66" y="369" fill="#172554" font-family="system-ui, sans-serif" font-size="9">was not issued for it — check the</text>
  <text class="info-text" x="66" y="380" fill="#172554" font-family="system-ui, sans-serif" font-size="9">audience claim. Accepting arbitrary</text>
  <text class="info-text" x="66" y="391" fill="#172554" font-family="system-ui, sans-serif" font-size="9">tokens bypasses the rate limiting and</text>
  <text class="info-text" x="66" y="402" fill="#172554" font-family="system-ui, sans-serif" font-size="9">validation keyed to that audience,</text>
  <text class="info-text" x="66" y="413" fill="#172554" font-family="system-ui, sans-serif" font-size="9">attributes downstream requests to the</text>
  <text class="info-text" x="66" y="424" fill="#172554" font-family="system-ui, sans-serif" font-size="9">wrong identity, and turns the server</text>
  <text class="info-text" x="66" y="435" fill="#172554" font-family="system-ui, sans-serif" font-size="9">into a ready-made proxy.</text>
  <rect class="info-box" x="262" y="320" width="196" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="274" y="340" fill="#172554" font-family="system-ui, sans-serif" font-size="11" font-weight="700">A handle is a name</text>
  <text class="info-text" x="274" y="358" fill="#172554" font-family="system-ui, sans-serif" font-size="9">A state handle is not a capability,</text>
  <text class="info-text" x="274" y="369" fill="#172554" font-family="system-ui, sans-serif" font-size="9">and possession of one is not</text>
  <text class="info-text" x="274" y="380" fill="#172554" font-family="system-ui, sans-serif" font-size="9">authentication. Key stored state as</text>
  <text class="info-text" x="274" y="391" fill="#172554" font-family="system-ui, sans-serif" font-size="9">user_id:handle, with the user id taken</text>
  <text class="info-text" x="274" y="402" fill="#172554" font-family="system-ui, sans-serif" font-size="9">from the verified token. Unguessable,</text>
  <text class="info-text" x="274" y="413" fill="#172554" font-family="system-ui, sans-serif" font-size="9">expiring handles are depth — a handle</text>
  <text class="info-text" x="274" y="424" fill="#172554" font-family="system-ui, sans-serif" font-size="9">also travels through logs and context.</text>
  <rect class="info-box" x="470" y="320" width="196" height="150" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="482" y="340" fill="#172554" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Progressive scope</text>
  <text class="info-text" x="482" y="358" fill="#172554" font-family="system-ui, sans-serif" font-size="9">Start with a minimal set of low-risk</text>
  <text class="info-text" x="482" y="369" fill="#172554" font-family="system-ui, sans-serif" font-size="9">discovery and read scopes, and elevate</text>
  <text class="info-text" x="482" y="380" fill="#172554" font-family="system-ui, sans-serif" font-size="9">on a targeted challenge the first time</text>
  <text class="info-text" x="482" y="391" fill="#172554" font-family="system-ui, sans-serif" font-size="9">a privileged operation is attempted.</text>
  <text class="info-text" x="482" y="402" fill="#172554" font-family="system-ui, sans-serif" font-size="9">Accept reduced-scope tokens. Wildcard</text>
  <text class="info-text" x="482" y="413" fill="#172554" font-family="system-ui, sans-serif" font-size="9">and omnibus scopes are named as a</text>
  <text class="info-text" x="482" y="424" fill="#172554" font-family="system-ui, sans-serif" font-size="9">common mistake.</text>
  <rect class="card-box" x="36" y="502" width="648" height="190" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="528" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Excessive Agency has three root causes, and three different fixes</text>
  <rect class="alt-box" x="54" y="542" width="340" height="40" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5" />
  <text class="alt-text" x="64" y="559" fill="#581c87" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Excessive functionality</text>
  <text class="alt-text" x="64" y="573" fill="#581c87" font-family="system-ui, sans-serif" font-size="9.4">surface area — limit the extensions, and the functions inside them</text>
  <rect class="alt-box" x="54" y="586" width="340" height="40" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5" />
  <text class="alt-text" x="64" y="603" fill="#581c87" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Excessive permissions</text>
  <text class="alt-text" x="64" y="617" fill="#581c87" font-family="system-ui, sans-serif" font-size="9.4">authority — scope the credential, run in the user's own context</text>
  <rect class="alt-box" x="54" y="630" width="340" height="40" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5" />
  <text class="alt-text" x="64" y="647" fill="#581c87" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Excessive autonomy</text>
  <text class="alt-text" x="64" y="661" fill="#581c87" font-family="system-ui, sans-serif" font-size="9.4">the missing checkpoint — human approval for high-impact actions</text>
  <rect class="accent-box" x="410" y="542" width="256" height="128" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="424" y="562" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" font-weight="700">The mail-forwarding case</text>
  <text class="accent-text" x="424" y="580.0" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">Read-only mail scopes, no send capability, and</text>
  <text class="accent-text" x="424" y="591.5" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">approval before anything goes out prevent the</text>
  <text class="accent-text" x="424" y="603.0" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">outcome. Logging and rate limits only limit the</text>
  <text class="accent-text" x="424" y="614.5" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">damage — logging tells you afterwards, and one</text>
  <text class="accent-text" x="424" y="626.0" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">forwarded thread sits inside any usable limit.</text>
  <rect class="accent-box" x="36" y="704" width="648" height="48" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="54" y="725" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.9" font-weight="700">A secret in the agent's context is a secret in the transcript: replayed into later turns, reachable by injection.</text>
  <text class="accent-text" x="54" y="742" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.2">Substitute it at the network boundary, after the request leaves the sandbox, where the model cannot read it.</text>
</svg>
