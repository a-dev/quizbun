<svg xmlns="http://www.w3.org/2000/svg" width="720" height="728" viewBox="0 0 720 728">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-fill: #e8ecf3;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-fill: #20262e;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .card-box { fill: var(--card); stroke: var(--edge); }
    .dead-box { fill: var(--dead-fill); stroke: var(--edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .dead-line { stroke: var(--dead-text); }
    .edge-line { stroke: var(--edge); }
    .good-line { stroke: var(--good-edge); }
  </style>
  <defs>
    <marker id="arrow-dead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dead-text)" />
    </marker>
    <marker id="arrow-edge" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" />
    </marker>
    <marker id="arrow-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--good-edge)" />
    </marker>
  </defs>
  <rect class="panel" width="720" height="728" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">The loop, and the field that ends it</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">stop_reason is the only structured signal separating “I need something” from “I am done”.</text>
  <rect class="card-box" x="36" y="88" width="648" height="210" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">One turn of a client-side agent loop</text>
  <rect class="info-box" x="54" y="132" width="150" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="129" y="152" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Send request</text>
  <path class="edge-line" d="M204,154 H222" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-edge)" />
  <rect class="info-box" x="232" y="132" width="150" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="307" y="152" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Assistant response</text>
  <path class="edge-line" d="M382,154 H400" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-edge)" />
  <rect class="info-box" x="410" y="132" width="150" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="485" y="152" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Read stop_reason</text>
  <text class="info-text" x="129" y="168" fill="#172554" font-family="system-ui, sans-serif" font-size="9.8" text-anchor="middle">tools + full history</text>
  <text class="info-text" x="307" y="168" fill="#172554" font-family="system-ui, sans-serif" font-size="9.8" text-anchor="middle">text and tool_use blocks</text>
  <text class="info-text" x="485" y="168" fill="#172554" font-family="system-ui, sans-serif" font-size="9.8" text-anchor="middle">one of seven values</text>
  <path class="good-line" d="M470,176 V190 H204 V198" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)" />
  <path class="dead-line" d="M500,176 V190 H516 V198" fill="none" stroke="#8a97a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-dead)" />
  <rect class="good-box" x="54" y="198" width="300" height="82" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="70" y="218" fill="#14532d" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">CONTINUE — the model needs you</text>
  <text class="good-text" x="70" y="238" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">tool_use</text>
  <text class="good-text" x="140" y="238" fill="#14532d" font-family="system-ui, sans-serif" font-size="10">run the tools, reply with tool_result</text>
  <text class="good-text" x="70" y="256" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">pause_turn</text>
  <text class="good-text" x="155" y="256" fill="#14532d" font-family="system-ui, sans-serif" font-size="10">resend the assistant content as-is</text>
  <text class="good-text" x="70" y="272" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.8">Anything else is a bug waiting to spin.</text>
  <rect class="dead-box" x="366" y="198" width="300" height="82" rx="10" fill="#e8ecf3" stroke="#64748b" stroke-width="2" />
  <text class="dead-text" x="382" y="218" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">EXIT — the turn is over</text>
  <text class="dead-text" x="382" y="236" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">end_turn · max_tokens · stop_sequence</text>
  <text class="dead-text" x="382" y="252" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">refusal · model_context_window_exceeded</text>
  <text class="dead-text" x="382" y="272" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.8">Several of these are failures to surface, not successes.</text>
  <path class="good-line" d="M54,240 H46 V152 H50" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)" />
  <rect class="card-box" x="36" y="310" width="648" height="200" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="336" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">What each continuation has to look like</text>
  <rect class="good-box" x="54" y="350" width="296" height="144" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="70" y="372" fill="#14532d" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">tool_use → exactly one user message</text>
  <text class="good-text" x="70" y="394" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">assistant: [ tool_use tu_1, tool_use tu_2 ]</text>
  <text class="good-text" x="70" y="412" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">user: [ tool_result tu_1,</text>
  <text class="good-text" x="117" y="428" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.8">tool_result tu_2 ]</text>
  <text class="good-text" x="70" y="450" fill="#14532d" font-family="system-ui, sans-serif" font-size="10">One result per tool_use, matched by tool_use_id,</text>
  <text class="good-text" x="70" y="464" fill="#14532d" font-family="system-ui, sans-serif" font-size="10">every tool_result before any text — and the same</text>
  <text class="good-text" x="70" y="478" fill="#14532d" font-family="system-ui, sans-serif" font-size="10">tools array on the next request.</text>
  <rect class="info-box" x="370" y="350" width="296" height="144" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="386" y="372" fill="#172554" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">pause_turn → resend it unchanged</text>
  <text class="info-text" x="386" y="394" fill="#172554" font-family="system-ui, sans-serif" font-size="10">The server-side sampling loop hit its iteration</text>
  <text class="info-text" x="386" y="408" fill="#172554" font-family="system-ui, sans-serif" font-size="10">limit — ten per request by default — while running a</text>
  <text class="info-text" x="386" y="422" fill="#172554" font-family="system-ui, sans-serif" font-size="10">server tool. No client tool_use block is waiting.</text>
  <text class="info-text" x="386" y="452" fill="#172554" font-family="system-ui, sans-serif" font-size="10">Append the assistant response as-is: the trailing</text>
  <text class="info-text" x="386" y="466" fill="#172554" font-family="system-ui, sans-serif" font-size="10">server_tool_use block is what resumes it. Adding</text>
  <text class="info-text" x="386" y="480" fill="#172554" font-family="system-ui, sans-serif" font-size="10">“Continue.” changes the conversation.</text>
  <rect class="card-box" x="36" y="522" width="648" height="150" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="548" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Three ways the loop goes wrong</text>
  <rect class="accent-box" x="54" y="560" width="196" height="100" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="64" y="578" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" font-weight="700">A truncated tool_use</text>
  <text class="accent-text" x="64" y="594" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4">max_tokens cut the call mid-JSON.</text>
  <text class="accent-text" x="64" y="606" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4">There is no partial execution — raise</text>
  <text class="accent-text" x="64" y="618" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4">the limit and re-send. A tool_result</text>
  <text class="accent-text" x="64" y="630" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4">must reference a committed id, and a</text>
  <text class="accent-text" x="64" y="642" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4">truncated block has none.</text>
  <rect class="accent-box" x="262" y="560" width="196" height="100" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="272" y="578" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" font-weight="700">An empty tool result</text>
  <text class="accent-text" x="272" y="594" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4">"" is indistinguishable from a broken</text>
  <text class="accent-text" x="272" y="606" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4">tool, so the model loosens the query</text>
  <text class="accent-text" x="272" y="618" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4">and retries. Say what ran instead:</text>
  <text class="accent-text" x="272" y="630" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4">Found 0 orders matching “acme-2024”</text>
  <text class="accent-text" x="272" y="642" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4">in the last 90 days.</text>
  <rect class="accent-box" x="470" y="560" width="196" height="100" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="480" y="578" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" font-weight="700">No iteration cap</text>
  <text class="accent-text" x="480" y="594" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4">Unbounded spend, a livelock on a call</text>
  <text class="accent-text" x="480" y="606" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4">that always fails, and context that</text>
  <text class="accent-text" x="480" y="618" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4">only grows. The cap is a circuit</text>
  <text class="accent-text" x="480" y="630" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4">breaker — reaching it reports</text>
  <text class="accent-text" x="480" y="642" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4">failure, not success.</text>
  <rect class="accent-box" x="36" y="684" width="648" height="32" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="54" y="705" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.9" font-weight="700">Prose is not a termination signal. A model can end a turn with “I'll run the migration” and call nothing.</text>
</svg>
