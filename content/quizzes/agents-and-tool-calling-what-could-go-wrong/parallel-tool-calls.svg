<svg xmlns="http://www.w3.org/2000/svg" width="720" height="788" viewBox="0 0 720 788">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .card-box { fill: var(--card); stroke: var(--edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .edge-line { stroke: var(--edge); }
  </style>
  <defs>
    <marker id="arrow-edge" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" />
    </marker>
  </defs>
  <rect class="panel" width="720" height="788" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Several calls in one turn are a set, not a schedule</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">The API prescribes no order. What you send back decides whether the model keeps batching.</text>
  <rect class="card-box" x="36" y="88" width="648" height="190" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">The same two calls, two integration shapes</text>
  <rect class="accent-box" x="54" y="132" width="296" height="130" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="70" y="154" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Wrong: one user message per result</text>
  <text class="accent-text" x="70" y="174" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">assistant: [ tool_use tu_1, tool_use tu_2 ]</text>
  <text class="accent-text" x="70" y="190" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">user: [ tool_result tu_1 ]</text>
  <text class="accent-text" x="70" y="206" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">user: [ tool_result tu_2 ]</text>
  <text class="accent-text" x="70" y="228" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.6">History is few-shot evidence about your integration. A</text>
  <text class="accent-text" x="70" y="240" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.6">transcript where parallel calls were always answered</text>
  <text class="accent-text" x="70" y="252" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.6">serially trains the model out of making them.</text>
  <rect class="good-box" x="370" y="132" width="296" height="130" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="386" y="154" fill="#14532d" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Correct: one user message, both</text>
  <text class="good-text" x="386" y="174" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">assistant: [ tool_use tu_1, tool_use tu_2 ]</text>
  <text class="good-text" x="386" y="190" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">user: [ tool_result tu_1,</text>
  <text class="good-text" x="434" y="206" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">tool_result tu_2 ]</text>
  <text class="good-text" x="386" y="228" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.6">Several tool_result blocks in one user message is not</text>
  <text class="good-text" x="386" y="240" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.6">merely allowed, it is the required form, and every one</text>
  <text class="good-text" x="386" y="252" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.6">of them sits before any text.</text>
  <rect class="card-box" x="36" y="290" width="648" height="196" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="316" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Results come back out of order, only the id says which is which</text>
  <rect class="info-box" x="54" y="334" width="210" height="30" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="64" y="354" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">tu_1  get_weather("Paris")</text>
  <rect class="info-box" x="54" y="372" width="210" height="30" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="64" y="392" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">tu_2  get_weather("Tokyo")</text>
  <rect class="info-box" x="54" y="410" width="210" height="30" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="64" y="430" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">tu_3  get_flights("NRT")</text>
  <rect class="good-box" x="430" y="334" width="210" height="30" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="440" y="354" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">result for tu_3</text>
  <text class="good-text" x="630" y="354" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="end">0.4 s</text>
  <rect class="good-box" x="430" y="372" width="210" height="30" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="440" y="392" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">result for tu_1</text>
  <text class="good-text" x="630" y="392" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="end">1.9 s</text>
  <rect class="good-box" x="430" y="410" width="210" height="30" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="440" y="430" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">result for tu_2</text>
  <text class="good-text" x="630" y="430" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="end">0.8 s</text>
  <path class="edge-line" d="M264,349 C340,349 354,387 424,387" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-edge)" />
  <path class="edge-line" d="M264,387 C340,387 354,425 424,425" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-edge)" />
  <path class="edge-line" d="M264,425 C340,425 354,349 424,349" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-edge)" />
  <text class="muted" x="347" y="452" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">an async pool finishes in completion order</text>
  <text class="accent-text" x="54" y="462" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.8">Positional matching survives a naive sequential loop, then silently attributes Tokyo's forecast to Paris the first time you</text>
  <text class="accent-text" x="54" y="475" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.8">add a pool. Matching by tool name is no better: a parallel batch is usually the same tool twice.</text>
  <rect class="card-box" x="36" y="498" width="648" height="218" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="524" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Which batches may actually run at once</text>
  <rect class="good-box" x="54" y="538" width="380" height="34" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="64" y="552" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">get_weather("Paris") + get_weather("Tokyo")</text>
  <text class="good-text" x="64" y="565" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5">independent and read-only: safe to parallelise</text>
  <rect class="accent-box" x="54" y="576" width="380" height="34" rx="7" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="64" y="590" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">write_file(cfg) + read_file(cfg)</text>
  <text class="accent-text" x="64" y="603" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5">read-after-write: the read is meant to see the write</text>
  <rect class="accent-box" x="54" y="614" width="380" height="34" rx="7" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="64" y="628" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">create_branch("fix") + push_to_branch("fix")</text>
  <text class="accent-text" x="64" y="641" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5">the second needs the first to have succeeded</text>
  <rect class="accent-box" x="54" y="652" width="380" height="34" rx="7" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="64" y="666" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">append_to_ledger + append_to_ledger</text>
  <text class="accent-text" x="64" y="679" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5">the relative order decides the resulting balance</text>
  <rect class="info-box" x="450" y="538" width="216" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="462" y="558" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">No per-tool flag exists</text>
  <text class="info-text" x="462" y="574" fill="#172554" font-family="system-ui, sans-serif" font-size="9.3">disable_parallel_tool_use is a field</text>
  <text class="info-text" x="462" y="586" fill="#172554" font-family="system-ui, sans-serif" font-size="9.3">inside tool_choice and composes with any</text>
  <text class="info-text" x="462" y="598" fill="#172554" font-family="system-ui, sans-serif" font-size="9.3">type. Parallel-safety belongs to your</text>
  <text class="info-text" x="462" y="610" fill="#172554" font-family="system-ui, sans-serif" font-size="9.3">harness.</text>
  <rect class="info-box" x="450" y="626" width="216" height="80" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="462" y="646" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">Typed tools can be scheduled</text>
  <text class="info-text" x="462" y="662" fill="#172554" font-family="system-ui, sans-serif" font-size="9.3">grep(pattern, path) is classifiable as</text>
  <text class="info-text" x="462" y="674" fill="#172554" font-family="system-ui, sans-serif" font-size="9.3">read-only before it runs. bash("…") is</text>
  <text class="info-text" x="462" y="686" fill="#172554" font-family="system-ui, sans-serif" font-size="9.3">one opaque string where a search and a</text>
  <text class="info-text" x="462" y="698" fill="#172554" font-family="system-ui, sans-serif" font-size="9.3">push look alike.</text>
  <rect class="accent-box" x="36" y="728" width="648" height="48" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="54" y="749" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.4" font-weight="700">The API prescribes no execution order. Concurrency is your call, and the test is dependency, not adjacency.</text>
  <text class="accent-text" x="54" y="766" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.2">Every tool_use still needs a tool_result, including a skipped one: is_error: true, "Not executed: write_file failed."</text>
</svg>
