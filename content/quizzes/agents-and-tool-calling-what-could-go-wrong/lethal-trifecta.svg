<svg xmlns="http://www.w3.org/2000/svg" width="720" height="764" viewBox="0 0 720 764">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .card-box { fill: var(--card); stroke: var(--edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-line { stroke: var(--accent-edge); }
  </style>
  <defs>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-edge)" />
    </marker>
  </defs>
  <rect class="panel" width="720" height="764" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">The lethal trifecta, and where the instructions get in</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Each capability is reasonable alone. Together they close a circuit an attacker can drive.</text>
  <rect class="card-box" x="36" y="88" width="648" height="200" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Three capabilities, in the order an attack uses them</text>
  <rect class="accent-box" x="54" y="134" width="196" height="66" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="152" y="162" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11.2" font-weight="700" text-anchor="middle">Exposure to untrusted content</text>
  <text class="accent-text" x="152" y="180" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.6" text-anchor="middle">any path attacker text can arrive by</text>
  <path class="accent-line" d="M250,167 H256" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-accent)" />
  <rect class="info-box" x="262" y="134" width="196" height="66" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="360" y="162" fill="#172554" font-family="system-ui, sans-serif" font-size="11.2" font-weight="700" text-anchor="middle">Access to private data</text>
  <text class="info-text" x="360" y="180" fill="#172554" font-family="system-ui, sans-serif" font-size="9.6" text-anchor="middle">usually the whole point of the tools</text>
  <path class="accent-line" d="M458,167 H464" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-accent)" />
  <rect class="accent-box" x="470" y="134" width="196" height="66" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="568" y="162" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11.2" font-weight="700" text-anchor="middle">Communication to the outside</text>
  <text class="accent-text" x="568" y="180" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.6" text-anchor="middle">any path by which data can leave</text>
  <text class="accent-text" x="255" y="128" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4" font-weight="700" text-anchor="middle">instructions arrive</text>
  <text class="accent-text" x="463" y="128" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4" font-weight="700" text-anchor="middle">act on this</text>
  <text class="muted" x="54" y="228" fill="#526173" font-family="system-ui, sans-serif" font-size="10.2">Remove any one of the three and the chain breaks. That is the whole value of the framing: the risk lives in the</text>
  <text class="muted" x="54" y="241" fill="#526173" font-family="system-ui, sans-serif" font-size="10.2">combination, not in any leg, and each leg on its own is usually the reason the agent exists at all.</text>
  <text class="muted" x="54" y="268" fill="#526173" font-family="system-ui, sans-serif" font-size="10.2">MCP sharpens it — a user can assemble a trifecta at runtime from three separately harmless integrations that nobody</text>
  <text class="muted" x="54" y="281" fill="#526173" font-family="system-ui, sans-serif" font-size="10.2">reviewed together.</text>
  <rect class="card-box" x="36" y="300" width="648" height="200" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="326" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Four channels that carry attacker-controlled text into context</text>
  <rect class="info-box" x="54" y="338" width="612" height="32" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="64" y="358" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">tool results</text>
  <text class="info-text" x="290" y="358" fill="#172554" font-family="system-ui, sans-serif" font-size="9.5">the one channel everyone remembers to review</text>
  <rect class="accent-box" x="54" y="376" width="612" height="32" rx="7" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="64" y="396" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">tool descriptions and schemas</text>
  <text class="accent-text" x="290" y="396" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5">in context from tools/list before any call — a poisoned tool is never invoked</text>
  <rect class="accent-box" x="54" y="414" width="612" height="32" rx="7" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="64" y="434" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">error strings quoting a remote body</text>
  <text class="accent-text" x="290" y="434" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5">is_error routes a block, it does not mark it untrusted — no delimiter helps</text>
  <rect class="accent-box" x="54" y="452" width="612" height="32" rx="7" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="64" y="472" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">titles, parameter docs, annotations</text>
  <text class="accent-text" x="290" y="472" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5">every field a server controls and a client renders into context</text>
  <rect class="card-box" x="36" y="512" width="648" height="180" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="538" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">What changes the security property, and what only raises the attacker's cost</text>
  <rect class="good-box" x="54" y="552" width="300" height="124" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="68" y="572" fill="#14532d" font-family="system-ui, sans-serif" font-size="11.2" font-weight="700">Changes the property</text>
  <text class="good-text" x="68" y="590.0" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.2">· Remove one leg architecturally. An agent with no egress</text>
  <text class="good-text" x="68" y="601.5" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.2">cannot leak; one with no private-data tool has nothing to</text>
  <text class="good-text" x="68" y="613.0" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.2">leak.</text>
  <text class="good-text" x="68" y="634.0" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.2">· Constrain what the agent may do once untrusted input has</text>
  <text class="good-text" x="68" y="645.5" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.2">entered, so that input cannot trigger a consequential</text>
  <text class="good-text" x="68" y="657.0" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.2">action.</text>
  <rect class="accent-box" x="370" y="552" width="296" height="124" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="384" y="572" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11.2" font-weight="700">Only raises the cost</text>
  <text class="accent-text" x="384" y="590.0" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">· Guardrails and classifiers — a 95% capture rate is a</text>
  <text class="accent-text" x="384" y="601.5" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">failing grade against someone who keeps iterating.</text>
  <text class="accent-text" x="384" y="620.0" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">· A firmer system prompt, or fine-tuning: the model is</text>
  <text class="accent-text" x="384" y="631.5" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">still the thing being argued with.</text>
  <text class="accent-text" x="384" y="650.0" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">· Summarising the untrusted text first — the summariser</text>
  <text class="accent-text" x="384" y="661.5" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">reads it too, inside the same trust domain.</text>
  <rect class="accent-box" x="36" y="704" width="648" height="48" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="54" y="725" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.6" font-weight="700">Approval is not durable: a server may change its tool list and announce it with a list-changed notification.</text>
  <text class="accent-text" x="54" y="742" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.2">Pin and diff tool definitions across sessions, keep a human able to deny, and show the tool inputs before the call.</text>
</svg>
