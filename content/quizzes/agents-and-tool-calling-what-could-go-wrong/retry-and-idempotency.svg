<svg xmlns="http://www.w3.org/2000/svg" width="720" height="806" viewBox="0 0 720 806">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-fill: #e8ecf3;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-fill: #20262e;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .card-box { fill: var(--card); stroke: var(--edge); }
    .dead-box { fill: var(--dead-fill); stroke: var(--edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .dead-line { stroke: var(--dead-text); }
    .edge-line { stroke: var(--edge); }
  </style>
  <defs>
    <marker id="arrow-dead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--dead-text)" />
    </marker>
    <marker id="arrow-edge" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" />
    </marker>
  </defs>
  <rect class="panel" width="720" height="806" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">A timeout describes the client's patience</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">It says nothing about whether the operation ran. That gap is the second charge.</text>
  <rect class="card-box" x="36" y="88" width="648" height="268" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">One payment tool, one timeout, two charges</text>
  <text class="muted" x="179" y="136" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">agent harness</text>
  <text class="muted" x="541" y="136" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">payment API</text>
  <rect class="info-box" x="54" y="148" width="250" height="32" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="179" y="169" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">call the payment tool</text>
  <rect class="info-box" x="416" y="148" width="250" height="32" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="541" y="169" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">POST /v1/charges</text>
  <path class="edge-line" d="M310,164 H410" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-edge)" />
  <rect class="good-box" x="416" y="186" width="250" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="541" y="207" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">charge created: money moved</text>
  <rect class="accent-box" x="54" y="224" width="250" height="32" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="179" y="245" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">timeout at 30 s</text>
  <rect class="dead-box" x="416" y="224" width="250" height="32" rx="8" fill="#e8ecf3" stroke="#64748b" stroke-width="1.5" />
  <text class="dead-text" x="541" y="245" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">the response never arrives</text>
  <path class="dead-line" d="M410,240 H310" fill="none" stroke="#8a97a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" marker-end="url(#arrow-dead)" />
  <rect class="accent-box" x="54" y="262" width="250" height="32" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="179" y="283" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">"Tool timed out. Try again."</text>
  <rect class="accent-box" x="416" y="262" width="250" height="32" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="541" y="283" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">POST /v1/charges, again</text>
  <path class="edge-line" d="M310,278 H410" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-edge)" />
  <rect class="accent-box" x="416" y="300" width="250" height="32" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="541" y="321" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">a second charge is created</text>
  <text class="muted" x="54" y="348" fill="#526173" font-family="system-ui, sans-serif" font-size="10.4">Dropped in transit, or processed with only the reply lost, from the caller's seat those look the same.</text>
  <rect class="card-box" x="36" y="368" width="648" height="222" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="394" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">The same logical operation, carrying the same key</text>
  <rect class="good-box" x="54" y="408" width="346" height="20" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="62" y="422" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">1.</text>
  <text class="good-text" x="80" y="422" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">One key per logical operation, minted before attempt 1</text>
  <rect class="good-box" x="54" y="432" width="346" height="20" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="62" y="446" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">2.</text>
  <text class="good-text" x="80" y="446" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">Attempt 1 sends  Idempotency-Key: 8f3c…  (a random UUID)</text>
  <rect class="good-box" x="54" y="456" width="346" height="20" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="62" y="470" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">3.</text>
  <text class="good-text" x="80" y="470" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">It times out. The retry reuses that value, unchanged</text>
  <rect class="good-box" x="54" y="480" width="346" height="20" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="62" y="494" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">4.</text>
  <text class="good-text" x="80" y="494" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">The server recognises the replay, returns the first outcome</text>
  <rect class="good-box" x="54" y="504" width="346" height="20" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="62" y="518" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">5.</text>
  <text class="good-text" x="80" y="518" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">No second charge. The ambiguity stops mattering</text>
  <rect class="accent-box" x="416" y="408" width="250" height="116" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="430" y="428" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Who has to mint it</text>
  <text class="accent-text" x="430" y="444.0" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">The caller, in your harness. Only the caller</text>
  <text class="accent-text" x="430" y="455.5" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">knows that two HTTP requests are one intent. Not</text>
  <text class="accent-text" x="430" y="467.0" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">the model, which has no obligation to reproduce</text>
  <text class="accent-text" x="430" y="478.5" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">a value. Not the server, which needs the round</text>
  <text class="accent-text" x="430" y="490.0" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">trip that just failed. Not a timestamp, which</text>
  <text class="accent-text" x="430" y="501.5" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.2">changes every attempt.</text>
  <rect class="info-box" x="54" y="534" width="612" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="66" y="552" fill="#172554" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Same key, different payload → reject with 422. Same key while the first is still in flight → conflict.</text>
  <text class="info-text" x="66" y="567" fill="#172554" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Same key after completion → the stored outcome, whether that was a success or an error.</text>
  <rect class="card-box" x="36" y="602" width="648" height="160" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="628" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">What "idempotent" actually claims, and what a hint is worth</text>
  <rect class="info-box" x="54" y="642" width="300" height="104" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="68" y="662" fill="#172554" font-family="system-ui, sans-serif" font-size="11" font-weight="700">RFC 9110 §9.2.2</text>
  <text class="info-text" x="68" y="678.0" fill="#172554" font-family="system-ui, sans-serif" font-size="9.2">The intended effect on the server of several identical</text>
  <text class="info-text" x="68" y="689.5" fill="#172554" font-family="system-ui, sans-serif" font-size="9.2">requests equals the effect of one. PUT, DELETE and the safe</text>
  <text class="info-text" x="68" y="701.0" fill="#172554" font-family="system-ui, sans-serif" font-size="9.2">methods qualify; POST does not. Not the same as safe: GET</text>
  <text class="info-text" x="68" y="712.5" fill="#172554" font-family="system-ui, sans-serif" font-size="9.2">is both, DELETE is idempotent and not safe. Not identical</text>
  <text class="info-text" x="68" y="724.0" fill="#172554" font-family="system-ui, sans-serif" font-size="9.2">responses: 204 then 404 describe one end state.</text>
  <rect class="accent-box" x="370" y="642" width="296" height="104" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="384" y="662" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" font-weight="700">MCP annotation defaults</text>
  <text class="accent-text" x="384" y="680" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">readOnlyHint</text>
  <text class="accent-text" x="500" y="680" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">false</text>
  <text class="accent-text" x="384" y="695" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">destructiveHint</text>
  <text class="accent-text" x="500" y="695" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">true</text>
  <text class="accent-text" x="384" y="710" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">idempotentHint</text>
  <text class="accent-text" x="500" y="710" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">false</text>
  <text class="accent-text" x="384" y="725" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">openWorldHint</text>
  <text class="accent-text" x="500" y="725" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">true</text>
  <text class="accent-text" x="384" y="740" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.4">Silence buys no leniency, and a hint is not a control.</text>
  <rect class="accent-box" x="36" y="774" width="648" height="32" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="54" y="795" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">A timeout describes the client's patience. Retry safety comes from a key, not from the error text.</text>
</svg>
