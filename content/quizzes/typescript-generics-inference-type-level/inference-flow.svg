<svg xmlns="http://www.w3.org/2000/svg" width="720" height="528" viewBox="0 0 720 528">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .edge-line { stroke: var(--edge); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" />
    </marker>
  </defs>
  <rect class="panel" width="720" height="528" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">How T gets its value, and what happens when nothing pins it down</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Inference collects candidates at every site, checks the constraint, then decides how precise to stay.</text>
  <rect class="card" x="36" y="88" width="400" height="288" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">One call, one T</text>
  <rect class="info-box" x="54" y="136" width="220" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="64" y="151" fill="#172554" font-family="system-ui, sans-serif" font-size="10" font-weight="700">the call site</text>
  <text class="info-text" x="64" y="165" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">wrap("hi")</text>
  <path class="edge-line" d="M164,172 V186" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect class="info-box" x="54" y="188" width="220" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="64" y="203" fill="#172554" font-family="system-ui, sans-serif" font-size="10" font-weight="700">collect a candidate per slot</text>
  <text class="info-text" x="64" y="217" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">"hi"</text>
  <path class="edge-line" d="M164,224 V238" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect class="info-box" x="54" y="240" width="220" height="36" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="64" y="255" fill="#172554" font-family="system-ui, sans-serif" font-size="10" font-weight="700">check the constraint</text>
  <text class="info-text" x="64" y="269" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">T extends …</text>
  <path class="edge-line" d="M164,276 V290" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect class="accent-box" x="54" y="292" width="220" height="36" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="64" y="307" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10" font-weight="700">decide how precise to stay</text>
  <text class="accent-text" x="64" y="321" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">widen or keep</text>
  <text class="muted" x="288" y="158" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">plain &lt;T&gt;</text>
  <text class="muted" x="288" y="172" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5">literals widen:</text>
  <text class="muted" x="288" y="184" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">"hi" → string</text>
  <text class="good-text" x="288" y="214" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">&lt;const T&gt;</text>
  <text class="good-text" x="288" y="228" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5">as if the caller</text>
  <text class="good-text" x="288" y="240" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5">wrote as const:</text>
  <text class="good-text" x="288" y="252" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5">readonly literals</text>
  <text class="accent-text" x="288" y="282" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10" font-weight="700">no inference site</text>
  <text class="accent-text" x="288" y="296" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5">the declared</text>
  <text class="accent-text" x="288" y="308" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5">default, or</text>
  <text class="accent-text" x="288" y="320" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5">unknown if none</text>
  <text class="muted" x="54" y="350" fill="#526173" font-family="system-ui, sans-serif" font-size="10">NoInfer&lt;T&gt; marks a parameter “use T here, but do not infer</text>
  <text class="muted" x="54" y="366" fill="#526173" font-family="system-ui, sans-serif" font-size="10">from it” — the fix for a stray literal widening the union.</text>
  <rect class="card" x="452" y="88" width="232" height="288" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="470" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">One infer, two positions</text>
  <text class="muted" x="470" y="140" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">(x: infer U, y: infer U)</text>
  <text class="muted" x="470" y="154" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">  =&gt; void</text>
  <rect class="good-box" x="470" y="172" width="196" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="482" y="190" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">covariant — return types</text>
  <text class="good-text" x="482" y="206" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5">candidates are unioned</text>
  <rect class="accent-box" x="470" y="224" width="196" height="44" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="482" y="242" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">contravariant — parameters</text>
  <text class="accent-text" x="482" y="258" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5">candidates are intersected</text>
  <text class="muted" x="470" y="292" fill="#526173" font-family="system-ui, sans-serif" font-size="10">Both slots here are parameters, so</text>
  <text class="muted" x="470" y="306" fill="#526173" font-family="system-ui, sans-serif" font-size="10">U is string &amp; number — and no value</text>
  <text class="muted" x="470" y="320" fill="#526173" font-family="system-ui, sans-serif" font-size="10">is both, so it collapses to never.</text>
  <text class="muted" x="470" y="348" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5">Variance is not a detail here; it is</text>
  <text class="muted" x="470" y="362" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5">the whole answer.</text>
  <rect class="info-box" x="36" y="392" width="648" height="106" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="54" y="416" fill="#172554" font-family="system-ui, sans-serif" font-size="13" font-weight="700">A constraint is what turns a generic into a compile-time check</text>
  <text class="info-text" x="54" y="440" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">function pluck&lt;T, K extends keyof T&gt;(obj: T, key: K): T[K]</text>
  <text class="info-text" x="54" y="462" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">T is inferred from obj, so keyof T is the union of that object's actual keys and a key it does not have fails to compile — before the</text>
  <text class="info-text" x="54" y="480" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">code ever runs. The return type T[K] is an indexed access: it resolves to the type stored at that exact key, not to a union of all of them.</text>
</svg>
