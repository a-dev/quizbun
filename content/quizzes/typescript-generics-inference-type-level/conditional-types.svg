<svg xmlns="http://www.w3.org/2000/svg" width="720" height="548" viewBox="0 0 720 548">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .edge-line { stroke: var(--edge); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" />
    </marker>
  </defs>
  <rect class="panel" width="720" height="548" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">A conditional type splits over unions and recurses on itself</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Both cases hinge on one thing: whether the checked type is a naked type parameter.</text>
  <rect class="card" x="36" y="88" width="316" height="268" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Distribution</text>
  <text class="muted" x="54" y="138" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">type ToArray&lt;T&gt; =</text>
  <text class="muted" x="54" y="152" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">  T extends any ? T[] : never</text>
  <rect class="card" x="54" y="172" width="280" height="32" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="194" y="193" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">ToArray&lt;string | number&gt;</text>
  <path class="edge-line" d="M194,204 V216" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect class="info-box" x="54" y="218" width="280" height="32" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="194" y="239" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">ToArray&lt;string&gt; | ToArray&lt;number&gt;</text>
  <path class="edge-line" d="M194,250 V262" fill="none" stroke="#64748b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect class="good-box" x="54" y="264" width="280" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="194" y="285" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">string[] | number[]</text>
  <text class="muted" x="54" y="330" fill="#526173" font-family="system-ui, sans-serif" font-size="10">A naked type parameter runs against each union member,</text>
  <text class="muted" x="54" y="344" fill="#526173" font-family="system-ui, sans-serif" font-size="10">then the results union back together.</text>
  <rect class="card" x="368" y="88" width="316" height="268" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="386" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Recursion</text>
  <text class="muted" x="386" y="138" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">type Flatten&lt;T&gt; = T extends</text>
  <text class="muted" x="386" y="152" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">  Array&lt;infer Inner&gt; ? Flatten&lt;Inner&gt; : T</text>
  <rect class="info-box" x="386" y="180" width="130" height="24" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="451" y="197" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">number[][][]</text>
  <text class="info-text" x="530" y="197" fill="#172554" font-family="system-ui, sans-serif" font-size="10">Inner = number[][]</text>
  <rect class="info-box" x="386" y="212" width="130" height="24" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="451" y="229" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">number[][]</text>
  <text class="info-text" x="530" y="229" fill="#172554" font-family="system-ui, sans-serif" font-size="10">Inner = number[]</text>
  <rect class="info-box" x="386" y="244" width="130" height="24" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="451" y="261" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">number[]</text>
  <text class="info-text" x="530" y="261" fill="#172554" font-family="system-ui, sans-serif" font-size="10">Inner = number</text>
  <rect class="good-box" x="386" y="276" width="130" height="24" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="451" y="293" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="middle">number</text>
  <text class="good-text" x="530" y="293" fill="#14532d" font-family="system-ui, sans-serif" font-size="10">not an array, stop</text>
  <text class="muted" x="386" y="330" fill="#526173" font-family="system-ui, sans-serif" font-size="10">Each pass peels one array layer. The false branch is</text>
  <text class="muted" x="386" y="344" fill="#526173" font-family="system-ui, sans-serif" font-size="10">the base case, and it returns number.</text>
  <rect class="accent-box" x="36" y="372" width="316" height="148" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="54" y="398" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">boolean is a union too</text>
  <text class="accent-text" x="54" y="422" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">Wrap&lt;boolean&gt;</text>
  <text class="accent-text" x="160" y="422" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">distributes over true | false,</text>
  <text class="accent-text" x="54" y="438" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">so the result is true[] | false[], never boolean[].</text>
  <text class="accent-text" x="54" y="466" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">To turn distribution off, wrap both sides in a one-element</text>
  <text class="accent-text" x="54" y="482" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">tuple:</text>
  <text class="accent-text" x="96" y="482" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">[T] extends [any] ? T[] : never</text>
  <text class="accent-text" x="54" y="504" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10">The parameter is no longer naked, so the union stays whole.</text>
  <rect class="info-box" x="368" y="372" width="316" height="148" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="386" y="398" fill="#172554" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Splitting strings, remapping keys</text>
  <text class="info-text" x="386" y="422" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">S extends `${infer H}.${infer R}` ? H : S</text>
  <text class="info-text" x="386" y="438" fill="#172554" font-family="system-ui, sans-serif" font-size="10">Head&lt;"a.b.c"&gt; matches the first dot: H is "a", R is "b.c".</text>
  <text class="info-text" x="386" y="466" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">{ [K in keyof T as</text>
  <text class="info-text" x="386" y="480" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">  `get${Capitalize&lt;string &amp; K&gt;}`]: () =&gt; T[K] }</text>
  <text class="info-text" x="386" y="504" fill="#172554" font-family="system-ui, sans-serif" font-size="10">string &amp; K narrows K to string so the template accepts it.</text>
</svg>
