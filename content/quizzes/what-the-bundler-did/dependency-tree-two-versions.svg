<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --app-fill: #dbeafe;
      --app-stroke: #2563eb;
      --vendor-fill: #fef3c7;
      --vendor-stroke: #b45309;
      --bad-fill: #fee2e2;
      --bad-stroke: #b91c1c;
      --good-fill: #dcfce7;
      --good-stroke: #15803d;
      --ghost-fill: #eef1f5;
      --ghost-stroke: #b6c0cc;
      --ghost-text: #8a96a6;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --app-fill: #1e3a5f;
        --app-stroke: #60a5fa;
        --vendor-fill: #4a3512;
        --vendor-stroke: #f59e0b;
        --bad-fill: #4c1d1d;
        --bad-stroke: #f87171;
        --good-fill: #14391f;
        --good-stroke: #4ade80;
        --ghost-fill: #20252d;
        --ghost-stroke: #3f4855;
        --ghost-text: #6b7686;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .edge-fill { fill: var(--edge); }
    .card { fill: var(--card); stroke: var(--edge); }
    .app { fill: var(--app-fill); stroke: var(--app-stroke); }
    .app-line { stroke: var(--app-stroke); }
    .app-head { fill: var(--app-stroke); }
    .vendor { fill: var(--vendor-fill); stroke: var(--vendor-stroke); }
    .vendor-line { stroke: var(--vendor-stroke); }
    .vendor-head { fill: var(--vendor-stroke); }
    .bad { fill: var(--bad-fill); stroke: var(--bad-stroke); }
    .bad-line { stroke: var(--bad-stroke); }
    .bad-head { fill: var(--bad-stroke); }
    .good { fill: var(--good-fill); stroke: var(--good-stroke); }
    .good-line { stroke: var(--good-stroke); }
    .good-head { fill: var(--good-stroke); }
    .ghost { fill: var(--ghost-fill); stroke: var(--ghost-stroke); }
    .ghost-line { stroke: var(--ghost-stroke); }
    .ghost-head { fill: var(--ghost-stroke); }
    .ghost-text { fill: var(--ghost-text); }
    .bad-text { fill: var(--bad-stroke); }
    .good-text { fill: var(--good-stroke); }
  </style>

  <rect class="panel" width="720" height="360" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Two ranges that no single version satisfies</text>
  <rect class="app" x="250" y="70" width="220" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="title" x="360.0" y="95.0" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">your-app</text>
  <text class="muted" x="360.0" y="115.0" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">package.json</text>
  <rect class="vendor" x="60" y="170" width="240" height="56" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
  <text class="title" x="180.0" y="195.0" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">legacy-calendar</text>
  <text class="muted" x="180.0" y="215.0" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">wants date-fns ^2.30.0</text>
  <rect class="vendor" x="420" y="170" width="240" height="56" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
  <text class="title" x="540.0" y="195.0" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">date-fns 3.6.0</text>
  <text class="muted" x="540.0" y="215.0" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">node_modules/date-fns</text>
  <rect class="bad" x="60" y="270" width="240" height="56" rx="10" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" />
  <text class="title" x="180.0" y="295.0" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">date-fns 2.30.0</text>
  <text class="muted" x="180.0" y="315.0" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">nested under legacy-calendar</text>
  <path class="edge" d="M320.0 126.0L189.5 167.0" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <path class="edge-fill" d="M180.0 170.0L193.2 172.1L189.6 160.7Z" fill="#64748b" />
  <path class="edge" d="M400.0 126.0L530.5 167.0" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <path class="edge-fill" d="M540.0 170.0L530.4 160.7L526.8 172.1Z" fill="#64748b" />
  <text class="muted" x="500.0" y="140.0" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="middle">^3.6.0</text>
  <path class="edge" d="M180.0 226.0L180.0 260.0" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <path class="edge-fill" d="M180.0 270.0L186.0 258.0L174.0 258.0Z" fill="#64748b" />
  <text class="muted" x="420" y="290" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">Each import resolves to the nearest</text>
  <text class="muted" x="420" y="308" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">node_modules. The bundler follows</text>
  <text class="muted" x="420" y="326" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">both paths and bundles both copies.</text>
</svg>
