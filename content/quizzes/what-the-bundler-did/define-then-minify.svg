<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --app-fill: #dbeafe;
      --app-stroke: #2563eb;
      --vendor-fill: #fef3c7;
      --vendor-stroke: #b45309;
      --bad-fill: #fee2e2;
      --bad-stroke: #b91c1c;
      --good-fill: #dcfce7;
      --good-stroke: #15803d;
      --ghost-fill: #eef1f5;
      --ghost-stroke: #b6c0cc;
      --ghost-text: #8a96a6;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --app-fill: #1e3a5f;
        --app-stroke: #60a5fa;
        --vendor-fill: #4a3512;
        --vendor-stroke: #f59e0b;
        --bad-fill: #4c1d1d;
        --bad-stroke: #f87171;
        --good-fill: #14391f;
        --good-stroke: #4ade80;
        --ghost-fill: #20252d;
        --ghost-stroke: #3f4855;
        --ghost-text: #6b7686;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .edge-fill { fill: var(--edge); }
    .card { fill: var(--card); stroke: var(--edge); }
    .app { fill: var(--app-fill); stroke: var(--app-stroke); }
    .app-line { stroke: var(--app-stroke); }
    .app-head { fill: var(--app-stroke); }
    .vendor { fill: var(--vendor-fill); stroke: var(--vendor-stroke); }
    .vendor-line { stroke: var(--vendor-stroke); }
    .vendor-head { fill: var(--vendor-stroke); }
    .bad { fill: var(--bad-fill); stroke: var(--bad-stroke); }
    .bad-line { stroke: var(--bad-stroke); }
    .bad-head { fill: var(--bad-stroke); }
    .good { fill: var(--good-fill); stroke: var(--good-stroke); }
    .good-line { stroke: var(--good-stroke); }
    .good-head { fill: var(--good-stroke); }
    .ghost { fill: var(--ghost-fill); stroke: var(--ghost-stroke); }
    .ghost-line { stroke: var(--ghost-stroke); }
    .ghost-head { fill: var(--ghost-stroke); }
    .ghost-text { fill: var(--ghost-text); }
    .bad-text { fill: var(--bad-stroke); }
    .good-text { fill: var(--good-stroke); }
  </style>

  <rect class="panel" width="720" height="360" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">What removes the dev-only branch</text>
  <rect class="card" x="36" y="70" width="206" height="204" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="muted" x="52" y="96" fill="#526173" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">1. your source</text>
  <text class="title" x="52" y="118" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start">if (</text>
  <text class="title" x="52" y="140" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" xml:space="preserve" text-anchor="start">  process.env.NODE_ENV</text>
  <text class="title" x="52" y="162" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" xml:space="preserve" text-anchor="start">  !== &#x27;production&#x27;</text>
  <text class="title" x="52" y="184" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start">) {</text>
  <text class="title" x="52" y="206" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" xml:space="preserve" text-anchor="start">  warnDev();</text>
  <text class="title" x="52" y="228" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start">}</text>
  <text class="title" x="52" y="250" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start">render();</text>
  <rect class="card" x="257" y="70" width="206" height="204" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="muted" x="273" y="96" fill="#526173" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">2. after define</text>
  <text class="title" x="273" y="118" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start">if (</text>
  <text class="bad-text" x="273" y="140" fill="#b91c1c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" xml:space="preserve" text-anchor="start">  &#x27;production&#x27;</text>
  <text class="title" x="273" y="162" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" xml:space="preserve" text-anchor="start">  !== &#x27;production&#x27;</text>
  <text class="title" x="273" y="184" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start">) {</text>
  <text class="title" x="273" y="206" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" xml:space="preserve" text-anchor="start">  warnDev();</text>
  <text class="title" x="273" y="228" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start">}</text>
  <text class="title" x="273" y="250" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start">render();</text>
  <rect class="card" x="478" y="70" width="206" height="72" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="muted" x="494" y="96" fill="#526173" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="start">3. after minify</text>
  <text class="title" x="494" y="118" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start">render();</text>
  <path class="edge" d="M243.0 160.0L245.0 160.0" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <path class="edge-fill" d="M255.0 160.0L243.0 154.0L243.0 166.0Z" fill="#64748b" />
  <path class="edge" d="M464.0 160.0L466.0 160.0" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <path class="edge-fill" d="M476.0 160.0L464.0 154.0L464.0 166.0Z" fill="#64748b" />
  <text class="muted" x="36" y="330" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">The define step pastes a string literal. The minifier folds &#x27;production&#x27; !== &#x27;production&#x27; to false,</text>
  <text class="muted" x="36" y="348" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">then deletes the unreachable block, and warnDev with it if nothing else calls it.</text>
</svg>
