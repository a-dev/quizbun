<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --app-fill: #dbeafe;
      --app-stroke: #2563eb;
      --vendor-fill: #fef3c7;
      --vendor-stroke: #b45309;
      --bad-fill: #fee2e2;
      --bad-stroke: #b91c1c;
      --good-fill: #dcfce7;
      --good-stroke: #15803d;
      --ghost-fill: #eef1f5;
      --ghost-stroke: #b6c0cc;
      --ghost-text: #8a96a6;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --app-fill: #1e3a5f;
        --app-stroke: #60a5fa;
        --vendor-fill: #4a3512;
        --vendor-stroke: #f59e0b;
        --bad-fill: #4c1d1d;
        --bad-stroke: #f87171;
        --good-fill: #14391f;
        --good-stroke: #4ade80;
        --ghost-fill: #20252d;
        --ghost-stroke: #3f4855;
        --ghost-text: #6b7686;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .edge-fill { fill: var(--edge); }
    .card { fill: var(--card); stroke: var(--edge); }
    .app { fill: var(--app-fill); stroke: var(--app-stroke); }
    .app-line { stroke: var(--app-stroke); }
    .app-head { fill: var(--app-stroke); }
    .vendor { fill: var(--vendor-fill); stroke: var(--vendor-stroke); }
    .vendor-line { stroke: var(--vendor-stroke); }
    .vendor-head { fill: var(--vendor-stroke); }
    .bad { fill: var(--bad-fill); stroke: var(--bad-stroke); }
    .bad-line { stroke: var(--bad-stroke); }
    .bad-head { fill: var(--bad-stroke); }
    .good { fill: var(--good-fill); stroke: var(--good-stroke); }
    .good-line { stroke: var(--good-stroke); }
    .good-head { fill: var(--good-stroke); }
    .ghost { fill: var(--ghost-fill); stroke: var(--ghost-stroke); }
    .ghost-line { stroke: var(--ghost-stroke); }
    .ghost-head { fill: var(--ghost-stroke); }
    .ghost-text { fill: var(--ghost-text); }
    .bad-text { fill: var(--bad-stroke); }
    .good-text { fill: var(--good-stroke); }
  </style>

  <rect class="panel" width="720" height="360" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">After editing chart.js</text>
  <rect class="bad" x="36" y="70" width="300" height="110" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" />
  <text class="title" x="52" y="96" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="start">main-3f2a → 9c1d.js</text>
  <text class="muted" x="52" y="120" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start">main.js, a.js</text>
  <rect class="good" x="384" y="70" width="300" height="70" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2" />
  <text class="title" x="400" y="96" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" xml:space="preserve" text-anchor="start">Settings-a81b.js  unchanged</text>
  <text class="muted" x="400" y="120" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start">Settings.js</text>
  <rect class="bad" x="384" y="170" width="300" height="110" rx="14" fill="#fee2e2" stroke="#b91c1c" stroke-width="2" />
  <text class="title" x="400" y="196" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" text-anchor="start">Admin-5d60 → e2b4.js</text>
  <text class="muted" x="400" y="220" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start">Admin.js, chart.js</text>
  <rect class="good" x="36" y="230" width="300" height="70" rx="14" fill="#dcfce7" stroke="#15803d" stroke-width="2" />
  <text class="title" x="52" y="256" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" xml:space="preserve" text-anchor="start">shared-0c77.js  unchanged</text>
  <text class="muted" x="52" y="280" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" text-anchor="start">shared.js</text>
  <text class="muted" x="36" y="332" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">Admin holds chart.js, so Admin gets a new hash. main names Admin&#x27;s file, so main gets one too.</text>
</svg>
