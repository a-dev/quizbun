  <path class="edge" d="M540.0 242.0L409.8 268.0" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <path class="edge-fill" d="M400.0 270.0L412.9 273.5L410.6 261.8Z" fill="#64748b" />
</svg>
