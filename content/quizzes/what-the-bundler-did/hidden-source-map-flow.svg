<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --app-fill: #dbeafe;
      --app-stroke: #2563eb;
      --vendor-fill: #fef3c7;
      --vendor-stroke: #b45309;
      --bad-fill: #fee2e2;
      --bad-stroke: #b91c1c;
      --good-fill: #dcfce7;
      --good-stroke: #15803d;
      --ghost-fill: #eef1f5;
      --ghost-stroke: #b6c0cc;
      --ghost-text: #8a96a6;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --app-fill: #1e3a5f;
        --app-stroke: #60a5fa;
        --vendor-fill: #4a3512;
        --vendor-stroke: #f59e0b;
        --bad-fill: #4c1d1d;
        --bad-stroke: #f87171;
        --good-fill: #14391f;
        --good-stroke: #4ade80;
        --ghost-fill: #20252d;
        --ghost-stroke: #3f4855;
        --ghost-text: #6b7686;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .edge-fill { fill: var(--edge); }
    .card { fill: var(--card); stroke: var(--edge); }
    .app { fill: var(--app-fill); stroke: var(--app-stroke); }
    .app-line { stroke: var(--app-stroke); }
    .app-head { fill: var(--app-stroke); }
    .vendor { fill: var(--vendor-fill); stroke: var(--vendor-stroke); }
    .vendor-line { stroke: var(--vendor-stroke); }
    .vendor-head { fill: var(--vendor-stroke); }
    .bad { fill: var(--bad-fill); stroke: var(--bad-stroke); }
    .bad-line { stroke: var(--bad-stroke); }
    .bad-head { fill: var(--bad-stroke); }
    .good { fill: var(--good-fill); stroke: var(--good-stroke); }
    .good-line { stroke: var(--good-stroke); }
    .good-head { fill: var(--good-stroke); }
    .ghost { fill: var(--ghost-fill); stroke: var(--ghost-stroke); }
    .ghost-line { stroke: var(--ghost-stroke); }
    .ghost-head { fill: var(--ghost-stroke); }
    .ghost-text { fill: var(--ghost-text); }
    .bad-text { fill: var(--bad-stroke); }
    .good-text { fill: var(--good-stroke); }
  </style>

  <rect class="panel" width="720" height="330" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700" text-anchor="start">Hidden source maps: readable stack traces, private source</text>
  <rect class="card" x="36" y="120" width="160" height="60" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="116.0" y="147.0" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">build</text>
  <text class="muted" x="116.0" y="167.0" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">sourcemap: &#x27;hidden&#x27;</text>
  <rect class="app" x="270" y="80" width="200" height="56" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="title" x="370.0" y="105.0" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">app-8d1f.js</text>
  <text class="muted" x="370.0" y="125.0" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">no sourceMappingURL</text>
  <rect class="vendor" x="270" y="176" width="200" height="56" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
  <text class="title" x="370.0" y="201.0" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" text-anchor="middle">app-8d1f.js.map</text>
  <text class="muted" x="370.0" y="221.0" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">sources + sourcesContent</text>
  <rect class="good" x="530" y="80" width="154" height="56" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2" />
  <text class="title" x="607.0" y="105.0" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">CDN</text>
  <text class="muted" x="607.0" y="125.0" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">public</text>
  <rect class="good" x="530" y="176" width="154" height="56" rx="10" fill="#dcfce7" stroke="#15803d" stroke-width="2" />
  <text class="title" x="607.0" y="201.0" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">error tracker</text>
  <text class="muted" x="607.0" y="221.0" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">private upload</text>
  <path class="edge" d="M196.0 140.0L260.8 112.0" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <path class="edge-fill" d="M270.0 108.0L256.6 107.3L261.4 118.3Z" fill="#64748b" />
  <path class="edge" d="M196.0 160.0L261.4 198.9" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <path class="edge-fill" d="M270.0 204.0L262.8 192.7L256.6 203.0Z" fill="#64748b" />
  <path class="edge" d="M470.0 108.0L520.0 108.0" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <path class="edge-fill" d="M530.0 108.0L518.0 102.0L518.0 114.0Z" fill="#64748b" />
  <path class="edge" d="M470.0 204.0L520.0 204.0" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" />
  <path class="edge-fill" d="M530.0 204.0L518.0 198.0L518.0 210.0Z" fill="#64748b" />
  <text class="muted" x="36" y="280" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">The .map is uploaded, then deleted from dist/ before deploy. Users get minified code;</text>
  <text class="muted" x="36" y="298" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">the tracker matches incoming stack frames to the uploaded map by release.</text>
</svg>
