  <text class="accent-text" x="36" y="118" fill="#9a3412" font-family="system-ui, sans-serif" font-size="13" font-weight="700">15 calls</text>
  <text class="info-text" x="36" y="136" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700">6 distinct</text>
  <text class="muted" x="36" y="158" fill="#526173" font-family="system-ui, sans-serif" font-size="11">fib(40) is</text>
  <text class="muted" x="36" y="174" fill="#526173" font-family="system-ui, sans-serif" font-size="11">over 300</text>
  <text class="muted" x="36" y="190" fill="#526173" font-family="system-ui, sans-serif" font-size="11">million calls</text>
  <rect class="info-box" x="36" y="340" width="316" height="168" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="54" y="366" fill="#172554" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Top-down memoisation</text>
  <text class="info-text" x="54" y="388" fill="#172554" font-family="system-ui, sans-serif" font-size="12">Same recursion, plus a cache. Each of the six</text>
  <text class="info-text" x="54" y="406" fill="#172554" font-family="system-ui, sans-serif" font-size="12">distinct n is computed once; the nine orange</text>
  <text class="info-text" x="54" y="424" fill="#172554" font-family="system-ui, sans-serif" font-size="12">nodes above become instant lookups.</text>
  <text class="info-text" x="54" y="458" fill="#172554" font-family="system-ui, sans-serif" font-size="12">Only the subproblems actually reached get filled</text>
  <text class="info-text" x="54" y="476" fill="#172554" font-family="system-ui, sans-serif" font-size="12">but the recursion depth is still a real stack.</text>
  <rect class="good-box" x="368" y="340" width="316" height="168" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="386" y="366" fill="#14532d" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Bottom-up tabulation</text>
  <text class="good-text" x="386" y="388" fill="#14532d" font-family="system-ui, sans-serif" font-size="12">Fill the same table left to right, no recursion.</text>
  <text class="good-text" x="386" y="406" fill="#14532d" font-family="system-ui, sans-serif" font-size="12">Climbing 5 stairs 1 or 2 at a time is this exact</text>
  <text class="good-text" x="386" y="424" fill="#14532d" font-family="system-ui, sans-serif" font-size="12">recurrence: ways(n) = ways(n−1) + ways(n−2).</text>
