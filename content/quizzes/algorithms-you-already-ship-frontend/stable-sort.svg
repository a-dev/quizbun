<svg xmlns="http://www.w3.org/2000/svg" width="720" height="470" viewBox="0 0 720 470">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
  </style>
  <rect class="panel" width="720" height="470" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Stability is what makes a second sort keep the first one</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Four rows, sorted by Name, then re-sorted by Date. Only a stable sort leaves the ties alone.</text>
  <text class="muted" x="36" y="100" fill="#526173" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">1 · sorted by Name</text>
  <rect class="card" x="36" y="112" width="192" height="32" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="title" x="50" y="133" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Ana</text>
  <text class="muted" x="214" y="133" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end">Mar 3</text>
  <rect class="card" x="36" y="150" width="192" height="32" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="title" x="50" y="171" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Bo</text>
  <text class="muted" x="214" y="171" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end">Mar 1</text>
  <rect class="card" x="36" y="188" width="192" height="32" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="title" x="50" y="209" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Cy</text>
  <text class="muted" x="214" y="209" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end">Mar 3</text>
  <rect class="card" x="36" y="226" width="192" height="32" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="title" x="50" y="247" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Dee</text>
  <text class="muted" x="214" y="247" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end">Mar 1</text>
  <text class="good-text" x="264" y="100" fill="#14532d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">2 · then by Date — stable</text>
  <rect class="good-box" x="264" y="112" width="192" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="278" y="133" fill="#14532d" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Bo</text>
  <text class="good-text" x="442" y="133" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end">Mar 1</text>
  <rect class="good-box" x="264" y="150" width="192" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="278" y="171" fill="#14532d" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Dee</text>
  <text class="good-text" x="442" y="171" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end">Mar 1</text>
  <rect class="good-box" x="264" y="188" width="192" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="278" y="209" fill="#14532d" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Ana</text>
  <text class="good-text" x="442" y="209" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end">Mar 3</text>
  <rect class="good-box" x="264" y="226" width="192" height="32" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="278" y="247" fill="#14532d" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Cy</text>
  <text class="good-text" x="442" y="247" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end">Mar 3</text>
  <text class="accent-text" x="492" y="100" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">2 · then by Date — unstable</text>
  <rect class="accent-box" x="492" y="112" width="192" height="32" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="506" y="133" fill="#9a3412" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Dee</text>
  <text class="accent-text" x="670" y="133" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end">Mar 1</text>
  <rect class="accent-box" x="492" y="150" width="192" height="32" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="506" y="171" fill="#9a3412" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Bo</text>
  <text class="accent-text" x="670" y="171" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end">Mar 1</text>
  <rect class="accent-box" x="492" y="188" width="192" height="32" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="506" y="209" fill="#9a3412" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Cy</text>
  <text class="accent-text" x="670" y="209" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end">Mar 3</text>
  <rect class="accent-box" x="492" y="226" width="192" height="32" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="506" y="247" fill="#9a3412" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Ana</text>
  <text class="accent-text" x="670" y="247" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" text-anchor="end">Mar 3</text>
  <text class="good-text" x="360" y="292" fill="#14532d" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">name order kept inside each date</text>
  <text class="accent-text" x="588" y="292" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">ties scrambled — Dee before Bo</text>
  <rect class="card" x="36" y="308" width="648" height="140" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="334" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">What the sort contract does and does not promise</text>
  <text class="muted" x="54" y="358" fill="#526173" font-family="system-ui, sans-serif" font-size="12">ES2019 requires the property — elements that compare equal keep their input order — not an algorithm. V8 uses TimSort.</text>
  <rect class="info-box" x="54" y="372" width="612" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="70" y="396" fill="#172554" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">A comparator must return a number: negative, zero, positive.</text>
  <text class="info-text" x="70" y="418" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">(a, b) =&gt; a &lt; b</text>
  <text class="info-text" x="192" y="418" fill="#172554" font-family="system-ui, sans-serif" font-size="12">returns a boolean that coerces to 0 or 1, so it can never say “a first”.</text>
</svg>
