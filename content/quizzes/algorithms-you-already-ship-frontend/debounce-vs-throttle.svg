<svg xmlns="http://www.w3.org/2000/svg" width="720" height="474" viewBox="0 0 720 474">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --grid: #d5dce6;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --grid: #333c49;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .good-text { fill: var(--good-text); }
    .grid-line { stroke: var(--grid); }
    .dead-line { stroke: var(--dead-text); }
  </style>
  <rect class="panel" width="720" height="474" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Debounce waits for quiet; throttle caps the rate</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">One burst of events, two schedulers. Thin ticks are events; filled marks are the calls that actually run.</text>
  <text class="muted" x="36" y="124" fill="#526173" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">every event</text>
  <text class="dead-text" x="36" y="144" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="11">10 events</text>
  <path class="grid-line" d="M152,120 H668" fill="none" stroke="#d5dce6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M152,113 V127" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M177.8,113 V127" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M203.6,113 V127" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M229.4,113 V127" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M255.2,113 V127" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M281,113 V127" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M306.8,113 V127" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M496,113 V127" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M521.8,113 V127" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M547.6,113 V127" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="152" y="152" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">ten keystrokes: a fast burst, a pause, a shorter burst</text>
  <text class="good-text" x="36" y="200" fill="#14532d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">debounce(200)</text>
  <text class="good-text" x="36" y="220" fill="#14532d" font-family="system-ui, sans-serif" font-size="11">2 calls</text>
  <path class="grid-line" d="M152,196 H668" fill="none" stroke="#d5dce6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M152,189 V203" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M177.8,189 V203" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M203.6,189 V203" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M229.4,189 V203" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M255.2,189 V203" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M281,189 V203" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M306.8,189 V203" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M496,189 V203" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M521.8,189 V203" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M547.6,189 V203" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect class="good-box" x="387.8" y="182" width="10" height="28" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <rect class="good-box" x="628.6" y="182" width="10" height="28" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="muted" x="152" y="228" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">one call, 200 ms after each burst goes quiet — nothing during it</text>
  <text class="info-text" x="36" y="276" fill="#172554" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">throttle(150)</text>
  <text class="info-text" x="36" y="296" fill="#172554" font-family="system-ui, sans-serif" font-size="11">4 calls</text>
  <path class="grid-line" d="M152,272 H668" fill="none" stroke="#d5dce6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M152,265 V279" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M177.8,265 V279" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M203.6,265 V279" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M229.4,265 V279" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M255.2,265 V279" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M281,265 V279" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M306.8,265 V279" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M496,265 V279" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M521.8,265 V279" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="dead-line" d="M547.6,265 V279" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect class="info-box" x="147" y="258" width="10" height="28" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <rect class="info-box" x="224.4" y="258" width="10" height="28" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <rect class="info-box" x="301.8" y="258" width="10" height="28" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <rect class="info-box" x="491" y="258" width="10" height="28" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="muted" x="152" y="304" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">at most one call per 150 ms — steady output while the burst runs</text>
  <text class="dead-text" x="152" y="334" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">0</text>
  <text class="dead-text" x="324" y="334" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">400</text>
  <text class="dead-text" x="496" y="334" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">800</text>
  <text class="dead-text" x="668" y="334" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="end">1200 ms</text>
  <rect class="good-box" x="36" y="350" width="316" height="96" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="54" y="376" fill="#14532d" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Debounce: only the settled value matters</text>
  <text class="good-text" x="54" y="400" fill="#14532d" font-family="system-ui, sans-serif" font-size="12">Search-as-you-type, autosave a draft, validate</text>
  <text class="good-text" x="54" y="418" fill="#14532d" font-family="system-ui, sans-serif" font-size="12">a field after typing stops, react to a window</text>
  <text class="good-text" x="54" y="436" fill="#14532d" font-family="system-ui, sans-serif" font-size="12">resize once it has finished.</text>
  <rect class="info-box" x="368" y="350" width="316" height="96" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="386" y="376" fill="#172554" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Throttle: the stream must keep flowing</text>
  <text class="info-text" x="386" y="400" fill="#172554" font-family="system-ui, sans-serif" font-size="12">Scroll position, mousemove and drag updates,</text>
  <text class="info-text" x="386" y="418" fill="#172554" font-family="system-ui, sans-serif" font-size="12">infinite-scroll checks, analytics pings — steady</text>
  <text class="info-text" x="386" y="436" fill="#172554" font-family="system-ui, sans-serif" font-size="12">output, never a silent gap.</text>
</svg>
