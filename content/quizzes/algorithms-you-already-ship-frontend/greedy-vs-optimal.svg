<svg xmlns="http://www.w3.org/2000/svg" width="720" height="548" viewBox="0 0 720 548">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-text: #8a97a8;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-text: #6b7787;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .dead-line { stroke: var(--dead-text); }
  </style>
  <rect class="panel" width="720" height="548" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Greedy fills each line and never looks back</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">The same ten words in the same column. Bars are words; the dashed rule is the right margin.</text>
  <text class="accent-text" x="54" y="100" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Greedy first-fit: what browsers do by default</text>
  <path class="dead-line" d="M294,112 V242" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" />
  <rect class="accent-box" x="54" y="118" width="90" height="13" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <rect class="accent-box" x="150" y="118" width="60" height="13" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <rect class="accent-box" x="54" y="144" width="80" height="13" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <rect class="accent-box" x="140" y="144" width="70" height="13" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <rect class="accent-box" x="54" y="170" width="100" height="13" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <rect class="accent-box" x="160" y="170" width="55" height="13" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <rect class="accent-box" x="54" y="196" width="85" height="13" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <rect class="accent-box" x="145" y="196" width="65" height="13" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <rect class="accent-box" x="216" y="196" width="75" height="13" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <rect class="accent-box" x="54" y="222" width="95" height="13" rx="4" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="muted" x="54" y="268" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">right edge: 156, 156, 161, 237, 95</text>
  <text class="muted" x="54" y="292" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">Fill until the next word overflows, break, repeat.</text>
  <text class="muted" x="54" y="310" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">One pass, and an earlier break is never revisited,</text>
  <text class="muted" x="54" y="328" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">so the fourth line crams three words and the fifth</text>
  <text class="muted" x="54" y="346" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">is left holding one.</text>
  <text class="good-text" x="394" y="100" fill="#14532d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Knuth-Plass: lowest total badness</text>
  <path class="dead-line" d="M634,112 V242" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" />
  <rect class="good-box" x="394" y="118" width="90" height="13" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <rect class="good-box" x="490" y="118" width="60" height="13" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <rect class="good-box" x="394" y="144" width="80" height="13" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <rect class="good-box" x="480" y="144" width="70" height="13" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <rect class="good-box" x="394" y="170" width="100" height="13" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <rect class="good-box" x="500" y="170" width="55" height="13" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <rect class="good-box" x="394" y="196" width="85" height="13" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <rect class="good-box" x="485" y="196" width="65" height="13" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <rect class="good-box" x="394" y="222" width="75" height="13" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <rect class="good-box" x="475" y="222" width="95" height="13" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="muted" x="394" y="268" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">right edge: 156, 156, 161, 156, 176</text>
  <text class="muted" x="394" y="292" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">Score every candidate line by how far its spaces must</text>
  <text class="muted" x="394" y="310" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">stretch, add penalties for hyphens and short last lines,</text>
  <text class="muted" x="394" y="328" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">then run dynamic programming over all break points.</text>
  <text class="muted" x="394" y="346" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">A worse fourth line buys a better paragraph.</text>
  <rect class="card" x="36" y="376" width="648" height="152" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="402" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700">What the web actually ships</text>
  <text class="info-text" x="54" y="428" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">text-wrap: pretty</text>
  <text class="muted" x="190" y="428" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">in Chrome reworks only the final lines to kill orphans, not the whole</text>
  <text class="muted" x="54" y="446" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">paragraph, and other engines do it differently.</text>
  <text class="info-text" x="54" y="472" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">text-wrap: balance</text>
  <text class="muted" x="200" y="472" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">evens out line lengths in short blocks such as headings.</text>
  <text class="muted" x="54" y="498" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">Greedy is everywhere in CSS layout: flexbox divides free space in one proportional pass; Grid auto-placement</text>
  <text class="muted" x="54" y="514" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">drops each item into the next free slot in order. Fast and deterministic, not always the best arrangement.</text>
</svg>
