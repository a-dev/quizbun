  <text class="title" x="54" y="426" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Why the pass is linear</text>
  <text class="muted" x="54" y="450" fill="#526173" font-family="system-ui, sans-serif" font-size="12">left and right each only ever move forward, so</text>
  <text class="muted" x="54" y="468" fill="#526173" font-family="system-ui, sans-serif" font-size="12">every index enters and leaves once: 2n moves.</text>
  <text class="muted" x="54" y="492" fill="#526173" font-family="system-ui, sans-serif" font-size="12">Testing every substring instead is O(n²) windows</text>
  <text class="muted" x="54" y="508" fill="#526173" font-family="system-ui, sans-serif" font-size="12">times O(n) to check each one.</text>
  <rect class="info-box" x="368" y="400" width="316" height="116" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="386" y="426" fill="#172554" font-family="system-ui, sans-serif" font-size="14" font-weight="700">When a window works, and when it does not</text>
  <text class="info-text" x="386" y="450" fill="#172554" font-family="system-ui, sans-serif" font-size="12">Works: longest substring without repeats, max sum</text>
  <text class="info-text" x="386" y="468" fill="#172554" font-family="system-ui, sans-serif" font-size="12">of k consecutive items, smallest subarray whose sum</text>
  <text class="info-text" x="386" y="486" fill="#172554" font-family="system-ui, sans-serif" font-size="12">reaches a target with all-positive numbers.</text>
  <text class="info-text" x="386" y="508" fill="#172554" font-family="system-ui, sans-serif" font-size="12">Not: any two elements anywhere in unsorted data.</text>
