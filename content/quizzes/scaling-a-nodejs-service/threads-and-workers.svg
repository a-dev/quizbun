<svg xmlns="http://www.w3.org/2000/svg" width="720" height="514" viewBox="0 0 720 514">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --sub: #e9edf4;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --sub: #222834;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .sub { fill: var(--sub); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <rect class="panel" width="720" height="514" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    One loop, and the threads around it
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    "Single-threaded" describes your JavaScript, not the rest of the process.
  </text>

  <rect class="sub" x="36" y="88" width="648" height="204" rx="14" fill="#e9edf4" />

  <g font-family="system-ui, sans-serif">
    <text class="muted" x="52" y="110" fill="#526173" font-size="12" font-weight="700">ONE NODE PROCESS</text>

    <rect class="info-box" x="52" y="120" width="616" height="52" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="360" y="142" fill="#172554" font-size="15" font-weight="700" text-anchor="middle">main thread</text>
    <text class="info-text" x="360" y="161" fill="#172554" font-size="11.5" text-anchor="middle">your JavaScript and the event loop, exactly one of each</text>

    <text class="muted" x="52" y="196" fill="#526173" font-size="12.5" font-weight="700">libuv thread pool: four threads unless <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">UV_THREADPOOL_SIZE</tspan> says otherwise</text>

    <g text-anchor="middle">
      <rect class="card" x="52" y="204" width="145" height="44" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="124" y="231" fill="#20242c" font-size="13" font-weight="700">pool thread 1</text>
      <rect class="card" x="209" y="204" width="145" height="44" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="281" y="231" fill="#20242c" font-size="13" font-weight="700">pool thread 2</text>
      <rect class="card" x="366" y="204" width="145" height="44" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="438" y="231" fill="#20242c" font-size="13" font-weight="700">pool thread 3</text>
      <rect class="card" x="523" y="204" width="145" height="44" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="595" y="231" fill="#20242c" font-size="13" font-weight="700">pool thread 4</text>
    </g>

    <text class="muted" x="52" y="272" fill="#526173" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">fs</tspan>, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">crypto</tspan>, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">dns</tspan> and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">zlib</tspan> are offloaded here. Your own JavaScript never is.</text>

    <rect class="accent-box" x="36" y="308" width="648" height="58" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="52" y="332" fill="#9a3412" font-size="13" font-weight="700">So a synchronous <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">for</tspan> loop over 5e9 iterations holds the one thread that runs handlers.</text>
    <text class="accent-text" x="52" y="352" fill="#9a3412" font-size="13" font-weight="700">Every other request queues behind it, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/health</tspan> included.</text>

    <rect class="card" x="36" y="382" width="316" height="88" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="406" fill="#20242c" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cluster</text>
    <text class="muted" x="52" y="426" fill="#526173" font-size="11.5">separate processes, separate memory</text>
    <text class="muted" x="52" y="443" fill="#526173" font-size="11.5">all of them share one listening port</text>
    <text class="muted" x="52" y="460" fill="#526173" font-size="11.5">they talk by message passing, not variables</text>

    <rect class="card" x="368" y="382" width="316" height="88" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="384" y="406" fill="#20242c" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">worker_threads</text>
    <text class="muted" x="384" y="426" fill="#526173" font-size="11.5">one process, several threads</text>
    <text class="muted" x="384" y="443" fill="#526173" font-size="11.5">each thread gets its own event loop</text>
    <text class="muted" x="384" y="460" fill="#526173" font-size="11.5">memory can be shared, via SharedArrayBuffer</text>

    <text class="muted" x="36" y="494" fill="#526173" font-size="12.5">On Linux, <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">cluster</tspan> defaults to round-robin: the primary accepts each connection and hands it to a worker.</text>
  </g>
</svg>
