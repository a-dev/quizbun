<svg xmlns="http://www.w3.org/2000/svg" width="720" height="554" viewBox="0 0 720 554">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <rect class="panel" width="720" height="554" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    From SIGTERM to a clean exit
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    The orchestrator sends one signal, waits out the grace period, then force-kills. Order matters.
  </text>

  <g font-family="system-ui, sans-serif">
    <rect class="card" x="36" y="88" width="648" height="56" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <circle class="card" cx="66" cy="116" r="15" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="66" y="121" fill="#20242c" font-size="14" font-weight="700" text-anchor="middle">1</text>
    <text class="title" x="96" y="113" fill="#20242c" font-size="14" font-weight="700">SIGTERM arrives</text>
    <text class="muted" x="96" y="132" fill="#526173" font-size="11.5">not SIGINT, and never SIGKILL — SIGKILL cannot be handled at all</text>
    <rect class="card" x="36" y="156" width="648" height="56" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <circle class="card" cx="66" cy="184" r="15" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="66" y="189" fill="#20242c" font-size="14" font-weight="700" text-anchor="middle">2</text>
    <text class="title" x="96" y="181" fill="#20242c" font-size="14" font-weight="700">Fail the readiness probe first</text>
    <text class="muted" x="96" y="200" fill="#526173" font-size="11.5">the Service drops this Pod from its endpoints, so new traffic stops arriving</text>
    <rect class="card" x="36" y="224" width="648" height="56" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <circle class="card" cx="66" cy="252" r="15" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="66" y="257" fill="#20242c" font-size="14" font-weight="700" text-anchor="middle">3</text>
    <text class="title" x="96" y="249" fill="#20242c" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">server.close()</text>
    <text class="muted" x="96" y="268" fill="#526173" font-size="11.5">stop accepting new connections; requests already in flight run to completion</text>
    <rect class="accent-box" x="36" y="292" width="648" height="56" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <circle class="accent-box" cx="66" cy="320" r="15" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="66" y="325" fill="#9a3412" font-size="14" font-weight="700" text-anchor="middle">4</text>
    <text class="accent-text" x="96" y="317" fill="#9a3412" font-size="14" font-weight="700">Cut the idle keep-alive sockets</text>
    <text class="accent-text" x="96" y="336" fill="#9a3412" font-size="11.5">server.close() waits for every socket to end — and an idle keep-alive socket never does</text>
    <rect class="card" x="36" y="360" width="648" height="56" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <circle class="card" cx="66" cy="388" r="15" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="66" y="393" fill="#20242c" font-size="14" font-weight="700" text-anchor="middle">5</text>
    <text class="title" x="96" y="385" fill="#20242c" font-size="14" font-weight="700">Release everything else, then exit 0</text>
    <text class="muted" x="96" y="404" fill="#526173" font-size="11.5">drain database pools and queues, and finish before the grace period expires</text>
    <text class="title" x="36" y="446" fill="#20242c" font-size="15" font-weight="700">The two probes are not interchangeable</text>

    <rect class="card" x="36" y="458" width="316" height="72" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="482" fill="#20242c" font-size="13.5" font-weight="700">liveness fails</text>
    <text class="muted" x="52" y="501" fill="#526173" font-size="11.5">the kubelet kills the container</text>
    <text class="muted" x="52" y="518" fill="#526173" font-size="11.5">and restarts it</text>

    <rect class="info-box" x="368" y="458" width="316" height="72" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="384" y="482" fill="#172554" font-size="13.5" font-weight="700">readiness fails</text>
    <text class="info-text" x="384" y="501" fill="#172554" font-size="11.5">the Pod keeps running, but leaves</text>
    <text class="info-text" x="384" y="518" fill="#172554" font-size="11.5">the Service's endpoint list</text>
  </g>
</svg>
