<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <style>
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --line: #64748b;
      --ice: #d4ecf8; --ice-edge: #0284c7; --water: #8ccbed; --water-edge: #0369a1;
      --rock: #c9c3b8; --rock2: #a39d91; --rock-edge: #6b6558;
      --sand: #ecd9a8; --sand-edge: #a8842f; --clay: #cfa78d; --grass: #a7d69a;
      --red: #dd8f73; --red-edge: #9a3f24; --basalt: #7b8490; --basalt-edge: #374151;
      --magma: #f3ac66; --accent: #c2410c; --accent-text: #9a3412; --blue-text: #075985;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --line: #8b9bb4;
        --ice: #24475a; --ice-edge: #38bdf8; --water: #245f85; --water-edge: #7dd3fc;
        --rock: #4f4b45; --rock2: #6a655c; --rock-edge: #b3ab9c;
        --sand: #6f6140; --sand-edge: #d8b965; --clay: #6e5244; --grass: #3d6a36;
        --red: #8a4a37; --red-edge: #f0a58a; --basalt: #515a66; --basalt-edge: #c7cfdb;
        --magma: #b2652a; --accent: #fb923c; --accent-text: #fdba74; --blue-text: #7dd3fc;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); font-weight: 700; font-size: 19px; }
    .label { fill: var(--title); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 13px; }
    .strong { font-weight: 700; }
    .accent-text { fill: var(--accent-text); }
    .blue-text { fill: var(--blue-text); }
    .line { stroke: var(--line); fill: none; stroke-width: 2; }
    .dash { stroke: var(--line); fill: none; stroke-width: 2; stroke-dasharray: 6 5; }
    .arrow { stroke: var(--accent); fill: none; stroke-width: 3; }
    .arrow-head { fill: var(--accent); }
    .flow { stroke: var(--ice-edge); fill: none; stroke-width: 3; }
    .flow-head { fill: var(--ice-edge); }
    .ice { fill: var(--ice); stroke: var(--ice-edge); stroke-width: 2; }
    .water { fill: var(--water); stroke: var(--water-edge); stroke-width: 1.5; }
    .rock { fill: var(--rock); stroke: var(--rock-edge); stroke-width: 1.5; }
    .rock2 { fill: var(--rock2); stroke: var(--rock-edge); stroke-width: 1.5; }
    .sand { fill: var(--sand); stroke: var(--sand-edge); stroke-width: 1.5; }
    .clay { fill: var(--clay); stroke: var(--rock-edge); stroke-width: 1.5; }
    .grass { fill: var(--grass); stroke: var(--rock-edge); stroke-width: 1; }
    .red { fill: var(--red); stroke: var(--red-edge); stroke-width: 1.5; }
    .basalt { fill: var(--basalt); stroke: var(--basalt-edge); stroke-width: 2; }
    .magma { fill: var(--magma); stroke: var(--accent); stroke-width: 1.5; }
    .seam { stroke: var(--rock-edge); fill: none; stroke-width: 1.2; }
    .red-seam { stroke: var(--red-edge); fill: none; stroke-width: 1.2; }
    .sand-seam { stroke: var(--sand-edge); fill: none; stroke-width: 1.2; }
    .accent-line { stroke: var(--accent); fill: none; stroke-width: 3; }
  </style>
  <rect class="panel" width="720" height="400" rx="20" />
  <g font-family="system-ui, sans-serif">
    <text class="title" x="32" y="42">Four events you can read in one outcrop</text>
    <text class="label strong" x="115" y="90" text-anchor="middle">1. Layers laid flat</text>
    <path class="panel" d="M40 130 L190 130 L190 330 L40 330 Z" />
    <text class="label strong" x="280" y="90" text-anchor="middle">2. Tilted upright</text>
    <path class="panel" d="M205 130 L355 130 L355 330 L205 330 Z" />
    <text class="label strong" x="445" y="90" text-anchor="middle">3. Eroded flat</text>
    <path class="panel" d="M370 130 L520 130 L520 330 L370 330 Z" />
    <text class="label strong" x="610" y="90" text-anchor="middle">4. New layers on top</text>
    <path class="panel" d="M535 130 L685 130 L685 330 L535 330 Z" />
    <path class="rock" d="M40 230 L190 230 L190 246 L40 246 Z" />
    <path class="rock2" d="M40 246 L190 246 L190 262 L40 262 Z" />
    <path class="rock" d="M40 262 L190 262 L190 278 L40 278 Z" />
    <path class="rock2" d="M40 278 L190 278 L190 294 L40 294 Z" />
    <path class="rock" d="M40 294 L190 294 L190 310 L40 310 Z" />
    <path class="rock2" d="M40 310 L190 310 L190 326 L40 326 Z" />
    <path class="rock" d="M205 206 L220 206 L220 330 L205 330 Z" />
    <path class="rock2" d="M220 198 L235 198 L235 330 L220 330 Z" />
    <path class="rock" d="M235 190 L250 190 L250 330 L235 330 Z" />
    <path class="rock2" d="M250 182 L265 182 L265 330 L250 330 Z" />
    <path class="rock" d="M265 174 L280 174 L280 330 L265 330 Z" />
    <path class="rock2" d="M280 174 L295 174 L295 330 L280 330 Z" />
    <path class="rock" d="M295 182 L310 182 L310 330 L295 330 Z" />
    <path class="rock2" d="M310 190 L325 190 L325 330 L310 330 Z" />
    <path class="rock" d="M325 198 L340 198 L340 330 L325 330 Z" />
    <path class="rock2" d="M340 206 L355 206 L355 330 L340 330 Z" />
    <path class="rock" d="M370 250 L385 250 L385 330 L370 330 Z" />
    <path class="rock2" d="M385 250 L400 250 L400 330 L385 330 Z" />
    <path class="rock" d="M400 250 L415 250 L415 330 L400 330 Z" />
    <path class="rock2" d="M415 250 L430 250 L430 330 L415 330 Z" />
    <path class="rock" d="M430 250 L445 250 L445 330 L430 330 Z" />
    <path class="rock2" d="M445 250 L460 250 L460 330 L445 330 Z" />
    <path class="rock" d="M460 250 L475 250 L475 330 L460 330 Z" />
    <path class="rock2" d="M475 250 L490 250 L490 330 L475 330 Z" />
    <path class="rock" d="M490 250 L505 250 L505 330 L490 330 Z" />
    <path class="rock2" d="M505 250 L520 250 L520 330 L505 330 Z" />
    <path class="accent-line" d="M370 250 L520 250" />
    <path class="rock" d="M535 250 L550 250 L550 330 L535 330 Z" />
    <path class="rock2" d="M550 250 L565 250 L565 330 L550 330 Z" />
    <path class="rock" d="M565 250 L580 250 L580 330 L565 330 Z" />
    <path class="rock2" d="M580 250 L595 250 L595 330 L580 330 Z" />
    <path class="rock" d="M595 250 L610 250 L610 330 L595 330 Z" />
    <path class="rock2" d="M610 250 L625 250 L625 330 L610 330 Z" />
    <path class="rock" d="M625 250 L640 250 L640 330 L625 330 Z" />
    <path class="rock2" d="M640 250 L655 250 L655 330 L640 330 Z" />
    <path class="rock" d="M655 250 L670 250 L670 330 L655 330 Z" />
    <path class="rock2" d="M670 250 L685 250 L685 330 L670 330 Z" />
    <path class="red" d="M535 150 L685 150 L685 175 L535 175 Z" />
    <path class="red" d="M535 175 L685 175 L685 200 L535 200 Z" />
    <path class="red" d="M535 200 L685 200 L685 225 L535 225 Z" />
    <path class="red" d="M535 225 L685 225 L685 250 L535 250 Z" />
    <path class="accent-line" d="M535 250 L685 250" />
    <text class="muted accent-text" x="610" y="350" text-anchor="middle">the red line is the gap</text>
    <text class="muted" x="360" y="385" text-anchor="middle">At Siccar Point that gap spans about 65 million years.</text>
  </g>
</svg>
