<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <style>
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --line: #64748b;
      --ice: #d4ecf8; --ice-edge: #0284c7; --water: #8ccbed; --water-edge: #0369a1;
      --rock: #c9c3b8; --rock2: #a39d91; --rock-edge: #6b6558;
      --sand: #ecd9a8; --sand-edge: #a8842f; --clay: #cfa78d; --grass: #a7d69a;
      --red: #dd8f73; --red-edge: #9a3f24; --basalt: #7b8490; --basalt-edge: #374151;
      --magma: #f3ac66; --accent: #c2410c; --accent-text: #9a3412; --blue-text: #075985;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --line: #8b9bb4;
        --ice: #24475a; --ice-edge: #38bdf8; --water: #245f85; --water-edge: #7dd3fc;
        --rock: #4f4b45; --rock2: #6a655c; --rock-edge: #b3ab9c;
        --sand: #6f6140; --sand-edge: #d8b965; --clay: #6e5244; --grass: #3d6a36;
        --red: #8a4a37; --red-edge: #f0a58a; --basalt: #515a66; --basalt-edge: #c7cfdb;
        --magma: #b2652a; --accent: #fb923c; --accent-text: #fdba74; --blue-text: #7dd3fc;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); font-weight: 700; font-size: 19px; }
    .label { fill: var(--title); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 13px; }
    .strong { font-weight: 700; }
    .accent-text { fill: var(--accent-text); }
    .blue-text { fill: var(--blue-text); }
    .line { stroke: var(--line); fill: none; stroke-width: 2; }
    .dash { stroke: var(--line); fill: none; stroke-width: 2; stroke-dasharray: 6 5; }
    .arrow { stroke: var(--accent); fill: none; stroke-width: 3; }
    .arrow-head { fill: var(--accent); }
    .flow { stroke: var(--ice-edge); fill: none; stroke-width: 3; }
    .flow-head { fill: var(--ice-edge); }
    .ice { fill: var(--ice); stroke: var(--ice-edge); stroke-width: 2; }
    .water { fill: var(--water); stroke: var(--water-edge); stroke-width: 1.5; }
    .rock { fill: var(--rock); stroke: var(--rock-edge); stroke-width: 1.5; }
    .rock2 { fill: var(--rock2); stroke: var(--rock-edge); stroke-width: 1.5; }
    .sand { fill: var(--sand); stroke: var(--sand-edge); stroke-width: 1.5; }
    .clay { fill: var(--clay); stroke: var(--rock-edge); stroke-width: 1.5; }
    .grass { fill: var(--grass); stroke: var(--rock-edge); stroke-width: 1; }
    .red { fill: var(--red); stroke: var(--red-edge); stroke-width: 1.5; }
    .basalt { fill: var(--basalt); stroke: var(--basalt-edge); stroke-width: 2; }
    .magma { fill: var(--magma); stroke: var(--accent); stroke-width: 1.5; }
    .seam { stroke: var(--rock-edge); fill: none; stroke-width: 1.2; }
    .red-seam { stroke: var(--red-edge); fill: none; stroke-width: 1.2; }
    .sand-seam { stroke: var(--sand-edge); fill: none; stroke-width: 1.2; }
    .accent-line { stroke: var(--accent); fill: none; stroke-width: 3; }
  </style>
  <rect class="panel" width="720" height="400" rx="20" />
  <g font-family="system-ui, sans-serif">
    <text class="title" x="32" y="42">How a river leaves a lake behind</text>
    <text class="label strong" x="140" y="90" text-anchor="middle">1. Loop tightens</text>
    <text class="label strong" x="360" y="90" text-anchor="middle">2. Flood breaks the neck</text>
    <text class="label strong" x="580" y="90" text-anchor="middle">3. Ends silt up</text>
    <path d="M50 290 L110 290 Q60 130 140 130 Q220 130 170 290 L230 290" style="stroke: var(--water-edge); stroke-width: 18; fill: none; stroke-linecap: round" />
    <path d="M50 290 L110 290 Q60 130 140 130 Q220 130 170 290 L230 290" style="stroke: var(--water); stroke-width: 13; fill: none; stroke-linecap: round" />
    <path class="arrow" d="M118.0 250.0 L124.7 255.8" />
    <path class="arrow-head" d="M132.0 262.0 L120.4 258.9 L127.2 251.0 Z" />
    <path class="arrow" d="M162.0 250.0 L155.3 255.8" />
    <path class="arrow-head" d="M148.0 262.0 L152.8 251.0 L159.6 258.9 Z" />
    <text class="muted" x="140" y="330" text-anchor="middle">outer banks erode</text>
    <text class="muted" x="140" y="348" text-anchor="middle">toward each other</text>
    <path d="M270 290 L330 290 Q280 130 360 130 Q440 130 390 290 L450 290" style="stroke: var(--water-edge); stroke-width: 18; fill: none; stroke-linecap: round" />
    <path d="M270 290 L330 290 Q280 130 360 130 Q440 130 390 290 L450 290" style="stroke: var(--water); stroke-width: 13; fill: none; stroke-linecap: round" />
    <path d="M330 290 L390 290" style="stroke: var(--water-edge); stroke-width: 18; fill: none; stroke-linecap: round" />
    <path d="M330 290 L390 290" style="stroke: var(--water); stroke-width: 13; fill: none; stroke-linecap: round" />
    <text class="muted" x="360" y="330" text-anchor="middle">water takes the</text>
    <text class="muted" x="360" y="348" text-anchor="middle">short cut</text>
    <path d="M490 290 L670 290" style="stroke: var(--water-edge); stroke-width: 18; fill: none; stroke-linecap: round" />
    <path d="M490 290 L670 290" style="stroke: var(--water); stroke-width: 13; fill: none; stroke-linecap: round" />
    <path class="dash" d="M552 270 Q500 130 580 130 Q660 130 608 270" />
    <path d="M554 268 Q500 130 580 130 Q660 130 606 268" style="stroke: var(--water); stroke-width: 13; fill: none" />
    <path class="sand" d="M546 272 L564 272 L560 282 L550 282 Z" />
    <path class="sand" d="M598 272 L616 272 L612 282 L602 282 Z" />
    <text class="muted" x="580" y="330" text-anchor="middle">sediment seals the ends:</text>
    <text class="muted" x="580" y="348" text-anchor="middle">a crescent lake</text>
    <text class="muted" x="360" y="390" text-anchor="middle">The abandoned loop keeps the curve of the old channel.</text>
  </g>
</svg>
