<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <style>
    svg {
      --panel: #f5f7fb; --title: #20242c; --muted: #526173; --line: #64748b;
      --ice: #d4ecf8; --ice-edge: #0284c7; --water: #8ccbed; --water-edge: #0369a1;
      --rock: #c9c3b8; --rock2: #a39d91; --rock-edge: #6b6558;
      --sand: #ecd9a8; --sand-edge: #a8842f; --clay: #cfa78d; --grass: #a7d69a;
      --red: #dd8f73; --red-edge: #9a3f24; --basalt: #7b8490; --basalt-edge: #374151;
      --magma: #f3ac66; --accent: #c2410c; --accent-text: #9a3412; --blue-text: #075985;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27; --title: #e6eaf2; --muted: #9aa8bd; --line: #8b9bb4;
        --ice: #24475a; --ice-edge: #38bdf8; --water: #245f85; --water-edge: #7dd3fc;
        --rock: #4f4b45; --rock2: #6a655c; --rock-edge: #b3ab9c;
        --sand: #6f6140; --sand-edge: #d8b965; --clay: #6e5244; --grass: #3d6a36;
        --red: #8a4a37; --red-edge: #f0a58a; --basalt: #515a66; --basalt-edge: #c7cfdb;
        --magma: #b2652a; --accent: #fb923c; --accent-text: #fdba74; --blue-text: #7dd3fc;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); font-weight: 700; font-size: 19px; }
    .label { fill: var(--title); font-size: 14px; }
    .muted { fill: var(--muted); font-size: 13px; }
    .strong { font-weight: 700; }
    .accent-text { fill: var(--accent-text); }
    .blue-text { fill: var(--blue-text); }
    .line { stroke: var(--line); fill: none; stroke-width: 2; }
    .dash { stroke: var(--line); fill: none; stroke-width: 2; stroke-dasharray: 6 5; }
    .arrow { stroke: var(--accent); fill: none; stroke-width: 3; }
    .arrow-head { fill: var(--accent); }
    .flow { stroke: var(--ice-edge); fill: none; stroke-width: 3; }
    .flow-head { fill: var(--ice-edge); }
    .ice { fill: var(--ice); stroke: var(--ice-edge); stroke-width: 2; }
    .water { fill: var(--water); stroke: var(--water-edge); stroke-width: 1.5; }
    .rock { fill: var(--rock); stroke: var(--rock-edge); stroke-width: 1.5; }
    .rock2 { fill: var(--rock2); stroke: var(--rock-edge); stroke-width: 1.5; }
    .sand { fill: var(--sand); stroke: var(--sand-edge); stroke-width: 1.5; }
    .clay { fill: var(--clay); stroke: var(--rock-edge); stroke-width: 1.5; }
    .grass { fill: var(--grass); stroke: var(--rock-edge); stroke-width: 1; }
    .red { fill: var(--red); stroke: var(--red-edge); stroke-width: 1.5; }
    .basalt { fill: var(--basalt); stroke: var(--basalt-edge); stroke-width: 2; }
    .magma { fill: var(--magma); stroke: var(--accent); stroke-width: 1.5; }
    .seam { stroke: var(--rock-edge); fill: none; stroke-width: 1.2; }
    .red-seam { stroke: var(--red-edge); fill: none; stroke-width: 1.2; }
    .sand-seam { stroke: var(--sand-edge); fill: none; stroke-width: 1.2; }
    .accent-line { stroke: var(--accent); fill: none; stroke-width: 3; }
  </style>
  <rect class="panel" width="720" height="400" rx="20" />
  <g font-family="system-ui, sans-serif">
    <text class="title" x="32" y="42">Lava that cracked as it shrank</text>
    <text class="label strong" x="190" y="78" text-anchor="middle">Cooling lava flow, side view</text>
    <path class="basalt" d="M40 110 L340 110 L340 330 L40 330 Z" />
    <path class="line" d="M70 110 L70 200" />
    <path class="line" d="M70 330 L70 250" />
    <path class="line" d="M110 110 L110 200" />
    <path class="line" d="M110 330 L110 250" />
    <path class="line" d="M150 110 L150 200" />
    <path class="line" d="M150 330 L150 250" />
    <path class="line" d="M190 110 L190 200" />
    <path class="line" d="M190 330 L190 250" />
    <path class="line" d="M230 110 L230 200" />
    <path class="line" d="M230 330 L230 250" />
    <path class="line" d="M270 110 L270 200" />
    <path class="line" d="M270 330 L270 250" />
    <path class="line" d="M310 110 L310 200" />
    <path class="line" d="M310 330 L310 250" />
    <path class="dash" d="M40 225 L340 225" />
    <path class="arrow" d="M360.0 140.0 L360.0 190.4" />
    <path class="arrow-head" d="M360.0 200.0 L354.8 189.2 L365.2 189.2 Z" />
    <path class="arrow" d="M360.0 300.0 L360.0 259.6" />
    <path class="arrow-head" d="M360.0 250.0 L365.2 260.8 L354.8 260.8 Z" />
    <text class="muted" x="190" y="360" text-anchor="middle">cracks grow inward from the cold top</text>
    <text class="muted" x="190" y="378" text-anchor="middle">and base, at right angles to them</text>
    <text class="label strong" x="530" y="78" text-anchor="middle">Top view</text>
    <polygon class="basalt" points="467.7,146.0 440.0,162.0 412.3,146.0 412.3,114.0 440.0,98.0 467.7,114.0" />
    <polygon class="basalt" points="523.1,146.0 495.4,162.0 467.7,146.0 467.7,114.0 495.4,98.0 523.1,114.0" />
    <polygon class="basalt" points="578.6,146.0 550.9,162.0 523.1,146.0 523.1,114.0 550.9,98.0 578.6,114.0" />
    <polygon class="basalt" points="634.0,146.0 606.3,162.0 578.6,146.0 578.6,114.0 606.3,98.0 634.0,114.0" />
    <polygon class="basalt" points="495.4,194.0 467.7,210.0 440.0,194.0 440.0,162.0 467.7,146.0 495.4,162.0" />
    <polygon class="basalt" points="550.9,194.0 523.1,210.0 495.4,194.0 495.4,162.0 523.1,146.0 550.9,162.0" />
    <polygon class="basalt" points="606.3,194.0 578.6,210.0 550.9,194.0 550.9,162.0 578.6,146.0 606.3,162.0" />
    <polygon class="basalt" points="661.7,194.0 634.0,210.0 606.3,194.0 606.3,162.0 634.0,146.0 661.7,162.0" />
    <polygon class="basalt" points="467.7,242.0 440.0,258.0 412.3,242.0 412.3,210.0 440.0,194.0 467.7,210.0" />
    <polygon class="basalt" points="523.1,242.0 495.4,258.0 467.7,242.0 467.7,210.0 495.4,194.0 523.1,210.0" />
    <polygon class="basalt" points="578.6,242.0 550.9,258.0 523.1,242.0 523.1,210.0 550.9,194.0 578.6,210.0" />
    <polygon class="basalt" points="634.0,242.0 606.3,258.0 578.6,242.0 578.6,210.0 606.3,194.0 634.0,210.0" />
    <polygon class="basalt" points="495.4,290.0 467.7,306.0 440.0,290.0 440.0,258.0 467.7,242.0 495.4,258.0" />
    <polygon class="basalt" points="550.9,290.0 523.1,306.0 495.4,290.0 495.4,258.0 523.1,242.0 550.9,258.0" />
    <polygon class="basalt" points="606.3,290.0 578.6,306.0 550.9,290.0 550.9,258.0 578.6,242.0 606.3,258.0" />
    <polygon class="basalt" points="661.7,290.0 634.0,306.0 606.3,290.0 606.3,258.0 634.0,242.0 661.7,258.0" />
    <text class="muted" x="530" y="330" text-anchor="middle">shrinking rock splits into a network;</text>
    <text class="muted" x="530" y="348" text-anchor="middle">cracks meeting near 120° release</text>
    <text class="muted" x="530" y="366" text-anchor="middle">stress most evenly, so six sides dominate</text>
  </g>
</svg>
