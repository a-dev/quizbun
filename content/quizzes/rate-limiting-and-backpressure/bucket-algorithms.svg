<svg xmlns="http://www.w3.org/2000/svg" width="720" height="426" viewBox="0 0 720 426">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --sub: #e9edf4;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --sub: #222834;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .sub { fill: var(--sub); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .edge-line { stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-fill { fill: var(--info-fill); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
    .accent-line { stroke: var(--accent-edge); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" fill-rule="evenodd" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--accent-edge)" fill-rule="evenodd" />
    </marker>
  </defs>

  <rect class="panel" width="720" height="426" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Token bucket and leaky bucket
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Same long-run average rate. Opposite short-term shape.
  </text>

  <rect class="sub" x="36" y="80" width="312" height="258" rx="14" fill="#e9edf4" />
  <rect class="sub" x="372" y="80" width="312" height="258" rx="14" fill="#e9edf4" />

  <g fill="none" class="edge-line" stroke="#64748b" stroke-width="2">
    <path d="M192,154 L192,174" marker-end="url(#arrow)" />
    <path d="M234,222 L268,222" marker-end="url(#arrow)" />
    <path d="M506,154 L506,174" marker-end="url(#arrow)" />
    <path d="M528,154 L528,174" marker-end="url(#arrow)" />
    <path d="M550,154 L550,174" marker-end="url(#arrow)" />
    <path d="M528,264 L528,292" marker-end="url(#arrow)" />
  </g>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text class="title" x="192" y="110" fill="#20242c" font-size="16" font-weight="700">Token bucket</text>
    <text class="muted" x="192" y="128" fill="#526173" font-size="11.5">capacity 20 · refills 5 tokens per second</text>
    <text class="title" x="528" y="110" fill="#20242c" font-size="16" font-weight="700">Leaky bucket</text>
    <text class="muted" x="528" y="128" fill="#526173" font-size="11.5">a queue that drains at a fixed rate</text>

    <text class="muted" x="192" y="148" fill="#526173" font-size="11">refill +5 / s</text>
    <text class="muted" x="528" y="148" fill="#526173" font-size="11">bursty input</text>

    <rect class="card" x="150" y="178" width="84" height="86" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <g class="info-text" fill="#172554">
      <circle cx="163" cy="194" r="5" /><circle cx="180" cy="194" r="5" /><circle cx="197" cy="194" r="5" /><circle cx="214" cy="194" r="5" /><circle cx="231" cy="194" r="5" />
      <circle cx="163" cy="212" r="5" /><circle cx="180" cy="212" r="5" /><circle cx="197" cy="212" r="5" /><circle cx="214" cy="212" r="5" /><circle cx="231" cy="212" r="5" />
      <circle cx="163" cy="230" r="5" /><circle cx="180" cy="230" r="5" /><circle cx="197" cy="230" r="5" /><circle cx="214" cy="230" r="5" /><circle cx="231" cy="230" r="5" />
      <circle cx="163" cy="248" r="5" /><circle cx="180" cy="248" r="5" /><circle cx="197" cy="248" r="5" /><circle cx="214" cy="248" r="5" /><circle cx="231" cy="248" r="5" />
    </g>
    <text class="muted" x="304" y="216" fill="#526173" font-size="10.5">1 token</text>
    <text class="muted" x="304" y="232" fill="#526173" font-size="10.5">per request</text>

    <rect class="card" x="486" y="178" width="84" height="86" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <rect class="info-fill" x="490" y="212" width="76" height="48" rx="6" fill="#dbeafe" />
    <text class="muted" x="592" y="284" fill="#526173" font-size="10.5" text-anchor="start">steady drain</text>

    <text class="title" x="192" y="308" fill="#20242c" font-size="12.5" font-weight="700">Full bucket → 20 pass at once.</text>
    <text class="muted" x="192" y="326" fill="#526173" font-size="12">Then the cap is the 5 / s refill.</text>
    <text class="title" x="528" y="308" fill="#20242c" font-size="12.5" font-weight="700">Bursts are absorbed, not passed on.</text>
    <text class="muted" x="528" y="326" fill="#526173" font-size="12">Overflow past capacity is dropped.</text>
  </g>

  <g font-family="system-ui, sans-serif" text-anchor="start">
    <rect class="accent-box" x="36" y="352" width="648" height="56" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="52" y="376" fill="#9a3412" font-size="13" font-weight="700">Token bucket meters what may <tspan font-style="italic">enter</tspan>: a burst up to capacity is allowed, then the refill rate rules.</text>
    <text class="accent-text" x="52" y="396" fill="#9a3412" font-size="13" font-weight="700">Leaky bucket meters what may <tspan font-style="italic">leave</tspan>: a constant drain, so the output never bursts at all.</text>
  </g>
</svg>
