<svg xmlns="http://www.w3.org/2000/svg" width="720" height="528" viewBox="0 0 720 528">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ok-fill: #dcfce7;
      --ok-edge: #16a34a;
      --ok-text: #14532d;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ok-fill: #14321f;
        --ok-edge: #4ade80;
        --ok-text: #bbf7d0;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .edge-line { stroke: var(--edge); }
    .ok-text { fill: var(--ok-text); }
    .ok-box { fill: var(--ok-fill); stroke: var(--ok-edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-fill { fill: var(--accent-fill); }
    .accent-text { fill: var(--accent-text); }
    .accent-line { stroke: var(--accent-edge); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" fill-rule="evenodd" />
    </marker>
  </defs>

  <rect class="panel" width="720" height="528" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    What <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">pipe()</tspan> does when the destination falls behind
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">fs.createReadStream(bigFile).pipe(res)</tspan>: a fast disk, a slow client.
  </text>

  <g fill="none" class="edge-line" stroke="#64748b" stroke-width="2">
    <path d="M200,132 L240,132" marker-end="url(#arrow)" />
    <path d="M426,132 L466,132" marker-end="url(#arrow)" />
  </g>
  <g fill="none" class="accent-line" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4">
    <path d="M400,96 L400,168" />
  </g>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text class="muted" x="336" y="92" fill="#526173" font-size="11.5">the writable's internal queue: plain process memory</text>

    <rect class="card" x="36" y="100" width="164" height="64" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="118" y="126" fill="#20242c" font-size="14.5" font-weight="700">Readable</text>
    <text class="muted" x="118" y="146" fill="#526173" font-size="10.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">createReadStream(bigFile)</text>

    <rect class="card" x="246" y="100" width="180" height="64" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <rect class="accent-fill" x="250" y="104" width="146" height="56" rx="7" fill="#ffedd5" />

    <rect class="card" x="472" y="100" width="212" height="64" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="578" y="126" fill="#20242c" font-size="14.5" font-weight="700">Writable</text>
    <text class="muted" x="578" y="146" fill="#526173" font-size="11.5">the slow HTTP response</text>

    <text class="muted" x="220" y="124" fill="#526173" font-size="10" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">write</text>
    <text class="muted" x="446" y="124" fill="#526173" font-size="10">flush</text>
    <text class="accent-text" x="400" y="184" fill="#9a3412" font-size="11.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">highWaterMark</text>
  </g>

  <g font-family="system-ui, sans-serif" text-anchor="start">
    <rect class="accent-box" x="36" y="206" width="316" height="152" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="52" y="232" fill="#9a3412" font-size="14" font-weight="700">Queue at or above the mark</text>
    <text class="accent-text" x="52" y="262" fill="#9a3412" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">write(chunk) === false</text>
    <text class="accent-text" x="52" y="281" fill="#9a3412" font-size="11.5">the chunk was still accepted, it is queued</text>
    <text class="accent-text" x="52" y="313" fill="#9a3412" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">readable.pause()</text>
    <text class="accent-text" x="52" y="332" fill="#9a3412" font-size="11.5">pipe() stops pulling from the source</text>

    <rect class="ok-box" x="368" y="206" width="316" height="152" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ok-text" x="384" y="232" fill="#14532d" font-size="14" font-weight="700">Queue drained below the mark</text>
    <text class="ok-text" x="384" y="262" fill="#14532d" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">'drain'</text>
    <text class="ok-text" x="384" y="281" fill="#14532d" font-size="11.5">the one signal that writing may resume</text>
    <text class="ok-text" x="384" y="313" fill="#14532d" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">readable.resume()</text>
    <text class="ok-text" x="384" y="332" fill="#14532d" font-size="11.5">pipe() starts pulling again</text>

    <rect class="card" x="36" y="378" width="648" height="62" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="404" fill="#20242c" font-size="13" font-weight="700">Ignore the <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">false</tspan> and nothing stops: every chunk still queues, so RSS climbs until the</text>
    <text class="title" x="52" y="424" fill="#20242c" font-size="13" font-weight="700">process dies. Backpressure guards <tspan font-style="italic">memory</tspan>, not the socket, not the disk.</text>

    <rect class="info-box" x="36" y="454" width="648" height="46" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="52" y="482" fill="#172554" font-size="13"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">objectMode: true</tspan> counts objects, not bytes, so the default mark is 16 objects, not 16 KB.</text>
  </g>
</svg>
