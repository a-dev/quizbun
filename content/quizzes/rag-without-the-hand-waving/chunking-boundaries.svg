<svg xmlns="http://www.w3.org/2000/svg" width="720" height="596" viewBox="0 0 720 596">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-fill: #e8ecf3;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-fill: #20262e;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .card-box { fill: var(--card); stroke: var(--edge); }
    .dead-box { fill: var(--dead-fill); stroke: var(--edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-line { stroke: var(--accent-edge); }
    .dead-line { stroke: var(--dead-text); }
    .accent-frame { fill: none; stroke: var(--accent-edge); }
  </style>
  <rect class="panel" width="720" height="596" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">The retrieval unit decides what can be found</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Chunking is not preprocessing. It decides what a query can match.</text>
  <rect class="card-box" x="36" y="88" width="648" height="190" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="112" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Split by character count, mid-sentence</text>
  <text class="muted" x="54" y="134" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Refunds are allowed within 30 days, unless the license key has been activated.</text>
  <rect class="accent-box" x="54" y="148" width="300" height="56" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="70" y="168" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" font-weight="700">CHUNK 1: the one retrieval returns</text>
  <text class="accent-text" x="70" y="188" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Refunds are allowed within 30 days,</text>
  <rect class="dead-box" x="366" y="148" width="300" height="56" rx="10" fill="#e8ecf3" stroke="#64748b" stroke-width="2" />
  <text class="dead-text" x="382" y="168" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">CHUNK 2: never matches "can I refund?"</text>
  <text class="dead-text" x="382" y="188" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">unless the license key has been activated.</text>
  <path class="dead-line" d="M354,176 H366" fill="none" stroke="#8a97a8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" />
  <rect class="good-box" x="54" y="214" width="612" height="48" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="70" y="234" fill="#14532d" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Fix: one self-contained unit with the rule and its exception</text>
  <text class="good-text" x="70" y="252" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">Refunds are allowed within 30 days, unless the license key has been activated.</text>
  <rect class="card-box" x="36" y="290" width="648" height="120" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="316" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">One unit, one vector: the unit decides what the vector must mean</text>
  <rect class="dead-box" x="54" y="328" width="144" height="50" rx="10" fill="#e8ecf3" stroke="#64748b" stroke-width="2" />
  <text class="dead-text" x="126" y="348" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Whole document</text>
  <text class="dead-text" x="126" y="366" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">many topics, one vector</text>
  <rect class="card-box" x="210" y="328" width="144" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="282" y="348" fill="#20242c" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Section</text>
  <text class="muted" x="282" y="366" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">one theme</text>
  <rect class="info-box" x="366" y="328" width="144" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="438" y="348" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Passage</text>
  <text class="info-text" x="438" y="366" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">one point</text>
  <rect class="good-box" x="522" y="328" width="144" height="50" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="594" y="348" fill="#14532d" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Proposition</text>
  <text class="good-text" x="594" y="366" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">a self-contained fact</text>
  <text class="muted" x="54" y="398" fill="#526173" font-family="system-ui, sans-serif" font-size="10.6">Chen et al. compared all four units. Retrieval and QA results changed, but smaller was not always better.</text>
  <rect class="card-box" x="36" y="422" width="648" height="150" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="448" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Fixed-window overlap: what it buys, and what it costs</text>
  <rect class="info-box" x="54" y="458" width="160" height="24" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="62" y="474" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">chunk 1</text>
  <rect class="info-box" x="154" y="486" width="160" height="24" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="162" y="502" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">chunk 2</text>
  <rect class="info-box" x="254" y="514" width="160" height="24" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="262" y="530" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">chunk 3</text>
  <rect class="accent-frame" x="154" y="454" width="60" height="88" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4" />
  <rect class="accent-frame" x="254" y="454" width="60" height="88" rx="6" fill="none" stroke="#c2410c" stroke-width="2" stroke-dasharray="5 4" />
  <text class="accent-text" x="184" y="552" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">overlap</text>
  <text class="accent-text" x="284" y="552" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">overlap</text>
  <rect class="good-box" x="430" y="456" width="236" height="40" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="444" y="472" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">A fact on a boundary now</text>
  <text class="good-text" x="444" y="487" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">appears in both neighbours.</text>
  <rect class="accent-box" x="430" y="504" width="236" height="40" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="444" y="520" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">The same text gets indexed twice,</text>
  <text class="accent-text" x="444" y="535" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">so hits can be near-duplicates.</text>
  <text class="muted" x="54" y="566" fill="#526173" font-family="system-ui, sans-serif" font-size="10.6">Overlap does not find semantic boundaries or change the embedding dimension.</text>
</svg>
