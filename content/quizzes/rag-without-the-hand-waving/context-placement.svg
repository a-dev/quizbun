<svg xmlns="http://www.w3.org/2000/svg" width="720" height="606" viewBox="0 0 720 606">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-fill: #e8ecf3;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
      --alt-fill: #f3e8ff;
      --alt-edge: #9333ea;
      --alt-text: #581c87;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-fill: #20262e;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
        --alt-fill: #2e1d40;
        --alt-edge: #c084fc;
        --alt-text: #e9d5ff;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .alt-text { fill: var(--alt-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .alt-box { fill: var(--alt-fill); stroke: var(--alt-edge); }
    .card-box { fill: var(--card); stroke: var(--edge); }
    .dead-box { fill: var(--dead-fill); stroke: var(--edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-line { stroke: var(--accent-edge); }
    .edge-line { stroke: var(--edge); }
    .info-line { stroke: var(--info-edge); }
  </style>
  <rect class="panel" width="720" height="606" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Fitting is not using</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">The window is a capacity limit. Where a passage sits inside it is a separate question.</text>
  <rect class="card-box" x="36" y="88" width="648" height="186" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">8,192-token budget, mostly spent before the answer starts</text>
  <rect class="info-box" x="54" y="128" width="157" height="44" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="132.5" y="156" fill="#172554" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">2,100</text>
  <rect class="alt-box" x="211" y="128" width="336" height="44" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" />
  <text class="alt-text" x="379.0" y="156" fill="#581c87" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">4,500</text>
  <rect class="good-box" x="547" y="128" width="90" height="44" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="592.0" y="156" fill="#14532d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">1,200</text>
  <rect class="dead-box" x="637" y="128" width="29" height="44" rx="6" fill="#e8ecf3" stroke="#64748b" stroke-width="2" />
  <text class="info-text" x="132" y="190" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">instructions + query</text>
  <text class="alt-text" x="379" y="190" fill="#581c87" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">five chunks, 900 each</text>
  <text class="good-text" x="592" y="190" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">answer reserve</text>
  <path class="accent-line" d="M651,176 V186" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="accent-text" x="666" y="210" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">392 tokens left</text>
  <text class="title" x="54" y="236" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">2,100 + (5 × 900) + 1,200 = 7,800   ·   8,192 − 7,800 = 392</text>
  <text class="muted" x="54" y="258" fill="#526173" font-family="system-ui, sans-serif" font-size="10.8">Every extra chunk comes from that budget. The model's own output cap can shrink it further.</text>
  <rect class="card-box" x="36" y="286" width="648" height="236" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="312" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Same tokens, different position: the Lost in the Middle result</text>
  <text class="muted" x="54" y="332" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">accuracy</text>
  <path class="edge-line" d="M82,336 V452 H380" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="info-line" d="M90,355 L160,413 L230,433 L300,413 L370,375" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle class="accent-box" cx="230" cy="433" r="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2.5" />
  <text class="muted" x="90" y="468" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">first</text>
  <text class="accent-text" x="230" y="468" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">middle</text>
  <text class="muted" x="370" y="468" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">last</text>
  <text class="muted" x="230" y="486" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">position of the relevant passage among 20</text>
  <rect class="card-box" x="400" y="330" width="266" height="140" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="416" y="352" fill="#20242c" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">The order the model reads them in</text>
  <rect class="good-box" x="416" y="362" width="234" height="17" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="424" y="375" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" font-weight="700">chunk 1</text>
  <text class="good-text" x="642" y="375" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">read reliably</text>
  <rect class="dead-box" x="416" y="382" width="234" height="17" rx="5" fill="#e8ecf3" stroke="#64748b" stroke-width="1.5" />
  <text class="dead-text" x="424" y="395" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">chunk 2</text>
  <rect class="accent-box" x="416" y="402" width="234" height="17" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="424" y="415" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10" font-weight="700">chunk 3</text>
  <text class="accent-text" x="642" y="415" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">buried</text>
  <rect class="dead-box" x="416" y="422" width="234" height="17" rx="5" fill="#e8ecf3" stroke="#64748b" stroke-width="1.5" />
  <text class="dead-text" x="424" y="435" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">chunk 4</text>
  <rect class="good-box" x="416" y="442" width="234" height="17" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="424" y="455" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" font-weight="700">chunk 5</text>
  <text class="good-text" x="642" y="455" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">read reliably</text>
  <text class="muted" x="54" y="506" fill="#526173" font-family="system-ui, sans-serif" font-size="10.6">Liu et al. moved the evidence and changed nothing else. Position affects results, which is why reranking matters.</text>
  <rect class="accent-box" x="36" y="534" width="648" height="48" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="54" y="555" fill="#9a3412" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Fitting in the window is a capacity fact, not a promise every detail gets used.</text>
  <text class="accent-text" x="54" y="572" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11">That's how more retrieved chunks can raise recall while lowering answer quality.</text>
</svg>
