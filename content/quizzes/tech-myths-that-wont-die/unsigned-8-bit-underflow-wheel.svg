<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --card: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --card: #242b36;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .a { fill: var(--a); }
    .a-line { stroke: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .card { fill: var(--card); stroke: var(--rail); }
  </style>

  <rect class="panel" width="720" height="440" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">An unsigned 8-bit counter wraps around</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14">256 values on a ring, 0 to 255. Not to scale: most values are shown as dots.</text>
  <circle class="rail" cx="200" cy="274.0" r="120" fill="none" stroke="#94a3b8" stroke-width="2" />
  <circle class="card" cx="200.0" cy="154.0" r="19" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
  <text class="title" x="200.0" y="159.0" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">0</text>
  <circle class="a-soft" cx="245.9" cy="163.1" r="19" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="title" x="245.9" y="168.1" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1</text>
  <circle class="card" cx="284.9" cy="189.1" r="19" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
  <text class="title" x="284.9" y="194.1" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">2</text>
  <circle class="rail" cx="310.9" cy="228.1" r="3" fill="none" stroke="#94a3b8" stroke-width="2" />
  <circle class="card" cx="320.0" cy="274.0" r="19" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
  <text class="title" x="320.0" y="279.0" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">64</text>
  <circle class="rail" cx="310.9" cy="319.9" r="3" fill="none" stroke="#94a3b8" stroke-width="2" />
  <circle class="rail" cx="284.9" cy="358.9" r="3" fill="none" stroke="#94a3b8" stroke-width="2" />
  <circle class="rail" cx="245.9" cy="384.9" r="3" fill="none" stroke="#94a3b8" stroke-width="2" />
  <circle class="card" cx="200.0" cy="394.0" r="19" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
  <text class="title" x="200.0" y="399.0" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">128</text>
  <circle class="rail" cx="154.1" cy="384.9" r="3" fill="none" stroke="#94a3b8" stroke-width="2" />
  <circle class="rail" cx="115.1" cy="358.9" r="3" fill="none" stroke="#94a3b8" stroke-width="2" />
  <circle class="rail" cx="89.1" cy="319.9" r="3" fill="none" stroke="#94a3b8" stroke-width="2" />
  <circle class="card" cx="80.0" cy="274.0" r="19" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
  <text class="title" x="80.0" y="279.0" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">192</text>
  <circle class="rail" cx="89.1" cy="228.1" r="3" fill="none" stroke="#94a3b8" stroke-width="2" />
  <circle class="card" cx="115.1" cy="189.1" r="19" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
  <text class="title" x="115.1" y="194.1" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">254</text>
  <circle class="b-soft" cx="154.1" cy="163.1" r="19" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="title" x="154.1" y="168.1" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">255</text>
  <path class="b-line" d="M 243.7 126.3 A 154 154 0 0 0 158.8 125.6" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)" />
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="b" d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c" />
    </marker>
  </defs>
  <text class="b" x="200" y="106.0" fill="#c2410c" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1 − 2: two steps back</text>
  <text class="muted" x="200" y="280.0" fill="#526173" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">8 bits</text>
  <text class="muted" x="200" y="298.0" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">2⁸ = 256 values</text>
  <rect class="card" x="380" y="124.0" width="304" height="132" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
  <text class="title" x="398" y="152.0" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Unsigned 8-bit (0 to 255)</text>
  <text class="muted" x="398" y="180.0" fill="#526173" font-family="system-ui, sans-serif" font-size="14">1 − 1 = 0</text>
  <text class="muted" x="398" y="204.0" fill="#526173" font-family="system-ui, sans-serif" font-size="14">0 − 1 wraps to the top: 255</text>
  <text class="b" x="398" y="234.0" fill="#c2410c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">So 1 − 2 = 255</text>
  <rect class="card" x="380" y="272.0" width="304" height="132" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
  <text class="title" x="398" y="300.0" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Signed 8-bit (−128 to 127)</text>
  <text class="muted" x="398" y="328.0" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Same bits, read differently:</text>
  <text class="muted" x="398" y="352.0" fill="#526173" font-family="system-ui, sans-serif" font-size="14">the pattern for 255 means −1</text>
  <text class="a" x="398" y="382.0" fill="#2563eb" font-family="system-ui, sans-serif" font-size="15" font-weight="700">So 1 − 2 = −1, no surprise</text>
</svg>
