<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --card: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --card: #242b36;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .a { fill: var(--a); }
    .a-line { stroke: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .card { fill: var(--card); stroke: var(--rail); }
  </style>

  <rect class="panel" width="720" height="400" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Where 640K comes from: the IBM PC memory map</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14">The 8088 has 20 address lines: 2²⁰ bytes = 1,024 KB of addresses</text>
  <rect class="a-soft" x="36.0" y="150" width="405.0" height="70" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="title" x="238.5" y="182" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">RAM for DOS and programs</text>
  <text class="muted" x="238.5" y="202" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0–640 KB</text>
  <rect class="b-soft" x="441.0" y="150" width="81.0" height="70" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="title" x="481.5" y="182" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Video</text>
  <text class="muted" x="481.5" y="202" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">640–768</text>
  <rect class="b-soft" x="522.0" y="150" width="121.5" height="70" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="title" x="582.8" y="182" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ROMs, reserved</text>
  <text class="muted" x="582.8" y="202" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">768–960</text>
  <rect class="b-soft" x="643.5" y="150" width="40.5" height="70" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="title" x="663.8" y="182" fill="#20242c" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">BIOS</text>
  <text class="muted" x="663.8" y="202" fill="#526173" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">960+</text>
  <line class="rail" x1="36.0" y1="220" x2="36.0" y2="230" stroke="#94a3b8" stroke-width="1.5" />
  <text class="muted" x="36.0" y="248" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="start">0</text>
  <line class="rail" x1="441.0" y1="220" x2="441.0" y2="230" stroke="#94a3b8" stroke-width="1.5" />
  <text class="muted" x="441.0" y="248" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">640 KB (address A0000 hex)</text>
  <line class="rail" x1="684.0" y1="220" x2="684.0" y2="230" stroke="#94a3b8" stroke-width="1.5" />
  <text class="muted" x="684.0" y="248" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="end">1,024 KB</text>
  <line class="a-line" x1="36.0" y1="136" x2="441.0" y2="136" stroke="#2563eb" stroke-width="2" />
  <text class="a" x="238.5" y="128" fill="#2563eb" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Conventional memory: 640 KB</text>
  <line class="b-line" x1="441.0" y1="136" x2="684.0" y2="136" stroke="#c2410c" stroke-width="2" />
  <text class="b" x="562.5" y="128" fill="#c2410c" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Upper area: 384 KB</text>
  <rect class="card" x="36" y="282" width="648" height="92" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="1" />
  <text class="title" x="54" y="310" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">IBM put video memory and ROMs at the top of the address space in 1981.</text>
  <text class="title" x="54" y="334" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">Programs got the contiguous block below them, so RAM above 640 KB could not simply</text>
  <text class="title" x="54" y="356" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">extend it. A hardware design choice set the limit, not a sentence anyone said.</text>
</svg>
