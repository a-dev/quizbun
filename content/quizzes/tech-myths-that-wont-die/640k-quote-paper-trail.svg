<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --card: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --card: #242b36;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .a { fill: var(--a); }
    .a-line { stroke: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .card { fill: var(--card); stroke: var(--rail); }
  </style>

  <rect class="panel" width="720" height="440" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">The paper trail of “640K ought to be enough”</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Sources traced by Quote Investigator</text>
  <line class="rail" x1="96" y1="104" x2="96" y2="410" stroke="#94a3b8" stroke-width="2" />
  <circle class="b-soft" cx="96" cy="128" r="9" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="title" x="74" y="133" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="end">1981</text>
  <text class="b" x="122" y="133" fill="#c2410c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Supposedly said</text>
  <text class="title" x="122" y="156" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">IBM PC launches. No source from 1981 has been found.</text>
  <circle class="a-soft" cx="96" cy="202" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="title" x="74" y="207" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="end">1985</text>
  <text class="a" x="122" y="207" fill="#2563eb" font-family="system-ui, sans-serif" font-size="15" font-weight="700">First in print</text>
  <text class="title" x="122" y="230" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">InfoWorld, 29 April: a line credited to Gates about setting PC-DOS’s limit at</text>
  <text class="title" x="122" y="250" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">640K and thinking “nobody would ever need that much memory”.</text>
  <circle class="a-soft" cx="96" cy="288" r="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="title" x="74" y="293" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="end">1990</text>
  <text class="a" x="122" y="293" fill="#2563eb" font-family="system-ui, sans-serif" font-size="15" font-weight="700">The famous wording</text>
  <text class="title" x="122" y="316" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">InfoWorld, 1 January: “640K ought to be enough for anyone.”</text>
  <text class="muted" x="122" y="336" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Five years after the first version, and nine after 1981.</text>
  <circle class="b-soft" cx="96" cy="362" r="9" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="title" x="74" y="367" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="end">1996</text>
  <text class="b" x="122" y="367" fill="#c2410c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Denied</text>
  <text class="title" x="122" y="390" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">Gates, in his newspaper column: there’s “never a citation”;</text>
  <text class="muted" x="122" y="410" fill="#526173" font-family="system-ui, sans-serif" font-size="14">the line “floats like a rumor”.</text>
</svg>
