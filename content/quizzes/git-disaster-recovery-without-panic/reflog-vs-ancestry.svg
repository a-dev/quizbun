<svg xmlns="http://www.w3.org/2000/svg" width="720" height="566" viewBox="0 0 720 566">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ok-fill: #dcfce7;
      --ok-edge: #16a34a;
      --ok-text: #15803d;
      --warn-fill: #ffedd5;
      --warn-edge: #ea580c;
      --warn-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ok-fill: #14321f;
        --ok-edge: #4ade80;
        --ok-text: #86efac;
        --warn-fill: #3a2211;
        --warn-edge: #fb923c;
        --warn-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .card { fill: var(--card); stroke: var(--edge); }
    .ok-box { fill: var(--ok-fill); stroke: var(--ok-edge); }
    .ok-text { fill: var(--ok-text); }
    .warn-box { fill: var(--warn-fill); stroke: var(--warn-edge); }
    .warn-text { fill: var(--warn-text); }
  </style>

  <rect class="panel" width="720" height="566" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="44" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    HEAD@{2} vs HEAD~2: two different countdowns
  </text>
  <text class="muted" x="36" y="68" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Reflog ordinals count ref updates. Ancestry operators walk parent links.
  </text>

  <g font-family="system-ui, sans-serif">
    <text class="muted" x="36" y="98" fill="#526173" font-size="13" font-weight="700">Commit graph, HEAD's parent chain</text>

    <path class="edge" d="M90 170H610" fill="none" stroke="#64748b" stroke-width="3" />

    <rect x="480" y="100" width="60" height="24" rx="6" class="card" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="510" y="116" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">HEAD</text>
    <path class="edge" d="M510 124V144" fill="none" stroke="#64748b" stroke-width="2" />

    <path d="M510 144C450 90 320 86 234 140" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="1 0" />
    <path d="m247 132 -15 8 3 -17" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text class="ok-text" x="370" y="76" fill="#15803d" font-size="14" font-weight="700" text-anchor="middle">HEAD~2</text>

    <g text-anchor="middle">
      <circle class="card" cx="90" cy="170" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="90" y="176" fill="#20242c" font-size="16" font-weight="700">C1</text>

      <circle class="ok-box" cx="230" cy="170" r="26" fill="#dcfce7" stroke="#16a34a" stroke-width="3" />
      <text class="ok-text" x="230" y="176" fill="#15803d" font-size="16" font-weight="700">C2</text>

      <circle class="card" cx="370" cy="170" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="370" y="176" fill="#20242c" font-size="16" font-weight="700">C3</text>

      <circle class="card" cx="510" cy="170" r="26" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="510" y="176" fill="#20242c" font-size="16" font-weight="700">C4</text>

      <circle class="warn-box" cx="650" cy="170" r="26" fill="#ffedd5" stroke="#ea580c" stroke-width="3" />
      <text class="warn-text" x="650" y="176" fill="#9a3412" font-size="16" font-weight="700">X</text>
    </g>
    <text class="muted" x="650" y="216" fill="#526173" font-size="11" text-anchor="middle">different branch,</text>
    <text class="muted" x="650" y="230" fill="#526173" font-size="11" text-anchor="middle">not reachable from HEAD</text>

    <text class="muted" x="36" y="256" fill="#526173" font-size="13" font-weight="700">HEAD reflog, most recent first</text>

    <g font-size="13">
      <rect class="card" x="36" y="270" width="648" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="52" y="295" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">HEAD@{0}</text>
      <text class="muted" x="190" y="295" fill="#526173" font-size="13">commit: finish feature</text>
      <text class="title" x="610" y="295" fill="#20242c" font-weight="700" text-anchor="middle">C4</text>

      <rect class="card" x="36" y="318" width="648" height="40" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="52" y="343" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">HEAD@{1}</text>
      <text class="muted" x="190" y="343" fill="#526173" font-size="13">checkout: topic → main</text>
      <text class="muted" x="610" y="343" fill="#526173" text-anchor="middle">—</text>

      <rect class="warn-box" x="36" y="366" width="648" height="40" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="2.5" />
      <text class="title" x="52" y="391" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">HEAD@{2}</text>
      <text class="warn-text" x="190" y="391" fill="#9a3412" font-size="13" font-weight="700">commit: on topic branch</text>
      <text class="warn-text" x="610" y="391" fill="#9a3412" font-weight="700" text-anchor="middle">X</text>

      <rect class="ok-box" x="36" y="414" width="648" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
      <text class="title" x="52" y="439" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">HEAD@{3}</text>
      <text class="ok-text" x="190" y="439" fill="#15803d" font-size="13" font-weight="700">commit: add helper</text>
      <text class="ok-text" x="610" y="439" fill="#15803d" font-weight="700" text-anchor="middle">C2</text>
    </g>

    <text class="ok-text" x="36" y="478" fill="#15803d" font-size="14" font-weight="700">HEAD~2 walks two parent links from HEAD → lands on C2.</text>
    <text class="warn-text" x="36" y="500" fill="#9a3412" font-size="14" font-weight="700">HEAD@{2} is whatever HEAD pointed to two ref-updates ago, here it's X,</text>
    <text class="warn-text" x="36" y="518" fill="#9a3412" font-size="14" font-weight="700">a commit from an abandoned branch.</text>
    <text class="muted" x="36" y="542" fill="#526173" font-size="12">Same ordinal, different commit. Don't guess a reflog entry from the graph's shape.</text>
  </g>
</svg>
