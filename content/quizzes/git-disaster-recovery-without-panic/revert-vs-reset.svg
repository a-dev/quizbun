<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ok-fill: #dcfce7;
      --ok-edge: #16a34a;
      --ok-text: #15803d;
      --danger-fill: #fee2e2;
      --danger-edge: #dc2626;
      --danger-text: #b91c1c;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ok-fill: #14321f;
        --ok-edge: #4ade80;
        --ok-text: #86efac;
        --danger-fill: #3f1414;
        --danger-edge: #f87171;
        --danger-text: #fca5a5;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .card { fill: var(--card); stroke: var(--edge); }
    .ok-box { fill: var(--ok-fill); stroke: var(--ok-edge); }
    .ok-text { fill: var(--ok-text); }
    .danger-box { fill: var(--danger-fill); stroke: var(--danger-edge); }
    .danger-text { fill: var(--danger-text); }
    .ghost { fill: var(--panel); stroke: var(--muted); stroke-dasharray: 4 4; }
    .ghost-text { fill: var(--muted); }
  </style>

  <rect class="panel" width="720" height="510" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="44" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    git revert vs git reset: keep history, or move the pointer
  </text>
  <text class="muted" x="36" y="68" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Same bad commit, two different repairs.
  </text>

  <g font-family="system-ui, sans-serif">
    <text class="muted" x="36" y="96" fill="#526173" font-size="13" font-weight="700">Before</text>
    <path class="edge" d="M90 150H510" fill="none" stroke="#64748b" stroke-width="3" />
    <rect x="480" y="92" width="60" height="22" rx="6" class="card" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="510" y="107" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">main</text>
    <path class="edge" d="M510 114V126" fill="none" stroke="#64748b" stroke-width="2" />
    <g text-anchor="middle">
      <circle class="card" cx="90" cy="150" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="90" y="156" fill="#20242c" font-size="15" font-weight="700">A</text>
      <circle class="card" cx="230" cy="150" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="230" y="156" fill="#20242c" font-size="15" font-weight="700">B</text>
      <circle class="danger-box" cx="370" cy="150" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5" />
      <text class="danger-text" x="370" y="156" fill="#b91c1c" font-size="15" font-weight="700">C</text>
      <circle class="card" cx="510" cy="150" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="510" y="156" fill="#20242c" font-size="15" font-weight="700">D</text>
    </g>
    <text class="danger-text" x="370" y="196" fill="#b91c1c" font-size="12" text-anchor="middle">bad commit</text>

    <text class="muted" x="36" y="234" fill="#526173" font-size="13" font-weight="700">After: git revert C</text>
    <path class="edge" d="M90 276H650" fill="none" stroke="#64748b" stroke-width="3" />
    <rect x="620" y="218" width="60" height="22" rx="6" class="ok-box" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text class="ok-text" x="650" y="233" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">main</text>
    <path class="edge" d="M650 240V252" fill="none" stroke="#16a34a" stroke-width="2" />
    <g text-anchor="middle">
      <circle class="card" cx="90" cy="276" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="90" y="282" fill="#20242c" font-size="15" font-weight="700">A</text>
      <circle class="card" cx="230" cy="276" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="230" y="282" fill="#20242c" font-size="15" font-weight="700">B</text>
      <circle class="card" cx="370" cy="276" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="370" y="282" fill="#20242c" font-size="15" font-weight="700">C</text>
      <circle class="card" cx="510" cy="276" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="510" y="282" fill="#20242c" font-size="15" font-weight="700">D</text>
      <circle class="ok-box" cx="650" cy="276" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
      <text class="ok-text" x="650" y="282" fill="#15803d" font-size="15" font-weight="700">E</text>
    </g>
    <text class="ok-text" x="650" y="322" fill="#15803d" font-size="12" text-anchor="middle">reverts C</text>
    <text class="ok-text" x="36" y="356" fill="#15803d" font-size="13" font-weight="700">History unchanged — A, B, C, D all stay reachable. E is a new commit with the opposite change.</text>

    <text class="muted" x="36" y="394" fill="#526173" font-size="13" font-weight="700">After: git reset --hard B</text>
    <path class="edge" d="M90 436H230" fill="none" stroke="#64748b" stroke-width="3" />
    <path class="ghost" d="M230 436H510" fill="none" stroke="#9aa8bd" stroke-width="2.5" stroke-dasharray="5 5" />
    <rect x="200" y="378" width="60" height="22" rx="6" class="ok-box" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text class="ok-text" x="230" y="393" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">main</text>
    <path class="edge" d="M230 400V412" fill="none" stroke="#16a34a" stroke-width="2" />
    <g text-anchor="middle">
      <circle class="card" cx="90" cy="436" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="90" y="442" fill="#20242c" font-size="15" font-weight="700">A</text>
      <circle class="ok-box" cx="230" cy="436" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
      <text class="ok-text" x="230" y="442" fill="#15803d" font-size="15" font-weight="700">B</text>
      <circle class="ghost" cx="370" cy="436" r="24" fill="#f5f7fb" stroke="#9aa8bd" stroke-width="2" stroke-dasharray="4 4" />
      <text class="ghost-text" x="370" y="442" fill="#526173" font-size="15" font-weight="700">C</text>
      <circle class="ghost" cx="510" cy="436" r="24" fill="#f5f7fb" stroke="#9aa8bd" stroke-width="2" stroke-dasharray="4 4" />
      <text class="ghost-text" x="510" y="442" fill="#526173" font-size="15" font-weight="700">D</text>
    </g>
    <text class="danger-text" x="440" y="480" fill="#b91c1c" font-size="13" font-weight="700" text-anchor="middle">unreachable from any ref</text>
    <text class="danger-text" x="36" y="500" fill="#b91c1c" font-size="13" font-weight="700">C and D still exist as objects, but nothing points at them — only the reflog remembers.</text>
  </g>
</svg>
