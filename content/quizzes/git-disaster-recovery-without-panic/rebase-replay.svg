<svg xmlns="http://www.w3.org/2000/svg" width="720" height="566" viewBox="0 0 720 566">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ok-fill: #dcfce7;
      --ok-edge: #16a34a;
      --ok-text: #15803d;
      --accent-fill: #dbeafe;
      --accent-edge: #2563eb;
      --accent-text: #1d4ed8;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ok-fill: #14321f;
        --ok-edge: #4ade80;
        --ok-text: #86efac;
        --accent-fill: #1e2f4d;
        --accent-edge: #60a5fa;
        --accent-text: #93c5fd;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .card { fill: var(--card); stroke: var(--edge); }
    .ok-box { fill: var(--ok-fill); stroke: var(--ok-edge); }
    .ok-text { fill: var(--ok-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
    .ghost { fill: var(--panel); stroke: var(--muted); stroke-dasharray: 4 4; }
    .ghost-text { fill: var(--muted); }
  </style>

  <rect class="panel" width="720" height="566" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="44" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Rebase replays commits. It doesn't move them.
  </text>
  <text class="muted" x="36" y="68" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    The originals stay put. New copies land on the new base.
  </text>

  <g font-family="system-ui, sans-serif">
    <text class="muted" x="36" y="96" fill="#526173" font-size="13" font-weight="700">Before</text>

    <path class="edge" d="M90 140H370" fill="none" stroke="#64748b" stroke-width="3" />
    <path class="edge" d="M230 164 300 188" fill="none" stroke="#64748b" stroke-width="2.5" />
    <path class="edge" d="M300 210H440" fill="none" stroke="#64748b" stroke-width="2.5" />

    <rect x="340" y="86" width="60" height="22" rx="6" class="card" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="370" y="101" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">main</text>
    <path class="edge" d="M370 108V116" fill="none" stroke="#64748b" stroke-width="2" />

    <g text-anchor="middle">
      <circle class="card" cx="90" cy="140" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="90" y="146" fill="#20242c" font-size="15" font-weight="700">A</text>
      <circle class="card" cx="230" cy="140" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="230" y="146" fill="#20242c" font-size="15" font-weight="700">B</text>
      <circle class="card" cx="370" cy="140" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="370" y="146" fill="#20242c" font-size="15" font-weight="700">C</text>

      <circle class="accent-box" cx="300" cy="210" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
      <text class="accent-text" x="300" y="215" fill="#1d4ed8" font-size="14" font-weight="700">X</text>
      <circle class="accent-box" cx="440" cy="210" r="22" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
      <text class="accent-text" x="440" y="215" fill="#1d4ed8" font-size="14" font-weight="700">Y</text>
    </g>

    <rect x="410" y="246" width="60" height="22" rx="6" class="card" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="440" y="261" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">topic</text>
    <path class="edge" d="M440 232V246" fill="none" stroke="#64748b" stroke-width="2" />

    <text class="muted" x="36" y="298" fill="#526173" font-size="13">main is at C. topic forked from B and added X and Y.</text>

    <text class="muted" x="36" y="336" fill="#526173" font-size="13" font-weight="700">After: git rebase main (while on topic)</text>

    <path class="edge" d="M90 380H650" fill="none" stroke="#64748b" stroke-width="3" />
    <path class="ghost" d="M230 404 300 428" fill="none" stroke="#9aa8bd" stroke-width="2" stroke-dasharray="4 4" />
    <path class="ghost" d="M300 450H440" fill="none" stroke="#9aa8bd" stroke-width="2" stroke-dasharray="4 4" />

    <rect x="340" y="326" width="60" height="22" rx="6" class="card" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="370" y="341" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">main</text>
    <path class="edge" d="M370 348V356" fill="none" stroke="#64748b" stroke-width="2" />

    <rect x="620" y="326" width="60" height="22" rx="6" class="ok-box" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text class="ok-text" x="650" y="341" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">topic</text>
    <path class="edge" d="M650 348V356" fill="none" stroke="#16a34a" stroke-width="2" />

    <g text-anchor="middle">
      <circle class="card" cx="90" cy="380" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="90" y="386" fill="#20242c" font-size="15" font-weight="700">A</text>
      <circle class="card" cx="230" cy="380" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="230" y="386" fill="#20242c" font-size="15" font-weight="700">B</text>
      <circle class="card" cx="370" cy="380" r="24" fill="#ffffff" stroke="#64748b" stroke-width="2" />
      <text class="title" x="370" y="386" fill="#20242c" font-size="15" font-weight="700">C</text>
      <circle class="ok-box" cx="510" cy="380" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
      <text class="ok-text" x="510" y="386" fill="#15803d" font-size="15" font-weight="700">X'</text>
      <circle class="ok-box" cx="650" cy="380" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5" />
      <text class="ok-text" x="650" y="386" fill="#15803d" font-size="15" font-weight="700">Y'</text>

      <circle class="ghost" cx="300" cy="450" r="22" fill="#f5f7fb" stroke="#9aa8bd" stroke-width="2" stroke-dasharray="4 4" />
      <text class="ghost-text" x="300" y="455" fill="#526173" font-size="14" font-weight="700">X</text>
      <circle class="ghost" cx="440" cy="450" r="22" fill="#f5f7fb" stroke="#9aa8bd" stroke-width="2" stroke-dasharray="4 4" />
      <text class="ghost-text" x="440" y="455" fill="#526173" font-size="14" font-weight="700">Y</text>
    </g>
    <text class="ghost-text" x="370" y="494" fill="#526173" font-size="12" text-anchor="middle">orphaned, same parent B, no ref reaches them</text>

    <text class="ok-text" x="36" y="524" fill="#15803d" font-size="13" font-weight="700">X' and Y' are copies of X and Y, replayed onto C. New object IDs, new parents.</text>
    <text class="muted" x="36" y="548" fill="#526173" font-size="12">The old tip stays in the branch reflog, e.g. topic@{1}, until it expires.</text>
  </g>
</svg>
