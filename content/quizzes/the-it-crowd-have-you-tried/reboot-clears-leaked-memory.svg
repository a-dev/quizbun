<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --accent: #b45309;
      --danger: #b91c1c;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --accent: #f59e0b;
        --danger: #f87171;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .accent { fill: var(--accent); }
    .accent-stroke { stroke: var(--accent); }
    .danger-stroke { stroke: var(--danger); }
    .danger { fill: var(--danger); }
  </style>

  <rect class="panel" width="720" height="420" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Why a reboot fixes a slow computer, for a while
  </text>

  <g font-family="system-ui, sans-serif">
    <!-- Axes -->
    <path class="edge" d="M90 90V340H680" fill="none" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="40" y="215" fill="#526173" font-size="14" transform="rotate(-90 40 215)" text-anchor="middle">Memory in use</text>
    <text class="muted" x="385" y="372" fill="#526173" font-size="14" text-anchor="middle">Days of uptime</text>

    <!-- Limit line -->
    <path class="danger-stroke" d="M90 110H680" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="8 6" />
    <text class="danger" x="676" y="102" fill="#b91c1c" font-size="14" text-anchor="end">Out of memory: slowdowns, freezes, crashes</text>

    <!-- Sawtooth: leak climbs, reboot drops it -->
    <path class="accent-stroke" d="M90 300L250 190V300L410 190V300L570 160" fill="none" stroke="#b45309" stroke-width="4" stroke-linejoin="round" />

    <!-- Reboot markers -->
    <circle class="accent" cx="250" cy="300" r="6" fill="#b45309" />
    <circle class="accent" cx="410" cy="300" r="6" fill="#b45309" />
    <text class="title" x="250" y="325" fill="#20242c" font-size="14" text-anchor="middle">Reboot</text>
    <text class="title" x="410" y="325" fill="#20242c" font-size="14" text-anchor="middle">Reboot</text>

    <!-- Annotations -->
    <text class="muted" x="96" y="325" fill="#526173" font-size="14">Clean start</text>
    <text class="muted" x="100" y="160" fill="#526173" font-size="14">Leaked memory</text>
    <text class="muted" x="100" y="178" fill="#526173" font-size="14">piles up</text>
    <text class="muted" x="588" y="166" fill="#526173" font-size="14">Bug still there,</text>
    <text class="muted" x="588" y="184" fill="#526173" font-size="14">climbing again</text>
  </g>
</svg>
