<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --core: #94a3b8;
      --core-edge: #475569;
      --primary: #0284c7;
      --primary-text: #075985;
      --secondary: #c2410c;
      --secondary-text: #9a3412;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --core: #64748b;
        --core-edge: #cbd5e1;
        --primary: #38bdf8;
        --primary-text: #7dd3fc;
        --secondary: #fb923c;
        --secondary-text: #fdba74;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .core { fill: var(--core); stroke: var(--core-edge); }
    .primary { stroke: var(--primary); fill: none; }
    .secondary { stroke: var(--secondary); fill: none; }
    .primary-text { fill: var(--primary-text); }
    .secondary-text { fill: var(--secondary-text); }
    .wire { stroke: var(--edge); fill: none; }
  </style>

  <rect class="panel" width="720" height="400" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="44" fill="#20242c" font-family="system-ui, sans-serif" font-size="19" font-weight="700">
    Fewer turns on one side step the voltage down
  </text>

  <g font-family="system-ui, sans-serif">
    <!-- laminated core -->
    <rect class="core" x="300" y="90" width="70" height="230" rx="6" fill="#94a3b8" stroke="#475569" stroke-width="2" />
    <text class="muted" x="335" y="345" fill="#526173" font-size="13" text-anchor="middle">iron core</text>

    <!-- primary winding: many thin turns, left -->
    <g class="primary" stroke="#0284c7" stroke-width="3">
      <ellipse cx="300" cy="115" rx="30" ry="10" fill="none"/>
      <ellipse cx="300" cy="135" rx="30" ry="10" fill="none"/>
      <ellipse cx="300" cy="155" rx="30" ry="10" fill="none"/>
      <ellipse cx="300" cy="175" rx="30" ry="10" fill="none"/>
      <ellipse cx="300" cy="195" rx="30" ry="10" fill="none"/>
      <ellipse cx="300" cy="215" rx="30" ry="10" fill="none"/>
      <ellipse cx="300" cy="235" rx="30" ry="10" fill="none"/>
      <ellipse cx="300" cy="255" rx="30" ry="10" fill="none"/>
      <ellipse cx="300" cy="275" rx="30" ry="10" fill="none"/>
      <ellipse cx="300" cy="295" rx="30" ry="10" fill="none"/>
    </g>
    <path class="wire" d="M270 115 V72 H120" fill="none" stroke="#64748b" stroke-width="3" />
    <path class="wire" d="M270 295 V360 H120" fill="none" stroke="#64748b" stroke-width="3" />
    <text class="primary-text" x="120" y="65" fill="#075985" font-size="14" font-weight="700" text-anchor="start">high-voltage line in</text>
    <text class="primary-text" x="195" y="185" fill="#075985" font-size="14" font-weight="700" text-anchor="middle">many turns (primary)</text>

    <!-- secondary winding: few thick turns, right -->
    <g class="secondary" stroke="#c2410c" stroke-width="6">
      <ellipse cx="370" cy="150" rx="30" ry="10" fill="none"/>
      <ellipse cx="370" cy="200" rx="30" ry="10" fill="none"/>
      <ellipse cx="370" cy="250" rx="30" ry="10" fill="none"/>
    </g>
    <path class="wire" d="M400 150 V72 H600" fill="none" stroke="#64748b" stroke-width="3" />
    <path class="wire" d="M400 250 V360 H600" fill="none" stroke="#64748b" stroke-width="3" />
    <text class="secondary-text" x="600" y="65" fill="#9a3412" font-size="14" font-weight="700" text-anchor="end">low-voltage line out</text>
    <text class="secondary-text" x="490" y="205" fill="#9a3412" font-size="14" font-weight="700" text-anchor="middle">few turns (secondary)</text>

    <text class="muted" x="360" y="392" fill="#526173" font-size="13" text-anchor="middle">
      turns ratio down → voltage down, current up by the same factor
    </text>
  </g>
</svg>
