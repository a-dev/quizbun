<svg xmlns="http://www.w3.org/2000/svg" width="720" height="632" viewBox="0 0 720 632">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ok-fill: #dcfce7;
      --ok-edge: #16a34a;
      --ok-text: #14532d;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ok-fill: #14321f;
        --ok-edge: #4ade80;
        --ok-text: #bbf7d0;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .ok-box { fill: var(--ok-fill); stroke: var(--ok-edge); }
    .ok-text { fill: var(--ok-text); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <rect class="panel" width="720" height="632" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Four level names, three behaviours
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    What a stock PostgreSQL server does with each name you can type.
  </text>

  <g font-family="system-ui, sans-serif" text-anchor="start">
    <rect class="card" x="36" y="92" width="648" height="72" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" />
    <text class="muted" x="52" y="118" fill="#526173" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">READ UNCOMMITTED</text>
    <text class="muted" x="52" y="138" fill="#526173" font-size="12">Accepted for compatibility, then treated as READ COMMITTED.</text>
    <text class="muted" x="52" y="155" fill="#526173" font-size="12">PostgreSQL never shows you an uncommitted row, at any level.</text>

    <rect class="info-box" x="36" y="172" width="648" height="72" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="52" y="198" fill="#172554" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">READ COMMITTED  <tspan font-family="system-ui, sans-serif" font-size="12">, the default with plain BEGIN</tspan></text>
    <text class="info-text" x="52" y="218" fill="#172554" font-size="12">A new snapshot starts at every <tspan font-style="italic">statement</tspan>, not the transaction.</text>
    <text class="info-text" x="52" y="235" fill="#172554" font-size="12">The same query, run twice in one transaction, can return different results.</text>

    <rect class="card" x="36" y="252" width="648" height="72" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="278" fill="#20242c" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">REPEATABLE READ  <tspan font-family="system-ui, sans-serif" font-size="12" class="muted" fill="#526173">, snapshot isolation</tspan></text>
    <text class="muted" x="52" y="298" fill="#526173" font-size="12">One snapshot for the whole transaction: no dirty read, no non-repeatable read,</text>
    <text class="muted" x="52" y="315" fill="#526173" font-size="12">and no phantom. Write skew and lost update still happen.</text>

    <rect class="ok-box" x="36" y="332" width="648" height="72" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ok-text" x="52" y="358" fill="#14532d" font-size="14" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SERIALIZABLE  <tspan font-family="system-ui, sans-serif" font-size="12">, snapshot isolation plus SSI</tspan></text>
    <text class="ok-text" x="52" y="378" fill="#14532d" font-size="12">It watches running transactions for dangerous read/write patterns and</text>
    <text class="ok-text" x="52" y="395" fill="#14532d" font-size="12">aborts one, instead of taking the locks two-phase locking would.</text>

    <text class="title" x="36" y="428" fill="#20242c" font-size="13" font-weight="700">An aborted transaction is not a bug. It is the mechanism, so the client retries:</text>

    <rect class="accent-box" x="36" y="440" width="316" height="62" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="52" y="464" fill="#9a3412" font-size="13.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">40001</text>
    <text class="accent-text" x="52" y="482" fill="#9a3412" font-size="11.5">serialization_failure: could not be</text>
    <text class="accent-text" x="52" y="497" fill="#9a3412" font-size="11.5">serialized; retry the whole transaction</text>

    <rect class="accent-box" x="368" y="440" width="316" height="62" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="384" y="464" fill="#9a3412" font-size="13.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">40P01</text>
    <text class="accent-text" x="384" y="482" fill="#9a3412" font-size="11.5">deadlock_detected: a cycle of waits;</text>
    <text class="accent-text" x="384" y="497" fill="#9a3412" font-size="11.5">one side was aborted; retry that one</text>

    <rect class="card" x="36" y="516" width="648" height="92" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="540" fill="#20242c" font-size="12.5" font-weight="700">SSI only sees transactions that are SERIALIZABLE. A writer left at the default is invisible to it.</text>
    <text class="muted" x="52" y="562" fill="#526173" font-size="12.5">Elsewhere the same names mean other things: Oracle's SERIALIZABLE is snapshot isolation, not serializability,</text>
    <text class="muted" x="52" y="580" fill="#526173" font-size="12.5">and MySQL's InnoDB defaults to REPEATABLE READ, not READ COMMITTED. Read the manual, not the name.</text>
  </g>
</svg>
