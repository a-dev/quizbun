<svg xmlns="http://www.w3.org/2000/svg" width="720" height="768" viewBox="0 0 720 768">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-fill: #e8ecf3;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
      --alt-fill: #f3e8ff;
      --alt-edge: #9333ea;
      --alt-text: #581c87;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-fill: #20262e;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
        --alt-fill: #2e1d40;
        --alt-edge: #c084fc;
        --alt-text: #e9d5ff;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .dead { fill: var(--dead-fill); stroke: var(--dead-text); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .alt-box { fill: var(--alt-fill); stroke: var(--alt-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .alt-text { fill: var(--alt-text); }
    .edge-line { stroke: var(--edge); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" />
    </marker>
  </defs>
  <rect class="panel" width="720" height="768" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">The event loop: one task, then every microtask, then paint</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Three queues, different rules. The log order falls straight out of them.</text>
  <rect class="card" x="36" y="88" width="316" height="176" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Four lines, four logs</text>
  <text class="muted" x="54" y="140" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">log(1);</text>
  <text class="muted" x="54" y="162" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">setTimeout(() =&gt; log(4), 0);</text>
  <text class="muted" x="54" y="184" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Promise.resolve().then(() =&gt; log(3));</text>
  <text class="muted" x="54" y="206" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">log(2);</text>
  <text class="dead-text" x="336" y="140" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="end">log = console.log</text>
  <rect class="good-box" x="54" y="226" width="280" height="26" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="194" y="244" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">logs 1  2  3  4</text>
  <rect class="card" x="368" y="88" width="316" height="176" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="386" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Why, in three moves</text>
  <rect class="info-box" x="386" y="124" width="18" height="18" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="395" y="137" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">1</text>
  <text class="muted" x="412" y="137" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">The script is itself a task. It runs to the</text>
  <text class="muted" x="412" y="152" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">end, logging 1 then 2. The timer and the .then</text>
  <text class="muted" x="412" y="167" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">are only queued.</text>
  <rect class="info-box" x="386" y="183" width="18" height="18" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="395" y="196" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">2</text>
  <text class="muted" x="412" y="196" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">The stack empties, so the checkpoint drains</text>
  <text class="muted" x="412" y="211" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">every microtask: 3.</text>
  <rect class="info-box" x="386" y="227" width="18" height="18" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="395" y="240" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">3</text>
  <text class="muted" x="412" y="240" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Only now does the loop take one task off the</text>
  <text class="muted" x="412" y="255" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">task queue: 4.</text>
  <text class="title" x="36" y="296" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700">One iteration of the loop, left to right</text>
  <rect class="info-box" x="36" y="312" width="140" height="40" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="106" y="337" fill="#172554" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">one task</text>
  <text class="muted" x="106" y="368" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">run to completion</text>
  <rect class="accent-box" x="180" y="312" width="160" height="40" rx="9" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="260" y="337" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">microtask checkpoint</text>
  <text class="muted" x="260" y="368" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">drains to empty, new ones included</text>
  <rect class="alt-box" x="344" y="312" width="100" height="40" rx="9" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" />
  <text class="alt-text" x="394" y="337" fill="#581c87" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">rAF callbacks</text>
  <text class="muted" x="394" y="368" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">just before paint</text>
  <rect class="alt-box" x="448" y="312" width="120" height="40" rx="9" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" />
  <text class="alt-text" x="508" y="337" fill="#581c87" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">render</text>
  <text class="muted" x="508" y="368" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">style · layout · paint</text>
  <rect class="dead" x="572" y="312" width="112" height="40" rx="9" fill="#e8ecf3" stroke="#8a97a8" stroke-width="2" stroke-dasharray="4 3" />
  <text class="dead-text" x="628" y="337" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">idle time</text>
  <text class="muted" x="628" y="368" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">rIC, if any</text>
  <path class="edge-line" d="M676,362 V388 H44 V360" fill="none" stroke="#64748b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arrow)" />
  <text class="muted" x="360" y="404" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">next iteration</text>
  <rect class="info-box" x="36" y="424" width="208" height="208" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="52" y="448" fill="#172554" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Microtasks</text>
  <text class="info-text" x="52" y="468" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">Every checkpoint drains this queue</text>
  <text class="info-text" x="52" y="484" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">to empty before anything else runs.</text>
  <text class="info-text" x="52" y="516" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">.then / .catch / .finally</text>
  <text class="info-text" x="52" y="532" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">await continuations</text>
  <text class="info-text" x="52" y="548" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">queueMicrotask()</text>
  <text class="info-text" x="52" y="564" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">MutationObserver callbacks</text>
  <text class="info-text" x="52" y="596" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">In Node, process.nextTick has its</text>
  <text class="info-text" x="52" y="612" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">own queue, drained first of all.</text>
  <rect class="good-box" x="256" y="424" width="208" height="208" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="272" y="448" fill="#14532d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Tasks (macrotasks)</text>
  <text class="good-text" x="272" y="468" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5">The loop takes exactly one per</text>
  <text class="good-text" x="272" y="484" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5">iteration and runs it to the end.</text>
  <text class="good-text" x="272" y="516" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10">setTimeout / setInterval</text>
  <text class="good-text" x="272" y="532" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5">DOM events (click, input, …)</text>
  <text class="good-text" x="272" y="548" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5">I/O and network callbacks</text>
  <text class="good-text" x="272" y="564" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5">postMessage, MessageChannel</text>
  <text class="good-text" x="272" y="596" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5">In Node, setImmediate is a task</text>
  <text class="good-text" x="272" y="612" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5">in the check phase.</text>
  <rect class="card" x="476" y="424" width="208" height="208" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="muted" x="492" y="448" fill="#526173" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Neither queue</text>
  <text class="muted" x="492" y="468" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">requestAnimationFrame runs after</text>
  <text class="muted" x="492" y="484" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">the checkpoint and just before</text>
  <text class="muted" x="492" y="500" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">paint, once per frame, not once</text>
  <text class="muted" x="492" y="516" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">per task.</text>
  <text class="muted" x="492" y="548" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">requestIdleCallback runs in the</text>
  <text class="muted" x="492" y="564" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">time left at the end of a frame.</text>
  <text class="muted" x="492" y="580" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">It may wait many frames, or until</text>
  <text class="muted" x="492" y="596" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">its timeout, and can be skipped</text>
  <text class="muted" x="492" y="612" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">entirely on a busy page.</text>
  <rect class="accent-box" x="36" y="648" width="316" height="96" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="54" y="672" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">A microtask loop freezes the tab</text>
  <text class="accent-text" x="54" y="694" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">The checkpoint does not end until the queue is</text>
  <text class="accent-text" x="54" y="710" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">empty, and a microtask that queues another one</text>
  <text class="accent-text" x="54" y="726" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">never lets it. No render, no input, no next task.</text>
  <rect class="good-box" x="368" y="648" width="316" height="96" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="386" y="672" fill="#14532d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">A timer loop does not</text>
  <text class="good-text" x="386" y="694" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5">Each setTimeout is a separate task, so the loop</text>
  <text class="good-text" x="386" y="710" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5">reaches render between every run. Browsers also</text>
  <text class="good-text" x="386" y="726" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5">clamp nested timers to about 4 ms after five levels.</text>
</svg>
