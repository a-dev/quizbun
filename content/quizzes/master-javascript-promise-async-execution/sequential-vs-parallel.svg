<svg xmlns="http://www.w3.org/2000/svg" width="720" height="594" viewBox="0 0 720 594">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d5dce6;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c49;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .grid-line { stroke: var(--grid); }
  </style>
  <rect class="panel" width="720" height="594" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Three 100 ms calls: one after another, or all at once</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Awaiting inside a loop serialises the work. Starting everything first, then awaiting, does not.</text>
  <rect class="card" x="36" y="88" width="648" height="210" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <path class="grid-line" d="M210,112 V262" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="210" y="278" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">0</text>
  <path class="grid-line" d="M350,112 V262" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="350" y="278" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">100</text>
  <path class="grid-line" d="M490,112 V262" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="490" y="278" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">200</text>
  <path class="grid-line" d="M630,112 V262" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="630" y="278" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">300</text>
  <text class="dead-text" x="196" y="278" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="end">ms</text>
  <text class="accent-text" x="54" y="134" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">for (const x of xs) await f(x)</text>
  <rect class="accent-box" x="212" y="144" width="136" height="24" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="280" y="161" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">f(x1)</text>
  <rect class="accent-box" x="352" y="144" width="136" height="24" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="420" y="161" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">f(x2)</text>
  <rect class="accent-box" x="492" y="144" width="136" height="24" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="560" y="161" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">f(x3)</text>
  <text class="accent-text" x="640" y="161" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" font-weight="700">300 ms</text>
  <text class="good-text" x="54" y="200" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">await Promise.all(xs.map(f))</text>
  <rect class="good-box" x="212" y="210" width="136" height="15" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <rect class="good-box" x="212" y="228" width="136" height="15" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <rect class="good-box" x="212" y="246" width="136" height="15" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="360" y="232" fill="#14532d" font-family="system-ui, sans-serif" font-size="11" font-weight="700">100 ms</text>
  <text class="muted" x="54" y="232" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5">all three start on the</text>
  <text class="muted" x="54" y="244" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5">same tick</text>
  <rect class="accent-box" x="36" y="314" width="316" height="128" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="54" y="338" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">forEach never waits</text>
  <text class="accent-text" x="54" y="362" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">xs.forEach(async x =&gt; { await f(x) });</text>
  <text class="accent-text" x="54" y="378" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">log('done');</text>
  <text class="accent-text" x="54" y="400" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">forEach ignores the promise each callback returns,</text>
  <text class="accent-text" x="54" y="416" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">so the loop finishes on the spot and "done" logs</text>
  <text class="accent-text" x="54" y="432" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">before any of the work does. Use for…of, or map.</text>
  <rect class="info-box" x="368" y="314" width="316" height="128" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="386" y="338" fill="#172554" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">map hands back promises, not values</text>
  <text class="info-text" x="386" y="362" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">const r = xs.map(async x =&gt; f(x));</text>
  <text class="info-text" x="386" y="378" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">// [Promise, Promise, Promise]</text>
  <text class="info-text" x="386" y="400" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">An async callback always returns a promise, so map</text>
  <text class="info-text" x="386" y="416" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">gives you an array of them. That is exactly what</text>
  <text class="info-text" x="386" y="432" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">Promise.all wants, but you still have to await it.</text>
  <rect class="good-box" x="36" y="458" width="648" height="106" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="54" y="482" fill="#14532d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Calling the function starts the work, await only decides when you collect it</text>
  <text class="good-text" x="54" y="506" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">const p1 = slow(); const p2 = slow(); await p1; await p2;</text>
  <text class="good-text" x="54" y="528" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5">Both are already in flight by the time the first await runs, so this finishes in about 100 ms too, no Promise.all needed.</text>
  <text class="good-text" x="54" y="548" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5">Move either call after an await and you are back to 200 ms. The await is not what launches anything.</text>
</svg>
