<svg xmlns="http://www.w3.org/2000/svg" width="720" height="636" viewBox="0 0 720 636">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d5dce6;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c49;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .grid-line { stroke: var(--grid); }
    .dead-line { stroke: var(--dead-text); }
  </style>
  <rect class="panel" width="720" height="636" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Four combinators over the same three promises</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">A fulfils at 10 ms, B rejects at 20 ms, C fulfils at 30 ms. Only the rule for settling differs.</text>
  <rect class="card" x="36" y="88" width="648" height="372" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <path class="grid-line" d="M190,114 V436" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="190" y="450" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">0</text>
  <path class="grid-line" d="M307,114 V436" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="307" y="450" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">10</text>
  <path class="grid-line" d="M424,114 V436" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="424" y="450" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">20</text>
  <path class="grid-line" d="M541,114 V436" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="541" y="450" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">30</text>
  <path class="grid-line" d="M658,114 V436" fill="none" stroke="#d5dce6" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5" />
  <text class="dead-text" x="658" y="450" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">40</text>
  <text class="dead-text" x="176" y="450" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="end">ms</text>
  <text class="title" x="54" y="130" fill="#20242c" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">the three inputs</text>
  <text class="muted" x="54" y="159" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">A</text>
  <rect class="good-box" x="190" y="142" width="117" height="24" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="297" y="159" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="end">fulfils 'a'</text>
  <text class="muted" x="54" y="189" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">B</text>
  <rect class="accent-box" x="190" y="172" width="234" height="24" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="414" y="189" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="end">rejects e</text>
  <text class="muted" x="54" y="219" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700">C</text>
  <rect class="good-box" x="190" y="202" width="351" height="24" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="531" y="219" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="end">fulfils 'c'</text>
  <path class="dead-line" d="M54,246 H666" fill="none" stroke="#8a97a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" />
  <text class="title" x="54" y="279" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">Promise.all</text>
  <rect class="accent-box" x="190" y="262" width="234" height="24" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="434" y="279" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10" font-weight="700">rejects with e</text>
  <text class="muted" x="54" y="298" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5">A and C keep running; a combinator cancels nothing. Had all three fulfilled, the array would be in input order.</text>
  <text class="title" x="54" y="323" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">Promise.allSettled</text>
  <rect class="good-box" x="190" y="306" width="351" height="24" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="551" y="323" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" font-weight="700">fulfils with 3 descriptors</text>
  <text class="muted" x="54" y="342" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5">Waits for every input, never rejects. Each entry is { status: 'fulfilled', value } or { status: 'rejected', reason }.</text>
  <text class="title" x="54" y="367" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">Promise.race</text>
  <rect class="info-box" x="190" y="350" width="117" height="24" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="317" y="367" fill="#172554" font-family="system-ui, sans-serif" font-size="10" font-weight="700">settles with 'a'</text>
  <text class="muted" x="54" y="386" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5">The first settlement wins, whatever it is. A rejection arriving first would win the same way.</text>
  <text class="title" x="54" y="411" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">Promise.any</text>
  <rect class="good-box" x="190" y="394" width="117" height="24" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="317" y="411" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" font-weight="700">fulfils with 'a'</text>
  <text class="muted" x="54" y="430" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5">Rejections are ignored. Only if all of them reject does it reject, with an AggregateError holding every reason.</text>
  <rect class="info-box" x="36" y="476" width="316" height="130" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="54" y="500" fill="#172554" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">The two empty-array cases</text>
  <text class="info-text" x="54" y="524" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">Promise.all([])</text>
  <text class="info-text" x="162" y="524" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">fulfils with [], "all of nothing"</text>
  <text class="info-text" x="54" y="540" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">is vacuously true, which is what makes .all(items.map(f))</text>
  <text class="info-text" x="54" y="556" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">safe when items happens to be empty.</text>
  <text class="accent-text" x="54" y="580" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">Promise.race([])</text>
  <text class="accent-text" x="170" y="580" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">stays pending forever, in silence.</text>
  <rect class="card" x="368" y="476" width="316" height="130" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="386" y="500" fill="#20242c" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Which ones can short-circuit</text>
  <text class="muted" x="386" y="522" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">all</text>
  <text class="muted" x="468" y="522" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">on the first rejection</text>
  <text class="muted" x="386" y="540" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">race</text>
  <text class="muted" x="468" y="540" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">on the first settlement</text>
  <text class="muted" x="386" y="558" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">any</text>
  <text class="muted" x="468" y="558" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">on the first fulfilment</text>
  <text class="muted" x="386" y="576" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">allSettled</text>
  <text class="muted" x="468" y="576" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">never, it waits for all</text>
  <text class="muted" x="386" y="590" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5">Short-circuiting settles the returned promise early; it does not stop the inputs.</text>
</svg>
