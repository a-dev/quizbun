<svg xmlns="http://www.w3.org/2000/svg" width="720" height="634" viewBox="0 0 720 634">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-fill: #e8ecf3;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-fill: #20262e;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .dead { fill: var(--dead-fill); stroke: var(--dead-text); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .dead-line { stroke: var(--dead-text); }
  </style>
  <rect class="panel" width="720" height="634" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">A chain costs a tick per link; a fork costs one tick for all of them</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Same promise, same three callbacks. Only the wiring differs.</text>
  <rect class="card" x="36" y="88" width="316" height="244" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="info-text" x="52" y="114" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Chained — each .then returns a new promise</text>
  <text class="dead-text" x="204" y="140" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">tick 1</text>
  <text class="dead-text" x="250" y="140" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">tick 2</text>
  <text class="dead-text" x="296" y="140" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">tick 3</text>
  <text class="muted" x="52" y="173" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">p.then(a)</text>
  <rect class="info-box" x="186" y="152" width="36" height="30" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="204" y="172" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">a</text>
  <text class="muted" x="52" y="213" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700"> .then(b)</text>
  <rect class="info-box" x="232" y="192" width="36" height="30" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="250" y="212" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">b</text>
  <text class="muted" x="52" y="253" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700"> .then(c)</text>
  <rect class="info-box" x="278" y="232" width="36" height="30" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="296" y="252" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">c</text>
  <text class="muted" x="52" y="282" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Each link subscribes to the promise the previous</text>
  <text class="muted" x="52" y="297" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">link returned, so it cannot be queued until that</text>
  <text class="muted" x="52" y="312" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">one settles. Three links, three ticks.</text>
  <rect class="card" x="368" y="88" width="316" height="244" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="good-text" x="384" y="114" fill="#14532d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Forked — three handlers on the same promise</text>
  <text class="dead-text" x="536" y="140" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">tick 1</text>
  <text class="dead-text" x="582" y="140" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">tick 2</text>
  <text class="dead-text" x="628" y="140" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" text-anchor="middle">tick 3</text>
  <text class="muted" x="384" y="173" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">p.then(x)</text>
  <rect class="good-box" x="518" y="152" width="36" height="30" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="536" y="172" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">x</text>
  <text class="muted" x="384" y="213" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">p.then(y)</text>
  <rect class="good-box" x="518" y="192" width="36" height="30" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="536" y="212" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">y</text>
  <text class="muted" x="384" y="253" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700">p.then(z)</text>
  <rect class="good-box" x="518" y="232" width="36" height="30" rx="7" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="536" y="252" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">z</text>
  <text class="muted" x="384" y="282" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">All three are already subscribed to p, so settling p</text>
  <text class="muted" x="384" y="297" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">queues all three at once. They run in registration</text>
  <text class="muted" x="384" y="312" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">order, inside a single tick.</text>
  <rect class="card" x="36" y="348" width="648" height="152" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="374" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">One chain with a rejection in it</text>
  <rect class="accent-box" x="54" y="392" width="96" height="44" rx="9" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="102" y="412" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">p</text>
  <text class="accent-text" x="102" y="428" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">rejects</text>
  <rect class="dead" x="160" y="392" width="96" height="44" rx="9" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1.2" stroke-dasharray="3 3" />
  <text class="dead-text" x="208" y="412" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">.then(f1)</text>
  <text class="dead-text" x="208" y="428" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">skipped</text>
  <path class="dead-line" d="M150,414 H158" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect class="dead" x="266" y="392" width="96" height="44" rx="9" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1.2" stroke-dasharray="3 3" />
  <text class="dead-text" x="314" y="412" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">.then(f2)</text>
  <text class="dead-text" x="314" y="428" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">skipped</text>
  <path class="dead-line" d="M256,414 H264" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect class="good-box" x="372" y="392" width="96" height="44" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="420" y="412" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">.catch(h)</text>
  <text class="good-text" x="420" y="428" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">runs</text>
  <path class="dead-line" d="M362,414 H370" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect class="good-box" x="478" y="392" width="96" height="44" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="526" y="412" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">.then(f3)</text>
  <text class="good-text" x="526" y="428" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">runs</text>
  <path class="dead-line" d="M468,414 H476" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect class="dead" x="584" y="392" width="96" height="44" rx="9" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1.2" stroke-dasharray="3 3" />
  <text class="dead-text" x="632" y="412" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" text-anchor="middle">.catch(h2)</text>
  <text class="dead-text" x="632" y="428" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">skipped</text>
  <path class="dead-line" d="M574,414 H582" fill="none" stroke="#8a97a8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="54" y="460" fill="#526173" font-family="system-ui, sans-serif" font-size="11">A rejection travels past every fulfilment handler until something can take it. .catch(h) is exactly .then(undefined, h), and once h</text>
  <text class="muted" x="54" y="476" fill="#526173" font-family="system-ui, sans-serif" font-size="11">returns a value the chain is fulfilled again — which is why the second .catch never runs. In .then(f, r), r does not catch what f throws:</text>
  <text class="muted" x="54" y="492" fill="#526173" font-family="system-ui, sans-serif" font-size="11">they are siblings on the same link, so f's error goes to the next link instead.</text>
  <rect class="info-box" x="36" y="516" width="316" height="92" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="54" y="540" fill="#172554" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">.finally passes everything through</text>
  <text class="info-text" x="54" y="562" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">It receives no arguments and cannot see the value or</text>
  <text class="info-text" x="54" y="578" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">the reason, and forwards both untouched — unless it</text>
  <text class="info-text" x="54" y="594" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">throws, and then its error replaces whatever was there.</text>
  <rect class="info-box" x="368" y="516" width="316" height="92" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="386" y="540" fill="#172554" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">A non-function argument is ignored</text>
  <text class="info-text" x="386" y="562" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">.then(42) or .then(null) is not an error. The link is</text>
  <text class="info-text" x="386" y="578" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">created as usual and the value passes straight</text>
  <text class="info-text" x="386" y="594" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">through to the next handler, unchanged.</text>
</svg>
