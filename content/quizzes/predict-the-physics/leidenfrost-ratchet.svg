<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .muted { fill: var(--muted); }
    .title { fill: var(--title); }
    .edge { stroke: var(--edge); }
    .a1f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="720" height="260" rx="20" fill="#f5f7fb" />
  <text class="title" x="360" y="36" text-anchor="middle" font-size="14" fill="#20242c">cross-section of a hot plate cut with sawtooth teeth that all lean the same way</text>

  <g transform="translate(40,64)">
    <path class="card" d="M0 150 v-54 l40 -26 l0 26 l40 -26 l0 26 l40 -26 l0 26 l40 -26 l0 26 l40 -26 l0 26 l40 -26 l0 26 l40 -26 l0 26 l40 -26 l0 26 l40 -26 l0 26 l40 -26 l0 26 l40 -26 l0 26 l40 -26 l0 26 l40 -26 l0 26 l40 -26 l0 26 l40 -26 l0 26 l40 -26 l0 26 v54 z" fill="#ffffff" stroke="#64748b" stroke-width="2" stroke-linejoin="round" />
    <text class="muted" x="320" y="134" text-anchor="middle" font-size="12" fill="#526173">metal, held well above the Leidenfrost temperature</text>

    <text class="muted" x="320" y="14" text-anchor="middle" font-size="12" fill="#526173">levitating water drop</text>
    <circle class="a1f" cx="320" cy="40" r="22" fill="#2563eb" />
    <path class="a2" d="M300 66 v10 M312 70 v10 M328 70 v10 M340 66 v10" stroke="#c2410c" stroke-width="2.5" stroke-linecap="round" />

    <path class="edge" d="M286 40 h-56" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" />
    <path class="edge" d="m236 34 -8 6 8 6" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text class="title" x="206" y="48" text-anchor="middle" font-size="24" fill="#20242c">?</text>
    <path class="edge" d="M354 40 h56" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" />
    <path class="edge" d="m404 34 8 6 -8 6" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text class="title" x="434" y="48" text-anchor="middle" font-size="24" fill="#20242c">?</text>
  </g>

  <text class="muted" x="40" y="244" font-size="11" fill="#526173">vapour escapes from under the drop. the plate is level, not tilted</text>
</svg>
