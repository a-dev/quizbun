<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .muted { fill: var(--muted); }
    .title { fill: var(--title); }
    .edge { stroke: var(--edge); }
    .a1 { stroke: var(--accent1); }
    .a1f { fill: var(--accent1); }
    .a2f { fill: var(--accent2); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="720" height="290" rx="20" fill="#f5f7fb" />
  <text class="title" x="360" y="34" text-anchor="middle" font-size="14" fill="#20242c">one link of the chain, at the instant the moving chain picks it up</text>

  <g transform="translate(24,50)">
    <rect class="card" width="316" height="220" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="158" y="28" text-anchor="middle" font-size="13" fill="#526173">still at rest in the pile</text>
    <text class="muted" x="158" y="112" text-anchor="middle" font-size="11" fill="#526173">one short, stiff link</text>
    <line x1="90" y1="132" x2="226" y2="132" stroke="#c2410c" stroke-width="7" stroke-linecap="round" />
    <circle class="a2f" cx="90" cy="132" r="7" fill="#c2410c" />
    <circle class="a2f" cx="226" cy="132" r="7" fill="#c2410c" />
    <line class="edge" x1="40" y1="152" x2="276" y2="152" stroke="#64748b" stroke-width="3" />
    <text class="muted" x="158" y="176" text-anchor="middle" font-size="11" fill="#526173">the rest of the pile, packed below</text>
  </g>

  <g transform="translate(380,50)">
    <rect class="card" width="316" height="220" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="158" y="28" text-anchor="middle" font-size="13" fill="#526173">a moment later, yanked from one end</text>
    <line class="a1" x1="238" y1="66" x2="266" y2="44" stroke="#2563eb" stroke-width="3" />
    <path class="a1" d="m258 42 9 1 -2 9" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text class="a1f" x="216" y="56" text-anchor="end" font-size="12" fill="#2563eb">pulled up by the chain above</text>
    <line x1="96" y1="148" x2="228" y2="78" stroke="#c2410c" stroke-width="7" stroke-linecap="round" />
    <circle class="a2f" cx="96" cy="148" r="7" fill="#c2410c" />
    <circle class="a2f" cx="228" cy="78" r="7" fill="#c2410c" />
    <line class="edge" x1="40" y1="152" x2="276" y2="152" stroke="#64748b" stroke-width="3" />
    <circle cx="96" cy="150" r="22" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" />
    <text class="title" x="60" y="126" text-anchor="middle" font-size="26" fill="#20242c">?</text>
    <text class="muted" x="158" y="190" text-anchor="middle" font-size="11" fill="#526173">its far end is still down against the pile</text>
  </g>
</svg>
