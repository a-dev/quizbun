<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .muted { fill: var(--muted); }
    .title { fill: var(--title); }
    .edge { stroke: var(--edge); }
    .a1f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2f { fill: var(--accent2); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="720" height="330" rx="20" fill="#f5f7fb" />
  <text class="title" x="360" y="36" text-anchor="middle" font-size="14" fill="#20242c">same pan, same drop of water, two surface temperatures</text>

  <g transform="translate(24,52)">
    <rect class="card" width="316" height="244" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="158" y="30" text-anchor="middle" font-size="13" fill="#526173">surface at 150 °C</text>
    <circle class="a1f" cx="158" cy="70" r="14" fill="#2563eb" />
    <path class="edge" d="M158 92 v16" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" />
    <rect x="60" y="120" width="196" height="14" rx="4" fill="#64748b" />
    <path class="a2" d="M78 150 v22 M108 150 v22 M138 150 v22 M168 150 v22 M198 150 v22 M228 150 v22" stroke="#c2410c" stroke-width="3" stroke-linecap="round" />
    <text class="muted" x="158" y="202" text-anchor="middle" font-size="11" fill="#526173">how long does the drop last?</text>
    <text class="title" x="158" y="230" text-anchor="middle" font-size="24" fill="#20242c">?</text>
  </g>

  <g transform="translate(380,52)">
    <rect class="card" width="316" height="244" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="158" y="30" text-anchor="middle" font-size="13" fill="#526173">surface at 250 °C</text>
    <circle class="a1f" cx="158" cy="70" r="14" fill="#2563eb" />
    <path class="edge" d="M158 92 v16" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" />
    <rect x="60" y="120" width="196" height="14" rx="4" fill="#64748b" />
    <path class="a2" d="M78 150 v22 M108 150 v22 M138 150 v22 M168 150 v22 M198 150 v22 M228 150 v22" stroke="#c2410c" stroke-width="3" stroke-linecap="round" />
    <text class="muted" x="158" y="202" text-anchor="middle" font-size="11" fill="#526173">how long does the drop last?</text>
    <text class="title" x="158" y="230" text-anchor="middle" font-size="24" fill="#20242c">?</text>
  </g>

  <text class="muted" x="36" y="320" font-size="11" fill="#526173">flames below each pan, drop released from the same small height</text>
</svg>
