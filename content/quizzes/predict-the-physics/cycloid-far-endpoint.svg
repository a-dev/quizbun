<svg xmlns="http://www.w3.org/2000/svg" width="660" height="320" viewBox="0 0 660 320">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --accent1: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --accent1: #60a5fa;
      }
    }
    .panel { fill: var(--panel); }
    .muted { fill: var(--muted); }
    .title { fill: var(--title); }
    .ink { fill: var(--title); }
    .edge { stroke: var(--edge); }
    .a1 { stroke: var(--accent1); }
    .a1f { fill: var(--accent1); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="660" height="320" rx="20" fill="#f5f7fb" />
  <text class="title" x="330" y="34" text-anchor="middle" font-size="14" fill="#20242c">the sideways distance from A to B is three times the drop</text>

  <g transform="translate(30,26)">
    <circle class="ink" cx="70" cy="50" r="9" fill="#20242c" />
    <text class="title" x="54" y="40" text-anchor="middle" font-size="14" fill="#20242c">A</text>
    <circle class="ink" cx="530" cy="203" r="9" fill="#20242c" />
    <text class="title" x="548" y="198" font-size="14" fill="#20242c">B</text>

    <line class="edge" x1="70" y1="50" x2="530" y2="203" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" />
    <text class="muted" x="286" y="118" font-size="11" fill="#526173">straight line, for reference</text>

    <line class="a1" x1="70" y1="240" x2="530" y2="240" stroke="#2563eb" stroke-width="1.5" />
    <path class="a1" d="m78 234 -8 6 8 6 M522 234 l8 6 -8 6" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text class="a1f" x="300" y="232" text-anchor="middle" font-size="12" fill="#2563eb">sideways distance = 3h</text>
    <line class="edge" x1="70" y1="203" x2="70" y2="243" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3" />
    <line class="edge" x1="530" y1="212" x2="530" y2="243" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3" />

    <line class="a1" x1="600" y1="50" x2="600" y2="203" stroke="#2563eb" stroke-width="1.5" />
    <path class="a1" d="m594 58 6 -8 6 8 M594 195 l6 8 6 -8" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    <text class="a1f" x="588" y="130" text-anchor="end" font-size="12" fill="#2563eb">drop = h</text>
    <line class="edge" x1="80" y1="50" x2="604" y2="50" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3" />
    <line class="edge" x1="540" y1="203" x2="604" y2="203" stroke="#64748b" stroke-width="1" stroke-dasharray="3 3" />

    <text class="muted" x="70" y="278" font-size="12" fill="#526173">the quickest frictionless track from A to B:</text>
    <text class="title" x="332" y="280" font-size="22" fill="#20242c">?</text>
  </g>
</svg>
