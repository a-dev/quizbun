<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .muted { fill: var(--muted); }
    .title { fill: var(--title); }
    .edge { stroke: var(--edge); }
    .body { fill: var(--muted); }
    .a1 { stroke: var(--accent1); }
    .a1f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2f { fill: var(--accent2); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="720" height="280" rx="20" fill="#f5f7fb" />
  <text class="title" x="360" y="34" text-anchor="middle" font-size="14" fill="#20242c">a long, thin satellite, spun about its length before release</text>

  <g transform="translate(24,50)">
    <rect class="card" width="420" height="208" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="210" y="28" text-anchor="middle" font-size="13" fill="#526173">minutes after separation</text>

    <g transform="translate(210,116)">
      <line class="edge" x1="-176" y1="0" x2="176" y2="0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5" />
      <rect class="body" x="-110" y="-15" width="196" height="30" rx="8" fill="#526173" />
      <path class="body" d="M86 -15 l40 15 l-40 15 z" fill="#526173" />
      <path class="a1" d="M-60 -12 q-34 -34 -70 -40" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
      <path class="a1" d="M-60 12 q-34 34 -70 40" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
      <path class="a1" d="M-36 -12 q-26 -40 -56 -56" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
      <path class="a1" d="M-36 12 q-26 40 -56 56" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" />
      <text class="a1f" x="-176" y="-64" font-size="11" fill="#2563eb">flexible whip antennas</text>

      <path class="a2" d="M20 -34 a 30 18 0 1 1 -0.1 0" fill="none" stroke="#c2410c" stroke-width="3" />
      <path class="a2" d="m14 -42 8 8 -9 6" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text class="a2f" x="-30" y="62" font-size="12" fill="#c2410c">750 rpm about the long axis</text>
      <text class="muted" x="-30" y="80" font-size="11" fill="#526173">its smallest moment of inertia</text>
    </g>
  </g>

  <g transform="translate(464,50)">
    <rect class="card" width="232" height="208" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="116" y="28" text-anchor="middle" font-size="13" fill="#526173">a few hours later</text>
    <text class="title" x="116" y="122" text-anchor="middle" font-size="44" fill="#20242c">?</text>
    <text class="muted" x="116" y="164" text-anchor="middle" font-size="11" fill="#526173">the spin is no longer about</text>
    <text class="muted" x="116" y="182" text-anchor="middle" font-size="11" fill="#526173">the axis it was given</text>
  </g>
</svg>
