<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .muted { fill: var(--muted); }
    .title { fill: var(--title); }
    .edge { stroke: var(--edge); }
    .a1 { stroke: var(--accent1); }
    .a1f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="720" height="360" rx="20" fill="#f5f7fb" />
  <text class="title" x="360" y="36" text-anchor="middle" font-size="14" fill="#20242c">a long bead chain, coiled loose in a jar on a high shelf</text>

  <rect x="196" y="66" width="120" height="58" rx="12" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5" />
  <text class="title" x="256" y="106" text-anchor="middle" font-size="30" fill="#20242c">?</text>
  <text class="muted" x="330" y="86" font-size="11" fill="#526173">what the chain does</text>
  <text class="muted" x="330" y="102" font-size="11" fill="#526173">just after it leaves</text>
  <text class="muted" x="330" y="118" font-size="11" fill="#526173">the jar</text>

  <line class="edge" x1="36" y1="222" x2="300" y2="222" stroke="#64748b" stroke-width="6" stroke-linecap="round" />
  <text class="muted" x="52" y="244" font-size="12" fill="#526173">shelf</text>

  <path class="card" d="M112 138 h96 l-9 82 h-78 z" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <path class="a2" d="M120 176 q20 12 40 0 q20 -12 40 0" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round" />
  <path class="a2" d="M121 188 q20 12 40 0 q20 -12 38 0" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round" />
  <path class="a2" d="M123 200 q20 12 40 0 q18 -12 34 0" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round" />
  <path class="a2" d="M125 212 q20 10 38 0 q16 -10 32 0" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round" />
  <text class="muted" x="122" y="132" font-size="12" fill="#526173">chain pile</text>

  <path class="a2" d="M186 172 q24 -22 22 -44" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round" />
  <path class="a2" d="M306 118 q20 22 22 56" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round" />
  <path class="a2" d="M328 174 v144" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="2 5" stroke-linecap="round" />

  <line class="edge" x1="36" y1="322" x2="684" y2="322" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <text class="muted" x="52" y="342" font-size="12" fill="#526173">floor</text>

  <line class="a1" x1="412" y1="222" x2="412" y2="322" stroke="#2563eb" stroke-width="2" />
  <path class="a1" d="m406 230 6 -8 6 8" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path class="a1" d="m406 314 6 8 6 -8" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="a1f" x="426" y="278" font-size="13" fill="#2563eb">drop height</text>

  <text class="muted" x="426" y="180" font-size="12" fill="#526173">you pull one end over the rim and let go.</text>
  <text class="muted" x="426" y="198" font-size="12" fill="#526173">the chain flows out on its own</text>
</svg>
