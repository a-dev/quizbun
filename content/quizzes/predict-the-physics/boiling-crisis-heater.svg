<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .muted { fill: var(--muted); }
    .title { fill: var(--title); }
    .edge { stroke: var(--edge); }
    .a1 { stroke: var(--accent1); }
    .a1f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2f { fill: var(--accent2); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="720" height="300" rx="20" fill="#f5f7fb" />
  <text class="title" x="360" y="36" text-anchor="middle" font-size="14" fill="#20242c">an electric heater in a pot of water that is already boiling hard</text>

  <g transform="translate(40,56)">
    <path class="card" d="M20 20 v190 a14 14 0 0 0 14 14 h226 a14 14 0 0 0 14 -14 v-190" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <path class="a1" d="M26 76 h242" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5" />
    <text class="a1f" x="34" y="68" font-size="11" fill="#2563eb">water at 100 °C</text>

    <path class="a2" d="M84 150 h146" fill="none" stroke="#c2410c" stroke-width="8" stroke-linecap="round" />
    <path class="a2" d="M84 150 q-18 -30 0 -60" fill="none" stroke="#c2410c" stroke-width="8" stroke-linecap="round" />
    <path class="a2" d="M230 150 q18 -30 0 -60" fill="none" stroke="#c2410c" stroke-width="8" stroke-linecap="round" />
    <text class="muted" x="157" y="176" text-anchor="middle" font-size="11" fill="#526173">heater coil</text>

    <circle class="a1f" cx="104" cy="126" r="5" fill="#2563eb" />
    <circle class="a1f" cx="132" cy="118" r="4" fill="#2563eb" />
    <circle class="a1f" cx="166" cy="124" r="6" fill="#2563eb" />
    <circle class="a1f" cx="196" cy="116" r="4" fill="#2563eb" />
    <circle class="a1f" cx="220" cy="128" r="5" fill="#2563eb" />
    <circle class="a1f" cx="144" cy="96" r="4" fill="#2563eb" />
    <circle class="a1f" cx="184" cy="92" r="5" fill="#2563eb" />
  </g>

  <g transform="translate(400,76)">
    <text class="muted" x="0" y="0" font-size="12" fill="#526173">power dialled up, step by step</text>
    <line class="edge" x1="0" y1="18" x2="230" y2="18" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
    <path class="edge" d="m222 10 8 8 -8 8" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle class="a2" cx="24" cy="18" r="5" fill="none" stroke="#c2410c" stroke-width="3" />
    <circle class="a2" cx="90" cy="18" r="5" fill="none" stroke="#c2410c" stroke-width="3" />
    <circle class="a2" cx="156" cy="18" r="5" fill="none" stroke="#c2410c" stroke-width="3" />

    <text class="muted" x="0" y="76" font-size="12" fill="#526173">temperature of the coil's own surface</text>
    <rect x="0" y="90" width="230" height="60" rx="12" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 5" />
    <text class="title" x="115" y="132" text-anchor="middle" font-size="28" fill="#20242c">?</text>
  </g>
</svg>
