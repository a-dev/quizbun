<svg xmlns="http://www.w3.org/2000/svg" width="520" height="280" viewBox="0 0 520 280">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --accent1: #2563eb;
      --accent2: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --accent1: #60a5fa;
        --accent2: #fb923c;
      }
    }
    .panel { fill: var(--panel); }
    .muted { fill: var(--muted); }
    .title { fill: var(--title); }
    .edge { stroke: var(--edge); }
    .a1f { fill: var(--accent1); }
    .a2f { fill: var(--accent2); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="520" height="280" rx="20" fill="#f5f7fb" />
  <text class="title" x="260" y="34" text-anchor="middle" font-size="14" fill="#20242c">one cycloid trough, two beads released from rest at different heights</text>

  <g transform="translate(20,40)">
    <path class="edge" d="M60 50 L60.0 50.7 L60.3 52.9 L61.0 56.5 L62.4 61.5 L64.7 67.6 L68.0 74.7 L72.5 82.8 L78.3 91.5 L85.6 100.6 L94.2 110.0 L104.4 119.4 L116.0 128.5 L129.1 137.2 L143.4 145.3 L158.9 152.4 L175.5 158.5 L193.0 163.5 L211.1 167.1 L229.7 169.3 L248.5 170.0 L267.3 169.3 L285.9 167.1 L304.0 163.5 L321.5 158.5 L338.0 152.4 L353.6 145.3 L367.9 137.2 L381.0 128.5 L392.6 119.4 L402.7 110.0 L411.4 100.6 L418.7 91.5 L424.5 82.8 L429.0 74.7 L432.3 67.6 L434.6 61.5 L436.0 56.5 L436.7 52.9 L437.0 50.7 L437.0 50.0" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" />

    <circle class="a1f" cx="67" cy="70" r="8" fill="#2563eb" />
    <text class="a1f" x="82" y="62" font-size="12" fill="#2563eb">higher start</text>
    <circle class="a2f" cx="126" cy="132" r="8" fill="#c2410c" />
    <text class="a2f" x="141" y="126" font-size="12" fill="#c2410c">lower start</text>

    <path class="edge" d="M248 190 v-12" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" />
    <text class="title" x="248" y="216" text-anchor="middle" font-size="26" fill="#20242c">?</text>
    <text class="muted" x="248" y="236" text-anchor="middle" font-size="11" fill="#526173">which bead reaches the bottom first</text>
  </g>
</svg>
