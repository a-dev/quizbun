<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --screen: #dbe3f0;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
        --screen: #33405a;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .muted { fill: var(--muted); }
    .title { fill: var(--title); }
    .edge { stroke: var(--edge); }
    .phone { fill: var(--screen); stroke: var(--muted); }
    .a2 { stroke: var(--accent2); }
    .a2f { fill: var(--accent2); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="720" height="290" rx="20" fill="#f5f7fb" />
  <text class="title" x="360" y="34" text-anchor="middle" font-size="14" fill="#20242c">the same phone, tossed three ways, spin axis marked in each case</text>

  <g transform="translate(20,50)">
    <rect class="card" width="212" height="220" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="106" y="28" text-anchor="middle" font-size="13" fill="#526173">flat spin</text>
    <rect class="phone" x="76" y="52" width="60" height="112" rx="9" fill="#dbe3f0" stroke="#526173" stroke-width="2" />
    <circle class="a2f" cx="106" cy="108" r="4" fill="#c2410c" />
    <path class="a2" d="M106 78 a 30 30 0 1 1 -21 8.8" fill="none" stroke="#c2410c" stroke-width="3" />
    <path class="a2" d="m78 80 7 7 -8 7" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text class="muted" x="106" y="192" text-anchor="middle" font-size="11" fill="#526173">axis straight out of the screen</text>
  </g>

  <g transform="translate(254,50)">
    <rect class="card" width="212" height="220" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="106" y="28" text-anchor="middle" font-size="13" fill="#526173">long-axis roll</text>
    <rect class="phone" x="76" y="52" width="60" height="112" rx="9" fill="#dbe3f0" stroke="#526173" stroke-width="2" />
    <line class="edge" x1="106" y1="40" x2="106" y2="176" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5" />
    <path class="a2" d="M62 108 a 44 22 0 0 0 88 0" fill="none" stroke="#c2410c" stroke-width="3" />
    <path class="a2" d="m142 118 8 -9 -11 -4" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text class="muted" x="106" y="192" text-anchor="middle" font-size="11" fill="#526173">axis down the long edges</text>
  </g>

  <g transform="translate(488,50)">
    <rect class="card" width="212" height="220" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="106" y="28" text-anchor="middle" font-size="13" fill="#526173">end-over-end flip</text>
    <rect class="phone" x="76" y="52" width="60" height="112" rx="9" fill="#dbe3f0" stroke="#526173" stroke-width="2" />
    <line class="edge" x1="40" y1="108" x2="172" y2="108" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5" />
    <path class="a2" d="M106 62 a 22 44 0 0 1 0 92" fill="none" stroke="#c2410c" stroke-width="3" />
    <path class="a2" d="m96 148 11 8 3 -11" fill="none" stroke="#c2410c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text class="muted" x="106" y="192" text-anchor="middle" font-size="11" fill="#526173">axis across the short edges</text>
  </g>
</svg>
