<svg xmlns="http://www.w3.org/2000/svg" width="640" height="390" viewBox="0 0 640 390">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --accent3: #15803d;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --accent1: #60a5fa;
        --accent2: #fb923c;
        --accent3: #4ade80;
      }
    }
    .panel { fill: var(--panel); }
    .muted { fill: var(--muted); }
    .title { fill: var(--title); }
    .ink { fill: var(--title); }
    .edge { stroke: var(--edge); }
    .a1 { stroke: var(--accent1); }
    .a1f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2f { fill: var(--accent2); }
    .a3 { stroke: var(--accent3); }
    .a3f { fill: var(--accent3); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="640" height="390" rx="20" fill="#f5f7fb" />
  <text class="title" x="320" y="34" text-anchor="middle" font-size="14" fill="#20242c">three frictionless tracks between the same two points</text>

  <g transform="translate(60,26)">
    <path class="a3" d="M20 40 Q 150 44 354 280" fill="none" stroke="#15803d" stroke-width="3.5" stroke-linecap="round" />
    <line class="a1" x1="20" y1="40" x2="354" y2="280" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" />
    <path class="a2" d="M20 40 L20.0 40.9 L20.3 43.6 L21.0 48.1 L22.4 54.3 L24.6 62.2 L27.9 71.5 L32.4 82.1 L38.3 94.0 L45.7 106.8 L54.8 120.5 L65.5 134.8 L78.1 149.5 L92.5 164.4 L108.7 179.2 L126.7 193.8 L146.4 207.8 L167.9 221.2 L190.9 233.6 L215.4 244.9 L241.3 255.0 L268.2 263.7 L296.2 270.8 L324.9 276.3 L354.2 280.0" fill="none" stroke="#c2410c" stroke-width="3.5" stroke-linecap="round" />

    <circle class="ink" cx="20" cy="28" r="9" fill="#20242c" />
    <text class="title" x="2" y="20" text-anchor="middle" font-size="14" fill="#20242c">A</text>
    <text class="muted" x="38" y="20" font-size="11" fill="#526173">all three balls released here at the same instant</text>

    <circle class="edge" cx="354" cy="292" r="9" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4 3" />
    <text class="title" x="374" y="298" font-size="14" fill="#20242c">B</text>
    <text class="title" x="400" y="266" font-size="30" fill="#20242c">?</text>
    <text class="muted" x="432" y="266" font-size="11" fill="#526173">which ball</text>
    <text class="muted" x="432" y="282" font-size="11" fill="#526173">arrives first</text>
  </g>

  <g transform="translate(84,304)">
    <line class="a2" x1="0" y1="0" x2="34" y2="0" stroke="#c2410c" stroke-width="3.5" stroke-linecap="round" />
    <text class="a2f" x="46" y="4" font-size="12" fill="#c2410c">steep first, then shallow</text>
    <line class="a1" x1="0" y1="24" x2="34" y2="24" stroke="#2563eb" stroke-width="3.5" stroke-linecap="round" />
    <text class="a1f" x="46" y="28" font-size="12" fill="#2563eb">straight ramp</text>
    <line class="a3" x1="0" y1="48" x2="34" y2="48" stroke="#15803d" stroke-width="3.5" stroke-linecap="round" />
    <text class="a3f" x="46" y="52" font-size="12" fill="#15803d">shallow first, then steep</text>
  </g>
</svg>
