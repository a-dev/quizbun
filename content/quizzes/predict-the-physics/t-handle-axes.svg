<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent2: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent2: #fb923c;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .muted { fill: var(--muted); }
    .title { fill: var(--title); }
    .edge { stroke: var(--edge); }
    .body { fill: var(--muted); }
    .a2 { stroke: var(--accent2); }
    .a2f { fill: var(--accent2); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="720" height="300" rx="20" fill="#f5f7fb" />
  <text class="title" x="360" y="34" text-anchor="middle" font-size="14" fill="#20242c">a T-shaped handle floating in orbit, spun up about one axis and let go</text>

  <g transform="translate(24,50)">
    <rect class="card" width="400" height="228" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="200" y="28" text-anchor="middle" font-size="13" fill="#526173">the moment it is released</text>

    <g transform="translate(200,112)">
      <line class="edge" x1="-152" y1="0" x2="152" y2="0" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5" />
      <line class="edge" x1="0" y1="-72" x2="0" y2="72" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5" />
      <line class="edge" x1="-74" y1="48" x2="74" y2="-48" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5" />

      <rect class="body" x="-58" y="-50" width="116" height="17" rx="6" fill="#526173" />
      <rect class="body" x="-8" y="-42" width="16" height="84" rx="5" fill="#526173" />

      <path class="a2" d="M-106 -22 a 34 34 0 0 0 0 44" fill="none" stroke="#c2410c" stroke-width="3.5" />
      <path class="a2" d="m-114 14 8 10 10 -6" fill="none" stroke="#c2410c" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <text class="a2f" x="-152" y="-32" font-size="12" fill="#c2410c">spun about</text>
      <text class="a2f" x="-152" y="-16" font-size="12" fill="#c2410c">this axis</text>

      <text class="muted" x="150" y="-10" text-anchor="end" font-size="11" fill="#526173">intermediate</text>
      <text class="muted" x="6" y="86" font-size="11" fill="#526173">smallest</text>
      <text class="muted" x="-82" y="58" text-anchor="end" font-size="11" fill="#526173">largest</text>
    </g>

    <text class="muted" x="200" y="214" text-anchor="middle" font-size="11" fill="#526173">the axis of largest moment of inertia points out of the page</text>
  </g>

  <g transform="translate(444,50)">
    <rect class="card" width="252" height="228" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="126" y="28" text-anchor="middle" font-size="13" fill="#526173">a few seconds later</text>
    <text class="title" x="126" y="132" text-anchor="middle" font-size="44" fill="#20242c">?</text>
    <text class="muted" x="126" y="176" text-anchor="middle" font-size="11" fill="#526173">no air, no contact, no thrusters.</text>
    <text class="muted" x="126" y="194" text-anchor="middle" font-size="11" fill="#526173">nothing touches the handle again</text>
  </g>
</svg>
