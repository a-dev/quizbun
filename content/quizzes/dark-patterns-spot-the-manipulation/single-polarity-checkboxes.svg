<svg xmlns="http://www.w3.org/2000/svg" width="720" height="334" viewBox="0 0 720 334">
  <style>
    svg {
      --panel: #f5f7fb;
      --surface: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #cbd5e1;
      --strong: #64748b;
      --ink: #2563eb;
      --ink-text: #ffffff;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
      --faint: #94a3b8;
      --good-fill: #d9f2e6;
      --bad-fill: #fde8e8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --surface: #232a34;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #3a4553;
        --strong: #8b9bb4;
        --ink: #7aa2f7;
        --ink-text: #101720;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #2b3441;
        --faint: #6b7a8f;
        --good-fill: #21382f;
        --bad-fill: #3a2528;
      }
    }
    .panel { fill: var(--panel); }
    .surface { fill: var(--surface); }
    .band { fill: var(--band); }
    .title-f { fill: var(--title); }
    .muted-f { fill: var(--muted); }
    .faint-f { fill: var(--faint); }
    .ink-f { fill: var(--ink); }
    .ink-t { fill: var(--ink-text); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    .good-fill { fill: var(--good-fill); }
    .bad-fill { fill: var(--bad-fill); }
    .edge-s { stroke: var(--edge); }
    .strong-s { stroke: var(--strong); }
    .ink-s { stroke: var(--ink); }
    .bad-s { stroke: var(--bad); }
    .good-s { stroke: var(--good); }
    .muted-s { stroke: var(--muted); }
    .faint-s { stroke: var(--faint); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="334" rx="20" fill="#f5f7fb" />
  <rect class="surface edge-s" x="90" y="32" width="540" height="270" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="title-f" x="118" y="72" fill="#20242c" font-size="18" font-weight="700">Email preferences</text>
  <line class="edge-s" x1="118" y1="88" x2="602" y2="88" stroke="#cbd5e1" stroke-width="1" />
  <text class="title-f" x="118" y="112" fill="#20242c" font-size="13" font-weight="600">Send me:</text>
  <rect class="surface strong-s" x="118" y="126" width="17" height="17" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="title-f" x="147" y="139" fill="#20242c" font-size="13">Product announcements</text>
  <rect class="surface strong-s" x="118" y="162" width="17" height="17" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="title-f" x="147" y="175" fill="#20242c" font-size="13">Offers from our partners</text>
  <rect class="surface strong-s" x="118" y="198" width="17" height="17" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="title-f" x="147" y="211" fill="#20242c" font-size="13">The weekly digest</text>
  <text class="muted-f" x="118" y="240" fill="#526173" font-size="11">Every box points the same way: ticked means yes. All three start empty.</text>
  <rect class="ink-f" x="462" y="250" width="140" height="36" rx="8" fill="#2563eb" />
  <text class="ink-t" x="532" y="272.32" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Save preferences</text>
</svg>
