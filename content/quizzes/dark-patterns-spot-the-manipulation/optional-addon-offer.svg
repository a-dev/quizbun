<svg xmlns="http://www.w3.org/2000/svg" width="720" height="388" viewBox="0 0 720 388">
  <style>
    svg {
      --panel: #f5f7fb;
      --surface: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #cbd5e1;
      --strong: #64748b;
      --ink: #2563eb;
      --ink-text: #ffffff;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
      --faint: #94a3b8;
      --good-fill: #d9f2e6;
      --bad-fill: #fde8e8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --surface: #232a34;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #3a4553;
        --strong: #8b9bb4;
        --ink: #7aa2f7;
        --ink-text: #101720;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #2b3441;
        --faint: #6b7a8f;
        --good-fill: #21382f;
        --bad-fill: #3a2528;
      }
    }
    .panel { fill: var(--panel); }
    .surface { fill: var(--surface); }
    .band { fill: var(--band); }
    .title-f { fill: var(--title); }
    .muted-f { fill: var(--muted); }
    .faint-f { fill: var(--faint); }
    .ink-f { fill: var(--ink); }
    .ink-t { fill: var(--ink-text); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    .good-fill { fill: var(--good-fill); }
    .bad-fill { fill: var(--bad-fill); }
    .edge-s { stroke: var(--edge); }
    .strong-s { stroke: var(--strong); }
    .ink-s { stroke: var(--ink); }
    .bad-s { stroke: var(--bad); }
    .good-s { stroke: var(--good); }
    .muted-s { stroke: var(--muted); }
    .faint-s { stroke: var(--faint); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="388" rx="20" fill="#f5f7fb" />
  <rect class="surface edge-s" x="90" y="32" width="540" height="324" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="title-f" x="118" y="70" fill="#20242c" font-size="18" font-weight="700">Your basket</text>
  <rect class="band" x="118" y="88" width="56" height="56" rx="8" fill="#e6ecf6" />
  <text class="title-f" x="190" y="110" fill="#20242c" font-size="14" font-weight="600">Merino crew sweater</text>
  <text class="muted-f" x="190" y="130" fill="#526173" font-size="12">Charcoal · M · Qty 1</text>
  <text class="title-f mono" x="602" y="110" fill="#20242c" font-size="14" font-weight="600" text-anchor="end">£89.00</text>
  <line class="edge-s" x1="118" y1="162" x2="602" y2="162" stroke="#cbd5e1" stroke-width="1" />
  <rect class="panel" x="118" y="176" width="484" height="68" rx="10" fill="#f5f7fb" />
  <rect class="surface strong-s" x="136" y="192" width="17" height="17" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="title-f" x="165" y="205" fill="#20242c" font-size="13">Add shipping protection for £4.99</text>
  <text class="muted-f" x="165" y="228" fill="#526173" font-size="11">Covers loss or damage in transit. Nothing is added until you tick it.</text>
  <line class="edge-s" x1="118" y1="252" x2="602" y2="252" stroke="#cbd5e1" stroke-width="1" />
  <text class="title-f" x="118" y="278" fill="#20242c" font-size="14">Order total</text>
  <text class="title-f mono" x="602" y="278" fill="#20242c" font-size="18" font-weight="700" text-anchor="end">£89.00</text>
  <rect class="ink-f" x="454" y="296" width="148" height="40" rx="8" fill="#2563eb" />
  <text class="ink-t" x="528" y="321.04" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Checkout</text>
</svg>
