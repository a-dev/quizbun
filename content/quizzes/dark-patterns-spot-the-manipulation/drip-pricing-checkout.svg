<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330">
  <style>
    svg {
      --panel: #f5f7fb;
      --surface: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #cbd5e1;
      --strong: #64748b;
      --ink: #2563eb;
      --ink-text: #ffffff;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
      --faint: #94a3b8;
      --good-fill: #d9f2e6;
      --bad-fill: #fde8e8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --surface: #232a34;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #3a4553;
        --strong: #8b9bb4;
        --ink: #7aa2f7;
        --ink-text: #101720;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #2b3441;
        --faint: #6b7a8f;
        --good-fill: #21382f;
        --bad-fill: #3a2528;
      }
    }
    .panel { fill: var(--panel); }
    .surface { fill: var(--surface); }
    .band { fill: var(--band); }
    .title-f { fill: var(--title); }
    .muted-f { fill: var(--muted); }
    .faint-f { fill: var(--faint); }
    .ink-f { fill: var(--ink); }
    .ink-t { fill: var(--ink-text); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    .good-fill { fill: var(--good-fill); }
    .bad-fill { fill: var(--bad-fill); }
    .edge-s { stroke: var(--edge); }
    .strong-s { stroke: var(--strong); }
    .ink-s { stroke: var(--ink); }
    .bad-s { stroke: var(--bad); }
    .good-s { stroke: var(--good); }
    .muted-s { stroke: var(--muted); }
    .faint-s { stroke: var(--faint); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="330" rx="20" fill="#f5f7fb" />
  <text class="title-f" x="24" y="48" fill="#20242c" font-size="15" font-weight="700">One purchase, four screens, and a total you never see until the end</text>
  <rect class="surface edge-s" x="24" y="74" width="150" height="232" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect class="band" x="24" y="74" width="150" height="32" rx="12" fill="#e6ecf6" />
  <rect class="band" x="24" y="92" width="150" height="14" rx="0" fill="#e6ecf6" />
  <text class="title-f" x="99" y="95" fill="#20242c" font-size="12" font-weight="700" text-anchor="middle">Search results</text>
  <text class="muted-f" x="99" y="140" fill="#526173" font-size="13" font-weight="400" text-anchor="middle">Alpine Festival</text>
  <text class="title-f mono" x="99" y="170" fill="#20242c" font-size="19" font-weight="700" text-anchor="middle">£48.00</text>
  <text class="muted-f" x="99" y="200" fill="#526173" font-size="13" font-weight="400" text-anchor="middle">per ticket</text>
  <line class="edge-s" x1="40" y1="264" x2="158" y2="264" stroke="#cbd5e1" stroke-width="1" />
  <text class="muted-f" x="99" y="286" fill="#526173" font-size="11" text-anchor="middle">the advertised price</text>
  <defs><marker id="d0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526173" /></marker></defs>
  <line class="muted-s" x1="178" y1="190" x2="194" y2="190" stroke="#526173" stroke-width="1.6" marker-end="url(#d0)" />
  <rect class="surface edge-s" x="198" y="74" width="150" height="232" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect class="band" x="198" y="74" width="150" height="32" rx="12" fill="#e6ecf6" />
  <rect class="band" x="198" y="92" width="150" height="14" rx="0" fill="#e6ecf6" />
  <text class="title-f" x="273" y="95" fill="#20242c" font-size="12" font-weight="700" text-anchor="middle">Choose seats</text>
  <text class="muted-f" x="273" y="140" fill="#526173" font-size="13" font-weight="400" text-anchor="middle">2 tickets</text>
  <text class="title-f mono" x="273" y="170" fill="#20242c" font-size="19" font-weight="700" text-anchor="middle">2 × £48.00</text>
  <line class="edge-s" x1="214" y1="264" x2="332" y2="264" stroke="#cbd5e1" stroke-width="1" />
  <text class="bad-f" x="273" y="286" fill="#dc2626" font-size="11" text-anchor="middle">still no fees</text>
  <defs><marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526173" /></marker></defs>
  <line class="muted-s" x1="352" y1="190" x2="368" y2="190" stroke="#526173" stroke-width="1.6" marker-end="url(#d1)" />
  <rect class="surface edge-s" x="372" y="74" width="150" height="232" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect class="band" x="372" y="74" width="150" height="32" rx="12" fill="#e6ecf6" />
  <rect class="band" x="372" y="92" width="150" height="14" rx="0" fill="#e6ecf6" />
  <text class="title-f" x="447" y="95" fill="#20242c" font-size="12" font-weight="700" text-anchor="middle">Delivery</text>
  <text class="muted-f" x="447" y="140" fill="#526173" font-size="13" font-weight="400" text-anchor="middle">Service fee</text>
  <text class="title-f mono" x="447" y="170" fill="#20242c" font-size="19" font-weight="700" text-anchor="middle">£12.50</text>
  <text class="muted-f" x="447" y="200" fill="#526173" font-size="13" font-weight="400" text-anchor="middle">per ticket</text>
  <line class="edge-s" x1="388" y1="264" x2="506" y2="264" stroke="#cbd5e1" stroke-width="1" />
  <text class="bad-f" x="447" y="286" fill="#dc2626" font-size="11" text-anchor="middle">first fee appears</text>
  <defs><marker id="d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526173" /></marker></defs>
  <line class="muted-s" x1="526" y1="190" x2="542" y2="190" stroke="#526173" stroke-width="1.6" marker-end="url(#d2)" />
  <rect class="surface edge-s" x="546" y="74" width="150" height="232" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect class="band" x="546" y="74" width="150" height="32" rx="12" fill="#e6ecf6" />
  <rect class="band" x="546" y="92" width="150" height="14" rx="0" fill="#e6ecf6" />
  <text class="title-f" x="621" y="95" fill="#20242c" font-size="12" font-weight="700" text-anchor="middle">Payment</text>
  <text class="muted-f" x="621" y="140" fill="#526173" font-size="11" font-weight="400" text-anchor="middle">Order processing £6.00</text>
  <text class="muted-f" x="621" y="166" fill="#526173" font-size="11" font-weight="400" text-anchor="middle">Delivery £4.00</text>
  <text class="muted-f" x="621" y="192" fill="#526173" font-size="11" font-weight="400" text-anchor="middle">Total: after card details</text>
  <line class="edge-s" x1="562" y1="264" x2="680" y2="264" stroke="#cbd5e1" stroke-width="1" />
  <text class="bad-f" x="621" y="286" fill="#dc2626" font-size="11" text-anchor="middle">two more fees</text>
</svg>
