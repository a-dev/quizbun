<svg xmlns="http://www.w3.org/2000/svg" width="720" height="356" viewBox="0 0 720 356">
  <style>
    svg {
      --panel: #f5f7fb;
      --surface: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #cbd5e1;
      --strong: #64748b;
      --ink: #2563eb;
      --ink-text: #ffffff;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
      --faint: #94a3b8;
      --good-fill: #d9f2e6;
      --bad-fill: #fde8e8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --surface: #232a34;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #3a4553;
        --strong: #8b9bb4;
        --ink: #7aa2f7;
        --ink-text: #101720;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #2b3441;
        --faint: #6b7a8f;
        --good-fill: #21382f;
        --bad-fill: #3a2528;
      }
    }
    .panel { fill: var(--panel); }
    .surface { fill: var(--surface); }
    .band { fill: var(--band); }
    .title-f { fill: var(--title); }
    .muted-f { fill: var(--muted); }
    .faint-f { fill: var(--faint); }
    .ink-f { fill: var(--ink); }
    .ink-t { fill: var(--ink-text); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    .good-fill { fill: var(--good-fill); }
    .bad-fill { fill: var(--bad-fill); }
    .edge-s { stroke: var(--edge); }
    .strong-s { stroke: var(--strong); }
    .ink-s { stroke: var(--ink); }
    .bad-s { stroke: var(--bad); }
    .good-s { stroke: var(--good); }
    .muted-s { stroke: var(--muted); }
    .faint-s { stroke: var(--faint); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="356" rx="20" fill="#f5f7fb" />
  <rect class="surface edge-s" x="130" y="48" width="460" height="260" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="faint-f" x="566" y="82" fill="#94a3b8" font-size="15">✕</text>
  <text class="title-f" x="162" y="92" fill="#20242c" font-size="19" font-weight="700">Before you go…</text>
  <text class="muted-f" x="162" y="120" fill="#526173" font-size="13">Join 40,000 readers and take 20% off your first order.</text>
  <text class="muted-f" x="162" y="142" fill="#526173" font-size="12" font-weight="600">Email address</text>
  <rect class="panel edge-s" x="162" y="150" width="400" height="30" rx="7" fill="#f5f7fb" stroke="#cbd5e1" stroke-width="1" />
  <text class="faint-f" x="173" y="170" fill="#94a3b8" font-size="13">you@example.com</text>
  <rect class="ink-f" x="162" y="208" width="192" height="44" rx="8" fill="#2563eb" />
  <text class="ink-t" x="258" y="235.04" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Get 20% off</text>
  <rect class="surface ink-s" x="370" y="208" width="192" height="44" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
  <text class="ink-f" x="466" y="235.04" fill="#2563eb" font-size="14" font-weight="600" text-anchor="middle">No thanks</text>
  <text class="muted-f" x="360" y="284" fill="#526173" font-size="12" text-anchor="middle">One email a week. Unsubscribe in one click.</text>
</svg>
