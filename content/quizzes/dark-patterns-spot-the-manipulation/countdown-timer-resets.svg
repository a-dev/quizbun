<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <style>
    svg {
      --panel: #f5f7fb;
      --surface: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #cbd5e1;
      --strong: #64748b;
      --ink: #2563eb;
      --ink-text: #ffffff;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
      --faint: #94a3b8;
      --good-fill: #d9f2e6;
      --bad-fill: #fde8e8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --surface: #232a34;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #3a4553;
        --strong: #8b9bb4;
        --ink: #7aa2f7;
        --ink-text: #101720;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #2b3441;
        --faint: #6b7a8f;
        --good-fill: #21382f;
        --bad-fill: #3a2528;
      }
    }
    .panel { fill: var(--panel); }
    .surface { fill: var(--surface); }
    .band { fill: var(--band); }
    .title-f { fill: var(--title); }
    .muted-f { fill: var(--muted); }
    .faint-f { fill: var(--faint); }
    .ink-f { fill: var(--ink); }
    .ink-t { fill: var(--ink-text); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    .good-fill { fill: var(--good-fill); }
    .bad-fill { fill: var(--bad-fill); }
    .edge-s { stroke: var(--edge); }
    .strong-s { stroke: var(--strong); }
    .ink-s { stroke: var(--ink); }
    .bad-s { stroke: var(--bad); }
    .good-s { stroke: var(--good); }
    .muted-s { stroke: var(--muted); }
    .faint-s { stroke: var(--faint); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="380" rx="20" fill="#f5f7fb" />
  <rect class="surface edge-s" x="40" y="32" width="640" height="132" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect class="band" x="64" y="56" width="84" height="84" rx="10" fill="#e6ecf6" />
  <text class="title-f" x="168" y="82" fill="#20242c" font-size="16" font-weight="700">Alpine down jacket</text>
  <text class="title-f" x="168" y="106" fill="#20242c" font-size="20" font-weight="700">£129.00</text>
  <text class="muted-f" x="268" y="106" fill="#526173" font-size="12">was £159.00</text>
  <rect class="bad-fill" x="400" y="66" width="256" height="64" rx="10" fill="#fde8e8" />
  <text class="bad-f" x="528" y="92" fill="#dc2626" font-size="12" text-anchor="middle">Offer ends in</text>
  <text class="bad-f mono" x="528" y="118" fill="#dc2626" font-size="22" font-weight="700" text-anchor="middle">04:59</text>
  <text class="title-f" x="40" y="206" fill="#20242c" font-size="15" font-weight="700">The same product page, three separate visits</text>
  <rect class="surface edge-s" x="40" y="224" width="196" height="124" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect class="band" x="40" y="224" width="196" height="26" rx="10" fill="#e6ecf6" />
  <rect class="band" x="40" y="240" width="196" height="10" rx="0" fill="#e6ecf6" />
  <text class="muted-f" x="54" y="242" fill="#526173" font-size="11" font-weight="600">Tuesday 10:02</text>
  <text class="bad-f mono" x="138" y="300" fill="#dc2626" font-size="30" font-weight="700" text-anchor="middle">04:59</text>
  <text class="muted-f" x="138" y="330" fill="#526173" font-size="12" text-anchor="middle">first visit</text>
  <rect class="surface edge-s" x="262" y="224" width="196" height="124" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect class="band" x="262" y="224" width="196" height="26" rx="10" fill="#e6ecf6" />
  <rect class="band" x="262" y="240" width="196" height="10" rx="0" fill="#e6ecf6" />
  <text class="muted-f" x="276" y="242" fill="#526173" font-size="11" font-weight="600">Tuesday 10:07</text>
  <text class="bad-f mono" x="360" y="300" fill="#dc2626" font-size="30" font-weight="700" text-anchor="middle">04:59</text>
  <text class="muted-f" x="360" y="330" fill="#526173" font-size="12" text-anchor="middle">after a reload</text>
  <rect class="surface edge-s" x="484" y="224" width="196" height="124" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect class="band" x="484" y="224" width="196" height="26" rx="10" fill="#e6ecf6" />
  <rect class="band" x="484" y="240" width="196" height="10" rx="0" fill="#e6ecf6" />
  <text class="muted-f" x="498" y="242" fill="#526173" font-size="11" font-weight="600">Wednesday 08:15</text>
  <text class="bad-f mono" x="582" y="300" fill="#dc2626" font-size="30" font-weight="700" text-anchor="middle">04:59</text>
  <text class="muted-f" x="582" y="330" fill="#526173" font-size="12" text-anchor="middle">new private window</text>
</svg>
