<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250">
  <style>
    svg {
      --panel: #f5f7fb;
      --surface: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #cbd5e1;
      --strong: #64748b;
      --ink: #2563eb;
      --ink-text: #ffffff;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
      --faint: #94a3b8;
      --good-fill: #d9f2e6;
      --bad-fill: #fde8e8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --surface: #232a34;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #3a4553;
        --strong: #8b9bb4;
        --ink: #7aa2f7;
        --ink-text: #101720;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #2b3441;
        --faint: #6b7a8f;
        --good-fill: #21382f;
        --bad-fill: #3a2528;
      }
    }
    .panel { fill: var(--panel); }
    .surface { fill: var(--surface); }
    .band { fill: var(--band); }
    .title-f { fill: var(--title); }
    .muted-f { fill: var(--muted); }
    .faint-f { fill: var(--faint); }
    .ink-f { fill: var(--ink); }
    .ink-t { fill: var(--ink-text); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    .good-fill { fill: var(--good-fill); }
    .bad-fill { fill: var(--bad-fill); }
    .edge-s { stroke: var(--edge); }
    .strong-s { stroke: var(--strong); }
    .ink-s { stroke: var(--ink); }
    .bad-s { stroke: var(--bad); }
    .good-s { stroke: var(--good); }
    .muted-s { stroke: var(--muted); }
    .faint-s { stroke: var(--faint); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="250" rx="20" fill="#f5f7fb" />
  <rect class="surface edge-s" x="40" y="32" width="640" height="132" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect class="band" x="64" y="56" width="84" height="84" rx="10" fill="#e6ecf6" />
  <text class="title-f" x="168" y="82" fill="#20242c" font-size="16" font-weight="700">Alpine down jacket</text>
  <text class="title-f" x="168" y="106" fill="#20242c" font-size="20" font-weight="700">£129.00</text>
  <text class="muted-f" x="268" y="106" fill="#526173" font-size="12">was £159.00</text>
  <rect class="good-fill" x="376" y="62" width="280" height="72" rx="10" fill="#d9f2e6" />
  <text class="good-f" x="516" y="88" fill="#0f766e" font-size="12" text-anchor="middle">Sale price held until</text>
  <text class="good-f" x="516" y="112" fill="#0f766e" font-size="15" font-weight="700" text-anchor="middle">Sun 23 March, 23:59 GMT</text>
  <text class="title-f" x="64" y="196" fill="#20242c" font-size="13">The deadline is a date, so every visitor sees the same one and a reload does not move it.</text>
  <text class="muted-f" x="64" y="220" fill="#526173" font-size="13">On 24 March the price returns to £159.00.</text>
</svg>
