<svg xmlns="http://www.w3.org/2000/svg" width="720" height="290" viewBox="0 0 720 290">
  <style>
    svg {
      --panel: #f5f7fb;
      --surface: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #cbd5e1;
      --strong: #64748b;
      --ink: #2563eb;
      --ink-text: #ffffff;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
      --faint: #94a3b8;
      --good-fill: #d9f2e6;
      --bad-fill: #fde8e8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --surface: #232a34;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #3a4553;
        --strong: #8b9bb4;
        --ink: #7aa2f7;
        --ink-text: #101720;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #2b3441;
        --faint: #6b7a8f;
        --good-fill: #21382f;
        --bad-fill: #3a2528;
      }
    }
    .panel { fill: var(--panel); }
    .surface { fill: var(--surface); }
    .band { fill: var(--band); }
    .title-f { fill: var(--title); }
    .muted-f { fill: var(--muted); }
    .faint-f { fill: var(--faint); }
    .ink-f { fill: var(--ink); }
    .ink-t { fill: var(--ink-text); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    .good-fill { fill: var(--good-fill); }
    .bad-fill { fill: var(--bad-fill); }
    .edge-s { stroke: var(--edge); }
    .strong-s { stroke: var(--strong); }
    .ink-s { stroke: var(--ink); }
    .bad-s { stroke: var(--bad); }
    .good-s { stroke: var(--good); }
    .muted-s { stroke: var(--muted); }
    .faint-s { stroke: var(--faint); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="290" rx="20" fill="#f5f7fb" />
  <rect class="surface edge-s" x="40" y="32" width="640" height="220" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="muted-f" x="68" y="68" fill="#526173" font-size="13">Alpine Festival · Saturday · 2 tickets</text>
  <text class="title-f mono" x="68" y="104" fill="#20242c" font-size="30" font-weight="700">£65.50</text>
  <text class="good-f" x="178" y="104" fill="#0f766e" font-size="14" font-weight="600">per ticket, every fee included</text>
  <line class="edge-s" x1="68" y1="126" x2="652" y2="126" stroke="#cbd5e1" stroke-width="1" />
  <text class="muted-f" x="68" y="152" fill="#526173" font-size="12">Ticket</text>
  <text class="title-f mono" x="300" y="152" fill="#20242c" font-size="12">£48.00</text>
  <text class="muted-f" x="68" y="174" fill="#526173" font-size="12">Service fee</text>
  <text class="title-f mono" x="300" y="174" fill="#20242c" font-size="12">£12.50</text>
  <text class="muted-f" x="68" y="196" fill="#526173" font-size="12">Order processing</text>
  <text class="title-f mono" x="300" y="196" fill="#20242c" font-size="12">£3.00</text>
  <text class="muted-f" x="68" y="218" fill="#526173" font-size="12">Delivery</text>
  <text class="title-f mono" x="300" y="218" fill="#20242c" font-size="12">£2.00</text>
  <line class="edge-s" x1="400" y1="140" x2="652" y2="140" stroke="#cbd5e1" stroke-width="1" />
  <text class="muted-f" x="420" y="172" fill="#526173" font-size="13">2 tickets</text>
  <text class="title-f mono" x="652" y="172" fill="#20242c" font-size="20" font-weight="700" text-anchor="end">£131.00</text>
  <text class="muted-f" x="420" y="198" fill="#526173" font-size="11">The number in the search results</text>
  <text class="muted-f" x="420" y="214" fill="#526173" font-size="11">is the number you pay.</text>
</svg>
