<svg xmlns="http://www.w3.org/2000/svg" width="720" height="210" viewBox="0 0 720 210">
  <style>
    svg {
      --panel: #f5f7fb;
      --surface: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #cbd5e1;
      --strong: #64748b;
      --ink: #2563eb;
      --ink-text: #ffffff;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
      --faint: #94a3b8;
      --good-fill: #d9f2e6;
      --bad-fill: #fde8e8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --surface: #232a34;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #3a4553;
        --strong: #8b9bb4;
        --ink: #7aa2f7;
        --ink-text: #101720;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #2b3441;
        --faint: #6b7a8f;
        --good-fill: #21382f;
        --bad-fill: #3a2528;
      }
    }
    .panel { fill: var(--panel); }
    .surface { fill: var(--surface); }
    .band { fill: var(--band); }
    .title-f { fill: var(--title); }
    .muted-f { fill: var(--muted); }
    .faint-f { fill: var(--faint); }
    .ink-f { fill: var(--ink); }
    .ink-t { fill: var(--ink-text); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    .good-fill { fill: var(--good-fill); }
    .bad-fill { fill: var(--bad-fill); }
    .edge-s { stroke: var(--edge); }
    .strong-s { stroke: var(--strong); }
    .ink-s { stroke: var(--ink); }
    .bad-s { stroke: var(--bad); }
    .good-s { stroke: var(--good); }
    .muted-s { stroke: var(--muted); }
    .faint-s { stroke: var(--faint); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="210" rx="20" fill="#f5f7fb" />
  <text class="title-f" x="40" y="52" fill="#20242c" font-size="15" font-weight="700">Cancelling, redesigned</text>
  <rect class="good-fill good-s" x="40" y="70" width="180" height="66" rx="10" fill="#d9f2e6" stroke="#0f766e" stroke-width="1.5" />
  <text class="title-f" x="130" y="99" fill="#20242c" font-size="13" font-weight="700" text-anchor="middle">Account</text>
  <text class="muted-f" x="130" y="118" fill="#526173" font-size="11" text-anchor="middle">Cancel membership</text>
  <defs><marker id="g0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e" /></marker></defs>
  <line class="good-s" x1="226" y1="103" x2="254" y2="103" stroke="#0f766e" stroke-width="1.6" marker-end="url(#g0)" />
  <rect class="good-fill good-s" x="260" y="70" width="180" height="66" rx="10" fill="#d9f2e6" stroke="#0f766e" stroke-width="1.5" />
  <text class="title-f" x="350" y="99" fill="#20242c" font-size="13" font-weight="700" text-anchor="middle">Confirm</text>
  <text class="muted-f" x="350" y="118" fill="#526173" font-size="11" text-anchor="middle">access ends 14 March</text>
  <defs><marker id="g1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e" /></marker></defs>
  <line class="good-s" x1="446" y1="103" x2="474" y2="103" stroke="#0f766e" stroke-width="1.6" marker-end="url(#g1)" />
  <rect class="good-fill good-s" x="480" y="70" width="180" height="66" rx="10" fill="#d9f2e6" stroke="#0f766e" stroke-width="1.5" />
  <text class="title-f" x="570" y="99" fill="#20242c" font-size="13" font-weight="700" text-anchor="middle">Cancelled</text>
  <text class="muted-f" x="570" y="118" fill="#526173" font-size="11" text-anchor="middle">confirmation emailed</text>
  <text class="good-f" x="40" y="174" fill="#0f766e" font-size="13" font-weight="600">Same page you subscribed on · 2 clicks · no retention maze</text>
</svg>
