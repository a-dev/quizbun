<svg xmlns="http://www.w3.org/2000/svg" width="720" height="404" viewBox="0 0 720 404">
  <style>
    svg {
      --panel: #f5f7fb;
      --surface: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #cbd5e1;
      --strong: #64748b;
      --ink: #2563eb;
      --ink-text: #ffffff;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
      --faint: #94a3b8;
      --good-fill: #d9f2e6;
      --bad-fill: #fde8e8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --surface: #232a34;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #3a4553;
        --strong: #8b9bb4;
        --ink: #7aa2f7;
        --ink-text: #101720;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #2b3441;
        --faint: #6b7a8f;
        --good-fill: #21382f;
        --bad-fill: #3a2528;
      }
    }
    .panel { fill: var(--panel); }
    .surface { fill: var(--surface); }
    .band { fill: var(--band); }
    .title-f { fill: var(--title); }
    .muted-f { fill: var(--muted); }
    .faint-f { fill: var(--faint); }
    .ink-f { fill: var(--ink); }
    .ink-t { fill: var(--ink-text); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    .good-fill { fill: var(--good-fill); }
    .bad-fill { fill: var(--bad-fill); }
    .edge-s { stroke: var(--edge); }
    .strong-s { stroke: var(--strong); }
    .ink-s { stroke: var(--ink); }
    .bad-s { stroke: var(--bad); }
    .good-s { stroke: var(--good); }
    .muted-s { stroke: var(--muted); }
    .faint-s { stroke: var(--faint); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="404" rx="20" fill="#f5f7fb" />
  <rect class="surface edge-s" x="40" y="28" width="640" height="356" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <rect class="band" x="40" y="28" width="640" height="34" rx="14" fill="#e6ecf6" />
  <rect class="band" x="40" y="50" width="640" height="12" rx="0" fill="#e6ecf6" />
  <circle class="faint-f" cx="62" cy="45" r="4.5" fill="#94a3b8" />
  <circle class="faint-f" cx="80" cy="45" r="4.5" fill="#94a3b8" />
  <circle class="faint-f" cx="98" cy="45" r="4.5" fill="#94a3b8" />
  <rect class="surface" x="120" y="37" width="300" height="17" rx="8" fill="#ffffff" />
  <text class="muted-f mono" x="132" y="50" fill="#526173" font-size="11">example.com/article</text>
  <text class="title-f" x="72" y="106" fill="#20242c" font-size="17" font-weight="700" opacity="0.35">How the fees are calculated</text>
  <rect class="band" x="72" y="136" width="560" height="7" rx="3.5" fill="#e6ecf6" />
  <rect class="band" x="72" y="154" width="520" height="7" rx="3.5" fill="#e6ecf6" />
  <rect class="band" x="72" y="172" width="574" height="7" rx="3.5" fill="#e6ecf6" />
  <rect class="band" x="72" y="190" width="300" height="7" rx="3.5" fill="#e6ecf6" />
  <rect class="surface edge-s" x="56" y="236" width="608" height="132" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="title-f" x="80" y="266" fill="#20242c" font-size="16" font-weight="700">We value your privacy</text>
  <text class="muted-f" x="80" y="290" fill="#526173" font-size="12">We and 412 partners want to store and access</text>
  <text class="muted-f" x="80" y="306" fill="#526173" font-size="12">information on your device to personalise</text>
  <text class="muted-f" x="80" y="322" fill="#526173" font-size="12">advertising and measure our audience.</text>
  <rect class="ink-f" x="452" y="278" width="188" height="52" rx="8" fill="#2563eb" />
  <text class="ink-t" x="546" y="309.76" fill="#ffffff" font-size="16" font-weight="600" text-anchor="middle">Accept all</text>
  <text class="faint-f" x="80" y="350" fill="#94a3b8" font-size="9" opacity="0.55">Manage options</text>
</svg>
