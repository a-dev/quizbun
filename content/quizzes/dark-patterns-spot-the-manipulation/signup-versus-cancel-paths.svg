<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330">
  <style>
    svg {
      --panel: #f5f7fb;
      --surface: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #cbd5e1;
      --strong: #64748b;
      --ink: #2563eb;
      --ink-text: #ffffff;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
      --faint: #94a3b8;
      --good-fill: #d9f2e6;
      --bad-fill: #fde8e8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --surface: #232a34;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #3a4553;
        --strong: #8b9bb4;
        --ink: #7aa2f7;
        --ink-text: #101720;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #2b3441;
        --faint: #6b7a8f;
        --good-fill: #21382f;
        --bad-fill: #3a2528;
      }
    }
    .panel { fill: var(--panel); }
    .surface { fill: var(--surface); }
    .band { fill: var(--band); }
    .title-f { fill: var(--title); }
    .muted-f { fill: var(--muted); }
    .faint-f { fill: var(--faint); }
    .ink-f { fill: var(--ink); }
    .ink-t { fill: var(--ink-text); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    .good-fill { fill: var(--good-fill); }
    .bad-fill { fill: var(--bad-fill); }
    .edge-s { stroke: var(--edge); }
    .strong-s { stroke: var(--strong); }
    .ink-s { stroke: var(--ink); }
    .bad-s { stroke: var(--bad); }
    .good-s { stroke: var(--good); }
    .muted-s { stroke: var(--muted); }
    .faint-s { stroke: var(--faint); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="330" rx="20" fill="#f5f7fb" />
  <text class="title-f" x="40" y="52" fill="#20242c" font-size="15" font-weight="700">Subscribing</text>
  <rect class="surface edge-s" x="40" y="66" width="180" height="54" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="title-f" x="130" y="89" fill="#20242c" font-size="13" font-weight="700" text-anchor="middle">Start free trial</text>
  <text class="muted-f" x="130" y="108" fill="#526173" font-size="11" text-anchor="middle">1 click</text>
  <defs><marker id="s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#526173" /></marker></defs>
  <line class="muted-s" x1="228" y1="93" x2="266" y2="93" stroke="#526173" stroke-width="1.6" marker-end="url(#s1)" />
  <rect class="good-fill good-s" x="276" y="66" width="160" height="54" rx="10" fill="#d9f2e6" stroke="#0f766e" stroke-width="1.5" />
  <text class="title-f" x="356" y="89" fill="#20242c" font-size="13" font-weight="700" text-anchor="middle">Subscribed</text>
  <text class="muted-f" x="356" y="108" fill="#526173" font-size="11" text-anchor="middle">immediately</text>
  <line class="edge-s" x1="40" y1="148" x2="680" y2="148" stroke="#cbd5e1" stroke-width="1" />
  <text class="title-f" x="40" y="178" fill="#20242c" font-size="15" font-weight="700">Cancelling</text>
  <rect class="bad-fill bad-s" x="40" y="194" width="132" height="66" rx="10" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5" />
  <text class="title-f" x="106" y="223" fill="#20242c" font-size="13" font-weight="700" text-anchor="middle">1. Account</text>
  <text class="muted-f" x="106" y="242" fill="#526173" font-size="11" text-anchor="middle">find the setting</text>
  <defs><marker id="c0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" /></marker></defs>
  <line class="bad-s" x1="178" y1="227" x2="200" y2="227" stroke="#dc2626" stroke-width="1.6" marker-end="url(#c0)" />
  <rect class="bad-fill bad-s" x="204" y="194" width="132" height="66" rx="10" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5" />
  <text class="title-f" x="270" y="223" fill="#20242c" font-size="13" font-weight="700" text-anchor="middle">2. Are you sure?</text>
  <text class="muted-f" x="270" y="242" fill="#526173" font-size="11" text-anchor="middle">remind me later</text>
  <defs><marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" /></marker></defs>
  <line class="bad-s" x1="342" y1="227" x2="364" y2="227" stroke="#dc2626" stroke-width="1.6" marker-end="url(#c1)" />
  <rect class="bad-fill bad-s" x="368" y="194" width="132" height="66" rx="10" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5" />
  <text class="title-f" x="434" y="223" fill="#20242c" font-size="13" font-weight="700" text-anchor="middle">3. Your benefits</text>
  <text class="muted-f" x="434" y="242" fill="#526173" font-size="11" text-anchor="middle">pause instead</text>
  <defs><marker id="c2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626" /></marker></defs>
  <line class="bad-s" x1="506" y1="227" x2="528" y2="227" stroke="#dc2626" stroke-width="1.6" marker-end="url(#c2)" />
  <rect class="bad-fill bad-s" x="532" y="194" width="132" height="66" rx="10" fill="#fde8e8" stroke="#dc2626" stroke-width="1.5" />
  <text class="title-f" x="598" y="223" fill="#20242c" font-size="13" font-weight="700" text-anchor="middle">4. Confirm</text>
  <text class="muted-f" x="598" y="242" fill="#526173" font-size="11" text-anchor="middle">yes, cancel</text>
  <text class="bad-f" x="40" y="296" fill="#dc2626" font-size="13" font-weight="600">4 pages · 6 clicks · 15 options, every one of them a chance to give up</text>
</svg>
