<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <style>
    svg {
      --panel: #f5f7fb;
      --surface: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #cbd5e1;
      --strong: #64748b;
      --ink: #2563eb;
      --ink-text: #ffffff;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
      --faint: #94a3b8;
      --good-fill: #d9f2e6;
      --bad-fill: #fde8e8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --surface: #232a34;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #3a4553;
        --strong: #8b9bb4;
        --ink: #7aa2f7;
        --ink-text: #101720;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #2b3441;
        --faint: #6b7a8f;
        --good-fill: #21382f;
        --bad-fill: #3a2528;
      }
    }
    .panel { fill: var(--panel); }
    .surface { fill: var(--surface); }
    .band { fill: var(--band); }
    .title-f { fill: var(--title); }
    .muted-f { fill: var(--muted); }
    .faint-f { fill: var(--faint); }
    .ink-f { fill: var(--ink); }
    .ink-t { fill: var(--ink-text); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    .good-fill { fill: var(--good-fill); }
    .bad-fill { fill: var(--bad-fill); }
    .edge-s { stroke: var(--edge); }
    .strong-s { stroke: var(--strong); }
    .ink-s { stroke: var(--ink); }
    .bad-s { stroke: var(--bad); }
    .good-s { stroke: var(--good); }
    .muted-s { stroke: var(--muted); }
    .faint-s { stroke: var(--faint); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="380" rx="20" fill="#f5f7fb" />
  <text class="title-f" x="44" y="30" fill="#20242c" font-size="15" font-weight="700">The same three plans, priced in one unit: US dollars per user per month</text>
  <rect class="surface edge-s" x="44" y="50" width="196" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="title-f" x="142" y="96" fill="#20242c" font-size="15" font-weight="700" text-anchor="middle">Starter</text>
  <text class="good-f mono" x="142" y="140" fill="#0f766e" font-size="28" font-weight="700" text-anchor="middle">$9.00</text>
  <text class="muted-f" x="142" y="160" fill="#526173" font-size="12" text-anchor="middle">per user / month</text>
  <text class="faint-f" x="142" y="180" fill="#94a3b8" font-size="10" text-anchor="middle">listed as $9 per user / month</text>
  <line class="edge-s" x1="64" y1="196" x2="220" y2="196" stroke="#cbd5e1" stroke-width="1" />
  <text class="muted-f" x="142" y="220" fill="#526173" font-size="12" text-anchor="middle">Collaborators: 5</text>
  <text class="muted-f" x="142" y="244" fill="#526173" font-size="12" text-anchor="middle">Storage: 2 GB</text>
  <text class="muted-f" x="142" y="268" fill="#526173" font-size="12" text-anchor="middle">Support: email</text>
  <rect class="good-fill" x="90" y="296" width="104" height="22" rx="11" fill="#d9f2e6" />
  <text class="good-f" x="142" y="311" fill="#0f766e" font-size="11" font-weight="700" text-anchor="middle">cheapest</text>
  <rect class="surface edge-s" x="262" y="50" width="196" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="title-f" x="360" y="96" fill="#20242c" font-size="15" font-weight="700" text-anchor="middle">Growth</text>
  <text class="title-f mono" x="360" y="140" fill="#20242c" font-size="28" font-weight="700" text-anchor="middle">$11.00</text>
  <text class="muted-f" x="360" y="160" fill="#526173" font-size="12" text-anchor="middle">per user / month</text>
  <text class="faint-f" x="360" y="180" fill="#94a3b8" font-size="10" text-anchor="middle">listed as $132 per user / year</text>
  <line class="edge-s" x1="282" y1="196" x2="438" y2="196" stroke="#cbd5e1" stroke-width="1" />
  <text class="muted-f" x="360" y="220" fill="#526173" font-size="12" text-anchor="middle">Collaborators: 20</text>
  <text class="muted-f" x="360" y="244" fill="#526173" font-size="12" text-anchor="middle">Storage: 50 GB</text>
  <text class="muted-f" x="360" y="268" fill="#526173" font-size="12" text-anchor="middle">Support: next business day</text>
  <rect class="surface edge-s" x="480" y="50" width="196" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="title-f" x="578" y="96" fill="#20242c" font-size="15" font-weight="700" text-anchor="middle">Scale</text>
  <text class="title-f mono" x="578" y="140" fill="#20242c" font-size="28" font-weight="700" text-anchor="middle">$12.78</text>
  <text class="muted-f" x="578" y="160" fill="#526173" font-size="12" text-anchor="middle">per user / month</text>
  <text class="faint-f" x="578" y="180" fill="#94a3b8" font-size="10" text-anchor="middle">listed as $0.42 per seat / day</text>
  <line class="edge-s" x1="500" y1="196" x2="656" y2="196" stroke="#cbd5e1" stroke-width="1" />
  <text class="muted-f" x="578" y="220" fill="#526173" font-size="12" text-anchor="middle">Collaborators: unlimited</text>
  <text class="muted-f" x="578" y="244" fill="#526173" font-size="12" text-anchor="middle">Storage: 500 GB</text>
  <text class="muted-f" x="578" y="268" fill="#526173" font-size="12" text-anchor="middle">Support: 24/7</text>
  <text class="muted-f" x="44" y="362" fill="#526173" font-size="12">Same unit, same feature wording, same order, no badge steering the eye.</text>
</svg>
