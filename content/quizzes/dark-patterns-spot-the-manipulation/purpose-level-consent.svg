<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <style>
    svg {
      --panel: #f5f7fb;
      --surface: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #cbd5e1;
      --strong: #64748b;
      --ink: #2563eb;
      --ink-text: #ffffff;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
      --faint: #94a3b8;
      --good-fill: #d9f2e6;
      --bad-fill: #fde8e8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --surface: #232a34;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #3a4553;
        --strong: #8b9bb4;
        --ink: #7aa2f7;
        --ink-text: #101720;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #2b3441;
        --faint: #6b7a8f;
        --good-fill: #21382f;
        --bad-fill: #3a2528;
      }
    }
    .panel { fill: var(--panel); }
    .surface { fill: var(--surface); }
    .band { fill: var(--band); }
    .title-f { fill: var(--title); }
    .muted-f { fill: var(--muted); }
    .faint-f { fill: var(--faint); }
    .ink-f { fill: var(--ink); }
    .ink-t { fill: var(--ink-text); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    .good-fill { fill: var(--good-fill); }
    .bad-fill { fill: var(--bad-fill); }
    .edge-s { stroke: var(--edge); }
    .strong-s { stroke: var(--strong); }
    .ink-s { stroke: var(--ink); }
    .bad-s { stroke: var(--bad); }
    .good-s { stroke: var(--good); }
    .muted-s { stroke: var(--muted); }
    .faint-s { stroke: var(--faint); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="420" rx="20" fill="#f5f7fb" />
  <rect class="surface edge-s" x="60" y="36" width="600" height="348" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="title-f" x="88" y="76" fill="#20242c" font-size="18" font-weight="700">Manage your preferences</text>
  <text class="muted-f" x="88" y="102" fill="#526173" font-size="12">Four purposes. All off until you turn one on.</text>
  <rect class="panel" x="88" y="118" width="544" height="38" rx="8" fill="#f5f7fb" />
  <text class="title-f" x="104" y="135" fill="#20242c" font-size="13" font-weight="600">Store information on your device</text>
  <text class="muted-f" x="104" y="149" fill="#526173" font-size="11">Required for the site to remember your choices</text>
  <rect class="band edge-s" x="578" y="127" width="38" height="21" rx="10.5" fill="#e6ecf6" stroke="#cbd5e1" stroke-width="1" />
  <circle class="surface" cx="588.5" cy="137.5" r="7.5" fill="#ffffff" />
  <rect class="panel" x="88" y="162" width="544" height="38" rx="8" fill="#f5f7fb" />
  <text class="title-f" x="104" y="179" fill="#20242c" font-size="13" font-weight="600">Personalised advertising</text>
  <text class="muted-f" x="104" y="193" fill="#526173" font-size="11">Builds a profile to select the ads you see</text>
  <rect class="band edge-s" x="578" y="171" width="38" height="21" rx="10.5" fill="#e6ecf6" stroke="#cbd5e1" stroke-width="1" />
  <circle class="surface" cx="588.5" cy="181.5" r="7.5" fill="#ffffff" />
  <rect class="panel" x="88" y="206" width="544" height="38" rx="8" fill="#f5f7fb" />
  <text class="title-f" x="104" y="223" fill="#20242c" font-size="13" font-weight="600">Audience measurement</text>
  <text class="muted-f" x="104" y="237" fill="#526173" font-size="11">Counts visits and reading time</text>
  <rect class="band edge-s" x="578" y="215" width="38" height="21" rx="10.5" fill="#e6ecf6" stroke="#cbd5e1" stroke-width="1" />
  <circle class="surface" cx="588.5" cy="225.5" r="7.5" fill="#ffffff" />
  <rect class="panel" x="88" y="250" width="544" height="38" rx="8" fill="#f5f7fb" />
  <text class="title-f" x="104" y="267" fill="#20242c" font-size="13" font-weight="600">Product development</text>
  <text class="muted-f" x="104" y="281" fill="#526173" font-size="11">Tests new features on a sample of visits</text>
  <rect class="band edge-s" x="578" y="259" width="38" height="21" rx="10.5" fill="#e6ecf6" stroke="#cbd5e1" stroke-width="1" />
  <circle class="surface" cx="588.5" cy="269.5" r="7.5" fill="#ffffff" />
  <text class="muted-f" x="88" y="314" fill="#526173" font-size="11">Legitimate interest is not used for advertising on this site.</text>
  <rect class="surface ink-s" x="88" y="326" width="200" height="44" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
  <text class="ink-f" x="188" y="353.04" fill="#2563eb" font-size="14" font-weight="600" text-anchor="middle">Reject all</text>
  <rect class="ink-f" x="300" y="326" width="200" height="44" rx="8" fill="#2563eb" />
  <text class="ink-t" x="400" y="353.04" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Accept all</text>
  <rect class="band" x="512" y="326" width="120" height="44" rx="8" fill="#e6ecf6" />
  <text class="muted-f" x="572" y="353.04" fill="#526173" font-size="14" font-weight="600" text-anchor="middle">Save</text>
</svg>
