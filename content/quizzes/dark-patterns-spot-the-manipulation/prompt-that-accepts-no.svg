<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <style>
    svg {
      --panel: #f5f7fb;
      --surface: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #cbd5e1;
      --strong: #64748b;
      --ink: #2563eb;
      --ink-text: #ffffff;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
      --faint: #94a3b8;
      --good-fill: #d9f2e6;
      --bad-fill: #fde8e8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --surface: #232a34;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #3a4553;
        --strong: #8b9bb4;
        --ink: #7aa2f7;
        --ink-text: #101720;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #2b3441;
        --faint: #6b7a8f;
        --good-fill: #21382f;
        --bad-fill: #3a2528;
      }
    }
    .panel { fill: var(--panel); }
    .surface { fill: var(--surface); }
    .band { fill: var(--band); }
    .title-f { fill: var(--title); }
    .muted-f { fill: var(--muted); }
    .faint-f { fill: var(--faint); }
    .ink-f { fill: var(--ink); }
    .ink-t { fill: var(--ink-text); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    .good-fill { fill: var(--good-fill); }
    .bad-fill { fill: var(--bad-fill); }
    .edge-s { stroke: var(--edge); }
    .strong-s { stroke: var(--strong); }
    .ink-s { stroke: var(--ink); }
    .bad-s { stroke: var(--bad); }
    .good-s { stroke: var(--good); }
    .muted-s { stroke: var(--muted); }
    .faint-s { stroke: var(--faint); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="300" rx="20" fill="#f5f7fb" />
  <rect class="surface edge-s" x="130" y="32" width="460" height="176" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="title-f" x="162" y="74" fill="#20242c" font-size="16" font-weight="700">Turn on notifications?</text>
  <text class="muted-f" x="162" y="100" fill="#526173" font-size="12">We will tell you when this order ships.</text>
  <text class="muted-f" x="162" y="118" fill="#526173" font-size="12">Nothing else, and you can switch it off later.</text>
  <rect class="ink-f" x="162" y="140" width="124" height="40" rx="8" fill="#2563eb" />
  <text class="ink-t" x="224" y="165.04" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Allow</text>
  <rect class="band" x="298" y="140" width="124" height="40" rx="8" fill="#e6ecf6" />
  <text class="muted-f" x="360" y="165.04" fill="#526173" font-size="14" font-weight="600" text-anchor="middle">Not now</text>
  <rect class="surface ink-s" x="434" y="140" width="124" height="40" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
  <text class="ink-f" x="496" y="165.04" fill="#2563eb" font-size="14" font-weight="600" text-anchor="middle">Never</text>
  <text class="title-f" x="64" y="246" fill="#20242c" font-size="13">Asked once, straight after an order is placed, because that is when it is useful.</text>
  <text class="muted-f" x="64" y="270" fill="#526173" font-size="13">"Never" is stored, so the prompt does not come back.</text>
</svg>
