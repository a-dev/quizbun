<svg xmlns="http://www.w3.org/2000/svg" width="720" height="420" viewBox="0 0 720 420">
  <style>
    svg {
      --panel: #f5f7fb;
      --surface: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #cbd5e1;
      --strong: #64748b;
      --ink: #2563eb;
      --ink-text: #ffffff;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
      --faint: #94a3b8;
      --good-fill: #d9f2e6;
      --bad-fill: #fde8e8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --surface: #232a34;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #3a4553;
        --strong: #8b9bb4;
        --ink: #7aa2f7;
        --ink-text: #101720;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #2b3441;
        --faint: #6b7a8f;
        --good-fill: #21382f;
        --bad-fill: #3a2528;
      }
    }
    .panel { fill: var(--panel); }
    .surface { fill: var(--surface); }
    .band { fill: var(--band); }
    .title-f { fill: var(--title); }
    .muted-f { fill: var(--muted); }
    .faint-f { fill: var(--faint); }
    .ink-f { fill: var(--ink); }
    .ink-t { fill: var(--ink-text); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    .good-fill { fill: var(--good-fill); }
    .bad-fill { fill: var(--bad-fill); }
    .edge-s { stroke: var(--edge); }
    .strong-s { stroke: var(--strong); }
    .ink-s { stroke: var(--ink); }
    .bad-s { stroke: var(--bad); }
    .good-s { stroke: var(--good); }
    .muted-s { stroke: var(--muted); }
    .faint-s { stroke: var(--faint); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="420" rx="20" fill="#f5f7fb" />
  <rect class="surface edge-s" x="110" y="36" width="500" height="348" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="title-f" x="142" y="76" fill="#20242c" font-size="18" font-weight="700">Create your account</text>
  <text class="muted-f" x="142" y="100" fill="#526173" font-size="12" font-weight="600">Email address</text>
  <rect class="panel edge-s" x="142" y="108" width="436" height="30" rx="7" fill="#f5f7fb" stroke="#cbd5e1" stroke-width="1" />
  <text class="faint-f" x="153" y="128" fill="#94a3b8" font-size="13">you@example.com</text>
  <text class="muted-f" x="142" y="152" fill="#526173" font-size="12" font-weight="600">Password</text>
  <rect class="panel edge-s" x="142" y="160" width="436" height="30" rx="7" fill="#f5f7fb" stroke="#cbd5e1" stroke-width="1" />
  <text class="faint-f" x="153" y="180" fill="#94a3b8" font-size="13">••••••••••</text>
  <line class="edge-s" x1="142" y1="206" x2="578" y2="206" stroke="#cbd5e1" stroke-width="1" />
  <rect class="ink-f" x="142" y="222" width="17" height="17" rx="4" fill="#2563eb" />
  <path class="ink-t" d="M 146 230.5 L 150 234 L 155.5 226.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title-f" x="171" y="235" fill="#20242c" font-size="13">Send me product news and offers</text>
  <rect class="ink-f" x="142" y="254" width="17" height="17" rx="4" fill="#2563eb" />
  <path class="ink-t" d="M 146 262.5 L 150 266 L 155.5 258.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title-f" x="171" y="267" fill="#20242c" font-size="13">Share my details with selected partners</text>
  <rect class="surface strong-s" x="142" y="286" width="17" height="17" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="title-f" x="171" y="299" fill="#20242c" font-size="13">I agree to the Terms of Service</text>
  <rect class="ink-f" x="142" y="324" width="436" height="42" rx="8" fill="#2563eb" />
  <text class="ink-t" x="360" y="350.04" fill="#ffffff" font-size="14" font-weight="600" text-anchor="middle">Create account</text>
</svg>
