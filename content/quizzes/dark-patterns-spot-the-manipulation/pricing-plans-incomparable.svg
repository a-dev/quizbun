<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <style>
    svg {
      --panel: #f5f7fb;
      --surface: #ffffff;
      --title: #20242c;
      --muted: #526173;
      --edge: #cbd5e1;
      --strong: #64748b;
      --ink: #2563eb;
      --ink-text: #ffffff;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
      --faint: #94a3b8;
      --good-fill: #d9f2e6;
      --bad-fill: #fde8e8;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --surface: #232a34;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #3a4553;
        --strong: #8b9bb4;
        --ink: #7aa2f7;
        --ink-text: #101720;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #2b3441;
        --faint: #6b7a8f;
        --good-fill: #21382f;
        --bad-fill: #3a2528;
      }
    }
    .panel { fill: var(--panel); }
    .surface { fill: var(--surface); }
    .band { fill: var(--band); }
    .title-f { fill: var(--title); }
    .muted-f { fill: var(--muted); }
    .faint-f { fill: var(--faint); }
    .ink-f { fill: var(--ink); }
    .ink-t { fill: var(--ink-text); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    .good-fill { fill: var(--good-fill); }
    .bad-fill { fill: var(--bad-fill); }
    .edge-s { stroke: var(--edge); }
    .strong-s { stroke: var(--strong); }
    .ink-s { stroke: var(--ink); }
    .bad-s { stroke: var(--bad); }
    .good-s { stroke: var(--good); }
    .muted-s { stroke: var(--muted); }
    .faint-s { stroke: var(--faint); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="380" rx="20" fill="#f5f7fb" />
  <rect class="surface edge-s" x="44" y="44" width="196" height="288" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="title-f" x="142" y="92" fill="#20242c" font-size="15" font-weight="700" text-anchor="middle">Starter</text>
  <text class="title-f mono" x="142" y="136" fill="#20242c" font-size="30" font-weight="700" text-anchor="middle">$9</text>
  <text class="muted-f" x="142" y="158" fill="#526173" font-size="12" text-anchor="middle">per user / month</text>
  <text class="faint-f" x="142" y="176" fill="#94a3b8" font-size="11" text-anchor="middle">billed annually</text>
  <line class="edge-s" x1="64" y1="194" x2="220" y2="194" stroke="#cbd5e1" stroke-width="1" />
  <text class="muted-f" x="142" y="218" fill="#526173" font-size="12" text-anchor="middle">Up to 5 collaborators</text>
  <text class="muted-f" x="142" y="242" fill="#526173" font-size="12" text-anchor="middle">2 GB storage</text>
  <text class="muted-f" x="142" y="266" fill="#526173" font-size="12" text-anchor="middle">Email support</text>
  <rect class="band" x="68" y="292" width="148" height="34" rx="8" fill="#e6ecf6" />
  <text class="muted-f" x="142" y="313.32" fill="#526173" font-size="12" font-weight="600" text-anchor="middle">Choose</text>
  <rect class="surface ink-s" x="262" y="44" width="196" height="288" rx="14" fill="#ffffff" stroke="#2563eb" stroke-width="2.5" />
  <rect class="ink-f" x="308" y="32" width="104" height="24" rx="12" fill="#2563eb" />
  <text class="ink-t" x="360" y="48" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Most popular</text>
  <text class="title-f" x="360" y="92" fill="#20242c" font-size="15" font-weight="700" text-anchor="middle">Growth</text>
  <text class="title-f mono" x="360" y="136" fill="#20242c" font-size="30" font-weight="700" text-anchor="middle">$132</text>
  <text class="muted-f" x="360" y="158" fill="#526173" font-size="12" text-anchor="middle">per user / year</text>
  <text class="faint-f" x="360" y="176" fill="#94a3b8" font-size="11" text-anchor="middle">billed annually</text>
  <line class="edge-s" x1="282" y1="194" x2="438" y2="194" stroke="#cbd5e1" stroke-width="1" />
  <text class="muted-f" x="360" y="218" fill="#526173" font-size="12" text-anchor="middle">Team size: small</text>
  <text class="muted-f" x="360" y="242" fill="#526173" font-size="12" text-anchor="middle">Storage: generous</text>
  <text class="muted-f" x="360" y="266" fill="#526173" font-size="12" text-anchor="middle">Priority support</text>
  <rect class="ink-f" x="286" y="292" width="148" height="34" rx="8" fill="#2563eb" />
  <text class="ink-t" x="360" y="313.32" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Choose</text>
  <rect class="surface edge-s" x="480" y="44" width="196" height="288" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="title-f" x="578" y="92" fill="#20242c" font-size="15" font-weight="700" text-anchor="middle">Scale</text>
  <text class="title-f mono" x="578" y="136" fill="#20242c" font-size="30" font-weight="700" text-anchor="middle">$0.42</text>
  <text class="muted-f" x="578" y="158" fill="#526173" font-size="12" text-anchor="middle">per seat / day</text>
  <text class="faint-f" x="578" y="176" fill="#94a3b8" font-size="11" text-anchor="middle">billed monthly</text>
  <line class="edge-s" x1="500" y1="194" x2="656" y2="194" stroke="#cbd5e1" stroke-width="1" />
  <text class="muted-f" x="578" y="218" fill="#526173" font-size="12" text-anchor="middle">Unlimited seats*</text>
  <text class="muted-f" x="578" y="242" fill="#526173" font-size="12" text-anchor="middle">500 GB pooled</text>
  <text class="muted-f" x="578" y="266" fill="#526173" font-size="12" text-anchor="middle">24/7 support</text>
  <rect class="band" x="504" y="292" width="148" height="34" rx="8" fill="#e6ecf6" />
  <text class="muted-f" x="578" y="313.32" fill="#526173" font-size="12" font-weight="600" text-anchor="middle">Choose</text>
  <text class="faint-f" x="44" y="362" fill="#94a3b8" font-size="10">* fair-use limits apply</text>
</svg>
