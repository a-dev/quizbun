<svg xmlns="http://www.w3.org/2000/svg" width="720" height="586" viewBox="0 0 720 586">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-fill: #e8ecf3;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-fill: #20262e;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-text: #fdba74;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .dead { fill: var(--dead-fill); stroke: var(--dead-text); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
  </style>
  <rect class="panel" width="720" height="586" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Twice a year, local time stops being a number line</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">New York, 2026. One hour is missing in March and one hour happens twice in November.</text>
  <rect class="card" x="36" y="88" width="316" height="250" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="accent-text" x="54" y="114" fill="#9a3412" font-family="system-ui, sans-serif" font-size="13" font-weight="700">8 March — the gap</text>
  <text class="dead-text" x="54" y="138" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.5">local wall clock</text>
  <rect class="card" x="54" y="148" width="50" height="34" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="79" y="170" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">00:00</text>
  <rect class="card" x="110" y="148" width="50" height="34" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="135" y="170" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">01:00</text>
  <rect class="dead" x="166" y="148" width="50" height="34" rx="7" fill="#e8ecf3" stroke="#8a97a8" stroke-width="1.2" stroke-dasharray="3 3" />
  <text class="dead-text" x="191" y="170" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">02:00</text>
  <rect class="card" x="222" y="148" width="50" height="34" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="247" y="170" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">03:00</text>
  <rect class="card" x="278" y="148" width="50" height="34" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="303" y="170" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">04:00</text>
  <text class="accent-text" x="166" y="200" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">never happens</text>
  <text class="accent-text" x="54" y="226" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">2026-03-08T02:30</text>
  <text class="accent-text" x="190" y="226" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">matches zero instants.</text>
  <text class="muted" x="54" y="250" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">compatible</text>
  <text class="muted" x="140" y="250" fill="#526173" font-family="system-ui, sans-serif" font-size="10">the default — pushes forward to 03:30 EDT</text>
  <text class="muted" x="54" y="268" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">earlier</text>
  <text class="muted" x="140" y="268" fill="#526173" font-family="system-ui, sans-serif" font-size="10">picks the instant before the gap</text>
  <text class="muted" x="54" y="286" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">later</text>
  <text class="muted" x="140" y="286" fill="#526173" font-family="system-ui, sans-serif" font-size="10">picks the instant after it</text>
  <text class="muted" x="54" y="304" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">reject</text>
  <text class="muted" x="140" y="304" fill="#526173" font-family="system-ui, sans-serif" font-size="10">throws instead of guessing</text>
  <text class="accent-text" x="54" y="330" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">That day has hoursInDay 23.</text>
  <rect class="card" x="368" y="88" width="316" height="250" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="info-text" x="386" y="114" fill="#172554" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1 November — the overlap</text>
  <text class="dead-text" x="386" y="138" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.5">local wall clock</text>
  <rect class="card" x="386" y="148" width="50" height="34" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="411" y="170" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">00:00</text>
  <rect class="info-box" x="442" y="148" width="50" height="34" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="467" y="170" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">01:00</text>
  <rect class="info-box" x="498" y="148" width="50" height="34" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="523" y="170" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">01:00</text>
  <rect class="card" x="554" y="148" width="50" height="34" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="579" y="170" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">02:00</text>
  <rect class="card" x="610" y="148" width="50" height="34" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="635" y="170" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700" text-anchor="middle">03:00</text>
  <text class="info-text" x="498" y="200" fill="#172554" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">the same hour, twice</text>
  <text class="info-text" x="386" y="226" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">01:15 EDT is 05:15Z; 01:45 EST is 06:45Z — so two log</text>
  <text class="info-text" x="386" y="242" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">lines 30 minutes apart on the clock are 90 apart in fact.</text>
  <text class="muted" x="386" y="268" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" font-weight="700">2026-11-01T01:30:00-04:00[America/New_York]</text>
  <text class="muted" x="386" y="284" fill="#526173" font-family="system-ui, sans-serif" font-size="10">RFC 9557 carries both: the zone gives the rules, and the</text>
  <text class="muted" x="386" y="300" fill="#526173" font-family="system-ui, sans-serif" font-size="10">offset says which of the two 01:30s was meant.</text>
  <text class="info-text" x="386" y="330" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">That day has hoursInDay 25.</text>
  <rect class="card" x="36" y="356" width="648" height="122" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="382" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">What that does to arithmetic you thought was safe</text>
  <text class="accent-text" x="54" y="406" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">midnight + 86,400,000 ms</text>
  <text class="muted" x="250" y="406" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">lands on 01:00 the next day — 24 hours of elapsed time, 25 hours of wall clock</text>
  <text class="accent-text" x="54" y="424" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">09:00 Mar 7 → 09:00 Mar 8</text>
  <text class="muted" x="250" y="424" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">is 23 hours apart, because one of them went missing</text>
  <text class="accent-text" x="54" y="442" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">22:00 Oct 31 → 06:00 Nov 1</text>
  <text class="muted" x="250" y="442" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">is a 9-hour night shift, because 01:00 came round twice</text>
  <text class="accent-text" x="54" y="460" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">startOfDay()</text>
  <text class="muted" x="250" y="460" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">exists because a day does not always begin at 00:00 — some zones skip it entirely</text>
  <rect class="info-box" x="36" y="494" width="648" height="62" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="54" y="518" fill="#172554" font-family="system-ui, sans-serif" font-size="11">Add a day, not 24 hours. Calendar arithmetic asks the zone what “tomorrow at 09:00” means; millisecond arithmetic</text>
  <text class="info-text" x="54" y="538" fill="#172554" font-family="system-ui, sans-serif" font-size="11">cannot, because it has no idea a rule changed. The same split explains why P1M and PT1M are a month and a minute.</text>
</svg>
