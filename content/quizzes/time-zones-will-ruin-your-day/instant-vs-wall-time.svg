<svg xmlns="http://www.w3.org/2000/svg" width="720" height="594" viewBox="0 0 720 594">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
  </style>
  <rect class="panel" width="720" height="594" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">An instant, an offset and a zone are three different things</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Only one of them is a fact about the universe. The other two are facts about a government.</text>
  <rect class="card" x="36" y="88" width="316" height="288" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <rect class="good-box" x="54" y="108" width="280" height="78" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="68" y="130" fill="#14532d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">instant</text>
  <text class="good-text" x="320" y="130" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="end">1767225600000</text>
  <text class="good-text" x="68" y="148" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5">Milliseconds since 1970-01-01T00:00:00Z.</text>
  <text class="good-text" x="68" y="162" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5">One absolute point. No zone, no calendar,</text>
  <text class="good-text" x="68" y="176" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5">nothing to disagree about.</text>
  <rect class="info-box" x="54" y="200" width="280" height="78" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="68" y="222" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700">offset</text>
  <text class="info-text" x="320" y="222" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="end">-04:00</text>
  <text class="info-text" x="68" y="240" fill="#172554" font-family="system-ui, sans-serif" font-size="9.5">A number that was true at one instant.</text>
  <text class="info-text" x="68" y="254" fill="#172554" font-family="system-ui, sans-serif" font-size="9.5">It tells you the shift, not the rules,</text>
  <text class="info-text" x="68" y="268" fill="#172554" font-family="system-ui, sans-serif" font-size="9.5">dozens of places share it every July.</text>
  <rect class="accent-box" x="54" y="292" width="280" height="78" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="68" y="314" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12" font-weight="700">IANA zone</text>
  <text class="accent-text" x="320" y="314" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700" text-anchor="end">America/New_York</text>
  <text class="accent-text" x="68" y="332" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5">A rulebook: which offset applies when,</text>
  <text class="accent-text" x="68" y="346" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5">past and future, rewritten whenever a</text>
  <text class="accent-text" x="68" y="360" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5">government changes the law.</text>
  <rect class="card" x="368" y="88" width="316" height="288" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="386" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" font-weight="700">What to store, and why</text>
  <text class="muted" x="386" y="140" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">a log line, a past event</text>
  <text class="good-text" x="386" y="157" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">the instant, in UTC</text>
  <text class="muted" x="386" y="173" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5">It already happened. No rule change can move it.</text>
  <text class="muted" x="386" y="198" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">a meeting at 09:00 next year</text>
  <text class="accent-text" x="386" y="215" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">wall time + IANA zone</text>
  <text class="muted" x="386" y="231" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5">The rules may change before the day arrives.</text>
  <text class="muted" x="386" y="256" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">a date of birth</text>
  <text class="info-text" x="386" y="273" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">a plain calendar date</text>
  <text class="muted" x="386" y="289" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5">No time, no zone. It is not an instant at all.</text>
  <text class="muted" x="386" y="314" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">a weekly recurring event</text>
  <text class="accent-text" x="386" y="331" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">wall time + IANA zone</text>
  <text class="muted" x="386" y="347" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5">Exactly what iCalendar stores, so 09:00 stays 09:00.</text>
  <rect class="card" x="36" y="392" width="648" height="172" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="418" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Five places the distinction bites</text>
  <text class="accent-text" x="54" y="442" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">a JS Date</text>
  <text class="muted" x="238" y="442" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">holds one number and no zone; the local time you see comes from the host, not the value</text>
  <text class="accent-text" x="54" y="464" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">EST vs America/New_York</text>
  <text class="muted" x="238" y="464" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">EST is a fixed −05:00 that never observes DST; the zone switches twice a year</text>
  <text class="accent-text" x="54" y="486" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">Etc/GMT+5</text>
  <text class="muted" x="238" y="486" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">is actually UTC−05:00: the POSIX convention inverts the sign, and the tz database kept it</text>
  <text class="accent-text" x="54" y="508" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">an offset is not a zone</text>
  <text class="muted" x="238" y="508" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">−04:00 in July fits New York, Toronto and dozens of others; it names no rules</text>
  <text class="accent-text" x="54" y="530" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">a 2023 meeting</text>
  <text class="muted" x="238" y="530" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">stored as a UTC instant fired an hour late for Mexican attendees once Mexico dropped DST</text>
  <text class="muted" x="54" y="556" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">The instant was still correct in that last case. The intention, nine in the morning where they live, was not.</text>
</svg>
