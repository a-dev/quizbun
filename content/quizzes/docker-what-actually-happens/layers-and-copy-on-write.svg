<svg xmlns="http://www.w3.org/2000/svg" width="720" height="510" viewBox="0 0 720 510">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ok-fill: #dcfce7;
      --ok-edge: #16a34a;
      --ok-text: #14532d;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ok-fill: #14321f;
        --ok-edge: #4ade80;
        --ok-text: #bbf7d0;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .ok-box { fill: var(--ok-fill); stroke: var(--ok-edge); }
    .ok-text { fill: var(--ok-text); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <rect class="panel" width="720" height="510" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Where a container's bytes actually live
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    One thin writable layer, stacked on image layers that never change.
  </text>

  <g font-family="system-ui, sans-serif">
    <rect class="accent-box" x="36" y="92" width="330" height="42" rx="9" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="201" y="112" fill="#9a3412" font-size="13" font-weight="700" text-anchor="middle">container writable layer</text>
    <text class="accent-text" x="201" y="127" fill="#9a3412" font-size="10.5" text-anchor="middle">read-write, and unique to this container</text>

    <rect class="card" x="36" y="140" width="330" height="32" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="201" y="161" fill="#20242c" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">COPY . /app</text>
    <rect class="card" x="36" y="176" width="330" height="32" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="201" y="197" fill="#20242c" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">RUN npm ci</text>
    <rect class="card" x="36" y="212" width="330" height="32" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="201" y="233" fill="#20242c" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">COPY package.json /app/</text>
    <rect class="card" x="36" y="248" width="330" height="32" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="201" y="269" fill="#20242c" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">FROM node:22-slim</text>

    <text class="muted" x="201" y="298" fill="#526173" font-size="11.5" text-anchor="middle" font-weight="700">read-only image layers, shared by every container</text>

    <text class="title" x="384" y="104" fill="#20242c" font-size="12.5" font-weight="700">Writing a file that came from the image</text>
    <text class="muted" x="384" y="121" fill="#526173" font-size="11.5">It is copied up into the top layer first, and</text>
    <text class="muted" x="384" y="137" fill="#526173" font-size="11.5">the read-only layer beneath is untouched.</text>

    <text class="title" x="384" y="166" fill="#20242c" font-size="12.5" font-weight="700">Changing one byte of a huge file</text>
    <text class="muted" x="384" y="183" fill="#526173" font-size="11.5">OverlayFS copies the whole file up before the</text>
    <text class="muted" x="384" y="199" fill="#526173" font-size="11.5">write — slow, and it costs that much disk.</text>

    <text class="title" x="384" y="228" fill="#20242c" font-size="12.5" font-weight="700">Deleting something in a later RUN</text>
    <text class="muted" x="384" y="245" fill="#526173" font-size="11.5">The earlier layer still carries the bytes; the</text>
    <text class="muted" x="384" y="261" fill="#526173" font-size="11.5">delete only records a whiteout above them.</text>

    <text class="title" x="384" y="290" fill="#20242c" font-size="12.5" font-weight="700">Removing the container</text>
    <text class="muted" x="384" y="307" fill="#526173" font-size="11.5">The writable layer goes with it. Whatever a</text>
    <text class="muted" x="384" y="323" fill="#526173" font-size="11.5">database wrote there is simply gone.</text>

    <text class="title" x="36" y="360" fill="#20242c" font-size="15" font-weight="700">Which is why anything that must survive gets mounted instead</text>

    <rect class="ok-box" x="36" y="372" width="208" height="110" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ok-text" x="52" y="396" fill="#14532d" font-size="13" font-weight="700">Named volume</text>
    <text class="ok-text" x="52" y="416" fill="#14532d" font-size="11">Outlives the container that</text>
    <text class="ok-text" x="52" y="432" fill="#14532d" font-size="11">used it — removing that</text>
    <text class="ok-text" x="52" y="448" fill="#14532d" font-size="11">container leaves it intact. A</text>
    <text class="ok-text" x="52" y="464" fill="#14532d" font-size="11">new empty one is seeded from</text>
    <text class="ok-text" x="52" y="475" fill="#14532d" font-size="11">the image directory it covers.</text>

    <rect class="info-box" x="256" y="372" width="208" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="272" y="396" fill="#172554" font-size="13" font-weight="700">Bind mount</text>
    <text class="info-text" x="272" y="416" fill="#172554" font-size="11">The host path wins: it hides</text>
    <text class="info-text" x="272" y="432" fill="#172554" font-size="11">whatever the image had at</text>
    <text class="info-text" x="272" y="448" fill="#172554" font-size="11">that path for as long as it</text>
    <text class="info-text" x="272" y="464" fill="#172554" font-size="11">is mounted. Read-write by</text>
    <text class="info-text" x="272" y="475" fill="#172554" font-size="11">default.</text>

    <rect class="accent-box" x="476" y="372" width="208" height="110" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="492" y="396" fill="#9a3412" font-size="13" font-weight="700">tmpfs mount</text>
    <text class="accent-text" x="492" y="416" fill="#9a3412" font-size="11">Lives in host memory only.</text>
    <text class="accent-text" x="492" y="432" fill="#9a3412" font-size="11">Nothing reaches the disk,</text>
    <text class="accent-text" x="492" y="448" fill="#9a3412" font-size="11">and the contents vanish</text>
    <text class="accent-text" x="492" y="464" fill="#9a3412" font-size="11">the moment the container</text>
    <text class="accent-text" x="492" y="475" fill="#9a3412" font-size="11">stops.</text>
  </g>
</svg>
