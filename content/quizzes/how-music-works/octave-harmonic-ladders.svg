  <text class="title" x="40" y="175" font-size="13" font-weight="600" fill="#20242c">A4 · 440 Hz</text>
  <path class="edge" d="M150 170L690 170" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
