  <text class="muted" x="690" y="252" text-anchor="middle" font-size="11" fill="#526173">2000 Hz</text>
  <text class="title" x="360" y="278" text-anchor="middle" font-size="13" fill="#20242c">every harmonic of A4 (dashed links) is also a harmonic of A3</text>
</svg>
