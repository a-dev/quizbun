<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme. Presentation attributes stay as the light fallback. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --ok: #15803d;
      --bad: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
        --ok: #4ade80;
        --bad: #f87171;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .edgef { fill: var(--edge); }
    .card { fill: var(--card); }
    .a1 { stroke: var(--accent1); }
    .a1f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2f { fill: var(--accent2); }
    .ok { stroke: var(--ok); }
    .okf { fill: var(--ok); }
    .bad { stroke: var(--bad); }
    .badf { fill: var(--bad); }
    .card { stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" x="0" y="0" width="720" height="280" rx="20" fill="#f5f7fb" />
  <text class="title" x="360" y="34" text-anchor="middle" font-size="14" fill="#20242c">the first six harmonics of a 100 Hz note, on a pitch (log) axis</text>
  <path class="a1" d="M60 150L60 196" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="60" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#20242c">1</text>
  <text class="muted" x="60" y="234" text-anchor="middle" font-size="11" fill="#526173">100 Hz</text>
  <path class="a1" d="M292.1 150L292.1 196" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="292.1" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#20242c">2</text>
  <text class="muted" x="292.1" y="234" text-anchor="middle" font-size="11" fill="#526173">200 Hz</text>
  <path class="a1" d="M427.9 150L427.9 196" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="427.9" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#20242c">3</text>
  <text class="muted" x="427.9" y="234" text-anchor="middle" font-size="11" fill="#526173">300 Hz</text>
  <path class="a1" d="M524.2 150L524.2 196" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="524.2" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#20242c">4</text>
  <text class="muted" x="524.2" y="234" text-anchor="middle" font-size="11" fill="#526173">400 Hz</text>
  <path class="a1" d="M598.9 150L598.9 196" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="598.9" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#20242c">5</text>
  <text class="muted" x="598.9" y="234" text-anchor="middle" font-size="11" fill="#526173">500 Hz</text>
  <path class="a1" d="M660 150L660 196" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="660" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#20242c">6</text>
  <text class="muted" x="660" y="234" text-anchor="middle" font-size="11" fill="#526173">600 Hz</text>
  <path class="a2" d="M63 140L63 130L289.1 130L289.1 140" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="a2f" x="176.1" y="122" text-anchor="middle" font-size="12" fill="#c2410c">octave 2:1</text>
  <path class="a2" d="M295.1 96L295.1 86L424.9 86L424.9 96" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="a2f" x="360" y="78" text-anchor="middle" font-size="12" fill="#c2410c">fifth 3:2</text>
  <path class="a2" d="M430.9 140L430.9 130L521.2 130L521.2 140" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="a2f" x="476.1" y="122" text-anchor="middle" font-size="12" fill="#c2410c">fourth 4:3</text>
  <path class="a2" d="M527.2 96L527.2 86L595.9 86L595.9 96" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="a2f" x="561.6" y="78" text-anchor="middle" font-size="12" fill="#c2410c">major third 5:4</text>
  <path class="a2" d="M601.9 140L601.9 130L657 130L657 140" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="a2f" x="629.5" y="122" text-anchor="middle" font-size="12" fill="#c2410c">minor third 6:5</text>
  <text class="title" x="360" y="266" text-anchor="middle" font-size="13" fill="#20242c">each step up the series is a smaller interval than the one before</text>
</svg>
