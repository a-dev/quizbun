  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme. Presentation attributes stay as the light fallback. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --ok: #15803d;
      --bad: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
        --ok: #4ade80;
        --bad: #f87171;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .edgef { fill: var(--edge); }
    .card { fill: var(--card); }
    .a1 { stroke: var(--accent1); }
    .a1f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2f { fill: var(--accent2); }
    .ok { stroke: var(--ok); }
    .okf { fill: var(--ok); }
    .bad { stroke: var(--bad); }
    .badf { fill: var(--bad); }
    .card { stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
  </style>

