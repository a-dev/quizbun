<svg xmlns="http://www.w3.org/2000/svg" width="720" height="250" viewBox="0 0 720 250">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme. Presentation attributes stay as the light fallback. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --ok: #15803d;
      --bad: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
        --ok: #4ade80;
        --bad: #f87171;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .edgef { fill: var(--edge); }
    .card { fill: var(--card); }
    .a1 { stroke: var(--accent1); }
    .a1f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2f { fill: var(--accent2); }
    .ok { stroke: var(--ok); }
    .okf { fill: var(--ok); }
    .bad { stroke: var(--bad); }
    .badf { fill: var(--bad); }
    .card { stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" x="0" y="0" width="720" height="250" rx="20" fill="#f5f7fb" />
  <text class="title" x="360" y="34" text-anchor="middle" font-size="14" fill="#20242c">the 13 equal-tempered notes from A3 to A4, on a plain hertz scale</text>
  <path class="edge" d="M50 130L670 130" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="a1" d="M50 112L50 148" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="50" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#20242c">A</text>
  <path class="a1" d="M86.9 112L86.9 148" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="86.9" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#20242c">A♯</text>
  <path class="a1" d="M125.9 112L125.9 148" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="125.9" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#20242c">B</text>
  <path class="a1" d="M167.3 112L167.3 148" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="167.3" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#20242c">C</text>
  <path class="a1" d="M211.2 112L211.2 148" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="211.2" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#20242c">C♯</text>
  <path class="a1" d="M257.6 112L257.6 148" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="257.6" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#20242c">D</text>
  <path class="a1" d="M306.8 112L306.8 148" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="306.8" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#20242c">D♯</text>
  <path class="a1" d="M359 112L359 148" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="359" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#20242c">E</text>
  <path class="a1" d="M414.2 112L414.2 148" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="414.2" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#20242c">F</text>
  <path class="a1" d="M472.7 112L472.7 148" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="472.7" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#20242c">F♯</text>
  <path class="a1" d="M534.7 112L534.7 148" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="534.7" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#20242c">G</text>
  <path class="a1" d="M600.4 112L600.4 148" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="600.4" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#20242c">G♯</text>
  <path class="a1" d="M670 112L670 148" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="title" x="670" y="104" text-anchor="middle" font-size="11" font-weight="600" fill="#20242c">A</text>
  <path class="a2" d="M50 160L50 168L86.9 168L86.9 160" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="a2f" x="68.4" y="186" text-anchor="middle" font-size="11" fill="#c2410c">13.1 Hz</text>
  <path class="a2" d="M600.4 160L600.4 168L670 168L670 160" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="a2f" x="635.2" y="186" text-anchor="middle" font-size="11" fill="#c2410c">24.7 Hz</text>
  <text class="muted" x="50" y="208" text-anchor="middle" font-size="11" fill="#526173">220 Hz</text>
  <text class="muted" x="670" y="208" text-anchor="middle" font-size="11" fill="#526173">440 Hz</text>
  <text class="title" x="360" y="236" text-anchor="middle" font-size="13" fill="#20242c">every step multiplies by the same 1.0595, so the gaps in hertz keep growing</text>
</svg>
