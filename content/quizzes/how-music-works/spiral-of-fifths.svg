  <text class="a2f" x="395.6" y="87.3" font-size="12" font-weight="700" fill="#c2410c">12 · B♯</text>
  <path class="a2" d="M360 220L381.6 95.3" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 3" />
  <text class="a2f" x="342.8" y="155.7" text-anchor="middle" font-size="20" font-weight="700" fill="#c2410c">?</text>
  <text class="muted" x="360" y="488" text-anchor="middle" font-size="12" fill="#526173">angle = pitch within the octave · distance from center = fifths stacked</text>
</svg>
