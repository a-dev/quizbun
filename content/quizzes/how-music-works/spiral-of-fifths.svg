  <path class="edge" d="M375 244L455 105.5" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 5" opacity="0.5" />
  <path class="edge" d="M386 255L524.5 175" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 5" opacity="0.5" />
  <path class="edge" d="M390 270L550 270" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 5" opacity="0.5" />
