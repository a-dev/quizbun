  <path class="edge" d="M375 296L455 434.5" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 5" opacity="0.5" />
  <path class="edge" d="M360 300L360 460" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 5" opacity="0.5" />
  <path class="edge" d="M345 296L265 434.5" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 5" opacity="0.5" />
  <path class="edge" d="M334 285L195.5 365" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 5" opacity="0.5" />
  <path class="edge" d="M330 270L170 270" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 5" opacity="0.5" />
  <path class="edge" d="M334 255L195.5 175" fill="none" stroke="#64748b" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 5" opacity="0.5" />
