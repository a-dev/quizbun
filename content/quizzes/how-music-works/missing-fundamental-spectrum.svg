<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme. Presentation attributes stay as the light fallback. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --ok: #15803d;
      --bad: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
        --ok: #4ade80;
        --bad: #f87171;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .edgef { fill: var(--edge); }
    .card { fill: var(--card); }
    .a1 { stroke: var(--accent1); }
    .a1f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2f { fill: var(--accent2); }
    .ok { stroke: var(--ok); }
    .okf { fill: var(--ok); }
    .bad { stroke: var(--bad); }
    .badf { fill: var(--bad); }
    .card { stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" x="0" y="0" width="720" height="270" rx="20" fill="#f5f7fb" />
  <text class="title" x="360" y="34" text-anchor="middle" font-size="14" fill="#20242c">the complete spectrum of a sound</text>
  <path class="edge" d="M80 200L660 200" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <rect class="a1f" x="261.3" y="70" width="24" height="130" rx="2" fill="#2563eb" />
  <rect class="a1f" x="358" y="89.5" width="24" height="110.5" rx="2" fill="#2563eb" />
  <rect class="a1f" x="454.7" y="109" width="24" height="91" rx="2" fill="#2563eb" />
  <rect class="a1f" x="551.3" y="128.5" width="24" height="71.5" rx="2" fill="#2563eb" />
  <path class="edge" d="M80 196L80 204" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="80" y="220" text-anchor="middle" font-size="11" fill="#526173">0</text>
  <path class="edge" d="M176.7 196L176.7 204" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="176.7" y="220" text-anchor="middle" font-size="11" fill="#526173">200</text>
  <path class="edge" d="M273.3 196L273.3 204" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="273.3" y="220" text-anchor="middle" font-size="11" fill="#526173">400</text>
  <path class="edge" d="M370 196L370 204" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="370" y="220" text-anchor="middle" font-size="11" fill="#526173">600</text>
  <path class="edge" d="M466.7 196L466.7 204" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="466.7" y="220" text-anchor="middle" font-size="11" fill="#526173">800</text>
  <path class="edge" d="M563.3 196L563.3 204" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="563.3" y="220" text-anchor="middle" font-size="11" fill="#526173">1000</text>
  <path class="edge" d="M660 196L660 204" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="660" y="220" text-anchor="middle" font-size="11" fill="#526173">1200</text>
  <text class="muted" x="360" y="244" text-anchor="middle" font-size="12" fill="#526173">frequency (Hz)</text>
</svg>
