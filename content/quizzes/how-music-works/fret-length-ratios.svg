<svg xmlns="http://www.w3.org/2000/svg" width="720" height="320" viewBox="0 0 720 320">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme. Presentation attributes stay as the light fallback. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --ok: #15803d;
      --bad: #b91c1c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
        --ok: #4ade80;
        --bad: #f87171;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .edgef { fill: var(--edge); }
    .card { fill: var(--card); }
    .a1 { stroke: var(--accent1); }
    .a1f { fill: var(--accent1); }
    .a2 { stroke: var(--accent2); }
    .a2f { fill: var(--accent2); }
    .ok { stroke: var(--ok); }
    .okf { fill: var(--ok); }
    .bad { stroke: var(--bad); }
    .badf { fill: var(--bad); }
    .card { stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" x="0" y="0" width="720" height="320" rx="20" fill="#f5f7fb" />
  <text class="title" x="360" y="34" text-anchor="middle" font-size="14" fill="#20242c">vibrating length sets the frequency: half the length, twice the frequency</text>
  <text class="title" x="40" y="89" font-size="13" font-weight="600" fill="#20242c">open string</text>
  <path class="edge" d="M170 84L620 84" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4" opacity="0.6" />
  <path class="a1" d="M170 84L620 84" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path class="edge" d="M170 72L170 96" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path class="edge" d="M620 72L620 96" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="395" y="68" text-anchor="middle" font-size="11" fill="#526173">length 1</text>
  <text class="title" x="636" y="89" font-size="13" fill="#20242c">f</text>
  <text class="title" x="40" y="147" font-size="13" font-weight="600" fill="#20242c">12th fret</text>
  <path class="edge" d="M170 142L620 142" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4" opacity="0.6" />
  <path class="a2" d="M395 142L620 142" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path class="edge" d="M395 130L395 154" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path class="edge" d="M620 130L620 154" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="507.5" y="126" text-anchor="middle" font-size="11" fill="#526173">length 1/2</text>
  <text class="title" x="636" y="147" font-size="13" fill="#20242c">2f · octave</text>
  <text class="title" x="40" y="205" font-size="13" font-weight="600" fill="#20242c">7th fret</text>
  <path class="edge" d="M170 200L620 200" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4" opacity="0.6" />
  <path class="a2" d="M320 200L620 200" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path class="edge" d="M320 188L320 212" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path class="edge" d="M620 188L620 212" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="470" y="184" text-anchor="middle" font-size="11" fill="#526173">length 2/3</text>
  <text class="title" x="636" y="205" font-size="13" fill="#20242c">3/2 f · fifth</text>
  <text class="title" x="40" y="263" font-size="13" font-weight="600" fill="#20242c">5th fret</text>
  <path class="edge" d="M170 258L620 258" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 4" opacity="0.6" />
  <path class="a2" d="M282.5 258L620 258" fill="none" stroke="#c2410c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path class="edge" d="M282.5 246L282.5 270" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path class="edge" d="M620 246L620 270" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="451.2" y="242" text-anchor="middle" font-size="11" fill="#526173">length 3/4</text>
  <text class="title" x="636" y="263" font-size="13" fill="#20242c">4/3 f · fourth</text>
  <text class="muted" x="170" y="300" text-anchor="middle" font-size="11" fill="#526173">nut</text>
  <text class="muted" x="620" y="300" text-anchor="middle" font-size="11" fill="#526173">bridge</text>
</svg>
