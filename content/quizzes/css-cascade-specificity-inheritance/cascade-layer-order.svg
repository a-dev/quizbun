<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --win-fill: #dcfce7;
      --win-edge: #16a34a;
      --win-text: #15803d;
      --lose-fill: #f5f7fb;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --win-fill: #14321f;
        --win-edge: #4ade80;
        --win-text: #86efac;
        --lose-fill: #1a1f27;
        --accent-text: #fdba74;
      }
    }

    .panel-bg { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .win-box { fill: var(--win-fill); stroke: var(--win-edge); }
    .win-text { fill: var(--win-text); }
    .lose-box { fill: var(--lose-fill); stroke: var(--edge); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" fill-rule="evenodd" />
    </marker>
  </defs>

  <rect class="panel-bg" width="720" height="480" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    `!important` flips the layer order
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Layer order is decided before specificity. For `!important`, that order reverses.
  </text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text class="title" x="166" y="96" fill="#20242c" font-size="14" font-weight="700">Normal declarations</text>
    <text class="title" x="554" y="96" fill="#20242c" font-size="14" font-weight="700">!important declarations</text>
  </g>

  <!-- Left column: normal -->
  <g font-family="system-ui, sans-serif">
    <text class="muted" x="36" y="108" fill="#526173" font-size="10.5">highest priority</text>
    <rect class="win-box" x="36" y="112" width="260" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="win-text" x="52" y="138" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">unlayered</text>
    <text class="win-text" x="52" y="158" fill="#15803d" font-size="11.5">beats every layer, any source order</text>

    <rect class="card" x="36" y="192" width="260" height="64" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="218" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">@layer theme</text>
    <text class="muted" x="52" y="238" fill="#526173" font-size="11.5">later-named layer</text>

    <rect class="lose-box" x="36" y="272" width="260" height="64" rx="10" fill="#f5f7fb" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" />
    <text class="muted" x="52" y="298" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">@layer base</text>
    <text class="muted" x="52" y="318" fill="#526173" font-size="11.5">earlier-named layer</text>
    <text class="muted" x="36" y="352" fill="#526173" font-size="10.5">lowest priority</text>
  </g>

  <!-- Flip arrows -->
  <g stroke="var(--edge)" stroke-width="2" fill="none">
    <path d="M300,144 C 340,144 380,144 420,144" marker-end="url(#arrow2)" />
    <path d="M300,304 C 340,304 380,304 420,304" marker-end="url(#arrow2)" />
  </g>
  <text class="accent-text" x="360" y="228" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">order</text>
  <text class="accent-text" x="360" y="242" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">reverses</text>

  <!-- Right column: important -->
  <g font-family="system-ui, sans-serif">
    <text class="muted" x="424" y="108" fill="#526173" font-size="10.5">highest priority</text>
    <rect class="win-box" x="424" y="112" width="260" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="win-text" x="440" y="138" fill="#15803d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">@layer base</text>
    <text class="win-text" x="440" y="158" fill="#15803d" font-size="11.5">earliest layer now wins</text>

    <rect class="card" x="424" y="192" width="260" height="64" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="440" y="218" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">@layer theme</text>
    <text class="muted" x="440" y="238" fill="#526173" font-size="11.5">later-named layer</text>

    <rect class="lose-box" x="424" y="272" width="260" height="64" rx="10" fill="#f5f7fb" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" />
    <text class="muted" x="440" y="298" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700">unlayered</text>
    <text class="muted" x="440" y="318" fill="#526173" font-size="11.5">now the weakest important rule</text>
    <text class="muted" x="424" y="352" fill="#526173" font-size="10.5">lowest priority</text>
  </g>

  <line x1="36" y1="376" x2="684" y2="376" stroke="#64748b" stroke-width="1" stroke-dasharray="2 4" />

  <g font-family="system-ui, sans-serif">
    <rect class="card" x="36" y="392" width="648" height="66" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="416" fill="#20242c" font-size="13" font-weight="700">Inline styles are ordinary normal declarations too</text>
    <text class="muted" x="52" y="438" fill="#526173" font-size="12.5">
      An inline `style` attribute has no layer of its own — any `!important` author rule outranks it.
    </text>
  </g>
</svg>
