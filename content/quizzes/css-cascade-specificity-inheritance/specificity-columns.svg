<svg xmlns="http://www.w3.org/2000/svg" width="720" height="620" viewBox="0 0 720 620">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --a-fill: #ffedd5;
      --a-edge: #c2410c;
      --a-text: #9a3412;
      --b-fill: #dbeafe;
      --b-edge: #2563eb;
      --b-text: #172554;
      --c-fill: #dcfce7;
      --c-edge: #16a34a;
      --c-text: #15803d;
      --zero-text: #94a3b8;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --a-fill: #3a2416;
        --a-edge: #fb923c;
        --a-text: #fdba74;
        --b-fill: #1e3a5f;
        --b-edge: #60a5fa;
        --b-text: #dbeafe;
        --c-fill: #14321f;
        --c-edge: #4ade80;
        --c-text: #86efac;
        --zero-text: #5b6b81;
      }
    }

    .panel-bg { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .a-box { fill: var(--a-fill); stroke: var(--a-edge); }
    .a-text { fill: var(--a-text); }
    .b-box { fill: var(--b-fill); stroke: var(--b-edge); }
    .b-text { fill: var(--b-text); }
    .c-box { fill: var(--c-fill); stroke: var(--c-edge); }
    .c-text { fill: var(--c-text); }
    .zero { fill: var(--zero-text); }
  </style>

  <rect class="panel-bg" width="720" height="620" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Specificity: compared column by column, left to right
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    The first column that differs wins. Totals are never added together.
  </text>
  <text class="muted" x="36" y="84" fill="#526173" font-family="system-ui, sans-serif" font-size="12">
    A = IDs · B = classes, attributes, pseudo-classes · C = types, pseudo-elements
  </text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text class="muted" x="191" y="100" fill="#526173" font-size="11" font-weight="700">selector</text>
    <text class="a-text" x="391" y="100" fill="#9a3412" font-size="13" font-weight="700">A</text>
    <text class="b-text" x="471" y="100" fill="#172554" font-size="13" font-weight="700">B</text>
    <text class="c-text" x="551" y="100" fill="#15803d" font-size="13" font-weight="700">C</text>
    <text class="muted" x="640" y="100" fill="#526173" font-size="11" font-weight="700">(A, B, C)</text>
  </g>

  <!-- Row 1 -->
  <g font-family="system-ui, sans-serif">
    <rect class="card" x="36" y="106" width="648" height="60" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="142" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">#header .nav a</text>
    <text class="a-text" x="391" y="142" fill="#9a3412" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <text class="b-text" x="471" y="142" fill="#172554" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <text class="c-text" x="551" y="142" fill="#15803d" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <text class="title" x="640" y="142" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">(1,1,1)</text>
  </g>

  <!-- Row 2 -->
  <g font-family="system-ui, sans-serif">
    <rect class="card" x="36" y="174" width="648" height="60" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="210" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">header nav a.link.active</text>
    <text class="zero" x="391" y="210" fill="#94a3b8" font-size="16" font-weight="700" text-anchor="middle">0</text>
    <text class="b-text" x="471" y="210" fill="#172554" font-size="16" font-weight="700" text-anchor="middle">2</text>
    <text class="c-text" x="551" y="210" fill="#15803d" font-size="16" font-weight="700" text-anchor="middle">3</text>
    <text class="title" x="640" y="210" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">(0,2,3)</text>
  </g>

  <!-- Row 3 -->
  <g font-family="system-ui, sans-serif">
    <rect class="card" x="36" y="242" width="648" height="60" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="278" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">#sidebar ul li a.active</text>
    <text class="a-text" x="391" y="278" fill="#9a3412" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <text class="b-text" x="471" y="278" fill="#172554" font-size="16" font-weight="700" text-anchor="middle">1</text>
    <text class="c-text" x="551" y="278" fill="#15803d" font-size="16" font-weight="700" text-anchor="middle">3</text>
    <text class="title" x="640" y="278" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">(1,1,3)</text>
  </g>

  <!-- Row 4 -->
  <g font-family="system-ui, sans-serif">
    <rect class="card" x="36" y="310" width="648" height="60" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="340" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">nav.primary &gt; ul li.active</text>
    <text class="title" x="52" y="357" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">a:hover</text>
    <text class="zero" x="391" y="346" fill="#94a3b8" font-size="16" font-weight="700" text-anchor="middle">0</text>
    <text class="b-text" x="471" y="346" fill="#172554" font-size="16" font-weight="700" text-anchor="middle">3</text>
    <text class="c-text" x="551" y="346" fill="#15803d" font-size="16" font-weight="700" text-anchor="middle">4</text>
    <text class="title" x="640" y="346" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">(0,3,4)</text>
  </g>

  <text class="muted" x="36" y="396" fill="#526173" font-size="12.5">
    Combinators (space, `&gt;`) contribute nothing. `:hover` counts in B, not C. It's a pseudo-<tspan font-weight="700">class</tspan>.
  </text>

  <line x1="36" y1="416" x2="684" y2="416" stroke="#64748b" stroke-width="1" stroke-dasharray="2 4" />

  <text class="title" x="36" y="450" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">
    Functional pseudo-classes play by their own rules
  </text>

  <g font-family="system-ui, sans-serif" font-size="13">
    <rect class="b-box" x="36" y="466" width="648" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <text class="b-text" x="52" y="488" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">:where(...)</text>
    <text class="muted" x="260" y="488" fill="#526173">always contributes <tspan font-weight="700">zero</tspan> specificity, whatever is inside it</text>

    <rect class="card" x="36" y="504" width="648" height="34" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="52" y="526" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">:is(...) / :not(...)</text>
    <text class="muted" x="260" y="526" fill="#526173">replaced by its <tspan font-weight="700">most specific argument</tspan></text>

    <rect class="card" x="36" y="542" width="648" height="34" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
    <text class="title" x="52" y="564" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">:nth-child(...)</text>
    <text class="muted" x="260" y="564" fill="#526173">an ordinary pseudo-class: (0, 1, 0), <tspan font-weight="700">not</tspan> zero</text>
  </g>
</svg>
