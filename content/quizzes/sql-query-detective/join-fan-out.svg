<svg xmlns="http://www.w3.org/2000/svg" width="720" height="558" viewBox="0 0 720 558">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ok-fill: #dcfce7;
      --ok-edge: #16a34a;
      --ok-text: #14532d;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ok-fill: #14321f;
        --ok-edge: #4ade80;
        --ok-text: #bbf7d0;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .edge-line { stroke: var(--edge); }
    .ok-box { fill: var(--ok-fill); stroke: var(--ok-edge); }
    .ok-text { fill: var(--ok-text); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <rect class="panel" width="720" height="558" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Two child tables, one multiplied total
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Order 10 has two items priced 30 and 20, and three payments of 10. Join both at once and watch.
  </text>

  <g font-family="system-ui, sans-serif">
    <rect class="card" x="36" y="88" width="196" height="94" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="110" fill="#20242c" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">orders</text>
    <text class="muted" x="52" y="132" fill="#526173" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">id = 10</text>
    <text class="muted" x="52" y="168" fill="#526173" font-size="11.5">1 row</text>

    <rect class="card" x="248" y="88" width="196" height="94" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="264" y="110" fill="#20242c" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">order_items</text>
    <text class="muted" x="264" y="132" fill="#526173" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">price = 30</text>
    <text class="muted" x="264" y="150" fill="#526173" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">price = 20</text>
    <text class="muted" x="264" y="172" fill="#526173" font-size="11.5">2 rows · true total 50</text>

    <rect class="card" x="460" y="88" width="224" height="94" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="476" y="110" fill="#20242c" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">payments</text>
    <text class="muted" x="476" y="128" fill="#526173" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">amount = 10</text>
    <text class="muted" x="476" y="144" fill="#526173" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">amount = 10</text>
    <text class="muted" x="476" y="160" fill="#526173" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">amount = 10</text>
    <text class="muted" x="476" y="176" fill="#526173" font-size="11.5">3 rows · true total 30</text>

    <text class="title" x="36" y="208" fill="#20242c" font-size="13.5" font-weight="700">Join both children to the same parent and you get every pairing: 2 × 3 = 6 rows</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect class="card" x="36" y="218" width="300" height="152" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="60" y="240" fill="#526173" font-size="11.5" font-weight="700">i.price</text>
    <text class="muted" x="200" y="240" fill="#526173" font-size="11.5" font-weight="700">p.amount</text>
    <text class="title" x="60" y="264" fill="#20242c" font-size="12.5">30</text><text class="title" x="200" y="264" fill="#20242c" font-size="12.5">10</text>
    <text class="title" x="60" y="284" fill="#20242c" font-size="12.5">30</text><text class="title" x="200" y="284" fill="#20242c" font-size="12.5">10</text>
    <text class="title" x="60" y="304" fill="#20242c" font-size="12.5">30</text><text class="title" x="200" y="304" fill="#20242c" font-size="12.5">10</text>
    <text class="title" x="60" y="324" fill="#20242c" font-size="12.5">20</text><text class="title" x="200" y="324" fill="#20242c" font-size="12.5">10</text>
    <text class="title" x="60" y="344" fill="#20242c" font-size="12.5">20</text><text class="title" x="200" y="344" fill="#20242c" font-size="12.5">10</text>
    <text class="title" x="60" y="364" fill="#20242c" font-size="12.5">20</text><text class="title" x="200" y="364" fill="#20242c" font-size="12.5">10</text>
  </g>

  <g font-family="system-ui, sans-serif">
    <rect class="accent-box" x="352" y="218" width="332" height="152" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="368" y="248" fill="#9a3412" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SUM(i.price) = 150</text>
    <text class="accent-text" x="368" y="268" fill="#9a3412" font-size="11.5">each price counted once per payment: 50 × 3</text>
    <text class="accent-text" x="368" y="300" fill="#9a3412" font-size="16" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SUM(p.amount) = 60</text>
    <text class="accent-text" x="368" y="318" fill="#9a3412" font-size="11.5">each payment counted once per item: 30 × 2</text>
    <text class="accent-text" x="368" y="344" fill="#9a3412" font-size="11.5" font-weight="700">A window function over these rows inflates</text>
    <text class="accent-text" x="368" y="360" fill="#9a3412" font-size="11.5" font-weight="700">in exactly the same way.</text>

    <rect class="ok-box" x="36" y="386" width="648" height="76" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ok-text" x="52" y="410" fill="#14532d" font-size="13.5" font-weight="700">Collapse each child to one row per order before joining</text>
    <text class="ok-text" x="52" y="430" fill="#14532d" font-size="12">Aggregate <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">order_items</tspan> and <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">payments</tspan> separately by <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">order_id</tspan>, then join the results, or use one</text>
    <text class="ok-text" x="52" y="448" fill="#14532d" font-size="12">correlated scalar subquery per child. <tspan font-weight="700">Not</tspan> <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">DISTINCT</tspan>: two items genuinely priced 20 would collapse into one.</text>

    <rect class="info-box" x="36" y="478" width="648" height="58" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="52" y="502" fill="#172554" font-size="13" font-weight="700">To find where it starts: count rows after each join in turn.</text>
    <text class="info-text" x="52" y="521" fill="#172554" font-size="12">Fan-out begins at the first join whose right side has more than one row per join key.</text>
  </g>
</svg>
