<svg xmlns="http://www.w3.org/2000/svg" width="720" height="606" viewBox="0 0 720 606">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ok-fill: #dcfce7;
      --ok-edge: #16a34a;
      --ok-text: #14532d;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ok-fill: #14321f;
        --ok-edge: #4ade80;
        --ok-text: #bbf7d0;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .ok-box { fill: var(--ok-fill); stroke: var(--ok-edge); }
    .ok-text { fill: var(--ok-text); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <rect class="panel" width="720" height="606" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    NULL is not a value. It is “unknown”.
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    A <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">WHERE</tspan> clause keeps a row only when its predicate is TRUE. UNKNOWN is not TRUE.
  </text>

  <g font-family="system-ui, sans-serif">
    <rect class="accent-box" x="36" y="88" width="316" height="60" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="52" y="112" fill="#9a3412" font-size="13.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">NULL = NULL  →  UNKNOWN</text>
    <text class="accent-text" x="52" y="132" fill="#9a3412" font-size="11.5">so two NULL join keys never match each other</text>

    <rect class="accent-box" x="368" y="88" width="316" height="60" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="384" y="112" fill="#9a3412" font-size="13.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">rating &lt;&gt; 5  →  UNKNOWN</text>
    <text class="accent-text" x="384" y="132" fill="#9a3412" font-size="11.5">when rating is NULL, so that row is dropped too</text>

    <rect class="ok-box" x="36" y="160" width="648" height="52" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ok-text" x="52" y="184" fill="#14532d" font-size="13.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">a IS NOT DISTINCT FROM b</text>
    <text class="ok-text" x="52" y="202" fill="#14532d" font-size="11.5">the standard null-safe comparison: TRUE when both sides are NULL, and never UNKNOWN</text>

    <text class="title" x="36" y="242" fill="#20242c" font-size="15" font-weight="700">Same intent, opposite results</text>
    <text class="muted" x="36" y="260" fill="#526173" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">candidate</tspan> holds 1, 2, 3. <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">blocked</tspan> holds 2 and NULL.</text>

    <rect class="accent-box" x="36" y="272" width="316" height="98" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="52" y="296" fill="#9a3412" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">id NOT IN (2, NULL)</text>
    <text class="accent-text" x="52" y="316" fill="#9a3412" font-size="11.5">expands to <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">id &lt;&gt; 2 AND id &lt;&gt; NULL</tspan>, and the</text>
    <text class="accent-text" x="52" y="332" fill="#9a3412" font-size="11.5">second half is UNKNOWN for every row</text>
    <text class="accent-text" x="52" y="358" fill="#9a3412" font-size="13" font-weight="700">Result: no rows at all</text>

    <rect class="ok-box" x="368" y="272" width="316" height="98" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ok-text" x="384" y="296" fill="#14532d" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">NOT EXISTS (SELECT 1 …)</text>
    <text class="ok-text" x="384" y="316" fill="#14532d" font-size="11.5">asks whether a matching row exists, which is</text>
    <text class="ok-text" x="384" y="332" fill="#14532d" font-size="11.5">a yes-or-no question with no third answer</text>
    <text class="ok-text" x="384" y="358" fill="#14532d" font-size="13" font-weight="700">Result: 1 and 3</text>

    <text class="title" x="36" y="404" fill="#20242c" font-size="15" font-weight="700">What the aggregates do with it</text>

    <rect class="card" x="36" y="416" width="316" height="72" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="440" fill="#20242c" font-size="12.5" font-weight="700">Over no qualifying rows</text>
    <text class="muted" x="52" y="460" fill="#526173" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">SUM(amount)</tspan> → NULL, not 0</text>
    <text class="muted" x="52" y="478" fill="#526173" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">COUNT(amount)</tspan> → 0</text>

    <rect class="card" x="368" y="416" width="316" height="72" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="384" y="440" fill="#20242c" font-size="12.5" font-weight="700">Over rows that include a NULL</text>
    <text class="muted" x="384" y="460" fill="#526173" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">AVG</tspan> of 10, 20, NULL → 15, not 10</text>
    <text class="muted" x="384" y="478" fill="#526173" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">COUNT(DISTINCT c)</tspan> of A, A, B, NULL → 2</text>

    <rect class="info-box" x="36" y="504" width="648" height="72" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="52" y="528" fill="#172554" font-size="13" font-weight="700">Grouping is the one place NULLs are treated as equal to one another.</text>
    <text class="info-text" x="52" y="548" fill="#172554" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">GROUP BY region</tspan> collects every NULL region into a single group, even though</text>
    <text class="info-text" x="52" y="566" fill="#172554" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">region = region</tspan> would have been UNKNOWN for each of those rows.</text>
  </g>
</svg>
