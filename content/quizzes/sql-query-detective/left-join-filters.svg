<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ok-fill: #dcfce7;
      --ok-edge: #16a34a;
      --ok-text: #14532d;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ok-fill: #14321f;
        --ok-edge: #4ade80;
        --ok-text: #bbf7d0;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .card { fill: var(--card); stroke: var(--edge); }
    .ok-box { fill: var(--ok-fill); stroke: var(--ok-edge); }
    .ok-text { fill: var(--ok-text); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .info-text { fill: var(--info-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <rect class="panel" width="720" height="580" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Where you put the filter decides what survives
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Three customers. Ada has a paid order; Lin and Sam have none.
  </text>

  <g font-family="system-ui, sans-serif">
    <rect class="accent-box" x="36" y="88" width="316" height="140" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="52" y="112" fill="#9a3412" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">LEFT JOIN orders o</text>
    <text class="accent-text" x="52" y="130" fill="#9a3412" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  ON o.customer_id = c.id</text>
    <text class="accent-text" x="52" y="148" fill="#9a3412" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">WHERE o.status = 'paid'</text>
    <text class="accent-text" x="52" y="176" fill="#9a3412" font-size="11.5">The join invents NULL rows for Lin and Sam,</text>
    <text class="accent-text" x="52" y="192" fill="#9a3412" font-size="11.5">then the WHERE test discards them: NULL is</text>
    <text class="accent-text" x="52" y="208" fill="#9a3412" font-size="11.5">not <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">'paid'</tspan>. Result: <tspan font-weight="700">Ada only</tspan>.</text>

    <rect class="ok-box" x="368" y="88" width="316" height="140" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ok-text" x="384" y="112" fill="#14532d" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">LEFT JOIN orders o</text>
    <text class="ok-text" x="384" y="130" fill="#14532d" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">  ON o.customer_id = c.id</text>
    <text class="ok-text" x="384" y="148" fill="#14532d" font-size="12.5" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"> AND o.status = 'paid'</text>
    <text class="ok-text" x="384" y="176" fill="#14532d" font-size="11.5">In ON, the filter only decides what counts as</text>
    <text class="ok-text" x="384" y="192" fill="#14532d" font-size="11.5">a match. Unmatched left rows are still kept.</text>
    <text class="ok-text" x="384" y="208" fill="#14532d" font-size="11.5">Result: <tspan font-weight="700">(Ada, 101), (Lin, NULL), (Sam, NULL)</tspan>.</text>

    <rect class="card" x="36" y="244" width="648" height="52" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="title" x="52" y="266" fill="#20242c" font-size="13" font-weight="700">A filter on the <tspan font-style="italic">left</tspan> table inside <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ON</tspan> removes nothing at all.</text>
    <text class="muted" x="52" y="285" fill="#526173" font-size="12">It only stops those rows matching, so they come back NULL-extended instead of disappearing.</text>

    <rect class="accent-box" x="36" y="312" width="648" height="72" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="accent-text" x="52" y="336" fill="#9a3412" font-size="13" font-weight="700">The same trap, one join later</text>
    <text class="accent-text" x="52" y="356" fill="#9a3412" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">authors LEFT JOIN books ... JOIN reviews ON reviews.book_id = books.id</tspan></text>
    <text class="accent-text" x="52" y="374" fill="#9a3412" font-size="12">The inner join cannot match a NULL book id, so every author without books vanishes again.</text>

    <rect class="ok-box" x="36" y="400" width="648" height="72" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="ok-text" x="52" y="424" fill="#14532d" font-size="13" font-weight="700">Counting only some children, while keeping every parent</text>
    <text class="ok-text" x="52" y="444" fill="#14532d" font-size="12">Filter inside the <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">ON</tspan>, or pre-filter the child in a subquery and left-join that. Filtering the</text>
    <text class="ok-text" x="52" y="462" fill="#14532d" font-size="12">joined result afterwards drops exactly the parents whose count should have been zero.</text>

    <rect class="info-box" x="36" y="488" width="648" height="72" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="info-text" x="52" y="512" fill="#172554" font-size="13" font-weight="700">The anti-join idiom, and its one condition</text>
    <text class="info-text" x="52" y="532" fill="#172554" font-size="12"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">LEFT JOIN … WHERE right.key IS NULL</tspan> is reliable only when that column is genuinely</text>
    <text class="info-text" x="52" y="550" fill="#172554" font-size="12">NOT NULL in the table — otherwise a row that <tspan font-style="italic">did</tspan> match can look unmatched.</text>
  </g>
</svg>
