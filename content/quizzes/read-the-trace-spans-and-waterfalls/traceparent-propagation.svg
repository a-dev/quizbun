<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380">
    <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {{
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d5dce6;
      --a1: #16a34a; --a1-l: #bbf7d0;
      --a2: #0284c7; --a2-l: #bae6fd;
      --a3: #2563eb; --a3-l: #bfdbfe;
      --a4: #9333ea; --a4-l: #e9d5ff;
      --a5: #c2410c; --a5-l: #fed7aa;
      --danger: #dc2626; --danger-l: #fecaca;
    }}

    @media (prefers-color-scheme: dark) {{
      svg {{
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c49;
        --a1: #4ade80; --a1-l: #14532d;
        --a2: #38bdf8; --a2-l: #0c4a6e;
        --a3: #60a5fa; --a3-l: #1e3a5f;
        --a4: #c084fc; --a4-l: #581c87;
        --a5: #fb923c; --a5-l: #7c2d12;
        --danger: #f87171; --danger-l: #7f1d1d;
      }}
    }}

    .panel-bg {{ fill: var(--panel); }}
    .title {{ fill: var(--title); }}
    .subtitle {{ fill: var(--muted); }}
    .muted {{ fill: var(--muted); }}
    .grid-line {{ stroke: var(--grid); }}
    text {{ font-family: system-ui, sans-serif; }}
    .mono {{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }}
    .bar-1 {{ fill: var(--a1-l); stroke: var(--a1); }}
    .bar-2 {{ fill: var(--a2-l); stroke: var(--a2); }}
    .bar-3 {{ fill: var(--a3-l); stroke: var(--a3); }}
    .bar-4 {{ fill: var(--a4-l); stroke: var(--a4); }}
    .bar-5 {{ fill: var(--a5-l); stroke: var(--a5); }}
    .bar-danger {{ fill: var(--danger-l); stroke: var(--danger); }}
    .card {{ fill: var(--card); stroke: var(--edge); }}
  </style>

  <rect class="panel-bg" width="760" height="380" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="38" font-size="19" font-weight="700" fill="#20242c">How traceparent carries a trace across a service boundary</text>
  <text class="subtitle" x="32" y="60" font-size="13" fill="#526173">The header's trace id is what lets the callee's span join the same trace</text>
  <rect class="bar-3" x="60.0" y="90.0" width="170.0" height="50.0" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" />
  <text class="muted" x="145.0" y="119.0" font-size="12" font-weight="700" text-anchor="middle">service A</text>
  <rect class="bar-3" x="520.0" y="90.0" width="170.0" height="50.0" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" />
  <text class="muted" x="605.0" y="119.0" font-size="12" font-weight="700" text-anchor="middle">service B</text>
  <line class="grid-line" x1="230.0" y1="115.0" x2="520.0" y2="115.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="375.0" y="100.0" font-size="10.5" font-weight="400" text-anchor="middle">traceparent:</text>
  <text class="muted mono" x="375.0" y="132.0" font-size="10.5" font-weight="400" text-anchor="middle">00-trace-id-span-id-01</text>
  <text class="muted" x="60.0" y="76.0" font-size="12" font-weight="700" text-anchor="start">working: header forwarded, same trace id on both sides</text>
  <rect class="bar-3" x="60.0" y="230.0" width="170.0" height="50.0" rx="8" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" />
  <text class="muted" x="145.0" y="259.0" font-size="12" font-weight="700" text-anchor="middle">service A</text>
  <rect class="bar-danger" x="520.0" y="230.0" width="170.0" height="50.0" rx="8" fill="#fecaca" stroke="#dc2626" stroke-width="1.5" />
  <text class="muted" x="605.0" y="259.0" font-size="12" font-weight="700" text-anchor="middle">service B</text>
  <line class="grid-line" x1="230.0" y1="255.0" x2="520.0" y2="255.0" stroke="#d5dce6" stroke-width="1.5" stroke-dasharray="4 4" />
  <text class="muted" x="375.0" y="248.0" font-size="11" font-weight="400" text-anchor="middle">header dropped</text>
  <text class="muted" x="605.0" y="300.0" font-size="11" font-weight="400" text-anchor="middle">mints a new trace id</text>
  <text class="muted" x="60.0" y="216.0" font-size="12" font-weight="700" text-anchor="start">broken: header lost, service B starts its own trace</text>
  </svg>
