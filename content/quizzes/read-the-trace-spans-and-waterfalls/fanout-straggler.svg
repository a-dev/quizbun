<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380">
    <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {{
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d5dce6;
      --a1: #16a34a; --a1-l: #bbf7d0;
      --a2: #0284c7; --a2-l: #bae6fd;
      --a3: #2563eb; --a3-l: #bfdbfe;
      --a4: #9333ea; --a4-l: #e9d5ff;
      --a5: #c2410c; --a5-l: #fed7aa;
      --danger: #dc2626; --danger-l: #fecaca;
    }}

    @media (prefers-color-scheme: dark) {{
      svg {{
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c49;
        --a1: #4ade80; --a1-l: #14532d;
        --a2: #38bdf8; --a2-l: #0c4a6e;
        --a3: #60a5fa; --a3-l: #1e3a5f;
        --a4: #c084fc; --a4-l: #581c87;
        --a5: #fb923c; --a5-l: #7c2d12;
        --danger: #f87171; --danger-l: #7f1d1d;
      }}
    }}

    .panel-bg {{ fill: var(--panel); }}
    .title {{ fill: var(--title); }}
    .subtitle {{ fill: var(--muted); }}
    .muted {{ fill: var(--muted); }}
    .grid-line {{ stroke: var(--grid); }}
    text {{ font-family: system-ui, sans-serif; }}
    .mono {{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }}
    .bar-1 {{ fill: var(--a1-l); stroke: var(--a1); }}
    .bar-2 {{ fill: var(--a2-l); stroke: var(--a2); }}
    .bar-3 {{ fill: var(--a3-l); stroke: var(--a3); }}
    .bar-4 {{ fill: var(--a4-l); stroke: var(--a4); }}
    .bar-5 {{ fill: var(--a5-l); stroke: var(--a5); }}
    .bar-danger {{ fill: var(--danger-l); stroke: var(--danger); }}
    .card {{ fill: var(--card); stroke: var(--edge); }}
  </style>

  <rect class="panel-bg" width="760" height="380" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="38" font-size="19" font-weight="700" fill="#20242c">One parent, five independent children started together</text>
  <text class="subtitle" x="32" y="60" font-size="13" fill="#526173">aggregate fans out to five downstream calls at the same time</text>
  <text class="muted mono" x="36.0" y="113.1" font-size="12" font-weight="400" text-anchor="start">aggregate</text>
  <rect class="bar-3" x="190.0" y="90.0" width="494.1" height="34.0" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" />
  <text class="muted mono" x="36.0" y="159.1" font-size="12" font-weight="400" text-anchor="start">call-1</text>
  <rect class="bar-2" x="190.0" y="136.0" width="87.7" height="34.0" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <text class="muted mono" x="36.0" y="201.1" font-size="12" font-weight="400" text-anchor="start">call-2</text>
  <rect class="bar-2" x="190.0" y="178.0" width="76.5" height="34.0" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <text class="muted mono" x="36.0" y="243.1" font-size="12" font-weight="400" text-anchor="start">call-3</text>
  <rect class="bar-2" x="190.0" y="220.0" width="95.6" height="34.0" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <text class="muted mono" x="36.0" y="285.1" font-size="12" font-weight="400" text-anchor="start">call-4</text>
  <rect class="bar-danger" x="190.0" y="262.0" width="494.1" height="34.0" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5" />
  <text class="muted mono" x="36.0" y="327.1" font-size="12" font-weight="400" text-anchor="start">call-5</text>
  <rect class="bar-2" x="190.0" y="304.0" width="82.9" height="34.0" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <line class="grid-line" x1="190.0" y1="370.0" x2="700.0" y2="370.0" stroke="#d5dce6" stroke-width="1.5" />
  <line class="grid-line" x1="190.0" y1="366.0" x2="190.0" y2="374.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="190.0" y="392.0" font-size="10.5" font-weight="400" text-anchor="middle">0 ms</text>
  <line class="grid-line" x1="269.7" y1="366.0" x2="269.7" y2="374.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="269.7" y="392.0" font-size="10.5" font-weight="400" text-anchor="middle">50</text>
  <line class="grid-line" x1="349.4" y1="366.0" x2="349.4" y2="374.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="349.4" y="392.0" font-size="10.5" font-weight="400" text-anchor="middle">100</text>
  <line class="grid-line" x1="429.1" y1="366.0" x2="429.1" y2="374.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="429.1" y="392.0" font-size="10.5" font-weight="400" text-anchor="middle">150</text>
  <line class="grid-line" x1="508.8" y1="366.0" x2="508.8" y2="374.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="508.8" y="392.0" font-size="10.5" font-weight="400" text-anchor="middle">200</text>
  <line class="grid-line" x1="588.4" y1="366.0" x2="588.4" y2="374.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="588.4" y="392.0" font-size="10.5" font-weight="400" text-anchor="middle">250</text>
  <line class="grid-line" x1="668.1" y1="366.0" x2="668.1" y2="374.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="668.1" y="392.0" font-size="10.5" font-weight="400" text-anchor="middle">300</text>
  </svg>
