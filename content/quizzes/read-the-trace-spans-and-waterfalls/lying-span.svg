<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260">
    <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {{
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d5dce6;
      --a1: #16a34a; --a1-l: #bbf7d0;
      --a2: #0284c7; --a2-l: #bae6fd;
      --a3: #2563eb; --a3-l: #bfdbfe;
      --a4: #9333ea; --a4-l: #e9d5ff;
      --a5: #c2410c; --a5-l: #fed7aa;
      --danger: #dc2626; --danger-l: #fecaca;
    }}

    @media (prefers-color-scheme: dark) {{
      svg {{
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c49;
        --a1: #4ade80; --a1-l: #14532d;
        --a2: #38bdf8; --a2-l: #0c4a6e;
        --a3: #60a5fa; --a3-l: #1e3a5f;
        --a4: #c084fc; --a4-l: #581c87;
        --a5: #fb923c; --a5-l: #7c2d12;
        --danger: #f87171; --danger-l: #7f1d1d;
      }}
    }}

    .panel-bg {{ fill: var(--panel); }}
    .title {{ fill: var(--title); }}
    .subtitle {{ fill: var(--muted); }}
    .muted {{ fill: var(--muted); }}
    .grid-line {{ stroke: var(--grid); }}
    text {{ font-family: system-ui, sans-serif; }}
    .mono {{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }}
    .bar-1 {{ fill: var(--a1-l); stroke: var(--a1); }}
    .bar-2 {{ fill: var(--a2-l); stroke: var(--a2); }}
    .bar-3 {{ fill: var(--a3-l); stroke: var(--a3); }}
    .bar-4 {{ fill: var(--a4-l); stroke: var(--a4); }}
    .bar-5 {{ fill: var(--a5-l); stroke: var(--a5); }}
    .bar-danger {{ fill: var(--danger-l); stroke: var(--danger); }}
    .card {{ fill: var(--card); stroke: var(--edge); }}
  </style>

  <rect class="panel-bg" width="760" height="260" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="38" font-size="19" font-weight="700" fill="#20242c">One child span filling almost the entire parent</text>
  <text class="subtitle" x="32" y="60" font-size="13" fill="#526173">process-image wraps a single call named resize-image</text>
  <text class="muted mono" x="36.0" y="119.1" font-size="12" font-weight="400" text-anchor="start">process-image</text>
  <rect class="bar-3" x="190.0" y="96.0" width="510.0" height="34.0" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" />
  <text class="muted mono" x="36.0" y="165.1" font-size="12" font-weight="400" text-anchor="start">resize-image</text>
  <rect class="bar-2" x="200.2" y="142.0" width="489.6" height="34.0" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <line class="grid-line" x1="190.0" y1="210.0" x2="700.0" y2="210.0" stroke="#d5dce6" stroke-width="1.5" />
  <line class="grid-line" x1="190.0" y1="206.0" x2="190.0" y2="214.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="190.0" y="232.0" font-size="10.5" font-weight="400" text-anchor="middle">0 ms</text>
  <line class="grid-line" x1="292.0" y1="206.0" x2="292.0" y2="214.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="292.0" y="232.0" font-size="10.5" font-weight="400" text-anchor="middle">100</text>
  <line class="grid-line" x1="394.0" y1="206.0" x2="394.0" y2="214.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="394.0" y="232.0" font-size="10.5" font-weight="400" text-anchor="middle">200</text>
  <line class="grid-line" x1="496.0" y1="206.0" x2="496.0" y2="214.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="496.0" y="232.0" font-size="10.5" font-weight="400" text-anchor="middle">300</text>
  <line class="grid-line" x1="598.0" y1="206.0" x2="598.0" y2="214.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="598.0" y="232.0" font-size="10.5" font-weight="400" text-anchor="middle">400</text>
  <line class="grid-line" x1="700.0" y1="206.0" x2="700.0" y2="214.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="700.0" y="232.0" font-size="10.5" font-weight="400" text-anchor="middle">500</text>
  </svg>
