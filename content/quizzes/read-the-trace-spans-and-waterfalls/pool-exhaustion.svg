<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470">
    <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {{
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --grid: #d5dce6;
      --a1: #16a34a; --a1-l: #bbf7d0;
      --a2: #0284c7; --a2-l: #bae6fd;
      --a3: #2563eb; --a3-l: #bfdbfe;
      --a4: #9333ea; --a4-l: #e9d5ff;
      --a5: #c2410c; --a5-l: #fed7aa;
      --danger: #dc2626; --danger-l: #fecaca;
    }}

    @media (prefers-color-scheme: dark) {{
      svg {{
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --grid: #333c49;
        --a1: #4ade80; --a1-l: #14532d;
        --a2: #38bdf8; --a2-l: #0c4a6e;
        --a3: #60a5fa; --a3-l: #1e3a5f;
        --a4: #c084fc; --a4-l: #581c87;
        --a5: #fb923c; --a5-l: #7c2d12;
        --danger: #f87171; --danger-l: #7f1d1d;
      }}
    }}

    .panel-bg {{ fill: var(--panel); }}
    .title {{ fill: var(--title); }}
    .subtitle {{ fill: var(--muted); }}
    .muted {{ fill: var(--muted); }}
    .grid-line {{ stroke: var(--grid); }}
    text {{ font-family: system-ui, sans-serif; }}
    .mono {{ font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }}
    .bar-1 {{ fill: var(--a1-l); stroke: var(--a1); }}
    .bar-2 {{ fill: var(--a2-l); stroke: var(--a2); }}
    .bar-3 {{ fill: var(--a3-l); stroke: var(--a3); }}
    .bar-4 {{ fill: var(--a4-l); stroke: var(--a4); }}
    .bar-5 {{ fill: var(--a5-l); stroke: var(--a5); }}
    .bar-danger {{ fill: var(--danger-l); stroke: var(--danger); }}
    .card {{ fill: var(--card); stroke: var(--edge); }}
  </style>

  <rect class="panel-bg" width="760" height="470" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="38" font-size="19" font-weight="700" fill="#20242c">Six queries, each with the same wait before it starts</text>
  <text class="subtitle" x="32" y="60" font-size="13" fill="#526173">handle-batch calling db.query six times</text>
  <text class="muted mono" x="36.0" y="113.1" font-size="12" font-weight="400" text-anchor="start">handle-batch</text>
  <rect class="bar-3" x="190.0" y="90.0" width="484.5" height="34.0" rx="6" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" />
  <text class="muted mono" x="36.0" y="159.1" font-size="12" font-weight="400" text-anchor="start">db.query</text>
  <rect class="bar-1" x="215.5" y="136.0" width="216.8" height="34.0" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />
  <rect class="bar-2" x="432.2" y="136.0" width="25.5" height="34.0" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <text class="muted mono" x="36.0" y="199.1" font-size="12" font-weight="400" text-anchor="start"></text>
  <rect class="bar-1" x="215.5" y="176.0" width="216.8" height="34.0" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />
  <rect class="bar-2" x="432.2" y="176.0" width="25.5" height="34.0" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <text class="muted mono" x="36.0" y="239.1" font-size="12" font-weight="400" text-anchor="start"></text>
  <rect class="bar-1" x="215.5" y="216.0" width="216.8" height="34.0" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />
  <rect class="bar-2" x="432.2" y="216.0" width="25.5" height="34.0" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <text class="muted mono" x="36.0" y="279.1" font-size="12" font-weight="400" text-anchor="start"></text>
  <rect class="bar-1" x="215.5" y="256.0" width="216.8" height="34.0" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />
  <rect class="bar-2" x="432.2" y="256.0" width="25.5" height="34.0" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <text class="muted mono" x="36.0" y="319.1" font-size="12" font-weight="400" text-anchor="start"></text>
  <rect class="bar-1" x="215.5" y="296.0" width="216.8" height="34.0" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />
  <rect class="bar-2" x="432.2" y="296.0" width="25.5" height="34.0" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <text class="muted mono" x="36.0" y="359.1" font-size="12" font-weight="400" text-anchor="start"></text>
  <rect class="bar-1" x="215.5" y="336.0" width="216.8" height="34.0" rx="6" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />
  <rect class="bar-2" x="432.2" y="336.0" width="25.5" height="34.0" rx="6" fill="#bae6fd" stroke="#0284c7" stroke-width="1.5" />
  <line class="grid-line" x1="190.0" y1="400.0" x2="700.0" y2="400.0" stroke="#d5dce6" stroke-width="1.5" />
  <line class="grid-line" x1="190.0" y1="396.0" x2="190.0" y2="404.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="190.0" y="422.0" font-size="10.5" font-weight="400" text-anchor="middle">0 ms</text>
  <line class="grid-line" x1="317.5" y1="396.0" x2="317.5" y2="404.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="317.5" y="422.0" font-size="10.5" font-weight="400" text-anchor="middle">100</text>
  <line class="grid-line" x1="445.0" y1="396.0" x2="445.0" y2="404.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="445.0" y="422.0" font-size="10.5" font-weight="400" text-anchor="middle">200</text>
  <line class="grid-line" x1="572.5" y1="396.0" x2="572.5" y2="404.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="572.5" y="422.0" font-size="10.5" font-weight="400" text-anchor="middle">300</text>
  <line class="grid-line" x1="700.0" y1="396.0" x2="700.0" y2="404.0" stroke="#d5dce6" stroke-width="1.5" />
  <text class="muted mono" x="700.0" y="422.0" font-size="10.5" font-weight="400" text-anchor="middle">400</text>
  <rect class="bar-1" x="36.0" y="425.0" width="20.0" height="14.0" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3" />
  <text class="muted" x="62.0" y="436.0" font-size="11.5" font-weight="400" text-anchor="start">waiting for a connection</text>
  <rect class="bar-2" x="230.0" y="425.0" width="20.0" height="14.0" rx="2" fill="#bae6fd" stroke="#0284c7" stroke-width="1.2" />
  <text class="muted" x="256.0" y="436.0" font-size="11.5" font-weight="400" text-anchor="start">running query</text>
  </svg>
