<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --ctx-fill: #dbeafe;
      --ctx-edge: #2563eb;
      --ctx-label: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --ctx-fill: #1e3a5f;
        --ctx-edge: #60a5fa;
        --ctx-label: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel-bg { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge-line { stroke: var(--edge); }
    .lead-chip { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .lead-label { fill: var(--accent-text); }
    .repeat-chip { fill: var(--ctx-fill); stroke: var(--ctx-edge); }
    .repeat-label { fill: var(--ctx-label); }
    .ellipsis-chip { fill: var(--panel); stroke: var(--edge); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <rect class="panel-bg" width="720" height="360" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    0.1 never terminates in binary
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    1/10 = 1/(2 × 5) — the factor of 5 has nowhere to go in base 2.
  </text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <rect class="lead-chip" x="36" y="98" width="72" height="40" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="1.6" />
    <text class="lead-label" x="72" y="123" fill="#9a3412" font-size="15" font-weight="700">0001</text>

    <rect class="repeat-chip" x="116" y="98" width="72" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" />
    <text class="repeat-label" x="152" y="123" fill="#172554" font-size="15" font-weight="700">1001</text>

    <rect class="repeat-chip" x="196" y="98" width="72" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" />
    <text class="repeat-label" x="232" y="123" fill="#172554" font-size="15" font-weight="700">1001</text>

    <rect class="repeat-chip" x="276" y="98" width="72" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" />
    <text class="repeat-label" x="312" y="123" fill="#172554" font-size="15" font-weight="700">1001</text>

    <rect class="repeat-chip" x="356" y="98" width="72" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" />
    <text class="repeat-label" x="392" y="123" fill="#172554" font-size="15" font-weight="700">1001</text>

    <rect class="repeat-chip" x="436" y="98" width="72" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" />
    <text class="repeat-label" x="472" y="123" fill="#172554" font-size="15" font-weight="700">1001</text>

    <rect class="repeat-chip" x="516" y="98" width="72" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" />
    <text class="repeat-label" x="552" y="123" fill="#172554" font-size="15" font-weight="700">1001</text>

    <rect class="repeat-chip" x="596" y="98" width="72" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" />
    <text class="repeat-label" x="632" y="123" fill="#172554" font-size="15" font-weight="700">1001</text>
  </g>

  <g class="edge-line" stroke="#64748b" stroke-width="1.4">
    <line x1="116" y1="150" x2="668" y2="150" />
    <line x1="116" y1="144" x2="116" y2="150" />
    <line x1="668" y1="144" x2="668" y2="150" />
  </g>
  <text class="muted" x="392" y="168" fill="#526173" font-family="system-ui, sans-serif" text-anchor="middle" font-size="12.5">1001 repeats forever</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
    <rect class="repeat-chip" x="36" y="190" width="72" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" />
    <text class="repeat-label" x="72" y="215" fill="#172554" font-size="15" font-weight="700">1001</text>

    <rect class="repeat-chip" x="116" y="190" width="72" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" />
    <text class="repeat-label" x="152" y="215" fill="#172554" font-size="15" font-weight="700">1001</text>

    <rect class="repeat-chip" x="196" y="190" width="72" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" />
    <text class="repeat-label" x="232" y="215" fill="#172554" font-size="15" font-weight="700">1001</text>

    <rect class="repeat-chip" x="276" y="190" width="72" height="40" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6" />
    <text class="repeat-label" x="312" y="215" fill="#172554" font-size="15" font-weight="700">1001</text>

    <rect class="ellipsis-chip" x="356" y="190" width="72" height="40" rx="8" fill="#f5f7fb" stroke="#64748b" stroke-width="1.6" stroke-dasharray="5 4" />
    <text class="muted" x="392" y="215" fill="#526173" font-size="16" font-weight="700">…</text>
  </g>

  <line x1="442" y1="182" x2="442" y2="238" stroke="#c2410c" stroke-width="1.6" stroke-dasharray="5 4" />
  <text class="muted" x="460" y="206" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">IEEE 754 keeps only</text>
  <text class="muted" x="460" y="222" fill="#526173" font-family="system-ui, sans-serif" font-size="11.5">52 mantissa bits, then rounds</text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <text class="accent-text" x="360" y="272" fill="#9a3412" font-size="14" font-weight="700">The stored double rounds UP, past 1/10:</text>
    <text class="title" x="360" y="296" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">0.1000000000000000055511151231257827021181583404541015625</text>
    <text class="muted" x="360" y="320" fill="#526173" font-size="12.5">That's 1/10 plus about 5.5 × 10⁻¹⁸ — as close as a double can get, never exact.</text>
  </g>
</svg>
