<svg xmlns="http://www.w3.org/2000/svg" width="720" height="382" viewBox="0 0 720 382">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --c: #64748b;
      --c-soft: #e2e8f0;
      --key: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --c: #8b9bb4;
        --c-soft: #2a3342;
        --key: #242b36;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .a { fill: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .c { fill: var(--c); }
    .c-soft { fill: var(--c-soft); stroke: var(--c); }
    .key { fill: var(--key); stroke: var(--rail); }
  </style>

  <rect class="panel" width="720" height="382" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Lesiuk (2005): five weeks at work, music switched on and off</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14">56 developers at four Canadian software companies</text>
  <rect class="c-soft" x="36" y="100" width="118" height="112" rx="12" fill="#e2e8f0" stroke="#64748b" stroke-width="2" />
  <text class="muted" x="95" y="128" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Week 1</text>
  <text class="title" x="95" y="160" fill="#20242c" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Baseline</text>
  <text class="muted" x="95" y="186" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">usual habits</text>
  <rect class="a-soft" x="166" y="100" width="118" height="112" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="muted" x="225" y="128" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Week 2</text>
  <text class="title" x="225" y="160" fill="#20242c" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Music on</text>
  <text class="muted" x="225" y="186" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">library of 65 CDs</text>
  <rect class="a-soft" x="296" y="100" width="118" height="112" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="muted" x="355" y="128" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Week 3</text>
  <text class="title" x="355" y="160" fill="#20242c" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Music on</text>
  <text class="muted" x="355" y="186" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">listen as you like</text>
  <rect class="b-soft" x="426" y="100" width="118" height="112" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="muted" x="485" y="128" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Week 4</text>
  <text class="title" x="485" y="160" fill="#20242c" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Music off</text>
  <text class="muted" x="485" y="186" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">signed daily</text>
  <rect class="a-soft" x="556" y="100" width="118" height="112" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="muted" x="615" y="128" fill="#526173" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Week 5</text>
  <text class="title" x="615" y="160" fill="#20242c" font-family="system-ui, sans-serif" font-size="17" font-weight="700" text-anchor="middle">Music on</text>
  <text class="muted" x="615" y="186" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">library back</text>
  <line class="rail" x1="36" y1="238" x2="684" y2="238" stroke="#94a3b8" stroke-width="1.5" />
  <circle class="a" cx="72" cy="238" r="5" fill="#2563eb" />
  <circle class="a" cx="118" cy="238" r="5" fill="#2563eb" />
  <circle class="a" cx="202" cy="238" r="5" fill="#2563eb" />
  <circle class="a" cx="248" cy="238" r="5" fill="#2563eb" />
  <circle class="a" cx="332" cy="238" r="5" fill="#2563eb" />
  <circle class="a" cx="378" cy="238" r="5" fill="#2563eb" />
  <circle class="a" cx="462" cy="238" r="5" fill="#2563eb" />
  <circle class="a" cx="508" cy="238" r="5" fill="#2563eb" />
  <circle class="a" cx="592" cy="238" r="5" fill="#2563eb" />
  <circle class="a" cx="638" cy="238" r="5" fill="#2563eb" />
  <text class="title" x="36" y="272" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">● Two measurements a week, in the afternoon, all self-reported:</text>
  <text class="muted" x="56" y="296" fill="#526173" font-family="system-ui, sans-serif" font-size="14">mood (state positive affect), quality of work, and time on task</text>
  <text class="title" x="36" y="330" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">No separate control group. Each developer is compared with themselves over time.</text>
  <text class="muted" x="36" y="358" fill="#526173" font-family="system-ui, sans-serif" font-size="13">Design from Lesiuk (2005), Psychology of Music 33(2). Diagram drawn for this Quiz.</text>
</svg>
