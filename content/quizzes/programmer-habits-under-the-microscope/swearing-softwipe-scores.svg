<svg xmlns="http://www.w3.org/2000/svg" width="720" height="396" viewBox="0 0 720 396">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --c: #64748b;
      --c-soft: #e2e8f0;
      --key: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --c: #8b9bb4;
        --c-soft: #2a3342;
        --key: #242b36;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .a { fill: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .c { fill: var(--c); }
    .c-soft { fill: var(--c-soft); stroke: var(--c); }
    .key { fill: var(--key); stroke: var(--rail); }
  </style>

  <rect class="panel" width="720" height="396" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Average SoftWipe score, C repositories on GitHub</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Coding-standard adherence from 0 (low) to 10 (high)</text>
  <line class="rail" x1="230" y1="100" x2="230" y2="262" stroke="#94a3b8" stroke-opacity="1" />
  <text class="muted" x="230" y="282" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">0</text>
  <line class="rail" x1="275" y1="100" x2="275" y2="262" stroke="#94a3b8" stroke-opacity="0.45" />
  <text class="muted" x="275" y="282" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">1</text>
  <line class="rail" x1="320" y1="100" x2="320" y2="262" stroke="#94a3b8" stroke-opacity="0.45" />
  <text class="muted" x="320" y="282" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">2</text>
  <line class="rail" x1="365" y1="100" x2="365" y2="262" stroke="#94a3b8" stroke-opacity="0.45" />
  <text class="muted" x="365" y="282" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">3</text>
  <line class="rail" x1="410" y1="100" x2="410" y2="262" stroke="#94a3b8" stroke-opacity="0.45" />
  <text class="muted" x="410" y="282" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">4</text>
  <line class="rail" x1="455" y1="100" x2="455" y2="262" stroke="#94a3b8" stroke-opacity="0.45" />
  <text class="muted" x="455" y="282" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">5</text>
  <line class="rail" x1="500" y1="100" x2="500" y2="262" stroke="#94a3b8" stroke-opacity="0.45" />
  <text class="muted" x="500" y="282" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">6</text>
  <line class="rail" x1="545" y1="100" x2="545" y2="262" stroke="#94a3b8" stroke-opacity="0.45" />
  <text class="muted" x="545" y="282" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">7</text>
  <line class="rail" x1="590" y1="100" x2="590" y2="262" stroke="#94a3b8" stroke-opacity="0.45" />
  <text class="muted" x="590" y="282" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">8</text>
  <line class="rail" x1="635" y1="100" x2="635" y2="262" stroke="#94a3b8" stroke-opacity="0.45" />
  <text class="muted" x="635" y="282" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">9</text>
  <line class="rail" x1="680" y1="100" x2="680" y2="262" stroke="#94a3b8" stroke-opacity="0.45" />
  <text class="muted" x="680" y="282" fill="#526173" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">10</text>
  <text class="title" x="36" y="136" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700">With swearwords</text>
  <text class="muted" x="36" y="156" fill="#526173" font-family="system-ui, sans-serif" font-size="13">≈3,800 repositories</text>
  <rect class="b" x="230" y="116" width="264.1" height="44" rx="4" fill="#c2410c" />
  <text class="title" x="508.15" y="144" fill="#20242c" font-family="system-ui, sans-serif" font-size="16" font-weight="700">5.87</text>
  <text class="muted" x="556" y="143" fill="#526173" font-family="system-ui, sans-serif" font-size="12">95% CI 5.81 to 5.93</text>
  <text class="title" x="36" y="210" fill="#20242c" font-family="system-ui, sans-serif" font-size="14" font-weight="700">Comparison: 4+ stars</text>
  <text class="muted" x="36" y="230" fill="#526173" font-family="system-ui, sans-serif" font-size="13">≈7,600 repositories</text>
  <rect class="a" x="230" y="190" width="243.5" height="44" rx="4" fill="#2563eb" />
  <text class="title" x="487.4" y="218" fill="#20242c" font-family="system-ui, sans-serif" font-size="16" font-weight="700">5.41</text>
  <text class="muted" x="535" y="217" fill="#526173" font-family="system-ui, sans-serif" font-size="12">95% CI 5.38 to 5.45</text>
  <text class="title" x="36" y="322" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">The intervals don't overlap, so the gap is unlikely to be chance.</text>
  <text class="title" x="36" y="344" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">But the gap is only 0.46 points out of 10, and nobody was assigned to swear.</text>
  <text class="muted" x="36" y="372" fill="#526173" font-family="system-ui, sans-serif" font-size="13">Numbers from Table 3.1 of Jan Strehmel's bachelor's thesis (KIT, 2023).</text>
</svg>
