<svg xmlns="http://www.w3.org/2000/svg" width="720" height="424" viewBox="0 0 720 424">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --c: #64748b;
      --c-soft: #e2e8f0;
      --key: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --c: #8b9bb4;
        --c-soft: #2a3342;
        --key: #242b36;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .a { fill: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .c { fill: var(--c); }
    .c-soft { fill: var(--c-soft); stroke: var(--c); }
    .key { fill: var(--key); stroke: var(--rail); }
  </style>

  <rect class="panel" width="720" height="424" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Eclipse: share of changes that later needed a fix</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14">P(bug) by the weekday of the commit, in %. The axis starts at zero.</text>
