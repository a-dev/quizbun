  <text class="title" x="36" y="378" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">Highest: Friday 12.2%. Lowest: Tuesday 10.4%. Average across the week: 11.4%.</text>
  <text class="muted" x="36" y="400" fill="#526173" font-family="system-ui, sans-serif" font-size="13">Numbers from Table 1 of Śliwerski, Zimmermann and Zeller (2005). Data from a single project.</text>
</svg>
