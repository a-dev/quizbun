<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --rail: #94a3b8;
      --a: #2563eb;
      --a-soft: #dbeafe;
      --b: #c2410c;
      --b-soft: #ffedd5;
      --c: #64748b;
      --c-soft: #e2e8f0;
      --key: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --rail: #4b5a70;
        --a: #60a5fa;
        --a-soft: #1e3a5f;
        --b: #fb923c;
        --b-soft: #4a2410;
        --c: #8b9bb4;
        --c-soft: #2a3342;
        --key: #242b36;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .rail { stroke: var(--rail); }
    .a { fill: var(--a); }
    .a-soft { fill: var(--a-soft); stroke: var(--a); }
    .b { fill: var(--b); }
    .b-line { stroke: var(--b); }
    .b-soft { fill: var(--b-soft); stroke: var(--b); }
    .c { fill: var(--c); }
    .c-soft { fill: var(--c-soft); stroke: var(--c); }
    .key { fill: var(--key); stroke: var(--rail); }
    .on-b { fill: var(--key); }
  </style>

  <rect class="panel" width="720" height="440" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="46" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Firefox top developers: who works outside office hours?</text>
  <text class="muted" x="36" y="72" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Share of each group in each work-pattern cluster (k-means on commit times)</text>
  <text class="title" x="36" y="134" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Unpaid</text>
  <text class="muted" x="36" y="154" fill="#526173" font-family="system-ui, sans-serif" font-size="13">48 developers</text>
  <rect class="b" x="200.0" y="110" width="231.8" height="52" stroke="#c2410c" fill="#c2410c" />
  <text class="on-b" x="315.918" y="142" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">47.9%</text>
  <rect class="c-soft" x="431.8" y="110" width="151.5" height="52" stroke="#64748b" fill="#e2e8f0" />
  <text class="title" x="507.582" y="142" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">31.3%</text>
  <rect class="a-soft" x="583.3" y="110" width="100.7" height="52" stroke="#2563eb" fill="#dbeafe" />
  <text class="title" x="633.664" y="142" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">20.8%</text>
  <text class="title" x="36" y="230" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Paid by Mozilla</text>
  <text class="muted" x="36" y="250" fill="#526173" font-family="system-ui, sans-serif" font-size="13">227 developers</text>
  <rect class="b" x="200.0" y="206" width="48.9" height="52" stroke="#c2410c" fill="#c2410c" />
  <text class="on-b" x="224.442" y="238" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">10.1%</text>
  <rect class="c-soft" x="248.9" y="206" width="243.0" height="52" stroke="#64748b" fill="#e2e8f0" />
  <text class="title" x="370.368" y="238" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">50.2%</text>
  <rect class="a-soft" x="491.9" y="206" width="192.1" height="52" stroke="#2563eb" fill="#dbeafe" />
  <text class="title" x="587.9" y="238" fill="#20242c" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">39.7%</text>
  <rect class="b" x="36" y="318" width="16" height="16" rx="3" fill="#c2410c" />
  <text class="title" x="60" y="331" fill="#20242c" font-family="system-ui, sans-serif" font-size="13">Evenings and weekends</text>
  <rect class="c-soft" x="250" y="318" width="16" height="16" rx="3" fill="#e2e8f0" stroke="#64748b" />
  <text class="title" x="274" y="331" fill="#20242c" font-family="system-ui, sans-serif" font-size="13">In between</text>
  <rect class="a-soft" x="400" y="318" width="16" height="16" rx="3" fill="#dbeafe" stroke="#2563eb" />
  <text class="title" x="424" y="331" fill="#20242c" font-family="system-ui, sans-serif" font-size="13">Office hours (10:00 to 18:00)</text>
  <text class="title" x="36" y="372" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">Each group had 23 developers in the evenings-and-weekends cluster.</text>
  <text class="title" x="36" y="392" fill="#20242c" font-family="system-ui, sans-serif" font-size="14">That's about half of the unpaid developers, but only one in ten of the paid ones.</text>
  <text class="muted" x="36" y="418" fill="#526173" font-family="system-ui, sans-serif" font-size="13">Numbers from Table 3 of Claes, Mäntylä, Kuutila and Adams (2018).</text>
</svg>
