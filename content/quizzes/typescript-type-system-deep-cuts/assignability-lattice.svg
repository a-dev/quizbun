<svg xmlns="http://www.w3.org/2000/svg" width="720" height="578" viewBox="0 0 720 578">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .info-line { stroke: var(--info-edge); }
    .good-line { stroke: var(--good-edge); }
  </style>
  <defs>
    <marker id="arrow-info" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--info-edge)" />
    </marker>
    <marker id="arrow-good" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--good-edge)" />
    </marker>
  </defs>
  <rect class="panel" width="720" height="578" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">The assignability lattice, and the two types that sit outside it</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">An arrow means “is assignable to”. Everything flows up toward unknown and down from never.</text>
  <rect class="card" x="36" y="88" width="400" height="322" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <rect class="info-box" x="146" y="116" width="180" height="54" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="236" y="142" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">unknown</text>
  <text class="info-text" x="236" y="160" fill="#172554" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">the top type</text>
  <rect class="card" x="62" y="216" width="106" height="36" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="115" y="240" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">string</text>
  <path class="info-line" d="M115,212 V176" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-info)" />
  <path class="good-line" d="M115,300 V256" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)" />
  <rect class="card" x="184" y="216" width="106" height="36" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="237" y="240" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">number</text>
  <path class="info-line" d="M237,212 V176" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-info)" />
  <path class="good-line" d="M237,300 V256" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)" />
  <rect class="card" x="306" y="216" width="106" height="36" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="muted" x="359" y="240" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">{ x: 1 }</text>
  <path class="info-line" d="M359,212 V176" fill="none" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-info)" />
  <path class="good-line" d="M359,300 V256" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-good)" />
  <rect class="good-box" x="146" y="304" width="180" height="54" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="236" y="330" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" text-anchor="middle">never</text>
  <text class="good-text" x="236" y="348" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">the bottom type</text>
  <text class="muted" x="54" y="382" fill="#526173" font-family="system-ui, sans-serif" font-size="10">Every type is assignable to unknown, and nothing can be done with an unknown</text>
  <text class="muted" x="54" y="398" fill="#526173" font-family="system-ui, sans-serif" font-size="10">until you narrow it. never has no values, so it is assignable to every type.</text>
  <rect class="accent-box" x="452" y="88" width="232" height="156" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="470" y="114" fill="#9a3412" font-family="system-ui, sans-serif" font-size="13" font-weight="700">any opts out</text>
  <text class="accent-text" x="470" y="138" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">Everything is assignable to any, and any</text>
  <text class="accent-text" x="470" y="154" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">is assignable back to everything except</text>
  <text class="accent-text" x="470" y="170" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">never — so it is not the top of a sound</text>
  <text class="accent-text" x="470" y="186" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">lattice, it is a hole in one. unknown</text>
  <text class="accent-text" x="470" y="202" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">accepts just as much and stays honest.</text>
  <text class="accent-text" x="470" y="230" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10">let x; with no initialiser is any, not never.</text>
  <rect class="card" x="452" y="256" width="232" height="154" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="470" y="282" fill="#20242c" font-family="system-ui, sans-serif" font-size="13" font-weight="700">void is a promise to ignore</text>
  <text class="muted" x="470" y="306" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">A void return type means “the caller</text>
  <text class="muted" x="470" y="322" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">will ignore whatever comes back”, not</text>
  <text class="muted" x="470" y="338" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">“return nothing”. So a function that</text>
  <text class="muted" x="470" y="354" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">returns a value is assignable to a</text>
  <text class="muted" x="470" y="370" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">() =&gt; void parameter — which is why</text>
  <text class="muted" x="470" y="386" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">arr.forEach(x =&gt; out.push(x)) compiles.</text>
  <rect class="info-box" x="36" y="426" width="648" height="122" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="54" y="450" fill="#172554" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Where never turns up without you typing it</text>
  <text class="info-text" x="54" y="472" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">string &amp; number</text>
  <text class="info-text" x="266" y="472" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">no value is both, so the intersection is the empty set</text>
  <text class="info-text" x="54" y="487" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">"a" &amp; "b"</text>
  <text class="info-text" x="266" y="487" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">the same reasoning for two disjoint literal types</text>
  <text class="info-text" x="54" y="502" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">{ x: 1 } &amp; { x: 2 }</text>
  <text class="info-text" x="266" y="502" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">the conflict is confined to the property: x becomes never</text>
  <text class="info-text" x="54" y="517" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">a fully narrowed union</text>
  <text class="info-text" x="266" y="517" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">nothing is left in the default branch — the exhaustiveness check</text>
  <text class="info-text" x="54" y="532" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">a function that always throws</text>
  <text class="info-text" x="266" y="532" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">control never reaches a return, so the return type is never</text>
</svg>
