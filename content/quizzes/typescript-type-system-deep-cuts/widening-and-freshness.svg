<svg xmlns="http://www.w3.org/2000/svg" width="720" height="524" viewBox="0 0 720 524">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-text: #8a97a8;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-text: #6b7787;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-text: #bbf7d0;
      }
    }

    .card { fill: var(--card); stroke: var(--edge); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
  </style>
  <rect class="panel" width="720" height="524" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Widening, freshness, and the three ways to check a value</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">How precise an inferred type stays depends on whether the slot it lands in can still change.</text>
  <rect class="card" x="36" y="88" width="648" height="202" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">What the compiler infers, and why</text>
  <text class="dead-text" x="54" y="136" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">expression</text>
  <text class="dead-text" x="340" y="136" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">inferred type</text>
  <text class="dead-text" x="520" y="136" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">because</text>
  <text class="muted" x="54" y="158" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">let a = "hi"</text>
  <text class="info-text" x="340" y="158" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">string</text>
  <text class="muted" x="520" y="158" fill="#526173" font-family="system-ui, sans-serif" font-size="10">a let can be reassigned</text>
  <text class="muted" x="54" y="178" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">const b = "hi"</text>
  <text class="info-text" x="340" y="178" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">"hi"</text>
  <text class="muted" x="520" y="178" fill="#526173" font-family="system-ui, sans-serif" font-size="10">the binding is frozen</text>
  <text class="muted" x="54" y="198" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">const c = { mode: "dark" }</text>
  <text class="info-text" x="340" y="198" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">{ mode: string }</text>
  <text class="muted" x="520" y="198" fill="#526173" font-family="system-ui, sans-serif" font-size="10">the property is still mutable</text>
  <text class="muted" x="54" y="218" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">const d = { … } as const</text>
  <text class="info-text" x="340" y="218" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">{ readonly mode: "dark" }</text>
  <text class="muted" x="520" y="218" fill="#526173" font-family="system-ui, sans-serif" font-size="10">as const freezes the property</text>
  <text class="muted" x="54" y="238" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">const pair = [3, 4]</text>
  <text class="info-text" x="340" y="238" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">number[]</text>
  <text class="muted" x="520" y="238" fill="#526173" font-family="system-ui, sans-serif" font-size="10">mutable, of unknown length</text>
  <text class="muted" x="54" y="258" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">[3, 4] as const</text>
  <text class="info-text" x="340" y="258" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="700">readonly [3, 4]</text>
  <text class="muted" x="520" y="258" fill="#526173" font-family="system-ui, sans-serif" font-size="10">literal, tuple, and readonly</text>
  <text class="muted" x="54" y="280" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">const freezes the binding, never the object behind it — which is why only the top-level primitive keeps its literal type.</text>
  <rect class="accent-box" x="36" y="306" width="316" height="190" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="54" y="332" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Freshness is what triggers the error</text>
  <text class="accent-text" x="54" y="356" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">type Point = { x: number; y: number }</text>
  <text class="accent-text" x="54" y="384" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">const p: Point = { x, y, z };</text>
  <text class="accent-text" x="54" y="398" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5">errors — a fresh literal, straight into a typed slot</text>
  <text class="good-text" x="54" y="422" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">const v = { x, y, z };</text>
  <text class="good-text" x="54" y="436" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">const q: Point = v;</text>
  <text class="good-text" x="54" y="450" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5">compiles — v is not fresh, and structurally it is a Point</text>
  <text class="accent-text" x="54" y="474" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.5">The check is a typo guard bolted onto a structural system.</text>
  <rect class="card" x="368" y="306" width="316" height="190" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="386" y="332" fill="#20242c" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700">Three tools, two questions</text>
  <text class="muted" x="386" y="356" fill="#526173" font-family="system-ui, sans-serif" font-size="10"></text>
  <text class="dead-text" x="520" y="356" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">validates?</text>
  <text class="dead-text" x="626" y="356" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">keeps precision?</text>
  <text class="muted" x="386" y="382" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">annotation</text>
  <text class="muted" x="520" y="382" fill="#526173" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">yes</text>
  <text class="muted" x="626" y="382" fill="#526173" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">no</text>
  <text class="accent-text" x="386" y="408" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">as assertion</text>
  <text class="accent-text" x="520" y="408" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">no</text>
  <text class="accent-text" x="626" y="408" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">asserted</text>
  <text class="good-text" x="386" y="434" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">satisfies</text>
  <text class="good-text" x="520" y="434" fill="#14532d" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">yes</text>
  <text class="good-text" x="626" y="434" fill="#14532d" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">yes</text>
  <text class="muted" x="386" y="466" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5">An annotation widens the value to the annotated type; as skips the</text>
  <text class="muted" x="386" y="480" fill="#526173" font-family="system-ui, sans-serif" font-size="9.5">check entirely; satisfies checks and then leaves the inference alone.</text>
</svg>
