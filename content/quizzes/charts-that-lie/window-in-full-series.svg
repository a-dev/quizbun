<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --grid: #d7dee9;
      --ink: #2563eb;
      --ink2: #c2410c;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --grid: #333c48;
        --ink: #7aa2f7;
        --ink2: #f0a35e;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #232b36;
      }
    }
    .panel { fill: var(--panel); }
    .band { fill: var(--band); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .grid { stroke: var(--grid); }
    .ink { stroke: var(--ink); }
    .ink-f { fill: var(--ink); }
    .ink2 { stroke: var(--ink2); }
    .ink2-f { fill: var(--ink2); }
    .bad { stroke: var(--bad); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="400" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="42" fill="#20242c" font-size="19" font-weight="700">Same product, 2015 to 2025</text>
  <text class="muted" x="32" y="66" fill="#526173" font-size="14">Average weekly users (millions). Shaded area is 2022.</text>
