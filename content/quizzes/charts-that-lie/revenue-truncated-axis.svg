<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --grid: #d7dee9;
      --ink: #2563eb;
      --ink2: #c2410c;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --grid: #333c48;
        --ink: #7aa2f7;
        --ink2: #f0a35e;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #232b36;
      }
    }
    .panel { fill: var(--panel); }
    .band { fill: var(--band); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .grid { stroke: var(--grid); }
    .ink { stroke: var(--ink); }
    .ink-f { fill: var(--ink); }
    .ink2 { stroke: var(--ink2); }
    .ink2-f { fill: var(--ink2); }
    .bad { stroke: var(--bad); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="400" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="44" fill="#20242c" font-size="19" font-weight="700">Revenue is exploding</text>
  <text class="muted" x="32" y="68" fill="#526173" font-size="14">Quarterly revenue, $M</text>
  <line class="grid" x1="96" y1="328" x2="666" y2="328" stroke="#d7dee9" stroke-width="1" />
  <text class="muted mono" x="86" y="332" fill="#526173" font-size="12" text-anchor="end">98</text>
  <line class="grid" x1="96" y1="249.33" x2="666" y2="249.33" stroke="#d7dee9" stroke-width="1" />
  <text class="muted mono" x="86" y="253.33" fill="#526173" font-size="12" text-anchor="end">100</text>
  <line class="grid" x1="96" y1="170.67" x2="666" y2="170.67" stroke="#d7dee9" stroke-width="1" />
  <text class="muted mono" x="86" y="174.67" fill="#526173" font-size="12" text-anchor="end">102</text>
  <line class="grid" x1="96" y1="92" x2="666" y2="92" stroke="#d7dee9" stroke-width="1" />
  <text class="muted mono" x="86" y="96" fill="#526173" font-size="12" text-anchor="end">104</text>
  <line class="edge" x1="96" y1="92" x2="96" y2="328" stroke="#64748b" stroke-width="1.5" />
  <line class="edge" x1="96" y1="328" x2="666" y2="328" stroke="#64748b" stroke-width="1.5" />
  <rect class="ink-f" x="131.25" y="249.33" width="72" height="78.67" rx="3" fill="#2563eb" />
  <text class="title mono" x="167.25" y="240.33" fill="#20242c" font-size="13" text-anchor="middle">100</text>
  <text class="muted" x="167.25" y="352" fill="#526173" font-size="13" text-anchor="middle">Q1</text>
  <rect class="ink-f" x="273.75" y="210" width="72" height="118" rx="3" fill="#2563eb" />
  <text class="title mono" x="309.75" y="201" fill="#20242c" font-size="13" text-anchor="middle">101</text>
  <text class="muted" x="309.75" y="352" fill="#526173" font-size="13" text-anchor="middle">Q2</text>
  <rect class="ink-f" x="416.25" y="170.67" width="72" height="157.33" rx="3" fill="#2563eb" />
  <text class="title mono" x="452.25" y="161.67" fill="#20242c" font-size="13" text-anchor="middle">102</text>
  <text class="muted" x="452.25" y="352" fill="#526173" font-size="13" text-anchor="middle">Q3</text>
  <rect class="ink-f" x="558.75" y="131.33" width="72" height="196.67" rx="3" fill="#2563eb" />
  <text class="title mono" x="594.75" y="122.33" fill="#20242c" font-size="13" text-anchor="middle">103</text>
  <text class="muted" x="594.75" y="352" fill="#526173" font-size="13" text-anchor="middle">Q4</text>
</svg>
