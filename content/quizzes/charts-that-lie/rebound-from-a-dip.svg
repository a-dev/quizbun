<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --grid: #d7dee9;
      --ink: #2563eb;
      --ink2: #c2410c;
      --bad: #dc2626;
      --good: #0f766e;
      --band: #e6ecf6;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --grid: #333c48;
        --ink: #7aa2f7;
        --ink2: #f0a35e;
        --bad: #f2777a;
        --good: #4ec9a0;
        --band: #232b36;
      }
    }
    .panel { fill: var(--panel); }
    .band { fill: var(--band); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .grid { stroke: var(--grid); }
    .ink { stroke: var(--ink); }
    .ink-f { fill: var(--ink); }
    .ink2 { stroke: var(--ink2); }
    .ink2-f { fill: var(--ink2); }
    .bad { stroke: var(--bad); }
    .bad-f { fill: var(--bad); }
    .good-f { fill: var(--good); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="720" height="380" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="42" fill="#20242c" font-size="19" font-weight="700">Bookings up 42% year over year</text>
  <text class="muted" x="32" y="66" fill="#526173" font-size="14">Annual bookings, thousands</text>
  <line class="grid" x1="84" y1="306" x2="664" y2="306" stroke="#d7dee9" stroke-width="1" />
  <text class="muted mono" x="74" y="310" fill="#526173" font-size="12" text-anchor="end">0</text>
  <line class="grid" x1="84" y1="236" x2="664" y2="236" stroke="#d7dee9" stroke-width="1" />
  <text class="muted mono" x="74" y="240" fill="#526173" font-size="12" text-anchor="end">40</text>
  <line class="grid" x1="84" y1="166" x2="664" y2="166" stroke="#d7dee9" stroke-width="1" />
  <text class="muted mono" x="74" y="170" fill="#526173" font-size="12" text-anchor="end">80</text>
  <line class="grid" x1="84" y1="96" x2="664" y2="96" stroke="#d7dee9" stroke-width="1" />
  <text class="muted mono" x="74" y="100" fill="#526173" font-size="12" text-anchor="end">120</text>
  <line class="edge" x1="84" y1="96" x2="84" y2="306" stroke="#64748b" stroke-width="1.5" />
  <line class="edge" x1="84" y1="306" x2="664" y2="306" stroke="#64748b" stroke-width="1.5" />
  <rect class="ink-f" x="105.27" y="131" width="54.13" height="175" rx="3" fill="#2563eb" />
  <text class="title mono" x="132.33" y="122" fill="#20242c" font-size="13" text-anchor="middle">100</text>
  <text class="muted" x="132.33" y="330" fill="#526173" font-size="13" text-anchor="middle">2018</text>
  <rect class="ink-f" x="201.93" y="124" width="54.13" height="182" rx="3" fill="#2563eb" />
  <text class="title mono" x="229" y="115" fill="#20242c" font-size="13" text-anchor="middle">104</text>
  <text class="muted" x="229" y="330" fill="#526173" font-size="13" text-anchor="middle">2019</text>
  <rect class="bad-f" x="298.6" y="197.5" width="54.13" height="108.5" rx="3" fill="#dc2626" />
  <text class="title mono" x="325.67" y="188.5" fill="#20242c" font-size="13" text-anchor="middle">62</text>
  <text class="muted" x="325.67" y="330" fill="#526173" font-size="13" text-anchor="middle">2020</text>
  <rect class="good-f" x="395.27" y="152" width="54.13" height="154" rx="3" fill="#0f766e" />
  <text class="title mono" x="422.33" y="143" fill="#20242c" font-size="13" text-anchor="middle">88</text>
  <text class="muted" x="422.33" y="330" fill="#526173" font-size="13" text-anchor="middle">2021</text>
  <rect class="ink-f" x="491.93" y="132.75" width="54.13" height="173.25" rx="3" fill="#2563eb" />
  <text class="title mono" x="519" y="123.75" fill="#20242c" font-size="13" text-anchor="middle">99</text>
  <text class="muted" x="519" y="330" fill="#526173" font-size="13" text-anchor="middle">2022</text>
  <rect class="ink-f" x="588.6" y="120.5" width="54.13" height="185.5" rx="3" fill="#2563eb" />
  <text class="title mono" x="615.67" y="111.5" fill="#20242c" font-size="13" text-anchor="middle">106</text>
  <text class="muted" x="615.67" y="330" fill="#526173" font-size="13" text-anchor="middle">2023</text>
  <text class="muted" x="32" y="356" fill="#526173" font-size="13">2021 is compared with 2020.</text>
</svg>
