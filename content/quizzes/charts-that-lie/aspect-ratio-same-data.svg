  <line class="edge" x1="92" y1="92" x2="92" y2="342" stroke="#64748b" stroke-width="1.5" />
  <line class="edge" x1="92" y1="342" x2="242" y2="342" stroke="#64748b" stroke-width="1.5" />
  <polyline class="ink" points="92,310.75 105.64,285.75 119.27,292 132.91,260.75 146.55,235.75 160.18,248.25 173.82,210.75 187.45,192 201.09,198.25 214.73,160.75 228.36,142 242,117" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" />
  <text class="muted" x="167" y="368" fill="#526173" font-size="13" text-anchor="middle">Tall and narrow</text>
