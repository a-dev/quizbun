<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --style-fill: #e2e8f0;
      --style-edge: #475569;
      --style-text: #1e293b;
      --layout-fill: #ffedd5;
      --layout-edge: #c2410c;
      --layout-text: #9a3412;
      --paint-fill: #dbeafe;
      --paint-edge: #2563eb;
      --paint-text: #172554;
      --composite-fill: #dcfce7;
      --composite-edge: #16a34a;
      --composite-text: #15803d;
      --skip-fill: #f5f7fb;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --style-fill: #2b3441;
        --style-edge: #94a3b8;
        --style-text: #e2e8f0;
        --layout-fill: #3a2416;
        --layout-edge: #fb923c;
        --layout-text: #fdba74;
        --paint-fill: #1e3a5f;
        --paint-edge: #60a5fa;
        --paint-text: #dbeafe;
        --composite-fill: #14321f;
        --composite-edge: #4ade80;
        --composite-text: #86efac;
        --skip-fill: #1a1f27;
      }
    }

    .panel-bg { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge-line { stroke: var(--edge); }
    .style-box { fill: var(--style-fill); stroke: var(--style-edge); }
    .style-text { fill: var(--style-text); }
    .layout-box { fill: var(--layout-fill); stroke: var(--layout-edge); }
    .layout-text { fill: var(--layout-text); }
    .paint-box { fill: var(--paint-fill); stroke: var(--paint-edge); }
    .paint-text { fill: var(--paint-text); }
    .composite-box { fill: var(--composite-fill); stroke: var(--composite-edge); }
    .composite-text { fill: var(--composite-text); }
    .skip-box { fill: var(--skip-fill); stroke: var(--edge); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" fill-rule="evenodd" />
    </marker>
  </defs>

  <rect class="panel-bg" width="720" height="640" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Where each property change enters the pipeline
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Style always runs first. From there, you can skip steps at the front — never at the back.
  </text>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect class="style-box" x="24" y="100" width="138" height="70" rx="12" fill="#e2e8f0" stroke="#475569" stroke-width="2" />
    <text class="style-text" x="93" y="130" fill="#1e293b" font-size="14" font-weight="700">STYLE</text>
    <text class="style-text" x="93" y="148" fill="#1e293b" font-size="10.5">always runs</text>

    <path d="M162,135 L198,135" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <rect class="layout-box" x="202" y="100" width="138" height="70" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="layout-text" x="271" y="130" fill="#9a3412" font-size="14" font-weight="700">LAYOUT</text>
    <text class="layout-text" x="271" y="148" fill="#9a3412" font-size="10.5">geometry</text>

    <path d="M340,135 L376,135" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <rect class="paint-box" x="380" y="100" width="138" height="70" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="paint-text" x="449" y="130" fill="#172554" font-size="14" font-weight="700">PAINT</text>
    <text class="paint-text" x="449" y="148" fill="#172554" font-size="10.5">pixels</text>

    <path d="M518,135 L554,135" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

    <rect class="composite-box" x="558" y="100" width="138" height="70" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="composite-text" x="627" y="130" fill="#15803d" font-size="14" font-weight="700">COMPOSITE</text>
    <text class="composite-text" x="627" y="148" fill="#15803d" font-size="10.5">GPU layers</text>
  </g>

  <line class="edge-line" x1="36" y1="196" x2="684" y2="196" stroke="#64748b" stroke-width="1" stroke-dasharray="2 4" />

  <!-- Row 1: layout properties -->
  <g font-family="system-ui, sans-serif">
    <text class="title" x="36" y="234" fill="#20242c" font-size="14" font-weight="700">Layout properties</text>
    <text class="muted" x="36" y="252" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">width · top · font-weight</text>

    <text class="layout-text" x="271" y="276" fill="#9a3412" font-size="10" text-anchor="middle" font-weight="700">▼ enters here</text>

    <rect class="layout-box" x="202" y="282" width="138" height="44" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="layout-text" x="271" y="309" fill="#9a3412" font-size="12" font-weight="700" text-anchor="middle">Layout</text>
    <rect class="layout-box" x="380" y="282" width="138" height="44" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="layout-text" x="449" y="309" fill="#9a3412" font-size="12" font-weight="700" text-anchor="middle">Paint</text>
    <rect class="layout-box" x="558" y="282" width="138" height="44" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <text class="layout-text" x="627" y="309" fill="#9a3412" font-size="12" font-weight="700" text-anchor="middle">Composite</text>
  </g>

  <line class="edge-line" x1="36" y1="346" x2="684" y2="346" stroke="#64748b" stroke-width="1" stroke-dasharray="2 4" />

  <!-- Row 2: paint-only properties -->
  <g font-family="system-ui, sans-serif">
    <text class="title" x="36" y="384" fill="#20242c" font-size="14" font-weight="700">Paint-only properties</text>
    <text class="muted" x="36" y="402" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">background-color · color · box-shadow</text>

    <rect class="skip-box" x="202" y="432" width="138" height="44" rx="10" fill="#f5f7fb" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" />
    <text class="muted" x="271" y="459" fill="#526173" font-size="12" text-anchor="middle">skipped</text>

    <text class="paint-text" x="449" y="426" fill="#172554" font-size="10" text-anchor="middle" font-weight="700">▼ enters here</text>

    <rect class="paint-box" x="380" y="432" width="138" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="paint-text" x="449" y="459" fill="#172554" font-size="12" font-weight="700" text-anchor="middle">Paint</text>
    <rect class="paint-box" x="558" y="432" width="138" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="paint-text" x="627" y="459" fill="#172554" font-size="12" font-weight="700" text-anchor="middle">Composite</text>
  </g>

  <line class="edge-line" x1="36" y1="496" x2="684" y2="496" stroke="#64748b" stroke-width="1" stroke-dasharray="2 4" />

  <!-- Row 3: composite-only properties -->
  <g font-family="system-ui, sans-serif">
    <text class="title" x="36" y="534" fill="#20242c" font-size="14" font-weight="700">Composite-only properties</text>
    <text class="muted" x="36" y="552" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">transform · opacity</text>

    <rect class="skip-box" x="202" y="582" width="138" height="44" rx="10" fill="#f5f7fb" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" />
    <text class="muted" x="271" y="609" fill="#526173" font-size="12" text-anchor="middle">skipped</text>
    <rect class="skip-box" x="380" y="582" width="138" height="44" rx="10" fill="#f5f7fb" stroke="#64748b" stroke-width="2" stroke-dasharray="5 4" />
    <text class="muted" x="449" y="609" fill="#526173" font-size="12" text-anchor="middle">skipped</text>

    <text class="composite-text" x="627" y="576" fill="#15803d" font-size="10" text-anchor="middle" font-weight="700">▼ enters here</text>

    <rect class="composite-box" x="558" y="582" width="138" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
    <text class="composite-text" x="627" y="609" fill="#15803d" font-size="12" font-weight="700" text-anchor="middle">Composite</text>
  </g>
</svg>
