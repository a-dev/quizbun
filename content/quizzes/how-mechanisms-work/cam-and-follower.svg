<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="720" height="300" rx="20" fill="#f5f7fb" />

  <g transform="translate(20,20)">
    <rect class="card" width="216" height="260" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="108" y="26" text-anchor="middle" font-size="13" fill="#526173">low point</text>
    <path d="M60 190 Q108 130 156 190 Q170 210 108 215 Q46 210 60 190 Z" fill="none" stroke="#20242c" stroke-width="4" />
    <path d="M108 190 H92" class="edge" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <path d="m102 181 -12 9 12 9" class="edge" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text class="muted" x="60" y="205" text-anchor="middle" font-size="11" fill="#526173">cam: driven</text>
    <rect x="98" y="130" width="20" height="45" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="4" />
    <circle cx="108" cy="120" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="4" />
    <text class="muted" x="108" y="245" text-anchor="middle" font-size="12" fill="#526173">follower: down</text>
  </g>

  <g transform="translate(252,20)">
    <rect class="card" width="216" height="260" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="108" y="26" text-anchor="middle" font-size="13" fill="#526173">rising edge</text>
    <path d="M60 190 Q108 130 156 190 Q170 210 108 215 Q46 210 60 190 Z" fill="none" stroke="#20242c" stroke-width="4" transform="rotate(150 108 195)" />
    <path d="M108 190 H92" class="edge" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <path d="m102 181 -12 9 12 9" class="edge" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="98" y="95" width="20" height="80" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="4" />
    <circle cx="108" cy="85" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="4" />
    <text class="muted" x="108" y="245" text-anchor="middle" font-size="12" fill="#526173">follower: rising</text>
  </g>

  <g transform="translate(484,20)">
    <rect class="card" width="216" height="260" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="108" y="26" text-anchor="middle" font-size="13" fill="#526173">peak (lobe)</text>
    <path d="M60 190 Q108 130 156 190 Q170 210 108 215 Q46 210 60 190 Z" fill="none" stroke="#20242c" stroke-width="4" transform="rotate(270 108 195)" />
    <path d="M108 190 H92" class="edge" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <path d="m102 181 -12 9 12 9" class="edge" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <rect x="98" y="55" width="20" height="120" rx="4" fill="#ffffff" stroke="#2563eb" stroke-width="4" />
    <circle cx="108" cy="45" r="14" fill="#ffffff" stroke="#2563eb" stroke-width="4" />
    <text class="muted" x="108" y="245" text-anchor="middle" font-size="12" fill="#526173">follower: highest</text>
  </g>
</svg>
