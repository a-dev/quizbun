<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="720" height="300" rx="20" fill="#f5f7fb" />

  <g transform="translate(20,20)">
    <rect class="card" width="216" height="260" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="108" y="26" text-anchor="middle" font-size="13" fill="#526173">left pallet caught</text>
    <circle cx="108" cy="150" r="60" fill="none" stroke="#20242c" stroke-width="4" />
    <g stroke="#20242c" stroke-width="4">
      <line x1="108" y1="90" x2="108" y2="76" /><line x1="153" y1="105" x2="163" y2="95" />
      <line x1="168" y1="150" x2="182" y2="150" /><line x1="153" y1="195" x2="163" y2="205" />
      <line x1="108" y1="210" x2="108" y2="224" /><line x1="63" y1="195" x2="53" y2="205" />
      <line x1="48" y1="150" x2="34" y2="150" /><line x1="63" y1="105" x2="53" y2="95" />
    </g>
    <path d="M108 40 H80" class="edge" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <path d="m90 31 -12 9 12 9" class="edge" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <g transform="translate(108,150) rotate(-12)">
      <line x1="0" y1="0" x2="-46" y2="-58" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
      <line x1="0" y1="0" x2="46" y2="-58" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
      <circle r="7" fill="#2563eb" />
    </g>
    <text class="muted" x="108" y="245" text-anchor="middle" font-size="12" fill="#526173">wheel: held</text>
  </g>

  <g transform="translate(252,20)">
    <rect class="card" width="216" height="260" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="108" y="26" text-anchor="middle" font-size="13" fill="#526173">arm swings, releases</text>
    <circle cx="108" cy="150" r="60" fill="none" stroke="#20242c" stroke-width="4" transform="rotate(22 108 150)" />
    <g stroke="#20242c" stroke-width="4" transform="rotate(22 108 150)">
      <line x1="108" y1="90" x2="108" y2="76" /><line x1="153" y1="105" x2="163" y2="95" />
      <line x1="168" y1="150" x2="182" y2="150" /><line x1="153" y1="195" x2="163" y2="205" />
      <line x1="108" y1="210" x2="108" y2="224" /><line x1="63" y1="195" x2="53" y2="205" />
      <line x1="48" y1="150" x2="34" y2="150" /><line x1="63" y1="105" x2="53" y2="95" />
    </g>
    <path d="M108 40 H80" class="edge" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <path d="m90 31 -12 9 12 9" class="edge" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <g transform="translate(108,150) rotate(8)">
      <line x1="0" y1="0" x2="-46" y2="-58" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
      <line x1="0" y1="0" x2="46" y2="-58" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
      <circle r="7" fill="#2563eb" />
    </g>
    <text class="muted" x="108" y="245" text-anchor="middle" font-size="12" fill="#526173">wheel: advancing</text>
  </g>

  <g transform="translate(484,20)">
    <rect class="card" width="216" height="260" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="108" y="26" text-anchor="middle" font-size="13" fill="#526173">right pallet catches</text>
    <circle cx="108" cy="150" r="60" fill="none" stroke="#20242c" stroke-width="4" transform="rotate(45 108 150)" />
    <g stroke="#20242c" stroke-width="4" transform="rotate(45 108 150)">
      <line x1="108" y1="90" x2="108" y2="76" /><line x1="153" y1="105" x2="163" y2="95" />
      <line x1="168" y1="150" x2="182" y2="150" /><line x1="153" y1="195" x2="163" y2="205" />
      <line x1="108" y1="210" x2="108" y2="224" /><line x1="63" y1="195" x2="53" y2="205" />
      <line x1="48" y1="150" x2="34" y2="150" /><line x1="63" y1="105" x2="53" y2="95" />
    </g>
    <path d="M108 40 H80" class="edge" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <path d="m90 31 -12 9 12 9" class="edge" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <g transform="translate(108,150) rotate(28)">
      <line x1="0" y1="0" x2="-46" y2="-58" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
      <line x1="0" y1="0" x2="46" y2="-58" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
      <circle r="7" fill="#2563eb" />
    </g>
    <text class="muted" x="108" y="245" text-anchor="middle" font-size="12" fill="#526173">wheel: held again</text>
  </g>
</svg>
