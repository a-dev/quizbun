<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .muted { fill: var(--muted); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="760" height="300" rx="20" fill="#f5f7fb" />

  <g transform="translate(20,20)">
    <rect class="card" width="226" height="260" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="113" y="26" text-anchor="middle" font-size="13" fill="#526173">needle descends</text>
    <line x1="30" y1="90" x2="196" y2="90" stroke="#526173" stroke-width="6" />
    <line x1="113" y1="40" x2="113" y2="150" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
    <path d="M113 40 V20" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
    <path d="m104 30 9 -12 9 12" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text class="muted" x="113" y="245" text-anchor="middle" font-size="12" fill="#526173">thread pulled through fabric</text>
    <circle cx="290" cy="150" r="0" opacity="0" />
  </g>

  <g transform="translate(267,20)">
    <rect class="card" width="226" height="260" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="113" y="26" text-anchor="middle" font-size="13" fill="#526173">needle rises, loop forms</text>
    <line x1="30" y1="90" x2="196" y2="90" stroke="#526173" stroke-width="6" />
    <line x1="113" y1="60" x2="113" y2="110" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
    <path d="M113 108 C 70 140, 70 190, 113 190 C 156 190, 156 140, 113 112" fill="none" stroke="#2563eb" stroke-width="4" />
    <circle cx="113" cy="190" r="30" fill="none" stroke="#c2410c" stroke-width="5" />
    <text class="muted" x="113" y="245" text-anchor="middle" font-size="12" fill="#526173">rotary hook (below) enters loop</text>
  </g>

  <g transform="translate(514,20)">
    <rect class="card" width="226" height="260" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="113" y="26" text-anchor="middle" font-size="13" fill="#526173">hook carries loop around bobbin</text>
    <line x1="30" y1="90" x2="196" y2="90" stroke="#526173" stroke-width="6" />
    <path d="M113 60 V95" stroke="#2563eb" stroke-width="6" stroke-linecap="round" />
    <circle cx="113" cy="150" r="34" fill="none" stroke="#c2410c" stroke-width="5" />
    <circle cx="113" cy="150" r="14" fill="#ffffff" stroke="#20242c" stroke-width="4" />
    <path d="M113 116 A34 34 0 1 1 79 150" fill="none" stroke="#2563eb" stroke-width="4" />
    <text class="muted" x="113" y="245" text-anchor="middle" font-size="12" fill="#526173">interlock forms inside the fabric</text>
  </g>
</svg>
