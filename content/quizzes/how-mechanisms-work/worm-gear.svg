<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="720" height="280" rx="20" fill="#f5f7fb" />
  <rect class="card" x="24" y="24" width="672" height="232" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2" />

  <!-- worm wheel (large toothed disc) -->
  <circle cx="470" cy="150" r="90" fill="none" stroke="#20242c" stroke-width="4" />
  <g stroke="#20242c" stroke-width="4">
    <line x1="470" y1="60" x2="470" y2="46" />
    <line x1="533" y1="87" x2="543" y2="77" />
    <line x1="560" y1="150" x2="574" y2="150" />
    <line x1="533" y1="213" x2="543" y2="223" />
    <line x1="470" y1="240" x2="470" y2="254" />
    <line x1="407" y1="213" x2="397" y2="223" />
    <line x1="380" y1="150" x2="366" y2="150" />
    <line x1="407" y1="87" x2="397" y2="77" />
  </g>

  <!-- worm (helical shaft) meshing on the left of the wheel -->
  <rect x="140" y="132" width="230" height="36" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="4" />
  <g stroke="#2563eb" stroke-width="3">
    <path d="M150 132 Q165 150 150 168" fill="none" />
    <path d="M180 132 Q195 150 180 168" fill="none" />
    <path d="M210 132 Q225 150 210 168" fill="none" />
    <path d="M240 132 Q255 150 240 168" fill="none" />
    <path d="M270 132 Q285 150 270 168" fill="none" />
    <path d="M300 132 Q315 150 300 168" fill="none" />
    <path d="M330 132 Q345 150 330 168" fill="none" />
  </g>
  <circle cx="130" cy="150" r="14" fill="none" stroke="#2563eb" stroke-width="4" />

  <path d="M110 150 H70" class="edge" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <path d="m82 141 -12 9 12 9" class="edge" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <text class="muted" x="90" y="120" text-anchor="middle" font-size="13" fill="#526173">driven</text>

  <text class="muted" x="130" y="200" text-anchor="middle" font-size="13" fill="#526173">worm</text>
  <text class="muted" x="470" y="270" text-anchor="middle" font-size="13" fill="#526173">worm wheel</text>
</svg>
