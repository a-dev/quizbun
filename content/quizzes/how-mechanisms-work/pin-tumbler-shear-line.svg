<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="640" height="300" rx="20" fill="#f5f7fb" />
  <rect class="card" x="24" y="24" width="592" height="252" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2" />

  <!-- housing -->
  <rect x="90" y="60" width="460" height="180" rx="14" fill="none" stroke="#20242c" stroke-width="4" />
  <!-- plug -->
  <circle cx="320" cy="150" r="82" fill="#ffffff" stroke="#2563eb" stroke-width="4" />
  <path d="M262 118 A82 82 0 0 1 262 182" fill="none" stroke="#526173" stroke-width="1" stroke-dasharray="2 3" opacity="0.5" />

  <!-- four pin stacks crossing housing/plug boundary at different, mismatched heights -->
  <g>
    <!-- stack 1: misaligned -->
    <rect x="230" y="70" width="18" height="34" fill="#c2410c" opacity="0.85" />
    <rect x="230" y="104" width="18" height="30" fill="#2563eb" opacity="0.85" />
    <line x1="230" y1="70" x2="230" y2="55" stroke="#526173" stroke-width="3" />
    <line x1="248" y1="70" x2="248" y2="55" stroke="#526173" stroke-width="3" />
    <path d="M233 60 h12 M233 55 h12" stroke="#526173" stroke-width="2" />

    <!-- stack 2 -->
    <rect x="280" y="70" width="18" height="20" fill="#c2410c" opacity="0.85" />
    <rect x="280" y="90" width="18" height="30" fill="#2563eb" opacity="0.85" />
    <line x1="280" y1="70" x2="280" y2="55" stroke="#526173" stroke-width="3" />
    <line x1="298" y1="70" x2="298" y2="55" stroke="#526173" stroke-width="3" />
    <path d="M283 60 h12 M283 55 h12" stroke="#526173" stroke-width="2" />

    <!-- stack 3 -->
    <rect x="342" y="70" width="18" height="46" fill="#c2410c" opacity="0.85" />
    <rect x="342" y="116" width="18" height="26" fill="#2563eb" opacity="0.85" />
    <line x1="342" y1="70" x2="342" y2="55" stroke="#526173" stroke-width="3" />
    <line x1="360" y1="70" x2="360" y2="55" stroke="#526173" stroke-width="3" />
    <path d="M345 60 h12 M345 55 h12" stroke="#526173" stroke-width="2" />

    <!-- stack 4 -->
    <rect x="392" y="70" width="18" height="28" fill="#c2410c" opacity="0.85" />
    <rect x="392" y="98" width="18" height="30" fill="#2563eb" opacity="0.85" />
    <line x1="392" y1="70" x2="392" y2="55" stroke="#526173" stroke-width="3" />
    <line x1="410" y1="70" x2="410" y2="55" stroke="#526173" stroke-width="3" />
    <path d="M395 60 h12 M395 55 h12" stroke="#526173" stroke-width="2" />
  </g>

  <path d="M320 250 v20" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <path d="m311 260 9 12 9 -12" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="320" y="292" text-anchor="middle" font-size="13" fill="#526173">plug: turns when free to</text>

  <text class="muted" x="150" y="45" font-size="13" fill="#526173">housing</text>
  <text class="muted" x="500" y="45" text-anchor="end" font-size="13" fill="#526173">key pin (orange) · driver pin (blue)</text>
</svg>
