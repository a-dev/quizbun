<svg xmlns="http://www.w3.org/2000/svg" width="620" height="320" viewBox="0 0 620 320">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
      --accent3: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
        --accent3: #4ade80;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .muted { fill: var(--muted); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="620" height="320" rx="20" fill="#f5f7fb" />
  <rect class="card" x="24" y="24" width="572" height="272" rx="16" fill="#ffffff" stroke="#64748b" stroke-width="2" />

  <!-- ring gear -->
  <circle cx="310" cy="160" r="120" fill="none" stroke="#20242c" stroke-width="10" stroke-dasharray="8 6" />
  <!-- sun gear -->
  <circle cx="310" cy="160" r="26" fill="#ffffff" stroke="#c2410c" stroke-width="5" />
  <!-- carrier ring (dashed, connecting planets) -->
  <circle cx="310" cy="160" r="73" fill="none" stroke="#526173" stroke-width="2" stroke-dasharray="4 5" />
  <!-- three planet gears -->
  <circle cx="310" cy="87" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="5" />
  <circle cx="373" cy="197" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="5" />
  <circle cx="247" cy="197" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="5" />

  <path d="M310 118 V95" stroke="#c2410c" stroke-width="4" stroke-linecap="round" opacity="0" />
  <path d="M270 130 L245 105" stroke="#64748b" stroke-width="4" stroke-linecap="round" />
  <path d="m248 122 -8 -17 17 8" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="200" y="95" font-size="13" fill="#526173">sun: driven</text>

  <text class="muted" x="490" y="70" font-size="13" fill="#526173">ring gear</text>
  <text class="muted" x="373" y="245" font-size="13" fill="#526173">planet</text>
  <text class="muted" x="90" y="270" font-size="13" fill="#526173">carrier (dashed) links the planets together</text>
</svg>
