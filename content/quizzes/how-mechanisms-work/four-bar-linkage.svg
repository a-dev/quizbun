<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --accent1: #2563eb;
      --accent2: #c2410c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --accent1: #60a5fa;
        --accent2: #fb923c;
      }
    }
    .panel { fill: var(--panel); }
    .card { fill: var(--card); stroke: var(--edge); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="720" height="300" rx="20" fill="#f5f7fb" />

  <g transform="translate(20,20)">
    <rect class="card" width="216" height="260" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="108" y="26" text-anchor="middle" font-size="13" fill="#526173">position 1</text>
    <line x1="50" y1="220" x2="170" y2="220" stroke="#20242c" stroke-width="5" stroke-linecap="round" />
    <line x1="50" y1="220" x2="70" y2="120" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
    <line x1="70" y1="120" x2="150" y2="100" stroke="#c2410c" stroke-width="5" stroke-linecap="round" />
    <line x1="150" y1="100" x2="170" y2="220" stroke="#526173" stroke-width="5" stroke-linecap="round" />
    <circle cx="50" cy="220" r="6" fill="#20242c" /><circle cx="170" cy="220" r="6" fill="#20242c" />
    <circle cx="70" cy="120" r="6" fill="#20242c" /><circle cx="150" cy="100" r="6" fill="#20242c" />
    <path d="M50 200 A20 20 0 0 1 50 240" fill="none" stroke="#64748b" stroke-width="3" />
    <path d="m58 232 -8 8 -8 -8" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text class="muted" x="108" y="245" text-anchor="middle" font-size="11" fill="#526173">fixed link: driven at left pivot</text>
  </g>

  <g transform="translate(252,20)">
    <rect class="card" width="216" height="260" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="108" y="26" text-anchor="middle" font-size="13" fill="#526173">position 2</text>
    <line x1="50" y1="220" x2="170" y2="220" stroke="#20242c" stroke-width="5" stroke-linecap="round" />
    <line x1="50" y1="220" x2="130" y2="150" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
    <line x1="130" y1="150" x2="200" y2="180" stroke="#c2410c" stroke-width="5" stroke-linecap="round" />
    <line x1="200" y1="180" x2="170" y2="220" stroke="#526173" stroke-width="5" stroke-linecap="round" />
    <circle cx="50" cy="220" r="6" fill="#20242c" /><circle cx="170" cy="220" r="6" fill="#20242c" />
    <circle cx="130" cy="150" r="6" fill="#20242c" /><circle cx="200" cy="180" r="6" fill="#20242c" />
    <path d="M50 200 A20 20 0 0 1 50 240" fill="none" stroke="#64748b" stroke-width="3" />
    <path d="m58 232 -8 8 -8 -8" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M65 60 Q108 40 155 70" fill="none" stroke="#526173" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7" />
    <text class="muted" x="108" y="245" text-anchor="middle" font-size="11" fill="#526173">coupler point traces a path</text>
  </g>

  <g transform="translate(484,20)">
    <rect class="card" width="216" height="260" rx="14" fill="#ffffff" stroke="#64748b" stroke-width="2" />
    <text class="muted" x="108" y="26" text-anchor="middle" font-size="13" fill="#526173">position 3</text>
    <line x1="50" y1="220" x2="170" y2="220" stroke="#20242c" stroke-width="5" stroke-linecap="round" />
    <line x1="50" y1="220" x2="140" y2="205" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
    <line x1="140" y1="205" x2="190" y2="120" stroke="#c2410c" stroke-width="5" stroke-linecap="round" />
    <line x1="190" y1="120" x2="170" y2="220" stroke="#526173" stroke-width="5" stroke-linecap="round" />
    <circle cx="50" cy="220" r="6" fill="#20242c" /><circle cx="170" cy="220" r="6" fill="#20242c" />
    <circle cx="140" cy="205" r="6" fill="#20242c" /><circle cx="190" cy="120" r="6" fill="#20242c" />
    <path d="M50 200 A20 20 0 0 1 50 240" fill="none" stroke="#64748b" stroke-width="3" />
    <path d="m58 232 -8 8 -8 -8" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text class="muted" x="108" y="245" text-anchor="middle" font-size="11" fill="#526173">same four links, new pose</text>
  </g>
</svg>
