<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --ctx-fill: #dbeafe;
      --ctx-edge: #2563eb;
      --ctx-label: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --ctx-fill: #1e3a5f;
        --ctx-edge: #60a5fa;
        --ctx-label: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
      }
    }

    .panel-bg { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge-line { stroke: var(--edge); }
    .frame { fill: var(--ctx-fill); stroke: var(--ctx-edge); }
    .frame-label { fill: var(--ctx-label); }
    .control { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .control-label { fill: var(--accent-text); }
    .accent-text { fill: var(--accent-text); }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" fill-rule="evenodd" />
    </marker>
  </defs>

  <rect class="panel-bg" width="720" height="520" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="40" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
    Fragmenting one message across frames
  </text>
  <text class="muted" x="36" y="64" fill="#526173" font-family="system-ui, sans-serif" font-size="14">
    Only the first frame names the type. `FIN=1` on the last one ends the message.
  </text>

  <g class="edge-line" fill="none" stroke="#64748b" stroke-width="2.2">
    <path d="M226,145 L266,145" marker-end="url(#arrow)" />
    <path d="M456,145 L496,145" marker-end="url(#arrow)" />
    <path d="M476,190 L476,220" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  </g>

  <g font-family="system-ui, sans-serif">
    <rect class="frame" x="36" y="100" width="190" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="frame-label" x="52" y="124" fill="#172554" font-size="13" font-weight="700">frame 1</text>
    <text class="muted" x="52" y="144" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">FIN=0, opcode=0x1</text>
    <text class="muted" x="52" y="160" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">(text, names the type)</text>
    <text class="frame-label" x="52" y="180" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">"Hello, "</text>

    <rect class="frame" x="266" y="100" width="190" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="frame-label" x="282" y="124" fill="#172554" font-size="13" font-weight="700">frame 2</text>
    <text class="muted" x="282" y="144" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">FIN=0, opcode=0x0</text>
    <text class="muted" x="282" y="160" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">(continuation)</text>
    <text class="frame-label" x="282" y="180" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">"wor"</text>

    <rect class="frame" x="496" y="100" width="188" height="90" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="frame-label" x="512" y="124" fill="#172554" font-size="13" font-weight="700">frame 3</text>
    <text class="muted" x="512" y="144" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">FIN=1, opcode=0x0</text>
    <text class="muted" x="512" y="160" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">(continuation, last)</text>
    <text class="frame-label" x="512" y="180" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">"ld!"</text>
  </g>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect class="control" x="366" y="220" width="220" height="76" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 5" />
    <text class="control-label" x="476" y="244" fill="#9a3412" font-size="13" font-weight="700">control frame, ping</text>
    <text class="muted" x="476" y="262" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">FIN=1, opcode=0x9</text>
    <text class="muted" x="476" y="280" fill="#526173" font-size="11">may interleave without breaking the sequence</text>
  </g>

  <g font-family="system-ui, sans-serif">
    <rect class="frame" x="36" y="330" width="648" height="64" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <text class="frame-label" x="56" y="356" fill="#172554" font-size="14" font-weight="700">Reassembled message</text>
    <text class="frame-label" x="56" y="378" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">"Hello, world!"</text>
    <text class="muted" x="664" y="356" fill="#526173" font-size="12" text-anchor="end">type: text (from frame 1)</text>
    <text class="muted" x="664" y="374" fill="#526173" font-size="12" text-anchor="end">ping is not part of the message</text>
  </g>

  <g font-family="system-ui, sans-serif">
    <text class="accent-text" x="36" y="426" fill="#9a3412" font-size="14" font-weight="700">Only the first fragment carries the text/binary opcode. The rest are always 0x0.</text>
    <text class="muted" x="36" y="452" fill="#526173" font-size="13">`FIN=1` on the last fragment is what tells the receiver the message is complete.</text>
    <text class="muted" x="36" y="478" fill="#526173" font-size="13">Control frames are always `FIN=1` and never fragmented, so they interleave safely.</text>
  </g>
</svg>
