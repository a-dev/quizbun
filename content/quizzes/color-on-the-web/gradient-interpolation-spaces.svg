<svg xmlns="http://www.w3.org/2000/svg" width="720" height="340" viewBox="0 0 720 340">
  <!-- House convention exception: the gradient swatches are the specimen. Their
       fills are literal sRGB values computed from real color-space math and
       must never re-theme; only the panel and row labels follow
       prefers-color-scheme. -->
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="720" height="340" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="40" fill="#20242c" font-size="18" font-weight="700">Blue → yellow, three ways</text>

  <g font-size="13">
    <text class="muted" x="32" y="90" fill="#526173" font-size="14" font-weight="700">Row 1</text>
    <rect x="132" y="66" width="112" height="56" fill="#0000ff" />
    <rect x="244" y="66" width="112" height="56" fill="#4040bf" />
    <rect x="356" y="66" width="112" height="56" fill="#808080" />
    <rect x="468" y="66" width="112" height="56" fill="#bfbf40" />
    <rect x="580" y="66" width="112" height="56" fill="#ffff00" />

    <text class="muted" x="32" y="180" fill="#526173" font-size="14" font-weight="700">Row 2</text>
    <rect x="132" y="156" width="112" height="56" fill="#0000ff" />
    <rect x="244" y="156" width="112" height="56" fill="#1d77e7" />
    <rect x="356" y="156" width="112" height="56" fill="#6cabc7" />
    <rect x="468" y="156" width="112" height="56" fill="#b5d797" />
    <rect x="580" y="156" width="112" height="56" fill="#ffff00" />

    <text class="muted" x="32" y="270" fill="#526173" font-size="14" font-weight="700">Row 3</text>
    <rect x="132" y="246" width="112" height="56" fill="#0000ff" />
    <rect x="244" y="246" width="112" height="56" fill="#008df8" />
    <rect x="356" y="246" width="112" height="56" fill="#00cfbd" />
    <rect x="468" y="246" width="112" height="56" fill="#19f268" />
    <rect x="580" y="246" width="112" height="56" fill="#ffff00" />

    <rect class="edge" x="132" y="66" width="560" height="56" fill="none" stroke="#64748b" stroke-width="1.5" />
    <rect class="edge" x="132" y="156" width="560" height="56" fill="none" stroke="#64748b" stroke-width="1.5" />
    <rect class="edge" x="132" y="246" width="560" height="56" fill="none" stroke="#64748b" stroke-width="1.5" />
  </g>

  <text class="muted" x="32" y="316" fill="#526173" font-size="13">Same two endpoints, five sample stops each. Which row was interpolated in plain sRGB?</text>
</svg>
