<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300">
  <!-- House convention exception: the gradient step swatches are the specimen —
       a literal 6-step 8-bit ramp, with and without dither noise. Their fills
       are literal and must never re-theme; only the panel and labels follow
       prefers-color-scheme. -->
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <defs>
    <pattern id="dither" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none" />
      <circle cx="1" cy="1" r="0.9" fill="#ffffff" opacity="0.16" />
      <circle cx="4" cy="3" r="0.9" fill="#000000" opacity="0.14" />
      <circle cx="2" cy="5" r="0.9" fill="#ffffff" opacity="0.1" />
      <circle cx="5" cy="0.5" r="0.7" fill="#000000" opacity="0.12" />
    </pattern>
  </defs>

  <rect class="panel" width="680" height="300" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="40" fill="#20242c" font-size="18" font-weight="700">A shallow ramp, with and without dither</text>

  <text class="muted" x="32" y="86" fill="#526173" font-size="13" font-weight="700">No dither — visible bands</text>
  <g>
    <rect x="32" y="96" width="103" height="56" fill="#202020" />
    <rect x="135" y="96" width="103" height="56" fill="#232323" />
    <rect x="238" y="96" width="103" height="56" fill="#262626" />
    <rect x="341" y="96" width="103" height="56" fill="#2a2a2a" />
    <rect x="444" y="96" width="103" height="56" fill="#2d2d2d" />
    <rect x="547" y="96" width="103" height="56" fill="#303030" />
    <rect class="edge" x="32" y="96" width="618" height="56" fill="none" stroke="#64748b" stroke-width="1.5" />
  </g>

  <text class="muted" x="32" y="200" fill="#526173" font-size="13" font-weight="700">Same steps + dither noise — reads as smooth</text>
  <g>
    <rect x="32" y="210" width="103" height="56" fill="#202020" />
    <rect x="135" y="210" width="103" height="56" fill="#232323" />
    <rect x="238" y="210" width="103" height="56" fill="#262626" />
    <rect x="341" y="210" width="103" height="56" fill="#2a2a2a" />
    <rect x="444" y="210" width="103" height="56" fill="#2d2d2d" />
    <rect x="547" y="210" width="103" height="56" fill="#303030" />
    <rect x="32" y="210" width="618" height="56" fill="url(#dither)" />
    <rect class="edge" x="32" y="210" width="618" height="56" fill="none" stroke="#64748b" stroke-width="1.5" />
  </g>
</svg>
