<svg xmlns="http://www.w3.org/2000/svg" width="680" height="380" viewBox="0 0 680 380">
  <!-- House convention exception: the three channel-weight chips (pure red,
       green, blue) are the specimen. Their fills are literal and must never
       re-theme; only the panel, bars, and text follow prefers-color-scheme. -->
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --bar: #dbeafe;
      --bar-edge: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --bar: #1e3a5f;
        --bar-edge: #60a5fa;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    .bar { fill: var(--bar); stroke: var(--bar-edge); }
    text { font-family: system-ui, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; }
  </style>

  <rect class="panel" width="680" height="380" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="40" fill="#20242c" font-size="18" font-weight="700">Relative luminance weights</text>

  <g font-size="14">
    <circle cx="56" cy="82" r="12" fill="#ff0000" class="edge" stroke="#64748b" stroke-width="1.5" />
    <text class="muted" x="80" y="87" fill="#526173">R weight 0.2126</text>
    <rect class="bar" x="240" y="70" width="128" height="24" stroke-width="1.5" />

    <circle cx="56" cy="122" r="12" fill="#00ff00" class="edge" stroke="#64748b" stroke-width="1.5" />
    <text class="muted" x="80" y="127" fill="#526173">G weight 0.7152</text>
    <rect class="bar" x="240" y="110" width="430" height="24" stroke-width="1.5" />

    <circle cx="56" cy="162" r="12" fill="#0000ff" class="edge" stroke="#64748b" stroke-width="1.5" />
    <text class="muted" x="80" y="167" fill="#526173">B weight 0.0722</text>
    <rect class="bar" x="240" y="150" width="44" height="24" stroke-width="1.5" />
  </g>

  <text class="title mono" x="32" y="232" fill="#20242c" font-size="15" font-weight="700">L = 0.2126·R + 0.7152·G + 0.0722·B</text>

  <text class="title" x="32" y="284" fill="#20242c" font-size="18" font-weight="700">Contrast ratio</text>
  <text class="title mono" x="32" y="320" fill="#20242c" font-size="16" font-weight="700">(L1 + 0.05) / (L2 + 0.05)</text>
  <text class="muted" x="32" y="350" fill="#526173" font-size="13">L1 is the lighter color's luminance, L2 the darker.</text>
</svg>
