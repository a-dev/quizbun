<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360">
  <!-- House convention exception: every strip swatch is the specimen — real
       OKLCH-to-sRGB conversions with only one channel varying per row. Their
       fills are literal and must never re-theme; only the panel and labels
       follow prefers-color-scheme. -->
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="720" height="360" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="38" fill="#20242c" font-size="18" font-weight="700">One channel moves at a time</text>

  <g font-size="12">
    <text class="muted" x="32" y="76" fill="#526173" font-size="13" font-weight="700">L varies · C 0.1 · H 250</text>
    <rect x="260" y="56" width="88" height="46" fill="#003c6c" />
    <rect x="348" y="56" width="88" height="46" fill="#2a5f92" />
    <rect x="436" y="56" width="88" height="46" fill="#4f84ba" />
    <rect x="524" y="56" width="88" height="46" fill="#75abe3" />
    <rect x="612" y="56" width="88" height="46" fill="#9bd3ff" />
    <rect class="edge" x="260" y="56" width="440" height="46" fill="none" stroke="#64748b" stroke-width="1.5" />

    <text class="muted" x="32" y="152" fill="#526173" font-size="13" font-weight="700">C varies · L 0.7 · H 250</text>
    <rect x="260" y="132" width="88" height="46" fill="#9e9e9e" />
    <rect x="348" y="132" width="88" height="46" fill="#8aa1ba" />
    <rect x="436" y="132" width="88" height="46" fill="#73a3d5" />
    <rect x="524" y="132" width="88" height="46" fill="#57a3ef" />
    <rect x="612" y="132" width="88" height="46" fill="#2ca2ff" />
    <rect class="edge" x="260" y="132" width="440" height="46" fill="none" stroke="#64748b" stroke-width="1.5" />

    <text class="muted" x="32" y="228" fill="#526173" font-size="13" font-weight="700">H varies · L 0.68 · C 0.1</text>
    <rect x="260" y="208" width="88" height="46" fill="#cb7e96" />
    <rect x="348" y="208" width="88" height="46" fill="#be8e4f" />
    <rect x="436" y="208" width="88" height="46" fill="#71a970" />
    <rect x="524" y="208" width="88" height="46" fill="#3fa8c0" />
    <rect x="612" y="208" width="88" height="46" fill="#958ed3" />
    <rect class="edge" x="260" y="208" width="440" height="46" fill="none" stroke="#64748b" stroke-width="1.5" />

    <g class="muted" fill="#526173" text-anchor="middle">
      <text x="304" y="258">0</text><text x="392" y="258">72</text><text x="480" y="258">144</text><text x="568" y="258">216</text><text x="656" y="258">288</text>
    </g>
  </g>

  <text class="muted" x="32" y="300" fill="#526173" font-size="13">Top: lightness rises. Middle: chroma rises. Bottom: hue sweeps, brightness stays put.</text>
</svg>
