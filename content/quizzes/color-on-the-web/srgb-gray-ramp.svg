<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330">
  <!-- House convention exception: this diagram's swatches are the specimen. Their
       fills are literal sRGB values and must never re-theme with the site; only
       the panel, title, and labels follow prefers-color-scheme. -->
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="720" height="330" rx="20" fill="#f5f7fb" />
  <text class="title" x="36" y="44" fill="#20242c" font-size="19" font-weight="700">Two five-step gray ramps</text>

  <g font-size="13" text-anchor="middle">
    <text class="muted" x="36" y="98" fill="#526173" font-size="15" font-weight="700" text-anchor="start">Ramp A</text>
    <g>
      <rect class="edge" x="150" y="72" width="104" height="64" fill="#000000" stroke="#64748b" stroke-width="1.5" />
      <rect class="edge" x="254" y="72" width="104" height="64" fill="#404040" stroke="#64748b" stroke-width="1.5" />
      <rect class="edge" x="358" y="72" width="104" height="64" fill="#808080" stroke="#64748b" stroke-width="1.5" />
      <rect class="edge" x="462" y="72" width="104" height="64" fill="#c0c0c0" stroke="#64748b" stroke-width="1.5" />
      <rect class="edge" x="566" y="72" width="104" height="64" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <text class="muted" x="202" y="152" fill="#526173">#000000</text>
      <text class="muted" x="306" y="152" fill="#526173">#404040</text>
      <text class="muted" x="410" y="152" fill="#526173">#808080</text>
      <text class="muted" x="514" y="152" fill="#526173">#c0c0c0</text>
      <text class="muted" x="618" y="152" fill="#526173">#ffffff</text>
    </g>

    <text class="muted" x="36" y="208" fill="#526173" font-size="15" font-weight="700" text-anchor="start">Ramp B</text>
    <g>
      <rect class="edge" x="150" y="182" width="104" height="64" fill="#000000" stroke="#64748b" stroke-width="1.5" />
      <rect class="edge" x="254" y="182" width="104" height="64" fill="#898989" stroke="#64748b" stroke-width="1.5" />
      <rect class="edge" x="358" y="182" width="104" height="64" fill="#bcbcbc" stroke="#64748b" stroke-width="1.5" />
      <rect class="edge" x="462" y="182" width="104" height="64" fill="#e1e1e1" stroke="#64748b" stroke-width="1.5" />
      <rect class="edge" x="566" y="182" width="104" height="64" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
      <text class="muted" x="202" y="262" fill="#526173">#000000</text>
      <text class="muted" x="306" y="262" fill="#526173">#898989</text>
      <text class="muted" x="410" y="262" fill="#526173">#bcbcbc</text>
      <text class="muted" x="514" y="262" fill="#526173">#e1e1e1</text>
      <text class="muted" x="618" y="262" fill="#526173">#ffffff</text>
    </g>
  </g>

  <text class="muted" x="36" y="304" fill="#526173" font-size="13">One ramp steps in equal hex numbers. The other steps in equal amounts of physical light.</text>
</svg>
