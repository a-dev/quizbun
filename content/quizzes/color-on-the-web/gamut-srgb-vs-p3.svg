<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --srgb-fill: #dbeafe;
      --srgb-edge: #2563eb;
      --p3-fill: #fee2e2;
      --p3-edge: #c2410c;
      --white-point: #526173;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --srgb-fill: #1e3a5f;
        --srgb-edge: #60a5fa;
        --p3-fill: #4a2418;
        --p3-edge: #fb923c;
        --white-point: #e6eaf2;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .srgb-tri { fill: var(--srgb-fill); stroke: var(--srgb-edge); }
    .p3-tri { fill: var(--p3-fill); stroke: var(--p3-edge); }
    .wp { fill: var(--white-point); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="640" height="420" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="40" fill="#20242c" font-size="18" font-weight="700">sRGB's triangle sits inside P3's</text>

  <!-- Display-P3 triangle (larger), then sRGB triangle (smaller) sharing the same white point -->
  <polygon class="p3-tri" points="320,80 540,320 130,340" fill="#fee2e2" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="0" />
  <polygon class="srgb-tri" points="320,150 470,300 190,310" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 5" />

  <circle class="wp" cx="330" cy="255" r="6" fill="#526173" />
  <text class="muted" x="345" y="260" fill="#526173" font-size="12">shared white point (D65)</text>

  <text class="muted" x="320" y="72" fill="#526173" font-size="13" text-anchor="middle">P3 green corner</text>
  <text class="muted" x="555" y="330" fill="#526173" font-size="13">P3 red corner</text>
  <text class="muted" x="60" y="350" fill="#526173" font-size="13">P3 blue corner</text>
  <text class="muted" x="320" y="140" fill="#526173" font-size="12" text-anchor="middle">sRGB green</text>
  <text class="muted" x="480" y="298" fill="#526173" font-size="12">sRGB red</text>
  <text class="muted" x="130" y="320" fill="#526173" font-size="12">sRGB blue</text>

  <text class="muted" x="32" y="384" fill="#526173" font-size="13">Outline only: not a color-accurate render of either gamut's actual primaries.</text>
</svg>
