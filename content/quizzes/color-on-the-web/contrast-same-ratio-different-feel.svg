<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300">
  <!-- House convention exception: the two comparison panels are the specimen —
       one literal white background with literal #767676 text, one literal
       #767676 background with literal white text. Neither panel may re-theme;
       only the outer chrome and captions follow prefers-color-scheme. -->
  <style>
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
      }
    }
    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .edge { stroke: var(--edge); }
    text { font-family: system-ui, sans-serif; }
  </style>

  <rect class="panel" width="640" height="300" rx="20" fill="#f5f7fb" />
  <text class="title" x="32" y="40" fill="#20242c" font-size="18" font-weight="700">Same ratio, swapped roles</text>

  <rect class="edge" x="48" y="66" width="248" height="176" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text x="172" y="164" fill="#767676" font-size="52" font-weight="700" text-anchor="middle">Aa</text>

  <rect class="edge" x="344" y="66" width="248" height="176" rx="8" fill="#767676" stroke="#64748b" stroke-width="1.5" />
  <text x="468" y="164" fill="#ffffff" font-size="52" font-weight="700" text-anchor="middle">Aa</text>

  <text class="muted" x="172" y="266" fill="#526173" font-size="15" text-anchor="middle" font-weight="700">4.54:1</text>
  <text class="muted" x="468" y="266" fill="#526173" font-size="15" text-anchor="middle" font-weight="700">4.54:1</text>
</svg>
