<svg xmlns="http://www.w3.org/2000/svg" width="720" height="606" viewBox="0 0 720 606">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-fill: #e8ecf3;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-fill: #20262e;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .card-box { fill: var(--card); stroke: var(--edge); }
    .dead-box { fill: var(--dead-fill); stroke: var(--edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
  </style>
  <rect class="panel" width="720" height="606" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Text in, token IDs out</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Characters, words, graphemes and tokens are different units. Only one of them is billed.</text>
  <rect class="card-box" x="36" y="88" width="648" height="132" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">One string, counted three ways</text>
  <text class="muted" x="54" y="136" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">Ada Lovelace!</text>
  <rect class="info-box" x="54" y="148" width="66" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="87.0" y="170" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">"Ada"</text>
  <rect class="info-box" x="130" y="148" width="74" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="167.0" y="170" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">" Lov"</text>
  <rect class="info-box" x="214" y="148" width="88" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="258.0" y="170" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">"elace"</text>
  <rect class="info-box" x="312" y="148" width="44" height="34" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="334.0" y="170" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">"!"</text>
  <rect class="dead-box" x="400" y="148" width="88" height="34" rx="8" fill="#e8ecf3" stroke="#64748b" stroke-width="2" />
  <text class="dead-text" x="444.0" y="170" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">13 characters</text>
  <rect class="dead-box" x="496" y="148" width="88" height="34" rx="8" fill="#e8ecf3" stroke="#64748b" stroke-width="2" />
  <text class="dead-text" x="540.0" y="170" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">2 words</text>
  <rect class="good-box" x="592" y="148" width="96" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="640.0" y="170" fill="#14532d" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">4 tokens</text>
  <text class="muted" x="54" y="204" fill="#526173" font-family="system-ui, sans-serif" font-size="10.8">Only the last count is the one a model receives, a limit is measured against, and an invoice is built from.</text>
  <rect class="card-box" x="36" y="232" width="648" height="176" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="258" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">The vocabulary decides the pieces — so small edits move the boundaries</text>
  <rect class="card-box" x="54" y="272" width="150" height="32" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="title" x="64" y="293" fill="#20242c" font-family="system-ui, sans-serif" font-size="11" font-weight="700">A leading space</text>
  <rect class="info-box" x="212" y="272" width="78" height="32" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="251" y="293" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">"cat"</text>
  <rect class="accent-box" x="298" y="272" width="92" height="32" rx="7" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="344" y="293" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">" cat"</text>
  <text class="muted" x="404" y="293" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">two different vocabulary entries, two IDs</text>
  <rect class="card-box" x="54" y="312" width="150" height="32" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="title" x="64" y="333" fill="#20242c" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Capitalization</text>
  <rect class="info-box" x="212" y="312" width="78" height="32" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="251" y="333" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">"cat"</text>
  <rect class="accent-box" x="298" y="312" width="92" height="32" rx="7" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="344" y="333" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">"Cat"</text>
  <text class="muted" x="404" y="333" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">can split differently, or map to another ID</text>
  <rect class="card-box" x="54" y="352" width="150" height="32" rx="7" fill="#ffffff" stroke="#64748b" stroke-width="1.5" />
  <text class="title" x="64" y="373" fill="#20242c" font-family="system-ui, sans-serif" font-size="11" font-weight="700">A rare word</text>
  <rect class="info-box" x="212" y="352" width="78" height="32" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="251" y="373" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">"token"</text>
  <rect class="accent-box" x="298" y="352" width="92" height="32" rx="7" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="344" y="373" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">"tokeniser"</text>
  <text class="muted" x="404" y="373" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">common text stays whole, rare text fragments</text>
  <text class="muted" x="54" y="400" fill="#526173" font-family="system-ui, sans-serif" font-size="10.6">Subword vocabularies buy this on purpose: common pieces stay compact, unseen words are assembled from known ones.</text>
  <rect class="card-box" x="36" y="420" width="316" height="130" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="446" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Why letter counting is indirect</text>
  <text class="muted" x="54" y="466" fill="#526173" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">strawberry</text>
  <rect class="info-box" x="54" y="476" width="40" height="28" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="74.0" y="495" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">st</text>
  <rect class="info-box" x="102" y="476" width="52" height="28" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="128.0" y="495" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">raw</text>
  <rect class="info-box" x="162" y="476" width="68" height="28" rx="7" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="196.0" y="495" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">berry</text>
  <text class="muted" x="54" y="522" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">The model never receives a list of letters. It has</text>
  <text class="muted" x="54" y="536" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">to reconstruct the spelling while predicting.</text>
  <rect class="card-box" x="368" y="420" width="316" height="130" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="386" y="446" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Why one emoji is not one token</text>
  <rect class="good-box" x="386" y="458" width="108" height="19" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="440" y="472" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">1 grapheme</text>
  <text class="muted" x="504" y="472" fill="#526173" font-family="system-ui, sans-serif" font-size="10">what you see</text>
  <rect class="info-box" x="386" y="480" width="108" height="19" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="440" y="494" fill="#172554" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">3 code points</text>
  <text class="muted" x="504" y="494" fill="#526173" font-family="system-ui, sans-serif" font-size="10">person + ZWJ + laptop</text>
  <rect class="info-box" x="386" y="502" width="108" height="19" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="440" y="516" fill="#172554" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">11 bytes</text>
  <text class="muted" x="504" y="516" fill="#526173" font-family="system-ui, sans-serif" font-size="10">after UTF-8 encoding</text>
  <rect class="accent-box" x="386" y="524" width="108" height="19" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="440" y="538" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">several tokens</text>
  <text class="muted" x="504" y="538" fill="#526173" font-family="system-ui, sans-serif" font-size="10">however the vocabulary splits them</text>
  <rect class="accent-box" x="36" y="562" width="648" height="32" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="54" y="583" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.6" font-weight="700">“About four characters per token” is a napkin estimate. Count the whole request with the real tokenizer.</text>
</svg>
