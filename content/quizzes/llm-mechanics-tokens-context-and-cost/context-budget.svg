<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-fill: #e8ecf3;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
      --alt-fill: #f3e8ff;
      --alt-edge: #9333ea;
      --alt-text: #581c87;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-fill: #20262e;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
        --alt-fill: #2e1d40;
        --alt-edge: #c084fc;
        --alt-text: #e9d5ff;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .alt-text { fill: var(--alt-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .alt-box { fill: var(--alt-fill); stroke: var(--alt-edge); }
    .card-box { fill: var(--card); stroke: var(--edge); }
    .dead-box { fill: var(--dead-fill); stroke: var(--edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .good-line { stroke: var(--good-edge); }
  </style>
  <rect class="panel" width="720" height="640" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">One request, one budget</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">The visible message is rarely the expensive part, and the stated output cap rarely binds.</text>
  <rect class="card-box" x="36" y="88" width="648" height="156" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">What actually occupies a request</text>
  <rect class="info-box" x="54" y="130" width="100" height="40" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <rect class="alt-box" x="154" y="130" width="230" height="40" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" />
  <rect class="good-box" x="384" y="130" width="190" height="40" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <rect class="accent-box" x="574" y="130" width="32" height="40" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <rect class="dead-box" x="606" y="130" width="60" height="40" rx="6" fill="#e8ecf3" stroke="#64748b" stroke-width="2" />
  <rect class="info-box" x="54" y="181" width="12" height="12" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="74" y="192" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5">system + developer instructions</text>
  <rect class="alt-box" x="264" y="181" width="12" height="12" rx="3" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5" />
  <text class="alt-text" x="284" y="192" fill="#581c87" font-family="system-ui, sans-serif" font-size="10.5">conversation history carried forward</text>
  <rect class="good-box" x="474" y="181" width="12" height="12" rx="3" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="494" y="192" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5">tool definitions and tool results</text>
  <rect class="accent-box" x="54" y="203" width="12" height="12" rx="3" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="74" y="214" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5">the user's visible message</text>
  <rect class="dead-box" x="264" y="203" width="12" height="12" rx="3" fill="#e8ecf3" stroke="#64748b" stroke-width="1.5" />
  <text class="dead-text" x="284" y="214" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10.5">images and attached files</text>
  <text class="muted" x="54" y="232" fill="#526173" font-family="system-ui, sans-serif" font-size="10.8">A one-line question can still be a very large model input, and every part of it is counted.</text>
  <rect class="card-box" x="36" y="256" width="648" height="176" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="282" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Two limits, and the one that actually binds</text>
  <rect class="info-box" x="54" y="296" width="401" height="36" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="254" y="319" fill="#172554" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">input 119,500</text>
  <rect class="good-box" x="455" y="296" width="29" height="36" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="469" y="350" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">8,500 left</text>
  <path class="good-line" d="M469,334 V340" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="54" y="350" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">combined window: 128,000</text>
  <rect class="accent-box" x="506" y="296" width="160" height="36" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="586" y="319" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">max output 16,000</text>
  <text class="accent-text" x="586" y="350" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">a separate ceiling</text>
  <text class="title" x="54" y="380" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">128,000 − 119,500 = 8,500   ·   min(16,000, 8,500) = 8,500</text>
  <text class="muted" x="54" y="402" fill="#526173" font-family="system-ui, sans-serif" font-size="10.8">The separate output cap cannot create room inside a combined budget. The smaller of the two wins.</text>
  <text class="muted" x="54" y="422" fill="#526173" font-family="system-ui, sans-serif" font-size="10.8">Providers publish these as two numbers on purpose: a model can accept far more than it can generate at once.</text>
  <rect class="card-box" x="36" y="444" width="316" height="140" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="470" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Dropping the oldest turns</text>
  <rect class="dead-box" x="54" y="482" width="280" height="22" rx="5" fill="#e8ecf3" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" />
  <text class="dead-text" x="62" y="498" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">turn 1, rules and key facts</text>
  <text class="dead-text" x="326" y="498" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">dropped</text>
  <rect class="dead-box" x="54" y="508" width="280" height="22" rx="5" fill="#e8ecf3" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 4" />
  <text class="dead-text" x="62" y="524" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">turn 2, the uploaded spec</text>
  <text class="dead-text" x="326" y="524" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">dropped</text>
  <rect class="good-box" x="54" y="534" width="280" height="22" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="62" y="550" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" font-weight="700">turns 38-52, recent chatter</text>
  <text class="good-text" x="326" y="550" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">kept</text>
  <text class="muted" x="54" y="572" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">The call still returns a success. The behaviour changed.</text>
  <rect class="card-box" x="368" y="444" width="316" height="140" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="386" y="470" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">A 2,000-token output cap is a ceiling</text>
  <rect class="good-box" x="386" y="482" width="280" height="22" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="394" y="498" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" font-weight="700">stops early once the answer is done</text>
  <rect class="accent-box" x="386" y="508" width="280" height="22" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="394" y="524" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10" font-weight="700">cuts off mid-sentence at the cap</text>
  <rect class="dead-box" x="386" y="534" width="280" height="22" rx="5" fill="#e8ecf3" stroke="#64748b" stroke-width="1.5" />
  <text class="dead-text" x="394" y="550" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">never a request for exactly 2,000</text>
  <text class="muted" x="386" y="572" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">Read the finish status before trusting the text.</text>
  <rect class="accent-box" x="36" y="596" width="648" height="32" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="54" y="617" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Fitting inside the window is a capacity fact. A document that fits can still be read unevenly.</text>
</svg>
