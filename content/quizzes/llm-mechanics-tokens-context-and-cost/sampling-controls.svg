<svg xmlns="http://www.w3.org/2000/svg" width="720" height="654" viewBox="0 0 720 654">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-fill: #e8ecf3;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-fill: #20262e;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .card-box { fill: var(--card); stroke: var(--edge); }
    .dead-box { fill: var(--dead-fill); stroke: var(--edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-line { stroke: var(--accent-edge); }
    .edge-line { stroke: var(--edge); }
    .info-line { stroke: var(--info-edge); }
  </style>
  <defs>
    <marker id="arrow-edge" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--edge)" />
    </marker>
    <marker id="arrow-info" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--info-edge)" />
    </marker>
  </defs>
  <rect class="panel" width="720" height="654" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">How the next token gets chosen</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Temperature and top-p both reshape the candidate set. Neither changes what the model knows.</text>
  <rect class="card-box" x="36" y="88" width="648" height="140" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Ordinary generation is one step, repeated</text>
  <rect class="info-box" x="54" y="132" width="140" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="124" y="152" fill="#172554" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Context so far</text>
  <text class="info-text" x="124" y="167" fill="#172554" font-family="system-ui, sans-serif" font-size="9.6" text-anchor="middle">every token before this one</text>
  <path class="edge-line" d="M194,154 H206" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-edge)" />
  <rect class="info-box" x="212" y="132" width="140" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="282" y="152" fill="#172554" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">A distribution</text>
  <text class="info-text" x="282" y="167" fill="#172554" font-family="system-ui, sans-serif" font-size="9.6" text-anchor="middle">over the whole vocabulary</text>
  <path class="edge-line" d="M352,154 H364" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-edge)" />
  <rect class="info-box" x="370" y="132" width="140" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="440" y="152" fill="#172554" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Sample one token</text>
  <text class="info-text" x="440" y="167" fill="#172554" font-family="system-ui, sans-serif" font-size="9.6" text-anchor="middle">where the controls act</text>
  <path class="edge-line" d="M510,154 H522" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-edge)" />
  <rect class="info-box" x="528" y="132" width="140" height="44" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="598" y="152" fill="#172554" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Append it</text>
  <text class="info-text" x="598" y="167" fill="#172554" font-family="system-ui, sans-serif" font-size="9.6" text-anchor="middle">and run the step again</text>
  <path class="info-line" d="M598,176 V194 H124 V178" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-info)" />
  <text class="muted" x="54" y="216" fill="#526173" font-family="system-ui, sans-serif" font-size="10.6">One different pick, early, and the rest of the answer goes somewhere else. That is why one prompt has many outputs.</text>
  <rect class="card-box" x="36" y="240" width="648" height="196" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="266" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Temperature rescales the same scores before they become probabilities</text>
  <text class="info-text" x="167" y="292" fill="#172554" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">T = 1.0, as the model scored them</text>
  <rect class="info-box" x="70" y="356.4" width="34" height="39.6" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="87" y="350.4" fill="#172554" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">0.45</text>
  <text class="muted" x="87" y="410" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">t1</text>
  <rect class="info-box" x="118" y="374.0" width="34" height="22.0" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="135" y="368.0" fill="#172554" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">0.25</text>
  <text class="muted" x="135" y="410" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">t2</text>
  <rect class="info-box" x="166" y="382.8" width="34" height="13.2" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="183" y="376.8" fill="#172554" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">0.15</text>
  <text class="muted" x="183" y="410" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">t3</text>
  <rect class="info-box" x="214" y="387.2" width="34" height="8.8" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="231" y="381.2" fill="#172554" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">0.10</text>
  <text class="muted" x="231" y="410" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">t4</text>
  <rect class="info-box" x="262" y="391.6" width="34" height="4.4" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="279" y="385.6" fill="#172554" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">0.05</text>
  <text class="muted" x="279" y="410" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">t5</text>
  <path class="edge-line" d="M54,396 H280" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="good-text" x="503" y="292" fill="#14532d" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">T = 0.2, the gaps widen</text>
  <rect class="good-box" x="406" y="318.56" width="34" height="77.44" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="423" y="312.56" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">0.88</text>
  <text class="muted" x="423" y="410" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">t1</text>
  <rect class="good-box" x="454" y="388.08" width="34" height="7.92" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="471" y="382.08" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">0.09</text>
  <text class="muted" x="471" y="410" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">t2</text>
  <rect class="good-box" x="502" y="394" width="34" height="2" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="519" y="388" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">0.02</text>
  <text class="muted" x="519" y="410" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">t3</text>
  <rect class="good-box" x="550" y="394" width="34" height="2" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="567" y="388" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">0.01</text>
  <text class="muted" x="567" y="410" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">t4</text>
  <rect class="good-box" x="598" y="394" width="34" height="2" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="615" y="388" fill="#14532d" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">0.00</text>
  <text class="muted" x="615" y="410" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">t5</text>
  <path class="edge-line" d="M390,396 H616" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="54" y="428" fill="#526173" font-family="system-ui, sans-serif" font-size="10.8">Lower temperature makes an answer more repeatable. The most likely continuation can still be wrong.</text>
  <rect class="card-box" x="36" y="448" width="648" height="150" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="474" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">top_p = 0.70 keeps the smallest prefix whose cumulative mass reaches 0.70</text>
  <rect class="good-box" x="54" y="488" width="130" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="119" y="508" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">p = 0.45</text>
  <text class="good-text" x="119" y="524" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">cumulative 0.45</text>
  <text class="good-text" x="119" y="538" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">below 0.70</text>
  <rect class="good-box" x="196" y="488" width="130" height="56" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="261" y="508" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">p = 0.30</text>
  <text class="good-text" x="261" y="524" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">cumulative 0.75</text>
  <text class="good-text" x="261" y="538" fill="#14532d" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">reaches 0.70</text>
  <rect class="dead-box" x="338" y="488" width="130" height="56" rx="8" fill="#e8ecf3" stroke="#64748b" stroke-width="2" />
  <text class="dead-text" x="403" y="508" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">p = 0.15</text>
  <text class="dead-text" x="403" y="524" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">cumulative 0.90</text>
  <text class="dead-text" x="403" y="538" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">dropped</text>
  <rect class="dead-box" x="480" y="488" width="130" height="56" rx="8" fill="#e8ecf3" stroke="#64748b" stroke-width="2" />
  <text class="dead-text" x="545" y="508" fill="#8a97a8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" text-anchor="middle">p = 0.10</text>
  <text class="dead-text" x="545" y="524" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">cumulative 1.00</text>
  <text class="dead-text" x="545" y="538" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">dropped</text>
  <path class="accent-line" d="M330,482 V550" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 4" />
  <text class="accent-text" x="330" y="564" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">the cut</text>
  <text class="muted" x="54" y="584" fill="#526173" font-family="system-ui, sans-serif" font-size="10.8">Two candidates kept. The retained mass can exceed top_p, because the filter keeps whole candidates.</text>
  <rect class="accent-box" x="36" y="610" width="648" height="32" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="54" y="631" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Both controls reshape the same candidate set. Move one at a time, or the result cannot be read.</text>
</svg>
