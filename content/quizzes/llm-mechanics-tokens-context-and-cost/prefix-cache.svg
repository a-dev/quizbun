<svg xmlns="http://www.w3.org/2000/svg" width="720" height="672" viewBox="0 0 720 672">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
      --alt-fill: #f3e8ff;
      --alt-edge: #9333ea;
      --alt-text: #581c87;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
        --alt-fill: #2e1d40;
        --alt-edge: #c084fc;
        --alt-text: #e9d5ff;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .alt-text { fill: var(--alt-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .alt-box { fill: var(--alt-fill); stroke: var(--alt-edge); }
    .card-box { fill: var(--card); stroke: var(--edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-line { stroke: var(--accent-edge); }
    .good-line { stroke: var(--good-edge); }
  </style>
  <rect class="panel" width="720" height="672" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">The cache matches a prefix, byte for byte</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Prompt caching reuses work for a matching opening. Meaning never enters into it.</text>
  <rect class="card-box" x="36" y="88" width="648" height="202" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Where the variable part sits decides how much can be reused</text>
  <text class="accent-text" x="54" y="132" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Cache-hostile layout</text>
  <rect class="accent-box" x="54" y="140" width="96" height="34" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="102.0" y="162" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.8" font-weight="700" text-anchor="middle">request id</text>
  <rect class="info-box" x="150" y="140" width="260" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="280.0" y="162" fill="#172554" font-family="system-ui, sans-serif" font-size="9.8" font-weight="700" text-anchor="middle">stable instructions</text>
  <rect class="info-box" x="410" y="140" width="150" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="485.0" y="162" fill="#172554" font-family="system-ui, sans-serif" font-size="9.8" font-weight="700" text-anchor="middle">examples</text>
  <rect class="alt-box" x="560" y="140" width="106" height="34" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" />
  <text class="alt-text" x="613.0" y="162" fill="#581c87" font-family="system-ui, sans-serif" font-size="9.8" font-weight="700" text-anchor="middle">user data</text>
  <path class="accent-line" d="M54,178 V186" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="accent-text" x="66" y="190" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">The prefix diverges at the first token, so nothing before it can be reused.</text>
  <text class="good-text" x="54" y="214" fill="#14532d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Cache-friendly layout</text>
  <rect class="info-box" x="54" y="222" width="260" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="184.0" y="244" fill="#172554" font-family="system-ui, sans-serif" font-size="9.8" font-weight="700" text-anchor="middle">stable instructions</text>
  <rect class="info-box" x="314" y="222" width="150" height="34" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="389.0" y="244" fill="#172554" font-family="system-ui, sans-serif" font-size="9.8" font-weight="700" text-anchor="middle">examples</text>
  <rect class="accent-box" x="464" y="222" width="96" height="34" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="512.0" y="244" fill="#9a3412" font-family="system-ui, sans-serif" font-size="9.8" font-weight="700" text-anchor="middle">request id</text>
  <rect class="alt-box" x="560" y="222" width="106" height="34" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="2" />
  <text class="alt-text" x="613.0" y="244" fill="#581c87" font-family="system-ui, sans-serif" font-size="9.8" font-weight="700" text-anchor="middle">user data</text>
  <path class="good-line" d="M54,260 v8 H464 v-8" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text class="good-text" x="66" y="282" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">410 tokens of shared prefix, matched byte for byte on every later request.</text>
  <rect class="card-box" x="36" y="302" width="648" height="176" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="328" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">What a cache hit is, and what it never is</text>
  <rect class="good-box" x="54" y="342" width="296" height="86" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="70" y="362" fill="#14532d" font-family="system-ui, sans-serif" font-size="12" font-weight="700">A hit is</text>
  <text class="good-text" x="70" y="380" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.2">· a byte-identical opening to an earlier prompt</text>
  <text class="good-text" x="70" y="396" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.2">· reported back in the response usage data</text>
  <text class="good-text" x="70" y="412" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.2">· cheaper and faster on the eligible input</text>
  <rect class="accent-box" x="370" y="342" width="296" height="86" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="386" y="362" fill="#9a3412" font-family="system-ui, sans-serif" font-size="12" font-weight="700">A hit is not</text>
  <text class="accent-text" x="386" y="380" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.2">· a semantic match — similar meaning misses</text>
  <text class="accent-text" x="386" y="396" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.2">· free output — generated tokens still bill</text>
  <text class="accent-text" x="386" y="412" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.2">· learning — no weight moves, no memory forms</text>
  <rect class="info-box" x="54" y="440" width="612" height="24" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="info-text" x="64" y="456" fill="#172554" font-family="system-ui, sans-serif" font-size="9.9" font-weight="700">OpenAI turns automatic caching on from 1,024 prompt tokens. Repetition cannot make a shorter prompt eligible.</text>
  <rect class="card-box" x="36" y="490" width="648" height="126" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="516" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">Ten requests, 10,000 input and 1,000 output tokens each</text>
  <rect class="accent-box" x="54" y="526" width="430" height="24" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="64" y="543" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">1 uncached request</text>
  <text class="accent-text" x="210" y="543" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">10,000 × $2.00 / 1M</text>
  <text class="accent-text" x="474" y="543" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="end">$0.020</text>
  <rect class="good-box" x="54" y="552" width="430" height="24" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="64" y="569" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">9 cached requests</text>
  <text class="good-text" x="210" y="569" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">90,000 × $0.20 / 1M</text>
  <text class="good-text" x="474" y="569" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="end">$0.018</text>
  <rect class="info-box" x="54" y="578" width="430" height="24" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="64" y="595" fill="#172554" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">10 outputs</text>
  <text class="info-text" x="210" y="595" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">10,000 × $8.00 / 1M</text>
  <text class="info-text" x="474" y="595" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" text-anchor="end">$0.080</text>
  <rect class="good-box" x="500" y="526" width="166" height="76" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="583" y="560" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22" font-weight="700" text-anchor="middle">$0.118</text>
  <text class="good-text" x="583" y="582" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">for the whole workload</text>
  <rect class="accent-box" x="36" y="628" width="648" height="32" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="54" y="649" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">One character changed near the start costs more reuse than the same character changed near the end.</text>
</svg>
