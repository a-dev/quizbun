<svg xmlns="http://www.w3.org/2000/svg" width="720" height="640" viewBox="0 0 720 640">
  <style>
    /* An &lt;img&gt;-embedded SVG cannot see the page's `data-theme`, but it does
       inherit the embedding document's `color-scheme`, so `prefers-color-scheme`
       tracks the site theme including an explicit toggle. The presentation
       attributes below stay as the light fallback for renderers without CSS. */
    svg {
      --panel: #f5f7fb;
      --title: #20242c;
      --muted: #526173;
      --edge: #64748b;
      --card: #ffffff;
      --dead-fill: #e8ecf3;
      --dead-text: #8a97a8;
      --info-fill: #dbeafe;
      --info-edge: #2563eb;
      --info-text: #172554;
      --accent-fill: #ffedd5;
      --accent-edge: #c2410c;
      --accent-text: #9a3412;
      --good-fill: #dcfce7;
      --good-edge: #16a34a;
      --good-text: #14532d;
    }

    @media (prefers-color-scheme: dark) {
      svg {
        --panel: #1a1f27;
        --title: #e6eaf2;
        --muted: #9aa8bd;
        --edge: #8b9bb4;
        --card: #252b35;
        --dead-fill: #20262e;
        --dead-text: #6b7787;
        --info-fill: #1e3a5f;
        --info-edge: #60a5fa;
        --info-text: #dbeafe;
        --accent-fill: #3a2416;
        --accent-edge: #fb923c;
        --accent-text: #fdba74;
        --good-fill: #14321f;
        --good-edge: #4ade80;
        --good-text: #bbf7d0;
      }
    }

    .panel { fill: var(--panel); }
    .title { fill: var(--title); }
    .muted { fill: var(--muted); }
    .dead-text { fill: var(--dead-text); }
    .info-text { fill: var(--info-text); }
    .accent-text { fill: var(--accent-text); }
    .good-text { fill: var(--good-text); }
    .accent-box { fill: var(--accent-fill); stroke: var(--accent-edge); }
    .card-box { fill: var(--card); stroke: var(--edge); }
    .dead-box { fill: var(--dead-fill); stroke: var(--edge); }
    .good-box { fill: var(--good-fill); stroke: var(--good-edge); }
    .info-box { fill: var(--info-fill); stroke: var(--info-edge); }
    .accent-line { stroke: var(--accent-edge); }
    .edge-line { stroke: var(--edge); }
    .good-line { stroke: var(--good-edge); }
  </style>
  <rect class="panel" width="720" height="640" rx="20" fill="#f5f7fb" />

  <text class="title" x="36" y="42" fill="#20242c" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Streaming changes when you see it, not what it costs</text>
  <text class="muted" x="36" y="66" fill="#526173" font-family="system-ui, sans-serif" font-size="14">Time to first token and throughput are two numbers. Total latency is mostly output length.</text>
  <rect class="card-box" x="36" y="88" width="648" height="164" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="114" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">One traced response: first token at 1.0 s, token 101 at 6.0 s</text>
  <rect class="accent-box" x="54" y="132" width="87.42857142857144" height="30" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="97.71428571428572" y="152" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">TTFT 1.0 s</text>
  <rect class="good-box" x="141.42857142857144" y="132" width="437.1428571428571" height="30" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="360.0" y="152" fill="#14532d" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">100 inter-token intervals, 5.0 s</text>
  <path class="edge-line" d="M54,176 H666" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path class="edge-line" d="M54.0,176 V182" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="54.0" y="194" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">0 s</text>
  <path class="edge-line" d="M141.4,176 V182" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="141.42857142857144" y="194" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">1 s</text>
  <path class="edge-line" d="M228.9,176 V182" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="228.85714285714286" y="194" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">2 s</text>
  <path class="edge-line" d="M316.3,176 V182" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="316.2857142857143" y="194" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">3 s</text>
  <path class="edge-line" d="M403.7,176 V182" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="403.7142857142857" y="194" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">4 s</text>
  <path class="edge-line" d="M491.1,176 V182" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="491.14285714285717" y="194" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">5 s</text>
  <path class="edge-line" d="M578.6,176 V182" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="578.5714285714286" y="194" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">6 s</text>
  <path class="edge-line" d="M666.0,176 V182" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <text class="muted" x="666.0" y="194" fill="#526173" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">7 s</text>
  <path class="accent-line" d="M141.4,128 V176" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" />
  <path class="good-line" d="M578.6,128 V176" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 4" />
  <text class="title" x="54" y="218" fill="#20242c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">100 intervals / 5.0 s = 20 tokens per second</text>
  <text class="muted" x="54" y="240" fill="#526173" font-family="system-ui, sans-serif" font-size="10.8">Time to first token measures the wait before anything appears. Throughput measures everything after it.</text>
  <rect class="card-box" x="36" y="264" width="648" height="182" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="290" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">A stream is a sequence of events, not a sequence of words</text>
  <rect class="info-box" x="54" y="304" width="300" height="19" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="62" y="318" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">event: message_start</text>
  <rect class="info-box" x="54" y="326" width="300" height="19" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="62" y="340" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">delta: "The rate li"</text>
  <rect class="info-box" x="54" y="348" width="300" height="19" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="62" y="362" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">delta: "mit resets at 12:0"</text>
  <rect class="info-box" x="54" y="370" width="300" height="19" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <text class="info-text" x="62" y="384" fill="#172554" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">delta: "0 UTC."</text>
  <rect class="good-box" x="54" y="392" width="300" height="19" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="good-text" x="62" y="406" fill="#14532d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">event: message_stop</text>
  <rect class="accent-box" x="54" y="414" width="300" height="19" rx="5" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5" />
  <text class="accent-text" x="62" y="428" fill="#9a3412" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="700">event: error / refusal</text>
  <rect class="card-box" x="386" y="304" width="280" height="128" rx="10" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="402" y="326" fill="#20242c" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">What the client has to do</text>
  <text class="muted" x="402" y="346" fill="#526173" font-family="system-ui, sans-serif" font-size="10.2">· Assemble the deltas, a chunk can</text>
  <text class="muted" x="410" y="359" fill="#526173" font-family="system-ui, sans-serif" font-size="10.2">end mid-word, mid-token, mid-JSON.</text>
  <text class="muted" x="402" y="376" fill="#526173" font-family="system-ui, sans-serif" font-size="10.2">· Branch on the event type, stopping,</text>
  <text class="muted" x="410" y="389" fill="#526173" font-family="system-ui, sans-serif" font-size="10.2">refusing and failing are not text.</text>
  <text class="muted" x="402" y="406" fill="#526173" font-family="system-ui, sans-serif" font-size="10.2">· Never render a chunk as if it were</text>
  <text class="muted" x="410" y="419" fill="#526173" font-family="system-ui, sans-serif" font-size="10.2">the finished answer.</text>
  <rect class="card-box" x="36" y="458" width="648" height="126" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="2" />
  <text class="title" x="54" y="484" fill="#20242c" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">What streaming moves, and what it leaves alone</text>
  <rect class="good-box" x="54" y="496" width="196" height="44" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="good-text" x="152" y="514" fill="#14532d" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Perceived wait drops</text>
  <text class="good-text" x="152" y="530" fill="#14532d" font-family="system-ui, sans-serif" font-size="10.2" text-anchor="middle">output is visible sooner</text>
  <rect class="dead-box" x="262" y="496" width="196" height="44" rx="10" fill="#e8ecf3" stroke="#64748b" stroke-width="2" />
  <text class="dead-text" x="360" y="514" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Billable tokens: unchanged</text>
  <text class="dead-text" x="360" y="530" fill="#8a97a8" font-family="system-ui, sans-serif" font-size="10.2" text-anchor="middle">same tokens, same price</text>
  <rect class="accent-box" x="470" y="496" width="196" height="44" rx="10" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="568" y="514" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">Partial output is awkward</text>
  <text class="accent-text" x="568" y="530" fill="#9a3412" font-family="system-ui, sans-serif" font-size="10.2" text-anchor="middle">moderation, parsing, rollback</text>
  <text class="muted" x="54" y="566" fill="#526173" font-family="system-ui, sans-serif" font-size="10.5">The lever that cuts total latency is generating fewer tokens: roughly halve the output, roughly halve the time.</text>
  <rect class="accent-box" x="36" y="596" width="648" height="32" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
  <text class="accent-text" x="54" y="617" fill="#9a3412" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700">Streaming moves when the content arrives. It does not move how much content there is.</text>
</svg>
